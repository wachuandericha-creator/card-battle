<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>わちゅえりカードゲーム</title>
  <style>
    :root {
      --hand-scale: 0.74;
      --card-ratio: 204 / 300;
      --bg: #12100e;
      --ink: #2a2118;
      --cream: #f4ead7;
      --gold: #e4b15a;
      --hp: #d85a4a;
      --hp-bg: #3a2422;
      --block: #7eb0e6;
      --attack: #e07a55;
      --guard: #6f9ed4;
      --muted: #b7a898;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 18%, #3a2c24 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #1c1612 0%, #12100e 70%);
    }
    button, body { -webkit-user-select: none; user-select: none; }
    .battle-screen {
      height: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(0, 12.5%);
      grid-template-rows: auto minmax(0, 2.2fr) auto minmax(0, 1.3fr);
      grid-template-areas:
        "gear hud log"
        "gear arena log"
        "gear energy log"
        "gear hand log";
      padding: 10px 0 0;
      row-gap: 16px;
      overflow: visible;
    }
    .battle-screen.no-log {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "gear hud"
        "gear arena"
        "gear energy"
        "gear hand";
    }
    .game { display: contents; }
    .hud-top { grid-area: hud; min-width: 0; overflow: hidden; }
    .battle-bands {
      grid-area: arena;
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1.4fr) minmax(0, 0.8fr);
      row-gap: 16px;
      border-radius: 12px;
      overflow: visible;
      background:
        linear-gradient(180deg, rgba(10, 8, 7, 0.28) 0%, rgba(10, 8, 7, 0.18) 42%, rgba(10, 8, 7, 0.62) 100%),
        var(--dungeon-art, url("dungeon-bg.jpg")) center 38% / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(228, 177, 90, 0.22);
      isolation: isolate;
    }
    .stage { min-width: 0; overflow: visible; position: relative; z-index: 3; }
    .play-row { min-width: 0; overflow: hidden; position: relative; z-index: 2; }
    .energy-band { grid-area: energy; min-width: 0; overflow: visible; z-index: 1; }
    .handbar { grid-area: hand; min-width: 0; overflow: visible; z-index: 5; }
    .gear-rail { grid-area: gear; min-width: 0; overflow: hidden; }
    .battle-log { grid-area: log; min-width: 0; overflow: auto; }
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 0 18px 8px;
      border-bottom: 1px solid rgba(228, 177, 90, 0.35);
    }
    .dungeon { display: flex; align-items: baseline; gap: 16px; }
    .dungeon-name {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--cream);
    }
    .dungeon-progress {
      color: var(--gold);
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .status-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      width: max-content;
    }
    .status-stars {
      color: var(--gold);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      white-space: nowrap;
    }
    .hud-actions { display: flex; gap: 8px; }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .turn { color: var(--gold); font-weight: 700; }
    .chip b { font-size: 20px; }
    .bar {
      height: 8px;
      width: 88px;
      border-radius: 99px;
      background: var(--hp-bg);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--hp); }
    .block-num { color: var(--block); }
    .energy-pips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
    }
    .pip.on { background: var(--gold); }
    .next-energy, .rules, .logline { color: var(--muted); font-size: 13px; }
    .rules { margin: 0; }
    .note { min-height: 1.1em; color: #f0c7a2; font-size: 13px; }
    .stage {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
      margin: 0;
      padding: 8px 10px 0;
      background: transparent;
      overflow: visible;
    }
    .enemy-field { position: relative; display: flex; align-items: stretch; gap: 12px; width: 100%; flex: 1 1 auto; min-height: 0; overflow: visible; }
    .enemy-field { --hero-zoom: 1.34; }
    .hero-shoulder {
      position: absolute;
      left: 1%;
      bottom: -6%;
      z-index: 4;
      height: calc(var(--hero-zoom) * 100%);
      width: auto;
      max-width: min(52%, 600px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
      filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.55));
    }
    .hero-body {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: auto;
      height: 100%;
      max-height: calc(100% - 76px);
      aspect-ratio: 862 / 1146;
    }
    .hero-fig {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: none;
    }
    /* 名前と体力の板。暗い漆塗りに金の縁。左の帯は自分が青、敵が赤。 */
    .battle-plate {
      --plate-accent: var(--gold);
      position: absolute;
      z-index: 6;
      box-sizing: border-box;
      width: min(300px, 40%);
      padding: 8px 12px 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(228, 177, 90, 0.7);
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(255, 236, 200, 0.12), transparent 55%),
        linear-gradient(180deg, rgba(62, 46, 34, 0.97), rgba(26, 18, 14, 0.98));
      color: var(--cream);
      box-shadow:
        0 0 0 3px rgba(18, 12, 9, 0.92),
        0 0 0 4px rgba(228, 177, 90, 0.42),
        0 14px 24px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 236, 200, 0.22),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .battle-plate::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, #fff 0%, var(--plate-accent) 30%, var(--plate-accent) 70%, rgba(0, 0, 0, 0.4) 100%);
      box-shadow: 0 0 10px var(--plate-accent);
    }
    .battle-plate::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 9px;
      border: 1px solid rgba(228, 177, 90, 0.18);
      pointer-events: none;
    }
    .battle-plate.hero-plate { --plate-accent: #7eb6ff; }
    .battle-plate.foe-plate { --plate-accent: #ff5c4a; }
    .battle-plate .hint { pointer-events: auto; }
    .hero-shoulder .hero-plate,
    .enemy-main .foe-plate {
      position: relative;
      left: auto;
      right: auto;
      top: auto;
      bottom: auto;
      transform: none;
      flex: 0 0 auto;
      margin-top: 6px;
    }
    .hero-shoulder .hero-plate { width: min(220px, 96%); }
    .hero-body .hero-guard { inset: -12% -18% 8%; }
    .foe-plate[data-rank="雑魚"] { width: min(200px, 100%); }
    .foe-plate[data-rank="普通"] { width: min(240px, 100%); }
    .foe-plate[data-rank="強敵"] { width: min(280px, 100%); }
    .battle-plate h2 {
      position: relative;
      margin: 0 0 4px;
      padding: 0 0 3px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-align: left;
      color: #fff6e6;
      text-shadow: 0 1px 0 #000, 0 0 12px rgba(228, 177, 90, 0.25);
      border-bottom: 1px solid rgba(228, 177, 90, 0.35);
    }
    .battle-plate h2 .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .battle-plate h2 .tag {
      flex: 0 0 auto;
      padding: 1px 7px 2px;
      border-radius: 4px;
      border: 1px solid rgba(255, 92, 74, 0.8);
      background: linear-gradient(180deg, rgba(255, 92, 74, 0.35), rgba(120, 20, 10, 0.5));
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #ffd9d2;
      text-shadow: none;
    }
    .battle-plate .meters { width: 100%; }
    .battle-plate .meter.hp {
      position: relative;
      height: 20px;
      border-radius: 6px;
      background: linear-gradient(180deg, #24120f, #3a2220);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(228, 177, 90, 0.35), 0 1px 0 rgba(255, 236, 200, 0.08);
      overflow: hidden;
    }
    .battle-plate .meter.hp > span {
      position: relative;
      z-index: 1;
      border-radius: 5px 3px 3px 5px;
      background: linear-gradient(180deg, #ff9a86 0%, #e8533f 42%, #b02819 100%);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 10px rgba(255, 90, 60, 0.45);
    }
    .battle-plate.low .meter.hp > span {
      background: linear-gradient(180deg, #ffb4a0 0%, #ff5a3a 42%, #c01c0c 100%);
      animation: hp-low 1.1s ease-in-out infinite;
    }
    /* 体力バーの目盛りは10HPごと。自分は限界100（初期30なら3つ分、伸びる余地が空く）。敵は自分の最大HPいっぱい */
    .battle-plate .meter.hp .hp-max {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 5px;
      background: rgba(92, 42, 36, 0.72);
      pointer-events: none;
    }
    .battle-plate .meter.hp .hp-ticks {
      position: absolute;
      inset: 0;
      z-index: 3;
      background-image: linear-gradient(90deg, transparent calc(100% - 1.5px), rgba(255, 236, 210, 0.38) calc(100% - 1.5px), rgba(0, 0, 0, 0.5) 100%);
      background-size: calc(100% * 10 / var(--cap, 100)) 100%;
      background-repeat: repeat-x;
      pointer-events: none;
    }
    .battle-plate .meter.hp::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 2px;
      z-index: 2;
      height: 42%;
      border-radius: 4px 4px 2px 2px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.04));
      pointer-events: none;
    }
    .battle-plate .shield-row { position: relative; height: 14px; margin-bottom: 5px; border-radius: 6px; background: rgba(60, 110, 170, 0.18); box-shadow: inset 0 0 0 1px rgba(126, 182, 255, 0.35); }
    .battle-plate .shield-row .meter.shield {
      height: 100%;
      border-radius: 6px;
      background: transparent;
      overflow: hidden;
    }
    .battle-plate .meter.shield > span {
      border-radius: 6px;
      background: linear-gradient(180deg, #e8f4ff 0%, #8cc0ff 45%, #3f7ccc 100%);
      box-shadow: 0 0 12px rgba(126, 182, 255, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .battle-plate .shield-line {
      position: absolute;
      inset: 0 auto auto 6px;
      height: 14px;
      margin: 0;
      display: flex;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #f2f8ff;
      text-shadow: 0 1px 2px #000, 0 0 6px rgba(0, 0, 0, 0.9);
    }
    /* シールドの札：板の右上に大きく。盾の形の青い札に白い数字 */
    .battle-plate.shielded { box-shadow: 0 0 0 3px rgba(18, 12, 9, 0.92), 0 0 0 4px rgba(126, 182, 255, 0.75), 0 0 22px rgba(126, 182, 255, 0.45), 0 14px 24px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(220, 238, 255, 0.3), inset 0 -1px 0 rgba(0, 0, 0, 0.6); }
    /* パリィ中：体力バーを無敵っぽく（次の攻撃を受けない） */
    .battle-plate.parried {
      box-shadow: 0 0 0 3px rgba(18, 12, 9, 0.92), 0 0 0 4px rgba(170, 220, 255, 0.95), 0 0 28px rgba(120, 200, 255, 0.7), 0 14px 24px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(230, 245, 255, 0.45), inset 0 -1px 0 rgba(0, 0, 0, 0.6);
    }
    .battle-plate.parried.shielded {
      box-shadow: 0 0 0 3px rgba(18, 12, 9, 0.92), 0 0 0 4px rgba(170, 220, 255, 0.95), 0 0 0 6px rgba(126, 182, 255, 0.45), 0 0 28px rgba(120, 200, 255, 0.75), 0 14px 24px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(230, 245, 255, 0.45), inset 0 -1px 0 rgba(0, 0, 0, 0.6);
    }
    .battle-plate.parried .meter.hp {
      background: linear-gradient(180deg, #1a2838, #2a4058);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.65), 0 0 0 2px rgba(180, 230, 255, 0.9), 0 0 16px rgba(120, 200, 255, 0.75);
    }
    .battle-plate.parried .meter.hp .hp-max {
      background: rgba(40, 70, 100, 0.55);
    }
    .battle-plate.parried .meter.hp > span {
      background: linear-gradient(180deg, #ffffff 0%, #c8e8ff 28%, #6eb4ff 58%, #3a78d0 100%);
      box-shadow: inset 0 -2px 0 rgba(20, 50, 90, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 0 14px rgba(140, 210, 255, 0.95);
      animation: parry-invuln 1.35s ease-in-out infinite;
    }
    .battle-plate.parried.low .meter.hp > span {
      background: linear-gradient(180deg, #ffffff 0%, #c8e8ff 28%, #6eb4ff 58%, #3a78d0 100%);
      animation: parry-invuln 1.35s ease-in-out infinite;
    }
    .battle-plate.parried .meter.hp::before {
      content: "パリィ";
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      transform: translate(-50%, -50%);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.28em;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(80, 160, 255, 0.95), 0 1px 0 #1a3a60, 0 0 12px rgba(180, 230, 255, 0.9);
      pointer-events: none;
      white-space: nowrap;
    }
    .battle-plate.parried .hp-line .lbl .ico {
      color: #9fd0ff;
      filter: drop-shadow(0 0 5px rgba(120, 190, 255, 0.85));
    }
    .battle-plate.parried .hp-line b {
      color: #e8f6ff;
      text-shadow: 0 1px 0 #000, 0 0 12px rgba(140, 200, 255, 0.55);
    }
    @keyframes parry-invuln {
      0%, 100% { filter: brightness(1) saturate(1); box-shadow: inset 0 -2px 0 rgba(20, 50, 90, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 0 14px rgba(140, 210, 255, 0.85); }
      50% { filter: brightness(1.28) saturate(1.15); box-shadow: inset 0 -2px 0 rgba(20, 50, 90, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 0 22px rgba(200, 235, 255, 1); }
    }
    .battle-plate .shield-badge {
      position: absolute;
      right: -14px;
      top: -18px;
      width: 52px;
      height: 58px;
      z-index: 2;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 10px rgba(126, 182, 255, 0.7));
    }
    .battle-plate .shield-badge .plate-shield {
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 0, 100% 14%, 100% 52%, 86% 78%, 50% 100%, 14% 78%, 0 52%, 0 14%);
      background: linear-gradient(180deg, #eaf5ff 0%, #8cc0ff 30%, #3b78c8 70%, #1f4b86 100%);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.55);
    }
    .battle-plate .shield-badge .plate-shield::after {
      content: "";
      position: absolute;
      inset: 4px;
      clip-path: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0.18) 100%);
    }
    .battle-plate .shield-badge b {
      position: relative;
      z-index: 1;
      margin-top: -4px;
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      text-shadow: 0 2px 0 #1f3f6e, 0 0 8px rgba(0, 40, 90, 0.9);
      letter-spacing: 0;
    }
    .battle-plate .hp-line {
      position: static;
      height: auto;
      margin: 4px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: #d9c39a;
      text-shadow: 0 1px 0 #000;
    }
    .battle-plate .hp-line .lbl { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; }
    .battle-plate .hp-line .lbl .ico { width: 13px; height: 13px; color: #ff6b5a; filter: drop-shadow(0 0 4px rgba(255, 90, 60, 0.6)); }
    .battle-plate .hp-line .num { display: inline-flex; align-items: baseline; gap: 4px; letter-spacing: 0.02em; }
    .battle-plate .hp-line b {
      font-size: 24px;
      line-height: 1;
      font-weight: 800;
      color: #fff6e6;
      text-shadow: 0 1px 0 #000, 0 0 10px rgba(255, 150, 120, 0.25);
      font-variant-numeric: tabular-nums;
    }
    .battle-plate.low .hp-line b { color: #ffb0a0; }
    .battle-plate .hp-line small { font-size: 12px; color: #c9b38c; letter-spacing: 0.02em; }
    .battle-plate .plate-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .battle-plate .plate-badges:empty { display: none; }
    /* 状態のアイコン札：丸い暗地に色つきアイコン。重なるものは右に数字 */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 32px;
      padding: 0 8px 0 4px;
      border-radius: 999px;
      background: rgba(12, 8, 6, 0.78);
      border: 1px solid rgba(255, 236, 200, 0.28);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      pointer-events: auto;
      cursor: default;
    }
    .status-chip svg { width: 25px; height: 25px; display: block; flex: 0 0 auto; filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.8)); }
    .status-chip b { font-size: 17px; letter-spacing: 0; text-shadow: 0 1px 0 #000; }
    .status-chip.hint, .status-chip.hint b { text-decoration: none; border-bottom: 0; }
    .status-chip:has(> b) { padding-right: 8px; }
    .status-chip.poison { border-color: rgba(200, 140, 255, 0.7); box-shadow: 0 0 10px rgba(160, 90, 230, 0.55), 0 2px 6px rgba(0, 0, 0, 0.55); }
    .status-chip.poison b { color: #e6c6ff; }
    .status-chip.burn { border-color: rgba(255, 170, 80, 0.75); box-shadow: 0 0 10px rgba(255, 120, 40, 0.6), 0 2px 6px rgba(0, 0, 0, 0.55); }
    .status-chip.burn b { color: #ffd9a8; }
    .status-chip.parry { border-color: rgba(140, 190, 255, 0.8); box-shadow: 0 0 10px rgba(110, 170, 255, 0.6), 0 2px 6px rgba(0, 0, 0, 0.55); }
    .status-chip.parry b { color: #d6ebff; }
    .status-chip.focus { border-color: rgba(255, 214, 122, 0.8); box-shadow: 0 0 10px rgba(255, 200, 90, 0.55), 0 2px 6px rgba(0, 0, 0, 0.55); }
    .status-chip.focus b { color: #ffe9b0; }
    .battle-plate .poison-mark { display: inline-block; margin-top: 0; }
    @keyframes hp-low {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.35); }
    }
    .field-note {
      position: absolute;
      left: 50%;
      top: 8px;
      z-index: 7;
      margin: 0;
      transform: translateX(-50%);
      color: #f0c7a2;
      font-size: 16px;
      font-weight: 800;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.7);
    }
    .field-note.warn {
      color: #ffe7a8;
      font-size: 22px;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8), 0 0 14px rgba(228, 177, 90, 0.55);
    }
    .hero-shoulder.hurt { animation: shake 0.5s linear; }
    .hero-shoulder.hurt.fatal { animation: fatal-shake 1.35s linear; }
    .battle-screen.fatal .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 28% 78%, rgba(180, 12, 8, 0.18), transparent 42%),
        linear-gradient(180deg, rgba(40, 0, 0, 0.08), rgba(12, 0, 0, 0.55));
      animation: fatal-veil 2.8s ease-out forwards;
    }

    /* 敵への斬撃。.cut が1回分。dir-0: 右上→左下、dir-1: 左上→右下、dir-2: 上→下 */

      --ang: -45deg;
      --dx: -0.72;
      --dy: 0.72;
      --len: calc(270px + var(--pow, 0.35) * 190px);
      --thick: calc(18px + var(--pow, 0.35) * 22px);
      --glow: calc(8px + var(--pow, 0.35) * 14px);
      position: absolute;
      left: 50%;
      top: 46%;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 4;

    .sprite .cut.dir-0 { --ang: -45deg; --dx: -0.72; --dy: 0.72; }
    .sprite .cut.dir-1 { --ang: 45deg; --dx: 0.72; --dy: 0.72; }
    .sprite .cut.dir-2 { --ang: 90deg; --dx: 0; --dy: 1; }
    .sprite .cut > i { position: absolute; left: 0; top: 0; display: block; opacity: 0; }
    .sprite .cut .blade,
    .sprite .cut .trail {
      width: var(--len);
      height: var(--thick);
      margin: calc(var(--thick) * -0.5) 0 0 calc(var(--len) * -0.5);
      background: linear-gradient(#fff 0%, #fff8f2 52%, #ffb08a 78%, #d4261a 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
      clip-path: polygon(0 50%, 6% 8%, 50% 0, 94% 8%, 100% 50%, 94% 92%, 50% 100%, 6% 92%);

    }
    .sprite .cut .trail {
      height: calc(var(--thick) * 0.42);
      margin-top: calc(var(--thick) * -0.21);
      width: calc(var(--len) * 1.18);
      margin-left: calc(var(--len) * -0.59);
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, #ffe9dc 40%, #ff6b4a 100%);
      filter: blur(1px) drop-shadow(0 0 var(--glow) rgba(255, 120, 90, 0.9));
    }
    .sprite .cut .burst {
      width: calc(60px + var(--pow, 0.35) * 80px);
      height: calc(60px + var(--pow, 0.35) * 80px);
      margin: calc((60px + var(--pow, 0.35) * 80px) * -0.5) 0 0 calc((60px + var(--pow, 0.35) * 80px) * -0.5);

      background: radial-gradient(circle, #fff 0%, #fff4e6 28%, rgba(255, 150, 90, 0.75) 50%, rgba(212, 38, 26, 0) 72%);

    .sprite .cut .spark {
      width: calc(10px + var(--pow, 0.35) * 8px);
      height: 3px;
      margin: -1.5px 0 0 calc((10px + var(--pow, 0.35) * 8px) * -0.5);
      border-radius: 2px;

      filter: drop-shadow(0 0 4px rgba(255, 220, 180, 0.9));

    .sprite.slash .cut .blade { animation: slash-blade calc(0.62s + var(--pow, 0.35) * 0.16s) var(--delay, 0s) cubic-bezier(0.14, 0.76, 0.26, 1) both; }
    .sprite.slash .cut .trail { animation: slash-blade calc(0.62s + var(--pow, 0.35) * 0.16s) calc(var(--delay, 0s) + 0.05s) cubic-bezier(0.14, 0.76, 0.26, 1) both; }
    .sprite.slash .cut .burst { animation: slash-burst 0.5s calc(var(--delay, 0s) + 0.1s) ease-out both; }

    .sprite.slash .cut .spark.s1 { --sa: calc(var(--ang) + 90deg); --sd: 1; }
    .sprite.slash .cut .spark.s2 { --sa: calc(var(--ang) - 90deg); --sd: 1; }

      const extra = rollRank(tier);
      route.splice(battleIndex + 1, 0, extra);
      battleTotal = route.length;
    }

    function signed(n) {

      if (value > 0) return `+${value}`;
      if (value < 0) return String(value);

    }

    const GEAR_ITEMS = [

      { id: "flame-sword", name: "フレイムソード", slot: "sword", atk: 2, burnHit: 1, effect: "ATK+2。与えるダメージを通すたび炎上+1", image: "gear-flame-sword.svg?v=2" },

      { id: "buckler", name: "バックラー", slot: "shield", stars: 1, def: 1, effect: "★　DEF+1", image: "gear-buckler.jpg" },

      { id: "eagle-shield", name: "鷲の金盾", slot: "shield", stars: 5, def: 5, statusImmune: true, effect: "★★★★★　DEF+5。状態異常を無視する", image: "gear-eagle-shield.svg?v=2" },

      { id: "chain-attack", name: "連撃の腕輪", slot: "braceletR", effect: "手札に攻撃がないとき、山札から攻撃カードを引く。右にのみ装備できる。", image: "gear-bracelet.jpg" },
      { id: "chain-guard", name: "連守の腕輪", slot: "braceletL", effect: "手札に防御がないとき、山札から防御カードを引く。左にのみ装備できる。", image: "gear-bracelet.jpg" },
      { id: "power-bracelet", name: "力の腕輪", slot: "braceletR", stars: 2, atk: 3, effect: "★★　右手。ATK+3", image: "gear-power-bracelet.svg?v=2" },
      { id: "guard-bracelet", name: "守りの腕輪", slot: "braceletL", stars: 2, def: 3, effect: "★★　左手。DEF+3", image: "gear-guard-bracelet.svg?v=2" },
      { id: "reuse-bracelet", name: "再利用の腕輪", slot: "braceletAny", carryMana: true, effect: "使わなかったマナを次のターンへ持ち越す。持ち越し分はオレンジの一時マナで、使うと空枠を残さず消える", image: "gear-reuse-bracelet.svg?v=2" },

      { id: "minotaur-medal", name: "ミノタウロスのメダル", slot: "medal", effect: "自分の体力が最大の半分以下のあいだ、ATK+2。上に戻ると消える。", image: "gear-medal.jpg", halfAtk: 2 },
      { id: "minotaur-bracelet", name: "ミノタウロスの腕輪", slot: "braceletAny", effect: "左右どちらかの腕輪枠に付けられる。自分のターン開始時に体力が最大の半分以下なら、そのターンのマナが1増える。", image: "gear-bracelet.jpg", halfMana: 1 },

    function emptyGear() {
      return { sword: null, shield: null, braceletR: null, braceletL: null, medal: null, itemL: null, itemR: null, medals: 0 };
    }

    function hpHalf(target) {
      return !!target && target.hp <= target.maxHp / 2;
    }

    function hasGear(id) {
      return ["sword", "shield", "braceletR", "braceletL", "medal"].some((key) => gear[key] && gear[key].id === id);
    }

    function giveGear(item) {
      if (!item) return;
      if (item.slot === "braceletAny") {
        const key = !gear.braceletL ? "braceletL" : !gear.braceletR ? "braceletR" : "braceletL";
        gear[key] = { ...item };
      } else {
        gear[item.slot] = { ...item };
      }
      syncGearStats();
    }

    function needsWeaponReplace(item) {
      return !!(item && item.slot === "sword" && gear && gear.sword);
    }

    function weaponAtk(item) {
      return Number(item && item.atk) || 0;
    }

    function weaponExtra(item) {
      if (!item) return "";
      const bits = [];
      if (Number(item.poisonHit) > 0) bits.push(`アタックで毒+${item.poisonHit}（シールドでも）`);
      if (Number(item.burnHit) > 0) bits.push(`ダメージを通すたび炎上+${item.burnHit}`);
      if (item.ignoreDef) bits.push("敵のDEFを無視");
      return bits.join("。");
    }

    function hasReuseBracelet() {
      return !!(gear && ((gear.braceletL && gear.braceletL.carryMana) || (gear.braceletR && gear.braceletR.carryMana)));
    }

    function hasStatusImmune() {
      return !!(gear && gear.shield && gear.shield.statusImmune);
    }

    function hasReflectDef() {
      return !!(gear && gear.shield && gear.shield.reflectDef);
    }

    function syncEnergyTotal() {
      if (!player) return;
      player.baseEnergy = Math.max(0, Number(player.baseEnergy) || 0);
      player.tempEnergy = Math.max(0, Number(player.tempEnergy) || 0);
      player.baseMax = Math.max(0, Number(player.baseMax) || 0);
      player.energy = player.baseEnergy + player.tempEnergy;
      player.maxEnergy = player.baseMax + player.tempEnergy;
    }

    function spendEnergy(cost) {
      let left = Math.max(0, Number(cost) || 0);
      const fromTemp = Math.min(Math.max(0, Number(player.tempEnergy) || 0), left);
      player.tempEnergy = (Number(player.tempEnergy) || 0) - fromTemp;
      left -= fromTemp;
      player.baseEnergy = Math.max(0, (Number(player.baseEnergy) || 0) - left);
      syncEnergyTotal();
    }

    function refundEnergy(cost) {
      let left = Math.max(0, Number(cost) || 0);
      const room = Math.max(0, (Number(player.baseMax) || 0) - (Number(player.baseEnergy) || 0));
      const toBase = Math.min(room, left);
      player.baseEnergy = (Number(player.baseEnergy) || 0) + toBase;
      left -= toBase;
      if (left > 0) player.tempEnergy = (Number(player.tempEnergy) || 0) + left;
      syncEnergyTotal();
    }

    function weaponChangeText(keep, item) {
      const from = weaponAtk(keep);
      const to = weaponAtk(item);
      const d = to - from;
      const atk = d === 0
        ? `<span class="same">ATKは${signed(from)}のまま</span>`
        : d > 0
          ? `<span class="up">ATKが${signed(from)}から${signed(to)}になる（+${d}）</span>`
          : `<span class="down">ATKが${signed(from)}から${signed(to)}になる（${d}）</span>`;
      const extraKeep = weaponExtra(keep);
      const extraNew = weaponExtra(item);
      let extra = "";
      if (!extraKeep && extraNew) extra = `。新たに「${extraNew}」が付く`;
      else if (extraKeep && !extraNew) extra = `。「${extraKeep}」は無くなる`;
      else if (extraKeep && extraNew && extraKeep !== extraNew) extra = `。効果が「${extraNew}」に変わる`;
      return atk + extra;
    }

    function offerWeapon(item, extra) {
      if (!item || !needsWeaponReplace(item)) return false;
      gearOffer = { item: { ...item }, keep: { ...gear.sword }, source: (extra && extra.source) || "gift", shopIndex: extra && extra.shopIndex, price: extra && extra.price };
      return true;
    }

    function gearSideMarkup(item, label, cls) {
      const picture = item && item.image ? `<img src="${esc(item.image)}" alt="">` : "";
      const extra = weaponExtra(item);
      const stars = item && item.stars > 0 ? "　" + "★".repeat(item.stars) : "";
      return `<div class="side${cls ? " " + cls : ""}"><span>${esc(label)}</span>${picture}<b>${esc(item.name || "")}</b><small>ATK ${signed(weaponAtk(item))}${stars}${extra ? "<br>" + esc(extra) : ""}</small></div>`;
    }

    function gearOfferMarkup() {
      const offer = gearOffer;
      if (!offer) return "";
      const shop = offer.source === "shop" && offer.price != null;
      const yes = shop ? `付け替える（★${offer.price}）` : "付け替える";
      return `<div class="overlay gear-offer"><div class="panel"><h2>武器を付け替える？</h2>
        <p class="gear-offer-lead">${weaponChangeText(offer.keep, offer.item)}</p>
        <div class="gear-compare">${gearSideMarkup(offer.keep, "いまの武器")}<div class="arrow" aria-hidden="true">→</div>${gearSideMarkup(offer.item, "新しい武器", "new")}</div>
        <p>${shop ? `付け替えたときだけ ★${offer.price} 払う。今のままなら払わない。` : "今の武器のままなら、新しい武器は手に入らない。"}</p>
        <div class="gear-offer-actions">
          <button type="button" class="primary" data-action="gear-offer-yes">${esc(yes)}</button>
          <button type="button" data-action="gear-offer-no">今の武器のまま</button>
        </div>
      </div></div>`;
    }

    function paintGearOffer() {
      if (!gearOffer) return;
      root.insertAdjacentHTML("beforeend", gearOfferMarkup());
    }

    function acceptGearOffer() {
      const offer = gearOffer;
      if (!offer) return;
      if (offer.source === "shop") {
        const price = Number(offer.price) || 0;
        const have = Number(meta.stars) || 0;
        if (have < price) return;
        meta.stars = have - price;
        localStorage.setItem(META_KEY, JSON.stringify(meta));
        const slot = shopStock && shopStock[offer.shopIndex];
        if (slot) slot.sold = true;
      }
      giveGear(offer.item);
      if (offer.source === "gift") {
        floorGift = { kind: "gear", gear: { ...offer.item } };
        floorNote = `${offer.item.name}に付け替えた。`;
      }
      if (offer.source === "boss") {
        bossPicks = [];
        rewardPaths = rollPaths();
        rewardStep = "paths";
      }
      gearOffer = null;
      persistSave(true);
      render();
    }

    function declineGearOffer() {
      const offer = gearOffer;
      if (!offer) return;
      gearOffer = null;
      if (offer.source === "gift") {
        floorGift = null;
        floorNote = `${offer.keep.name}のままにした。`;
      }
      if (offer.source === "boss") {
        bossPicks = [];
        rewardPaths = rollPaths();
        rewardStep = "paths";
      }
      persistSave(true);
      render();
    }

    function starterGear() {
      const next = emptyGear();
      next.sword = { ...gearItem("short-sword") };
      next.shield = { ...gearItem("buckler") };
      return next;

    // お店でだけ売る強い武器。ランダムな装備にも、探索や祝福にも出ない。
    const SHOP_GEAR = [
      { id: "dragon-fang", name: "竜牙の大剣", slot: "sword", stars: 3, atk: 4, effect: "★★★　ATK+4", image: "gear-dragon-fang.jpg?v=1", shopOnly: true },
      { id: "inferno-blade", name: "業火の剣", slot: "sword", stars: 3, atk: 3, burnHit: 1, effect: "★★★　ATK+3。攻撃が相手に当たるたび、相手を炎上+1", image: "gear-inferno-blade.jpg?v=1", shopOnly: true },
    ];

    function gearItem(id) {
      return GEAR_ITEMS.find((item) => item.id === id) || BOSS_GEAR.find((item) => item.id === id) || SHOP_GEAR.find((item) => item.id === id) || null;
    }

    function normalizeGear(data) {
      const next = emptyGear();
      if (!data) return next;
      for (const key of ["sword", "shield", "braceletR", "braceletL", "medal", "itemL", "itemR"]) {
        if (key === "itemL" || key === "itemR") {
          const held = data[key];
          const def = held && itemDef(held.id);
          if (def) next[key] = { ...def };
          else if (held && held.name) next[key] = { id: held.id || "", name: held.name, effect: held.effect || "使い捨て。使ったら消える。", image: held.image || ITEM_IMAGE };
          continue;
        }
        const item = data[key] && gearItem(data[key].id);
        const fits = item && (item.slot === key || (item.slot === "braceletAny" && (key === "braceletL" || key === "braceletR")));
        if (fits) next[key] = { ...item };
      }
      const medals = Math.floor(Number(data.medals) || 0);
      next.medals = medals > 0 ? medals : 0;
      return next;
    }

    function gearStatSum(stat) {
      let n = 0;
      for (const key of ["sword", "shield", "braceletR", "braceletL"]) {
        const item = gear && gear[key];
        if (item && item[stat]) n += Number(item[stat]) || 0;
      }
      return n;
    }

    function syncGearStats() {
      if (!player) return;
      const atkMod = Number(player.atkMod) || 0;
      const defMod = Number(player.defMod) || 0;
      const medalAtk = gear.medal && gear.medal.halfAtk && hpHalf(player) ? gear.medal.halfAtk : 0;
      player.atk = gearStatSum("atk") + atkMod + medalAtk;
      player.def = gearStatSum("def") + defMod - burnStacks(player);
    }

    function gearEffectHtml(slotId) {
      if (!slotId) return "";
      if (slotId === "medal" && !gear.medal) {
        return `<p class="gear-effect">メダル。ボスを倒すと確定でもらえる。</p>`;
      }
      if (slotId === "itemL" || slotId === "itemR") {
        const item = gear[slotId];
        if (!item) return `<p class="gear-effect">使い捨てアイテム。なにも入っていない。</p>`;
        const canUse = item.quick && screen === "battle" && phase === "player" && !outcome;
        const hint = item.quick ? "" : "持っているだけでよい。死んだとき、ひとりでに使われる。";
        const button = item.quick ? `<button type="button" class="item-use" data-use-item="${slotId}" ${canUse ? "" : "disabled"}>使う</button>` : "";
        return `<p class="gear-effect">${esc(item.name)}。${esc(item.effect)}${hint ? "<br>" + esc(hint) : ""}${button}</p>`;
      }
      const item = gear[slotId];
      if (!item) return `<p class="gear-effect">なにも入っていない。</p>`;
      const name = item.name || "";
      const effect = item.effect || "";
      const body = name && effect ? `${esc(name)}。${esc(effect)}` : esc(effect || name || "なにも入っていない。");
      return `<p class="gear-effect">${body}</p>`;
    }

      return gearEffectHtml(shownGearSlot());
    }

    function paintGear() {
      const shown = shownGearSlot();
      root.querySelectorAll(".gear-slot[data-gear]").forEach((btn) => {
        const id = btn.dataset.gear;
        const on = id === shown;
        btn.classList.toggle("open", on && gearOpen === id);
        btn.classList.toggle("hot", on && gearOpen !== id);
      });
      const rail = root.querySelector(".gear-rail");
      if (!rail) return;
      let box = rail.querySelector(".gear-effect");
      const html = gearEffectHtml(shown);
      if (!html) {
        if (box) box.remove();
        return;
      }
      if (!box) {
        const board = rail.querySelector(".gear-board");
        if (!board) return;
        board.insertAdjacentHTML("afterend", html);
        return;
      }
      const next = document.createElement("div");
      next.innerHTML = html;
      const fresh = next.firstElementChild;
      if (fresh) box.replaceWith(fresh);
    }

    function bindGearHover() {
      const rail = root.querySelector(".gear-rail");
      if (!rail || rail.dataset.gearBound === "1") return;
      rail.dataset.gearBound = "1";
      rail.addEventListener("pointerover", (event) => {
        const btn = event.target instanceof Element ? event.target.closest("[data-gear]") : null;
        if (!btn || !rail.contains(btn)) return;
        const id = btn.dataset.gear || "";
        if (gearHover === id) return;
        gearHover = id;
        paintGear();
      });
      rail.addEventListener("pointerleave", () => {
        if (!gearHover) return;
        gearHover = "";
        paintGear();
      });
    }
