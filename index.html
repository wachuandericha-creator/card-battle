<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>わちゅえりカードゲーム</title>
  <style>
    :root {
      --bg: #12100e;
      --ink: #2a2118;
      --cream: #f4ead7;
      --gold: #e4b15a;
      --hp: #d85a4a;
      --hp-bg: #3a2422;
      --block: #7eb0e6;
      --attack: #e07a55;
      --guard: #6f9ed4;
      --muted: #b7a898;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 18%, #3a2c24 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #1c1612 0%, #12100e 70%);
    }
    button, body { -webkit-user-select: none; user-select: none; }
    .battle-screen { height: 100%; display: flex; }
    .game {
      flex: 1 1 83.333%;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 18px 14px;
      gap: 8px;
    }
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(228, 177, 90, 0.35);
    }
    .dungeon { display: flex; align-items: baseline; gap: 16px; }
    .dungeon-name {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--cream);
    }
    .dungeon-progress {
      color: var(--gold);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .hud-actions { display: flex; gap: 8px; }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .turn { color: var(--gold); font-weight: 700; }
    .chip b { font-size: 20px; }
    .bar {
      height: 8px;
      width: 88px;
      border-radius: 99px;
      background: var(--hp-bg);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--hp); }
    .block-num { color: var(--block); }
    .energy-pips { display: flex; gap: 5px; justify-content: center; }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
    }
    .pip.on { background: var(--gold); }
    .next-energy, .rules, .logline { color: var(--muted); font-size: 13px; }
    .rules { margin: 0; }
    .note { min-height: 1.1em; color: #f0c7a2; font-size: 13px; }
    .stage {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
    }
    .enemy-field { display: flex; align-items: stretch; gap: 12px; width: 100%; }
    .enemy-main {
      flex: 1 1 75%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .intent { flex: none; }
    .intent {
      min-width: 280px;
      text-align: center;
      background: rgba(20, 14, 12, 0.72);
      border: 1px solid rgba(224, 122, 85, 0.45);
      border-radius: 14px;
      padding: 8px 18px 10px;
    }
    .intent .label { font-size: 12px; letter-spacing: 0.14em; color: var(--muted); }
    .intent .now { font-size: 32px; font-weight: 800; line-height: 1.2; }
    .intent.attack { border-color: rgba(224, 122, 85, 0.7); }
    .intent.attack .now { color: var(--attack); }
    .intent.block { border-color: rgba(126, 176, 230, 0.7); }
    .intent.block .now { color: var(--block); }
    .intent.skill { border-color: rgba(228, 177, 90, 0.7); }
    .intent .now { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
    .act { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; line-height: 1; }
    .act .ico { display: block; }
    .act.big .ico { width: 36px; height: 36px; }
    .act.big b, .act.big.skill { font-size: 36px; }
    .act.small { gap: 4px; }
    .act.small .ico { width: 18px; height: 18px; }
    .act.small b, .act.small.skill { font-size: 16px; }
    .act.attack { color: var(--attack); }
    .act.block { color: var(--block); }
    .act.skill { color: var(--gold); }
    .skill-note {
      flex: 0 0 25%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      border: 2px solid rgba(228, 177, 90, 0.92);
      border-radius: 12px;
      background: rgba(20, 14, 12, 0.72);
      padding: 16px 14px;
      color: var(--cream);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.45;
    }
    .skill-note .star { color: var(--gold); font-size: 28px; line-height: 1; }
    .sprite {
      flex: none;
      width: 210px;
      height: 156px;
      border-radius: 46% 46% 40% 40%;
      background:
        radial-gradient(circle at 30% 30%, #8d847c, transparent 40%),
        linear-gradient(160deg, #6e675f, #3c3834 60%, #2a2724);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), inset 0 -10px 16px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    .sprite .eye {
      position: absolute;
      top: 58px;
      width: 26px;
      height: 26px;
      background: #f4ead7;
      border-radius: 50%;
    }
    .sprite .eye::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #1a120e;
      border-radius: 50%;
      top: 8px;
      left: 8px;
    }
    .sprite .eye.l { left: 54px; }
    .sprite .eye.r { right: 54px; }
    .sprite.hit { animation: shake 0.35s linear; }
    .enemy { text-align: center; }
    .enemy h2 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0.14em;
      color: var(--cream);
      font-weight: 800;
    }
    .enemy .hp-line { font-size: 16px; }
    .bar.wide { width: 180px; height: 10px; }
    .banner { min-height: 0; text-align: center; color: var(--gold); font-size: 18px; }
    .logline { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .party {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 12px;
      margin-top: 6px;
      padding-top: 14px;
      border-top: 2px solid rgba(228, 177, 90, 0.92);
    }
    .party-stats {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .vitals { text-align: center; }
    .vitals .hp-line { margin-top: 4px; font-size: 15px; }
    .meters { width: 240px; margin: 0 auto; }
    .meter {
      height: 14px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--hp-bg);
    }
    .meter > span { display: block; height: 100%; }
    .meter.hp > span { background: var(--hp); }
    .meter.shield { background: transparent; margin-bottom: 4px; }
    .meter.shield > span { width: 100%; background: var(--block); }
    .pip {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #4a4034;
      background: #241e18;
    }
    .pip.on { background: #f2c14e; border-color: #ffe7a3; }
    .handbar { flex: 1; width: 100%; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 0; }
    .pile { width: 118px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .pile-card {
      position: relative;
      width: 118px;
      height: 168px;
      border-radius: 14px;
    }
    .pile-card.back {
      background:
        radial-gradient(circle at 50% 46%, rgba(228, 177, 90, 0.2), transparent 42%),
        repeating-linear-gradient(135deg, rgba(228, 177, 90, 0.18) 0 1px, transparent 1px 12px),
        #2a2118;
      border: 2px solid #c8963e;
      box-shadow: inset 0 0 0 6px rgba(18, 14, 10, 0.55), inset 0 0 0 7px rgba(228, 177, 90, 0.4);
    }
    .pile-card.discard {
      background:
        radial-gradient(circle at 50% 46%, rgba(140, 128, 116, 0.16), transparent 42%),
        repeating-linear-gradient(135deg, rgba(150, 138, 124, 0.16) 0 1px, transparent 1px 12px),
        #14110e;
      border-color: #5a5148;
      box-shadow: inset 0 0 0 6px rgba(8, 6, 5, 0.72), inset 0 0 0 7px rgba(110, 100, 90, 0.38);
    }
    .pile-card.stack { box-shadow: 5px 5px 0 #16120f, 6px 6px 0 rgba(200, 150, 62, 0.7); }
    .pile-card.discard.stack { box-shadow: 5px 5px 0 #0c0a09, 6px 6px 0 rgba(90, 81, 72, 0.75); }
    .pile-count {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 68px;
      font-weight: 800;
      line-height: 1;
      color: #fff8ee;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 1;
    }
    .pile-card.empty {
      background: transparent;
      border: 1px solid rgba(244, 234, 215, 0.28);
      box-shadow: none;
    }
    .pile-card.empty .pile-count {
      color: rgba(244, 234, 215, 0.32);
      text-shadow: none;
      font-weight: 600;
    }
    .pile-label { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
    .hand { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; align-items: flex-end; gap: 0; padding: 16px 8px 4px; }
    .battle-log {
      flex: 0 0 16.666%;
      height: 100%;
      overflow: auto;
      border-left: 1px solid rgba(228, 177, 90, 0.35);
      padding: 14px 10px;
    }
    .battle-log h2 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--gold);
    }
    .battle-log p { margin: 0 0 10px; font-size: 13px; line-height: 1.45; color: var(--cream); }
    .card {
      width: auto;
      flex: 1 1 0;
      max-width: 176px;
      min-width: 0;
      margin-inline: -22px;
      height: min(280px, 42vh);
      border: 0;
      border-radius: 16px;
      background: var(--cream);
      color: var(--ink);
      padding: 12px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      position: relative;
      transform: translateY(var(--drop, 0px)) rotate(var(--fan, 0deg));
      transform-origin: center bottom;
      transition: transform 0.15s ease;
    }
    .card:hover:not(:disabled) {
      transform: translateY(calc(var(--drop, 0px) - 16px)) rotate(var(--fan, 0deg));
      z-index: 8;
    }
    .card:disabled { cursor: default; }
    .card.unaffordable { filter: saturate(0.7) brightness(0.92); }
    .card .cost {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gold);
      color: #2a2118;
      font-weight: 800;
      display: grid;
      place-items: center;
      border: 3px solid #fff8ee;
    }
    .card .name { font-size: 18px; font-weight: 800; margin: 16px 0 6px; }
    .card .text { white-space: pre-line; font-size: 14px; line-height: 1.4; }
    .end {
      width: 124px;
      height: 124px;
      flex: none;
      border-radius: 18px;
      border: 2px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .end:disabled { opacity: 0.4; cursor: default; }
    .end:not(:disabled):hover { background: rgba(228, 177, 90, 0.12); }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 7, 0.72);
      display: grid;
      place-items: center;
    }
    .overlay .panel {
      background: #2a221c;
      border: 1px solid rgba(244, 234, 215, 0.2);
      border-radius: 18px;
      padding: 28px 32px;
      text-align: center;
      min-width: 280px;
    }
    .overlay h2 { margin: 0 0 8px; font-size: 28px; color: var(--cream); letter-spacing: 0.06em; }
    .overlay p { margin: 0 0 16px; color: var(--muted); }
    .overlay button {
      border: 0;
      background: var(--gold);
      color: #2a2118;
      font-weight: 800;
      font-size: 16px;
      border-radius: 999px;
      padding: 10px 22px;
      cursor: pointer;
    }
    #game { height: 100%; }
    .menu {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
    }
    .title-screen { height: 100%; display: flex; flex-direction: column; }
    .title-hero {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 12px 24px 8px;
    }
    .title-art {
      width: min(920px, 94vw);
      max-height: 34vh;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 88%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 88%, transparent);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
    }
    .title-hero h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(26px, 4.4vw, 48px);
      letter-spacing: 0.22em;
      text-align: center;
      line-height: 1.2;
      font-weight: 800;
    }
    .title-hero h1::after {
      content: "";
      display: block;
      width: 72px;
      height: 2px;
      margin: 12px auto 0;
      background: var(--gold);
    }
    .title-actions {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 8px 24px 40px;
    }
    .menu h1 { font-size: 32px; letter-spacing: 0.14em; }
    .menu p { margin: 0; color: var(--muted); }
    .menu button, .title-actions button, .small-btn {
      min-width: 220px;
      border-radius: 14px;
      border: 1px solid rgba(228, 177, 90, 0.8);
      background: transparent;
      color: var(--cream);
      font-size: 18px;
      padding: 12px 16px;
      cursor: pointer;
    }
    .menu button.primary, .title-actions button.primary, .small-btn.primary {
      background: var(--gold);
      color: #2a2118;
      font-weight: 800;
    }
    .menu button:disabled, .title-actions button:disabled { opacity: 0.35; cursor: default; }
    .small-btn { min-width: 0; font-size: 14px; padding: 8px 10px; }
    @keyframes shake {
      25% { transform: translateX(-6px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    @media (max-width: 720px) {
      .card { width: 112px; height: 150px; }
      .sprite { width: 180px; height: 136px; }
      .sprite .eye { top: 50px; width: 20px; height: 20px; }
      .sprite .eye.l { left: 46px; }
      .sprite .eye.r { right: 46px; }
      .end { width: 96px; height: 96px; font-size: 14px; }
      .pip { width: 18px; height: 18px; }
      .meters { width: 180px; }
      .title-hero h1 { font-size: 22px; letter-spacing: 0.12em; }
      .title-art { max-height: 28vh; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // 試し用カード。名前・コスト・効果を差し替えると中身が変わる。
    const CARD_POOL = [
      ["斬撃", 3],
      ["防御", 3],
      ["強撃", 2],
      ["踏み込み", 2],
    ];
    const CARDS = {
      斬撃: { cost: 1, text: "6ダメージ", damage: 6 },
      防御: { cost: 1, text: "ブロック5", block: 5 },
      強撃: { cost: 2, text: "12ダメージ", damage: 12 },
      踏み込み: { cost: 1, text: "4ダメージ\nブロック3", damage: 4, block: 3 },
    };
    const ENEMIES = [
      {
        name: "仮の相手",
        hp: 22,
        skill: "13ダメージ",
        pattern: [
          { type: "attack", value: 8 },
          { type: "block", value: 10 },
          { type: "skill", damage: 13 },
        ],
      },
      {
        name: "荒くれ",
        hp: 24,
        skill: "8ダメージ",
        pattern: [
          { type: "attack", value: 4 },
          { type: "attack", value: 4 },
          { type: "skill", damage: 8 },
        ],
      },
      {
        name: "重騎士",
        hp: 30,
        skill: "このターンは動かない",
        pattern: [
          { type: "skill" },
          { type: "attack", value: 12 },
          { type: "block", value: 8 },
        ],
      },
    ];

    const root = document.getElementById("game");
    let uid = 1;
    let deck = [];
    let hand = [];
    let discard = [];
    let player = null;
    let enemy = null;
    let turn = 0;
    let intentIndex = 0;
    let phase = "player";
    let note = "";
    let banner = "";
    let outcome = null;
    let logLines = [];
    let timer = null;
    let screen = "title";
    let battleIndex = 0;
    let showLog = true;
    let cleared = false;
    let saveNote = "";
    let returnScreen = "title";
    const SAVE_KEY = "card-battle-save-v1";
    const SETTINGS_KEY = "card-battle-settings-v1";
    const BATTLE_TOTAL = 3;
    const DUNGEON_NAME = "仮の三連戦";

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      }[c]));
    }

    function log(msg) {
      logLines.unshift(msg);
      if (logLines.length > 16) logLines.pop();
    }

    function clearTimer() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function enemyNow() {
      return ENEMIES[battleIndex];
    }

    function swordIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0l2.4 5.2L13.2 13H18v2.4h-4.8V22h-2.4v-6.6H6V13h4.8L9.6 5.2z"/></svg>`;
    }

    function shieldIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l8 3v7c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V5z"/></svg>`;
    }

    function actionMark(intent, big) {
      const size = big ? "big" : "small";
      if (intent.type === "attack") {
        return `<span class="act attack ${size}" aria-label="攻撃 ${intent.value}">${swordIcon()}<b>${intent.value}</b></span>`;
      }
      if (intent.type === "block") {
        return `<span class="act block ${size}" aria-label="シールド ${intent.value}">${shieldIcon()}<b>${intent.value}</b></span>`;
      }
      return `<span class="act skill ${size}" aria-label="スキル">★</span>`;
    }

    function intentAt(offset) {
      const pattern = enemyNow().pattern;
      return pattern[(intentIndex + offset) % pattern.length];
    }

    function applyDamage(target, amount) {
      const blocked = Math.min(target.block, amount);
      target.block -= blocked;
      const hpLoss = amount - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      target.hit = true;
      return { blocked, hpLoss };
    }

    function damageSentence(label, raw, result) {
      if (result.blocked && result.hpLoss) {
        return `${label}の${raw}ダメージ。ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      }
      if (result.blocked) {
        return `${label}の${raw}ダメージをブロックで防いだ。`;
      }
      return `${label}の${raw}ダメージ。`;
    }

    function buildDeck() {
      const specs = [];
      for (const [name, count] of CARD_POOL) {
        for (let i = 0; i < count; i++) {
          specs.push({ uid: uid++, name, ...CARDS[name] });
        }
      }
      deck = shuffle(specs);
      hand = [];
      discard = [];
    }

    function draw(n) {
      for (let i = 0; i < n; i++) {
        if (!deck.length) {
          if (!discard.length) break;
          deck = shuffle(discard);
          discard = [];
          log("捨て札を山札に戻した。");
        }
        hand.push(deck.pop());
      }
    }

    function resolveCard(card) {
      if (card.damage) {
        const result = applyDamage(enemy, card.damage);
        log(damageSentence(card.name, card.damage, result));
      }
      if (card.block) {
        player.block += card.block;
        log(`${card.name}でブロック${card.block}。いま${player.block}。`);
      }
    }

    function playCard(index) {
      if (phase !== "player" || outcome) return;
      const card = hand[index];
      if (!card) return;
      if (player.energy < card.cost) {
        note = "エネルギーが足りない";
        render();
        return;
      }
      player.energy -= card.cost;
      hand.splice(index, 1);
      discard.push(card);
      note = "";
      resolveCard(card);
      if (enemy.hp <= 0) {
        finish("win");
        return;
      }
      render();
    }

    function endTurn() {
      if (phase !== "player" || outcome) return;
      phase = "enemy";
      while (hand.length) discard.push(hand.pop());
      note = "";
      const intent = intentAt(0);
      render();
      timer = setTimeout(() => {
        enemy.block = 0;
        if (intent.type === "attack") {
          const result = applyDamage(player, intent.value);
          log(damageSentence(enemy.name, intent.value, result));
        } else if (intent.type === "block") {
          enemy.block += intent.value;
          log(`${enemy.name}はブロックを${intent.value}得た。`);
        } else if (intent.damage) {
          const result = applyDamage(player, intent.damage);
          log(damageSentence(enemy.name, intent.damage, result));
        } else {
          log(`${enemy.name}のスキル。${enemyNow().skill}`);
        }
        if (player.hp <= 0) {
          finish("lose");
          return;
        }
        intentIndex = (intentIndex + 1) % enemyNow().pattern.length;
        banner = "";
        startPlayerTurn();
      }, 650);
    }

    function startPlayerTurn() {
      if (player.hp <= 0) {
        finish("lose");
        return;
      }
      turn += 1;
      player.block = 0;
      player.maxEnergy = Math.min(10, player.maxEnergy + 1);
      player.energy = player.maxEnergy;
      draw(3);
      phase = "player";
      render();
    }

    function finish(kind) {
      clearTimer();
      outcome = kind;
      phase = "end";
      banner = "";
      log(kind === "win" ? `${enemy.name}を倒した。` : "倒された。");
      if (kind === "win" && battleIndex >= BATTLE_TOTAL - 1) {
        cleared = true;
        screen = "clear";
      }
      if (kind === "win") persistSave(true);
      render();
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (typeof saved.showLog === "boolean") showLog = saved.showLog;
      } catch (error) {
        showLog = true;
      }
    }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ showLog }));
    }

    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function persistSave(silent) {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1,
        cleared,
        battleIndex,
        turn,
        intentIndex,
        phase,
        note,
        banner,
        outcome,
        logLines,
        deck,
        hand,
        discard,
        player,
        enemy,
      }));
      if (!silent) {
        saveNote = "セーブした";
        render();
      }
    }

    function applySave(data) {
      cleared = !!data.cleared;
      battleIndex = data.battleIndex || 0;
      turn = data.turn || 0;
      intentIndex = data.intentIndex || 0;
      phase = data.phase || "player";
      note = data.note || "";
      banner = data.banner || "";
      outcome = data.outcome || null;
      logLines = data.logLines || [];
      deck = data.deck || [];
      hand = data.hand || [];
      discard = data.discard || [];
      player = data.player;
      enemy = data.enemy;
      if (player) player.hit = false;
      if (enemy) enemy.hit = false;
      saveNote = "";
    }

    function startBattle(keepHp) {
      clearTimer();
      screen = "battle";
      cleared = false;
      const hp = keepHp == null ? 40 : keepHp;
      player = { hp, maxHp: 40, block: 0, energy: 0, maxEnergy: 0, hit: false };
      const foe = enemyNow();
      enemy = { name: foe.name, hp: foe.hp, maxHp: foe.hp, block: 0, hit: false };
      turn = 0;
      intentIndex = 0;
      phase = "player";
      note = "";
      banner = "";
      outcome = null;
      logLines = [];
      saveNote = "";
      buildDeck();
      startPlayerTurn();
    }

    function beginRun() {
      battleIndex = 0;
      cleared = false;
      startBattle(40);
    }

    function continueGame() {
      const data = readSave();
      if (!data) return;
      clearTimer();
      applySave(data);
      screen = data.cleared ? "clear" : "battle";
      render();
    }

    function goTitle() {
      clearTimer();
      screen = "title";
      saveNote = "";
      render();
    }

    function meters(hp, maxHp, block) {
      const hpPct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
      const blockPct = Math.max(0, Math.min(100, (block / maxHp) * 100));
      const shield = block > 0 ? `<div class="meter shield" style="width:${blockPct}%"><span></span></div>` : "";
      return `<div class="meters">${shield}<div class="meter hp"><span style="width:${hpPct}%"></span></div></div>`;
    }

    function pips() {
      return Array.from({ length: player.maxEnergy }, (_, i) =>
        `<i class="pip${i < player.energy ? " on" : ""}"></i>`
      ).join("");
    }

    function menuButton(label, action, primary, disabled) {
      return `<button type="button" class="${primary ? "primary" : ""}" data-action="${action}" ${disabled ? "disabled" : ""}>${esc(label)}</button>`;
    }

    function renderTitle() {
      root.innerHTML = `
        <div class="title-screen">
          <div class="title-hero">
            <img class="title-art" src="title-art.jpg" alt="">
            <h1>わちゅえりカードゲーム</h1>
          </div>
          <div class="title-actions">
            ${menuButton("はじめから", "new", true)}
            ${menuButton("つづきから(あいことば)", "continue", false, !readSave())}
            ${menuButton("せってい", "settings")}
          </div>
        </div>`;
    }

    function renderSettings() {
      root.innerHTML = `
        <div class="menu">
          <h1>せってい</h1>
          ${menuButton(showLog ? "経過の表示：オン" : "経過の表示：オフ", "toggle-log", true)}
          ${menuButton("もどる", "back")}
        </div>`;
    }

    function renderConfirm() {
      root.innerHTML = `
        <div class="menu">
          <h1>はじめから</h1>
          <p>今のセーブは消える。</p>
          ${menuButton("消してはじめる", "new-force", true)}
          ${menuButton("もどる", "title")}
        </div>`;
    }

    function renderClear() {
      root.innerHTML = `
        <div class="menu">
          <h1>クリア</h1>
          <p>3つの戦いに勝った。</p>
          ${menuButton("タイトルへ", "title", true)}
        </div>`;
    }

    function render() {
      if (screen === "title") return renderTitle();
      if (screen === "settings") return renderSettings();
      if (screen === "confirm") return renderConfirm();
      if (screen === "clear") return renderClear();
      renderBattle();
    }

    function pileMarkup(kind, count) {
      const label = kind === "deck" ? "山札" : "捨て札";
      const empty = count === 0;
      const stack = count > 1 ? " stack" : "";
      const look = empty ? "empty" : kind === "deck" ? "back" : "back discard";
      return `<div class="pile" aria-label="${label} ${count}"><div class="pile-card ${look}${stack}"><span class="pile-count">${count}</span></div><div class="pile-label">${label}</div></div>`;
    }

    function renderBattle() {
      const intent = intentAt(0);
      const cards = hand.map((card, i) => {
        const poor = player.energy < card.cost;
        const mid = (hand.length - 1) / 2;
        const fan = (i - mid) * 8;
        const drop = Math.abs(i - mid) * 12;
        return `<button type="button" class="card${poor ? " unaffordable" : ""}" data-card="${i}" style="--fan:${fan}deg;--drop:${drop}px;z-index:${i + 1}" ${phase !== "player" ? "disabled" : ""}>
          <span class="cost">${card.cost}</span>
          <div class="name">${esc(card.name)}</div>
          <div class="text">${esc(card.text)}</div>
        </button>`;
      }).join("");
      const overlay = outcome === "win"
        ? `<div class="overlay"><div class="panel">
            <h2>勝った</h2>
            <p>続きを保存した。体力はそのまま。</p>
            <button type="button" data-action="next">つぎの戦い</button>
          </div></div>`
        : outcome === "lose"
        ? `<div class="overlay"><div class="panel">
            <h2>倒された</h2>
            <p>つづきからは、最後のセーブに戻る。</p>
            <button type="button" data-action="title">タイトルへ</button>
          </div></div>`
        : "";

      const logHtml = logLines.map((line) => `<p>${esc(line)}</p>`).join("");
      root.innerHTML = `
        <div class="battle-screen">
        <div class="game">
          <header class="hud-top">
            <div class="dungeon">
              <h1 class="dungeon-name">${esc(DUNGEON_NAME)}</h1>
              <div class="dungeon-progress">${battleIndex + 1}/${BATTLE_TOTAL}</div>
            </div>
            <div class="hud-actions">
              <button type="button" class="small-btn" data-action="settings">せってい</button>
              <button type="button" class="small-btn" data-action="title" ${phase === "enemy" ? "disabled" : ""}>タイトル</button>
            </div>
          </header>
          <div class="stage">
            <div class="enemy-field">
            <div class="enemy-main">
            <div class="intent ${intent.type}">
              <div class="now">${actionMark(intent, true)}</div>
            </div>
            <div class="sprite${enemy.hit ? " hit" : ""}" aria-hidden="true">
              <i class="eye l"></i><i class="eye r"></i>
            </div>
            <section class="enemy">
              <h2>${esc(enemy.name)}</h2>
              ${meters(enemy.hp, enemy.maxHp, enemy.block)}
              <div class="hp-line">体力 ${enemy.hp} / ${enemy.maxHp}</div>
            </section>
            <div class="banner">${esc(banner)}</div>
            <div class="note">${esc(note)}</div>
            </div>
            <aside class="skill-note"><span class="star">★</span><span>${esc(enemyNow().skill)}</span></aside>
            </div>
          </div>
          <section class="party">
            <div class="party-stats">
              <div class="vitals">
                ${meters(player.hp, player.maxHp, player.block)}
                <div class="hp-line">体力 <b>${player.hp}</b>/${player.maxHp}</div>
              </div>
              <div class="energy-pips" aria-label="エネルギー ${player.energy}">${pips()}</div>
            </div>
            <div class="handbar">
              ${pileMarkup("deck", deck.length)}
              <div class="hand">${cards}</div>
              ${pileMarkup("discard", discard.length)}
              <button type="button" class="end" data-end ${phase === "player" ? "" : "disabled"}>ターン終了</button>
            </div>
          </section>
        </div>
        ${showLog ? `<aside class="battle-log"><h2>経過</h2>${logHtml}</aside>` : ""}
        </div>
        ${overlay}`;
      player.hit = false;
      enemy.hit = false;
    }

    root.addEventListener("click", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      const action = el.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "title") goTitle();
        if (name === "settings") { returnScreen = screen; screen = "settings"; render(); }
        if (name === "back") { screen = returnScreen; render(); }
        if (name === "toggle-log") { showLog = !showLog; persistSettings(); render(); }
        if (name === "new") {
          if (readSave()) { screen = "confirm"; render(); }
          else beginRun();
        }
        if (name === "new-force") { localStorage.removeItem(SAVE_KEY); beginRun(); }
        if (name === "continue") continueGame();
        if (name === "next" && outcome === "win") {
          battleIndex += 1;
          startBattle(player.hp);
        }
        return;
      }
      if (screen !== "battle") return;
      const card = el.closest("[data-card]");
      if (card) playCard(Number(card.dataset.card));
      if (el.closest("[data-end]")) endTurn();
    });

    document.addEventListener("keydown", (event) => {
      if (screen !== "battle") return;
      if (event.key === "Enter") endTurn();
      if (event.key === "1" || event.key === "2" || event.key === "3") {
        playCard(Number(event.key) - 1);
      }
    });

    loadSettings();
    render();
  </script>
</body>
</html>
