<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>わちゅえりカードゲーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap" />
  <style>
    :root {
      --hand-scale: 0.64;
      --card-ratio: 3 / 4;
      --edge-clear: 0px;
      --bg: #0a0908;
      --ink: #1a1612;
      --cream: #f0e4cc;
      --gold: #d4a84a;
      --gold-soft: rgba(212, 168, 74, 0.55);
      --gold-line: rgba(212, 168, 74, 0.72);
      --fade-line-mid: rgba(228, 177, 90, 0.75);
      --panel-face: linear-gradient(180deg, rgba(22, 18, 14, 0.98), rgba(6, 5, 4, 0.99));
      --panel-sheen: radial-gradient(120% 80% at 50% 0%, rgba(212, 168, 74, 0.1), transparent 55%);
      --panel-frame:
        0 0 0 1px #0a0806,
        0 0 0 2px rgba(196, 168, 110, 0.55),
        0 0 0 3px #12100c,
        0 10px 22px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 232, 180, 0.08);
      --hp: #c24a3c;
      --hp-bg: #2a1a18;
      --block: #9bb4cc;
      --attack: #c88858;
      --guard: #8aa0b8;
      --muted: #a89880;
      --log-serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS Mincho", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 18%, #241c14 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #100e0c 0%, #0a0908 70%);
    }
    button, body { -webkit-user-select: none; user-select: none; }
    .battle-screen {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 12.5%) minmax(0, 1fr) minmax(0, 12.5%);
      grid-template-rows: auto minmax(0, 2.4fr) minmax(0, 1.3fr);
      grid-template-areas:
        "road hud log"
        "road arena log"
        "road hand log";
      padding: 10px 10px 4px;
      row-gap: 0;
      column-gap: 10px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(70, 48, 22, 0.22), transparent 52%),
        radial-gradient(ellipse at 50% 100%, rgba(8, 6, 5, 0.95), #050403 72%),
        #0a0908;
    }
    .battle-screen.no-log {
      grid-template-columns: minmax(0, 12.5%) minmax(0, 1fr);
      grid-template-areas:
        "road hud"
        "road arena"
        "road hand";
    }
    .game { display: contents; }
    .hud-top { grid-area: hud; min-width: 0; overflow: visible; }
    .battle-bands {
      grid-area: arena;
      position: relative;
      z-index: 4;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      border-radius: 10px;
      /* 手札が上に来ても、プレイエリアへは絶対に重ねない */
      overflow: hidden;
      border: 8px solid #e4c27a;
      background:
        linear-gradient(180deg, rgba(10, 8, 7, 0.28) 0%, rgba(10, 8, 7, 0.18) 42%, rgba(10, 8, 7, 0.62) 100%),
        var(--dungeon-art, url("dungeon-bg.jpg")) center 38% / cover no-repeat;
      box-shadow:
        0 0 0 2px #5c3a12,
        inset 0 0 0 2px #fff1c4,
        0 14px 28px rgba(0, 0, 0, 0.55);
      isolation: isolate;
    }
    /* キャラは戦闘枠いっぱいに置き、プレイエリアはその上に重ねる（足元が下に入ってよい） */
    .stage { grid-area: 1 / 1; min-width: 0; overflow: visible; position: relative; z-index: 3; }
    .play-row { grid-area: 1 / 1; min-width: 0; overflow: hidden; position: relative; z-index: 5; }
    /* 手札は戦闘枠より手前。ホバーでプレイエリアへ重なってよい */
    .handbar { grid-area: hand; min-width: 0; overflow: visible; z-index: 8; }
    .hero-stack {
      position: absolute;
      top: 12px;
      left: 8px;
      z-index: 8;
      width: min(300px, 42%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      pointer-events: none;
    }
    .hero-stack .battle-plate {
      position: relative;
      top: auto;
      left: auto;
      width: 100%;
      pointer-events: auto;
    }
    .battle-log { min-width: 0; overflow: auto; }
    .side-rail {
      grid-area: log;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .road-map {
      position: relative;
      grid-area: road;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 8px 12px 10px;
      border-radius: 16px;
      border: 6px solid #e4b15a;
      background: rgba(14, 11, 9, 0.98);
      box-shadow:
        0 0 0 2px #5c3a12,
        inset 0 0 0 2px rgba(255, 241, 196, 0.35),
        0 10px 22px rgba(0, 0, 0, 0.55);
      color: var(--cream);
      font-family: var(--log-serif);
    }
    .road-map h2 {
      flex: 0 0 auto;
      margin: 0 0 8px;
      padding: 8px 8px 10px;
      border: 1px solid rgba(255, 214, 120, 0.75);
      border-radius: 12px;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(255, 226, 150, 0.28), transparent 62%),
        linear-gradient(180deg, rgba(146, 96, 28, 0.55), rgba(48, 28, 10, 0.4));
      box-shadow: inset 0 1px 0 rgba(255, 244, 210, 0.45), 0 6px 14px rgba(0, 0, 0, 0.28);
      font-family: var(--log-serif);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-align: center;
      color: #fff3c4;
      text-shadow: 0 1px 0 #5a3810, 0 0 12px rgba(255, 206, 90, 0.45);
    }
    .road-map ol {
      list-style: none;
      margin: 0;
      padding: 4px 6px 6px;
      box-sizing: border-box;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .road-map ol::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .road-node {
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      flex: 0 0 calc((100% - 24px) / 5 - 10px);
      min-height: 0;
      padding: 5px;
      overflow: hidden;
      border-radius: 10px;
      color: #ead8b0;
      font-family: inherit;
      isolation: isolate;
    }
    .road-node > img, .road-node > i {
      position: relative;
      z-index: 0;
      flex: 1 1 auto;
      min-height: 0;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      object-position: center;
      background: #1a1410;
    }
    .road-node > i {
      display: grid;
      place-items: center;
      border: 1px solid rgba(228, 177, 90, 0.35);
      font-family: inherit;
      font-size: 54px;
      font-weight: 900;
      font-style: normal;
      color: #ffe7a4;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.85);
    }
    .road-node.pad { visibility: hidden; }
    .road-node.done { color: #f0e4cc; }
    .road-node.tone-fight:not(.now) {
      box-shadow: 0 0 0 5px #ff2a18, 0 0 22px 6px rgba(255, 36, 20, 0.95);
    }
    .road-node.tone-fight img,
    .road-node.tone-fight i { box-shadow: inset 0 0 0 16px #ff2a18; }
    .road-node.tone-rest img,
    .road-node.tone-rest i { box-shadow: inset 0 0 0 6px #6aa4e0; }
    .road-node.tone-other img,
    .road-node.tone-other i { box-shadow: inset 0 0 0 6px #e2b03a; }
    .road-node.now {
      z-index: 2;
      overflow: visible;
      color: #fff6d0;
      border-radius: 10px;
      outline: none;
      box-shadow: inset 0 0 0 6px #e4b15a, 0 0 16px 5px rgba(255, 214, 70, 0.82);
      animation: here-pulse 1.1s ease-in-out infinite;
    }
    .road-node.now > img,
    .road-node.now > i {
      border-radius: 8px;
      box-shadow: none;
    }
    .road-node.now.tone-fight > img,
    .road-node.now.tone-fight > i,
    .road-node.now.tone-rest > img,
    .road-node.now.tone-rest > i,
    .road-node.now.tone-other > img,
    .road-node.now.tone-other > i {
      box-shadow: none;
    }
    .road-lock {
      position: absolute;
      z-index: 5;
      top: 8px;
      right: 8px;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: #ffe7a4;
      filter: drop-shadow(0 1px 0 #000) drop-shadow(0 0 4px rgba(0, 0, 0, 0.9));
      pointer-events: none;
    }
    .road-lock svg { width: 40px; height: 40px; display: block; }
    .road-back {
      position: absolute;
      z-index: 6;
      left: 14px;
      right: 14px;
      bottom: 12px;
      margin: 0;
      padding: 7px 8px 8px;
      border: 0;
      border-radius: 999px;
      background: #ffe14a;
      color: #3a2208;
      font-family: var(--log-serif);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      box-shadow: 0 2px 0 #6a4512;
      cursor: pointer;
    }
    .road-back[hidden] { display: none; }
    .road-node.now::before {
      content: "";
      position: absolute;
      z-index: 3;
      top: 8px;
      left: 8px;
      width: 22px;
      height: 22px;
      border-top: 4px solid #ffe766;
      border-left: 4px solid #ffe766;
      border-radius: 8px 0 0 0;
      box-shadow: 0 0 12px rgba(255, 228, 100, 0.75);
      pointer-events: none;
    }
    .road-here-mark {
      position: absolute;
      z-index: 5;
      top: 10px;
      left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      max-width: calc(100% - 58px);
      padding: 2px 7px 3px 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff6b8 0%, #ffd43a 48%, #e8a820 100%);
      color: #2a1806;
      border: 1.5px solid rgba(255, 250, 220, 0.95);
      box-shadow:
        0 0 0 1px #6a4512,
        0 0 10px rgba(255, 214, 70, 0.72),
        0 2px 0 #6a4512,
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      font-family: var(--log-serif);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.2;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      pointer-events: none;
      animation: here-mark-pulse 1.1s ease-in-out infinite;
    }
    .road-here-mark svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: #d43818;
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.4));
    }
    .road-here-mark b { font-weight: 900; }
    @keyframes here-pulse {
      0%, 100% {
        box-shadow: inset 0 0 0 6px #e4b15a, 0 0 14px 4px rgba(255, 214, 70, 0.72);
      }
      50% {
        box-shadow: inset 0 0 0 6px #fff0a0, 0 0 26px 8px rgba(255, 236, 140, 0.98);
      }
    }
    @keyframes here-mark-pulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.02);
        filter: brightness(1.05);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .road-node.now,
      .road-here-mark { animation: none; }
    }
    .road-node.boss { color: #ffb0a4; }
    .road-cap {
      position: absolute;
      z-index: 3;
      left: 5px;
      right: 5px;
      bottom: 5px;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 8px 6px;
      pointer-events: none;
    }
    .road-floor {
      flex: 0 0 auto;
      color: #ffe7a4;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 0 #000, 0 0 10px rgba(0, 0, 0, 0.85);
    }
    .road-node.now .road-floor { font-size: 42px; }
    .road-name {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      overflow: hidden;
      color: #fff6e4;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
      text-align: right;
      text-overflow: ellipsis;
      text-shadow: 0 2px 0 #000, 0 0 8px rgba(0, 0, 0, 0.8);
    }
    .road-node.now .road-name { font-size: 32px; }
    .road-node.done .road-name { color: rgba(255, 246, 228, 0.88); }
    .side-rail .battle-log { flex: 1 1 auto; height: auto; }
    .hud-top {
      position: relative;
      z-index: 40;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      column-gap: 12px;
      min-width: 0;
      padding: 10px 18px;
      border-radius: 14px;
      border: 0;
      background: var(--panel-sheen), var(--panel-face);
      box-shadow: var(--panel-frame);
    }
    .dungeon {
      display: flex;
      align-items: baseline;
      gap: 16px;
      min-width: 0;
      justify-self: start;
    }
    .dungeon-name {
      margin: 0;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--cream);
    }
    .dungeon-progress {
      color: var(--gold);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.06em;
      white-space: nowrap;
      text-shadow: 0 2px 0 #1a120c;
    }
    .status-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      width: max-content;
    }
    .status-stars {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      color: var(--gold);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      white-space: nowrap;
      line-height: 1;
      pointer-events: none;
    }
    .hud-actions {
      grid-column: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: stretch;
      justify-content: flex-end;
      justify-self: end;
      align-self: stretch;
      min-width: 0;
      height: 100%;
    }
    .hud-actions .small-btn {
      height: 100%;
      min-height: 56px;
      padding: 0 20px;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .turn { color: var(--gold); font-weight: 700; }
    .chip b { font-size: 20px; }
    .bar {
      height: 8px;
      width: 88px;
      border-radius: 99px;
      background: var(--hp-bg);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--hp); }
    .block-num { color: var(--block); }
    .next-energy, .rules, .logline { color: var(--muted); font-size: 13px; }
    .rules { margin: 0; }
    .note { min-height: 1.1em; color: #f0c7a2; font-size: 13px; }
    .stage {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
      margin: 0;
      padding: 8px 10px 0;
      background: transparent;
      overflow: visible;
      pointer-events: none;
    }
    .stage .foe-piles,
    .stage .foe-pile,
    .stage .foe-peek,
    .stage .ally-piles,
    .stage .ally-piles .pile { pointer-events: auto; }
    .ally-piles {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 7;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .ally-piles .pile { width: 128px; height: auto; }
    .ally-piles .pile-card {
      width: 118px;
      height: auto;
      max-height: none;
      aspect-ratio: var(--card-ratio);
    }
    .ally-piles .pile-count { font-size: 44px; }
    .ally-piles .pile-label { font-size: 16px; letter-spacing: 0.08em; }
    /* 自分の捨て札：カードがあるときは絵だけ。空枠はカードが無いときだけ出す */
    .ally-piles .pile[data-pile="discard"] .pile-card {
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }
    .ally-piles .pile[data-pile="discard"] .pile-card.empty {
      overflow: visible;
      border: 1px solid rgba(244, 234, 215, 0.45);
      background: transparent;
      box-shadow: none;
    }
    .ally-piles .pile[data-pile="discard"] .pile-card.stack,
    .ally-piles .pile[data-pile="discard"] .pile-card.discard.stack { box-shadow: none; }
    /* 自分のステータスは戦闘画面の左上、敵は右上 */
    .enemy-field {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(200px, 26%) minmax(0, 1fr);
      align-items: stretch;
      column-gap: 0;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow: visible;
      padding: 0 6px 2px;
    }
    .duel-side {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
    }
    .duel-side.ally { z-index: 4; justify-content: flex-end; }
    .duel-side.foe { z-index: 4; justify-content: flex-start; }
    .duel-mid {
      position: relative;
      min-width: 0;
      height: 100%;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      pointer-events: none;
      padding: 2px 0 4px;
    }
    .use-board {
      position: relative;
      pointer-events: auto;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: block;
      z-index: 6;
    }
    .vs-mark {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 0 0.12em;
      border: 0;
      background: none;
      cursor: pointer;
      font-family: Cinzel, "Times New Roman", "Yu Mincho", serif;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(56px, 7.4cqw, 104px);
      letter-spacing: 0.08em;
      line-height: 0.8;
      color: #f6e2a4;
      -webkit-text-stroke: 0.045em #050403;
      paint-order: stroke fill;
      text-shadow:
        0.055em 0 0 #050403,
        -0.055em 0 0 #050403,
        0 0.055em 0 #050403,
        0 -0.055em 0 #050403,
        0.04em 0.04em 0 #050403,
        -0.04em 0.04em 0 #050403,
        0.04em -0.04em 0 #050403,
        -0.04em -0.04em 0 #050403;
    }
    .vs-mark:disabled {
      cursor: default;
      opacity: 0.55;
    }
    .vs-mark:not(:disabled):hover { filter: brightness(1.08); }
    .vs-mark.spent {
      filter:
        drop-shadow(0 0 3px #fff6d4)
        drop-shadow(0 0 8px #f0c36a)
        drop-shadow(0 0 16px rgba(228, 177, 90, 0.95));
      animation: vs-gold 1.15s ease-in-out infinite;
    }
    @keyframes vs-gold {
      0%, 100% {
        filter:
          drop-shadow(0 0 2px #fff6d4)
          drop-shadow(0 0 6px #e4b15a)
          drop-shadow(0 0 12px rgba(228, 177, 90, 0.7));
      }
      50% {
        filter:
          drop-shadow(0 0 4px #fffdf4)
          drop-shadow(0 0 12px #ffe7a4)
          drop-shadow(0 0 22px rgba(255, 214, 120, 0.95));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .vs-mark.spent { animation: none; }
    }
    .use-split {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 4px;
    }
    .duel-mid .play-side {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 4px;
      box-sizing: border-box;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .duel-mid .play-side.mine,
    .duel-mid .play-side.foe {
      background: transparent;
      box-shadow: none;
      grid-template-columns: none;
      width: 100%;
    }
    .duel-mid .play-cards {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      height: 100%;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ジョブ選択の右の板：暗い漆に金の縁。初期ステは3つの札、装備は金枠、デッキはカードリストと同じ面 */
    .cast-side .cast-plaque {
      position: relative;
      max-height: none;
      flex: 0 1 auto;
      min-height: 0;
      overflow: visible;
      padding: 16px 18px 18px;
      border: 1px solid rgba(228, 177, 90, 0.85);
      border-radius: 16px;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(228, 177, 90, 0.16), transparent 60%),
        linear-gradient(180deg, #2a2019 0%, #1a1310 42%, #120d0b 100%);
      box-shadow:
        0 0 0 3px #15100d,
        0 0 0 4px rgba(228, 177, 90, 0.6),
        0 18px 34px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 236, 190, 0.22),
        inset 0 0 48px rgba(0, 0, 0, 0.55);
    }
    .cast-side .cast-plaque::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(228, 177, 90, 0.28);
      border-radius: 11px;
      pointer-events: none;

    .cast-side .cast-plaque h1 {
      margin: 0 0 12px;

      align-items: center;

    .cast-side .cast-plaque h1::before,
    .cast-side .cast-plaque h1::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(228, 177, 90, 0.9));

    .cast-side .cast-plaque h1 span {
      background: linear-gradient(180deg, #fff1c8 0%, #f6d48a 45%, #d9a04a 100%);

      background-clip: text;
      color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 2px 0 #5a3d12);

    .stat-chips .chip.hp { --chip: #ff5c4a; }

    .cast-side .cast-blurb {

    .fade-sandwich {

    .cast-side .cast-deck { gap: 8px; }
    /* 挑戦開始：橙金のボタン（炎のアニメは無し） */
    .cast-start {
      position: relative;
      z-index: 1;
      width: auto;
      margin: 0;
      border: 2px solid #ffd28a;
      border-radius: 999px;
      background:
        radial-gradient(120% 160% at 50% 120%, rgba(255, 70, 10, 0.95) 0%, transparent 58%),
        linear-gradient(180deg, #fff0b8 0%, #ffc45a 28%, #f07820 68%, #a02808 100%);
      color: #2a1008;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.18em;
      padding: 14px 34px;
      text-shadow: 0 1px 0 rgba(255, 245, 210, 0.7);
      box-shadow:
        0 0 0 2px rgba(40, 12, 6, 0.92),
        0 0 0 4px rgba(255, 170, 70, 0.35),
        0 0 28px rgba(255, 110, 30, 0.72),
        0 12px 26px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -10px 18px rgba(160, 30, 0, 0.35);
    }
    .cast-actions > button.cast-start:not(.lit) {
      filter: grayscale(0.45) brightness(0.62);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    }
    .cast-actions > button.cast-start.lit {
      filter: none;
      animation: decide-glow 1.15s ease-in-out infinite;
    }
    @keyframes decide-glow {
      0%, 100% {
        filter: brightness(1);
        box-shadow:
          0 0 0 2px rgba(40, 12, 6, 0.92),
          0 0 18px rgba(255, 190, 80, 0.55),
          0 12px 26px rgba(0, 0, 0, 0.5);
      }
      50% {
        filter: brightness(1.22);
        box-shadow:
          0 0 0 2px rgba(40, 12, 6, 0.92),
          0 0 0 6px rgba(255, 220, 140, 0.55),
          0 0 36px rgba(255, 196, 80, 0.95),
          0 14px 28px rgba(0, 0, 0, 0.55);
      }
    }
    .cast-start:hover {
      box-shadow:
        0 0 0 2px rgba(40, 12, 6, 0.92),
        0 0 0 5px rgba(255, 190, 90, 0.5),
        0 0 36px rgba(255, 120, 30, 0.9),
        0 14px 28px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        inset 0 -10px 18px rgba(160, 30, 0, 0.4);
    }
    .cast-start[hidden] { display: none; }
    /* もどる と 挑戦開始 は、画面の一番下（もどるが左、挑戦開始が右） */
    .cast-actions {
      position: fixed;
      left: 50%;
      top: auto;
      right: auto;
      bottom: 0;
      z-index: 40;
      height: 76px;

    .cast-actions > button {

      justify-content: center;
      height: 52px;
      min-height: 52px;
      max-height: none;
      padding: 0 28px;
      line-height: 1;
      font-size: 20px;
      border-radius: 999px;
      letter-spacing: 0.12em;
    }
    .cast-actions > button.cast-start {
      height: 52px;
      min-height: 52px;
      max-height: none;
      padding: 0 36px;

    // 画面の外に足した絵は、iPhoneで遊ぶの回転に乗らない。ゲームと同じ枠へ載せる。
    function stageOn() {
      return document.documentElement.classList.contains("stage-fit");
    }

    function stageRotated() {
      return stageOn() && document.documentElement.classList.contains("iphone-play");
    }

    function stageScale() {
      if (!stageOn()) return 1;
      const n = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit"));
      return Number.isFinite(n) && n > 0 ? n : 1;
    }

    function stageBox() {
      if (stageOn()) return { w: root.offsetWidth, h: root.offsetHeight };
      return { w: window.innerWidth, h: window.innerHeight };
    }

    function viewportToStage(vx, vy) {
      if (!stageOn()) return { x: vx, y: vy };
      const rect = root.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = vx - cx;
      let dy = vy - cy;
      if (stageRotated()) {
        const turnedX = dy;
        const turnedY = -dx;
        dx = turnedX;
        dy = turnedY;
      }
      const s = stageScale();
      return {
        x: root.offsetWidth / 2 + dx / s,
        y: root.offsetHeight / 2 + dy / s,
      };
    }

    function stageFrameFromRect(rect) {
      const vw = rect.w != null ? rect.w : rect.width || 0;
      const vh = rect.h != null ? rect.h : rect.height || 0;
      const cx = rect.cx != null ? rect.cx : (rect.left || 0) + vw / 2;
      const cy = rect.cy != null ? rect.cy : (rect.top || 0) + vh / 2;
      if (!stageOn()) {
        return { cx, cy, w: vw, h: vh, left: cx - vw / 2, top: cy - vh / 2, width: vw, height: vh };
      }
      const c = viewportToStage(cx, cy);
      const s = stageScale();
      const w = (stageRotated() ? vh : vw) / s;
      const h = (stageRotated() ? vw : vh) / s;
      return { cx: c.x, cy: c.y, w, h, left: c.x - w / 2, top: c.y - h / 2, width: w, height: h };
    }

    function stageFrameOf(el) {
      const rect = el.getBoundingClientRect();
      const frame = stageFrameFromRect({ left: rect.left, top: rect.top, width: rect.width, height: rect.height });
      if (!stageOn() || !el.offsetWidth || !el.offsetHeight) return frame;
      return {
        cx: frame.cx,
        cy: frame.cy,
        w: el.offsetWidth,
        h: el.offsetHeight,
        left: frame.cx - el.offsetWidth / 2,
        top: frame.cy - el.offsetHeight / 2,
        width: el.offsetWidth,
        height: el.offsetHeight,
      };
    }

    function stageDelta(from, to) {
      return {
        dx: to.cx - from.cx,
        dy: to.cy - from.cy,
        scale: to.h / Math.max(1, from.h),
      };
    }

    function placeAnchored(el, anchor, opt = {}) {
      const bounds = stageBox();
      const frame = anchor instanceof Element ? stageFrameOf(anchor) : stageFrameFromRect(anchor);
      const pad = opt.pad ?? 8;
      const gap = opt.gap ?? 12;
      const w = opt.width || el.offsetWidth || opt.fallbackW || 0;
      const h = opt.height || el.offsetHeight || opt.fallbackH || 0;
      let sideLeft = false;
      let left = frame.left + frame.w + gap;
      if (opt.prefer === "left") {
        left = frame.left - gap - w;
        sideLeft = true;
      } else if (opt.prefer === "end") {
        left = frame.left + frame.w - w;
      } else if (left + w > bounds.w - pad) {
        left = frame.left - gap - w;
        sideLeft = true;
      }
      left = Math.max(pad, Math.min(left, Math.max(pad, bounds.w - w - pad)));
      let top = opt.align === "top" ? frame.top : frame.cy - h / 2;
      if (opt.above) top = frame.top - h - (opt.aboveGap ?? 10);
      top = Math.max(pad, Math.min(top, Math.max(pad, bounds.h - h - pad)));
      el.style.left = `${Math.round(left)}px`;
      el.style.top = `${Math.round(top)}px`;
      return { left, top, sideLeft, frame, w, h };
    }

      { name: "古城", label: "50", floors: 50, rank: "★★", art: "dungeon-50.jpg?v=1" },
      { name: "深淵", label: "100", floors: 100, rank: "★★★", art: "dungeon-100.jpg?v=1" },
    ];
    let dungeonName = "洞窟";
    let pendingDungeon = DUNGEON_LIST[0];
    let dungeonHover = "";
    let dungeonView = "";
    let dungeonLock = "";
    let meta = { uses: 0, clears: 0, stars: 0, cleared: {} };

    function clearNames(floors) {
      const raw = meta.cleared && meta.cleared[String(floors)];
      const asNow = (name) => (name === "女の戦士" ? "戦士" : name);
      if (raw === true) return ["戦士"];
      if (Array.isArray(raw)) return [...new Set(raw.filter(Boolean).map(asNow))];
      return [];
    }

    function dungeonClearedFloors(floors) {
      return clearNames(floors).length > 0;
    }

    /** 鎖の本数。0 なら挑戦可。100 は最大2本。 */
    function dungeonChainCount(floors) {
      const f = Number(floors) || 0;
      if (f <= 30) return 0;
      if (f === 50) return (dungeonClearedFloors(30) || dungeonClearedFloors(20)) ? 0 : 1;
      if (f >= 100) {
        let n = 2;
        if (dungeonClearedFloors(30) || dungeonClearedFloors(20)) n -= 1;
        if (dungeonClearedFloors(50)) n -= 1;
        return Math.max(0, n);
      }
      return 1;
    }

    function dungeonOpen(floors) {
      return dungeonChainCount(floors) === 0;
    }

    function markDungeonCleared(floors) {
      if (!meta.cleared || typeof meta.cleared !== "object") meta.cleared = {};
      const names = clearNames(floors);
      const who = heroCast || "戦士";
      if (!names.includes(who)) names.push(who);
      meta.cleared[String(floors)] = names;
    }

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      }[c]));
    }

    function trimLog() {
      while (logLines.length > 16) logLines.pop();
    }

    function logTurn(kind) {
      const text = kind === "player" ? `-${heroName()}のターン-` : "-敵のターン-";
      logLines.unshift({ kind, text, turn: Math.max(1, turn) });
      trimLog();
    }

    function escapeRegex(text) {
      return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    // ログ本文の名前に色を付ける。自分は青、敵は赤。長い名前から先に見る。
    function colorNames(text) {
      const me = heroName();
      const foe = enemy && enemy.name ? enemy.name : "";
      const names = [me, foe].filter(Boolean).sort((a, b) => b.length - a.length);
      if (!names.length) return esc(text);
      const pattern = new RegExp(`(${names.map(escapeRegex).join("|")})`, "g");
      return String(text).split(pattern).map((part, index) => {
        if (index % 2 === 0) return esc(part);
        return `<span class="${part === me ? "who-me" : "who-foe"}">${esc(part)}</span>`;
      }).join("");
    }

    function cardSnapshot(card) {
      if (!card || typeof card !== "object" || !card.name) return null;
      return {
        name: card.name,
        cost: card.cost || 0,
        text: card.text || "",
        damage: card.damage || 0,
        block: card.block || 0,
        focus: card.focus || 0,
        parry: !!card.parry,
        kind: card.kind || "",
        power: !!card.power,
        instant: !!card.instant,
        quick: !!card.quick,
        heal: card.heal || 0,
        press: !!card.press,
        poison: Number(card.poison) || 0,
        stars: card.stars || 1,
        note: card.note || "",
      };
    }

    function log(msg, card, foe) {
      const line = { text: msg };
      const snap = cardSnapshot(card);
      if (snap) line.card = snap;
      if (foe && snap) line.foe = true;
      const marker = logLines.findIndex((item) => item && item.kind);
      if (marker === -1) logLines.unshift(line);
      else {
        let at = marker + 1;
        while (at < logLines.length && !(logLines[at] && logLines[at].kind)) at += 1;
        logLines.splice(at, 0, line);
      }
      trimLog();
    }

    function clearTimer() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function stripFoePlus(name) {
      const raw = String(name || "");
      const cut = raw.match(/^(.*)\+(\d+)$/);
      return cut ? cut[1] : raw;
    }

    function enemyKey(name) {
      const base = stripFoePlus(name);
      return ENEMY_RENAME[base] || base;
    }

    function enemyByName(name) {
      const key = enemyKey(name);
      return ENEMIES.find((item) => item.name === key) || ENEMIES[0];
    }

    // この攻略で、今の敵と同じ相手に何回会ってきたか（いまの一回は含めない）
    function foeRepeat(at, list) {
      const path = list || route;
      const index = at == null ? battleIndex : at;
      const node = path[index];
      if (!node || isEventNode(node)) return 0;
      const base = enemyKey(node);
      let n = 0;
      for (let i = 0; i < index; i++) {
        if (isEventNode(path[i])) continue;
        if (enemyKey(path[i]) === base) n += 1;
      }
      return n;
    }

    function foeLabel(at, list) {
      const path = list || route;
      const index = at == null ? battleIndex : at;
      const base = enemyByName(path[index] || DUNGEON.boss).name;
      const n = foeRepeat(index, path);
      return n > 0 ? `${base}+${n}` : base;
    }

    function hiddenAtk(foe) {
      const plus = foe && foe.plus != null ? Number(foe.plus) || 0 : foeRepeat();
      const base = foe && foe.atkHidden != null
        ? Number(foe.atkHidden) || 0
        : HIDDEN_ATK[(foe && foe.rank) || "雑魚"] || 0;
      return base + plus;
    }

    // 再会1回につき、初回体力のおよそ4分の1。5刻み。
    function reunionHpBonus(foe) {
      const plus = foe && foe.plus != null ? Number(foe.plus) || 0 : foeRepeat();
      const base = Number(foe && foe.hp) || 0;
      const step = Math.round(base / 4 / 5) * 5;
      return plus * step;
    }

    function foeBattleHp(foe) {
      return (Number(foe && foe.hp) || 0) + reunionHpBonus(foe);
    }

    function hiddenDef(foe) {
      if (foe && foe.defHidden != null) return Number(foe.defHidden) || 0;
      return HIDDEN_DEF[(foe && foe.rank) || "雑魚"] || 0;
    }

    function enemyBasic(foe, name) {
      // 旧セーブの「アタック+」「ブロック+」は、いまのアタック／ブロックと同じ扱い
      const key = name === "アタック+" ? "アタック" : name === "ブロック+" ? "ブロック" : name;
      if (key === "アタック") {
        const dmg = (CARDS.アタック.damage || 4) + foeLiveAtk(foe);
        return { name: "アタック", cost: 1, text: `${dmg}ダメージ`, damage: dmg };
      }
      if (key === "ブロック") {
        const blk = CARDS.ブロック.block || 4;
        return { name: "ブロック", cost: 1, text: `ブロック${blk}`, block: blk };
      }
      return null;
    }

    function applyEnemyHidden(card, foe) {
      const basic = enemyBasic(foe, card && card.name);
      if (basic) return basic;
      const known = cardDef(card && card.name);
      if (known) return { name: card.name, ...known, stars: known.stars || 1 };
      return { ...card };
    }

    function foeLiveAtk(foe) {
      if (enemy && foe && enemyKey(enemy.name) === foe.name) return Number(enemy.atk) || 0;
      return hiddenAtk(foe);
    }

    function foeLiveDef(foe) {
      if (enemy && foe && enemyKey(enemy.name) === foe.name) return Number(enemy.def) || 0;
      return hiddenDef(foe);
    }

    function burnStacks(target) {
      return Math.max(0, Number(target && target.burn) || 0);
    }

    function addBurn(target, amount) {
      if (target === player && hasStatusImmune()) {
        log(`${heroName()}は${statusImmuneName()}。炎上を無視した。`);
        return false;
      }
      target.burn = burnStacks(target) + Math.max(1, Number(amount) || 1);
      if (target === player) syncGearStats();
      return true;
    }

    function syncEnemyDef() {
      if (!enemy) return;
      const foe = enemyNow();
      const angerCut = enemy.anger ? 2 : 0;
      enemy.def = hiddenDef(foe) - angerCut - (Number(enemy.defCut) || 0);
    }

    function enemyDef() {
      return (Number(enemy && enemy.def) || 0) - burnStacks(enemy);
    }

    const BURN_NOTE = "炎上は、受けた側のDEFを重なった数だけ下げる。この戦闘中だけ。終わると戻る。";
    const CRIT_NOTE = "書いた％の確率で、その1回のダメージが1.5倍になる。端数は切り上げ。％はカードごとに違う。";

    function burnBadge(stacks) {
      if (!stacks) return "";
      return `<span class="hint burn-mark">炎上+${stacks}<i>${esc(BURN_NOTE)}</i></span>`;
    }

    // 状態のアイコン札（戦闘画面の名前板に並べる）。重なるものは右に数字
    const FOCUS_NOTE = "集中は、次の攻撃カードか防御カードの数値に、その数だけ足す。使うと消える。";
    function statusIconSvg(kind) {
      if (kind === "poison") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.2 4.6 6.2 8.2 6.2 12.2a6.2 6.2 0 0 1-12.4 0C5.8 10.7 8.8 7.1 12 2.5z" fill="url(#g-poison)"/><circle cx="9.6" cy="14.2" r="1.3" fill="#2b0a3a"/><circle cx="14.4" cy="14.2" r="1.3" fill="#2b0a3a"/><path d="M9.4 17.4c1.6 1.2 3.6 1.2 5.2 0" stroke="#2b0a3a" stroke-width="1.4" stroke-linecap="round" fill="none"/><defs><linearGradient id="g-poison" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6b6ff"/><stop offset="1" stop-color="#8a3fd6"/></linearGradient></defs></svg>`;
      }
      if (kind === "burn") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.4 2c.6 4.2 5.1 6.3 5.1 11.3A5.6 5.6 0 0 1 6.3 13.6c0-2.2 1-3.6 1.9-4.8.3 1.9 1.3 2.7 2.2 2.8C9.6 8.4 11.6 5.2 12.4 2z" fill="url(#g-burn)"/><path d="M12 11.2c.3 2 2.3 2.8 2.3 4.8a2.3 2.3 0 0 1-4.6 0c0-1.1.6-1.9 1.1-2.4.2.8.6 1.1.9 1.1-.2-1.4.1-2.4.3-3.5z" fill="#fff3c4"/><defs><linearGradient id="g-burn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd25a"/><stop offset="1" stop-color="#e8471e"/></linearGradient></defs></svg>`;
      }
      if (kind === "parry") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l13 13M20 4L7 17" stroke="#dff0ff" stroke-width="3" stroke-linecap="round"/><path d="M4 4l13 13M20 4L7 17" stroke="#6fb0ff" stroke-width="1.2" stroke-linecap="round"/><path d="M15 18.6l2.4-2.4 2.6 2.6-2.4 2.4zM9 18.6l-2.4-2.4L4 18.8l2.4 2.4z" fill="#c9a24a"/></svg>`;
      }
      if (kind === "thorns") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l1.8 6.2H18l-1.2 3.4 2.4 6.4h-3.2L12 14.2 7.9 18.2H4.8l2.4-6.4L6 8.4h4.2z" fill="#d7ecc0"/><path d="M12 4.2l1.1 3.8h2.6l-.8 2.2 1.5 4.2h-2L12 12.2 9.6 14.4H7.7l1.5-4.2-.8-2.2H11z" fill="#4f7a3a"/></svg>`;
      }
      if (kind === "focus") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="#ffd67a" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#ffd67a" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="#fff3c4"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="#ffd67a" stroke-width="2" stroke-linecap="round"/></svg>`;
      }
      if (kind === "anger") {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l1.7 5.4 5.6.4-4.3 3.6 1.4 5.5L12 14.2 7.6 17.1l1.4-5.5L4.7 8l5.6-.4z" fill="#ff5a3c"/><path d="M12 6.2l.8 2.4 2.5.2-1.9 1.6.6 2.4L12 11.4l-2 .4.6-2.4-1.9-1.6 2.5-.2z" fill="#ffd0a0"/></svg>`;
      }
      return "";
    }
    function statusChip(kind, word, count, note, fresh) {
      const num = count > 0 ? `<b>${count}</b>` : "";
      return `<span class="status-chip ${kind}${fresh ? " fresh" : ""} hint" data-word="${esc(word)}" aria-label="${esc(word)}${count > 0 ? ` ${count}` : ""}">${statusIconSvg(kind)}${num}<i>${esc(note)}</i></span>`;
    }
    function statusChips(target, freshKind) {
      if (!target) return "";
      const parts = [];
      const poison = poisonStacks(target);
      if (poison) parts.push(statusChip("poison", "毒", poison, POISON_NOTE, freshKind === "poison"));
      const burn = burnStacks(target);
      if (burn) parts.push(statusChip("burn", "炎上", burn, BURN_NOTE));
      const parry = parryCount(target);
      if (parry) parts.push(statusChip("parry", "パリィ", parry > 1 ? parry : 0, PARRY_NOTE));
      const thorns = thornCount(target);
      if (thorns) parts.push(statusChip("thorns", "トゲ", thorns > 1 ? thorns : 0, THORN_NOTE));
      if (target === player && player.focus) parts.push(statusChip("focus", "集中", player.focus, FOCUS_NOTE));
      return parts.join("");
    }

    function rollRank() {
      const names = combatNames(dungeonName, eventBattleSeen);
      if (!names.length) return "スライム";
      return names[Math.floor(Math.random() * names.length)];
    }

    function enemyStar(foe) {
      return Number(foe.tier) || starsForRank(foe.rank);
    }

    function dungeonStarCount(name) {
      const item = DUNGEON_LIST.find((dungeon) => dungeon.name === (name || dungeonName));
      return String((item && item.rank) || "★").split("★").length - 1;
    }

    function combatNames(name, withBeggar) {
      const star = dungeonStarCount(name);
      return ENEMIES.filter((foe) => {
        if (foe.name === "ハデス") return false;
        if (foe.home) return foe.home === name;
        if (enemyStar(foe) !== star) return false;
        if (foe.name === "物乞い" && !withBeggar) return false;
        return true;
      }).map((foe) => foe.name);
    }

    function pickWeighted(list, weightOf) {
      if (!list.length) return null;
      let total = 0;
      const weights = list.map((item) => {
        const weight = Math.max(0, Number(weightOf(item)) || 0);
        total += weight;
        return weight;
      });
      if (total <= 0) return list[Math.floor(Math.random() * list.length)];
      let roll = Math.random() * total;
      for (let i = 0; i < list.length; i += 1) {
        roll -= weights[i];
        if (roll < 0) return list[i];
      }
      return list[list.length - 1];
    }

    function rarityWeight(stars) {
      const n = Math.max(1, Number(stars) || 1);
      if (n <= 1) return 4;
      if (n === 2) return 2;
      return 1;
    }

    function enchantWeight(id) {
      return id === "light" ? 2 : 3;
    }

    function takeWeighted(list, count, weightOf) {
      const left = list.slice();
      const out = [];
      while (out.length < count && left.length) {
        const pick = pickWeighted(left, weightOf);
        const at = left.indexOf(pick);
        if (at < 0) break;
        out.push(left.splice(at, 1)[0]);
      }
      return out;
    }

    function freshRoute() {
      return buildRoute(30, "洞窟");
    }

    function randBetween(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    function bossStops(name, floors) {
      if (name === "洞窟") return [floors];
      if (name === "古城") return [25, 50].filter((n) => n <= floors);
      if (name === "深淵") return [20, 40, 60, 80, 100].filter((n) => n <= floors);
      return [floors];
    }

    function bagSpans(name, floors) {
      if (name === "洞窟") return [{ from: 1, to: Math.max(1, floors - 2), combat: [11, 17] }];
      if (name === "古城") return [
        { from: 1, to: 23, combat: [9, 14] },
        { from: 26, to: 48, combat: [9, 14] },
      ];
      if (name === "深淵") {
        return [20, 40, 60, 80, 100].filter((n) => n <= floors).map((boss) => ({
          from: boss - 19,
          to: boss - 2,
          combat: [7, 11],
        }));
      }
      return [{ from: 1, to: Math.max(1, floors - 2), combat: [7, 11] }];
    }

    const PATH_FILL = ["search", "beggar", "shop", "camp", "train", "lost", "unknown", "smith"];
    const VICTORY_EXTRA = {
      road: { none: 0.7, gear: 0.1, item: 0.1, enchant: 0.1 },
      boss: { none: 0, gear: 1 / 3, item: 1 / 3, enchant: 1 / 3 },
    };
    const EXTRA_ITEM_NAMES = ["ベッド", "ホテル", "臆病者の構え"];
    const BLESS_KINDS = ["maxhp", "spd", "gear", "card", "enchant"];
    const ENCOUNTER_BEGGAR = 0.5;

    function fillSpan(span) {
      const size = Math.max(0, span.to - span.from + 1);
      const combats = Math.min(size, randBetween(span.combat[0], span.combat[1]));
      const bag = [];
      for (let i = 0; i < combats; i++) bag.push("straight");
      for (let i = combats; i < size; i++) bag.push(PATH_FILL[Math.floor(Math.random() * PATH_FILL.length)]);
      return bag;
    }

    function isEventNode(name) {
      return String(name || "").startsWith("出来事:");
    }

    // 0層目は祝福。1Fは戦闘固定。ボスとその直前の休憩も固定。ほかの階は空欄で、選ぶときに袋から入れる。
    function buildRoute(floors, name) {
      const route = new Array(floors + 1).fill(null);
      route[0] = "出来事:祝福";
      fixedRestAt = [];
      for (const boss of bossStops(name, floors)) {
        route[boss] = DUNGEON.boss;
        if (boss > 1) {
          route[boss - 1] = "出来事:キャンプ";
          fixedRestAt.push(boss - 1);
        }
      }
      pathBag = [];
      for (const span of bagSpans(name, floors)) pathBag.push(...fillSpan(span));
      return route;
    }

    // 表示する層の番号。先頭が祝福なら、それを0層目として数える。
    // 最大はダンジョンの階数。寄り道で足した戦闘は、次の階層の番号を共有し、最大は増やさない。
    function floorStart() { return route[0] === "出来事:祝福" ? 1 : 0; }
    function floorsOf(name) {
      const item = DUNGEON_LIST.find((dungeon) => dungeon.name === name);
      return item ? item.floors : 30;
    }
    function rememberFloors(floors) {
      const blessing = route[0] === "出来事:祝福";
      dungeonFloors = floors || dungeonFloors || floorsOf(dungeonName);
      floorAt = route.map((_, i) => Math.min(dungeonFloors, blessing ? i : i + 1));
      clampBlessingNext();
    }

    // 祝福0の次が2に飛ぶ古い番号を、1から数え直す。10のお店と最後のボスは元の階に戻す。
    function clampBlessingNext() {
      if (!route.length || route[0] !== "出来事:祝福" || floorAt.length !== route.length) return;
      floorAt[0] = 0;
      const jump = Number(floorAt[1]) - 1;
      if (!(jump > 0)) return;
      const shop = route.findIndex((node, i) => i > 1 && node === "出来事:お店" && Number(floorAt[i]) >= 10);
      for (let i = 1; i < floorAt.length; i++) floorAt[i] = Math.max(1, Number(floorAt[i]) - jump);
      if (shop > 0 && floorAt[shop] < 10) {
        const back = 10 - floorAt[shop];
        floorAt[shop] = 10;
        for (let i = shop + 1; i < floorAt.length; i++) floorAt[i] = Math.min(dungeonFloors, Number(floorAt[i]) + back);
      }
      const boss = route.lastIndexOf(DUNGEON.boss);
      if (boss > 0) floorAt[boss] = dungeonFloors;
    }
    function floorNo() {
      if (floorAt && battleIndex >= 0 && battleIndex < floorAt.length && floorAt[battleIndex] != null && !Number.isNaN(Number(floorAt[battleIndex]))) {
        return Number(floorAt[battleIndex]);
      }
      return Math.max(1, battleIndex + 1 - floorStart());
    }
    function fadeSandwichMarkup(inner, { tag = "span", className = "" } = {}) {
      const extra = className ? ` ${className}` : "";
      return `<${tag} class="fade-sandwich${extra}"><i class="fade-line" aria-hidden="true"></i>${inner}<i class="fade-line" aria-hidden="true"></i></${tag}>`;
    }
    function eventFloorMarkHtml() {
      return fadeSandwichMarkup(`<span class="event-floor-num">${floorNo()}Ｆ</span>`, { tag: "small", className: "event-floor-mark" });
    }
    function pathFloorNowHtml() {
      return fadeSandwichMarkup(`<span class="event-floor-num">${floorNo()}Ｆ</span>`, { tag: "p", className: "path-now" });
    }
    function eventFloorFlashHtml() {
      return `<div class="event-floor-call" aria-hidden="true">${fadeSandwichMarkup(`<b>現在 ${floorNo()}Ｆ</b>`, { tag: "div" })}</div>`;
    }
    function floorMax() { return dungeonFloors; }
    function floorLabel() { return `最大${floorMax()}Ｆ`; }

    // イベント戦闘。階層は進まない。階のアニメも「2Ｆ」も出さない。
    // 物乞いは、物乞いイベント（遭遇で物乞いになったときも含む）に付随する。
    function eventBattleKind() {
      if (beggarBattle) return "物乞い";
      return "";
    }

    function isEventBattle() {
      return !!eventBattleKind();
    }

    function openBattleIntro() {
      const eventFight = isEventBattle();
      floorCall = !eventFight;
      encounter = eventFight;
      intentShown = false;
      render();
      timer = setTimeout(eventFight ? beginEncounter : showEncounter, eventFight ? 1600 : 1400);
    }
    function insertAhead(node) {
      const at = Math.min(Math.max(battleIndex + 1, 0), route.length);
      route.splice(at, 0, node);
      const mark = floorAt[at] != null ? floorAt[at] : (floorAt.length ? floorAt[floorAt.length - 1] : dungeonFloors);
      floorAt.splice(at, 0, mark);
      battleTotal = route.length;
    }

    function roadFace(node) {
      const name = String(node || "");
      if (name === "出来事:祝福") return { src: "path-bless-v4.jpg?v=1", label: "祝福" };
      if (name === "出来事:探索") return { src: "path-search.jpg?v=13", label: "探索" };
      if (name === "出来事:未知") return { src: "path-unknown.jpg?v=9", label: "遭遇" };
      if (name === "出来事:キャンプ") return { src: "path-rest.jpg?v=3", label: "休憩" };
      if (name === "出来事:お店") return { src: "path-shop.jpg?v=12", label: "お店" };
      if (name === "出来事:物乞い") return { src: "path-beggar.jpg?v=6", label: "物乞い" };
      if (name === "出来事:修行") return { src: "path-train.jpg?v=5", label: "修行" };
      if (name === "出来事:鍛冶屋") return { src: "path-smith.svg?v=2", label: "鍛冶屋" };
      if (name === DUNGEON.boss) return { src: "path-boss.jpg?v=2", label: "ボス戦", boss: true };
      if (!name) return { mark: "？", label: "" };
      return { src: "path-fight.jpg?v=5", label: "戦闘" };
    }

    function roadTone(node) {
      const name = String(node || "");
      if (name === "出来事:キャンプ") return "rest";
      if (name.startsWith("出来事:")) return "other";
      return "fight";
    }

    function roadFixed(node, index) {
      const name = String(node || "");
      if (name === "出来事:祝福" || name === DUNGEON.boss) return true;
      if (name === "出来事:キャンプ" && fixedRestAt.indexOf(index) >= 0) return true;
      if (index === 1 && route[0] === "出来事:祝福" && (!node || !isEventNode(name))) return true;
      if (!Array.isArray(pathBag)) {
        const num = floorAt[index] != null ? floorAt[index] : index;
        if (num === 10 && name === "出来事:お店") return true;
      }
      return false;
    }

    function isBlessingFloor0() {
      return route[0] === "出来事:祝福" && battleIndex === 0;
    }

    function roadPlacedAhead(i) {
      return i === battleIndex + 1 && route[i] && (rewardStep === "flying" || rewardStep === "done");
    }

    function roadDoneBelow(now) {
      let el = now.nextElementSibling;
      while (el) {
        if (el.classList.contains("pad")) {
          el = el.nextElementSibling;
          continue;
        }
        if (el.classList.contains("road-node")) return el;
        break;
      }
      return null;
    }

    function roadMapHtml() {
      if (!route || !route.length) return "";
      const blessing = route[0] === "出来事:祝福";
      const rows = route.map((node, i) => ({ node, i })).reverse().map(({ node, i }) => {
        const state = i < battleIndex ? "done" : i === battleIndex ? "now" : "ahead";
        const visited = state !== "ahead";
        const slotFixed = roadFixed(node, i);
        const known = node
          ? (visited || slotFixed || roadPlacedAhead(i))
          : slotFixed;
        const face = known
          ? (node ? roadFace(node) : { src: "path-fight.jpg?v=5", label: "戦闘" })
          : { label: "" };
        const num = floorAt[i] != null ? floorAt[i] : (blessing ? i : i + 1);
        const floor = `${num}F`;
        const icon = face.src
          ? `<img src="${face.src}" alt="">`
          : `<i aria-hidden="true"></i>`;
        const capFloor = `<span class="road-floor">${floor}</span>`;
        const fixed = slotFixed;
        const tone = known ? (fixed ? "fight" : roadTone(node)) : "";
        const name = known && face.label ? `<span class="road-name">${esc(face.label)}</span>` : "";
        const lock = fixed
          ? `<span class="road-lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5.5" y="11" width="13" height="9.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8.5 11V8.6a3.5 3.5 0 0 1 7 0V11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15.6" r="1.5" fill="currentColor"/></svg></span>`
          : "";
        const here = state === "now"
          ? `<span class="road-here-mark" aria-label="現在地"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.7 2 6 4.8 6 8.2c0 4.5 6 13.8 6 13.8s6-9.3 6-13.8C18 4.8 15.3 2 12 2zm0 5.4a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4z" fill="currentColor"/></svg><b>現在地</b></span>`
          : "";
        return `<li class="road-node ${state}${face.boss ? " boss" : ""}${fixed ? " fixed" : ""}${tone ? ` tone-${tone}` : ""}">${here}${icon}${lock}<span class="road-cap">${capFloor}${name}</span></li>`;
      }).join("");
      // 0F祝福だけ現在地をマップ最下段に。それ以外の開始直後は下に見えないパッドで従来どおり余白
      const pad = battleIndex === 0 && !isBlessingFloor0() ? `<li class="road-node pad" aria-hidden="true"></li>` : "";
      return `<section class="road-map" aria-label="マップ"><h2>マップ</h2><ol>${rows}${pad}</ol><button type="button" class="road-back" data-action="road-home" hidden>現在地に戻る</button></section>`;
    }

    let roadHold = null;

    function roadHomeTop(ol, now) {
      if (isBlessingFloor0()) return Math.max(0, now.offsetTop + now.offsetHeight - ol.clientHeight);
      const prev = roadDoneBelow(now);
      if (prev) return Math.max(0, prev.offsetTop + prev.offsetHeight - ol.clientHeight);
      const row = now.offsetHeight || ol.clientHeight / 5;
      return Math.max(0, now.offsetTop + now.offsetHeight + row - ol.clientHeight);
    }

    function syncRoadHomeButton(ol) {
      const map = ol.closest(".road-map");
      const btn = map && map.querySelector(".road-back");
      const now = ol.querySelector(".road-node.now");
      if (!btn || !now) return;
      const leftView = now.offsetTop >= ol.scrollTop + ol.clientHeight - 1;
      btn.hidden = !leftView;
    }

    function bindRoadScroll(ol) {
      if (ol.dataset.roadBound) return;
      ol.dataset.roadBound = "1";
      ol.addEventListener("scroll", () => {
        roadHold = { index: battleIndex, top: ol.scrollTop };
        syncRoadHomeButton(ol);
      }, { passive: true });
    }

    function placeRoad(mode) {
      document.querySelectorAll(".road-map ol").forEach((ol) => {
        const now = ol.querySelector(".road-node.now");
        if (!now) return;
        bindRoadScroll(ol);
        const home = roadHomeTop(ol, now);
        const same = roadHold && roadHold.index === battleIndex;
        const top = mode || !same ? home : roadHold.top;
        ol.scrollTop = top;
        roadHold = { index: battleIndex, top };
        syncRoadHomeButton(ol);
      });
    }

    function schedulePlaceRoad() {
      requestAnimationFrame(() => requestAnimationFrame(() => placeRoad()));
    }

    function enemyNow() {
      if (beggarBattle) {
        const foe = enemyByName("物乞い");
        return { ...foe, plus: 0 };
      }
      const foe = enemyByName(route[battleIndex] || DUNGEON.boss);
      return { ...foe, plus: foeRepeat() };
    }

    function bossNow() {
      return battleIndex === route.lastIndexOf(DUNGEON.boss);
    }

    // 絵の余白。見える体の高さを自分に合わせるときに使う。
    const FOE_INK = {
      "enemy-slime.png": { w: 864, h: 1152, top: 133, bottom: 136 },
      "enemy-goblin.png": { w: 864, h: 1152, top: 86, bottom: 72 },
      "enemy-minotaur.png": { w: 864, h: 1152, top: 1, bottom: 0 },
      "enemy-dragon.png": { w: 864, h: 1152, top: 132, bottom: 98 },
      "enemy-beggar.png": { w: 1024, h: 1024, top: 24, bottom: 25 },
    };

    function foeInkVars() {
      const src = String((enemy && enemy.image) || "").split("?")[0];
      const ink = FOE_INK[src] || { w: 864, h: 1152, top: 0, bottom: 0 };
      const inkH = Math.max(1, ink.h - ink.top - ink.bottom);
      const mid = (ink.top + inkH / 2) / ink.h;
      return `--img-w:${ink.w};--img-h:${ink.h};--ink-h:${inkH};--ink-bottom:${(ink.bottom / ink.h).toFixed(4)};--ink-mid:${mid.toFixed(4)}`;
    }

    // 見える大きさは自分基準。雑魚0.8、普通1.2、強敵とボスは2。大きいほうが枠に収まる。
    function foeSize() {
      if (bossNow()) return "boss";
      const rank = (enemyNow() && enemyNow().rank) || "普通";
      if (rank === "雑魚") return "small";
      if (rank === "強敵") return "large";
      return "medium";
    }

    function fxLabFoeSize(name) {
      const foe = enemyByName(name || fxLabFoeName);
      const rank = String(foe.rank || "普通");
      if (rank === "★★★★" || foe.name === DUNGEON.boss) return "boss";
      if (rank === "雑魚") return "small";
      if (rank === "強敵") return "large";
      return "medium";
    }

    function fxLabFoeImage(name) {
      return (enemyByName(name || fxLabFoeName).image) || "";
    }

    function addDetourFight() {
      const current = enemyNow();
      const tier = current.name === DUNGEON.boss ? DUNGEON.road[DUNGEON.road.length - 1] : (current.tier || 1);
      const extra = rollRank(tier);
      insertAhead(extra);
    }

    function signed(n) {
      const value = n || 0;
      if (value > 0) return `+${value}`;
      if (value < 0) return String(value);
      return "0"; // ±0 とは書かない
    }

    const GEAR_ITEMS = [
      { id: "short-sword", name: "ショートソード", slot: "sword", stars: 1, atk: 1, starterGear: true, effect: "★　ATK+1", image: "gear-short-sword.jpg?v=4" },
      { id: "long-sword", name: "ロングソード", slot: "sword", stars: 1, atk: 2, effect: "★　ATK+2", image: "gear-long-sword.jpg?v=4" },
      { id: "poison-sword", name: "ポイズンソード", slot: "sword", stars: 3, atk: 1, poisonHit: 1, effect: "★★★　ATK+1。アタックカードでダメージを与えるたび毒+1（敵のシールドでも毒は入る）", image: "gear-poison-sword.jpg?v=6" },
      { id: "excalibur", name: "大天使の剣", slot: "sword", stars: 5, atk: 5, ignoreTrait: true, effect: "★★★★★　ATK+5。相手の特性を無視してダメージを与える", image: "gear-excalibur.jpg?v=6" },

      { id: "chain-attack", name: "連撃の腕輪", slot: "braceletAny", stars: 4, effect: "★★★★　手札に攻撃がないとき、山札から攻撃カードを引く。アクセサリー枠。", image: "gear-chain-attack.jpg?v=7" },
      { id: "chain-guard", name: "連守の腕輪", slot: "braceletAny", stars: 4, effect: "★★★★　手札に防御がないとき、山札から防御カードを引く。アクセサリー枠。", image: "gear-chain-guard.jpg?v=7" },
      { id: "power-bracelet", name: "力の腕輪", slot: "braceletAny", stars: 2, atk: 3, effect: "★★　アクセサリー。ATK+3", image: "gear-power-bracelet.jpg?v=6" },
      { id: "guard-bracelet", name: "守りの腕輪", slot: "braceletAny", stars: 2, def: 3, effect: "★★　アクセサリー。DEF+3", image: "gear-guard-bracelet.jpg?v=8" },
      { id: "reuse-bracelet", name: "再利用の腕輪", slot: "braceletAny", stars: 3, carryMana: true, effect: "★★★　使わなかったマナを次のターンへ持ち越す。持ち越し分はオレンジの一時マナで、使うと空枠を残さず消える", image: "gear-reuse-bracelet.jpg?v=7" },
    ];
    // ボスの報酬だけで手に入る。ランダムな装備には入れない。レアリティは★★★。分類は戦利品。
    const BOSS_GEAR = [
      { id: "minotaur-medal", name: "ミノタウロスのメダル", slot: "medal", boss: true, stars: 3, effect: "ボス　自分の体力が最大の半分以下のあいだ、ATK+2。上に戻ると消える。", image: "gear-medal.jpg?v=3", halfAtk: 2 },
      { id: "minotaur-bracelet", name: "ミノタウロスの腕輪", slot: "braceletAny", boss: true, stars: 3, effect: "ボス　アクセサリー枠。自分のターン開始時に体力が最大の半分以下なら、そのターンのマナが1増える。", image: "gear-bracelet.jpg?v=4", halfMana: 1 },
    ];

    function gearRarityText(item) {
      if (!item) return "";
      const n = Number(item.stars) || 0;
      return n > 0 ? "★".repeat(n) : "";
    }

    function gearTitle(item, fallback) {
      if (!item || !item.name) return fallback || "";
      return item.name;
    }

    function emptyGear() {
      return { sword: null, shield: null, braceletR: null, braceletL: null, medal: null, medals: 0 };
    }

    function hpHalf(target) {
      return !!target && target.hp <= target.maxHp / 2;
    }

    function swordIgnoresTrait() {
      return !!(gear && gear.sword && gear.sword.ignoreTrait);
    }

    function hasGear(id) {
      return ["sword", "shield", "braceletR", "braceletL", "medal"].some((key) => gear[key] && gear[key].id === id);
    }

    function isAccessorySlot(slot) {
      return slot === "braceletL" || slot === "braceletR" || slot === "braceletAny";
    }

    function giveGear(item) {
      if (!item) return;
      if (isAccessorySlot(item.slot)) {
        const key = !gear.braceletL ? "braceletL" : !gear.braceletR ? "braceletR" : "braceletL";
        gear[key] = { ...item };
      } else {
        gear[item.slot] = { ...item };
      }
      syncGearStats();
    }

    function needsWeaponReplace(item) {
      return !!(item && item.slot === "sword" && gear && gear.sword);
    }

    function weaponAtk(item) {
      return Number(item && item.atk) || 0;
    }

    function weaponExtra(item) {
      if (!item) return "";
      const bits = [];
      if (Number(item.poisonHit) > 0) bits.push(`アタックで毒+${item.poisonHit}（シールドでも）`);
      if (Number(item.burnHit) > 0) bits.push(`ダメージを通すたび炎上+${item.burnHit}`);
      if (item.ignoreTrait) bits.push("相手の特性を無視してダメージ");
      return bits.join("。");
    }

    function hasReuseBracelet() {
      return !!(gear && ((gear.braceletL && gear.braceletL.carryMana) || (gear.braceletR && gear.braceletR.carryMana)));
    }

    function statusImmuneName() {
      if (gear && gear.shield && gear.shield.statusImmune) return gear.shield.name;
      return "魔法のパリィ";
    }

    function hasStatusImmune() {
      if (gear && gear.shield && gear.shield.statusImmune) return true;
      return !!(player && player.magicParry && parryCount(player) > 0);
    }

    function hasThornsDef() {
      return !!(gear && gear.shield && gear.shield.thornsDef);
    }

    function thornCount(target) {
      const base = Math.max(0, Number(target && target.thorns) || 0);
      if (target && player && target === player && hasThornsDef()) return base + Math.max(0, Number(player.def) || 0);
      return base;
    }

    function syncEnergyTotal() {
      if (!player) return;
      player.baseEnergy = Math.max(0, Number(player.baseEnergy) || 0);
      player.tempEnergy = Math.max(0, Number(player.tempEnergy) || 0);
      player.baseMax = Math.max(0, Number(player.baseMax) || 0);
      player.energy = player.baseEnergy + player.tempEnergy;
      player.maxEnergy = player.baseMax + player.tempEnergy;
    }

    function spendEnergy(cost) {
      let left = Math.max(0, Number(cost) || 0);
      const fromTemp = Math.min(Math.max(0, Number(player.tempEnergy) || 0), left);
      player.tempEnergy = (Number(player.tempEnergy) || 0) - fromTemp;
      left -= fromTemp;
      player.baseEnergy = Math.max(0, (Number(player.baseEnergy) || 0) - left);
      syncEnergyTotal();
    }

    function refundEnergy(cost) {
      let left = Math.max(0, Number(cost) || 0);
      const room = Math.max(0, (Number(player.baseMax) || 0) - (Number(player.baseEnergy) || 0));
      const toBase = Math.min(room, left);
      player.baseEnergy = (Number(player.baseEnergy) || 0) + toBase;
      left -= toBase;
      if (left > 0) player.tempEnergy = (Number(player.tempEnergy) || 0) + left;
      syncEnergyTotal();
    }

    function weaponChangeText(keep, item) {
      const from = weaponAtk(keep);
      const to = weaponAtk(item);
      const d = to - from;
      const atk = d === 0
        ? `<span class="same">ATKは${signed(from)}のまま</span>`
        : d > 0
          ? `<span class="up">ATKが${signed(from)}から${signed(to)}になる（+${d}）</span>`
          : `<span class="down">ATKが${signed(from)}から${signed(to)}になる（${d}）</span>`;
      const extraKeep = weaponExtra(keep);
      const extraNew = weaponExtra(item);
      let extra = "";
      if (!extraKeep && extraNew) extra = `。新たに「${extraNew}」が付く`;
      else if (extraKeep && !extraNew) extra = `。「${extraKeep}」は無くなる`;
      else if (extraKeep && extraNew && extraKeep !== extraNew) extra = `。効果が「${extraNew}」に変わる`;
      return atk + extra;
    }

    function offerWeapon() {
      return false;
    }

    function gearSideMarkup(item, label, cls, level) {
      if (!item) return "";
      const slot = item.slot || "sword";
      const special = esc(gearSpecialText(item));
      const face = gearPopShell(slot, {
        item,
        name: item.name || "",
        image: item.image || "",
        rarity: gearRarityText(item),
        body: special,
        embedded: true,
      });
      return `<div class="gear-compare-card${cls ? " " + cls : ""}${rareClass(level || 0)}"${rareStyle(level || 0, 0)}>${rareFx(level || 0)}<p class="gear-compare-label">${esc(label)}</p>${face}</div>`;
    }

    function gearOfferMarkup() {
      const offer = gearOffer;
      if (!offer) return "";
      const live = takeRare("gear");
      const lv = live ? rareLevel(offer.item) : 0;
      const shop = offer.source === "shop" && offer.price != null;
      const yes = shop ? `付け替える（★${offer.price}）` : "付け替える";
      return `<div class="overlay gear-offer">${rareScreen(lv ? [lv] : [])}<div class="panel"><h2>武器を付け替える？</h2>
        <p class="gear-offer-lead">${weaponChangeText(offer.keep, offer.item)}</p>
        <div class="gear-compare${rareJack(lv ? [lv] : [])}">${gearSideMarkup(offer.keep, "いまの武器")}<div class="arrow" aria-hidden="true">→</div>${gearSideMarkup(offer.item, "新しい武器", "new", lv)}</div>
        <p>${shop ? `付け替えたときだけ ★${offer.price} 払う。今のままなら払わない。` : "今の武器のままなら、新しい武器は手に入らない。"}</p>
        <div class="gear-offer-actions">
          <button type="button" class="primary" data-action="gear-offer-yes">${esc(yes)}</button>
          <button type="button" data-action="gear-offer-no">今の武器のまま</button>
        </div>
      </div></div>`;
    }

    function paintGearOffer() {
      if (!gearOffer) return;
      root.insertAdjacentHTML("beforeend", gearOfferMarkup());
    }

    function acceptGearOffer() {
      const offer = gearOffer;
      if (!offer) return;
      if (offer.source === "shop") {
        const price = Number(offer.price) || 0;
        const have = Number(meta.stars) || 0;
        if (have < price) return;
        meta.stars = have - price;
        persistMeta();
        const slot = shopStock && shopStock[offer.shopIndex];
        if (slot) slot.sold = true;
      }
      giveGear(offer.item);
      if (offer.source === "gift") {
        floorGift = { kind: "gear", gear: { ...offer.item } };
        floorNote = `${offer.item.name}に付け替えた。`;
      }
      if (offer.source === "boss") {
        bossPicks = [];
        gearOffer = null;
        offerPathsOrAdvance();
        return;
      }
      gearOffer = null;
      persistSave(true);
      render();
    }

    function declineGearOffer() {
      const offer = gearOffer;
      if (!offer) return;
      gearOffer = null;
      if (offer.source === "gift") {
        floorGift = null;
        floorNote = `${offer.keep.name}のままにした。`;
      }
      if (offer.source === "boss") {
        bossPicks = [];
        gearOffer = null;
        offerPathsOrAdvance();
        return;
      }
      persistSave(true);
      render();
    }

    function starterGear() {
      return emptyGear();
    }

    function gearItem(id) {
      return GEAR_ITEMS.find((item) => item.id === id) || BOSS_GEAR.find((item) => item.id === id) || null;
    }

    function normalizeGear(data) {
      const next = emptyGear();
      if (!data) return next;
      for (const key of ["sword", "shield", "braceletR", "braceletL", "medal"]) {
        const item = data[key] && gearItem(data[key].id);
        const fits = item && (item.slot === key || (isAccessorySlot(item.slot) && isAccessorySlot(key)));
        if (fits) next[key] = { ...item };
      }
      const medals = Math.floor(Number(data.medals) || 0);
      next.medals = medals > 0 ? medals : 0;
      return next;
    }

    function gearStatSum(stat) {
      let n = 0;
      for (const key of ["sword", "shield", "braceletR", "braceletL"]) {
        const item = gear && gear[key];
        if (item && item[stat]) n += Number(item[stat]) || 0;
      }
      return n;
    }

    function syncGearStats() {
      if (!player) return;
      const atkMod = Number(player.atkMod) || 0;
      const defMod = Number(player.defMod) || 0;
      const medalAtk = gear.medal && gear.medal.halfAtk && hpHalf(player) ? gear.medal.halfAtk : 0;
      player.atk = gearStatSum("atk") + atkMod + medalAtk + levelStep();
      player.def = gearStatSum("def") + defMod + levelStep() - burnStacks(player);
    }

    function medalIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 1.1h7.6L14.4 7.4h-4.8z"/><circle cx="12" cy="14.6" r="7.6" fill="currentColor"/><path fill="#1a120c" d="M12 10.2l1.2 2.5h2.7l-2.2 1.6.85 2.6L12 15.3l-2.55 1.6.85-2.6-2.2-1.6h2.7z"/></svg>`;
    }

    function braceletIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2.2 13.1C2.2 8.4 6.5 4.8 12 4.8s9.8 3.6 9.8 8.3-4.3 7.5-9.8 7.5-9.8-3.2-9.8-7.5zm4.3.2c0 2.1 2.5 3.6 5.5 3.6s5.5-1.5 5.5-3.6-2.5-3.6-5.5-3.6-5.5 1.5-5.5 3.6z"/></svg>`;
    }

    function itemIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" d="M9.2 3.2h5.6M10.2 3.2v3.6L7 14.2a4.6 4.6 0 0 0 4.2 6.6h1.6A4.6 4.6 0 0 0 17 14.2L13.8 6.8V3.2"/><path fill="currentColor" opacity="0.55" d="M8.4 14.6h7.2l-.8 1.8a3 3 0 0 1-2.8 1.8h-.8a3 3 0 0 1-2.8-1.8z"/></svg>`;
    }

    function shownGearSlot() {
      return gearHover || gearOpen || "";
    }

    function gearMarkup() {
      const shown = shownGearSlot();
      const slotButton = (slot) => {
        const item = gear[slot.id];
        const picture = item && item.image
          ? `<img src="${esc(item.image)}" alt="">`
          : `<span class="gear-mark">${slot.icon}</span>`;
        const title = item && item.name ? gearTitle(item) : slot.label;
        const active = shown === slot.id;
        return `<button type="button" class="gear-slot${item ? " filled" : ""}${active ? (gearOpen === slot.id ? " open" : " hot") : ""}" data-gear="${slot.id}" aria-label="${esc(slot.aria || title)}"><span class="gear-frame">${picture}</span></button>`;
      };
      const sword = slotButton({ id: "sword", label: "剣", icon: swordIcon() });
      const shield = slotButton({ id: "shield", label: "盾", icon: shieldIcon() });
      const left = slotButton({ id: "braceletL", label: "アクセサリー", aria: "アクセサリー", icon: braceletIcon() });
      const right = slotButton({ id: "braceletR", label: "アクセサリー", aria: "アクセサリー", icon: braceletIcon() });
      const medalN = Math.max(gear && gear.medal ? 1 : 0, Math.floor(Number(gear && gear.medals) || 0));
      const medalSrc = (gear && gear.medal && gear.medal.image) || "gear-medal.jpg?v=3";
      const medals = Array.from({ length: medalN }, () => `<button type="button" class="gear-slot filled${shownGearSlot() === "medal" ? (gearOpen === "medal" ? " open" : " hot") : ""}" data-gear="medal" aria-label="戦利品"><span class="gear-frame"><img src="${esc(medalSrc)}" alt=""></span></button>`).join("");
      return `<div class="gear-board">${sword}${shield}${left}${right}${medals}</div>`;
    }

    function gearSlotLabel(slotId) {
      if (slotId === "sword") return "剣";
      if (slotId === "shield") return "盾";
      if (slotId === "braceletL" || slotId === "braceletR" || slotId === "braceletAny") return "アクセサリー";
      if (slotId === "medal") return "戦利品";
      if (slotId === "hp") return "体力";
      if (slotId === "mana") return "マナ";
      if (slotId === "spd") return "SPD";
      return "装備";
    }

    function gearSlotIcon(slotId) {
      if (slotId === "sword") return swordIcon();
      if (slotId === "shield") return shieldIcon();
      if (slotId === "braceletL" || slotId === "braceletR" || slotId === "braceletAny") return braceletIcon();
      if (slotId === "medal") return medalIcon();
      return itemIcon();
    }

    function gearEffectPlain(item) {
      let text = String((item && item.effect) || "");
      return text.trim();
    }

    function gearTraitOneLine(text) {
      return String(text || "")
        .replace(/\r\n?/g, "\n")
        .replace(/\s*\n+\s*/g, " ")
        .replace(/[ \u3000]{2,}/g, " ")
        .trim();
    }

    function gearSpecialText(item) {
      if (!item) return "";
      if (item.statusImmune) return "状態異常にならない";
      if (item.ignoreTrait) return "相手の特性を無視してダメージを与える";
      if (item.thornsDef) return "自分のDEFだけトゲを得る。";
      if (Number(item.poisonHit) > 0) return "アタックカードでダメージを与えるたび毒+1（敵のシールドでも毒は入る）";
      if (item.carryMana) return "使わなかったマナを次のターンへ持ち越す";
      if (item.halfAtk) return "自分の体力が最大の半分以下のあいだ、ATK+2。上に戻ると消える";
      if (item.halfMana) return "自分のターン開始時に体力が最大の半分以下なら、そのターンのマナが1増える";
      let text = String(item.effect || "");
      text = text.replace(/★+/g, "").replace(/ボス/g, "");
      text = text.replace(/ATK\s*[+＋]\s*\d+/g, "").replace(/DEF\s*[+＋]\s*\d+/g, "");
      text = text.replace(/アクセサリー枠[。.]?/g, "").replace(/アクセサリー[。.]?/g, "");
      text = text.replace(/[。.\s　]+/g, " ").trim();
      return gearTraitOneLine(text);
    }

    function gearAtkInTrait(item) {
      return !!item && (item.atkInTrait || item.id === "lion-shield");
    }

    function gearTraitAtkLine(item) {
      if (!item || !item.atk || !gearAtkInTrait(item)) return "";
      return `ATK+${item.atk}`;
    }

    function gearStatChips(item) {
      if (!item) return "";
      const chips = [];
      if (item.atk && !gearAtkInTrait(item)) chips.push(`<span class="atk">ATK ${signed(item.atk)}</span>`);
      if (item.def) chips.push(`<span class="def">DEF ${signed(item.def)}</span>`);
      if (!chips.length) return "";
      return `<div class="gear-effect-stats">${chips.join("")}</div>`;
    }

    function gearBodyHtml(raw) {
      return cardNoteHtml(raw).replace(/ATK\s*[+＋\-－]\s*\d+|DEF\s*[+＋\-－]\s*\d+/g, (m) => {
        const kind = /^DEF/i.test(m) ? "def" : "atk";
        const label = m.replace(/\s+/g, "").replace(/＋/g, "+").replace(/－/g, "-");
        return `</span><span class="gear-stat-chip ${kind}">${label}</span><span class="nobr">`;
      });
    }

    function isStarterGear(item) {
      return !!item && (item.starterGear || item.id === "short-sword" || item.id === "buckler");
    }

    function gearPopBodyLine(item, o, boon) {
      if (o.empty) return { show: true, text: gearTraitOneLine(o.body ?? ""), extra: "empty" };
      if (boon) {
        const t = gearTraitOneLine(o.body ?? "");
        return { show: !!t, text: t, extra: "" };
      }
      if (item) {
        const stats = [];
        if (Number(item.atk) > 0) stats.push(`ATK+${item.atk}`);
        if (Number(item.def) > 0) stats.push(`DEF+${item.def}`);
        const special = gearSpecialText(item);
        const lines = [];
        if (stats.length) lines.push(stats.join("　"));
        if (special) lines.push(special);
        if (isStarterGear(item)) lines.push("初期装備");
        if (!lines.length) return { show: true, text: "", extra: "empty-trait" };
        return { show: true, text: lines.join("\n"), extra: "" };
      }
      const t = gearTraitOneLine(o.body ?? "");
      return { show: !!t, text: t, extra: "" };
    }

    function gearPopSlotKey(slotId, item) {
      const raw = (item && item.slot) || slotId || "";
      if (raw === "braceletAny") return "braceletL";
      return raw;
    }

    function gearChipRowMinPx(item, boon) {
      if (boon) return 0;
      let w = 30;
      if (!item) return w;
      let chips = 0;
      if (item.atk && !gearAtkInTrait(item)) chips += 1;
      if (item.def) chips += 1;
      w += chips * 78 + Math.max(0, chips - 1) * 6;
      return w;
    }

    function gearPopWidthPx(label, item, boon) {
      const chars = [...String(label || "")].length;
      const nameW = Math.max(88, Math.min(240, 18 + chars * 15));
      const chipW = gearChipRowMinPx(item, boon);
      const meta = Math.max(nameW, chipW);
      return Math.min(380, Math.max(180, 84 + 12 + meta + 24));
    }

    function gearPopShell(slotId, opts) {
      const o = opts || {};
      const boon = slotId === "hp" || slotId === "mana" || slotId === "spd" || slotId === "enchant";
      const embedded = !!o.embedded;
      const slotKey = gearPopSlotKey(slotId, o.item);
      const rarity = o.rarity || "";
      const starsClass = "gear-effect-stars";
      const art = o.image
        ? `<img src="${esc(o.image)}" alt="">`
        : `<span class="gear-mark">${o.icon || gearSlotIcon(slotKey)}</span>`;
      const boonSub = o.boonSub ? `<p class="gear-effect-boon-sub">${esc(o.boonSub)}</p>` : "";
      const displayName = o.name || (o.item && o.item.name) || "";
      const name = displayName ? `<p class="gear-effect-name">${esc(displayName)}</p>` : "";
      const stars = rarity ? `<p class="${starsClass}">${esc(rarity)}</p>` : "";
      const kindLabel = (o.item && o.item.boss) ? "戦利品" : gearSlotLabel(slotKey);
      const kindChip = boon ? "" : `<span class="kind">${esc(kindLabel)}</span>`;
      const stats = boon && o.item ? gearStatChips(o.item) : "";
      const chipRow = boon ? stats : (kindChip ? `<div class="gear-effect-chiprow">${kindChip}</div>` : "");
      const hint = o.hint ? `<p class="gear-effect-hint">${esc(o.hint)}</p>` : "";
      const button = o.button || "";
      const action = o.action ? " has-action" : "";
      const bodyLine = gearPopBodyLine(o.item, o, boon);
      let body = "";
      if (bodyLine.show) {
        const extra = bodyLine.extra ? ` ${bodyLine.extra}` : "";
        const bodyClass = `gear-effect-body${extra}`;
        const bodyHtml = bodyLine.text ? (boon ? cardNoteHtml(bodyLine.text) : gearBodyHtml(bodyLine.text)) : "";
        body = `<p class="${bodyClass}">${bodyHtml}</p>`;
      }
      const emb = embedded ? ` gear-effect-embedded${o.sheetPop ? " sheet-pop" : ""}${o.castPop ? " cast-pop" : ""}` : "";
      const popStyle = ` style="--gear-pop-w: ${gearPopWidthPx(displayName, o.item, boon)}px"`;
      if (boon) {
        return `<div class="gear-effect center-boon${action}${emb}"${popStyle} role="tooltip"><div class="gear-effect-inner"><div class="gear-effect-head"><div class="gear-effect-artcol"><div class="gear-effect-art">${art}</div>${boonSub}</div><div class="gear-effect-meta"><div class="gear-effect-titles">${name}${stars}${chipRow}</div></div></div>${body}${hint}${button}</div></div>`;
      }
      const rest = `${body}${hint}${button}`;
      const side = `${name}${stars}${chipRow}`;
      return `<div class="gear-effect${action}${emb}"${popStyle} role="tooltip"><div class="gear-effect-inner"><div class="gear-effect-head"><div class="gear-effect-artcol"><div class="gear-effect-art">${art}</div></div><div class="gear-effect-meta">${side}</div></div>${rest ? `<div class="gear-effect-rest">${rest}</div>` : ""}</div></div>`;
    }

    function gearEffectHtml(slotId) {
      if (!slotId) return "";
      if (slotId === "medal" && !gear.medal) {
        const look = (Number(gear.medals) || 0) > 0 ? GEAR_ITEMS.find((item) => item.id === "minotaur-medal") : null;
        return gearPopShell(slotId, look ? {
          item: look,
          name: look.name,
          image: look.image || "",
          rarity: gearRarityText(look),
          body: esc(gearSpecialText(look)),
        } : "");
      }
      const item = gear[slotId];
      if (!item) return "";
      return gearPopShell(slotId, {
        item,
        name: item.name || gearSlotLabel(slotId),
        image: item.image || "",
        rarity: gearRarityText(item),
        body: esc(gearSpecialText(item)),
      });
    }

    function placeGearEffect(box, slotId) {
      if (!box || !slotId) return;
      const slot = root.querySelector(`.gear-slot[data-gear="${slotId}"]`);
      if (!slot) return;
      box.style.left = "0px";
      box.style.top = "0px";
      placeAnchored(box, slot, { gap: 12, pad: 8, fallbackW: 288, fallbackH: 120, align: "top" });
    }

    function paintGear() {
      const shown = shownGearSlot();
      root.querySelectorAll(".gear-slot[data-gear]").forEach((btn) => {
        const id = btn.dataset.gear;
        const on = id === shown;
        btn.classList.toggle("open", on && gearOpen === id);
        btn.classList.toggle("hot", on && gearOpen !== id);
      });
      let box = root.querySelector(".gear-effect");
      const html = gearEffectHtml(shown);
      if (!html) {
        if (box) box.remove();
        return;
      }
      if (!box) {
        root.insertAdjacentHTML("beforeend", html);
        box = root.querySelector(".gear-effect");
      } else {
