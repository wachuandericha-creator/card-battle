<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>わちゅえりカードゲーム</title>
  <style>
    :root {
      --hand-scale: 0.64;
      --card-ratio: 3 / 4;
      --edge-clear: 0px;
      --bg: #0a0908;
      --ink: #1a1612;
      --cream: #f0e4cc;
      --gold: #d4a84a;
      --gold-soft: rgba(212, 168, 74, 0.55);
      --gold-line: rgba(212, 168, 74, 0.72);
      --panel-face: linear-gradient(180deg, rgba(22, 18, 14, 0.98), rgba(6, 5, 4, 0.99));
      --panel-sheen: radial-gradient(120% 80% at 50% 0%, rgba(212, 168, 74, 0.1), transparent 55%);
      --panel-frame:
        0 0 0 1px #0a0806,
        0 0 0 2px rgba(196, 168, 110, 0.55),
        0 0 0 3px #12100c,
        0 10px 22px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 232, 180, 0.08);
      --hp: #c24a3c;
      --hp-bg: #2a1a18;
      --block: #9bb4cc;
      --attack: #c88858;
      --guard: #8aa0b8;
      --muted: #a89880;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 18%, #241c14 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #100e0c 0%, #0a0908 70%);
    }
    button, body { -webkit-user-select: none; user-select: none; }
    .battle-screen {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 12.5%) minmax(0, 1fr) minmax(0, 12.5%);
      grid-template-rows: auto minmax(0, 2.4fr) minmax(0, 1.3fr);
      grid-template-areas:
        "road hud log"
        "road arena log"
        "road hand log";
      padding: 10px 10px 4px;
      row-gap: 0;
      column-gap: 10px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(70, 48, 22, 0.22), transparent 52%),
        radial-gradient(ellipse at 50% 100%, rgba(8, 6, 5, 0.95), #050403 72%),
        #0a0908;
    }
    .battle-screen.no-log {
      grid-template-columns: minmax(0, 12.5%) minmax(0, 1fr);
      grid-template-areas:
        "road hud"
        "road arena"
        "road hand";
    }
    .game { display: contents; }
    .hud-top { grid-area: hud; min-width: 0; overflow: hidden; }
    .battle-bands {
      grid-area: arena;
      position: relative;
      z-index: 4;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      border-radius: 10px;
      /* 手札が上に来ても、プレイエリアへは絶対に重ねない */
      overflow: hidden;
      border: 8px solid #e4c27a;
      background:
        linear-gradient(180deg, rgba(10, 8, 7, 0.28) 0%, rgba(10, 8, 7, 0.18) 42%, rgba(10, 8, 7, 0.62) 100%),
        var(--dungeon-art, url("dungeon-bg.jpg")) center 38% / cover no-repeat;
      box-shadow:
        0 0 0 2px #5c3a12,
        inset 0 0 0 2px #fff1c4,
        0 14px 28px rgba(0, 0, 0, 0.55);
      isolation: isolate;
    }
    /* キャラは戦闘枠いっぱいに置き、プレイエリアはその上に重ねる（足元が下に入ってよい） */
    .stage { grid-area: 1 / 1; min-width: 0; overflow: visible; position: relative; z-index: 3; }
    .play-row { grid-area: 1 / 1; min-width: 0; overflow: hidden; position: relative; z-index: 5; }
    /* 手札は戦闘枠より手前。ホバーでプレイエリアへ重なってよい */
    .handbar { grid-area: hand; min-width: 0; overflow: visible; z-index: 8; }
    .hero-stack {
      position: absolute;
      top: 12px;
      left: 8px;
      z-index: 8;
      width: min(300px, 42%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      pointer-events: none;
    }
    .hero-stack .battle-plate {
      position: relative;
      top: auto;
      left: auto;
      width: 100%;
      pointer-events: auto;
    }
    .battle-log { min-width: 0; overflow: auto; }
    .side-rail {
      grid-area: log;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .road-map {
      grid-area: road;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 6px;
      border-radius: 16px;
      background: var(--panel-sheen), var(--panel-face);
      box-shadow: var(--panel-frame);
      color: var(--cream);
    }
    .road-map h2 {
      flex: 0 0 auto;
      margin: 0 0 6px;
      padding: 4px 0 6px;
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-indent: 0.28em;
      text-align: center;
      color: #fff3c4;
      border-bottom: 1px solid rgba(228, 177, 90, 0.45);
    }
    .road-map ol {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .road-node {
      position: relative;
      display: block;
      flex: 0 0 calc((100% - 24px) / 5);
      min-height: 0;
      overflow: hidden;
      border-radius: 10px;
      color: rgba(240, 228, 204, 0.72);
      font-size: 13px;
      font-weight: 800;
    }
    .road-node img, .road-node i {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      background: #1a1410;
    }
    .road-node i {
      display: grid;
      place-items: center;
      border: 1px solid rgba(228, 177, 90, 0.35);
      font-size: 54px;
      font-weight: 900;
      font-style: normal;
      color: #ffe7a4;
      text-shadow: 0 3px 0 #000;
    }
    .road-node.pad { visibility: hidden; }
    .road-node.done { color: #f0e4cc; }
    .road-node.tone-fight img,
    .road-node.tone-fight i { box-shadow: inset 0 0 0 10px #e24a38; }
    .road-node.tone-rest img,
    .road-node.tone-rest i { box-shadow: inset 0 0 0 6px #6aa4e0; }
    .road-node.tone-other img,
    .road-node.tone-other i { box-shadow: inset 0 0 0 6px #e2b03a; }
    .road-node.now {
      z-index: 2;
      overflow: visible;
      color: #fff6d0;
      border-radius: 8px;
      outline: 7px solid #ffe14a;
      outline-offset: 3px;
      box-shadow: 0 0 0 3px #2a1604, 0 0 22px 6px rgba(255, 214, 70, 0.95);
      animation: here-pulse 1.1s ease-in-out infinite;
    }
    .road-node.now::after {
      content: "現在地";
      position: absolute;
      z-index: 4;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 10px 4px;
      border-radius: 999px;
      background: #ffe14a;
      color: #3a2208;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.16em;
      line-height: 1;
      box-shadow: 0 2px 0 #6a4512;
    }
    @keyframes here-pulse {
      0%, 100% { outline-color: #ffe14a; box-shadow: 0 0 0 3px #2a1604, 0 0 16px 4px rgba(255, 214, 70, 0.75); }
      50% { outline-color: #fff6b0; box-shadow: 0 0 0 3px #2a1604, 0 0 28px 8px rgba(255, 236, 140, 1); }
    }
    .road-node.boss { color: #ffb0a4; }
    .road-cap {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 16px 6px 4px;
      background: linear-gradient(180deg, transparent, rgba(8, 6, 4, 0.92) 42%);
    }
    .road-floor {
      flex: 0 0 auto;
      color: #ffe7a4;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 0 #000, 0 0 8px #000;
    }
    .road-node.now .road-floor { font-size: 36px; }
    .road-name {
      min-width: 0;
      overflow: hidden;
      color: #fff6e4;
      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-shadow: 0 2px 0 #000;
    }
    .road-node.now .road-name { font-size: 26px; }
    .side-rail .battle-log { flex: 1 1 auto; height: auto; }
    .hud-top {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      column-gap: 12px;
      min-width: 0;
      padding: 10px 18px;
      border-radius: 14px;
      border: 0;
      background: var(--panel-sheen), var(--panel-face);
      box-shadow: var(--panel-frame);
    }
    .dungeon {
      display: flex;
      align-items: baseline;
      gap: 16px;
      min-width: 0;
      justify-self: start;
    }
    .dungeon-name {
      margin: 0;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--cream);
    }
    .dungeon-progress {
      color: var(--gold);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.06em;
      white-space: nowrap;
      text-shadow: 0 2px 0 #1a120c;
    }
    .status-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      width: max-content;
    }
    .status-stars {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      color: var(--gold);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      white-space: nowrap;
      line-height: 1;
      pointer-events: none;
    }
    .hud-actions {
      grid-column: 3;
      display: flex;
      gap: 8px;
      align-items: stretch;
      justify-content: flex-end;
      justify-self: end;
      align-self: stretch;
      min-width: 0;
      height: 100%;
    }
    .hud-actions .small-btn {
      height: 100%;
      min-height: 56px;
      padding: 0 20px;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .turn { color: var(--gold); font-weight: 700; }
    .chip b { font-size: 20px; }
    .bar {
      height: 8px;
      width: 88px;
      border-radius: 99px;
      background: var(--hp-bg);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--hp); }
    .block-num { color: var(--block); }
    .next-energy, .rules, .logline { color: var(--muted); font-size: 13px; }
    .rules { margin: 0; }
    .note { min-height: 1.1em; color: #f0c7a2; font-size: 13px; }
    .stage {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
      margin: 0;
      padding: 8px 10px 0;
      background: transparent;
      overflow: visible;
      pointer-events: none;
    }
    .stage .foe-piles,
    .stage .foe-pile,
    .stage .foe-peek,
    .stage .ally-piles,
    .stage .ally-piles .pile { pointer-events: auto; }
    .ally-piles {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 7;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .ally-piles .pile { width: 128px; height: auto; }
    .ally-piles .pile-card {
      width: 118px;
      height: auto;
      max-height: none;
      aspect-ratio: var(--card-ratio);
    }
    .ally-piles .pile-count { font-size: 44px; }
    .ally-piles .pile-label { font-size: 16px; letter-spacing: 0.08em; }
    /* 自分の捨て札：カードがあるときは絵だけ。空枠はカードが無いときだけ出す */
    .ally-piles .pile[data-pile="discard"] .pile-card {
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }
    .ally-piles .pile[data-pile="discard"] .pile-card.empty {
      overflow: visible;
      border: 1px solid rgba(244, 234, 215, 0.45);
      background: transparent;
      box-shadow: none;
    }
    .ally-piles .pile[data-pile="discard"] .pile-card.stack,
    .ally-piles .pile[data-pile="discard"] .pile-card.discard.stack { box-shadow: none; }
    /* 自分のステータスは戦闘画面の左上、敵は右上 */
    .enemy-field {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(200px, 26%) minmax(0, 1fr);
      align-items: stretch;
      column-gap: 0;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow: visible;
      padding: 0 6px 2px;
    }
    .duel-side {
      position: relative;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
    }
    .duel-side.ally { z-index: 4; justify-content: flex-end; }
    .duel-side.foe { z-index: 4; justify-content: flex-start; }
    .duel-mid {
      position: relative;
      min-width: 0;
      height: 100%;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      pointer-events: none;
      padding: 2px 0 4px;
    }
    .use-board {
      pointer-events: auto;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: block;
      z-index: 6;
    }
    .use-split {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 4px;
    }
    .duel-mid .play-side {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 4px;
      box-sizing: border-box;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .duel-mid .play-side.mine,
    .duel-mid .play-side.foe {
      background: transparent;
      box-shadow: none;
      grid-template-columns: none;
      width: 100%;
    }
    .duel-mid .play-cards {
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .duel-mid .play-card {
      height: 72%;
      max-height: 190px;
      max-width: 42%;
      flex: 0 1 auto;
      align-items: center;
    }
    .duel-mid .play-side.foe .play-card {
      height: 100%;
      max-height: 300px;
      max-width: 78%;
    }
    .duel-mid .card.preview {
      width: auto;
      height: 100%;
      max-height: 100%;
      pointer-events: auto;
    }
    .hero-shoulder {
      position: relative;
      left: auto;
      bottom: auto;
      z-index: 4;
      height: 100%;
      width: auto;
      max-width: min(100%, 400px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
      filter: drop-shadow(0 14px 14px rgba(0, 0, 0, 0.5));
    }
    .hero-body {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: auto;
      max-width: 100%;
      height: auto;
      aspect-ratio: 862 / 1146;
      align-self: center;
    }
    .hero-fig {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: none;
    }
    /* 名前と体力の板。黒漆に金の縁。自分と敵も同じ黒金でそろえる。 */
    .battle-plate {
      --plate-accent: var(--gold);
      position: absolute;
      z-index: 6;
      box-sizing: border-box;
      width: min(340px, 46%);
      padding: 10px 14px 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--gold-line);
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(255, 232, 180, 0.08), transparent 55%),
        linear-gradient(180deg, rgba(28, 22, 16, 0.98), rgba(8, 6, 5, 0.99));
      color: var(--cream);
      box-shadow:
        0 0 0 3px rgba(8, 6, 5, 0.95),
        0 0 0 4px rgba(212, 168, 74, 0.4),
        0 14px 24px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 232, 180, 0.14),
        inset 0 -1px 0 rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }
    .battle-plate::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, #fff2d0 0%, var(--plate-accent) 30%, var(--plate-accent) 70%, rgba(0, 0, 0, 0.45) 100%);
      box-shadow: 0 0 8px rgba(212, 168, 74, 0.35);
    }
    .battle-plate::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 9px;
      border: 1px solid rgba(212, 168, 74, 0.16);
      pointer-events: none;
    }
    .battle-plate.hero-plate { --plate-accent: var(--gold); }
    .battle-plate.foe-plate { --plate-accent: #c89848; }
    .battle-plate .hint { pointer-events: auto; }
    .enemy-field > .foe-plate {
      position: absolute;
      top: 12px;
      right: 8px;
      left: auto;
      margin: 0;
      z-index: 8;
    }
    .foe-plate .shield-badge { right: -8px; left: auto; }
    .battle-plate .hp-line .lbl .ico.heart { color: #ff6b5a; filter: drop-shadow(0 0 4px rgba(255, 90, 60, 0.6)); }
    .battle-plate .hp-line .lbl .ico.sword { color: #ff5a3a; filter: drop-shadow(0 0 5px rgba(255, 70, 40, 0.75)); }
    .battle-plate .hp-line .lbl .ico.shield { color: #d7dde6; filter: drop-shadow(0 0 5px rgba(220, 226, 232, 0.45)); }
    .battle-plate .hp-line .lbl .ico.boot { color: #e8c878; filter: drop-shadow(0 0 4px rgba(232, 200, 120, 0.55)); }
    .hero-body .hero-guard { inset: -12% -18% 8%; }
    .foe-plate[data-rank="雑魚"] { width: min(300px, 50%); }
    .foe-plate[data-rank="普通"] { width: min(300px, 48%); }
    .foe-plate[data-rank="強敵"] { width: min(340px, 50%); }
    .battle-plate h2 {
      position: relative;
      margin: 0 0 4px;
      padding: 0 0 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: left;
      color: #fff6e6;
      text-shadow: 0 1px 0 #000, 0 0 12px rgba(228, 177, 90, 0.25);
      border-bottom: 1px solid rgba(228, 177, 90, 0.35);
    }
    .battle-plate h2 .who { min-width: 0; max-width: 100%; overflow: visible; white-space: normal; }
    .battle-plate h2 .plate-rank {
      flex: 0 0 auto;
      padding: 1px 8px 2px;
      border-radius: 4px;
      border: 1px solid rgba(228, 177, 90, 0.75);
      color: #ffe7a8;
      font-size: 13px;
      letter-spacing: 0.16em;
    }
    .battle-plate h2 .plate-stars {
      flex: 0 0 auto;
      color: #f0c36a;
      font-size: 18px;
      letter-spacing: 0.08em;
    }
    .battle-plate h2 .tag {
      flex: 0 0 auto;
      padding: 1px 7px 2px;
      border-radius: 4px;
      border: 1px solid rgba(255, 92, 74, 0.8);
      background: linear-gradient(180deg, rgba(255, 92, 74, 0.35), rgba(120, 20, 10, 0.5));
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #ffd9d2;
      text-shadow: none;
    }
    .battle-plate .meters { width: 100%; min-width: 0; }
    .battle-plate .meter.hp {
      position: relative;
      height: 42px;
      border-radius: 8px;
      background: linear-gradient(180deg, #24120f, #3a2220);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(228, 177, 90, 0.35), 0 1px 0 rgba(255, 236, 200, 0.08);
      overflow: hidden;
    }
    .battle-plate .meter.hp .hp-now {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      margin: 0;
      pointer-events: none;
    }
    .battle-plate .meter.hp .hp-now span {
      font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "Segoe UI", sans-serif;
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: #fff;
      font-variant-numeric: tabular-nums;
      background: none;
      padding: 0;
      border-radius: 0;
      text-shadow:
        0 1px 0 #000,
        0 -1px 0 #000,
        1px 0 0 #000,
        -1px 0 0 #000,
        0 2px 3px #000;
    }
    .battle-plate.low .meter.hp .hp-now span { color: #ffe8e0; }
    .battle-plate .meter.hp > span {

      height: calc(70px + var(--pow, 0.35) * 50px);
      margin: calc((70px + var(--pow, 0.35) * 50px) * -0.5) 0 0 calc((70px + var(--pow, 0.35) * 50px) * -0.5);

    /* ジョブ選択の右の板：暗い漆に金の縁。初期ステは3つの札、装備は金枠、デッキは小さく一望 */
    .cast-side .cast-plaque {
      position: relative;

      flex: 0 1 auto;
      min-height: 0;

      padding: 16px 18px 18px;

        radial-gradient(120% 60% at 50% 0%, rgba(228, 177, 90, 0.16), transparent 60%),
        linear-gradient(180deg, #2a2019 0%, #1a1310 42%, #120d0b 100%);
      box-shadow:
        0 0 0 3px #15100d,
        0 0 0 4px rgba(228, 177, 90, 0.6),

    .cast-side .cast-plaque::after {

    .cast-side .cast-plaque h1 span {

    .stat-chips {

    .stat-chips .chip {

    .stat-chips .chip .ico { width: 22px; height: 22px; flex: 0 0 auto; color: var(--chip); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--chip) 60%, transparent)); }
    .stat-chips .chip .k { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #e4b15a; }
    .stat-chips .chip b { margin-left: auto; font-size: 27px; line-height: 1; color: #fff6e4; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000; }
    .stat-chips .chip.hp { --chip: #ff5c4a; }
    .stat-chips .chip.atk { --chip: #ffb14a; }
    .stat-chips .chip.def { --chip: #c5ccd4; }
    .cast-side .cast-blurb {
      position: relative;

    .cast-side .cast-plaque h2 {

    .cast-side .cast-gear .frame {

      border: 1px solid rgba(228, 177, 90, 0.85);
      background: linear-gradient(180deg, #3a2a18, #1a1310);

    .cast-side .cast-gear img { width: 76px; height: 76px; border-radius: 9px; }
    .cast-side .cast-gear figcaption { margin-top: 5px; font-size: 13px; line-height: 1.2; }
    .cast-side .cast-deck { gap: 8px; }
    /* 挑戦開始：橙金のボタン（炎のアニメは無し） */
    .cast-start {
      position: relative;
      z-index: 1;
      width: auto;
      margin: 0;
      border: 2px solid #ffd28a;
      border-radius: 999px;
      background:
        radial-gradient(120% 160% at 50% 120%, rgba(255, 70, 10, 0.95) 0%, transparent 58%),
        linear-gradient(180deg, #fff0b8 0%, #ffc45a 28%, #f07820 68%, #a02808 100%);
      color: #2a1008;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.18em;
      padding: 14px 34px;
      text-shadow: 0 1px 0 rgba(255, 245, 210, 0.7);
      box-shadow:
        0 0 0 2px rgba(40, 12, 6, 0.92),
        0 0 0 4px rgba(255, 170, 70, 0.35),
        0 0 28px rgba(255, 110, 30, 0.72),
        0 12px 26px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -10px 18px rgba(160, 30, 0, 0.35);
    }
    .cast-actions > button.cast-start:not(.lit) {
      filter: grayscale(0.45) brightness(0.62);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    }
    .cast-actions > button.cast-start.lit {
      filter: none;
      animation: decide-glow 1.15s ease-in-out infinite;
    }
    @keyframes decide-glow {
      0%, 100% {
        filter: brightness(1);
        box-shadow:
          0 0 0 2px rgba(40, 12, 6, 0.92),
          0 0 18px rgba(255, 190, 80, 0.55),
          0 12px 26px rgba(0, 0, 0, 0.5);
      }
      50% {
        filter: brightness(1.22);
        box-shadow:
          0 0 0 2px rgba(40, 12, 6, 0.92),
          0 0 0 6px rgba(255, 220, 140, 0.55),
          0 0 36px rgba(255, 196, 80, 0.95),
          0 14px 28px rgba(0, 0, 0, 0.55);
      }
    }
    .cast-start:hover {
      box-shadow:
        0 0 0 2px rgba(40, 12, 6, 0.92),
        0 0 0 5px rgba(255, 190, 90, 0.5),
        0 0 36px rgba(255, 120, 30, 0.9),
        0 14px 28px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        inset 0 -10px 18px rgba(160, 30, 0, 0.4);
    }
    .cast-start[hidden] { display: none; }
    /* もどる と 挑戦開始 は、画面の一番下（もどるが左、挑戦開始が右） */
    .cast-actions {
      position: fixed;
      left: 50%;
      top: auto;
      right: auto;
      bottom: 0;
      z-index: 40;
      height: 76px;
      display: flex;
      align-items: center;
      gap: 14px;
      transform: translateX(-50%);
    }
    .cast-actions > button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      min-height: 52px;
      max-height: none;
      padding: 0 28px;
      line-height: 1;
      font-size: 20px;
      border-radius: 999px;
      letter-spacing: 0.12em;
    }
    .cast-actions > button.cast-start {
      height: 52px;
      min-height: 52px;
      max-height: none;
      padding: 0 36px;
      letter-spacing: 0.16em;
    }
    .cast-actions .cast-back {
      position: static;
      letter-spacing: 0.12em;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    }
    .cast-actions .cast-back:hover { border-color: #f0c36a; background: rgba(40, 30, 24, 0.95); }
    .cast-screen:has(> .cast-actions) { padding-bottom: 86px; }
    .sprite {
      width: 100%;
      height: 100%;
      min-height: 0;
      background: none;
      box-shadow: none;
      position: relative;
    }
    .sprite img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.5));
    }
    .sprite .eye {
      position: absolute;
      top: 36px;
      width: 16px;
      height: 16px;
      background: #f4ead7;
      border-radius: 50%;
    }
    .sprite .eye::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: #1a120e;
      border-radius: 50%;
      top: 5px;
      left: 5px;
    }
    .sprite .eye.l { left: 34px; }
    .sprite .eye.r { right: 34px; }
    .sprite { overflow: hidden; }
    .sprite.slash { animation: shake 0.45s linear; overflow: visible; }
    .dmg-pop {
      position: absolute;
      left: 50%;
      top: 22%;
      z-index: 5;
      margin: 0;
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      color: #fff8ee;
      text-shadow: 0 3px 0 #6e1610, 0 0 12px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      animation: dmg-pop 1.05s ease-out forwards;
    }
    .stage-fx {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
    }
    .dmg-pop.me {
      position: absolute;
      left: 22%;
      top: 48%;
      z-index: 2;
      transform: translate(-50%, -50%);
      font-size: calc(124px + var(--pow, 0.35) * 96px);
      animation-name: dmg-pop-me;
      animation-duration: 1.85s;
    }
    /* 敵への斬撃。.cut が1回分。dir-0: 右上→左下、dir-1: 左上→右下、dir-2: 上→下 */
    .sprite .cut {
      --ang: -45deg;
      --dx: -0.72;
      --dy: 0.72;
      --len: calc(300px + var(--pow, 0.35) * 210px);
      --thick: calc(7px + var(--pow, 0.35) * 6px);
      --glow: calc(8px + var(--pow, 0.35) * 14px);
      position: absolute;
      left: var(--cut-x, 50%);
      top: var(--cut-y, 46%);
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 4;
    }
    .sprite .cut.dir-0 { --ang: -45deg; --dx: -0.72; --dy: 0.72; }
    .sprite .cut.dir-1 { --ang: 45deg; --dx: 0.72; --dy: 0.72; }
    .sprite .cut.dir-2 { --ang: 90deg; --dx: 0; --dy: 1; }
    .sprite .cut > i { position: absolute; left: 0; top: 0; display: block; opacity: 0; }
    .sprite .cut .blade,
    .sprite .cut .trail,
    .sprite .cut .scar {
      width: var(--len);
      height: var(--thick);
      margin: calc(var(--thick) * -0.5) 0 0 calc(var(--len) * -0.5);
      transform-origin: 50% 50%;
      background: linear-gradient(90deg, transparent 0%, #fff 8%, #fff 46%, #ffd8c8 72%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      clip-path: polygon(0 50%, 4% 18%, 50% 0, 96% 18%, 100% 50%, 96% 82%, 50% 100%, 4% 82%);
      filter: drop-shadow(0 0 var(--glow) rgba(255, 252, 246, 1)) drop-shadow(0 0 calc(var(--glow) * 1.6) rgba(255, 70, 40, 0.75));
    }
    .sprite .cut .trail {
      height: calc(var(--thick) * 3.1);
      margin-top: calc(var(--thick) * -1.55);
      background: linear-gradient(90deg, transparent 0%, rgba(255, 80, 40, 0.15) 12%, rgba(255, 40, 24, 0.85) 50%, rgba(255, 80, 40, 0.15) 88%, transparent 100%);
      filter: blur(1.5px);
      clip-path: none;
    }
    .sprite .cut .scar {
      height: 4px;
      margin-top: -2px;
      background: linear-gradient(90deg, transparent 0%, #6e100c 10%, #ff3a28 50%, #6e100c 90%, transparent 100%);
      filter: drop-shadow(0 0 6px rgba(180, 16, 8, 0.9));
      clip-path: none;
    }
    .sprite .cut .burst {
      width: calc(60px + var(--pow, 0.35) * 80px);
      height: calc(60px + var(--pow, 0.35) * 80px);
      margin: calc((60px + var(--pow, 0.35) * 80px) * -0.5) 0 0 calc((60px + var(--pow, 0.35) * 80px) * -0.5);
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #fff4e6 28%, rgba(255, 150, 90, 0.75) 50%, rgba(212, 38, 26, 0) 72%);
      filter: blur(0.5px);
      mix-blend-mode: screen;
    }
    .sprite .cut .spark {
      width: calc(10px + var(--pow, 0.35) * 8px);
      height: 3px;
      margin: -1.5px 0 0 calc((10px + var(--pow, 0.35) * 8px) * -0.5);
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 40%, #ffd1b8);
      filter: drop-shadow(0 0 4px rgba(255, 220, 180, 0.9));
    }
    .sprite .cut .drop {
      width: 8px;
      height: 11px;
      margin: -5px 0 0 -4px;
      border-radius: 40% 40% 46% 46%;
      background: radial-gradient(circle at 40% 30%, #ffb0a4, #c41414 70%);
    }
    .sprite .cut .drop.d1 { --fall: -34px; }
    .sprite .cut .drop.d2 { --fall: 28px; }
    .sprite.slash .cut .blade { animation: slash-blade 0.42s var(--delay, 0s) cubic-bezier(0.12, 0.8, 0.2, 1) both; }
    .sprite.slash .cut .trail { animation: slash-blade 0.48s var(--delay, 0s) cubic-bezier(0.12, 0.8, 0.2, 1) both; }
    .sprite.slash .cut .scar { animation: slash-scar 0.95s var(--delay, 0s) ease-out both; }
    .sprite.slash .cut .drop { animation: slash-drop 0.7s calc(var(--delay, 0s) + 0.18s) ease-in both; }

    function stripFoePlus(name) {
      const raw = String(name || "");

    function enemyKey(name) {
      const base = stripFoePlus(name);

    function enemyByName(name) {
      const key = enemyKey(name);

    // この攻略で、今の敵と同じ相手に何回会ってきたか（いまの一回は含めない）
    function foeRepeat(at, list) {
      const path = list || route;
      const index = at == null ? battleIndex : at;
      const node = path[index];
      if (!node || isEventNode(node)) return 0;
      const base = enemyKey(node);
      let n = 0;
      for (let i = 0; i < index; i++) {
        if (isEventNode(path[i])) continue;
        if (enemyKey(path[i]) === base) n += 1;

    function enemyBasic(foe, name) {
      // 旧セーブの「アタック+」「ブロック+」は、いまのアタック／ブロックと同じ扱い

      if (key === "アタック") {

        return { name: "アタック", cost: 1, text: `${dmg}ダメージ`, damage: dmg };

        return { name: "ブロック", cost: 1, text: `ブロック${blk}`, block: blk };
      }
      return null;

      if (enemy && foe && enemyKey(enemy.name) === foe.name) return Number(enemy.atk) || 0;
      return hiddenAtk(foe);

      if (enemy && foe && enemyKey(enemy.name) === foe.name) return Number(enemy.def) || 0;

      target.burn = burnStacks(target) + Math.max(1, Number(amount) || 1);

      return (Number(enemy && enemy.def) || 0) - burnStacks(enemy);

    function statusIconSvg(kind) {

    function statusChip(kind, word, count, note) {

    function statusChips(target) {
      if (!target) return "";
      const parts = [];
      const poison = poisonStacks(target);
      if (poison) parts.push(statusChip("poison", "毒", poison, POISON_NOTE));
      const burn = burnStacks(target);
      if (burn) parts.push(statusChip("burn", "炎上", burn, BURN_NOTE));
      const parry = parryCount(target);
      if (parry) parts.push(statusChip("parry", "パリィ", parry > 1 ? parry : 0, PARRY_NOTE));
      if (target === player && player.focus) parts.push(statusChip("focus", "集中", player.focus, FOCUS_NOTE));
      const anger = Math.max(0, Number(target.anger) || 0);
      if (anger) parts.push(statusChip("anger", "怒り", anger, "山札を使い切ると得る。重なるたびにATK+1、DEF-1。"));
      return parts.join("");

    function rollRank(tier) {
      const names = (DUNGEON.pools[tier] || DUNGEON.pools[1] || []).filter((name) => name !== DUNGEON.boss);
      if (!names.length) return "スライム";
      return names[Math.floor(Math.random() * names.length)];
    }

    function freshRoute() {
      return buildRoute(20, "洞窟");

    function isEventNode(name) {
      return String(name || "").startsWith("出来事:");

    const JOB_CHANGE_FLOORS = [10, 20, 30, 40, 50, 60, 70, 80, 90, 99];

    // 0層目は祝福（階層の数には入れない）。1層目は雑魚で固定。最後の層はボス。route の添え字＝層の番号
    function buildRoute(floors, name) {
      const route = new Array(floors + 1);
      const jobFloors = [];
      for (const floor of jobFloors) route[floor] = "出来事:ジョブ";
      route[floors] = DUNGEON.boss;
      if (floors > 10) route[10] = "出来事:お店";
      route[0] = "出来事:祝福";
      if (floors > 1) route[1] = rollRank(1);
      const open = [];
      for (let i = 0; i <= floors; i++) if (!route[i]) open.push(i);
      const combatTarget = Math.floor(floors / 2);
      const combatsPlaced = route.filter((node) => node && !isEventNode(node)).length;
      const combatLeft = Math.max(0, combatTarget - combatsPlaced);
      const eventLeft = open.length - combatLeft;
      const events = ["出来事:探索", "出来事:未知", "出来事:キャンプ", "出来事:お店", "出来事:物乞い"];
      const filler = [];
      for (let i = 0; i < combatLeft; i++) filler.push(rollRank(i < combatLeft / 2 ? 1 : 2));
      for (let i = 0; i < eventLeft; i++) filler.push(events[i % events.length]);
      shuffle(filler).forEach((node, i) => { route[open[i]] = node; });
      return route;
    }

    // 表示する層の番号。先頭が祝福なら、それを0層目として数える。
    // 最大はダンジョンの階数。寄り道で足した戦闘は、次の階層の番号を共有し、最大は増やさない。
    function floorStart() { return route[0] === "出来事:祝福" ? 1 : 0; }
    function floorsOf(name) {
      const item = DUNGEON_LIST.find((dungeon) => dungeon.name === name);
      return item ? item.floors : 20;
    }
    function rememberFloors(floors) {
      const blessing = route[0] === "出来事:祝福";
      dungeonFloors = floors || dungeonFloors || floorsOf(dungeonName);
      floorAt = route.map((_, i) => Math.min(dungeonFloors, blessing ? i : i + 1));
      clampBlessingNext();
    }

    // 祝福0の次が2に飛ぶ古い番号を、1から数え直す。10のお店と最後のボスは元の階に戻す。
    function clampBlessingNext() {
      if (!route.length || route[0] !== "出来事:祝福" || floorAt.length !== route.length) return;
      floorAt[0] = 0;
      const jump = Number(floorAt[1]) - 1;
      if (!(jump > 0)) return;
      const shop = route.findIndex((node, i) => i > 1 && node === "出来事:お店" && Number(floorAt[i]) >= 10);
      for (let i = 1; i < floorAt.length; i++) floorAt[i] = Math.max(1, Number(floorAt[i]) - jump);
      if (shop > 0 && floorAt[shop] < 10) {
        const back = 10 - floorAt[shop];
        floorAt[shop] = 10;
        for (let i = shop + 1; i < floorAt.length; i++) floorAt[i] = Math.min(dungeonFloors, Number(floorAt[i]) + back);
      }
      const boss = route.lastIndexOf(DUNGEON.boss);
      if (boss > 0) floorAt[boss] = dungeonFloors;
    }
    function floorNo() {
      if (floorAt && battleIndex >= 0 && battleIndex < floorAt.length && floorAt[battleIndex] != null && !Number.isNaN(Number(floorAt[battleIndex]))) {
        return Number(floorAt[battleIndex]);
      }
      return Math.max(1, battleIndex + 1 - floorStart());
    }
    function floorMax() { return dungeonFloors; }
    function floorLabel() { return `最大${floorMax()}Ｆ`; }
    function insertAhead(node) {
      const at = Math.min(Math.max(battleIndex + 1, 0), route.length);
      route.splice(at, 0, node);
      const mark = floorAt[at] != null ? floorAt[at] : (floorAt.length ? floorAt[floorAt.length - 1] : dungeonFloors);
      floorAt.splice(at, 0, mark);
      battleTotal = route.length;

    function roadTone(node) {

    function roadFixed(node, index) {
      const name = String(node || "");

        return `<li class="road-node ${state}${face.boss ? " boss" : ""}${fixed ? " fixed" : ""}${tone ? ` tone-${tone}` : ""}">${icon}<span class="road-cap"><span class="road-floor">${floor}</span><span class="road-name">${esc(face.label || "")}</span></span></li>`;

      ol.scrollTop = Math.max(0, anchor.offsetTop + anchor.offsetHeight + extra - ol.clientHeight);

    }

    function isAccessorySlot(slot) {
      return slot === "braceletL" || slot === "braceletR" || slot === "braceletAny";
    }

    function giveGear(item) {
      if (!item) return;
      if (isAccessorySlot(item.slot)) {
        const key = !gear.braceletL ? "braceletL" : !gear.braceletR ? "braceletR" : "braceletL";
        gear[key] = { ...item };
      } else {
        gear[item.slot] = { ...item };
      }
      syncGearStats();
    }

    function needsWeaponReplace(item) {
      return !!(item && item.slot === "sword" && gear && gear.sword);
    }

    function weaponAtk(item) {
      return Number(item && item.atk) || 0;
    }

    function weaponExtra(item) {
      if (!item) return "";
      const bits = [];
      if (Number(item.poisonHit) > 0) bits.push(`アタックで毒+${item.poisonHit}（シールドでも）`);
      if (Number(item.burnHit) > 0) bits.push(`ダメージを通すたび炎上+${item.burnHit}`);
      if (item.ignoreTrait) bits.push("相手の特性を無視してダメージ");
      return bits.join("。");
    }

    function hasReuseBracelet() {
      return !!(gear && ((gear.braceletL && gear.braceletL.carryMana) || (gear.braceletR && gear.braceletR.carryMana)));
    }

    function hasStatusImmune() {
      return !!(gear && gear.shield && gear.shield.statusImmune);
    }

    function hasReflectDef() {
      return !!(gear && gear.shield && gear.shield.reflectDef);
    }

    function syncEnergyTotal() {
      if (!player) return;
      player.baseEnergy = Math.max(0, Number(player.baseEnergy) || 0);
      player.tempEnergy = Math.max(0, Number(player.tempEnergy) || 0);
      player.baseMax = Math.max(0, Number(player.baseMax) || 0);
      player.energy = player.baseEnergy + player.tempEnergy;
      player.maxEnergy = player.baseMax + player.tempEnergy;
    }

    function spendEnergy(cost) {
      let left = Math.max(0, Number(cost) || 0);
      const fromTemp = Math.min(Math.max(0, Number(player.tempEnergy) || 0), left);
      player.tempEnergy = (Number(player.tempEnergy) || 0) - fromTemp;
      left -= fromTemp;
      player.baseEnergy = Math.max(0, (Number(player.baseEnergy) || 0) - left);
      syncEnergyTotal();
    }

    function refundEnergy(cost) {
      let left = Math.max(0, Number(cost) || 0);
      const room = Math.max(0, (Number(player.baseMax) || 0) - (Number(player.baseEnergy) || 0));
      const toBase = Math.min(room, left);
      player.baseEnergy = (Number(player.baseEnergy) || 0) + toBase;
      left -= toBase;
      if (left > 0) player.tempEnergy = (Number(player.tempEnergy) || 0) + left;
      syncEnergyTotal();
    }

    function weaponChangeText(keep, item) {
      const from = weaponAtk(keep);
      const to = weaponAtk(item);
      const d = to - from;
      const atk = d === 0
        ? `<span class="same">ATKは${signed(from)}のまま</span>`
        : d > 0
          ? `<span class="up">ATKが${signed(from)}から${signed(to)}になる（+${d}）</span>`
          : `<span class="down">ATKが${signed(from)}から${signed(to)}になる（${d}）</span>`;
      const extraKeep = weaponExtra(keep);
      const extraNew = weaponExtra(item);
      let extra = "";
      if (!extraKeep && extraNew) extra = `。新たに「${extraNew}」が付く`;
      else if (extraKeep && !extraNew) extra = `。「${extraKeep}」は無くなる`;
      else if (extraKeep && extraNew && extraKeep !== extraNew) extra = `。効果が「${extraNew}」に変わる`;
      return atk + extra;
    }

    function offerWeapon() {
      return false;
    }

    function gearSideMarkup(item, label, cls, level) {
      const picture = item && item.image ? `<img src="${esc(item.image)}" alt="">` : "";
      const extra = weaponExtra(item);
      const rarity = gearRarityText(item);
      const mark = rarity ? "　" + rarity : "";
      return `<div class="side${cls ? " " + cls : ""}${rareClass(level || 0)}"${rareStyle(level || 0, 0)}>${rareFx(level || 0)}<span>${esc(label)}</span>${picture}<b>${esc(item.name || "")}</b><small>ATK ${signed(weaponAtk(item))}${mark}${extra ? "<br>" + esc(extra) : ""}</small></div>`;
    }

    function gearOfferMarkup() {
      const offer = gearOffer;
      if (!offer) return "";
      const live = takeRare("gear");
      const lv = live ? rareLevel(offer.item) : 0;
      const shop = offer.source === "shop" && offer.price != null;
      const yes = shop ? `付け替える（★${offer.price}）` : "付け替える";
      return `<div class="overlay gear-offer">${rareScreen(lv ? [lv] : [])}<div class="panel"><h2>武器を付け替える？</h2>
        <p class="gear-offer-lead">${weaponChangeText(offer.keep, offer.item)}</p>
        <div class="gear-compare${rareJack(lv ? [lv] : [])}">${gearSideMarkup(offer.keep, "いまの武器")}<div class="arrow" aria-hidden="true">→</div>${gearSideMarkup(offer.item, "新しい武器", "new", lv)}</div>
        <p>${shop ? `付け替えたときだけ ★${offer.price} 払う。今のままなら払わない。` : "今の武器のままなら、新しい武器は手に入らない。"}</p>
        <div class="gear-offer-actions">
          <button type="button" class="primary" data-action="gear-offer-yes">${esc(yes)}</button>
          <button type="button" data-action="gear-offer-no">今の武器のまま</button>
        </div>
      </div></div>`;
    }

    function paintGearOffer() {
      if (!gearOffer) return;
      root.insertAdjacentHTML("beforeend", gearOfferMarkup());
    }

    function acceptGearOffer() {
      const offer = gearOffer;
      if (!offer) return;
      if (offer.source === "shop") {
        const price = Number(offer.price) || 0;
        const have = Number(meta.stars) || 0;
        if (have < price) return;
        meta.stars = have - price;
        persistMeta();
        const slot = shopStock && shopStock[offer.shopIndex];
        if (slot) slot.sold = true;
      }
      giveGear(offer.item);
      if (offer.source === "gift") {
        floorGift = { kind: "gear", gear: { ...offer.item } };
        floorNote = `${offer.item.name}に付け替えた。`;
      }
      if (offer.source === "boss") {
        bossPicks = [];
        rewardPaths = rollPaths();
        rewardStep = "paths";
      }
      gearOffer = null;
      persistSave(true);
      render();
    }

    function declineGearOffer() {
      const offer = gearOffer;
      if (!offer) return;
      gearOffer = null;
      if (offer.source === "gift") {
        floorGift = null;
        floorNote = `${offer.keep.name}のままにした。`;
      }
      if (offer.source === "boss") {
        bossPicks = [];
        rewardPaths = rollPaths();
        rewardStep = "paths";
      }
      persistSave(true);
      render();
    }

    function starterGear() {
      const next = emptyGear();
      next.sword = { ...gearItem("short-sword") };
      next.shield = { ...gearItem("buckler") };
      return next;
    }

    function gearItem(id) {
      return GEAR_ITEMS.find((item) => item.id === id) || BOSS_GEAR.find((item) => item.id === id) || null;
    }

    function normalizeGear(data) {
      const next = emptyGear();
      if (!data) return next;
      for (const key of ["sword", "shield", "braceletR", "braceletL", "medal"]) {
        const item = data[key] && gearItem(data[key].id);
        const fits = item && (item.slot === key || (isAccessorySlot(item.slot) && isAccessorySlot(key)));
        if (fits) next[key] = { ...item };
      }
      const medals = Math.floor(Number(data.medals) || 0);
      next.medals = medals > 0 ? medals : 0;
      return next;
    }

    function gearStatSum(stat) {
      let n = 0;
      for (const key of ["sword", "shield", "braceletR", "braceletL"]) {
        const item = gear && gear[key];
        if (item && item[stat]) n += Number(item[stat]) || 0;
      }
      return n;
    }

    function syncGearStats() {
      if (!player) return;
      const atkMod = Number(player.atkMod) || 0;
      const defMod = Number(player.defMod) || 0;
      const medalAtk = gear.medal && gear.medal.halfAtk && hpHalf(player) ? gear.medal.halfAtk : 0;
      player.atk = gearStatSum("atk") + atkMod + medalAtk;
      player.def = gearStatSum("def") + defMod - burnStacks(player);
    }

    function medalIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 1.1h7.6L14.4 7.4h-4.8z"/><circle cx="12" cy="14.6" r="7.6" fill="currentColor"/><path fill="#1a120c" d="M12 10.2l1.2 2.5h2.7l-2.2 1.6.85 2.6L12 15.3l-2.55 1.6.85-2.6-2.2-1.6h2.7z"/></svg>`;
    }

    function braceletIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2.2 13.1C2.2 8.4 6.5 4.8 12 4.8s9.8 3.6 9.8 8.3-4.3 7.5-9.8 7.5-9.8-3.2-9.8-7.5zm4.3.2c0 2.1 2.5 3.6 5.5 3.6s5.5-1.5 5.5-3.6-2.5-3.6-5.5-3.6-5.5 1.5-5.5 3.6z"/></svg>`;
    }

    function itemIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" d="M9.2 3.2h5.6M10.2 3.2v3.6L7 14.2a4.6 4.6 0 0 0 4.2 6.6h1.6A4.6 4.6 0 0 0 17 14.2L13.8 6.8V3.2"/><path fill="currentColor" opacity="0.55" d="M8.4 14.6h7.2l-.8 1.8a3 3 0 0 1-2.8 1.8h-.8a3 3 0 0 1-2.8-1.8z"/></svg>`;
    }

    function shownGearSlot() {
      return gearHover || gearOpen || "";
    }

    function gearMarkup() {
      const shown = shownGearSlot();
      const slotButton = (slot) => {
        const item = gear[slot.id];
        const picture = item && item.image
          ? `<img src="${esc(item.image)}" alt="">`
          : `<span class="gear-mark">${slot.icon}</span>`;
        const title = item && item.name ? gearTitle(item) : slot.label;
        const active = shown === slot.id;
        return `<button type="button" class="gear-slot${item ? " filled" : ""}${active ? (gearOpen === slot.id ? " open" : " hot") : ""}" data-gear="${slot.id}" aria-label="${esc(slot.aria || title)}"><span class="gear-frame">${picture}</span></button>`;
      };
      const sword = slotButton({ id: "sword", label: "剣", icon: swordIcon() });
      const shield = slotButton({ id: "shield", label: "盾", icon: shieldIcon() });
      const left = slotButton({ id: "braceletL", label: "アクセサリー", aria: "アクセサリー", icon: braceletIcon() });
      const right = slotButton({ id: "braceletR", label: "アクセサリー", aria: "アクセサリー", icon: braceletIcon() });
      const medalN = Math.max(gear && gear.medal ? 1 : 0, Math.floor(Number(gear && gear.medals) || 0));
      const medalSrc = (gear && gear.medal && gear.medal.image) || "gear-medal.jpg?v=3";
      const medals = Array.from({ length: medalN }, () => `<button type="button" class="gear-slot filled${shownGearSlot() === "medal" ? (gearOpen === "medal" ? " open" : " hot") : ""}" data-gear="medal" aria-label="メダル"><span class="gear-frame"><img src="${esc(medalSrc)}" alt=""></span></button>`).join("");
      return `<div class="gear-board">${sword}${shield}${left}${right}${medals}</div>`;
    }

    function gearSlotLabel(slotId) {
      if (slotId === "sword") return "剣";
      if (slotId === "shield") return "盾";
      if (slotId === "braceletL" || slotId === "braceletR" || slotId === "braceletAny") return "アクセサリー";
      if (slotId === "medal") return "メダル";
      if (slotId === "hp") return "体力";
      if (slotId === "mana") return "マナ";
      if (slotId === "spd") return "SPD";
      if (slotId === "itemL" || slotId === "itemR") return "アイテム";
      return "装備";
    }

    function gearSlotIcon(slotId) {
      if (slotId === "sword") return swordIcon();
      if (slotId === "shield") return shieldIcon();
      if (slotId === "braceletL" || slotId === "braceletR" || slotId === "braceletAny") return braceletIcon();
      if (slotId === "medal") return medalIcon();
      return itemIcon();
    }

    function gearEffectPlain(item) {
      let text = String((item && item.effect) || "");
      return text.trim();
    }

    function gearSpecialText(item) {
      if (!item) return "";
      if (item.statusImmune) return "状態異常にならない";
      if (item.ignoreTrait) return "相手の特性を無視してダメージを与える";
      if (item.reflectDef) return "ダメージを食らうと、相手にいまのDEFだけダメージ";
      if (Number(item.poisonHit) > 0) return "アタックカードでダメージを与えるたび毒+1（敵のシールドでも毒は入る）";
      if (item.carryMana) return "使わなかったマナを次のターンへ持ち越す";
      if (item.halfAtk) return "自分の体力が最大の半分以下のあいだ、ATK+2。上に戻ると消える";
      if (item.halfMana) return "自分のターン開始時に体力が最大の半分以下なら、そのターンのマナが1増える";
      let text = String(item.effect || "");
      text = text.replace(/★+/g, "").replace(/ボス/g, "");
      text = text.replace(/ATK\s*[+＋]\s*\d+/g, "").replace(/DEF\s*[+＋]\s*\d+/g, "");
      text = text.replace(/アクセサリー枠[。.]?/g, "").replace(/アクセサリー[。.]?/g, "");
      text = text.replace(/[。.\s　]+/g, " ").trim();
      return text;
    }

    function gearStatChips(item) {
      if (!item) return "";
      const chips = [];
      if (item.atk) chips.push(`<span class="atk">ATK ${signed(item.atk)}</span>`);
      if (item.def) chips.push(`<span class="def">DEF ${signed(item.def)}</span>`);
      if (!chips.length) return "";
      return `<div class="gear-effect-stats">${chips.join("")}</div>`;
    }

    function gearPopShell(slotId, opts) {
      const o = opts || {};
      const boon = slotId === "hp" || slotId === "mana" || slotId === "spd";
      const rarity = o.rarity || "";
      const starsClass = rarity === "ボス" ? "gear-effect-stars boss" : "gear-effect-stars";
      const art = o.image
        ? `<img src="${esc(o.image)}" alt="">`
        : `<span class="gear-mark">${o.icon || gearSlotIcon(slotId)}</span>`;
      const name = o.name ? `<p class="gear-effect-name">${esc(o.name)}</p>` : "";
      const stars = rarity ? `<p class="${starsClass}">${esc(rarity)}</p>` : "";
      const genre = boon ? "" : `<p class="gear-effect-slot"><span>${esc(gearSlotLabel(slotId))}</span></p>`;
      const bodyClass = o.empty ? "gear-effect-body empty" : "gear-effect-body";
      const hint = o.hint ? `<p class="gear-effect-hint">${esc(o.hint)}</p>` : "";
      const button = o.button || "";
      const action = o.action ? " has-action" : "";
      const body = o.body ? `<p class="${bodyClass}">${o.body}</p>` : "";
      return `<div class="gear-effect${boon ? " center-boon" : ""}${action}" role="tooltip"><div class="gear-effect-inner"><div class="gear-effect-head"><div class="gear-effect-artcol"><div class="gear-effect-art">${art}</div></div><div class="gear-effect-meta">${name}${stars}</div></div>${genre}${body}${hint}${button}</div></div>`;
    }

    function gearEffectHtml(slotId) {
      if (!slotId) return "";
      if (slotId === "medal" && !gear.medal) {
        const look = (Number(gear.medals) || 0) > 0 ? GEAR_ITEMS.find((item) => item.id === "minotaur-medal") : null;
        return gearPopShell(slotId, look ? {
          name: look.name,
          image: look.image || "",
          rarity: gearRarityText(look),
          body: esc(gearSpecialText(look)),
        } : {
          name: "メダル",
          body: "ボスを倒すと確定でもらえる。",
          empty: true,
        });
      }
      if (slotId === "itemL" || slotId === "itemR") {
        const item = gear[slotId];
        if (!item) {
          return gearPopShell(slotId, {
            name: "空き枠",
            body: "使い捨てアイテム。なにも入っていない。",
            empty: true,
          });
        }
        const canUse = item.quick && screen === "battle" && phase === "player" && !outcome;
        const hint = item.quick ? "" : "持っているだけでよい。死んだとき、ひとりでに使われる。";
        const button = item.quick
          ? `<button type="button" class="item-use" data-use-item="${slotId}" ${canUse ? "" : "disabled"}>使う</button>`
          : "";
        return gearPopShell(slotId, {
          name: item.name || "アイテム",
          image: item.image || "",
          rarity: gearRarityText(item),
          body: esc(gearSpecialText(item)),
          hint,
          button,
          action: !!button,
        });
      }
      const item = gear[slotId];
      if (!item) {
        return gearPopShell(slotId, {
          name: "空き枠",
          body: "なにも入っていない。",
          empty: true,
        });
      }
      return gearPopShell(slotId, {
        name: item.name || gearSlotLabel(slotId),
        image: item.image || "",
        rarity: gearRarityText(item),
        body: esc(gearSpecialText(item)),
      });
    }

    function placeGearEffect(box, slotId) {
      if (!box || !slotId) return;
      const slot = root.querySelector(`.gear-slot[data-gear="${slotId}"]`);
      if (!slot) return;
      const r = slot.getBoundingClientRect();
      const gap = 12;
      const pad = 8;
      box.style.left = "0px";
      box.style.top = "0px";
      const w = box.offsetWidth || 288;
      const h = box.offsetHeight || 120;
      let left = r.right + gap;
      let top = r.top;
      if (left + w > window.innerWidth - pad) left = Math.max(pad, r.left - gap - w);
      if (top + h > window.innerHeight - pad) top = Math.max(pad, window.innerHeight - pad - h);
      if (top < pad) top = pad;
      box.style.left = `${Math.round(left)}px`;
      box.style.top = `${Math.round(top)}px`;
    }

    function paintGear() {
      const shown = shownGearSlot();
      root.querySelectorAll(".gear-slot[data-gear]").forEach((btn) => {
        const id = btn.dataset.gear;
        const on = id === shown;
        btn.classList.toggle("open", on && gearOpen === id);
        btn.classList.toggle("hot", on && gearOpen !== id);
      });
      let box = root.querySelector(".gear-effect");
      const html = gearEffectHtml(shown);
      if (!html) {
        if (box) box.remove();
        return;
      }
      if (!box) {
        root.insertAdjacentHTML("beforeend", html);
        box = root.querySelector(".gear-effect");
      } else {
        const next = document.createElement("div");
        next.innerHTML = html;
        const fresh = next.firstElementChild;
        if (fresh) {
          box.replaceWith(fresh);
          box = fresh;
        }
      }
      if (box) {
        box.dataset.gearSlot = shown;
        if (box.classList.contains("has-action") && box.dataset.popBound !== "1") {
          box.dataset.popBound = "1";
          box.addEventListener("pointerleave", (event) => {
            const related = event.relatedTarget;
            if (related instanceof Element && (related.closest(".plate-gear") || related.closest(".gear-effect"))) return;
            if (gearOpen) return;
            if (!gearHover) return;
            gearHover = "";
            paintGear();
          });
        }
      }
      placeGearEffect(box, shown);
    }

    function bindGearHover() {
      const rail = root.querySelector(".plate-gear");
      if (!rail || rail.dataset.gearBound === "1") return;
      rail.dataset.gearBound = "1";
      rail.addEventListener("pointerover", (event) => {
        const btn = event.target instanceof Element ? event.target.closest("[data-gear]") : null;
        if (!btn || !rail.contains(btn)) return;
        const id = btn.dataset.gear || "";
        if (gearHover === id) return;
        gearHover = id;
        paintGear();
      });
      rail.addEventListener("pointerleave", (event) => {
        const related = event.relatedTarget;
        if (related instanceof Element && related.closest(".gear-effect")) return;
        if (!gearHover) return;
        gearHover = "";
        paintGear();
      });
    }

    function swordIcon() {
      return `<svg class="ico sword" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0 14.5 7 14.1 16.4H18.3v2.2h-5.05V23.4h-2.5v-4.8H5.7v-2.2h4.2L9.5 7z"/></svg>`;
    }

    function shieldIcon() {
      return `<svg class="ico shield" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 3.2h18c.9 0 1.6.8 1.6 1.7v6.2c0 5.6-4.4 9.4-10.6 12.1C6 20.5 1.4 16.7 1.4 11.1V4.9C1.4 4 2.1 3.2 3 3.2z"/></svg>`;
    }

    function plateShieldSvg(gold) {
      const fill = gold ? "#e2b44a" : "#c9ced6";
      const rim = gold ? "#fff6d2" : "#f7f8fa";
      const edge = gold ? "#7a5814" : "#5a6168";

    function ironShield(suffix) {
      const id = suffix || "iron";
      return `<svg class="iron" viewBox="0 0 200 230" aria-hidden="true"><defs><linearGradient id="${id}-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="0.42" stop-color="#c5d0dc"/><stop offset="1" stop-color="#66788c"/></linearGradient><linearGradient id="${id}-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f1fb"/><stop offset="1" stop-color="#243e62"/></linearGradient></defs><path d="M100 14 174 50v66c0 50-32 84-74 100C58 200 26 166 26 116V50Z" fill="url(#${id}-steel)" stroke="url(#${id}-rim)" stroke-width="10"/><path d="M100 34v166" stroke="#607086" stroke-width="8"/><path d="M52 86h96" stroke="#9aafc2" stroke-width="7"/><circle cx="100" cy="86" r="16" fill="#e7eef5" stroke="#46586c" stroke-width="4"/><circle cx="58" cy="64" r="5" fill="#f4f8fb"/><circle cx="142" cy="64" r="5" fill="#f4f8fb"/><circle cx="58" cy="118" r="5" fill="#f4f8fb"/><circle cx="142" cy="118" r="5" fill="#f4f8fb"/><path d="M46 96 154 58" stroke="#fff" stroke-width="5" opacity="0.55"/></svg>`;
    }

    function guardMark() {
      return `<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#d7ecff" stroke="#8ec0ff" stroke-width="1.1" d="M12 2l8 3v7c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V5z"/></svg>`;
    }

    function brokenShield() {
      return `<span class="half left">${ironShield("break-l")}</span><span class="half right">${ironShield("break-r")}</span><span class="crack"></span>`;
    }

    function heartIcon() {
      return `<svg class="ico heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20.4 10.7 19.2C5.5 14.6 2.2 11.6 2.2 8 2.2 5 4.6 2.6 7.6 2.6c1.7 0 3.4.8 4.4 2.1 1-1.3 2.7-2.1 4.4-2.1 3 0 5.4 2.4 5.4 5.4 0 3.6-3.3 6.6-8.5 11.2L12 20.4z"/></svg>`;
    }

    function manaIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>`;
    }

    function bootIcon() {
      return `<svg class="ico boot" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" transform="translate(0 3.5)" d="M8 1.4h6.4v2.6h-1.2V9h6.4c2.1 0 3.6 1.6 3.6 3.5 0 1.7-1.4 3.1-3.2 3.1H7.2V4.2h.8V1.4z"/></svg>`;
    }

    function actionMark(intent, big) {
      const size = big ? "big" : "small";
      if (intent.type === "attack") {
        return `<span class="act attack ${size}" aria-label="攻撃 ${intent.value}">${swordIcon()}<b>${intent.value}</b></span>`;
      }
      if (intent.type === "block") {
        return `<span class="act block ${size}" aria-label="シールド ${intent.value}">${shieldIcon()}<b>${intent.value}</b></span>`;
      }
      return `<span class="act skill ${size}" aria-label="スキル">★</span>`;
    }

    function sourcePattern() {
      const foe = enemyNow();
      const base = (foe.pattern || []).map((card) => applyEnemyHidden(card, foe));
      if (foe.name === "物乞い" && !swordIgnoresTrait()) {
        return base.concat((beggarGift || []).map((card) => ({ ...card })));
      }
      return base;
    }

    function deckKey(cards) {
      return (cards || []).map((card) => card.name).sort().join("|");
    }

    function chooseNextIntent() {
      const from = intentIndex;
      const left = enemyLoop.length - from;
      if (left <= 1) return;
      const pick = from + Math.floor(Math.random() * left);
      if (pick === from) return;
      const held = enemyLoop[from];
      enemyLoop[from] = enemyLoop[pick];
      enemyLoop[pick] = held;
    }

    function startEnemyLoop() {
      enemyLoop = shuffle(sourcePattern());
      intentIndex = 0;
      foeDiscard = [];
      foeDeckEmpty = false;
      foeRageBusy = false;
      chooseNextIntent();
    }

    function foeDeckRemain() {
      if (!enemyLoop.length) return 0;
      const drawn = intentShown ? 1 : 0;
      return Math.max(0, enemyLoop.length - intentIndex - drawn);
    }

    function gainEnemyAnger() {
      if (!enemy) return;
      const foe = enemyNow();
      enemy.anger = Math.max(0, Number(enemy.anger) || 0) + 1;
      enemy.atk = hiddenAtk(foe) + enemy.anger;
      enemy.def = hiddenDef(foe) - enemy.anger;
      log(`${enemy.name}は怒り。ATK+1、DEF-1。`);
    }

    function recycleEnemyDeck() {
      const foe = enemyNow();
      const recycled = foeDiscard.map((card) => applyEnemyHidden(card, foe));
      enemyLoop = shuffle(recycled.length ? recycled : sourcePattern());
      foeDiscard = [];
      intentIndex = 0;
      chooseNextIntent();
    }

    function foeAngerCard() {
      return { name: "怒り", cost: 0, text: "この戦闘中 ATK+1 DEF-1", kind: "skill", rage: true, foeRage: true, image: "card-anger.jpg?v=2" };
    }

    function advanceEnemyLoop() {
      if (enemyLoop.length && intentIndex < enemyLoop.length) foeDiscard.push({ ...enemyLoop[intentIndex] });
      intentIndex += 1;
      if (!enemyLoop.length || intentIndex >= enemyLoop.length) {
        foeDeckEmpty = true;
        return;
      }
      chooseNextIntent();
    }

    function restoreEnemyLoop(data) {
      const saved = Array.isArray(data.enemyLoop) ? data.enemyLoop : [];
      if (saved.length && deckKey(saved) === deckKey(sourcePattern())) {
        enemyLoop = saved.map((card) => ({ ...card }));
        intentIndex = Number.isInteger(data.intentIndex) ? data.intentIndex : 0;
        if (intentIndex < 0 || intentIndex >= enemyLoop.length) startEnemyLoop();
        else foeDiscard = Array.isArray(data.foeDiscard) ? data.foeDiscard.map((card) => ({ ...card })) : [];
        return;
      }
      startEnemyLoop();
    }

    function intentAt(offset) {
      if (!enemyLoop.length) startEnemyLoop(false);
      const at = intentIndex + (offset || 0);
      if (at >= 0 && at < enemyLoop.length) return enemyLoop[at];
      return enemyLoop[Math.min(intentIndex, enemyLoop.length - 1)];
    }

    function applyDamage(target, amount) {
      const blocked = Math.min(target.block, amount);
      target.block -= blocked;
      const hpLoss = amount - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      target.hit = true;
      return { blocked, hpLoss };
    }

    function shownEnemy() {
      return shown.enemy == null ? enemy.hp : shown.enemy;
    }

    function shownPlayer() {
      return shown.player == null ? player.hp : shown.player;
    }

    function bindShown() {
      if (player) shown.player = player.hp;
      if (enemy) shown.enemy = enemy.hp;
    }

    function drainMs() {
      const enemyGap = enemy ? Math.abs(enemy.hp - shownEnemy()) : 0;
      const playerGap = player ? Math.abs(player.hp - shownPlayer()) : 0;
      const enemyWait = enemyGap < 0.2 ? 0 : Math.min(1700, Math.max(620, (enemyGap / 6.5) * 1000));
      const playerWait = playerGap < 0.2 ? 0 : Math.min(fxFatal ? 3200 : 2400, Math.max(fxFatal ? 1800 : 900, (playerGap / (fxFatal ? 2.2 : 4)) * 1000));
      return Math.max(enemyWait, playerWait);
    }

    function paintShown() {
      for (const who of ["enemy", "player"]) {
        const hp = who === "enemy" ? shown.enemy : shown.player;
        const max = who === "enemy" ? enemy && enemy.maxHp : player && player.maxHp;
        if (hp == null || !max) continue;
        const bar = root.querySelector(`[data-bar="${who}"]`);
        if (bar) bar.style.width = `${Math.max(0, Math.min(100, (hp / max) * 100))}%`;
        const text = `${Math.max(0, Math.round(hp))}/${Math.round(max)}`;
        root.querySelectorAll(`[data-hp="${who}"]`).forEach((el) => { el.textContent = text; });
      }
    }

    function pumpHp(stamp) {
      const dt = hpStamp ? Math.min(0.05, (stamp - hpStamp) / 1000) : 0.016;
      hpStamp = stamp;
      const ease = (current, target, quick) => {
        const diff = target - current;
        if (Math.abs(diff) < 0.04) return target;
        const speed = quick
          ? Math.max(6.5, Math.abs(diff) / 1.5)
          : fatalHold
            ? Math.max(1.35, Math.abs(diff) / 5.2)
            : Math.max(4, Math.abs(diff) / 2.4);
        return current + Math.sign(diff) * Math.min(Math.abs(diff), speed * dt);
      };
      let moving = false;
      if (enemy && shown.enemy != null && Math.abs(shown.enemy - enemy.hp) >= 0.04) {
        shown.enemy = ease(shown.enemy, enemy.hp, true);
        moving = true;
      } else if (enemy) shown.enemy = enemy.hp;
      if (player && shown.player != null && Math.abs(shown.player - player.hp) >= 0.04) {
        shown.player = ease(shown.player, player.hp, false);
        moving = true;
      } else if (player) shown.player = player.hp;
      paintShown();
      hpFrame = moving ? requestAnimationFrame(pumpHp) : 0;
    }

    function kickHp() {
      if (player && shown.player == null) shown.player = player.hp;
      if (enemy && shown.enemy == null) shown.enemy = enemy.hp;
      hpStamp = 0;
      if (hpFrame) cancelAnimationFrame(hpFrame);
      hpFrame = requestAnimationFrame(pumpHp);
    }

    function spawnManaBit(w, h, fresh) {
      const life = 0.26 + Math.random() * 0.22;
      return {
        x: w * (0.32 + Math.random() * 0.36),
        y: h * (fresh ? 0.64 + Math.random() * 0.2 : 0.8),
        vx: (Math.random() - 0.5) * 22,
        vy: -70 - Math.random() * 80,
        life,
        max: life,
        r: 14 + Math.random() * 14,
      };
    }

    function paintManaBit(ctx, bit, white) {
      const t = 1 - bit.life / bit.max;
      const radius = bit.r * (1 - t * 0.55);
      const glow = ctx.createRadialGradient(bit.x, bit.y, 0, bit.x, bit.y, radius);
      if (white) {
        glow.addColorStop(0, "rgba(255, 252, 244, 0.95)");
        glow.addColorStop(0.45, t < 0.6 ? "rgba(255, 214, 150, 0.7)" : "rgba(255, 170, 90, 0.28)");
        glow.addColorStop(1, "rgba(255, 120, 40, 0)");
      } else if (t < 0.3) {
        glow.addColorStop(0, "rgba(255, 252, 230, 0.95)");
        glow.addColorStop(0.4, "rgba(255, 186, 48, 0.75)");
        glow.addColorStop(1, "rgba(255, 70, 8, 0)");
      } else if (t < 0.65) {
        glow.addColorStop(0, "rgba(255, 196, 60, 0.8)");
        glow.addColorStop(0.55, "rgba(255, 78, 12, 0.45)");
        glow.addColorStop(1, "rgba(160, 20, 0, 0)");
      } else {
        glow.addColorStop(0, "rgba(255, 60, 10, 0.28)");
        glow.addColorStop(1, "rgba(90, 8, 0, 0)");
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(bit.x, bit.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function startManaFires() {
      const gen = ++manaFireGen;
      const canvases = [...document.querySelectorAll(".mana-orb .mana-fire")];
      if (!canvases.length) return;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fires = canvases.map((canvas) => {
        const ctx = canvas.getContext("2d");
        const bits = Array.from({ length: 34 }, () => spawnManaBit(canvas.width, canvas.height, true));
        return { canvas, ctx, bits, white: canvas.dataset.temp === "1" };
      });
      const draw = (dt) => {
        fires.forEach(({ canvas, ctx, bits, white }) => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          bits.forEach((bit) => {
            bit.life -= dt;
            if (bit.life <= 0) Object.assign(bit, spawnManaBit(canvas.width, canvas.height, false));
            bit.x += bit.vx * dt;
            bit.y += bit.vy * dt;
            bit.vx += (Math.random() - 0.5) * 80 * dt;
            paintManaBit(ctx, bit, white);
          });
        });
      };
      if (reduce) {
        draw(0);
        return;
      }
      let last = 0;
      const frame = (now) => {
        if (gen !== manaFireGen) return;
        const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        draw(dt);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }

    function finalDamageLine(actor, card, result) {
      if (result.blocked && !result.hpLoss) return `${actor}は${card}。ブロックで防いだ。`;
      return `${actor}は${card}で${result.hpLoss}ダメージ。`;
    }

    function damageSentence(actor, card, raw, result) {
      return finalDamageLine(actor, card, result);
    }

    function mitigate(amount, defense) {
      const def = Number(defense) || 0;
      const incoming = Math.max(0, amount);
      if (def < 0) return { reduced: 0, dealt: incoming - def };
      const reduced = Math.min(def, incoming);
      return { reduced, dealt: incoming - reduced };
    }

    function parryCount(target) {
      if (!target || !target.parry) return 0;
      if (target.parry === true) return 1;
      return Math.max(0, Number(target.parry) || 0);
    }

    function clearBattleMods() {
      if (!player) return;
      player.atkMod = 0;
      player.defMod = 0;
      player.expose = 0;
      player.guardThrough = false;
      player.parry = 0;
      player.burn = 0;
      player.hurtThis = false;
      player.hurtLast = false;
      player.extraDraw = 0;
      syncGearStats();
    }

    function gainParry(card) {
      const now = parryCount(player);
      if (now > 0 && ultimate !== "パリィが重複する") {
        log(`${heroName()}は${card.name}。パリィは重複しない。`, card);
        return;
      }
      player.parry = now + 1;
      const detail = ultimate === "パリィが重複する" ? `パリィ${player.parry}。` : "パリィを得た。次の攻撃を無効。";
      log(`${heroName()}は${card.name}。${detail}`, card);
    }

    function gainBlock(amount, card) {
      const bonus = Number(player && player.def) || 0;
      const gain = Math.max(0, Math.floor((Number(amount) || 0) + bonus));
      if (!gain) return;
      if (parryCount(player) > 0 && !player.guardThrough) {
        log(`${heroName()}は${card.name}。パリィ中はシールドを得られない。`, card);
        return;
      }
      player.block += gain;
      fxShieldPlayer = true;
      log(`${heroName()}は${card.name}でブロック${gain}。`, card);
    }

    function hurtSentence(actor, card, raw, reduced, result) {
      return finalDamageLine(actor, card, result);
    }

    function strikeSentence(actor, card, base, focusAdd, atk, result) {
      return finalDamageLine(actor, card, result);
    }

    function hitPower(n) {
      const value = Math.max(1, Number(n) || 1);
      return Math.max(0, Math.min(1, (value - 1) / 14)).toFixed(2);
    }

    function noteHit(side, landed, swung, kind) {
      const n = landed > 0 ? landed : swung;
      if (n > 0) fxHit = { side, n, kind: kind || "slash" };
      if (n > 0 && side === "enemy") fxFoeHits.push(n);
    }

    // 敵への斬撃エフェクト。1ターンの中で 右上→左下、左上→右下、上→下 の順に回す。
    // 2回攻撃のカードは、この順を2つ進める。
    function slashFoe() {
      fxSlash = true;
      fxSlashes.push(slashSeq % 3);
      slashSeq += 1;
    }

    function poisonSentence(name, raw, reduced, result) {
      if (result.blocked && !result.hpLoss) return `${name}は毒。ブロックで防いだ。`;
      return `${name}は毒で${result.hpLoss}ダメージ。`;
    }

    function poisonStacks(target) {
      return Math.max(0, Number(target && target.poison) || 0);
    }

    function addPoison(target, amount) {
      if (target === player && hasStatusImmune()) {
        log(`${heroName()}は${gear.shield.name}。毒を無視した。`);
        return false;
      }
      target.poison = poisonStacks(target) + Math.max(1, Number(amount) || 1);
      return true;
    }

    function poisonBadge(stacks) {
      if (!stacks) return "";
      return `<span class="hint poison-mark">毒+${stacks}<i>${esc(POISON_NOTE)}</i></span>`;
    }

    function tickPoison(who) {
      const target = who === "player" ? player : enemy;
      const stacks = poisonStacks(target);
      if (!stacks) return false;
      const name = who === "player" ? heroName() : enemy.name;
      let amount = stacks;
      if (who === "player") {
        const extra = Math.max(0, Number(player.expose) || 0);
        if (extra) {
          player.expose = 0;
          amount += extra;
        }
      }
      const result = applyDamage(target, amount);
      if (who === "player" && result.hpLoss > 0) player.hurtThis = true;
      if (who === "player") {
        if (result.hpLoss > 0) {
          fxHurt = true;
          noteHit("player", result.hpLoss, amount, "poison");
          lastFoeBlow = { name: "毒", hpLoss: result.hpLoss };
          if (target.hp <= 0) {
            fxFatal = true;
            fatalHold = true;
          }
        }
        if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      } else if (result.hpLoss || result.blocked) {
        noteHit("enemy", result.hpLoss, stacks, "poison");
      }
      log(poisonSentence(name, stacks, 0, result));
      return target.hp <= 0;
    }

    function takeEnemyHit(raw, card) {
      const name = card && card.name ? card.name : "攻撃";
      fxStruck = true;
      const stacks = parryCount(player);
      if (stacks > 0) {
        player.parry = stacks - 1;
        noteHit("player", 0, raw);
        log(`${enemy.name}は${name}。パリィで無効。`, card, true);
        return;
      }
      const extra = Math.max(0, Number(player.expose) || 0);
      if (extra) player.expose = 0;
      const dealt = Math.max(0, raw + extra);
      const result = applyDamage(player, dealt);
      if (result.hpLoss > 0) {
        player.hurtThis = true;
        fxHurt = true;
        noteHit("player", result.hpLoss, dealt, "blunt");
        lastFoeBlow = { name, hpLoss: result.hpLoss };
        if (player.hp <= 0) {
          fxFatal = true;
          fatalHold = true;
        }
      }
      if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      log(hurtSentence(enemy.name, name, raw + extra, 0, result), card, true);
      // バトルカウンター：ダメージを食らったら、いまのDEFだけ相手へ
      if (result.hpLoss > 0 && hasReflectDef() && enemy.hp > 0 && player.hp > 0) {
        const reflect = Math.max(0, Number(player.def) || 0);
        if (reflect > 0) {
          const hit = applyDamage(enemy, reflect);
          if (hit.hpLoss || hit.blocked) {
            slashFoe();
            noteHit("enemy", hit.hpLoss, reflect);
          }
          log(`${gear.shield.name}。${enemy.name}に${reflect}ダメージ。`, card);
        }
      }
    }

    function restoreHp(amount) {
      const room = Math.max(0, player.maxHp - player.hp);
      const gain = Math.max(0, Math.min(Math.floor(Number(amount) || 0), room));
      if (!gain) return 0;
      player.hp += gain;
      fxHeal = true;
      return gain;
    }

    function runDeck() {
      const cards = [];
      const skip = {};
      for (const card of removed) {
        if (!card || !card.name) continue;
        skip[card.name] = (skip[card.name] || 0) + 1;
      }
      for (const [name, count] of CARD_POOL) {
        let left = count;
        const cut = Math.min(left, skip[name] || 0);
        left -= cut;
        skip[name] = (skip[name] || 0) - cut;
        const def = cardDef(name);
        if (!def) continue;
        for (let i = 0; i < left; i++) cards.push(keepCard({ name, ...def }));
      }
      for (const extra of stolen) {
        if (skip[extra.name] > 0) {
          skip[extra.name] -= 1;
          continue;
        }
        cards.push({ ...extra });
      }
      return cards;
    }

    function buildDeck() {
      const specs = runDeck().map((card) => ({ uid: uid++, ...card }));
      deck = shuffle(specs);
      openingDeck = deck.map((card) => ({ ...card }));
      hand = [];
      discard = [];
      inPlay = [];
      resolveAt = 0;
    }

    function draw(n) {
      for (let i = 0; i < n; i++) {
        if (hand.length >= HAND_CAP) break;
        if (!deck.length) {
          if (!discard.length) break;
          deck = shuffle(discard);
          discard = [];
          log(`${heroName()}は捨て札を山札に戻した。`);
        }
        hand.push(deck.pop());
      }
    }

    function pullKind(kind) {
      if (hand.length >= HAND_CAP) return null;
      const take = () => {
        for (let i = deck.length - 1; i >= 0; i--) {
          if (cardKind(deck[i]) === kind) return deck.splice(i, 1)[0];
        }
        return null;
      };
      let card = take();
      if (!card && !deck.length && discard.length) {
        deck = shuffle(discard);
        discard = [];
        log(`${heroName()}は捨て札を山札に戻した。`);
        card = take();
      }
      if (!card) return null;
      hand.push(card);
      return card;
    }

    function pullFromBracelets() {
      const right = gear.braceletR;
      const left = gear.braceletL;
      if (right && right.id === "chain-attack" && !hand.some((card) => cardKind(card) === "attack")) {
        if (hand.length >= HAND_CAP) log(`${heroName()}は${right.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("attack");
          log(card ? `${heroName()}は${right.name}で${card.name}を引いた。` : `${heroName()}は${right.name}。山札に攻撃カードがない。`);
        }
      }
      if (left && left.id === "chain-guard" && !hand.some((card) => cardKind(card) === "block")) {
        if (hand.length >= HAND_CAP) log(`${heroName()}は${left.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("block");
          log(card ? `${heroName()}は${left.name}で${card.name}を引いた。` : `${heroName()}は${left.name}。山札に防御カードがない。`);
        }
      }
    }

    function strike(card, amount) {
      const dealt = Math.max(0, amount);
      const result = applyDamage(enemy, dealt);
      if (dealt > 0 && (result.hpLoss || result.blocked)) {
        slashFoe();
        noteHit("enemy", result.hpLoss, dealt);
      }
      log(damageSentence(heroName(), card.name, dealt, result), card);
      // ポイズンソード：アタックカードなら、シールドで防がれても毒
      const poisonHit = gear && gear.sword && Number(gear.sword.poisonHit) || 0;
      if (poisonHit > 0 && amount > 0 && cardKind(card) === "attack" && enemy.hp > 0) {
        addPoison(enemy, poisonHit);
        log(`${gear.sword.name}の毒。${enemy.name}は毒+${enemy.poison}。`, card);
      }
      // フレイムソード／業火の剣：ダメージが通るたび炎上
      const burnHit = gear && gear.sword && Number(gear.sword.burnHit) || 0;
      if (burnHit > 0 && dealt > 0 && enemy.hp > 0) {
        addBurn(enemy, burnHit);
        log(`${gear.sword.name}の炎。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
    }

    function rollCrit(card, base) {
      if (!card.crit) return base;
      return Math.random() < (Number(card.critChance) || 0) ? card.crit : base;
    }

    function resolveCard(card) {
      syncGearStats();
      if (card.power) {
        if (card.coward) {
          player.guardThrough = true;
          log(`${heroName()}は${card.name}。この戦闘中は、パリィ中でもシールドを得る。このカードは、この戦闘のデッキから廃棄。`, card);
        }
        return;
      }
      if (card.rage) {
        player.atkMod = (Number(player.atkMod) || 0) + 1;
        player.defMod = (Number(player.defMod) || 0) - 2;
        syncGearStats();
        log(`${heroName()}は${card.name}。ATK${signed(player.atk)}、DEF${signed(player.def)}。戦闘が終わると戻る。`, card);
        return;
      }
      if (card.poise) {
        gainParry(card);
        return;
      }
      if (card.guardBreak) {
        const had = Math.max(0, Number(enemy.block) || 0);
        enemy.block = 0;
        log(had ? `${heroName()}は${card.name}。${enemy.name}のシールド${had}をすべて割った。` : `${heroName()}は${card.name}。${enemy.name}にシールドは無かった。`, card);
        return;
      }
      if (card.finisher) {
        const stacks = parryCount(player);
        player.parry = 0;
        strike(card, stacks * 15);
        return;
      }
      if (card.focus) {
        player.focus = (player.focus || 0) + card.focus;
        log(`${heroName()}は${card.name}。次の攻撃カードか防御カードの数値を+${player.focus}。`, card);
        return;
      }
      if (card.parry && !card.damage) {
        gainParry(card);
        return;
      }
      if (card.press) {
        strike(card, player.block || 0);
        return;
      }
      if (card.poison) {
        addPoison(enemy, card.poison);
        log(`${heroName()}は${card.name}。${enemy.name}は毒+${enemy.poison}。`, card);
        return;
      }
      if (card.heal) {
        const gain = restoreHp(card.heal);
        log(gain ? `${heroName()}は${card.name}で${gain}回復。` : `${heroName()}は${card.name}。体力は満タン。`, card);
        return;
      }
      if (card.draw) {
        const before = hand.length;
        draw(card.draw);
