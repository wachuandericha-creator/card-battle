    // 手札の重なりを固めてからドローを再生する（冒頭のつまり対策）
    function startHandDeal() {
      const handEl = root.querySelector(".hand");
      if (!handEl) return;
      const dealing = [...handEl.querySelectorAll(".card.deal")];
      const n = dealing.length;
      let prev = "";
      let frames = 0;
      const release = () => {
        if (!handEl.isConnected) return;
        fitHand();
        void handEl.offsetWidth;
        handEl.classList.remove("deal-pending");
        const wait = n ? 28 + 460 + (n - 1) * 62 + 50 : 0;
        if (!wait) return;
        setTimeout(() => {
          dealing.forEach((el) => {
            if (el.isConnected) {
              el.classList.remove("deal");
              el.style.removeProperty("will-change");
            }
          });
        }, wait);
      };
      const tick = () => {
        if (!handEl.isConnected) return;
        fitHand();
        const sig = `${handEl.style.getPropertyValue("--overlap")}|${handEl.style.getPropertyValue("--hand-card-h")}|${handEl.clientWidth}`;
        frames += 1;
        if ((sig === prev && frames >= 2) || frames >= 5) {
          release();
          return;
        }
        prev = sig;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    // 自分と敵の見える高さをランク比にし、大きいほうが戦闘の縦いっぱいに収まるようにする。
    function fitFighters() {
      const fxPreview = root.querySelector(".fx-lab-preview");
      if (!document.documentElement.classList.contains("stage-fit") && !fxPreview) return;
      const ally = root.querySelector(".duel-side.ally");
      const foeSide = root.querySelector(".duel-side.foe");
      const hero = root.querySelector(".hero-shoulder");
      const main = root.querySelector(".enemy-main");
      if (!ally || !foeSide || !hero || !main) return;
      const laneW = Math.min(ally.clientWidth, foeSide.clientWidth);
      const laneH = Math.min(ally.clientHeight, foeSide.clientHeight);
      if (laneW < 40 || laneH < 40) return;
      const rank = parseFloat(getComputedStyle(main).getPropertyValue("--rank")) || 1;
      const imgW = parseFloat(getComputedStyle(main).getPropertyValue("--img-w")) || 864;
      const inkH = parseFloat(getComputedStyle(main).getPropertyValue("--ink-h")) || 1152;
      const heroInk = 1068;
      const heroImg = 864;
      const headGap = 120;
      const footGap = 12;
      const roomH = Math.max(1, laneH - headGap - footGap);
      const bigger = Math.max(1, rank);
      const v0 = Math.max(1, Math.min(
        roomH / bigger,
        laneW * heroInk / heroImg,
        laneW * inkH / (rank * imgW)
      ));
      hero.style.setProperty("--foot-gap", `${footGap}px`);
      main.style.setProperty("--foot-gap", `${footGap}px`);
      hero.style.setProperty("--hero-w", `${v0 * heroImg / heroInk}px`);
      main.style.setProperty("--foe-w", `${v0 * rank * imgW / inkH}px`);
    }

    // 手札は大きいまま扇状。枚数が多いときは重ねる（潰さない）。確認はホバーで浮かせる。
    function fitHand() {
      fitFighters();
      const handEl = root.querySelector(".hand");
      if (!handEl) return;
      const cards = handEl.querySelectorAll(".card");
      const base = 44 * 0.74;
      handEl.style.setProperty("--hand-card-h", "100%");
      handEl.style.removeProperty("--hand-hang");
      const syncPiles = () => {
        const bar = handEl.parentElement;
        if (!bar) return;
        const sample = cards[0];
        const px = sample ? sample.offsetHeight : handEl.clientHeight;
        if (px > 0) bar.style.setProperty("--pile-card-h", `${Math.round(px * 0.64)}px`);
      };
      if (cards.length < 2) {
        handEl.style.setProperty("--overlap", `${base}px`);
        syncPiles();
        return;
      }
      const n = cards.length;
      const first = cards[0];
      const ratio = first.offsetWidth / Math.max(1, first.offsetHeight) || (204 / 300);
      const fullH = first.offsetHeight || handEl.clientHeight;
      const avail = handEl.clientWidth - 16;
      // 見える幅は最低限に抑え、カード本体は大きく保つ（効果確認はホバー）
      const minStep = 44;
      let cw = first.offsetWidth || Math.round(fullH * ratio);
      const fitW = avail - (n - 1) * minStep;
      if (fitW < cw) {
        const h = Math.max(fullH, fitW / ratio);
        handEl.style.setProperty("--hand-card-h", `${Math.round(h)}px`);
        cw = Math.round(h * ratio);
      }
      const need = (n * cw - avail) / (n - 1);
      const overlap = Math.min(Math.max(base, need), cw - minStep);
      handEl.style.setProperty("--overlap", `${Math.round(overlap * 10) / 10}px`);
      syncPiles();
    }
    let handPopCard = null;

    function clearHandPop() {
      if (handPopCard) handPopCard.style.opacity = "";
      handPopCard = null;
      const pop = document.getElementById("hand-pop");
      if (pop) pop.remove();
    }

    function handLayoutBox(el) {
      const w = el.offsetWidth;
      const h = el.offsetHeight;
      const ox = w / 2;
      const oy = h;
      const raw = getComputedStyle(el).transform;
      const m = !raw || raw === "none" ? new DOMMatrix() : new DOMMatrix(raw);
      const rel = [[0, 0], [w, 0], [w, h], [0, h]].map(([x, y]) => m.transformPoint(new DOMPoint(x - ox, y - oy)));
      const minX = Math.min(...rel.map((p) => p.x));
      const minY = Math.min(...rel.map((p) => p.y));
      const rect = el.getBoundingClientRect();
      const vx = rect.left - minX - ox;
      const vy = rect.top - minY - oy;
      if (!stageOn()) return { left: vx, top: vy, w, h };
      const p = viewportToStage(vx, vy);
      return { left: p.x, top: p.y, w, h };
    }

    function showHandPop(card) {
      const phoneLand = document.documentElement.classList.contains("phone") && document.documentElement.classList.contains("land");
      if (!card || card.disabled || card.classList.contains("deal") || card.closest(".hand.deal-pending") || phoneLand) {
        clearHandPop();
        return;
      }
      if (handPopCard && handPopCard !== card) handPopCard.style.opacity = "";
      handPopCard = card;
      card.style.opacity = "0";
      const key = `${card.dataset.card}|${card.className}|${card.innerHTML.length}`;
      let pop = document.getElementById("hand-pop");
      if (!pop || pop.dataset.key !== key) {
        const next = document.createElement("div");
        next.id = "hand-pop";
        next.className = `${card.className} hand-pop`;
        next.dataset.key = key;
        next.innerHTML = card.innerHTML;
        next.style.cssText = card.getAttribute("style") || "";
        if (pop) pop.remove();
        mountFloat(next);
        pop = next;
      }
      const box = handLayoutBox(card);
      pop.style.left = `${box.left}px`;
      pop.style.top = `${box.top}px`;
      pop.style.width = `${box.w}px`;
      pop.style.height = `${box.h}px`;
    }

    document.addEventListener("pointermove", (event) => {
      const el = event.target instanceof Element ? event.target : null;
      const card = el && el.closest(".hand .card");
      if (!card) clearHandPop();
      else showHandPop(card);
    });

    function phoneLayout() {
      return Math.min(window.innerWidth, window.innerHeight) <= 500;
    }
    function fitStage() {
      const doc = document.documentElement;
      const stageW = 2560;
      const stageH = 1440;
      doc.classList.toggle("iphone-play", iphonePlay);
      if (!iphonePlay && phoneLayout()) {
        doc.classList.add("phone");
        doc.classList.toggle("land", window.innerWidth > window.innerHeight);
        doc.classList.remove("stage-fit");
        doc.style.removeProperty("--fit");
        return;
      }
      doc.classList.remove("phone", "land");
      const view = window.visualViewport;
      const vw = view ? view.width : window.innerWidth;
      const vh = view ? view.height : window.innerHeight;
      const scale = iphonePlay
        ? Math.min(vw / stageH, vh / stageW)
        : Math.min(vw / stageW, vh / stageH);
      doc.classList.add("stage-fit");
      doc.style.setProperty("--fit", String(Number.isFinite(scale) && scale > 0 ? scale : 1));
    }
    window.addEventListener("resize", () => {
      fitStage();
      if (screen === "battle") fitHand();
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        fitStage();
        if (screen === "battle") fitHand();
      });
    }
    window.matchMedia("(max-width: 500px), (max-height: 500px)").addEventListener("change", () => {
      fitStage();
      if (screen === "battle") fitHand();
    });
    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        fitStage();
        if (screen === "battle") fitHand();
      }, 80);
    });

    // 注釈（パリィ・毒・炎上など）はカードの中ではなく、カードの外の吹き出しに出す。
    // カードに乗ると、そのカードの注釈をまとめてカードの右（入らなければ左）に出す。
    const kwTip = document.createElement("div");
    kwTip.className = "kw-tip";
    kwTip.hidden = true;
    mountFloat(kwTip);
    let kwTipAnchor = null;
    // 手札は乗ると持ち上がる。動きが終わるまで待ってから出す（そのあいだに別のカードへ移ったら出さない）
    const KW_TIP_DELAY = 300;
    let kwTipTimer = 0;

    function hideKwTip() {
      clearTimeout(kwTipTimer);
      kwTipAnchor = null;
      kwTip.hidden = true;
    }

    function placeKwTip(anchor) {
      const placed = placeAnchored(kwTip, anchor, { gap: 12, pad: 8 });
      const arrowY = placed.frame.cy - placed.top;
      kwTip.style.setProperty("--arrow-y", `${Math.round(Math.max(14, Math.min(placed.h - 14, arrowY)))}px`);
      kwTip.classList.toggle("left", placed.sideLeft);
    }

    function showKwTip(anchor) {
      const hints = anchor.matches(".hint") ? [anchor] : [...anchor.querySelectorAll(".hint")];
      const items = hints.map((hint) => {
        const note = hint.querySelector("i");
        const word = hint.dataset.word || [...hint.childNodes].filter((node) => node.nodeType === Node.TEXT_NODE).map((node) => node.textContent).join("").trim();
        return note && note.textContent ? `<p><b>${esc(word)}</b><span>${esc(note.textContent)}</span></p>` : "";
      }).filter(Boolean);
      if (!items.length) { hideKwTip(); return; }
      clearTimeout(kwTipTimer);
      kwTipAnchor = anchor;
      kwTip.hidden = true;
      kwTipTimer = setTimeout(() => {
        if (kwTipAnchor !== anchor || !anchor.isConnected) return;
        kwTip.innerHTML = items.join("");
        kwTip.hidden = false;
        placeKwTip(anchor);
      }, KW_TIP_DELAY);
    }

    function kwAnchorOf(target) {
      const el = target instanceof Element ? target : target && target.parentElement;
      if (!el) return null;
      const card = el.closest(".card");
      if (card && card.querySelector(".hint")) return card;
      const play = el.closest(".play-card");
      if (play) {
        const inner = play.querySelector(".card");
        if (inner && inner.querySelector(".hint")) return inner;
      }
      return el.closest(".hint");
    }

    root.addEventListener("pointerover", (event) => {
      const anchor = kwAnchorOf(event.target);
      if (!anchor) { if (kwTipAnchor) hideKwTip(); return; }
      // まだ出ていないあいだに別のカードへ移ったら、待ちをやり直す
      if (anchor !== kwTipAnchor || kwTip.hidden) showKwTip(anchor);
    });
    root.addEventListener("pointerout", (event) => {
      if (!kwTipAnchor) return;
      const next = kwAnchorOf(event.relatedTarget);
      if (next !== kwTipAnchor) hideKwTip();
    });
    root.addEventListener("pointermove", (event) => {
      if (!kwTipAnchor || kwTipAnchor.isConnected) return;
      const anchor = kwAnchorOf(event.target);
      if (anchor) showKwTip(anchor); else hideKwTip();
    });
    root.addEventListener("pointerdown", hideKwTip, true);
    window.addEventListener("scroll", hideKwTip, true);

    // ダブルクリックは「選んで進む」。キャラの駒はダンジョン選択へ、ダンジョンの駒は挑戦開始。
    root.addEventListener("dblclick", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      const action = el.closest("[data-action]");
      if (!action) return;
      const name = action.dataset.action;
      if (name === "cast-token") {
        castLock = action.dataset.cast || castLock;
        castHover = "";
        screen = "dungeon";
        render();
      }
      if (name === "dungeon-token") {
        const picked = action.dataset.dungeon || "";
        const item = DUNGEON_LIST.find((dungeon) => dungeon.name === picked);
        dungeonHover = "";
        if (!item || !dungeonOpen(item.floors)) return;
        dungeonView = "";
        dungeonLock = picked;
        pendingDungeon = item;
        paintDungeon();
        if (challengeReady()) departRun(pendingDungeon.floors, pendingDungeon.name);
      }
    });

    root.addEventListener("click", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      if (el.classList.contains("foe-starter")) { closeFoeStarter(); return; }
      const action = el.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "fullscreen") { toggleFullscreen(); return; }
        if (name === "road-home") { placeRoad("home"); return; }
        if (name === "title") goTitle();
        if (name === "ask-title") { askLeave = true; showDeck = false; showFoeDeck = false; render(); }
        if (name === "toggle-map") { eventMapOpen = !eventMapOpen; render(); }
        if (name === "toggle-deck") { eventDeckOpen = !eventDeckOpen; render(); }
        if (name === "deck") { showFoeDeck = false; showDeck = true; render(); }
        if (name === "close-deck") { showDeck = false; render(); }
        if (name === "foe-deck") { showDeck = false; showFoeDeck = true; render(); }
        if (name === "close-foe-deck") { showFoeDeck = false; render(); }
        if (name === "foe-starter") { openFoeStarter(action.dataset.foe || ""); return; }
        if (name === "close-foe-starter") { closeFoeStarter(); return; }
        if (name === "stay") { askLeave = false; render(); }
        if (name === "settings") { returnScreen = screen; screen = "settings"; render(); }
        if (name === "fx-lab") {
          if (screen !== "fx") returnScreen = screen;
          screen = "fx";
          render();
        }
        if (name === "fx-play") {
          fxLabId = action.dataset.fx || "guard";
          fxLabTick += 1;
          screen = "fx";
          render();
        }
        if (name === "fx-replay") {
          fxLabTick += 1;
          screen = "fx";
          render();
        }
        if (name === "fx-foe") {
          const pick = action.dataset.foeName || "スライム";
          if (enemyByName(pick)) fxLabFoeName = enemyByName(pick).name;
          fxLabTick += 1;
          screen = "fx";
          render();
        }
        if (name === "back") { screen = returnScreen; render(); }
        if (name === "toggle-log") { showLog = !showLog; persistSettings(); render(); }
        if (name === "phone-log") {
          if (!showLog) { showLog = true; persistSettings(); }
          phoneLogOpen = !phoneLogOpen;
          render();
        }
        if (name === "toggle-auto-end") { autoEndTurn = !autoEndTurn; persistSettings(); render(); }
        if (name === "fill-hand-look") { fillHandForLook(); return; }
        if (name === "medal-look") {
          if (screen === "settings" && returnScreen === "battle") {
            gear.medals = 10;
            screen = "battle";
            render();
          }
          return;
        }
        if (name === "option-event") {
          launchOptionEvent(action.dataset.eventKind || "");
          return;
        }
        if (name === "album") { clearArtZoom(); albumScrollTop = 0; screen = "album"; render(); }
        if (name === "close-art-zoom") {
          if (screen === "album" || screen === "sheet") captureAlbumScroll();
          clearArtZoom();
          render();
          return;
        }
        if (name === "sheet") { clearArtZoom(); albumScrollTop = 0; screen = "sheet"; render(); }
        if (name === "odds") { screen = "odds"; render(); }
        if (name === "character") {
          castHover = "";
          castLock = castLock || "戦士";
          dungeonHover = "";
          screen = "character";
          render();
        }
        if (name === "open-dungeon") { castLock = shownCastName(); castLit = true; screen = "dungeon"; render(); }
        if (name === "cast-token") {
          castLock = action.dataset.cast || castLock;
          castHover = "";
          castLit = true;
          paintCast();
        }
        if (name === "cast-pick") { castPicked = true; render(); }
        if (name === "cast-back") { castPicked = false; render(); }
        if (name === "character-next") {
          if (challengeReady()) {
            const chosen = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock) || pendingDungeon;
            if (chosen) departRun(chosen.floors, chosen.name);
          } else paintChallengeStart();
        }
        if (name === "cast-stay") { screen = "character"; render(); }
        if (name === "dungeon-list") { screen = "dungeon"; render(); }
        if (name === "dungeon-token") {
          const picked = action.dataset.dungeon || "";
          const item = DUNGEON_LIST.find((dungeon) => dungeon.name === picked);
          dungeonHover = "";
          if (!item || !dungeonOpen(item.floors)) return;
          dungeonView = "";
          dungeonLock = picked;
          dungeonLit = true;
          pendingDungeon = item;
          paintDungeon();
        }
        if (name === "dungeon-start") {
          pendingDungeon = DUNGEON_LIST.find((dungeon) => dungeon.name === action.dataset.dungeon) || DUNGEON_LIST[0];
          if (!dungeonOpen(pendingDungeon.floors)) {
            paintDungeon();
            return;
          }
          screen = "dungeon-gate";
          render();
        }
        if (name === "dungeon-enter") {
          const chosen = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock) || pendingDungeon;
          if (chosen && dungeonOpen(chosen.floors)) departRun(chosen.floors, chosen.name);
        }
        if (name === "floor-next") finishEvent();
        if (name === "smith-leave") finishEvent();
        if (name === "smith-back") { floorPhase = "show"; render(); }
        if (name === "smith-fuse") {
          if ((Number(meta.stars) || 0) < 3) return;
          floorPhase = "smith-base";
          render();
        }
        if (name === "smith-enchant") {
          if ((Number(meta.stars) || 0) < 2) return;
          if (!enchantTargets(false).length) return;
          smithName = "";
          enchantPop = "smith";
          render();
        }
        if (name === "smith-base") {
          smithBase = Number(action.dataset.index);
          floorPhase = "smith-mat";
          render();
        }
        if (name === "smith-mat") fuseSmith(Number(action.dataset.index));
        if (name === "smith-name") {
          smithName = action.dataset.name || "";
          render();
        }
        if (name === "smith-enchant-ok") {
          if (!smithName || enchantTargets(false).indexOf(smithName) < 0) return;
          enchantPop = "smith-elem";
          render();
        }
        if (name === "enchant-back") {
          if (enchantPop === "smith-elem") enchantPop = "smith";
          else {
            enchantPop = "";
            blessCardName = "";
            smithName = "";
          }
          render();
        }
        if (name === "smith-elem") enchantSmith(action.dataset.elem || "");
        if (name === "mastery-power") takeMastery("power");
        if (name === "mastery-light") takeMastery("light");
        if (name === "bless-pick") takeBless(Number(action.dataset.bless));
        if (name === "train-pick") takeTrain(Number(action.dataset.train));
        if (name === "bless-enchant-pick") {
          blessCardName = action.dataset.name || "";
          render();
        }
        if (name === "bless-enchant-ok") confirmBlessEnchant();
        if (name === "bless-enchant-back") {
          blessCardName = "";
          blessEnchantAt = -1;
          enchantPop = "";
          render();
        }
        if (name === "bless-skip") advance(1);
        if (name === "beggar-pick") pickBeggar(Number(action.dataset.index));
        if (name === "beggar-confirm") confirmBeggar();
        if (name === "beggar-skip") skipBeggar();
        if (name === "search-take") takeSearchGear();
        if (name === "search-skip") skipSearchGear();
        if (name === "iphone-play") {
          iphonePlay = !iphonePlay;
          try { sessionStorage.setItem("card-battle-iphone-play", iphonePlay ? "1" : "0"); } catch (error) { /* 保存できないブラウザでは、この画面のあいだだけ回す */ }
          fitStage();
          render();
          return;
        }
        if (name === "new") {
          if (!loginWord) { passFrom = "new"; passError = ""; screen = "pass"; render(); }
          else { castPicked = false; screen = "character"; render(); }
        }
        if (name === "account") { if (!loginWord) return; screen = "account"; render(); }
        if (name === "logout") logout();
        if (name === "wipe-ask") { screen = "wipe"; render(); }
        if (name === "wipe-again") { screen = "wipe2"; render(); }
        if (name === "wipe-yes") wipeLogin();
        if (name === "pass-switch") { passFrom = "switch"; passError = ""; screen = "pass"; render(); }
        if (name === "pass-ok") {
          const input = root.querySelector("#pass-word");
          const word = input ? input.value : "";
          if (!word) { passError = "入れてください。"; render(); return; }
          if (!/^[ぁ-んー]+$/.test(word)) { passError = "ひらがなだけで、空白は入れない。"; render(); return; }
          setLogin(word);
          passError = "";
          if (passFrom === "switch") { screen = "title"; render(); return; }
          castPicked = false;
          screen = "character";
          render();
          return;
        }
        if (name === "reward-card") takeReward(Number(action.dataset.reward));
        if (name === "reward-boss") takeBossPick(Number(action.dataset.reward));
        if (name === "reward-skip") skipReward();
        if (name === "reward-path") takePath(action.dataset.path || "");
        if (name === "reward-go") applyPath("straight");
        if (name === "shop-buy") buyShop(Number(action.dataset.slot));
        if (name === "gear-offer-yes") acceptGearOffer();
        if (name === "gear-offer-no") declineGearOffer();
        return;
      }
      const albumBtn = el.closest("[data-album]");
      if (albumBtn && screen === "album") {
        albumTab = albumBtn.dataset.album || "all";
        albumScrollTop = 0;
        render();
        return;
      }
      const zoomCard = el.closest("[data-art-zoom]");
      if (zoomCard && screen === "album") {
        const name = zoomCard.dataset.artZoom || "";
        captureAlbumScroll();
        albumZoom = albumZoom === name ? "" : name;
        render();
        return;
      }
      const sheetZoomBtn = el.closest("[data-sheet-zoom]");
      if (sheetZoomBtn && screen === "sheet") {
        const src = sheetZoomBtn.dataset.sheetZoom || "";
        const title = sheetZoomBtn.dataset.sheetZoomTitle || "画像";
        captureAlbumScroll();
        sheetZoom = sheetZoom && sheetZoom.src === src ? null : { src, title };
        render();
        return;
      }
      if (screen !== "battle") return;
      const gearBtn = el.closest("[data-gear]");
      if (gearBtn) {
        const id = gearBtn.dataset.gear;
        gearOpen = gearOpen === id ? null : id;
        gearHover = id;
        paintGear();
        return;
      }
      const recall = el.closest("[data-unplay]");
      if (recall) {
        unplayFromPlay(Number(recall.dataset.unplay));
        return;
      }
      const card = el.closest("[data-card]");
      if (card) playFromHand(Number(card.dataset.card));
      if (el.closest("[data-end]")) endTurn();
    });

    document.addEventListener("fullscreenchange", paintFullscreenLabels);
    document.addEventListener("webkitfullscreenchange", paintFullscreenLabels);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && fullscreenActive()) return;
      if (event.key === "Escape" && ((screen === "album" && albumZoom) || (screen === "sheet" && sheetZoom))) {
        captureAlbumScroll();
        clearArtZoom();
        render();
        return;
      }
      if (event.key === "Escape" && root.querySelector(".foe-starter")) { closeFoeStarter(); return; }
      if (screen !== "battle" || askLeave) return;
      if (showDeck || showFoeDeck) {
        if (event.key === "Escape") { showDeck = false; showFoeDeck = false; render(); }
        return;
      }
      if (event.key === "Enter") endTurn();
      if (/^[1-9]$/.test(event.key) || event.key === "0") {
        playFromHand(event.key === "0" ? 9 : Number(event.key) - 1);
      }
    });

    fitStage();
    loadSettings();
    loadAccount();
    if (!resumeLive()) render();
  </script>
</body>
</html>
