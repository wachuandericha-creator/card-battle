    function pileMarkup(kind, count) {
      const label = kind === "deck" ? "山札" : "捨て札";
      const empty = count === 0;
      const stack = count > 1 ? " stack" : "";
      const look = empty ? "empty" : kind === "deck" ? "back" : "back discard";
      return `<div class="pile" aria-label="${label} ${count}"><div class="pile-card ${look}${stack}"><span class="pile-count">${count}</span></div><div class="pile-label">${label}</div></div>`;
    }

    function cardKind(card) {
      if (card.parry) return "block";
      if (card.focus) return "skill";
      if (card.press) return "attack";
      if (card.poison) return "skill";
      if (card.damage && !card.block) return "attack";
      if (card.block && !card.damage) return "block";
      return "skill";
    }

    function cardFace(card, adjusted) {
      const atk = adjusted && player ? (player.atk || 0) : 0;
      const shown = card.damage ? (adjusted ? Math.max(0, card.damage + atk) : card.damage) : 0;
      const tone = card.damage && adjusted && shown > card.damage ? "up" : card.damage && adjusted && shown < card.damage ? "down" : "";
      const noteText = card.note
        ? esc(card.text).replaceAll("パリィ", `<span class="hint">パリィ<i>${esc(card.note)}</i></span>`)
        : esc(card.text).replaceAll("\n", "<br>");
      const effects = [
        card.damage ? `<span class="fx attack">${swordIcon()}<b class="${tone}">${shown}</b></span>` : "",
        card.block ? `<span class="fx block">${shieldIcon()}<b>${card.block}</b></span>` : "",
      ].join("") || `<span class="fx note">${noteText}</span>`;
      const stars = card.stars || 1;
      return `<div class="card-fit"><div class="nameplate"><span class="cost">${card.cost}</span><div class="name">${esc(card.name)}</div></div><div class="art" aria-hidden="true"></div><div class="text">${effects}</div><div class="rarity" aria-label="レアリティ ${stars}">${"★".repeat(stars)}</div></div>`;
    }

    function playFace(card, on, adjusted) {
      return `<div class="play-card${on ? " on" : ""}"><div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card, adjusted)}</div></div>`;
    }

    function playRow() {
      const foe = intentAt(0);
      const hot = phase === "resolve" ? resolveAt - 1 : -1;
      const mine = inPlay.map((card, i) => playFace(card, hot === i, true)).join("");
      return `<div class="play-row" aria-label="プレイエリア"><div class="play-side mine"><span class="play-label">自分</span><div class="play-cards">${mine}</div></div><div class="play-side foe"><span class="play-label">敵</span><div class="play-cards">${playFace(foe, hot === inPlay.length, false)}</div></div></div>`;
    }

    let heroImage = null;
    let heroImageTask = null;
    let heroLiveGen = 0;
    let heroLiveRaf = 0;

    function ensureHeroImage() {
      if (heroImage) return Promise.resolve(heroImage);
      if (!heroImageTask) {
        heroImageTask = new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => { heroImage = img; resolve(img); };
          img.onerror = () => reject(new Error("hero"));
          img.src = "hero-shoulder.png?v=18";
        });
      }
      return heroImageTask;
    }

    function smooth01(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      return t * t * (3 - 2 * t);
    }

    function falloff(d) {
      if (d >= 1) return 0;
      const t = 1 - d;
      return t * t * (3 - 2 * t);
    }

    function heroShoulder(vitals) {
      return `<div class="hero-shoulder"><img class="hero-fig" src="hero-shoulder.png?v=18" alt="戦士">${vitals}</div>`;
    }

    function startHeroIdle() {
      const canvas = document.querySelector(".hero-live");
      const gen = ++heroLiveGen;
      cancelAnimationFrame(heroLiveRaf);
      if (!canvas) return;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      ensureHeroImage().then((img) => {
        if (gen !== heroLiveGen || !canvas.isConnected) return;
        runHeroLive(canvas, img, gen, reduce);
      }).catch(() => {});
    }

    function runHeroLive(canvas, img, gen, reduce) {
      const ctx = canvas.getContext("2d", { alpha: true });
      let model = null;
      let frame = null;
      let last = 0;

      function rebuild() {
        const cssW = Math.max(1, canvas.clientWidth);
        const cssH = Math.max(1, canvas.clientHeight);
        let dpr = Math.min(window.devicePixelRatio || 1, 1.35);
        let cw = Math.round(cssW * dpr);
        let ch = Math.round(cssH * dpr);
        const cap = 680;
        if (cw > cap) {
          ch = Math.round(ch * cap / cw);
          cw = cap;
        }
        canvas.width = cw;
        canvas.height = ch;
        const scale = Math.min(cw / img.naturalWidth, ch / img.naturalHeight);
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        const left = 0;
        const top = ch - dh;
        ctx.imageSmoothingEnabled = true;
        ctx.clearRect(0, 0, cw, ch);
        ctx.drawImage(img, left, top, dw, dh);
        const snap = ctx.getImageData(0, 0, cw, ch);
        const straight = new Uint8ClampedArray(snap.data);
        const premul = new Uint8ClampedArray(straight);
        for (let i = 0; i < premul.length; i += 4) {
          const a = premul[i + 3] / 255;
          premul[i] *= a;
          premul[i + 1] *= a;
          premul[i + 2] *= a;
        }
        const pad = 20;
        const x0 = Math.max(0, Math.floor(left) - pad);
        const y0 = Math.max(0, Math.floor(top) - pad);
        const x1 = Math.min(cw, Math.ceil(left + dw) + pad);
        const y1 = Math.min(ch, Math.ceil(top + dh) + pad);
        const rw = Math.max(0, x1 - x0);
        const rh = Math.max(0, y1 - y0);
        const field = new Float32Array(rw * rh * 10);
        const breathAmp = dh * 0.016;
        for (let y = 0; y < rh; y++) {
          const v = (y0 + y - top) / dh;
          for (let x = 0; x < rw; x++) {
            const u = (x0 + x - left) / dw;
            const head = falloff(Math.hypot((u - 0.30) / 0.22, (v - 0.17) / 0.20));
            let chest = falloff(Math.hypot((u - 0.38) / 0.26, (v - 0.62) / 0.42));
            chest *= smooth01((u - 0.14) / 0.12) * smooth01((v - 0.30) / 0.10);
            let shield = falloff(Math.hypot((u - 0.15) / 0.18, (v - 0.68) / 0.34));
            shield *= smooth01((0.38 - u) / 0.12);
            const arm = smooth01((u - 0.60) / 0.12) * smooth01((v - 0.46) / 0.10) * smooth01((0.92 - v) / 0.10);
            const hair = head * smooth01((0.15 - v) / 0.10);
            const sumW = head + chest + shield + arm;
            if (sumW < 0.04 && hair < 0.04) continue;
            const p = (y * rw + x) * 10;
            field[p] = sumW;
            field[p + 1] = chest * breathAmp * (u - 0.38) * 0.55;
            field[p + 2] = chest * -breathAmp;
            field[p + 3] = head * -((v - 0.38) * dh);
            field[p + 4] = head * ((u - 0.30) * dw);
            field[p + 5] = shield * -((v - 0.68) * dh);
            field[p + 6] = shield * ((u - 0.15) * dw);
            field[p + 7] = arm * -((v - 0.79) * dh);
            field[p + 8] = arm * ((u - 0.88) * dw);
            field[p + 9] = hair;
          }
        }
        model = { cw, ch, straight, premul, field, x0, y0, rw, rh, cssW, cssH, hairAmp: dh * 0.022 };
        frame = ctx.createImageData(cw, ch);
      }

      function paint(now) {
        const dst = frame.data;
        const { cw, ch, straight, premul, field, x0, y0, rw, rh, hairAmp } = model;
        dst.set(straight);
        const t = now / 1000;
        const breath = Math.sin(t * 1.05);
        const hairS = Math.sin(t * 0.78 + 1.2);
        const headA = Math.sin(t * 0.4) * 0.012;
        const shieldA = Math.sin(t * 0.48 + 0.9) * 0.07;
        const armA = Math.sin(t * 0.55 + 2.0) * 0.09;
        for (let y = 0; y < rh; y++) {
          const cy = y0 + y;
          const row = y * rw;
          for (let x = 0; x < rw; x++) {
            const p = (row + x) * 10;
            const sumW = field[p];
            const hairW = field[p + 9];
            if (sumW < 0.04 && hairW < 0.04) continue;
            let dx = 0;
            let dy = 0;
            dx = breath * field[p + 1] + headA * field[p + 3] + shieldA * field[p + 5] + armA * field[p + 7];
            dy = breath * field[p + 2] + headA * field[p + 4] + shieldA * field[p + 6] + armA * field[p + 8];
            dx += hairS * hairAmp * hairW;
            dy += hairS * hairAmp * 0.22 * hairW;
            const sx = x0 + x - dx;
            const sy = cy - dy;
            const xi = sx | 0;
            const yi = sy | 0;
            const di = (cy * cw + x0 + x) * 4;
            if (xi < 0 || yi < 0 || xi + 1 >= cw || yi + 1 >= ch) {
              dst[di] = dst[di + 1] = dst[di + 2] = dst[di + 3] = 0;
              continue;
            }
            const tx = sx - xi;
            const ty = sy - yi;
            const ax = 1 - tx;
            const ay = 1 - ty;
            const i00 = (yi * cw + xi) * 4;
            const i10 = i00 + 4;
            const i01 = i00 + cw * 4;
            const i11 = i01 + 4;
            const w00 = ax * ay;
            const w10 = tx * ay;
            const w01 = ax * ty;
            const w11 = tx * ty;
            const a = premul[i00 + 3] * w00 + premul[i10 + 3] * w10 + premul[i01 + 3] * w01 + premul[i11 + 3] * w11;
            if (a < 1) {
              dst[di] = dst[di + 1] = dst[di + 2] = dst[di + 3] = 0;
              continue;
            }
            const inv = 255 / a;
            dst[di] = (premul[i00] * w00 + premul[i10] * w10 + premul[i01] * w01 + premul[i11] * w11) * inv;
            dst[di + 1] = (premul[i00 + 1] * w00 + premul[i10 + 1] * w10 + premul[i01 + 1] * w01 + premul[i11 + 1] * w11) * inv;
            dst[di + 2] = (premul[i00 + 2] * w00 + premul[i10 + 2] * w10 + premul[i01 + 2] * w01 + premul[i11 + 2] * w11) * inv;
            dst[di + 3] = a;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }

      function tick(now) {
        if (gen !== heroLiveGen || !canvas.isConnected) return;
        if (canvas.clientWidth !== model.cssW || canvas.clientHeight !== model.cssH) rebuild();
        if (!document.hidden && now - last >= 64) {
          last = now;
          paint(now);
        }
        heroLiveRaf = requestAnimationFrame(tick);
      }

      rebuild();
      if (reduce) return;
      paint(performance.now());
      heroLiveRaf = requestAnimationFrame(tick);
    }
    function traitNote() {
      const trait = enemyNow().trait;
      if (!trait) return "";
      return `<aside class="trait-note"><span class="trait-label">特性</span><span>${esc(trait)}</span></aside>`;
    }

    function sortedCards(cards) {
      return cards.slice().sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name, "ja"));
    }

    function deckGroup(label, cards) {
      const faces = sortedCards(cards).map((card) =>
        `<div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div>`
      ).join("");
      return `<section class="deck-group"><h3>${label} ${cards.length}</h3><div class="deck-cards">${faces || `<p class="deck-empty">なし</p>`}</div></section>`;
    }

    function deckOverlay() {
      if (!showDeck || outcome || askLeave) return "";
      const cards = openingDeck.length ? openingDeck : deck.concat(hand, inPlay, discard);
      return `<div class="overlay deck-view"><div class="panel"><h2>戦闘開始前のデッキ</h2>${deckGroup("開始前", cards)}<button type="button" data-action="close-deck">閉じる</button></div></div>`;
    }

    const PATHS = {
      straight: { name: "戦闘", text: "次の戦いに進む。", image: "path-fight.jpg" },
      skip: { name: "走り抜ける", text: "階層を1つ飛ばして、ゴールに近づく。", image: "path-dash.jpg?v=2" },
      detour: { name: "回り道", text: "カードと装備の報酬。戦闘が1回増える。" },
      shop: { name: "お店", text: "★で買い物。品ぞろえはこれから。", image: "path-shop.jpg?v=2" },
      retreat: { name: "引き返す", text: "いまの敵と再戦。この先は、もう引き返せない。", image: "path-retreat.jpg?v=2" },
      camp: { name: "キャンプ", text: "体力が全快する。あとはまっすぐ進むと同じ。" },
      search: { name: "探索", text: "カード、装備、アイテムのどれか。半分で戦闘。", image: "path-search.jpg" },
      unknown: { name: "未知", text: "何があるかわからない。", image: "path-unknown.jpg" },
    };

    function starsForRank(rank) {
      if (rank === "強敵") return 3;
      if (rank === "普通") return 2;
      return 1;
    }

    function keepCard(card) {
      const next = { name: card.name, cost: card.cost, text: card.text, damage: card.damage, block: card.block };
      if (card.focus) next.focus = card.focus;
      if (card.parry) next.parry = true;
      if (card.poison) next.poison = true;
      if (card.press) next.press = true;
      return next;
    }

    function rewardPool() {
      const list = Object.keys(COMMON).map((name) => ({ ...keepCard({ name, ...COMMON[name], stars: 1 }), source: "共通" }));
      if (job === "パラディン") {
        for (const name of Object.keys(CARDS)) list.push({ ...keepCard({ name, ...CARDS[name], stars: 1 }), source: "戦士" });
      }
      const seen = new Set();
      for (const card of enemyNow().pattern) {
        if (seen.has(card.name)) continue;
        seen.add(card.name);
        list.push({ ...keepCard(card), source: "敵" });
      }
      return list;
    }

    function drawDistinct(n) {
      return shuffle(rewardPool()).slice(0, n);
    }

    function clearReward() {
      rewardReady = false;
      rewardStars = 0;
      rewardPicks = [];
      rewardPaths = [];
      rewardStep = "cards";
      bonusCard = null;
    }

    function rollPaths() {
      const ids = ["skip", "shop", "search", "unknown"];
      if (!retreatUsed) ids.push("retreat");
      return ["straight"].concat(shuffle(ids).slice(0, 2));
    }

    function prepareReward() {
      if (rewardReady) return;
      rewardReady = true;
      rewardStars = enemyNow().tier || starsForRank(enemyNow().rank);
      meta.stars = (Number(meta.stars) || 0) + rewardStars;
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      rewardPicks = drawDistinct(3);
      rewardPaths = [];
      rewardStep = "cards";
      bonusCard = null;
    }

    function skipReward() {
      if (rewardStep === "cards") {
        rewardPaths = rollPaths();
        rewardStep = "paths";
        persistSave(true);
        render();
        return;
      }
      if (rewardStep === "detour") {
        bonusCard = null;
        render();
      }
    }

    function takeBonus() {
      if (rewardStep !== "detour" || !bonusCard) return;
      stolen.push(keepCard(bonusCard));
      bonusCard = null;
      persistSave(true);
      render();
    }
    function takeReward(index) {
      if (rewardStep !== "cards") return;
      const card = rewardPicks[index];
      if (!card) return;
      stolen.push(keepCard(card));
      rewardPaths = rollPaths();
      rewardStep = "paths";
      persistSave(true);
      render();
    }

    function advance(step) {
      const hp = screen === "floor" ? floorHp : (player ? player.hp : floorHp);
      const next = battleIndex + step;
      outcome = null;
      if (next >= battleTotal) {
        clearReward();
        cleared = true;
        endRun(true);
        screen = "title";
        render();
        return;
      }
      battleIndex = next;
      enterNode(hp);
    }

    function applyPath(id) {
      if (rewardStep === "done" || rewardStep === "cards") return;
      const from = rewardStep;
      rewardStep = "done";
      if (id === "camp") restoreHp(player.maxHp - player.hp);
      if (id === "retreat") {
        if (from !== "paths") return;
        retreatUsed = true;
        const hp = player.hp;
        outcome = null;
        startBattle(hp);
        return;
      }
      advance(id === "skip" ? 2 : 1);
    }

    function takePath(id) {
      if (rewardStep !== "paths" || !PATHS[id]) return;
      if (id === "search" || id === "unknown") {
        if (id === "unknown" && Math.random() < 0.5) {
          const roll = Math.random();
          if (roll < 0.34) {
            applyPath("camp");
            return;
          }
          if (roll < 0.67) {
            rewardStep = "shop";
            persistSave(true);
            render();
            return;
          }
        }
        if (Math.random() < 0.5) {
          addDetourFight();
          applyPath("straight");
          return;
        }
        floorNote = grantExplore();
        rewardStep = "event";
        persistSave(true);
        render();
        return;
      }
      if (id === "shop") {
        rewardStep = "shop";
        persistSave(true);
        render();
        return;
      }
      if (id === "detour") {
        addDetourFight();
        const extra = drawDistinct(1)[0] || null;
        bonusCard = extra;
        rewardStep = "detour";
        persistSave(true);
        render();
        return;
      }
      applyPath(id);
    }

    function rewardOverlay() {
      if (outcome !== "win") return "";
      if (rewardStep === "cards") {
        const picks = rewardPicks.map((card, i) => `<button type="button" class="reward-pick" data-action="reward-card" data-reward="${i}"><p class="reward-source">${esc(card.source || "")}</p><div class="card preview ${cardKind(card)}">${cardFace(card)}</div></button>`).join("");
        return `<div class="overlay"><div class="panel wide"><h2>勝った</h2><p>★${rewardStars}もらった。所持 ★${meta.stars}</p><p>ほしいカードを押す。</p><div class="reward-row">${picks}</div><button type="button" data-action="reward-skip">スキップ</button></div></div>`;
      }
      if (rewardStep === "paths") {
        const buttons = rewardPaths.map((id) => {
          const path = PATHS[id];
          const picture = path.image ? `<img src="${path.image}" alt="">` : "";
          return `<button type="button" data-action="reward-path" data-path="${id}">${picture}<b>${esc(path.name)}</b><span>${esc(path.text)}</span></button>`;
        }).join("");
        return `<div class="overlay"><div class="panel wide"><h2>道を選ぶ</h2><p>所持 ★${meta.stars}</p><div class="path-list">${buttons}</div></div></div>`;
      }
      if (rewardStep === "shop") {
        return `<div class="overlay"><div class="panel"><h2>お店</h2><p>所持 ★${meta.stars}</p><p>品ぞろえは、これから決める。</p><button type="button" data-action="reward-go">出ていく</button></div></div>`;
      }
      if (rewardStep === "event") {
        return `<div class="overlay"><div class="panel"><h2>探索</h2><p>${esc(floorNote)}</p><button type="button" data-action="reward-go">進む</button></div></div>`;
      }
      const bonus = bonusCard
        ? `<button type="button" class="reward-pick" data-action="reward-bonus"><div class="card preview ${cardKind(bonusCard)}">${cardFace(bonusCard)}</div></button><button type="button" data-action="reward-skip">スキップ</button>`
        : "";
      return `<div class="overlay"><div class="panel"><h2>回り道</h2><p>戦闘が1回増えた。</p>${bonus}<p>装備の報酬は、装備が来てから。</p><button type="button" data-action="reward-go">進む</button></div></div>`;
    }

    function sortHand() {
      const rank = (card) => {
        const kind = cardKind(card);
        if (kind === "attack") return 0;
        if (kind === "block") return 1;
        if (kind === "skill") return 2;
        return 3;
      };
      hand.sort((a, b) => rank(a) - rank(b) || a.cost - b.cost || String(a.name).localeCompare(b.name, "ja"));
    }

    function renderBattle() {
      sortHand();
      const dealNow = fxDeal;
      const cards = hand.map((card, i) => {
        const poor = player.energy < card.cost;
        const mid = (hand.length - 1) / 2;
        const dist = i - mid;
        const t = mid === 0 ? 0 : dist / mid;
        const fan = Math.round(t * 10 * 10) / 10;
        const drop = Math.round((8 * Math.abs(t) + 4 * t * t) * 10) / 10;
        const label = `${card.cost} ${card.name} ${String(card.text).replace(/\n/g, " ")}`;
        return `<button type="button" class="card ${cardKind(card)}${poor ? " unaffordable" : ""}${dealNow ? " deal" : ""}" data-card="${i}" aria-label="${esc(label)}" style="--fan:${fan}deg;--drop:${drop}px;--deal:${i};z-index:${i + 1}" ${phase !== "player" ? "disabled" : ""}>${cardFace(card, true)}</button>`;
      }).join("");
      const overlay = rewardOverlay()
        || (outcome === "lose"
        ? `<div class="overlay"><div class="panel">
            <h2>倒された</h2>
            <p>初期デッキに戻った。装備を失った。★${meta.stars}は残っている。</p>
            <button type="button" data-action="character">キャラクター選択へ</button>
          </div></div>`
        : "");
      const leaveOverlay = askLeave
        ? `<div class="overlay"><div class="panel">
            <h2>タイトルに戻る？</h2>
            <p>終わっていない戦いは残らない。</p>
            <button type="button" data-action="title">タイトルへ戻る</button>
            <button type="button" class="ghost" data-action="stay">戦いを続ける</button>
          </div></div>`
        : "";

      const slashNow = fxSlash;
      const hurtNow = fxHurt;
      const guardNow = fxGuard;
      const healNow = fxHeal;
      const hitNow = fxHit;
      const hitPow = hitNow ? hitPower(hitNow.n) : "0.35";
      fxSlash = false;
      fxHurt = false;
      fxGuard = "";
      fxHeal = false;
      fxHit = null;
      fxDeal = false;
      const turnNow = turnCall;
      turnCall = "";
      const logHtml = logLines.map((line) => {
        const text = typeof line === "string" ? line : line.text;
        const kind = line && line.kind;
        const cls = kind === "player" ? "turn-player" : kind === "enemy" ? "turn-enemy" : "";
        return `<p class="${cls}">${esc(text)}</p>`;
      }).join("");
      const enemyShown = Math.round(shownEnemy());
      const playerShown = Math.round(shownPlayer());
      root.innerHTML = `
        <div class="battle-screen${showLog ? "" : " no-log"}${hurtNow ? " hurt" : ""}">
        ${hurtNow ? `<div class="screen-hurt" aria-hidden="true"></div>` : ""}
        ${guardNow === "hold" ? `<div class="screen-guard" aria-label="ダメージなし">${guardMark()}</div>` : ""}
        ${guardNow === "break" ? `<div class="screen-block break" aria-hidden="true">${brokenShield()}</div>` : ""}
        ${healNow ? `<div class="screen-heal" aria-hidden="true"></div>` : ""}
        <aside class="gear-rail"><h2>装備</h2>${gearMarkup()}${gearEffectText()}<div class="party-stack"><div class="status-stars" aria-label="スター ${meta.stars}">★${meta.stars}</div><div class="party-attrs" aria-label="ステータス"><div class="attr hp"><span class="mark">${heartIcon()}</span><span>HP</span><b>${player.maxHp}</b></div><div class="attr atk"><span class="mark">${swordIcon()}</span><span>ATK</span><b>${signed(player.atk)}</b></div><div class="attr def"><span class="mark">${shieldIcon()}</span><span>DEF</span><b>${signed(player.def)}</b></div><div class="attr spd"><span class="mark">${bootIcon()}</span><span>SPD</span><b>${hand.length}</b></div></div></div></aside>
        <div class="game">
          <header class="hud-top">
            <div class="dungeon">
              <h1 class="dungeon-name">${esc(dungeonName)}</h1>
              <div class="dungeon-progress">${battleIndex + 1}/${battleTotal}</div>
            </div>
            <div class="hud-actions">
              <button type="button" class="small-btn" data-action="deck">デッキ確認</button>
              <button type="button" class="small-btn" data-action="settings">オプション</button>
              <button type="button" class="small-btn" data-action="ask-title" ${phase === "player" ? "" : "disabled"}>タイトル</button>
            </div>
          </header>
          <div class="battle-bands">
          <div class="stage" style="--dungeon-art: url('${dungeonArt(dungeonName)}')">
            <div class="enemy-field">
            ${traitNote()}
            <div class="enemy-main">
            <div class="sprite${slashNow ? " slash" : ""}" aria-hidden="true">
              <img src="${esc(enemy.image || "enemy-slime.png?v=3")}" alt="">
              ${slashNow ? `<span class="cut" style="--pow:${hitNow && hitNow.side === "enemy" ? hitPow : "0.35"}"></span>` : ""}
            </div>
            <section class="enemy vitals" data-rank="${esc(enemyNow().rank || "普通")}">
              <h2>${esc(enemy.name)}${bossNow() ? "　ボス" : ""}</h2>
              ${meters("enemy", shownEnemy(), enemy.maxHp, enemy.block)}
              <div class="hp-line">体力 <b data-hp="enemy">${enemyShown}</b> / ${enemy.maxHp}</div>${enemy.poison ? `<div class="poison-mark">毒</div>` : ""}
            </section>
            <div class="banner">${esc(banner)}</div>
            <div class="note">${esc(note)}</div>
            </div>
            ${heroShoulder(`<div class="hero-vitals"><div class="vitals">${meters("player", playerShown, player.maxHp, player.block)}<div class="hp-line">体力 <b data-hp="player">${playerShown}</b> / ${player.maxHp}</div></div></div>`)}
            ${turnNow || (hitNow && (hitNow.side === "enemy" || hurtNow)) ? `<div class="stage-fx">${turnNow ? `<div class="turn-call ${turnNow}" aria-hidden="true"><b>${turnNow === "player" ? "自分のターン" : "敵のターン"}</b></div>` : ""}${hurtNow && hitNow && hitNow.side === "player" ? `<b class="dmg-pop me" style="--pow:${hitPow}">${hitNow.n}</b>` : ""}${hitNow && hitNow.side === "enemy" ? `<b class="dmg-pop foe-hit">${hitNow.n}</b>` : ""}</div>` : ""}
            </div>
          </div>
          ${playRow()}
          <div class="energy-band" aria-label="マナ ${player.energy}"><div class="mana-slot">${pips()}</div><div class="ailment-slot">${player.poison ? "<span>毒</span>" : ""}${player.focus ? `<span>集中+${player.focus}</span>` : ""}${player.parry ? "<span>パリィ</span>" : ""}</div></div>
          <div class="handbar">
              ${pileMarkup("deck", deck.length)}
              ${pileMarkup("discard", discard.length)}
              <div class="hand">${cards}</div>
              <button type="button" class="end${phase === "player" && noPlayableHand() ? " ready" : ""}" data-end ${phase === "player" ? "" : "disabled"}>ターン<br>終了</button>
            </div>
          </div>
        </div>
        ${showLog ? `<aside class="battle-log"><h2>ログ</h2>${logHtml}</aside>` : ""}
        </div>
        ${deckOverlay()}
        ${overlay}
        ${leaveOverlay}`;
      player.hit = false;
      enemy.hit = false;
      persistLive();
      kickHp();
      startManaFires();
    }

    root.addEventListener("click", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      const action = el.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "title") goTitle();
        if (name === "ask-title") { askLeave = true; showDeck = false; render(); }
        if (name === "deck") { showDeck = true; render(); }
        if (name === "close-deck") { showDeck = false; render(); }
        if (name === "stay") { askLeave = false; render(); }
        if (name === "settings") { returnScreen = screen; screen = "settings"; render(); }
        if (name === "back") { screen = returnScreen; render(); }
        if (name === "toggle-log") { showLog = !showLog; persistSettings(); render(); }
        if (name === "toggle-auto-end") { autoEndTurn = !autoEndTurn; persistSettings(); render(); }
        if (name === "album") { screen = "album"; render(); }
        if (name === "sheet") { screen = "sheet"; render(); }
        if (name === "character") { castHover = ""; castLock = "戦士"; screen = "character"; render(); }
        if (name === "cast-token") {
          castLock = action.dataset.cast || castLock;
          castHover = "";
          paintCast();
        }
        if (name === "cast-pick") { castPicked = true; render(); }
        if (name === "cast-back") { castPicked = false; render(); }
        if (name === "character-next") { dungeonHover = ""; dungeonLock = ""; screen = "dungeon"; render(); }
        if (name === "cast-stay") { screen = "character"; render(); }
        if (name === "dungeon-list") { screen = "dungeon"; render(); }
        if (name === "dungeon-token") {
          dungeonLock = action.dataset.dungeon || "";
          dungeonHover = "";
          pendingDungeon = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock) || DUNGEON_LIST[0];
          paintDungeon();
        }
        if (name === "dungeon-start") {
          pendingDungeon = DUNGEON_LIST.find((dungeon) => dungeon.name === action.dataset.dungeon) || DUNGEON_LIST[0];
          screen = "dungeon-gate";
          render();
        }
        if (name === "dungeon-enter") {
          const chosen = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock) || pendingDungeon;
          if (chosen) beginRun(chosen.floors, chosen.name);
        }
        if (name === "floor-next") advance(1);
        if (name === "job-pick") {
          const nextJob = action.dataset.job || "戦士";
          job = nextJob;
          if (!jobsHad.includes(nextJob)) jobsHad.push(nextJob);
          floorPhase = "ultimate";
          ultimatePicks = rollUltimates();
          floorNote = `${nextJob}になった。カードは残っている。奥義を1つ選ぶ。`;
          render();
        }
        if (name === "ultimate-pick") {
          ultimate = ultimateLabel(action.dataset.ultimate || "");
          floorPhase = "show";
          floorNote = `奥義は${ultimate}。効果の名前は、まだ無い。`;
          render();
        }
        if (name === "new") {
          if (readSave()) { screen = "confirm"; render(); }
          else { castPicked = false; screen = "character"; render(); }
        }
        if (name === "new-force") { localStorage.removeItem(SAVE_KEY); clearLive(); castPicked = false; screen = "character"; render(); }
        if (name === "continue") continueGame();
        if (name === "reward-card") takeReward(Number(action.dataset.reward));
        if (name === "reward-bonus") takeBonus();
        if (name === "reward-skip") skipReward();
        if (name === "reward-path") takePath(action.dataset.path || "");
        if (name === "reward-go") applyPath("straight");
        return;
      }
      const albumBtn = el.closest("[data-album]");
      if (albumBtn && screen === "album") {
        albumTab = albumBtn.dataset.album || "all";
        render();
        return;
      }
      if (screen !== "battle") return;
      const gearBtn = el.closest("[data-gear]");
      if (gearBtn) {
        const id = gearBtn.dataset.gear;
        gearOpen = gearOpen === id ? null : id;
        render();
        return;
      }
      const card = el.closest("[data-card]");
      if (card) playFromHand(Number(card.dataset.card));
      if (el.closest("[data-end]")) endTurn();
    });

    document.addEventListener("keydown", (event) => {
      if (screen !== "battle" || askLeave) return;
      if (showDeck) {
        if (event.key === "Escape") { showDeck = false; render(); }
        return;
      }
      if (event.key === "Enter") endTurn();
      if (/^[1-9]$/.test(event.key) || event.key === "0") {
        playFromHand(event.key === "0" ? 9 : Number(event.key) - 1);
      }
    });

    loadSettings();
    loadMeta();
    if (!resumeLive()) render();
  </script>
</body>
</html>
