        const next = document.createElement("div");
        next.innerHTML = html;
        const fresh = next.firstElementChild;
        if (fresh) {
          box.replaceWith(fresh);
          box = fresh;
        }
      }
      if (box) {
        box.dataset.gearSlot = shown;
        if (box.classList.contains("has-action") && box.dataset.popBound !== "1") {
          box.dataset.popBound = "1";
          box.addEventListener("pointerleave", (event) => {
            const related = event.relatedTarget;
            if (related instanceof Element && (related.closest(".plate-gear") || related.closest(".gear-effect"))) return;
            if (gearOpen) return;
            if (!gearHover) return;
            gearHover = "";
            paintGear();
          });
        }
      }
      placeGearEffect(box, shown);
    }

    function bindGearHover() {
      const rail = root.querySelector(".plate-gear");
      if (!rail || rail.dataset.gearBound === "1") return;
      rail.dataset.gearBound = "1";
      rail.addEventListener("pointerover", (event) => {
        const btn = event.target instanceof Element ? event.target.closest("[data-gear]") : null;
        if (!btn || !rail.contains(btn)) return;
        const id = btn.dataset.gear || "";
        if (gearHover === id) return;
        gearHover = id;
        paintGear();
      });
      rail.addEventListener("pointerleave", (event) => {
        const related = event.relatedTarget;
        if (related instanceof Element && related.closest(".gear-effect")) return;
        if (!gearHover) return;
        gearHover = "";
        paintGear();
      });
    }

    function swordIcon() {
      return `<svg class="ico sword" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0 14.5 7 14.1 16.4H18.3v2.2h-5.05V23.4h-2.5v-4.8H5.7v-2.2h4.2L9.5 7z"/></svg>`;
    }

    function shieldIcon() {
      return `<svg class="ico shield" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 3.2h18c.9 0 1.6.8 1.6 1.7v6.2c0 5.6-4.4 9.4-10.6 12.1C6 20.5 1.4 16.7 1.4 11.1V4.9C1.4 4 2.1 3.2 3 3.2z"/></svg>`;
    }

    function plateShieldSvg(gold) {
      const fill = gold ? "#e2b44a" : "#c9ced6";
      const rim = gold ? "#fff6d2" : "#f7f8fa";
      const edge = gold ? "#7a5814" : "#5a6168";
      return `<svg class="plate-shield" viewBox="0 0 80 96" aria-hidden="true"><path d="M40 8 68 20v26c0 20-11 34-28 42C23 80 12 66 12 46V20Z" fill="${fill}" stroke="${edge}" stroke-width="5"/><path d="M40 16 60 26v18c0 15-8 26-20 32C28 70 20 59 20 44V26Z" fill="none" stroke="${rim}" stroke-width="2.5"/></svg>`;
    }

    function holdGuard() {
      return `<div class="hero-guard hold" aria-label="ガード"><b class="guard-word">ガード</b></div>`;
    }

    function shieldBreakHtml() {
      const svg = plateShieldSvg(false);
      return `<div class="shield-break" aria-hidden="true"><i class="half left">${svg}</i><i class="half right">${svg}</i></div>`;
    }

    function playerHitPop(n, kind, fatal, big, delay) {
      const amount = Math.max(0, Math.round(Number(n) || 0));
      if (!amount) return "";
      const onHit = kind === "poison" ? "" : " on-hit";
      return `<b class="dmg-pop me${onHit}${kind === "poison" ? " poison" : ""}${fatal ? " fatal" : ""}${big ? " big" : ""}" style="--pow:${hitPower(amount)};--delay:${Number(delay) || 0}s">${amount}ダメージ！</b>`;
    }

    function heartIcon() {
      return `<svg class="ico heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20.4 10.7 19.2C5.5 14.6 2.2 11.6 2.2 8 2.2 5 4.6 2.6 7.6 2.6c1.7 0 3.4.8 4.4 2.1 1-1.3 2.7-2.1 4.4-2.1 3 0 5.4 2.4 5.4 5.4 0 3.6-3.3 6.6-8.5 11.2L12 20.4z"/></svg>`;
    }

    function manaIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>`;
    }

    function bootIcon() {
      return `<svg class="ico boot" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" transform="translate(0 3.5)" d="M8 1.4h6.4v2.6h-1.2V9h6.4c2.1 0 3.6 1.6 3.6 3.5 0 1.7-1.4 3.1-3.2 3.1H7.2V4.2h.8V1.4z"/></svg>`;
    }

    function actionMark(intent, big) {
      const size = big ? "big" : "small";
      if (intent.type === "attack") {
        return `<span class="act attack ${size}" aria-label="攻撃 ${intent.value}">${swordIcon()}<b>${intent.value}</b></span>`;
      }
      if (intent.type === "block") {
        return `<span class="act block ${size}" aria-label="シールド ${intent.value}">${shieldIcon()}<b>${intent.value}</b></span>`;
      }
      return `<span class="act skill ${size}" aria-label="スキル">★</span>`;
    }

    function sourcePattern() {
      const foe = enemyNow();
      const base = (foe.pattern || []).map((card) => applyEnemyHidden(card, foe));
      if (foe.name === "物乞い" && !swordIgnoresTrait()) {
        return base.concat((beggarGift || []).map((card) => ({ ...card })));
      }
      return base;
    }

    function deckKey(cards) {
      return (cards || []).map((card) => card.name).sort().join("|");
    }

    function chooseNextIntent() {
      const from = intentIndex;
      const left = enemyLoop.length - from;
      if (left <= 1) return;
      const pick = from + Math.floor(Math.random() * left);
      if (pick === from) return;
      const held = enemyLoop[from];
      enemyLoop[from] = enemyLoop[pick];
      enemyLoop[pick] = held;
    }

    function startEnemyLoop() {
      enemyLoop = shuffle(sourcePattern());
      intentIndex = 0;
      foeDiscard = [];
      foeDeckEmpty = false;
      foeRageBusy = false;
      foeAngerShow = false;
      foePlan = [];
      chooseNextIntent();
    }

    function foeSpd() {
      const foe = enemyNow();
      const n = Number(foe && foe.spd);
      return n > 0 ? n : 1;
    }

    function deckCardsLeft() {
      return Math.max(0, enemyLoop.length - intentIndex);
    }

    function takeDeckCard() {
      if (deckCardsLeft() <= 0) return null;
      chooseNextIntent();
      const card = applyEnemyHidden(enemyLoop[intentIndex], enemyNow());
      intentIndex += 1;
      if (intentIndex >= enemyLoop.length) foeDeckEmpty = true;
      return card;
    }

    function recycleDiscardToDeck() {
      if (!foeDiscard.length) return false;
      const foe = enemyNow();
      enemyLoop = shuffle(foeDiscard.map((card) => applyEnemyHidden(card, foe)));
      foeDiscard = [];
      intentIndex = 0;
      foeDeckEmpty = false;
      return true;
    }

    // SPDの枠を埋める。引けない枠は怒りが1回だけ代わりに入る。入ったあとに捨て札を山札へ戻し、残りの枠を引く。
    function buildFoePlan() {
      foePlan = [];
      const need = foeSpd();
      let guard = 0;
      while (foePlan.length < need && guard < need + 4) {
        guard += 1;
        const card = takeDeckCard();
        if (card) {
          foePlan.push({ anger: false, card });
          continue;
        }
        const angerAlready = !!(enemy && enemy.anger) || foePlan.some((step) => step.anger);
        if (!angerAlready) {
          foePlan.push({ anger: true, card: foeAngerCard() });
          recycleDiscardToDeck();
          continue;
        }
        if (!recycleDiscardToDeck()) break;
      }
      foeAngerShow = foePlan.some((step) => step.anger);
    }

    // 戦闘をまたいで残った怒り演出を切る。山札を使い切る前の怒りは出さない。
    function invalidateFoeAct() {
      foeActGen += 1;
      foeAngerShow = false;
      foeRageBusy = false;
      foeDrawPending = false;
      foeArriveHide = false;
      foeArriveGen += 1;
      foeDeckEmpty = false;
      if (foeLeaveGhost && foeLeaveGhost.ghost) foeLeaveGhost.ghost.remove();
      foeLeaveGhost = null;
    }

    function foeActLive(gen) {
      return gen === foeActGen && !outcome && phase === "player";
    }

    // いまの山札を1枚ずつ捨て切ったあとだけ。戦闘開始時（捨て札0）は怒らない。
    function foeDeckSpent() {
      return !!(foeDeckEmpty && enemyLoop.length && intentIndex >= enemyLoop.length && foeDiscard.length);
    }

    function foeDeckRemain() {
      if (!enemyLoop.length) return 0;
      return Math.max(0, enemyLoop.length - intentIndex);
    }

    function gainEnemyAnger() {
      if (!enemy) return;
      const foe = enemyNow();
      const had = Math.min(1, Math.max(0, Number(enemy.anger) || 0));
      if (had >= 1) {
        log(`${enemy.name}はすでに怒っている。`);
        return;
      }
      enemy.anger = 1;
      enemy.atk = hiddenAtk(foe) + 2;
      syncEnemyDef();
      log(`${enemy.name}は怒り。ATK+2、DEF-2。`);
    }

    function recycleEnemyDeck() {
      const foe = enemyNow();
      const recycled = foeDiscard.map((card) => applyEnemyHidden(card, foe));
      enemyLoop = shuffle(recycled.length ? recycled : sourcePattern());
      foeDiscard = [];
      intentIndex = 0;
      chooseNextIntent();
    }

    function foeAngerCard() {
      const base = FOE_ONLY["怒り（敵）"];
      return { ...base, name: "怒り" };
    }

    function advanceEnemyLoop() {
      if (!(enemyLoop.length && intentIndex < enemyLoop.length)) {
        if (foeDeckSpent() || (enemyLoop.length && intentIndex >= enemyLoop.length && foeDiscard.length)) foeDeckEmpty = true;
        return;
      }
      foeDiscard.push({ ...enemyLoop[intentIndex] });
      intentIndex += 1;
      if (intentIndex >= enemyLoop.length) {
        foeDeckEmpty = true;
        return;
      }
      chooseNextIntent();
    }

    function restoreEnemyLoop(data) {
      const saved = Array.isArray(data.enemyLoop) ? data.enemyLoop : [];
      if (saved.length && deckKey(saved) === deckKey(sourcePattern())) {
        enemyLoop = saved.map((card) => ({ ...card }));
        intentIndex = Number.isInteger(data.intentIndex) ? data.intentIndex : 0;
        if (intentIndex < 0 || intentIndex >= enemyLoop.length) startEnemyLoop();
        else foeDiscard = Array.isArray(data.foeDiscard) ? data.foeDiscard.map((card) => ({ ...card })) : [];
        return;
      }
      startEnemyLoop();
    }

    function intentAt(offset) {
      if (!enemyLoop.length) startEnemyLoop(false);
      const at = intentIndex + (offset || 0);
      if (at >= 0 && at < enemyLoop.length) return enemyLoop[at];
      return enemyLoop[Math.min(intentIndex, enemyLoop.length - 1)];
    }

    function applyDamage(target, amount, fromThorns) {
      const hadHp = target.hp > 0;
      const before = Math.max(0, Number(target.block) || 0);
      const blocked = Math.min(before, amount);
      target.block -= blocked;
      const hpLoss = amount - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      target.hit = true;
      if (blocked > 0 && hpLoss > 0) {
        if (target === player) fxBreakPlayer = true;
        else fxBreakEnemy = true;
      }
      if (!fromThorns && hadHp && amount > 0) retaliateThorns(target);
      return { blocked, hpLoss };
    }

    function gainThorns(who, add) {
      if (!who) return 0;
      const n = Math.max(1, Math.floor(Number(add) || 1));
      who.thorns = Math.max(0, Number(who.thorns) || 0) + n;
      return who.thorns;
    }

    function retaliateThorns(target) {
      const stacks = thornCount(target);
      if (!stacks) return;
      const other = target === player ? enemy : target === enemy ? player : null;
      if (!other || other.hp <= 0) return;
      const hit = applyDamage(other, stacks, true);
      if (hit.hpLoss || hit.blocked) {
        if (other === enemy) slashFoe();
        noteHit(other === player ? "player" : "enemy", hit.hpLoss, stacks);
      }
      const who = target === player ? heroName() : (enemy && enemy.name) || "相手";
      const foeName = other === player ? heroName() : (enemy && enemy.name) || "相手";
      log(`${who}のトゲ。${foeName}に${stacks}ダメージ。`);
    }

    function shownEnemy() {
      return shown.enemy == null ? enemy.hp : shown.enemy;
    }

    function shownPlayer() {
      return shown.player == null ? player.hp : shown.player;
    }

    function bindShown() {
      if (player) shown.player = player.hp;
      if (enemy) shown.enemy = enemy.hp;
    }

    function drainMs() {
      const enemyGap = enemy ? Math.abs(enemy.hp - shownEnemy()) : 0;
      const playerGap = player ? Math.abs(player.hp - shownPlayer()) : 0;
      const enemyWait = enemyGap < 0.2 ? 0 : Math.min(1700, Math.max(620, (enemyGap / 6.5) * 1000));
      const playerWait = playerGap < 0.2 ? 0 : Math.min(fxFatal ? 3200 : 2400, Math.max(fxFatal ? 1800 : 900, (playerGap / (fxFatal ? 2.2 : 4)) * 1000));
      return Math.max(enemyWait, playerWait);
    }

    function paintShown() {
      for (const who of ["enemy", "player"]) {
        const hp = who === "enemy" ? shown.enemy : shown.player;
        const max = who === "enemy" ? enemy && enemy.maxHp : player && player.maxHp;
        if (hp == null || !max) continue;
        const bar = root.querySelector(`[data-bar="${who}"]`);
        if (bar) bar.style.width = `${Math.max(0, Math.min(100, (hp / max) * 100))}%`;
        const text = `${Math.max(0, Math.round(hp))}/${Math.round(max)}`;
        root.querySelectorAll(`[data-hp="${who}"]`).forEach((el) => { el.textContent = text; });
      }
    }

    function pumpHp(stamp) {
      const dt = hpStamp ? Math.min(0.05, (stamp - hpStamp) / 1000) : 0.016;
      hpStamp = stamp;
      const ease = (current, target, quick) => {
        const diff = target - current;
        if (Math.abs(diff) < 0.04) return target;
        const speed = quick
          ? Math.max(6.5, Math.abs(diff) / 1.5)
          : fatalHold
            ? Math.max(1.35, Math.abs(diff) / 5.2)
            : Math.max(4, Math.abs(diff) / 2.4);
        return current + Math.sign(diff) * Math.min(Math.abs(diff), speed * dt);
      };
      let moving = false;
      if (enemy && shown.enemy != null && Math.abs(shown.enemy - enemy.hp) >= 0.04) {
        shown.enemy = ease(shown.enemy, enemy.hp, true);
        moving = true;
      } else if (enemy) shown.enemy = enemy.hp;
      if (player && shown.player != null && Math.abs(shown.player - player.hp) >= 0.04) {
        shown.player = ease(shown.player, player.hp, false);
        moving = true;
      } else if (player) shown.player = player.hp;
      paintShown();
      hpFrame = moving ? requestAnimationFrame(pumpHp) : 0;
    }

    function kickHp() {
      if (player && shown.player == null) shown.player = player.hp;
      if (enemy && shown.enemy == null) shown.enemy = enemy.hp;
      hpStamp = 0;
      if (hpFrame) cancelAnimationFrame(hpFrame);
      hpFrame = requestAnimationFrame(pumpHp);
    }

    function spawnManaBit(w, h, fresh) {
      const life = 0.26 + Math.random() * 0.22;
      return {
        x: w * (0.32 + Math.random() * 0.36),
        y: h * (fresh ? 0.64 + Math.random() * 0.2 : 0.8),
        vx: (Math.random() - 0.5) * 22,
        vy: -70 - Math.random() * 80,
        life,
        max: life,
        r: 14 + Math.random() * 14,
      };
    }

    function paintManaBit(ctx, bit, white) {
      const t = 1 - bit.life / bit.max;
      const radius = bit.r * (1 - t * 0.55);
      const glow = ctx.createRadialGradient(bit.x, bit.y, 0, bit.x, bit.y, radius);
      if (white) {
        glow.addColorStop(0, "rgba(255, 252, 244, 0.95)");
        glow.addColorStop(0.45, t < 0.6 ? "rgba(255, 214, 150, 0.7)" : "rgba(255, 170, 90, 0.28)");
        glow.addColorStop(1, "rgba(255, 120, 40, 0)");
      } else if (t < 0.3) {
        glow.addColorStop(0, "rgba(255, 252, 230, 0.95)");
        glow.addColorStop(0.4, "rgba(255, 186, 48, 0.75)");
        glow.addColorStop(1, "rgba(255, 70, 8, 0)");
      } else if (t < 0.65) {
        glow.addColorStop(0, "rgba(255, 196, 60, 0.8)");
        glow.addColorStop(0.55, "rgba(255, 78, 12, 0.45)");
        glow.addColorStop(1, "rgba(160, 20, 0, 0)");
      } else {
        glow.addColorStop(0, "rgba(255, 60, 10, 0.28)");
        glow.addColorStop(1, "rgba(90, 8, 0, 0)");
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(bit.x, bit.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function startManaFires() {
      const gen = ++manaFireGen;
      const canvases = [...document.querySelectorAll(".mana-orb .mana-fire")];
      if (!canvases.length) return;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fires = canvases.map((canvas) => {
        const ctx = canvas.getContext("2d");
        const bits = Array.from({ length: 34 }, () => spawnManaBit(canvas.width, canvas.height, true));
        return { canvas, ctx, bits, white: canvas.dataset.temp === "1" };
      });
      const draw = (dt) => {
        fires.forEach(({ canvas, ctx, bits, white }) => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          bits.forEach((bit) => {
            bit.life -= dt;
            if (bit.life <= 0) Object.assign(bit, spawnManaBit(canvas.width, canvas.height, false));
            bit.x += bit.vx * dt;
            bit.y += bit.vy * dt;
            bit.vx += (Math.random() - 0.5) * 80 * dt;
            paintManaBit(ctx, bit, white);
          });
        });
      };
      if (reduce) {
        draw(0);
        return;
      }
      let last = 0;
      const frame = (now) => {
        if (gen !== manaFireGen) return;
        const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        draw(dt);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }

    function finalDamageLine(actor, card, result, crit) {
      if (crit && result.blocked && !result.hpLoss) return `${actor}は${card}。クリティカル。ブロックで防いだ。`;
      if (result.blocked && !result.hpLoss) return `${actor}は${card}。ブロックで防いだ。`;
      if (crit) return `${actor}は${card}。クリティカルで${result.hpLoss}ダメージ。`;
      return `${actor}は${card}で${result.hpLoss}ダメージ。`;
    }

    function damageSentence(actor, card, raw, result, crit) {
      return finalDamageLine(actor, card, result, crit);
    }

    function mitigate(amount, defense) {
      const def = Number(defense) || 0;
      const incoming = Math.max(0, amount);
      if (def < 0) return { reduced: 0, dealt: incoming - def };
      const reduced = Math.min(def, incoming);
      return { reduced, dealt: incoming - reduced };
    }

    function parryCount(target) {
      if (!target || !target.parry) return 0;
      if (target.parry === true) return 1;
      return Math.max(0, Number(target.parry) || 0);
    }

    function clearBattleMods() {
      if (!player) return;
      player.atkMod = 0;
      player.defMod = 0;
      player.expose = 0;
      player.guardThrough = false;
      player.parry = 0;
      player.burn = 0;
      player.hurtThis = false;
      player.hurtLast = false;
      player.extraDraw = 0;
      player.parryHist = [];
      player.parryHitsThis = 0;
      player.parryHitsLast = 0;
      player.parryHitThis = false;
      player.parryLast = false;
      player.knifeReflect = false;
      player.doubleNext = false;
      player.magicParry = false;
      player.pride = false;
      player.shave = 0;
      player.masterOnce = false;
      syncGearStats();
    }

    function gainParry(card, add) {
      const n = Math.max(1, Number(add) || 1);
      const now = parryCount(player);
      const hadShield = Math.max(0, Number(player.block) || 0);
      if (hadShield) player.block = 0;
      player.parry = now + n;
      fxParryPlayer = true;
      fxParryFromShield = hadShield > 0;
      let detail = player.parry > 1 ? `パリィ${player.parry}。` : "パリィを得た。次の攻撃を無効。";
      if (hadShield) detail += `所持していたシールド${hadShield}を失った。`;
      log(`${heroName()}は${card.name}。${detail}`, card);
      return true;
    }

    function gainBlock(amount, card) {
      const bonus = Number(player && player.def) || 0;
      const gain = Math.max(0, Math.floor((Number(amount) || 0) + bonus));
      if (!gain) return;
      if (parryCount(player) > 0 && !player.guardThrough) {
        log(`${heroName()}は${card.name}。パリィ中はシールドを得られない。`, card);
        return;
      }
      player.block += gain;
      fxShieldPlayer = true;
      log(`${heroName()}は${card.name}でブロック${gain}。`, card);
    }

    function hurtSentence(actor, card, raw, reduced, result, crit) {
      return finalDamageLine(actor, card, result, crit);
    }

    function strikeSentence(actor, card, base, focusAdd, atk, result) {
      return finalDamageLine(actor, card, result);
    }

    function hitPower(n) {
      const value = Math.max(1, Number(n) || 1);
      return Math.max(0, Math.min(1, (value - 1) / 14)).toFixed(2);
    }

    function noteHit(side, landed, swung, kind) {
      const n = landed > 0 ? landed : swung;
      if (n > 0) fxHit = { side, n, kind: kind || "slash" };
      if (n > 0 && side === "enemy") fxFoeHits.push(n);
    }

    // 敵への斬撃エフェクト。1ターンの中で 右上→左下、左上→右下、上→下 の順に回す。
    // 2回攻撃のカードは、この順を2つ進める。
    function slashFoe() {
      fxSlash = true;
      fxSlashes.push(slashSeq % 3);
      slashSeq += 1;
    }

    function poisonSentence(name, raw, reduced, result) {
      if (result.blocked && !result.hpLoss) return `${name}は毒。ブロックで防いだ。`;
      return `${name}は毒で${result.hpLoss}ダメージ。`;
    }

    function poisonStacks(target) {
      return Math.max(0, Number(target && target.poison) || 0);
    }

    function markPoisonApply(target) {
      if (target === player) fxPoisonApply.player = true;
      else fxPoisonApply.enemy = true;
    }

    function addPoison(target, amount) {
      if (target === player && hasStatusImmune()) {
        log(`${heroName()}は${statusImmuneName()}。毒を無視した。`);
        return false;
      }
      target.poison = poisonStacks(target) + Math.max(1, Number(amount) || 1);
      markPoisonApply(target);
      return true;
    }

    function poisonBadge(stacks) {
      if (!stacks) return "";
      return `<span class="hint poison-mark">毒+${stacks}<i>${esc(POISON_NOTE)}</i></span>`;
    }

    function tickPoison(who) {
      const target = who === "player" ? player : enemy;
      const stacks = poisonStacks(target);
      if (!stacks) return false;
      const name = who === "player" ? heroName() : enemy.name;
      let amount = stacks;
      if (who === "player") {
        const extra = Math.max(0, Number(player.expose) || 0);
        if (extra) {
          player.expose = 0;
          amount += extra;
        }
      }
      const result = applyDamage(target, amount);
      markPoisonApply(target);
      if (who === "player" && result.hpLoss > 0) player.hurtThis = true;
      if (who === "player") {
        if (result.hpLoss > 0) {
          fxHurt = true;
          noteHit("player", result.hpLoss, amount, "poison");
          lastFoeBlow = { name: "毒", hpLoss: result.hpLoss };
          if (target.hp <= 0) {
            fxFatal = true;
            fatalHold = true;
          }
        }
        if (result.blocked > 0 && !(result.hpLoss > 0)) fxGuard = "hold";
      } else if (result.hpLoss || result.blocked) {
        noteHit("enemy", result.hpLoss, stacks, "poison");
      }
      log(poisonSentence(name, stacks, 0, result));
      return target.hp <= 0;
    }

    function onParrySuccess(negated) {
      player.parryHitsThis = (Number(player.parryHitsThis) || 0) + 1;
      player.parryHitThis = true;
      if (player.knifeReflect && negated > 0 && enemy && enemy.hp > 0) {
        const hit = applyDamage(enemy, negated);
        if (hit.hpLoss || hit.blocked) {
          slashFoe();
          noteHit("enemy", hit.hpLoss, negated);
        }
        log(`ナイフパリィ。${enemy.name}に${negated}ダメージ。`);
      }
      if (player.pride) {
        player.atkMod = (Number(player.atkMod) || 0) + 1;
        syncGearStats();
        log(`自信過剰。ATK${signed(player.atk)}。`);
      }
      if (player.shave && enemy) {
        enemy.defCut = (Number(enemy.defCut) || 0) + Number(player.shave);
        syncEnemyDef();
        log(`盾削ぎ。${enemy.name}のDEF${signed(enemy.def)}。`);
      }
    }

    function takeEnemyHit(raw, card, crit) {
      const name = card && card.name ? card.name : "攻撃";
      let amount = Math.max(0, Number(raw) || 0);
      if (player.doubleNext) {
        player.doubleNext = false;
        amount *= 2;
      }
      const stacks = parryCount(player);
      if (stacks > 0) {
        player.parry = stacks - 1;
        onParrySuccess(amount);
        noteHit("player", 0, amount);
        log(`${enemy.name}は${name}。${crit ? "クリティカル。" : ""}パリィで無効。`, card, true);
        return;
      }
      const extra = Math.max(0, Number(player.expose) || 0);
      if (extra) player.expose = 0;
      const dealt = Math.max(0, amount + extra);
      const result = applyDamage(player, dealt);
      if (result.hpLoss > 0) {
        player.hurtThis = true;
        fxHurt = true;
        noteHit("player", result.hpLoss, dealt, "blunt");
        lastFoeBlow = { name, hpLoss: result.hpLoss };
        if (player.hp <= 0) {
          fxFatal = true;
          fatalHold = true;
        }
      }
      if (result.blocked > 0 && !(result.hpLoss > 0)) fxGuard = "hold";
      log(hurtSentence(enemy.name, name, raw + extra, 0, result, crit), card, true);
    }

    function restoreHp(amount) {
      const room = Math.max(0, player.maxHp - player.hp);
      const gain = Math.max(0, Math.min(Math.floor(Number(amount) || 0), room));
      if (!gain) return 0;
      player.hp += gain;
      fxHeal = true;
      return gain;
    }

    function deckCore() {
      const cards = [];
      const skip = {};
      for (const card of removed) {
        if (!card || !card.name) continue;
        skip[card.name] = (skip[card.name] || 0) + 1;
      }
      for (const [name, count] of CARD_POOL) {
        let left = count;
        const cut = Math.min(left, skip[name] || 0);
        left -= cut;
        skip[name] = (skip[name] || 0) - cut;
        const def = cardDef(name);
        if (!def) continue;
        for (let i = 0; i < left; i++) cards.push(keepCard({ name, ...def }));
      }
      for (const extra of stolen) {
        if (skip[extra.name] > 0) {
          skip[extra.name] -= 1;
          continue;
        }
        cards.push({ ...extra });
      }
      return cards;
    }

    function runDeck() {
      return tuneDeck(deckCore());
    }

    function roundMastery(n) {
      return Math.round((Number(n) || 0) * 1.3);
    }

    function masteryRow(name, nth) {
      return cardMastery.find((item) => item && item.name === name && item.nth === nth) || null;
    }

    function tuneDeck(cards) {
      const seen = {};
      return cards.map((card) => {
        if (!card || !card.name) return card;
        const nth = seen[card.name] || 0;
        seen[card.name] = nth + 1;
        const next = { ...card, copyNth: nth };
        const alter = cardAlters.find((item) => item && item.name === card.name && item.nth === nth);
        if (alter) {
          if (alter.text) next.text = alter.text;
          if (alter.damage) next.damage = alter.damage;
          if (alter.block) next.block = alter.block;
          if (alter.heal) next.heal = alter.heal;
          if (alter.fused) next.fused = true;
        }
        const picked = (masteryRow(card.name, nth) || {}).picked || "";
        if (picked === "power") {
          if (next.damage) next.damage = roundMastery(next.damage);
          if (next.block) next.block = roundMastery(next.block);
          if (next.heal) next.heal = roundMastery(next.heal);
          next.mastered = "power";
        } else if (picked === "light") {
          next.cost = Math.max(0, (Number(next.cost) || 0) - 1);
          next.mastered = "light";
        }
        const kind = runEnchants[card.name];
        if (kind === "fire" && next.damage) next.damage = Number(next.damage) + 2;
        if (kind === "water" && next.block) next.block = Number(next.block) + 2;
        if (kind === "light") next.cost = Math.max(0, (Number(next.cost) || 0) - 1);
        if (kind === "dark") applyDarkWord(next, runEnchantWords[card.name]);
        if (kind) next.enchant = kind;
        return next;
      });
    }

    function buildDeck() {
      const specs = runDeck().map((card) => ({ uid: uid++, ...card }));
      deck = shuffle(specs);
      openingDeck = deck.map((card) => ({ ...card }));
      hand = [];
      discard = [];
      inPlay = [];
      resolveAt = 0;
    }

    function draw(n) {
      for (let i = 0; i < n; i++) {
        if (hand.length >= HAND_CAP) break;
        if (!deck.length) {
          if (!discard.length) break;
          deck = shuffle(discard);
          discard = [];
          log(`${heroName()}は捨て札を山札に戻した。`);
        }
        hand.push(deck.pop());
      }
    }

    function pullKind(kind) {
      if (hand.length >= HAND_CAP) return null;
      const take = () => {
        for (let i = deck.length - 1; i >= 0; i--) {
          if (cardKind(deck[i]) === kind) return deck.splice(i, 1)[0];
        }
        return null;
      };
      let card = take();
      if (!card && !deck.length && discard.length) {
        deck = shuffle(discard);
        discard = [];
        log(`${heroName()}は捨て札を山札に戻した。`);
        card = take();
      }
      if (!card) return null;
      hand.push(card);
      return card;
    }

    function pullFromBracelets() {
      const right = gear.braceletR;
      const left = gear.braceletL;
      if (right && right.id === "chain-attack" && !hand.some((card) => cardKind(card) === "attack")) {
        if (hand.length >= HAND_CAP) log(`${heroName()}は${right.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("attack");
          log(card ? `${heroName()}は${right.name}で${card.name}を引いた。` : `${heroName()}は${right.name}。山札に攻撃カードがない。`);
        }
      }
      if (left && left.id === "chain-guard" && !hand.some((card) => cardKind(card) === "block")) {
        if (hand.length >= HAND_CAP) log(`${heroName()}は${left.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("block");
          log(card ? `${heroName()}は${left.name}で${card.name}を引いた。` : `${heroName()}は${left.name}。山札に防御カードがない。`);
        }
      }
    }

    function strike(card, amount, crit) {
      const dealt = Math.max(0, amount);
      const result = applyDamage(enemy, dealt);
      if (dealt > 0 && (result.hpLoss || result.blocked)) {
        slashFoe();
        noteHit("enemy", result.hpLoss, dealt);
      }
      log(damageSentence(heroName(), card.name, dealt, result, crit), card);
      // ポイズンソード：アタックカードなら、シールドで防がれても毒
      const poisonHit = gear && gear.sword && Number(gear.sword.poisonHit) || 0;
      if (poisonHit > 0 && amount > 0 && cardKind(card) === "attack" && enemy.hp > 0) {
        addPoison(enemy, poisonHit);
        log(`${gear.sword.name}の毒。${enemy.name}は毒+${enemy.poison}。`, card);
      }
      // フレイムソード／業火の剣：ダメージが通るたび炎上
      const burnHit = gear && gear.sword && Number(gear.sword.burnHit) || 0;
      if (burnHit > 0 && dealt > 0 && enemy.hp > 0) {
        addBurn(enemy, burnHit);
        log(`${gear.sword.name}の炎。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
    }

    // クリティカル。critChance は百分率。当たると、その1回のダメージを1.5倍し、端数は切り上げ。
    function rollCrit(card, amount) {
      const n = Math.max(0, Number(amount) || 0);
      const chance = Number(card && card.critChance) || 0;
      if (chance <= 0 || n <= 0) return { amount: n, crit: false };
      if (Math.random() * 100 >= chance) return { amount: n, crit: false };
      return { amount: Math.ceil(n * 1.5), crit: true };
    }

    function resolveCard(card) {
      syncGearStats();
      if (card.thorns) {
        const now = gainThorns(player, card.thorns);
        log(`${heroName()}は${card.name}。トゲ${now}。`, card);
      }
      if (card.power && card.coward) {
        player.guardThrough = true;
        log(`${heroName()}は${card.name}。この戦闘中は、パリィ中でもシールドを得る。このカードはデッキから削除。`, card);
        return;
      }
      if (card.rage) {
        player.atkMod = (Number(player.atkMod) || 0) + 2;
        player.defMod = (Number(player.defMod) || 0) - 2;
        syncGearStats();
        log(`${heroName()}は${card.name}。ATK${signed(player.atk)}、DEF${signed(player.def)}。このカードはデッキから削除。戦闘が終わると戻る。`, card);
        return;
      }
      if (card.poise) {
        gainParry(card);
        return;
      }
      if (card.guardBreak) {
        const had = Math.max(0, Number(enemy.block) || 0);
        enemy.block = 0;
        log(had ? `${heroName()}は${card.name}。${enemy.name}のシールド${had}をすべて割った。` : `${heroName()}は${card.name}。${enemy.name}にシールドは無かった。`, card);
        return;
      }
      if (card.finisher) {
        const hits = Math.max(0, Number(player.parryHitsLast) || 0);
        strike(card, hits * 20);
        return;
      }
      if (card.parryAdd) {
        gainParry(card, card.parryAdd);
        return;
      }
      if (card.knife) {
        player.knifeReflect = true;
        gainParry(card);
        return;
      }
      if (card.masterOnce) {
        if (player.masterOnce) {
          log(`${heroName()}は${card.name}。この戦闘では、もう使えない。`, card);
          return;
        }
        player.masterOnce = true;
        const gain = restoreHp(card.heal || 10);
        log(gain ? `${heroName()}は${card.name}で${gain}回復。` : `${heroName()}は${card.name}。体力は満タン。`, card);
        gainParry(card);
        return;
      }
      if (card.magicParry) {
        player.magicParry = true;
        log(`${heroName()}は${card.name}。この戦闘中、パリィ中は状態異常にならない。`, card);
        return;
      }
      if (card.pride) {
        player.pride = true;
        log(`${heroName()}は${card.name}。この戦闘中、パリィに成功するたびATK+1。`, card);
        return;
      }
      if (card.shave) {
        player.shave = Number(card.shave) || 3;
        log(`${heroName()}は${card.name}。この戦闘中、パリィに成功するたび相手のDEF-${player.shave}。`, card);
        return;
      }
      if (card.step) {
        if (!player.parryLast) {
          log(`${heroName()}は${card.name}。前のターンはパリィが成功していない。`, card);
          return;
        }
        const before = hand.length;
        draw(2);
        log(`${heroName()}は${card.name}で${hand.length - before}枚引いた。`, card);
        return;
      }
      if (card.focus) {
        player.focus = (player.focus || 0) + card.focus;
        log(`${heroName()}は${card.name}。次の攻撃カードか防御カードの数値を+${player.focus}。`, card);
        return;
      }
      if (card.parry && !card.damage && !card.block) {
        gainParry(card);
        return;
      }
      if (card.press) {
        strike(card, player.block || 0);
        return;
      }
      if (card.poison && !card.damage && !card.block && !card.heal && !card.draw) {
        addPoison(enemy, card.poison);
        log(`${heroName()}は${card.name}。${enemy.name}は毒+${enemy.poison}。`, card);
        return;
      }
      if (card.heal) {
        const gain = restoreHp(card.heal);
        log(gain ? `${heroName()}は${card.name}で${gain}回復。` : `${heroName()}は${card.name}。体力は満タン。`, card);
        return;
      }
      if (card.draw) {
        const before = hand.length;
        draw(card.draw);
        log(`${heroName()}は${card.name}で${hand.length - before}枚引いた。`, card);
        return;
      }
      if (card.redTimes) {
        const reds = inPlay.filter((item) => cardKind(item) === "attack").length;
        const added = player.focus ? player.focus : 0;
        if (added) player.focus = 0;
        strike(card, reds * card.redTimes + (player.atk || 0) + added);
        return;
      }
      if (card.counter) {
        const reds = inPlay.filter((item) => cardKind(item) === "attack").length;
        if (reds) {
          log(`${heroName()}は${card.name}。プレイエリアにアタックがあるので、発動しない。`, card);
          return;
        }
        strike(card, card.counter);
        return;
      }
      if (card.hits) {
        const added = player.focus ? player.focus : 0;
        if (added) player.focus = 0;
        const atk = player.atk || 0;
        for (let hit = 0; hit < card.hits; hit++) {
          const rolled = rollCrit(card, card.damage + atk + (hit === 0 ? added : 0));
          strike(card, rolled.amount, rolled.crit);
        }
        return;
      }
      const added = player.focus && (card.damage || card.block) ? player.focus : 0;
      if (added) player.focus = 0;
      if (card.burnFirst && card.burn) {
        addBurn(enemy, card.burn);
        log(`${heroName()}は${card.name}。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
      if (card.damage) {
        let bonus = 0;
        if (card.fullBonus && player.hp >= player.maxHp) bonus += card.fullBonus;
        if (card.safeBonus && !player.hurtLast) bonus += card.safeBonus;
        if (card.kick && enemy.block > 0) bonus += card.kick;
        const atk = player.atk || 0;
        const rolled = rollCrit(card, card.damage + added + atk + bonus);
        strike(card, rolled.amount, rolled.crit);
        if (card.doubleNext) {
          player.doubleNext = true;
          log(`${heroName()}は次に受ける攻撃が2倍。`, card);
        }
      }
      if (card.burn && !card.burnFirst) {
        addBurn(enemy, card.burn);
        log(`${heroName()}は${card.name}。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
      if (card.expose) {
        player.expose = (Number(player.expose) || 0) + card.expose;
        log(`${heroName()}は次に受けるダメージ+${player.expose}。`, card);
      }
      if (card.parry && card.damage) gainParry(card);
      if (card.block) gainBlock(card.block + added, card);
      if (card.parry && card.block && !card.damage) gainParry(card);
      if (card.poison && (card.damage || card.block)) {
        addPoison(enemy, card.poison);
        log(`${heroName()}は${card.name}。${enemy.name}は毒+${enemy.poison}。`, card);
      }
      if (card.nextDraw) {
        player.extraDraw = (Number(player.extraDraw) || 0) + card.nextDraw;
        log(`${heroName()}は次のターンに${card.nextDraw}枚多く引く。`, card);
      }
      if (!card.damage && !card.block && !card.expose && !card.nextDraw && !card.burn) log(`${heroName()}は${card.name}。${card.text}`, card);
    }

    // 手札で光る。使えない条件を満たしたとき、または条件で強くなるとき。
    function handConditionLit(card) {
      if (!card || !player) return false;
      if (card.step) return !!player.parryLast;
      if (card.fullOnly) return player.hp >= player.maxHp;
      if (card.halfOnly) return hpHalf(player);
      if (card.headbutt) return inPlay.length > 0;
      if (card.finisher) return (Number(player.parryHitsLast) || 0) > 0;
      if (card.kick) return !!(enemy && enemy.block > 0);
      if (card.fullBonus) return player.hp >= player.maxHp;
      if (card.safeBonus) return !player.hurtLast;
      if (card.press) {
        if ((Number(player.block) || 0) > 0) return true;
        return (inPlay || []).some((item) => (Number(item.block) || 0) > 0);
      }
      if (card.counter) return !(inPlay || []).some((item) => cardKind(item) === "attack");
      if (card.redTimes) return (inPlay || []).some((item) => cardKind(item) === "attack");
      return false;
    }

    function cardPlayable(card) {
      if (!card) return false;
      if (masteryOffer) return false;
      if ((Number(card.cost) || 0) > player.energy) return false;
      if (card.headbutt && !inPlay.length) return false;
      if (card.halfOnly && !hpHalf(player)) return false;
      if (card.fullOnly && player.hp < player.maxHp) return false;
      if (card.step && !player.parryLast) return false;
      return true;
    }

    function playCard(index) {
      if (masteryOffer) return false;
      if (showDeck || showFoeDeck) return false;
      if (phase !== "player" || outcome) return false;
      const card = hand[index];
      if (!card) return false;
      if (player.energy < card.cost) {
        note = "";
        fxNoMana = true;
        render();
        return false;
      }
      if (card.headbutt && !inPlay.length) {
        note = "プレイエリアの自分のカードを廃棄すると使える";
        render();
        return false;
      }
      if (card.fullOnly && player.hp < player.maxHp) {
        note = "体力が満タンのときだけ使える";
        render();
        return false;
      }
      if (card.step && !player.parryLast) {
        note = "前のターンにパリィが成功したときだけ使える";
        render();
        return false;
      }
      spendEnergy(card.cost);
      hand.splice(index, 1);
      if (playsImmediately(card)) {
        resolveCard(card);
        placeUsedCard(card, "hand");
        note = "";
        noteMastery(card);
        pullFromBracelets();
        if (finishIfStuck()) return true;
        render();
        return true;
      }
      if (card.headbutt) {
        const names = inPlay.map((item) => item.name).join("、");
        capturePlayClearFlights(null, "exile");
        while (inPlay.length) battleExile.push(inPlay.shift());
        log(`${heroName()}は${names}を廃棄した。`);
      }
      if (card.keep) card.resolved = false;
      inPlay.push(card);
      note = "";
      noteMastery(card);
      pullFromBracelets();
      if (finishIfStuck()) return true;
      render();
      return true;
    }

    function noPlayableHand() {
      return !hand.some((card) => cardPlayable(card));
    }

    function finishIfStuck() {
      if (masteryOffer) return false;
      if (phase !== "player" || outcome || !noPlayableHand()) return false;
      if (!hand.length || autoEndTurn) {
        endTurn();
        return true;
      }
      return false;
    }

    function handCardBox(index) {
      const cardEl = document.querySelector(`.hand [data-card="${index}"]`);
      if (!cardEl) return null;
      const rect = cardEl.getBoundingClientRect();
      return {
        cx: rect.left + rect.width / 2,
        cy: rect.top + rect.height / 2,
        w: rect.width,
        h: rect.height,
        layoutW: cardEl.offsetWidth,
        layoutH: cardEl.offsetHeight,
        fan: parseFloat(cardEl.style.getPropertyValue("--fan")) || 0,
      };
    }

    function flyCardToPlay(from) {
      if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(".play-side.mine .play-card:last-child .card");
      if (!target) return;
      const to = stageFrameOf(target);
      let start = stageFrameFromRect(from);
      if (stageOn() && from.layoutW && from.layoutH) {
        start = {
          cx: start.cx,
          cy: start.cy,
          w: from.layoutW,
          h: from.layoutH,
          width: from.layoutW,
          height: from.layoutH,
          left: start.cx - from.layoutW / 2,
          top: start.cy - from.layoutH / 2,
        };
      }
      if (!to.w || !to.h || !start.w || !start.h) return;
      const ghost = target.cloneNode(true);
      const kind = target.classList.contains("attack") ? "attack" : target.classList.contains("block") ? "block" : target.classList.contains("power") ? "power" : "skill";
      ghost.className = `card fly-card ${kind}`;
      ghost.style.left = `${start.left}px`;
      ghost.style.top = `${start.top}px`;
      ghost.style.width = `${start.w}px`;
      ghost.style.height = `${start.h}px`;
      ghost.style.transition = "none";
      ghost.style.transform = `rotate(${from.fan}deg)`;
      mountFloat(ghost);
      target.style.visibility = "hidden";
      const move = stageDelta(start, to);
      const dx = move.dx;
      const dy = move.dy;
      const scale = move.scale;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
        if (target.isConnected) target.style.visibility = "";
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 560);
    }

    function playFromHand(index) {
      const card = hand[index];
      const from = handCardBox(index);
      if (!playCard(index)) return;
      if (!playsImmediately(card)) flyCardToPlay(from);
    }

    function masteryNeed(name) {
      const def = cardDef(name);
      const cost = def ? Number(def.cost) || 0 : 0;
      if (cost <= 0) return 12;
      if (cost === 1) return 10;
      if (cost === 2) return 8;
      return 6;
    }

    function noteMastery(card) {
      if (!card || card.copyNth == null || !card.name) return false;
      let row = masteryRow(card.name, card.copyNth);
      if (!row) {
        row = { name: card.name, nth: card.copyNth, plays: 0, picked: "" };
        cardMastery.push(row);
      }
      if (row.picked) return false;
      row.plays += 1;
      const need = masteryNeed(card.name);
      if (row.plays < need) return false;
      masteryOffer = { name: card.name, nth: card.copyNth, need };
      return true;
    }

    function takeMastery(picked) {
      if (!masteryOffer || (picked !== "power" && picked !== "light")) return;
      const row = masteryRow(masteryOffer.name, masteryOffer.nth);
      if (row) row.picked = picked;
      const name = masteryOffer.name;
      const nth = masteryOffer.nth;
      const fresh = runDeck().find((card) => card && card.name === name && card.copyNth === nth);
      if (fresh) {
        for (const list of [deck, hand, discard, inPlay, openingDeck, battleExile]) {
          for (const card of list || []) {
            if (!card || card.name !== name || card.copyNth !== nth) continue;
            card.damage = fresh.damage;
            card.block = fresh.block;
            card.heal = fresh.heal;
            card.cost = fresh.cost;
            card.text = fresh.text;
            card.fused = fresh.fused;
            card.mastered = fresh.mastered;
            card.enchant = fresh.enchant;
          }
        }
      }
      masteryOffer = null;
      log(`${name}が熟練した。${picked === "power" ? "強さ" : "軽さ"}。`);
      persistSave(true);
      render();
    }

    function isItemCard(card) {
      return !!(card && (card.power || card.kind === "power"));
    }

    function playsImmediately(card) {
      return !!(card && (card.quick || card.burst || isItemCard(card) || isFlashCard(card)));
    }

    function isFlashCard(card) {
      return !!(card && (card.flash || card.instant || card.during || card.permanent || card.masterOnce));
    }

    function afterUsePile(card) {
      if (!card) return "discard";
      if (card.burst || isItemCard(card)) return "burst";
      if (isFlashCard(card)) return "exile";
      return "discard";
    }

    function placeUsedCard(card, keepTo) {
      const pile = afterUsePile(card);
      if (pile === "keep") {
        if (keepTo === "hand") hand.push(card);
        return pile;
      }
      if (pile === "exile") battleExile.push(card);
      else if (pile === "burst") removed.push(card);
      else discard.push(card);
      return pile;
    }

    function goesToDiscard(card) {
      return afterUsePile(card) === "discard";
    }

    let pendingPlayClearFly = [];

    function makeFlyGhost(el) {
      const frame = stageFrameOf(el);
      if (!frame.w || !frame.h) return null;
      const ghost = el.cloneNode(true);
      ghost.classList.add("fly-card");
      ghost.style.left = `${frame.left}px`;
      ghost.style.top = `${frame.top}px`;
      ghost.style.width = `${frame.w}px`;
      ghost.style.height = `${frame.h}px`;
      ghost.style.margin = "0";
      ghost.style.transition = "none";
      ghost.style.transform = "none";
      ghost.style.opacity = "1";
      mountFloat(ghost);
      return { ghost, from: frame };
    }

    function captureFoeLeave() {
      foeLeaveGhost = null;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const el = document.querySelector(".play-side.foe .play-card .card");
      if (!el) return;
      foeLeaveGhost = makeFlyGhost(el);
    }

    function showFoePlay(play, gen) {
      if (gen != null && gen !== foeArriveGen) return;
      foeArriveHide = false;
      const wraps = document.querySelectorAll(".play-side.foe .play-card.await-draw");
      if (wraps.length) wraps.forEach((wrap) => wrap.classList.remove("await-draw"));
      else if (play) {
        const wrap = play.closest(".play-card");
        if (wrap) wrap.classList.remove("await-draw");
      }
    }

    function flyFoeFromDeck(play) {
      const gen = foeArriveGen;
      if (!play || !play.isConnected) {
        showFoePlay(play, gen);
        return;
      }
      const deck = document.querySelector(".foe-pile .pile-card");
      if (!deck) {
        showFoePlay(play, gen);
        return;
      }
      const from = stageFrameOf(deck);
      const to = stageFrameOf(play);
      if (!from.w || !to.w) {
        showFoePlay(play, gen);
        return;
      }
      const ghost = play.cloneNode(true);
      ghost.classList.add("fly-card");
      ghost.style.visibility = "visible";
      ghost.style.position = "fixed";
      ghost.style.zIndex = "70";
      ghost.style.left = `${from.left}px`;
      ghost.style.top = `${from.top}px`;
      ghost.style.width = `${from.w}px`;
      ghost.style.height = `${from.h}px`;
      ghost.style.margin = "0";
      ghost.style.transition = "none";
      mountFloat(ghost);
      const move = stageDelta(from, to);
      const dx = move.dx;
      const dy = move.dy;
      const scale = move.scale;
      const finish = () => {
        if (ghost.dataset.landed) return;
        ghost.dataset.landed = "1";
        ghost.remove();
        showFoePlay(play, gen);
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 1.05s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 1180);
    }

    function flyDiscardIntoDeck(done) {
      const fromEl = document.querySelector(".foe-discard .pile-card");
      const toEl = document.querySelector(".foe-pile .pile-card");
      if (!fromEl || !toEl || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        done();
        return;
      }
      const from = stageFrameOf(fromEl);
      const to = stageFrameOf(toEl);
      if (!from.w || !to.w) {
        done();
        return;
      }
      const ghost = fromEl.cloneNode(true);
      ghost.classList.add("fly-card");
      ghost.style.position = "fixed";
      ghost.style.zIndex = "70";
      ghost.style.left = `${from.left}px`;
      ghost.style.top = `${from.top}px`;
      ghost.style.width = `${from.w}px`;
      ghost.style.height = `${from.h}px`;
      ghost.style.margin = "0";
      ghost.style.transition = "none";
      mountFloat(ghost);
      const move = stageDelta(from, to);
      const dx = move.dx;
      const dy = move.dy;
      let landed = false;
      const finish = () => {
        if (landed) return;
        landed = true;
        ghost.remove();
        done();
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.7s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px)`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 820);
    }

    function launchFoeTurnTravel() {
      const leave = foeLeaveGhost;
      const draw = foeDrawPending;
      foeLeaveGhost = null;
      foeDrawPending = false;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        showFoePlay(document.querySelector(".play-side.foe .play-card .card"));
        if (leave) leave.ghost.remove();
        return;
      }
      if (!leave && !draw) return;
      const play = document.querySelector(".play-side.foe .play-card .card");
      const goDraw = () => {
        if (!draw) return;
        flyFoeFromDeck(play);
      };
      if (!leave) {
        goDraw();
        return;
      }
      const dest = document.querySelector(".foe-discard .pile-card");
      if (!dest) {
        leave.ghost.remove();
        goDraw();
        return;
      }
      const to = stageFrameOf(dest);
      const from = leave.from;
      const ghost = leave.ghost;
      const move = stageDelta(from, to);
      const dx = move.dx;
      const dy = move.dy;
      const scale = Math.max(0.22, move.scale);
      const finish = () => {
        if (ghost.dataset.landed) return;
        ghost.dataset.landed = "1";
        ghost.remove();
        goDraw();
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.48s cubic-bezier(0.22, 0.7, 0.18, 1), opacity 0.42s ease 80ms";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-18deg) scale(${scale})`;
          ghost.style.opacity = "0.2";
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 560);
    }

    // プレイエリアの自分のカード：捨て札へ／廃棄へ飛ばす準備（次の描画のあとで動かす）
    // forceMode があれば全枚その行き先（頭突きの一括廃棄など）
    function capturePlayClearFlights(cards, forceMode) {
      pendingPlayClearFly.forEach((item) => item.ghost.remove());
      pendingPlayClearFly = [];
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const list = cards || inPlay;
      const nodes = [...document.querySelectorAll(".play-side.mine .play-card .card")];
      nodes.forEach((el, i) => {
        const card = list[i];
        if (!card) return;
        const made = makeFlyGhost(el);
        if (!made) return;
        const mode = forceMode || (afterUsePile(card) === "keep" && card.resolved ? "stay" : goesToDiscard(card) ? "discard" : "exile");
        if (mode === "stay") {
          made.ghost.remove();
          return;
        }
        pendingPlayClearFly.push({ ...made, mode });
      });
    }

    function launchPendingPlayClearFly() {
      const flights = pendingPlayClearFly;
      pendingPlayClearFly = [];
      if (!flights.length) return 0;
      const discards = flights.filter((item) => item.mode === "discard");
      const exiles = flights.filter((item) => item.mode === "exile");
      const dest = document.querySelector('[data-pile="discard"] .pile-card');
      const countEl = dest && dest.querySelector(".pile-count");
      const finalCount = discard.length;
      const startCount = Math.max(0, finalCount - discards.length);
      if (countEl) countEl.textContent = String(startCount);
      let landed = 0;
      let maxWait = 0;

      discards.forEach((item, i) => {
        if (!dest) {
          item.ghost.remove();
          return;
        }
        const to = stageFrameOf(dest);
        const from = item.from;
        const ghost = item.ghost;
        const move = stageDelta(from, to);
        const dx = move.dx;
        const dy = move.dy;
        const scale = Math.max(0.22, move.scale);
        const delay = i * 70;
        maxWait = Math.max(maxWait, 560 + delay);
        const finish = () => {
          if (ghost.dataset.landed) return;
          ghost.dataset.landed = "1";
          ghost.remove();
          landed += 1;
          if (countEl && countEl.isConnected) countEl.textContent = String(startCount + landed);
        };
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.transition = `transform 0.48s cubic-bezier(0.22, 0.7, 0.18, 1) ${delay}ms, opacity 0.42s ease ${delay + 80}ms`;
            ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-18deg) scale(${scale})`;
            ghost.style.opacity = "0.15";
          });
        });
        ghost.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 560 + delay);
      });

      exiles.forEach((item, i) => {
        const ghost = item.ghost;
        const delay = i * 80;
        maxWait = Math.max(maxWait, 620 + delay);
        const finish = () => {
          if (ghost.dataset.landed) return;
          ghost.dataset.landed = "1";
          ghost.remove();
        };
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.transition = `transform 0.55s cubic-bezier(0.2, 0.75, 0.2, 1) ${delay}ms, opacity 0.5s ease ${delay + 40}ms, filter 0.5s ease ${delay}ms`;
            ghost.style.transform = "translateY(-120px) rotate(22deg) scale(0.35)";
            ghost.style.opacity = "0";
            ghost.style.filter = "brightness(1.4) saturate(0.2)";
          });
        });
        ghost.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 640 + delay);
      });

      return maxWait;
    }

    function scrapPlay() {
      capturePlayClearFlights();
      while (inPlay.length) {
        const card = inPlay.shift();
        const pile = afterUsePile(card);
        if (pile === "exile" || pile === "burst") placeUsedCard(card);
        else discard.push(card);
      }
      resolveAt = 0;
    }

    function flyPlayToHand(from, handIndex) {
      if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(`.hand [data-card="${handIndex}"]`);
      if (!target) return;
      const start = stageFrameFromRect(from);
      const to = stageFrameOf(target);
      if (!to.w || !to.h || !start.w || !start.h) return;
      const ghost = target.cloneNode(true);
      const kind = target.classList.contains("attack") ? "attack" : target.classList.contains("block") ? "block" : target.classList.contains("power") ? "power" : "skill";
      ghost.className = `card fly-card ${kind}`;
      ghost.style.left = `${start.left}px`;
      ghost.style.top = `${start.top}px`;
      ghost.style.width = `${start.w}px`;
      ghost.style.height = `${start.h}px`;
      ghost.style.transition = "none";
      ghost.style.transform = "none";
      mountFloat(ghost);
      target.style.visibility = "hidden";
      const move = stageDelta(start, to);
      const dx = move.dx;
      const dy = move.dy;
      const scale = move.scale;
      const fan = parseFloat(target.style.getPropertyValue("--fan")) || 0;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
        if (target.isConnected) target.style.visibility = "";
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.42s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(${fan}deg) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 520);
    }

    function unplayFromPlay(index) {
      if (phase !== "player" || outcome) return false;
      const card = inPlay[index];
      if (!card) return false;
      const el = document.querySelector(`.play-side.mine .play-card[data-unplay="${index}"] .card`)
        || document.querySelectorAll(".play-side.mine .play-card .card")[index];
      const from = el ? el.getBoundingClientRect() : null;
      inPlay.splice(index, 1);
      if (card.keep) card.resolved = false;
      refundEnergy(card.cost);
      hand.push(card);
      sortHand();
      note = "";
      const handIndex = hand.indexOf(card);
      render();
      if (from) flyPlayToHand(from, handIndex);
      return true;
    }

    function enemyUseCard(card) {
      if (card.halfOnly && !hpHalf(enemy)) {
        log(`${enemy.name}は${card.name}。体力が半分より上なので、使えない。`, card, true);
        return;
      }
      if (card.thorns) {
        const now = gainThorns(enemy, card.thorns);
        log(`${enemy.name}は${card.name}。トゲ${now}。`, card, true);
      }
      if (card.press) {
        const amount = enemy.block || 0;
        if (amount > 0) takeEnemyHit(amount, card);
        else log(`${enemy.name}は${card.name}で0ダメージ。`, card, true);
        return;
      }
      if (card.burnFirst && card.burn) {
        if (addBurn(player, card.burn)) log(`${enemy.name}は${card.name}。${heroName()}は炎上+${player.burn}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      }
      if (card.legion) {
        playLegion(card);
        return;
      }
      if (card.stealHand) {
        takeEnemyHit(card.damage || 5, card);
        stealOneHand();
        return;
      }
      if (card.hits && card.damage) {
        const times = Math.max(1, Number(card.hits) || 1);
        for (let n = 0; n < times; n += 1) {
          if (player.hp <= 0) break;
          const rolled = rollCrit(card, card.damage);
          takeEnemyHit(rolled.amount, card, rolled.crit);
        }
        return;
      }
      if (card.damage) {
        const kick = card.kick && player.block > 0 ? card.kick : 0;
        const full = card.fullBonus && enemy.hp >= enemy.maxHp ? card.fullBonus : 0;
        const rolled = rollCrit(card, card.damage + kick + full);
        takeEnemyHit(rolled.amount, card, rolled.crit);
      } else if (card.block) {
        const gain = Math.max(0, card.block + (Number(enemy.def) || 0));
        if (gain) {
          enemy.block += gain;
          fxShieldEnemy = true;
        }
        log(`${enemy.name}は${card.name}でブロック${gain}。`, card, true);
      } else if (card.poison) {
        if (addPoison(player, card.poison)) log(`${enemy.name}は${card.name}。${heroName()}は毒+${player.poison}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      }
      if (card.burn && !card.burnFirst) {
        if (addBurn(player, card.burn)) log(`${enemy.name}は${card.name}。${heroName()}は炎上+${player.burn}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      } else if (!card.damage && !card.block && !card.poison && !card.burnFirst) {
        log(`${enemy.name}は${card.name}。${card.text}`, card, true);
      }
    }

    function dungeonStar() {
      if (dungeonName === "深淵") return 3;
      if (dungeonName === "古城") return 2;
      return 1;
    }

    function playLegion(card) {
      const star = dungeonStar();
      const rankOf = { スライム: 1, ゴブリン: 1, 物乞い: 1, ちびドラゴン: 2, ミノタウロス: 3 };
      const pool = runSlain.filter((name) => rankOf[name] === star);
      if (!pool.length) {
        log(`${enemy.name}は死者の軍団。同じ★で倒した敵がいない。`, card, true);
        return;
      }
      const who = pool[Math.floor(Math.random() * pool.length)];
      const trait = who === "スライム"
        ? { name: "スライム粘液", cost: 1, text: "相手に毒+2を与える", poison: 2 }
        : who === "ゴブリン"
          ? applyEnemyHidden({ name: "ライフフルネスアタック" }, enemyNow())
          : who === "物乞い"
            ? { ...FOE_ONLY["無心"], name: "無心" }
            : who === "ちびドラゴン"
              ? { name: "ファイアパラダイス", cost: 3, text: "相手に炎上+3を与える", burn: 3, kind: "skill" }
              : { name: "ミノスの一撃", cost: 3, text: "30ダメージ\nクリティカル20%", damage: 30, kind: "attack", critChance: 20 };
      log(`${enemy.name}は死者の軍団。${who}の${trait.name}。`, card, true);
      enemyUseCard(trait);
    }

    function stealOneHand() {
      if (!hand.length) return;
      const index = Math.floor(Math.random() * hand.length);
      const taken = hand.splice(index, 1)[0];
      enemyLoop.push({ ...taken });
      log(`${enemy.name}は${taken.name}を山札に入れた。戦闘が終わると戻る。`, taken, true);
    }

    function leaveFoeCard() {
      timer = null;
      if (outcome) return;
      captureFoeLeave();
      foePlan = [];
      intentShown = false;
      foeDrawPending = false;
      foeArriveHide = false;
      foeArriveGen += 1;
      foeAngerShow = false;
      render();
      timer = setTimeout(finishResolve, 720);
    }

    function drawFoeFromDeck() {
      if (phase !== "player" || outcome) return;
      foeAngerShow = false;
      intentShown = true;
      foeArriveGen += 1;
      foeArriveHide = true;
      foeDrawPending = true;
      render();
    }

    function burnFoeAnger(done) {
      const el = document.querySelector(".play-side.foe .play-card .card");
      if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        done();
        return;
      }
      const made = makeFlyGhost(el);
      el.style.visibility = "hidden";
      if (!made) {
        done();
        return;
      }
      const ghost = made.ghost;
      const finish = () => {
        if (ghost.dataset.landed) return;
        ghost.dataset.landed = "1";
        ghost.remove();
        done();
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.55s ease, filter 0.55s ease";
          ghost.style.transform = "translateY(-70px) scale(1.08)";
          ghost.style.filter = "sepia(1) saturate(6) brightness(1.7)";
          ghost.style.opacity = "0";
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 640);
    }

    function presentNextFoeCard() {
      timer = null;
      if (phase !== "player" || outcome) return;
      if (!foePlan.length) buildFoePlan();
      foeAngerShow = foePlan.some((step) => step.anger);
      intentShown = foePlan.length > 0;
      foeArriveGen += 1;
      foeArriveHide = foePlan.length > 0;
      foeDrawPending = foeArriveHide;
      foeRageBusy = false;
      render();
    }

    function finishResolve() {
      timer = null;
      scrapPlay();
      banner = "";
      if (tickPoison("enemy")) {
        scheduleFinish("win");
        return;
      }
      const flyWait = pendingPlayClearFly.length
        ? 560 + (pendingPlayClearFly.length - 1) * 70
        : 0;
      const poisonWait = (fxPoisonApply.player || fxPoisonApply.enemy) ? 1500 : 0;
      render();
      const wait = Math.max(flyWait, poisonWait);
      if (wait) timer = setTimeout(startPlayerTurn, wait);
      else startPlayerTurn();
    }

    function stepResolve() {
      timer = null;
      const enemyIndex = inPlay.length;
      if (phase !== "resolve" || resolveAt > enemyIndex) {
        finishResolve();
        return;
      }
      const index = resolveAt;
      resolveAt += 1;
      if (index < enemyIndex) {
        resolveCard(inPlay[index]);
        if (inPlay[index] && inPlay[index].keep) inPlay[index].resolved = true;
        if (enemy.hp <= 0) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
      } else {
        logTurn("enemy");
        dropShield(enemy);
        for (const step of foePlan) {
          if (player.hp <= 0) break;
          if (step.anger) gainEnemyAnger();
          else {
            const live = applyEnemyHidden(step.card, enemyNow());
            enemyUseCard(live);
            foeDiscard.push({ ...live });
          }
        }
        if (player.hp > 0 && enemyNow().rally && !enemy.rallied && hpHalf(enemy) && !swordIgnoresTrait()) {
          enemy.rallied = true;
          const extra = shuffle(sourcePattern()).slice(0, 2);
          log(`${enemy.name}の特性。デッキから2枚引いて、続けて使う。`, null, true);
          for (const more of extra) {
            if (player.hp <= 0) break;
            enemyUseCard(more);
          }
        }
        if (player.hp <= 0) {
          scrapPlay();
          scheduleFinish("lose");
          return;
        }
        const guardKind = fxGuard;
        const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
        const slashCount = fxSlashes.length;
        const poisonWait = (fxPoisonApply.player || fxPoisonApply.enemy) ? 1500 : 0;
        render();
        const wait = Math.max(1400 + Math.max(0, slashCount - 1) * 340, drainMs(), playerNumber ? 1850 : 0, guardKind === "hold" ? 1750 : 0, poisonWait);
        timer = setTimeout(leaveFoeCard, wait);
        return;
      }
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const slashCount = fxSlashes.length;
      const poisonWait = (fxPoisonApply.player || fxPoisonApply.enemy) ? 1500 : 0;
      render();
      const wait = Math.max(720 + Math.max(0, slashCount - 1) * 340, drainMs(), playerNumber ? 1850 : 0, guardKind === "hold" ? 1750 : 0, poisonWait);
      timer = setTimeout(resolveAt > enemyIndex ? finishResolve : stepResolve, wait);
    }

    function dropShield(who) {
      const had = Math.max(0, Number(who && who.block) || 0);
      if (!had) return;
      who.block = 0;
    }

    function endTurn() {
      if (masteryOffer) return;
      if (showDeck || showFoeDeck) return;
      if (phase !== "player" || outcome || foeRageBusy) return;
      clearTimer();
      if (hasReuseBracelet()) {
        const left = Math.max(0, Number(player.energy) || 0);
        player.pendingCarry = left;
        if (left > 0) log(`${heroName()}は再利用の腕輪。マナ${left}を次のターンへ持ち越す。`);
      } else {
        player.pendingCarry = 0;
      }
      phase = "resolve";
      resolveAt = 0;
      while (resolveAt < inPlay.length && inPlay[resolveAt].keep && inPlay[resolveAt].resolved) resolveAt += 1;
      const kept = hand.filter((card) => card.keep || isItemCard(card));
      discard.push(...hand.filter((card) => !card.keep));
      hand = kept;
      note = "";
      const poisoned = tickPoison("player");
      turnCall = "resolve";
      if (poisoned) {
        scheduleFinish("lose");
        return;
      }
      const poisonWait = (fxPoisonApply.player || fxPoisonApply.enemy) ? 1500 : 1100;
      render();
      timer = setTimeout(stepResolve, poisonWait);
    }

    function startPlayerTurn(quiet) {
      if (player.hp <= 0) {
        fxFatal = true;
        fatalHold = true;
        scheduleFinish("lose");
        return;
      }
      turn += 1;
      logTurn("player");
      player.hurtLast = !!player.hurtThis;
      player.hurtThis = false;
      if (turn > 1) {
        const hits = Math.max(0, Number(player.parryHitsThis) || 0);
        player.parryHitsLast = hits;
        player.parryLast = hits > 0;
      }
      player.parryHitsThis = 0;
      player.parryHitThis = false;
      player.knifeReflect = false;
      if (parryCount(player) > 0) {
        player.parry = 0;
        log(`${heroName()}のパリィが、ターンの終わりに消失した。`);
      }
      // 自分のシールドは、敵の番が終わって次の自分の番になるときに消える
      dropShield(player);
      syncGearStats();
      const halfMana = hpHalf(player) && (gear.braceletL && gear.braceletL.halfMana || gear.braceletR && gear.braceletR.halfMana) ? 1 : 0;
      const carried = Math.max(0, Number(player.pendingCarry) || 0);
      player.pendingCarry = 0;
      player.baseMax = MANA + (Number(player.manaMod) || 0) + halfMana;
      player.baseEnergy = player.baseMax;
      player.tempEnergy = carried;
      syncEnergyTotal();
      if (halfMana) log(`${heroName()}はミノタウロスの腕輪。体力が半分以下なので、このターンのマナ+1。`);
      if (carried > 0) log(`${heroName()}は持ち越したマナ${carried}（オレンジ）。`);
      const extra = Math.max(0, Number(player.extraDraw) || 0);
      player.extraDraw = 0;
      draw(DRAW_PER_TURN + (Number(player.spdMod) || 0) + extra);
      pullFromBracelets();
      fxDeal = true;
      slashSeq = 0;
      if (!quiet) turnCall = "player";
      phase = "player";
      intentShown = false;
      foeAngerShow = false;
      if (finishIfStuck()) return;
      render();
      timer = setTimeout(presentNextFoeCard, quiet ? 280 : 1150);
    }

    function finish(kind) {
      clearTimer();
      clearBattleMods();
      outcome = kind;
      phase = "end";
      banner = "";
      fatalHold = false;
      fxFatal = false;
      log(kind === "win" ? `${heroName()}は${enemy.name}を倒した。` : `${heroName()}は倒された。`);
      if (kind === "lose") {
        defeatSnap = captureDefeat();
        endRun(false);
        screen = "defeat";
        render();
        return;
      }
      if (kind === "win") {
        const slain = enemyKey(enemy && enemy.name);
        if (slain && runSlain.indexOf(slain) < 0) runSlain.push(slain);
        prepareReward();
        persistSave(true);
      }
      render();
    }

    function scheduleFinish(kind) {
      phase = "end";
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const fatal = kind === "lose" && (fxFatal || fatalHold);
      if (fatal) {
        fxFatal = true;
        fatalHold = true;
      }
      const fatalWait = fatal ? 3600 : 0;
      const poisonWait = (fxPoisonApply.player || fxPoisonApply.enemy) ? 1500 : 0;
      const wait = Math.max(720, drainMs(), playerNumber ? (fatal ? 3200 : 1850) : 0, guardKind === "hold" ? 1750 : 0, fatalWait, poisonWait);
      clearTimer();
      render();
      timer = setTimeout(() => finish(kind), wait);
    }

    function captureDefeat() {
      const blow = lastFoeBlow;
      const foeName = enemy && enemy.name ? enemy.name : "敵";
      const hit = blow && blow.hpLoss ? `${blow.hpLoss}ダメージ` : "";
      const why = blow && blow.name === "毒"
        ? `毒で体力が尽きた。`
        : blow && blow.name
          ? `${foeName}の${blow.name}${hit ? `で${hit}` : ""}。体力が尽きた。`
          : `${foeName}に倒された。`;
      return {
        hero: heroName(),
        defeatArt: heroItem().defeat,
        victoryArt: heroItem().victory,
        foeName,
        foeImage: enemy && enemy.image ? enemy.image : "",
        foeHp: enemy ? `${enemy.hp}/${enemy.maxHp}` : "",
        why,
        log: (logLines || []).map((line) => (typeof line === "string" ? { text: line } : { ...line })),
        deck: (openingDeck || []).map((card) => ({ ...card })),
        dungeon: dungeonName,
        floor: floorLabel(),
        stars: meta.stars,
      };
    }

    function logLinesHtml(lines) {
      let logTurnShown = 0;
      return (lines || []).map((line, index) => {
        const text = typeof line === "string" ? line : line.text;
        const kind = line && line.kind;
        const cls = kind === "player" ? "turn-player" : kind === "enemy" ? "turn-enemy" : "";
        const hover = line && line.card ? ` data-log="${index}"` : "";
        const foe = line && line.foe ? ` data-foe="1"` : "";
        let head = "";
        if (kind && line.turn && line.turn !== logTurnShown) {
          logTurnShown = line.turn;
          head = `<p class="turn-head"><span>${line.turn}ターン目</span></p>`;
        }
        const body = kind ? esc(text) : colorNames(text);
        return `${head}<p class="${cls}"${hover}${foe}>${body}</p>`;
      }).join("");
    }

    function emptyMeta() {
      return { uses: 0, clears: 0, stars: 0, cleared: {} };
    }

    function metaFrom(saved) {
      const source = saved && typeof saved === "object" ? saved : {};
      const clearedMap = (source.cleared && typeof source.cleared === "object") ? { ...source.cleared } : {};
      if (!source.cleared && (Number(source.clears) || 0) > 0) clearedMap["20"] = true;
      return {
        uses: Number(source.uses) || 0,
        clears: Number(source.clears) || 0,
        stars: Number(source.stars) || 0,
        cleared: clearedMap,
      };
    }

    function readAccount() {
      try {
        const data = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "{}");
        if (!data || typeof data !== "object") return { login: "", slots: {} };
        if (!data.slots || typeof data.slots !== "object") data.slots = {};
        return data;
      } catch (error) {
        return { login: "", slots: {} };
      }
    }

    function writeAccount(data) {
      localStorage.setItem(ACCOUNT_KEY, JSON.stringify(data));
    }

    function accountSlot(account, word) {
      if (!account.slots[word]) account.slots[word] = {};
      return account.slots[word];
    }

    function claimLegacy(slot) {
      if (!slot.save) {
        try {
          const old = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
          if (old) slot.save = old;
        } catch (error) { /* 古いセーブが壊れていても、新しい言葉は空で始める */ }
      }
      if (!slot.meta) {
        try {
          const old = JSON.parse(localStorage.getItem(META_KEY) || "null");
          if (old && typeof old === "object") slot.meta = old;
        } catch (error) { /* 同上 */ }
      }
      if (!slot.live) {
        try {
          const old = JSON.parse(localStorage.getItem(LIVE_KEY) || "null");
          if (old) slot.live = old;
        } catch (error) { /* 同上 */ }
      }
      if (slot.save || slot.meta || slot.live) {
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(META_KEY);
        localStorage.removeItem(LIVE_KEY);
      }
    }

    function loadMeta() {
      if (!loginWord) {
        meta = emptyMeta();
        return;
      }
      const slot = readAccount().slots[loginWord];
      meta = metaFrom(slot && slot.meta);
    }

    function persistMeta() {
      if (!loginWord) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      slot.meta = meta;
      account.login = loginWord;
      writeAccount(account);
    }

    function setLogin(word) {
      const account = readAccount();
      const slot = accountSlot(account, word);
      if (!slot.save && !slot.meta && !slot.live) claimLegacy(slot);
      account.login = word;
      writeAccount(account);
      loginWord = word;
      loadMeta();
      touchLogin();
    }

    function logout() {
      const account = readAccount();
      account.login = "";
      writeAccount(account);
      loginWord = "";
      meta = emptyMeta();
      screen = "title";
      render();
    }

    function wipeLogin() {
      if (!loginWord) return;
      const account = readAccount();
      delete account.slots[loginWord];
      account.login = "";
      writeAccount(account);
      loginWord = "";
      meta = emptyMeta();
      screen = "title";
      render();
    }

    function loadAccount() {
      const account = readAccount();
      loginWord = typeof account.login === "string" ? account.login : "";
      if (loginWord && !/^[ぁ-んー]+$/.test(loginWord)) loginWord = "";
      loadMeta();
      touchLogin();
    }

    function touchLogin() {
      if (!loginWord) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      const list = Array.isArray(slot.logins) ? slot.logins.map(Number).filter((n) => n > 0) : [];
      const now = Date.now();
      if (!list.length || now - list[0] > 2 * 60 * 1000) list.unshift(now);
      slot.logins = list.slice(0, 8);
      account.login = loginWord;
      writeAccount(account);
    }

    function formatLogin(ts) {
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
      }).format(new Date(ts));
    }

    function bankStars() {
      const have = Math.max(0, Number(meta.stars) || 0);
      const gained = Math.floor(have / 5);
      meta.packs = (Number(meta.packs) || 0) + gained;
      meta.lastPacks = gained;
      meta.lastStars = have;
      meta.stars = 0;
    }

    function endRun(clearedRun) {
      const item = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonName);
      const floorsKey = item ? item.floors : floorsOf(dungeonName);
      gear = emptyGear();
      gearOpen = null;
      stolen = [];
      runEnded = clearedRun ? "win" : "lose";
      if (clearedRun) cleared = true;
      clearLive();
      meta.uses += 1;
      if (clearedRun) {
        meta.clears += 1;
        markDungeonCleared(floorsKey);
      }
      bankStars();
      persistMeta();
      persistSave(true);
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (typeof saved.showLog === "boolean") showLog = saved.showLog;
        if (typeof saved.autoEndTurn === "boolean") autoEndTurn = saved.autoEndTurn;
      } catch (error) {
        showLog = true;
        autoEndTurn = true;
      }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ showLog, autoEndTurn }));

    function persistSave(silent) {
      if (!loginWord) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      slot.save = battleSnapshot();
      account.login = loginWord;
      writeAccount(account);
