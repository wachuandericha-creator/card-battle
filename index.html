<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>わちゅえりカードゲーム</title>
  <style>
    :root {
      --hand-scale: 0.74;
      --card-ratio: 204 / 300;
      --bg: #12100e;
      --ink: #2a2118;
      --cream: #f4ead7;
      --gold: #e4b15a;
      --hp: #d85a4a;
      --hp-bg: #3a2422;
      --block: #7eb0e6;
      --attack: #e07a55;
      --guard: #6f9ed4;
      --muted: #b7a898;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 18%, #3a2c24 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #1c1612 0%, #12100e 70%);
    }
    button, body { -webkit-user-select: none; user-select: none; }
    .battle-screen {
      height: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(0, 8.333%);
      grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) auto minmax(0, 1fr);
      grid-template-areas:
        "gear hud log"
        "gear stage log"
        "gear play log"
        "gear energy log"
        "gear hand log";
      padding: 10px 0 14px;
      row-gap: 16px;
    }
    .battle-screen.no-log {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "gear hud"
        "gear stage"
        "gear play"
        "gear energy"
        "gear hand";
    }
    .game, .battle-bands { display: contents; }
    .hud-top { grid-area: hud; min-width: 0; overflow: hidden; }
    .stage { grid-area: stage; min-width: 0; overflow: hidden; }
    .play-row { grid-area: play; min-width: 0; overflow: hidden; }
    .energy-band { grid-area: energy; min-width: 0; overflow: hidden; }
    .handbar { grid-area: hand; min-width: 0; overflow: hidden; }
    .gear-rail { grid-area: gear; min-width: 0; overflow: hidden; }
    .battle-log { grid-area: log; min-width: 0; overflow: auto; }
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 0 18px 8px;
      border-bottom: 1px solid rgba(228, 177, 90, 0.35);
    }
    .dungeon { display: flex; align-items: baseline; gap: 16px; }
    .dungeon-name {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--cream);
    }
    .dungeon-progress {
      color: var(--gold);
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .status-stars {
      color: var(--gold);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .hud-actions { display: flex; gap: 8px; }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .turn { color: var(--gold); font-weight: 700; }
    .chip b { font-size: 20px; }
    .bar {
      height: 8px;
      width: 88px;
      border-radius: 99px;
      background: var(--hp-bg);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--hp); }
    .block-num { color: var(--block); }
    .energy-pips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
    }
    .pip.on { background: var(--gold); }
    .next-energy, .rules, .logline { color: var(--muted); font-size: 13px; }
    .rules { margin: 0; }
    .note { min-height: 1.1em; color: #f0c7a2; font-size: 13px; }
    .stage {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
      margin: 0;
      padding: 8px 10px;
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(10, 8, 7, 0.28) 0%, rgba(10, 8, 7, 0.18) 42%, rgba(10, 8, 7, 0.62) 100%),
        url("dungeon-bg.jpg") center 38% / cover no-repeat;
    }
    .enemy-field { position: relative; display: flex; align-items: stretch; gap: 12px; width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .hero-shoulder {
      position: absolute;
      left: 0;
      bottom: -10%;
      z-index: 3;
      width: min(54%, 420px);
      height: 132%;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
    }
    .hero-fig {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: left bottom;
      filter: drop-shadow(6px 10px 8px rgba(0, 0, 0, 0.5));
    }
    .enemy-main {
      position: absolute;
      right: 5%;
      top: 7%;
      left: auto;
      z-index: 1;
      width: 34%;
      max-width: 34%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      pointer-events: none;
    }
    .intent { flex: none; text-align: center; background: transparent; border: 0; padding: 0; }
    .intent .now { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; font-size: 32px; font-weight: 800; line-height: 1.2; }
    .act { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; line-height: 1; }
    .act .ico { display: block; }
    .act.big .ico { width: 36px; height: 36px; }
    .act.big b, .act.big.skill { font-size: 36px; }
    .act.small { gap: 4px; }
    .act.small .ico { width: 18px; height: 18px; }
    .act.small b, .act.small.skill { font-size: 16px; }
    .ico.sword { transform: rotate(28deg); transform-origin: 50% 50%; }
    .act.attack { color: var(--attack); }
    .act.block { color: var(--block); }
    .act.skill { color: var(--gold); }
    .skill-note, .trait-note {
      position: relative;
      z-index: 2;
      flex: 0 0 25%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      border: 2px solid rgba(228, 177, 90, 0.92);
      border-radius: 12px;
      background: rgba(20, 14, 12, 0.72);
      padding: 16px 14px;
      color: var(--cream);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.45;
    }
    .trait-note .trait-label { color: var(--gold); font-size: 13px; letter-spacing: 0.14em; }
    .card.preview {
      flex: none;
      width: 132px;
      height: auto;
      max-width: 100%;
      margin: 0;
      transform: none;
      cursor: default;
      aspect-ratio: var(--card-ratio);
    }
    .card.preview:hover { transform: none; }
    .card-fit {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      container-type: inline-size;
    }
    .reward-row { display: flex; gap: 12px; justify-content: center; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .reward-pick { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .reward-pick .card.preview { width: 132px; height: auto; }
    .reward-source { margin: 0; color: var(--gold); font-size: 13px; font-weight: 800; }
    .overlay .panel.wide { width: min(960px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow: auto; }
    .path-list { display: flex; flex-direction: column; gap: 10px; width: min(440px, 100%); }
    .path-list button { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .path-list button span { font-weight: 650; font-size: 13px; }
    .deck-view .panel {
      width: min(1080px, calc(100vw - 48px));
      max-height: calc(100vh - 56px);
      overflow: auto;
      align-items: stretch;
      text-align: left;
    }
    .deck-view .panel h2 { text-align: center; }
    .deck-group { width: 100%; margin: 0 0 18px; }
    .deck-group h3 {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 16px;
      letter-spacing: 0.12em;
      font-weight: 800;
    }
    .deck-cards { display: flex; flex-wrap: wrap; gap: 10px; }
    .deck-view .card.preview { width: 132px; height: auto; }
    .deck-empty { margin: 0; color: var(--muted); }
    .deck-view .panel > button { align-self: center; }
    .album-screen {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .album-screen .panel {
      width: min(1080px, calc(100vw - 48px));
      max-height: calc(100vh - 56px);
      overflow: auto;
      align-items: stretch;
      text-align: left;
      background: #2a221c;
      border: 1px solid rgba(244, 234, 215, 0.2);
      border-radius: 18px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
    }
    .album-screen h2 {
      margin: 0 0 14px;
      font-size: 28px;
      color: var(--cream);
      letter-spacing: 0.06em;
      text-align: center;
    }
    .album-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 0 14px;
    }
    .album-tabs button {
      border: 1px solid rgba(228, 177, 90, 0.55);
      background: transparent;
      color: var(--cream);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .album-tabs button.on {
      background: var(--gold);
      color: #2a2118;
      border-color: var(--gold);
    }
    .album-meta {
      margin: 0 0 16px;
      text-align: center;
      color: var(--muted);
    }
    .album-screen .card.preview { width: 132px; height: auto; }
    .album-screen .panel > button[data-action] {
      align-self: center;
      margin-top: 8px;
      border: 0;
      background: var(--gold);
      color: #2a2118;
      border-radius: 999px;
      padding: 10px 22px;
      font-weight: 800;
      cursor: pointer;
    }
    .sprite {
      flex: none;
      width: 132px;
      height: 98px;
      border-radius: 46% 46% 40% 40%;
      background:
        radial-gradient(circle at 30% 30%, #8d847c, transparent 40%),
        linear-gradient(160deg, #6e675f, #3c3834 60%, #2a2724);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), inset 0 -10px 16px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    .sprite .eye {
      position: absolute;
      top: 36px;
      width: 16px;
      height: 16px;
      background: #f4ead7;
      border-radius: 50%;
    }
    .sprite .eye::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: #1a120e;
      border-radius: 50%;
      top: 5px;
      left: 5px;
    }
    .sprite .eye.l { left: 34px; }
    .sprite .eye.r { right: 34px; }
    .sprite { overflow: hidden; }
    .sprite.slash { animation: shake 0.45s linear; overflow: visible; }
    .dmg-pop {
      position: absolute;
      left: 50%;
      top: 22%;
      z-index: 5;
      margin: 0;
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      color: #fff8ee;
      text-shadow: 0 3px 0 #6e1610, 0 0 12px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      animation: dmg-pop 1.05s ease-out forwards;
    }
    .dmg-pop.me {
      position: fixed;
      top: 36%;
      z-index: 26;
      font-size: calc(124px + var(--pow, 0.35) * 96px);
      animation-name: dmg-pop-me;
      animation-duration: 1.85s;
    }
    .sprite .cut {
      position: absolute;
      left: 50%;
      top: 46%;
      width: calc(250px + var(--pow, 0.35) * 180px);
      height: calc(16px + var(--pow, 0.35) * 20px);
      background: linear-gradient(#fff 0%, #fff8f2 58%, #d4261a 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
      clip-path: polygon(0 50%, 7% 0, 93% 0, 100% 50%, 93% 100%, 7% 100%);
      filter: drop-shadow(0 0 calc(6px + var(--pow, 0.35) * 12px) rgba(255, 250, 242, 0.9));
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }
    .sprite.slash .cut { animation: slash calc(0.7s + var(--pow, 0.35) * 0.18s) cubic-bezier(0.16, 0.7, 0.28, 1) forwards; }
    .battle-screen.hurt,
    .battle-screen.block { animation: screen-shake 0.55s linear; }
    .screen-hurt,
    .screen-block,
    .screen-guard,
    .screen-heal {
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      animation: hurt-fade 1.15s ease-out forwards;
    }
    .screen-hurt { background: rgba(150, 18, 12, 0.46); }
    .screen-guard {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 44%, rgba(186, 220, 255, 0.34), transparent 34%);
    }
    .screen-guard .mark {
      width: min(28vw, 240px);
      height: auto;
      filter: drop-shadow(0 16px 18px rgba(12, 36, 72, 0.62));
      animation: guard-mark 1.15s cubic-bezier(0.16, 0.8, 0.24, 1) forwards;
    }
    .screen-block.break { background: transparent; z-index: 26; }
    .screen-block.break .half {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(46vw, 440px);
    }
    .screen-block.break .iron {
      position: static;
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 18px 22px rgba(8, 16, 32, 0.6));
      animation: none;
    }
    .screen-block.break .half.left {
      clip-path: polygon(0 0, 54% 0, 46% 38%, 60% 62%, 40% 100%, 0 100%);
      animation: shard-left 1.25s cubic-bezier(0.16, 0.8, 0.24, 1) forwards;
    }
    .screen-block.break .half.right {
      clip-path: polygon(54% 0, 100% 0, 100% 100%, 40% 100%, 60% 62%, 46% 38%);
      animation: shard-right 1.25s cubic-bezier(0.16, 0.8, 0.24, 1) forwards;
    }
    .screen-block.break .crack {
      position: absolute;
      left: 50%;
      top: 24%;
      width: 10px;
      height: 48vh;
      background: linear-gradient(#fff, #ffd0c8 40%, #d4261a);
      transform: translateX(-50%) rotate(7deg);
      animation: crack-flash 1.25s ease-out forwards;
    }
    .dmg-pop.me { z-index: 27; }
    .screen-heal {
      background:
        radial-gradient(circle at 50% 42%, rgba(214, 255, 226, 0.38), transparent 46%),
        rgba(22, 148, 78, 0.48);
    }
    .enemy { text-align: center; }
    .enemy.vitals { align-self: center; width: 82%; padding: 0; }
    .enemy.vitals[data-rank="雑魚"] { width: 62%; }
    .enemy.vitals[data-rank="普通"] { width: 82%; }
    .enemy.vitals[data-rank="強敵"] { width: 100%; }
    .enemy h2 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0.14em;
      color: var(--cream);
      font-weight: 800;
    }
    .bar.wide { width: 180px; height: 10px; }
    .banner { min-height: 0; text-align: center; color: var(--gold); font-size: 18px; }
    .logline { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .play-row {
      min-height: 0;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 36px;
      padding: 0 8px;
    }
    .play-side { display: grid; grid-template-rows: auto minmax(0, 1fr); align-items: end; justify-items: center; gap: 4px; min-width: 0; min-height: 0; height: 100%; }
    .play-side.mine { justify-items: end; }
    .play-label {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }
    .play-cards { display: flex; align-items: flex-end; justify-content: center; gap: 10px; min-height: 0; height: 100%; }
    .play-card { height: 100%; display: flex; align-items: flex-end; }
    .play-row .card.preview {
      width: auto;
      height: 100%;
      max-width: none;
      max-height: 100%;
      pointer-events: none;
    }
    .play-card.on .card.preview { transform: translateY(-12px); box-shadow: 0 0 0 2px var(--gold), 0 12px 20px rgba(0, 0, 0, 0.35); }
    .party {
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 2px solid rgba(228, 177, 90, 0.92);
    }
    .party-band {
      display: flex;
      align-items: stretch;
      gap: 12px;
      width: 100%;
    }
    .party-stats {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .party-attrs {
      flex: 0 0 auto;
      align-self: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: max-content;
      padding: 10px 14px;
      border: 1px solid rgba(228, 177, 90, 0.55);
      border-radius: 14px;
      background: rgba(20, 14, 12, 0.5);
    }
    .attr {
      display: grid;
      grid-template-columns: 30px 3.4em auto;
      align-items: center;
      column-gap: 8px;
      text-align: left;
    }
    .attr .mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
    }
    .attr .mark .ico { width: 24px; height: 24px; }
    .attr.hp .mark { color: var(--hp); }
    .attr.atk .mark { color: var(--attack); }
    .attr.def .mark { color: var(--block); }
    .attr.spd .mark { color: var(--gold); }
    .attr.nrg .mark { color: var(--gold); }
    .attr span {
      color: var(--gold);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .attr b {
      color: #fff8ee;
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }
    .vitals { position: relative; text-align: center; }
    .meters { width: 240px; margin: 0 auto; }
    .meter {
      height: 14px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--hp-bg);
    }
    .meter > span { display: block; height: 100%; }
    .meter.hp > span { background: var(--hp); }
    .meter.shield { background: transparent; }
    .meter.shield > span { width: 100%; background: var(--block); }
    .vitals .meters { width: 100%; }
    .vitals .meter.hp {
      height: 44px;
      border-radius: 10px;
      background: #2a1814;
      box-shadow: inset 0 0 0 1px rgba(255, 236, 210, 0.16);
    }
    .shield-row { position: relative; height: 44px; margin-bottom: 6px; }
    .vitals .shield-row .meter.shield { height: 100%; margin: 0; border-radius: 10px; }
    .shield-line {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff8ee;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
    .shield-line b { font-size: 28px; letter-spacing: 0.02em; }
    .vitals .hp-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 44px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff8ee;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
    .vitals .hp-line b { font-size: 28px; letter-spacing: 0.02em; }
    .poison-mark { color: #b6e37a; letter-spacing: 0.14em; }
    .energy-pips { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .pip {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #6e5a42;
      background: #241c16;
    }
    .pip.on {
      background: radial-gradient(circle at 35% 32%, #fff1c2, #f2c14e 46%, #c48a1e);
      border-color: #ffe7a3;
      box-shadow: 0 0 16px rgba(242, 193, 78, 0.55);
    }
    .energy-band { display: flex; align-items: center; justify-content: center; min-height: 0; border-top: 2px solid rgba(228, 177, 90, 0.85); padding-top: 8px; }
    .handbar { width: 100%; min-width: 0; min-height: 0; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 10px; overflow-x: auto; overflow-y: hidden; }
    .pile { width: auto; height: 100%; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
    .pile-card {
      position: relative;
      width: auto;
      height: calc(100% - 28px);
      aspect-ratio: var(--card-ratio);
      border-radius: 14px;
    }
    .pile-card.back {

    function sourcePattern() {
      return (enemyNow().pattern || []).map((card) => ({ ...card }));

    function deckKey(cards) {
      return (cards || []).map((card) => card.name).sort().join("|");

    function startEnemyLoop(first) {
      enemyLoop = shuffle(sourcePattern());
      intentIndex = first && enemyLoop.length ? Math.floor(Math.random() * enemyLoop.length) : 0;
    }

    function advanceEnemyLoop() {
      intentIndex += 1;
      if (enemyLoop.length && intentIndex >= enemyLoop.length) startEnemyLoop(false);
    }

    function restoreEnemyLoop(data) {
      const saved = Array.isArray(data.enemyLoop) ? data.enemyLoop : [];
      if (saved.length && deckKey(saved) === deckKey(sourcePattern())) {
        enemyLoop = saved.map((card) => ({ ...card }));
        intentIndex = Number.isInteger(data.intentIndex) ? data.intentIndex : 0;
        if (intentIndex < 0 || intentIndex >= enemyLoop.length) startEnemyLoop(false);
        return;
      }
      startEnemyLoop(true);
    }

    function intentAt(offset) {
      if (!enemyLoop.length) startEnemyLoop(false);
      const at = intentIndex + (offset || 0);
      if (at >= 0 && at < enemyLoop.length) return enemyLoop[at];
      return enemyLoop[Math.min(intentIndex, enemyLoop.length - 1)];
    }

    function applyDamage(target, amount) {
      const blocked = Math.min(target.block, amount);
      target.block -= blocked;
      const hpLoss = amount - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      target.hit = true;
      return { blocked, hpLoss };
    }

    function shownEnemy() {
      return shown.enemy == null ? enemy.hp : shown.enemy;

    function shownPlayer() {
      return shown.player == null ? player.hp : shown.player;

    function bindShown() {
      if (player) shown.player = player.hp;

    function drainMs() {
      const enemyGap = enemy ? Math.abs(enemy.hp - shownEnemy()) : 0;
      const playerGap = player ? Math.abs(player.hp - shownPlayer()) : 0;
      const enemyWait = enemyGap < 0.2 ? 0 : Math.min(1700, Math.max(620, (enemyGap / 6.5) * 1000));
      const playerWait = playerGap < 0.2 ? 0 : Math.min(2400, Math.max(900, (playerGap / 4) * 1000));
      return Math.max(enemyWait, playerWait);
    }

    function paintShown() {
      for (const who of ["enemy", "player"]) {
        const hp = who === "enemy" ? shown.enemy : shown.player;
        const max = who === "enemy" ? enemy && enemy.maxHp : player && player.maxHp;
        if (hp == null || !max) continue;
        const bar = root.querySelector(`[data-bar="${who}"]`);
        if (bar) bar.style.width = `${Math.max(0, Math.min(100, (hp / max) * 100))}%`;
        const text = String(Math.max(0, Math.round(hp)));
        root.querySelectorAll(`[data-hp="${who}"]`).forEach((el) => { el.textContent = text; });
      }
    }

    function pumpHp(stamp) {
      const dt = hpStamp ? Math.min(0.05, (stamp - hpStamp) / 1000) : 0.016;
      hpStamp = stamp;
      const ease = (current, target, quick) => {
        const diff = target - current;
        if (Math.abs(diff) < 0.04) return target;
        const speed = quick ? Math.max(6.5, Math.abs(diff) / 1.5) : Math.max(4, Math.abs(diff) / 2.4);
        return current + Math.sign(diff) * Math.min(Math.abs(diff), speed * dt);
      };
      let moving = false;
      if (enemy && shown.enemy != null && Math.abs(shown.enemy - enemy.hp) >= 0.04) {
        shown.enemy = ease(shown.enemy, enemy.hp, true);
        moving = true;
      } else if (enemy) shown.enemy = enemy.hp;
      if (player && shown.player != null && Math.abs(shown.player - player.hp) >= 0.04) {
        shown.player = ease(shown.player, player.hp, false);
        moving = true;
      } else if (player) shown.player = player.hp;
      paintShown();
      hpFrame = moving ? requestAnimationFrame(pumpHp) : 0;
    }

    function kickHp() {
      if (player && shown.player == null) shown.player = player.hp;
      if (enemy && shown.enemy == null) shown.enemy = enemy.hp;

      if (hpFrame) cancelAnimationFrame(hpFrame);
      hpFrame = requestAnimationFrame(pumpHp);

    function damageSentence(actor, card, raw, result) {
      const head = `${actor}は${card}で${raw}ダメージ。`;
      if (result.blocked && result.hpLoss) {
        return `${head}ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${head}ブロックで防いだ。`;
      return head;
    }

    function mitigate(amount, defense) {
      const reduced = Math.min(Math.max(0, defense || 0), Math.max(0, amount));
      return { reduced, dealt: amount - reduced };
    }

    function hurtSentence(actor, card, raw, reduced, result) {
      const head = `${actor}は${card}で${raw}ダメージ。`;
      if (!reduced) return damageSentence(actor, card, raw, result);
      if (!result.hpLoss && !result.blocked) return `${head}防御で防いだ。`;
      if (result.blocked && result.hpLoss) {
        return `${head}防御で${reduced}軽減し、ブロックで${result.blocked}防ぎ、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${head}防御で${reduced}軽減し、残りはブロックで防いだ。`;
      return `${head}防御で${reduced}軽減し、体力${result.hpLoss}。`;
    }

    function strikeSentence(actor, card, base, focusAdd, atk, result) {
      const boosted = base + (focusAdd || 0);
      const total = boosted + (atk || 0);
      let head = `${actor}は${card}で${base}ダメージ。`;
      if (focusAdd) head += `集中で${focusAdd}加算し、${boosted}。`;
      if (!atk) {
        if (result.blocked && result.hpLoss) return `${head}ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
        if (result.blocked) return `${head}ブロックで防いだ。`;
        return focusAdd ? head : damageSentence(actor, card, base, result);
      }
      if (result.blocked && result.hpLoss) {
        return `${head}攻撃で${atk}加算し、ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${head}攻撃で${atk}加算し、ブロックで防いだ。`;
      return `${head}攻撃で${atk}加算し、${total}。`;
    }

    function hitPower(n) {
      const value = Math.max(1, Number(n) || 1);
      return Math.max(0, Math.min(1, (value - 1) / 14)).toFixed(2);
    }

    function noteHit(side, landed, swung) {
      const n = landed > 0 ? landed : swung;
      if (n > 0) fxHit = { side, n };

    function poisonSentence(name, raw, reduced, result) {
      let line = `${name}は毒で${raw}ダメージ。`;
      if (reduced) line += `防御で${reduced}軽減し、`;
      if (!result.hpLoss && !result.blocked) return `${line}防いだ。`;
      if (result.blocked && result.hpLoss) return `${line}ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      if (result.blocked) return `${line}残りはブロックで防いだ。`;
      return reduced ? `${line}体力${result.hpLoss}。` : line;
    }

    function tickPoison(who) {
      const target = who === "player" ? player : enemy;
      if (!target || !target.poison || POISON_DAMAGE <= 0) return false;
      const name = who === "player" ? CHARACTER_NAME : enemy.name;
      if (who === "player" && player.parry) {
        player.parry = false;
        log(`${name}は毒で${POISON_DAMAGE}ダメージ。パリィで無効。`);
        return false;
      }
      const defense = who === "player" ? player.def : 0;
      const cut = mitigate(POISON_DAMAGE, defense);
      const result = applyDamage(target, cut.dealt);
      if (who === "player") {
        if (result.hpLoss > 0) {
          fxHurt = true;
          noteHit("player", result.hpLoss, cut.dealt);
        }
        if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      } else if (result.hpLoss || result.blocked) {
        fxSlash = true;
        noteHit("enemy", result.hpLoss, POISON_DAMAGE);
      }
      log(poisonSentence(name, POISON_DAMAGE, cut.reduced, result));
      return target.hp <= 0;
    }

    function takeEnemyHit(raw, label) {
      if (player.parry) {
        player.parry = false;
        noteHit("player", 0, raw);
        log(`${enemy.name}は${label || "攻撃"}で${raw}ダメージ。パリィで無効。`);
        return;
      }
      const cut = mitigate(raw, player.def);
      const result = applyDamage(player, cut.dealt);
      if (result.hpLoss > 0) {
        fxHurt = true;
        noteHit("player", result.hpLoss, cut.dealt);
      }
      if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      log(hurtSentence(enemy.name, label || "攻撃", raw, cut.reduced, result));
    }

    function restoreHp(amount) {
      const room = Math.max(0, player.maxHp - player.hp);
      const gain = Math.max(0, Math.min(Math.floor(Number(amount) || 0), room));
      if (!gain) return 0;
      player.hp += gain;
      fxHeal = true;
      return gain;
    }

    function buildDeck() {
      const specs = [];
      for (const [name, count] of CARD_POOL) {
        for (let i = 0; i < count; i++) {
          specs.push({ uid: uid++, name, ...CARDS[name] });
        }
      }
      for (const extra of stolen) specs.push({ uid: uid++, ...extra });
      deck = shuffle(specs);
      openingDeck = deck.map((card) => ({ ...card }));
      hand = [];
      discard = [];
      inPlay = [];
      resolveAt = 0;
    }

    function draw(n) {
      for (let i = 0; i < n; i++) {
        if (!deck.length) {
          if (!discard.length) break;
          deck = shuffle(discard);
          discard = [];
          log(`${CHARACTER_NAME}は捨て札を山札に戻した。`);
        }
        hand.push(deck.pop());
      }
    }

    function pullKind(kind) {
      const take = () => {
        for (let i = deck.length - 1; i >= 0; i--) {
          if (cardKind(deck[i]) === kind) return deck.splice(i, 1)[0];
        }
        return null;
      };
      let card = take();
      if (!card && !deck.length && discard.length) {
        deck = shuffle(discard);
        discard = [];
        log(`${CHARACTER_NAME}は捨て札を山札に戻した。`);
        card = take();
      }
      if (!card) return null;
      hand.push(card);
      return card;
    }

    function pullFromBracelets() {
      const right = gear.braceletR;
      const left = gear.braceletL;
      if (right && right.id === "chain-attack" && !hand.some((card) => cardKind(card) === "attack")) {
        const card = pullKind("attack");
        log(card ? `${CHARACTER_NAME}は${right.name}で${card.name}を引いた。` : `${CHARACTER_NAME}は${right.name}。山札に攻撃カードがない。`);
      }
      if (left && left.id === "chain-guard" && !hand.some((card) => cardKind(card) === "block")) {
        const card = pullKind("block");
        log(card ? `${CHARACTER_NAME}は${left.name}で${card.name}を引いた。` : `${CHARACTER_NAME}は${left.name}。山札に防御カードがない。`);
      }
    }

    function resolveCard(card) {
      if (card.focus) {
        player.focus = (player.focus || 0) + card.focus;
        log(`${CHARACTER_NAME}は${card.name}。次の攻撃カードか防御カードの数値を+${player.focus}。`);
        return;
      }
      if (card.parry) {
        if (player.parry) log(`${CHARACTER_NAME}は${card.name}。パリィは重複しない。`);
        else {
          player.parry = true;
          log(`${CHARACTER_NAME}は${card.name}。次のダメージを無効。ターンが終わると消える。`);
        }
        return;
      }
      if (card.press) {
        const amount = player.block || 0;
        if (!amount) {
          log(`${CHARACTER_NAME}は${card.name}。ブロックが無く、0ダメージ。`);
          return;
        }
        const result = applyDamage(enemy, amount);
        if (result.hpLoss || result.blocked) {
          fxSlash = true;
          noteHit("enemy", result.hpLoss, amount);
        }
        log(damageSentence(CHARACTER_NAME, card.name, amount, result));
        return;
      }
      if (card.poison) {
        enemy.poison = true;
        log(`${CHARACTER_NAME}は${card.name}。${enemy.name}は毒状態。`);
        return;
      }
      const added = player.focus && (card.damage || card.block) ? player.focus : 0;
      if (added) player.focus = 0;
      if (card.damage) {
        const atk = player.atk || 0;
        const amount = card.damage + added + atk;
        const result = applyDamage(enemy, amount);
        if (amount > 0 && (result.hpLoss || result.blocked)) {
          fxSlash = true;
          noteHit("enemy", result.hpLoss, amount);
        }
        log(strikeSentence(CHARACTER_NAME, card.name, card.damage, added, atk, result));
      }
      if (card.block) {
        const gain = card.block + added;
        player.block += gain;
        const boost = added ? `集中で${added}加算し、${gain}。` : "";
        log(`${CHARACTER_NAME}は${card.name}でブロック${card.block}。${boost}いま${player.block}。`);
      }
      if (!card.damage && !card.block) log(`${CHARACTER_NAME}は${card.name}。${card.text}`);
    }

    function playCard(index) {
      if (phase !== "player" || outcome) return;
      const card = hand[index];
      if (!card) return;
      if (player.energy < card.cost) {
        note = "マナが足りない";
        render();
        return;
      }
      player.energy -= card.cost;
      hand.splice(index, 1);
      inPlay.push(card);
      note = "";
      pullFromBracelets();
      if (!hand.length) {
        endTurn();
        return;
      }
      if (autoEndTurn && player.energy <= 0 && !hand.some((card) => card.cost === 0)) {
        endTurn();
        return;
      }
      render();
    }

    function scrapPlay() {
      while (inPlay.length) discard.push(inPlay.shift());
      resolveAt = 0;
    }

    function finishResolve() {
      timer = null;
      scrapPlay();
      banner = "";
      startPlayerTurn();
    }

    function stepResolve() {
      timer = null;
      const enemyIndex = inPlay.length;
      if (phase !== "resolve" || resolveAt > enemyIndex) {
        finishResolve();
        return;
      }
      const index = resolveAt;
      resolveAt += 1;
      if (index < enemyIndex) {
        resolveCard(inPlay[index]);
        if (enemy.hp <= 0) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
      } else {
        logTurn("enemy");
        const card = intentAt(0);
        if (tickPoison("enemy")) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
        if (!card.press) enemy.block = 0;
        if (card.press) {
          const amount = enemy.block || 0;
          if (amount > 0) takeEnemyHit(amount, card.name);
          else log(`${enemy.name}は${card.name}。ブロックが無く、0ダメージ。`);
        } else if (card.damage) {
          takeEnemyHit(card.damage, card.name);
        } else if (card.block) {
          enemy.block += card.block;
          log(`${enemy.name}は${card.name}でブロック${card.block}。`);
        } else if (card.poison) {
          player.poison = true;
          log(`${enemy.name}は${card.name}。${CHARACTER_NAME}は毒状態。`);
        } else {
          log(`${enemy.name}は${card.name}。${card.text}`);
        }
        advanceEnemyLoop();
        if (player.hp <= 0) {
          scrapPlay();
          scheduleFinish("lose");
          return;
        }
      }
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      render();
      const wait = Math.max(720, drainMs(), playerNumber ? 1850 : 0, guardKind ? 1300 : 0);
      timer = setTimeout(resolveAt > enemyIndex ? finishResolve : stepResolve, wait);
    }

    function endTurn() {
      if (phase !== "player" || outcome) return;
      phase = "resolve";
      resolveAt = 0;
      while (hand.length) discard.push(hand.pop());
      note = "";
      turnCall = "enemy";
      render();
      timer = setTimeout(stepResolve, 1100);
    }

    function startPlayerTurn() {
      if (player.hp <= 0) {
        finish("lose");
        return;
      }
      logTurn("player");
      turn += 1;
      player.block = 0;
      if (player.parry) {
        player.parry = false;
        log(`${CHARACTER_NAME}のパリィが消えた。`);
      }
      if (tickPoison("player")) {
        finish("lose");
        return;
      }
      player.maxEnergy = MANA;
      player.energy = MANA;
      draw(3);
      pullFromBracelets();
      fxDeal = true;
      turnCall = "player";
      phase = "player";
      render();
    }

    function finish(kind) {
      clearTimer();
      outcome = kind;
      phase = "end";
      banner = "";
      log(kind === "win" ? `${CHARACTER_NAME}は${enemy.name}を倒した。` : `${CHARACTER_NAME}は倒された。`);
      if (kind === "lose") {
        endRun(false);
        screen = "defeat";
        render();
        return;
      }
      if (kind === "win") {
        prepareReward();
        persistSave(true);
      }
      render();
    }

    function scheduleFinish(kind) {
      phase = "end";
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const wait = Math.max(720, drainMs(), playerNumber ? 1850 : 0, guardKind ? 1300 : 0);
      clearTimer();
      render();
      timer = setTimeout(() => finish(kind), wait);
    }

    function loadMeta() {
      try {
        const saved = JSON.parse(localStorage.getItem(META_KEY) || "{}");
        meta = {
          uses: Number(saved.uses) || 0,
          clears: Number(saved.clears) || 0,
          stars: Number(saved.stars) || 0,
        };
      } catch (error) {
        meta = { uses: 0, clears: 0, stars: 0 };
      }
    }

    function endRun(clearedRun) {
      gear = emptyGear();
      gearOpen = null;
      stolen = [];
      localStorage.removeItem(SAVE_KEY);
      clearLive();
      meta.uses += 1;
      if (clearedRun) meta.clears += 1;
      localStorage.setItem(META_KEY, JSON.stringify(meta));
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (typeof saved.showLog === "boolean") showLog = saved.showLog;
        if (typeof saved.autoEndTurn === "boolean") autoEndTurn = saved.autoEndTurn;
      } catch (error) {
        showLog = true;
        autoEndTurn = true;
      }
    }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ showLog, autoEndTurn }));
    }

    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function battleSnapshot() {
      return {
        v: 1,
        cleared,
        battleIndex,
        turn,
        intentIndex,
        enemyLoop,
        phase,
        note,
        banner,
        outcome,
        logLines,
        deck,
        hand,
        discard,
        inPlay,
        openingDeck,
        resolveAt,
        player,
        enemy,
        gear,
        stolen,
        battleTotal,
        route,
        retreatUsed,
        rewardReady,
        rewardStars,
        rewardPicks,
        rewardPaths,
        rewardStep,
        bonusCard,
      };
    }

    function persistSave(silent) {
      localStorage.setItem(SAVE_KEY, JSON.stringify(battleSnapshot()));
      if (!silent) {
        saveNote = "セーブした";
        render();
      }
    }

    function readLive() {
      try {
        return JSON.parse(localStorage.getItem(LIVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function persistLive() {
      if (!player || !enemy) return;
      localStorage.setItem(LIVE_KEY, JSON.stringify(battleSnapshot()));
    }

    function clearLive() {
      localStorage.removeItem(LIVE_KEY);
    }

    function applySave(data) {
      cleared = !!data.cleared;
      battleIndex = data.battleIndex || 0;
      turn = data.turn || 0;
      intentIndex = data.intentIndex || 0;
      phase = data.phase || "player";
      note = data.note || "";
      banner = data.banner || "";
      outcome = data.outcome || null;
      logLines = data.logLines || [];
      deck = data.deck || [];
      hand = data.hand || [];
      discard = data.discard || [];
      inPlay = Array.isArray(data.inPlay) ? data.inPlay : [];
      openingDeck = (Array.isArray(data.openingDeck) && data.openingDeck.length
        ? data.openingDeck
        : deck.concat(hand, inPlay, discard)
      ).map((card) => ({ ...card }));
      resolveAt = data.resolveAt || 0;
      player = data.player;
      enemy = data.enemy;
      if (player) {
        player.hit = false;
        player.atk = player.atk || 0;
        player.def = player.def || 0;
        player.maxHp = 30;
        if (player.hp > player.maxHp) player.hp = player.maxHp;
        player.maxEnergy = MANA;
        if (player.energy > MANA) player.energy = MANA;
        player.focus = player.focus || 0;
        player.parry = !!player.parry;
        player.poison = !!player.poison;
      }
      if (enemy) {
        enemy.hit = false;
        enemy.poison = !!enemy.poison;
        if (enemy.name === "仮の相手") enemy.name = "スライム";
      }
      gear = normalizeGear(data.gear);
      if (!gear.sword && !gear.shield) gear = starterGear();
      syncGearStats();
      gearOpen = null;
      stolen = Array.isArray(data.stolen) ? data.stolen : [];
      if (Array.isArray(data.route) && data.route.length) {
        route = data.route.map((name) => (name === "仮の相手" ? "スライム" : name));
      } else {
        route = CLASSIC_ROUTE.slice();
        const total = data.battleTotal || route.length;
        while (route.length < total) {
          const bossAt = route.indexOf(DUNGEON.boss);
          const tier = DUNGEON.road[DUNGEON.road.length - 1];
          if (bossAt >= 0) route.splice(bossAt, 0, rollRank(tier));
          else route.push(rollRank(tier));
        }
      }
      battleTotal = route.length;
      restoreEnemyLoop(data);
      retreatUsed = !!data.retreatUsed;
      rewardReady = !!data.rewardReady;
      rewardStars = data.rewardStars || 0;
      rewardPicks = Array.isArray(data.rewardPicks) ? data.rewardPicks : [];
      rewardPaths = Array.isArray(data.rewardPaths) ? data.rewardPaths : [];
      rewardStep = data.rewardStep || "cards";
      bonusCard = data.bonusCard || null;
      if (outcome === "win" && !rewardReady) prepareReward();
      saveNote = "";
      bindShown();
    }

    function startBattle(keepHp) {
      clearTimer();
      clearReward();
      screen = "battle";
      cleared = false;
      const hp = keepHp == null ? 30 : Math.min(30, keepHp);
      player = { hp, maxHp: 30, block: 0, energy: 0, maxEnergy: 0, atk: 0, def: 0, focus: 0, parry: false, poison: false, hit: false };
      syncGearStats();
      const foe = enemyNow();
      enemy = { name: foe.name, hp: foe.hp, maxHp: foe.hp, block: 0, poison: false, hit: false };
      bindShown();
      turn = 0;
      startEnemyLoop(true);
      phase = "player";
      note = "";
      banner = "";
      outcome = null;
      askLeave = false;
      logLines = [];
      saveNote = "";
      buildDeck();
      startPlayerTurn();
    }

    function beginRun() {
      battleIndex = 0;
      route = freshRoute();
      battleTotal = route.length;
      retreatUsed = false;
      cleared = false;
      gear = starterGear();
      gearOpen = null;
      stolen = [];
      startBattle(30);
    }

    function continueGame() {
      const data = readSave();
      if (!data) return;
      clearTimer();
      applySave(data);
      screen = data.outcome === "win" ? "battle" : data.cleared ? "clear" : "battle";
      render();
    }

    function goTitle() {
      clearTimer();
      askLeave = false;
      clearLive();
      screen = "title";
      saveNote = "";
      render();
    }

    function resumeLive() {
      const data = readLive();
      if (!data || !data.player || !data.enemy) return false;
      clearTimer();
      applySave(data);
      askLeave = false;
      screen = data.outcome === "win" ? "battle" : data.cleared ? "clear" : "battle";
      if (screen === "battle" && !outcome && enemy && enemy.hp <= 0) {
        finish("win");
        return true;
      }
      if (screen === "battle" && !outcome && player && player.hp <= 0) {
        finish("lose");
        return true;
      }
      if (screen === "battle" && phase === "resolve" && !outcome) {
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "enemy" && !outcome) {
        phase = "resolve";
        resolveAt = inPlay.length;
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "recoil" && !outcome) {
        render();
        timer = setTimeout(startPlayerTurn, 650);
      } else {
        render();
      }
      return true;
    }

    function meters(who, hp, maxHp, block) {
      const hpPct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
      const blockPct = Math.max(0, Math.min(100, (block / maxHp) * 100));
      const shield = block > 0 ? `<div class="shield-row"><div class="meter shield" style="width:${blockPct}%"><span></span></div><div class="shield-line">シールド <b>${block}</b></div></div>` : "";
      return `<div class="meters">${shield}<div class="meter hp"><span data-bar="${who}" style="width:${hpPct}%"></span></div></div>`;
    }

    function pips() {
      return Array.from({ length: player.maxEnergy }, (_, i) =>
        `<i class="pip${i < player.energy ? " on" : ""}"></i>`
      ).join("");
    }

    function menuButton(label, action, primary, disabled) {
      return `<button type="button" class="${primary ? "primary" : ""}" data-action="${action}" ${disabled ? "disabled" : ""}>${esc(label)}</button>`;
    }

            ${menuButton("攻略する", "new", true)}
            ${menuButton("つづきから(あいことば)", "continue", false, !readSave())}
            ${menuButton("アルバム", "album")}
            ${menuButton("オプション", "settings")}
          </div>
        </div>`;
    }

        <div class="menu">
          <h1>オプション</h1>
          ${menuButton(showLog ? "ログの表示：オン" : "ログの表示：オフ", "toggle-log", true)}
          ${menuButton(autoEndTurn ? "使い切ったらターン終了：オン" : "使い切ったらターン終了：オフ", "toggle-auto-end", true)}
          <p>マナが0になったら、ターンを終える。手札にコスト0があるときは終わらない。</p>
          ${menuButton("もどる", "back")}

    function render() {
      if (screen === "title") return renderTitle();
      if (screen === "character") return renderCharacter();
      if (screen === "dungeon") return renderDungeon();
      if (screen === "album") return renderAlbum();
      if (screen === "defeat") return renderDefeat();
      if (screen === "settings") return renderSettings();
      if (screen === "confirm") return renderConfirm();
      if (screen === "clear") return renderClear();
      renderBattle();
    }

    function pileMarkup(kind, count) {
      const label = kind === "deck" ? "山札" : "捨て札";
      const empty = count === 0;
      const stack = count > 1 ? " stack" : "";
      const look = empty ? "empty" : kind === "deck" ? "back" : "back discard";
      return `<div class="pile" aria-label="${label} ${count}"><div class="pile-card ${look}${stack}"><span class="pile-count">${count}</span></div><div class="pile-label">${label}</div></div>`;
    }

    function cardKind(card) {
      if (card.parry) return "block";
      if (card.focus) return "skill";
      if (card.press) return "attack";
      if (card.poison) return "skill";
      if (card.damage && !card.block) return "attack";
      if (card.block && !card.damage) return "block";
      return "skill";
    }

    function cardFace(card) {
      const effects = [
        card.damage ? `<span class="fx attack">${swordIcon()}<b>${card.damage}</b></span>` : "",
        card.block ? `<span class="fx block">${shieldIcon()}<b>${card.block}</b></span>` : "",
      ].join("") || `<span class="fx note">${esc(card.text).replaceAll("\n", "<br>")}</span>`;
      return `<div class="card-fit"><div class="nameplate"><span class="cost">${card.cost}</span><div class="name">${esc(card.name)}</div></div><div class="art" aria-hidden="true"></div><div class="text">${effects}</div></div>`;
    }

    function playFace(card, on) {
      return `<div class="play-card${on ? " on" : ""}"><div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div></div>`;
    }

    function playRow() {
      const foe = intentAt(0);
      const hot = phase === "resolve" ? resolveAt - 1 : -1;
      const mine = inPlay.map((card, i) => playFace(card, hot === i)).join("");
      return `<div class="play-row" aria-label="プレイエリア"><div class="play-side mine"><span class="play-label">自分</span><div class="play-cards">${mine}</div></div><div class="play-side foe"><span class="play-label">敵</span><div class="play-cards">${playFace(foe, hot === inPlay.length)}</div></div></div>`;
    }

    function heroShoulder() {
      return `<div class="hero-shoulder"><img class="hero-fig" src="hero-shoulder.png?v=2" alt="戦士"></div>`;
    }
    function traitNote() {
      const trait = enemyNow().trait;
      if (!trait) return "";
      return `<aside class="trait-note"><span class="trait-label">特性</span><span>${esc(trait)}</span></aside>`;
    }

    function sortedCards(cards) {
      return cards.slice().sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name, "ja"));
    }

    function deckGroup(label, cards) {
      const faces = sortedCards(cards).map((card) =>
        `<div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div>`
      ).join("");
      return `<section class="deck-group"><h3>${label} ${cards.length}</h3><div class="deck-cards">${faces || `<p class="deck-empty">なし</p>`}</div></section>`;
    }

    function deckOverlay() {
      if (!showDeck || outcome || askLeave) return "";
      const cards = openingDeck.length ? openingDeck : deck.concat(hand, inPlay, discard);
      return `<div class="overlay deck-view"><div class="panel"><h2>戦闘開始前のデッキ</h2>${deckGroup("開始前", cards)}<button type="button" data-action="close-deck">閉じる</button></div></div>`;
    }

    const PATHS = {
      straight: { name: "まっすぐ進む", text: "予定通り。効果なし。" },
      skip: { name: "抜け道", text: "次の戦闘をスキップ。" },
      detour: { name: "回り道", text: "カードと装備の報酬。戦闘が1回増える。" },
      shop: { name: "お店", text: "★で買い物。品ぞろえはこれから。" },
      retreat: { name: "引き返す", text: "いまの敵と再戦。この先は、もう引き返せない。" },
      camp: { name: "キャンプ", text: "体力が全快する。あとはまっすぐ進むと同じ。" },
    };

    function starsForRank(rank) {
      if (rank === "強敵") return 3;
      if (rank === "普通") return 2;
      return 1;
    }

    function keepCard(card) {
      const next = { name: card.name, cost: card.cost, text: card.text, damage: card.damage, block: card.block };
      if (card.focus) next.focus = card.focus;
      if (card.parry) next.parry = true;
      if (card.poison) next.poison = true;
      if (card.press) next.press = true;
      return next;
    }

    function rewardPool() {
      const list = Object.keys(COMMON).map((name) => ({ ...keepCard({ name, ...COMMON[name] }), source: "共通" }));
      const seen = new Set();
      for (const card of enemyNow().pattern) {
        if (seen.has(card.name)) continue;
        seen.add(card.name);
        list.push({ ...keepCard(card), source: "敵" });
      }
      return list;
    }

    function drawDistinct(n) {
      return shuffle(rewardPool()).slice(0, n);
    }

    function clearReward() {
      rewardReady = false;
      rewardStars = 0;
      rewardPicks = [];
      rewardPaths = [];
      rewardStep = "cards";
      bonusCard = null;
    }

    function rollPaths() {
      const ids = ["skip", "detour", "shop", "camp"];
      if (!retreatUsed) ids.push("retreat");
      return ["straight"].concat(shuffle(ids).slice(0, 2));
    }

    function prepareReward() {
      if (rewardReady) return;
      rewardReady = true;
      rewardStars = enemyNow().tier || starsForRank(enemyNow().rank);
      meta.stars = (Number(meta.stars) || 0) + rewardStars;
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      rewardPicks = drawDistinct(3);
      rewardPaths = [];
      rewardStep = "cards";
      bonusCard = null;
    }

    function takeReward(index) {
      if (rewardStep !== "cards") return;
      const card = rewardPicks[index];
      if (!card) return;
      stolen.push(keepCard(card));
      rewardPaths = rollPaths();
      rewardStep = "paths";
      persistSave(true);
      render();
    }

    function advance(step) {
      const hp = player.hp;
      const next = battleIndex + step;
      outcome = null;
      if (next >= battleTotal) {
        clearReward();
        cleared = true;
        endRun(true);
        screen = "clear";
        render();
        return;
      }
      battleIndex = next;
      startBattle(hp);
    }

    function applyPath(id) {
      if (rewardStep === "done" || rewardStep === "cards") return;
      const from = rewardStep;
      rewardStep = "done";
      if (id === "camp") restoreHp(player.maxHp - player.hp);
      if (id === "retreat") {
        if (from !== "paths") return;
        retreatUsed = true;
        const hp = player.hp;
        outcome = null;
        startBattle(hp);
        return;
      }
      advance(id === "skip" ? 2 : 1);
    }

    function takePath(id) {
      if (rewardStep !== "paths" || !PATHS[id]) return;
      if (id === "shop") {
        rewardStep = "shop";
        persistSave(true);
        render();
        return;
      }
      if (id === "detour") {
        addDetourFight();
        const extra = drawDistinct(1)[0] || null;
        bonusCard = extra;
        if (extra) stolen.push(keepCard(extra));
        rewardStep = "detour";
        persistSave(true);
        render();
        return;
      }
      applyPath(id);
    }

    function rewardOverlay() {
      if (outcome !== "win") return "";
      if (rewardStep === "cards") {
        const picks = rewardPicks.map((card, i) => `<div class="reward-pick"><p class="reward-source">${esc(card.source || "")}</p><div class="card preview ${cardKind(card)}">${cardFace(card)}</div><button type="button" data-action="reward-card" data-reward="${i}">選ぶ</button></div>`).join("");
        return `<div class="overlay"><div class="panel wide"><h2>勝った</h2><p>★${rewardStars}もらった。所持 ★${meta.stars}</p><p>3枚から1枚選ぶ。</p><div class="reward-row">${picks}</div></div></div>`;
      }
      if (rewardStep === "paths") {
        const buttons = rewardPaths.map((id) => `<button type="button" data-action="reward-path" data-path="${id}"><b>${esc(PATHS[id].name)}</b><span>${esc(PATHS[id].text)}</span></button>`).join("");
        return `<div class="overlay"><div class="panel wide"><h2>道を選ぶ</h2><p>所持 ★${meta.stars}</p><div class="path-list">${buttons}</div></div></div>`;
      }
      if (rewardStep === "shop") {
        return `<div class="overlay"><div class="panel"><h2>お店</h2><p>所持 ★${meta.stars}</p><p>品ぞろえは、これから決める。</p><button type="button" data-action="reward-go">出ていく</button></div></div>`;
      }
      const bonus = bonusCard ? `${esc(bonusCard.name)}をもらった。` : "";
      return `<div class="overlay"><div class="panel"><h2>回り道</h2><p>戦闘が1回増えた。</p><p>${bonus}装備の報酬は、装備が来てから。</p><button type="button" data-action="reward-go">進む</button></div></div>`;
    }

    function sortHand() {
      const rank = (card) => {
        const kind = cardKind(card);
        if (kind === "attack") return 0;
        if (kind === "block") return 1;
        if (kind === "skill") return 2;
        return 3;
      };
      hand.sort((a, b) => rank(a) - rank(b) || a.cost - b.cost || String(a.name).localeCompare(b.name, "ja"));
    }

    function renderBattle() {
      sortHand();
      const dealNow = fxDeal;
      const cards = hand.map((card, i) => {
        const poor = player.energy < card.cost;
        const mid = (hand.length - 1) / 2;
        const fan = (i - mid) * 8;
        const drop = Math.abs(i - mid) * 12;
        const label = `${card.cost} ${card.name} ${String(card.text).replace(/\n/g, " ")}`;
        return `<button type="button" class="card ${cardKind(card)}${poor ? " unaffordable" : ""}${dealNow ? " deal" : ""}" data-card="${i}" aria-label="${esc(label)}" style="--fan:${fan}deg;--drop:${drop}px;--deal:${i};z-index:${i + 1}" ${phase !== "player" ? "disabled" : ""}>${cardFace(card)}</button>`;
      }).join("");
      const overlay = rewardOverlay()
        || (outcome === "lose"
        ? `<div class="overlay"><div class="panel">
            <h2>倒された</h2>
            <p>初期デッキに戻った。装備を失った。★${meta.stars}は残っている。</p>
            <button type="button" data-action="character">キャラクター選択へ</button>
          </div></div>`
        : "");
      const leaveOverlay = askLeave
        ? `<div class="overlay"><div class="panel">
            <h2>タイトルに戻る？</h2>
            <p>終わっていない戦いは残らない。</p>
            <button type="button" data-action="title">タイトルへ戻る</button>
            <button type="button" class="ghost" data-action="stay">戦いを続ける</button>
          </div></div>`
        : "";

      const slashNow = fxSlash;
      const hurtNow = fxHurt;
      const guardNow = fxGuard;
      const healNow = fxHeal;
      const hitNow = fxHit;
      const hitPow = hitNow ? hitPower(hitNow.n) : "0.35";
      fxSlash = false;
      fxHurt = false;
      fxGuard = "";
      fxHeal = false;
      fxHit = null;
      fxDeal = false;
      const turnNow = turnCall;
      turnCall = "";
      const logHtml = logLines.map((line) => {
        const text = typeof line === "string" ? line : line.text;
        const kind = line && line.kind;
        const cls = kind === "player" ? "turn-player" : kind === "enemy" ? "turn-enemy" : "";
        return `<p class="${cls}">${esc(text)}</p>`;
      }).join("");
      const enemyShown = Math.round(shownEnemy());
      const playerShown = Math.round(shownPlayer());
      root.innerHTML = `
        <div class="battle-screen${showLog ? "" : " no-log"}${hurtNow ? " hurt" : ""}">
        ${hurtNow ? `<div class="screen-hurt" aria-hidden="true"></div>` : ""}
        ${guardNow === "hold" ? `<div class="screen-guard" aria-label="ダメージなし">${guardMark()}</div>` : ""}
        ${guardNow === "break" ? `<div class="screen-block break" aria-hidden="true">${brokenShield()}</div>` : ""}
        ${healNow ? `<div class="screen-heal" aria-hidden="true"></div>` : ""}
        ${turnNow ? `<div class="turn-call ${turnNow}" aria-hidden="true"><b>${turnNow === "player" ? "自分のターン" : "敵のターン"}</b></div>` : ""}
        ${hurtNow && hitNow && hitNow.side === "player" ? `<b class="dmg-pop me" style="--pow:${hitPow}">${hitNow.n}</b>` : ""}
        <aside class="gear-rail"><h2>装備</h2>${gearMarkup()}${gearEffectText()}<div class="party-stack"><div class="party-vitals"><div class="vitals">${meters("player", shownPlayer(), player.maxHp, player.block)}<div class="hp-line">体力 ${player.poison ? `<span class="poison-mark">毒</span>` : ""}<b data-hp="player">${playerShown}</b> / ${player.maxHp}</div></div></div><div class="status-row"><div class="party-attrs" aria-label="ステータス"><div class="attr hp"><span class="mark">${heartIcon()}</span><span>HP</span><b>${player.maxHp}</b></div><div class="attr atk"><span class="mark">${swordIcon()}</span><span>ATK</span><b>${signed(player.atk)}</b></div><div class="attr def"><span class="mark">${shieldIcon()}</span><span>DEF</span><b>${signed(player.def)}</b></div><div class="attr spd"><span class="mark">${bootIcon()}</span><span>SPD</span><b>${hand.length}</b></div><div class="attr nrg"><span class="mark">${manaIcon()}</span><span>マナ</span><b>${player.energy}</b></div></div><div class="status-stars" aria-label="スター ${meta.stars}">★${meta.stars}</div></div></div></aside>
        <div class="game">
          <header class="hud-top">
            <div class="dungeon">
              <h1 class="dungeon-name">${esc(DUNGEON_NAME)}</h1>
              <div class="dungeon-progress">${battleIndex + 1}/${battleTotal}</div>
            </div>
            <div class="hud-actions">
              <button type="button" class="small-btn" data-action="deck">デッキ確認</button>
              <button type="button" class="small-btn" data-action="settings">オプション</button>
              <button type="button" class="small-btn" data-action="ask-title" ${phase === "player" ? "" : "disabled"}>タイトル</button>
            </div>
          </header>
          <div class="battle-bands">
          <div class="stage">
            <div class="enemy-field">
            ${traitNote()}
            <div class="enemy-main">
            <div class="sprite${slashNow ? " slash" : ""}" aria-hidden="true">
              <i class="eye l"></i><i class="eye r"></i>
              ${slashNow ? `<span class="cut" style="--pow:${hitNow && hitNow.side === "enemy" ? hitPow : "0.35"}"></span>` : ""}
              ${slashNow && hitNow && hitNow.side === "enemy" ? `<b class="dmg-pop">${hitNow.n}</b>` : ""}
            </div>
            <section class="enemy vitals" data-rank="${esc(enemyNow().rank || "普通")}">
              <h2>${esc(enemy.name)}${bossNow() ? "　ボス" : ""}</h2>
              ${meters("enemy", shownEnemy(), enemy.maxHp, enemy.block)}
              <div class="hp-line">体力 ${enemy.poison ? `<span class="poison-mark">毒</span>` : ""}<b data-hp="enemy">${enemyShown}</b> / ${enemy.maxHp}</div>
            </section>
            <div class="banner">${esc(banner)}</div>
            <div class="note">${esc(note)}</div>
            </div>
            ${heroShoulder()}
            </div>
          </div>
          ${playRow()}
          <div class="energy-band" aria-label="マナ ${player.energy}">${pips()}</div>
          <div class="handbar">
              ${pileMarkup("deck", deck.length)}
              <div class="hand">${cards}</div>
              ${pileMarkup("discard", discard.length)}
              <button type="button" class="end" data-end ${phase === "player" ? "" : "disabled"}>ターン終了</button>
            </div>
          </div>
        </div>
        ${showLog ? `<aside class="battle-log"><h2>ログ</h2>${logHtml}</aside>` : ""}
        </div>
        ${deckOverlay()}
        ${overlay}
        ${leaveOverlay}`;
      player.hit = false;
      enemy.hit = false;
      persistLive();
      kickHp();
    }

    root.addEventListener("click", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      const action = el.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "title") goTitle();
        if (name === "ask-title") { askLeave = true; showDeck = false; render(); }
        if (name === "deck") { showDeck = true; render(); }
        if (name === "close-deck") { showDeck = false; render(); }
        if (name === "stay") { askLeave = false; render(); }
        if (name === "settings") { returnScreen = screen; screen = "settings"; render(); }
        if (name === "back") { screen = returnScreen; render(); }
        if (name === "toggle-log") { showLog = !showLog; persistSettings(); render(); }
        if (name === "toggle-auto-end") { autoEndTurn = !autoEndTurn; persistSettings(); render(); }
        if (name === "album") { screen = "album"; render(); }
        if (name === "character") { screen = "character"; render(); }
        if (name === "character-next") { screen = "dungeon"; render(); }
        if (name === "dungeon-start") beginRun();
        if (name === "new") {
          if (readSave()) { screen = "confirm"; render(); }
          else { screen = "character"; render(); }
        }
        if (name === "new-force") { localStorage.removeItem(SAVE_KEY); clearLive(); screen = "character"; render(); }
        if (name === "continue") continueGame();
        if (name === "reward-card") takeReward(Number(action.dataset.reward));
        if (name === "reward-path") takePath(action.dataset.path || "");
        if (name === "reward-go") applyPath("straight");
        return;
      }
      const albumBtn = el.closest("[data-album]");
      if (albumBtn && screen === "album") {
        albumTab = albumBtn.dataset.album || "all";
        render();
        return;
      }
      if (screen !== "battle") return;
      const gearBtn = el.closest("[data-gear]");
      if (gearBtn) {
        const id = gearBtn.dataset.gear;
        gearOpen = gearOpen === id ? null : id;
        render();
        return;
      }
      const card = el.closest("[data-card]");
      if (card) playCard(Number(card.dataset.card));
      if (el.closest("[data-end]")) endTurn();
    });

    document.addEventListener("keydown", (event) => {
      if (screen !== "battle" || askLeave) return;
      if (showDeck) {
        if (event.key === "Escape") { showDeck = false; render(); }
        return;
      }
      if (event.key === "Enter") endTurn();
      if (event.key === "1" || event.key === "2" || event.key === "3") {
        playCard(Number(event.key) - 1);
      }
    });

    loadSettings();
    loadMeta();
    if (!resumeLive()) render();
  </script>
</body>
</html>
