<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>わちゅえりカードゲーム</title>
  <style>
    :root {
      --hand-scale: 0.74;
      --card-ratio: 204 / 300;
      --bg: #12100e;
      --ink: #2a2118;
      --cream: #f4ead7;
      --gold: #e4b15a;
      --hp: #d85a4a;
      --hp-bg: #3a2422;
      --block: #7eb0e6;
      --attack: #e07a55;
      --guard: #6f9ed4;
      --muted: #b7a898;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 18%, #3a2c24 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #1c1612 0%, #12100e 70%);
    }
    button, body { -webkit-user-select: none; user-select: none; }
    .battle-screen {
      height: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(0, 12.5%);
      grid-template-rows: auto minmax(0, 1.4fr) minmax(0, 0.8fr) auto minmax(0, 0.8fr);
      grid-template-areas:
        "gear hud log"
        "gear stage log"
        "gear play log"
        "gear energy log"
        "gear hand log";
      padding: 10px 0 14px;
      row-gap: 16px;
    }
    .battle-screen.no-log {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "gear hud"
        "gear stage"
        "gear play"
        "gear energy"
        "gear hand";
    }
    .game, .battle-bands { display: contents; }
    .hud-top { grid-area: hud; min-width: 0; overflow: hidden; }
    .stage { grid-area: stage; min-width: 0; overflow: hidden; }
    .play-row { grid-area: play; min-width: 0; overflow: hidden; }
    .energy-band { grid-area: energy; min-width: 0; overflow: hidden; }
    .handbar { grid-area: hand; min-width: 0; overflow: hidden; }
    .gear-rail { grid-area: gear; min-width: 0; overflow: hidden; }
    .battle-log { grid-area: log; min-width: 0; overflow: auto; }
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 0 18px 8px;
      border-bottom: 1px solid rgba(228, 177, 90, 0.35);
    }
    .dungeon { display: flex; align-items: baseline; gap: 16px; }
    .dungeon-name {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--cream);
    }
    .dungeon-progress {
      color: var(--gold);
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .status-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      width: max-content;
    }
    .status-stars {
      color: var(--gold);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
      white-space: nowrap;
    }
    .hud-actions { display: flex; gap: 8px; }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .turn { color: var(--gold); font-weight: 700; }
    .chip b { font-size: 20px; }
    .bar {
      height: 8px;
      width: 88px;
      border-radius: 99px;
      background: var(--hp-bg);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--hp); }
    .block-num { color: var(--block); }
    .energy-pips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
    }
    .pip.on { background: var(--gold); }
    .next-energy, .rules, .logline { color: var(--muted); font-size: 13px; }
    .rules { margin: 0; }
    .note { min-height: 1.1em; color: #f0c7a2; font-size: 13px; }
    .stage {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
      margin: 0;
      padding: 8px 10px;
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(10, 8, 7, 0.28) 0%, rgba(10, 8, 7, 0.18) 42%, rgba(10, 8, 7, 0.62) 100%),
        var(--dungeon-art, url("dungeon-bg.jpg")) center 38% / cover no-repeat;
    }
    .enemy-field { position: relative; display: flex; align-items: stretch; gap: 12px; width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .hero-shoulder {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 3;
      height: 100%;
      width: auto;
      aspect-ratio: 863 / 1076;
      max-width: min(52%, 420px);
      pointer-events: none;
    }
    .hero-fig {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.5));
    }
    .hero-vitals {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      width: min(320px, 150%);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .enemy-main {
      position: absolute;
      right: 2%;
      top: 0;
      bottom: 0;
      left: auto;
      z-index: 1;
      width: min(50%, 480px);
      max-width: none;
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto auto;
      align-items: center;
      justify-items: center;
      pointer-events: none;
    }
    .intent { flex: none; text-align: center; background: transparent; border: 0; padding: 0; }
    .intent .now { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; font-size: 32px; font-weight: 800; line-height: 1.2; }
    .act { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; line-height: 1; }
    .act .ico { display: block; }
    .act.big .ico { width: 36px; height: 36px; }
    .act.big b, .act.big.skill { font-size: 36px; }
    .act.small { gap: 4px; }
    .act.small .ico { width: 18px; height: 18px; }
    .act.small b, .act.small.skill { font-size: 16px; }
    .ico.sword { transform: rotate(28deg); transform-origin: 50% 50%; }
    .act.attack { color: var(--attack); }
    .act.block { color: var(--block); }
    .act.skill { color: var(--gold); }
    .skill-note, .trait-note {
      position: relative;
      z-index: 2;
      flex: 0 0 25%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      border: 2px solid rgba(228, 177, 90, 0.92);
      border-radius: 12px;
      background: rgba(20, 14, 12, 0.72);
      padding: 16px 14px;
      color: var(--cream);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.45;
    }
    .trait-note .trait-label { color: var(--gold); font-size: 13px; letter-spacing: 0.14em; }
    .card.preview {
      flex: none;
      width: 132px;
      height: auto;
      max-width: 100%;
      margin: 0;
      transform: none;
      cursor: default;
      aspect-ratio: var(--card-ratio);
    }
    .card.preview:hover { transform: none; }
    .card-fit {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      container-type: inline-size;
    }
    .reward-row { display: flex; gap: 12px; justify-content: center; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .reward-pick { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .reward-pick .card.preview { width: 132px; height: auto; }
    .reward-source { margin: 0; color: var(--gold); font-size: 13px; font-weight: 800; }
    .overlay .panel.wide { width: min(960px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow: auto; }
    .path-list { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 14px; width: min(920px, 100%); }
    .path-list button { display: flex; flex-direction: column; gap: 6px; width: min(240px, 28vw); padding: 8px; }
    .path-list button img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .path-list button span { font-weight: 650; font-size: 13px; }
    .deck-view .panel {
      width: min(1080px, calc(100vw - 48px));
      max-height: calc(100vh - 56px);
      overflow: auto;
      align-items: stretch;
      text-align: left;
    }
    .deck-view .panel h2 { text-align: center; }
    .deck-group { width: 100%; margin: 0 0 18px; }
    .deck-group h3 {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 16px;
      letter-spacing: 0.12em;
      font-weight: 800;
    }
    .deck-cards { display: flex; flex-wrap: wrap; gap: 10px; }
    .deck-view .card.preview { width: 132px; height: auto; }
    .deck-empty { margin: 0; color: var(--muted); }
    .deck-view .panel > button { align-self: center; }
    .album-screen {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .album-screen .panel {
      width: min(1080px, calc(100vw - 48px));
      max-height: calc(100vh - 56px);
      overflow: auto;
      align-items: stretch;
      text-align: left;
      background: #2a221c;
      border: 1px solid rgba(244, 234, 215, 0.2);
      border-radius: 18px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
    }
    .album-screen h2 {
      margin: 0 0 14px;
      font-size: 28px;
      color: var(--cream);
      letter-spacing: 0.06em;
      text-align: center;
    }
    .album-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 0 14px;
    }
    .album-tabs button {
      border: 1px solid rgba(228, 177, 90, 0.55);
      background: transparent;
      color: var(--cream);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .album-tabs button.on {
      background: var(--gold);
      color: #2a2118;
      border-color: var(--gold);
    }
    .album-meta {
      margin: 0 0 16px;
      text-align: center;
      color: var(--muted);
    }
    .album-screen .card.preview { width: 132px; height: auto; }
    .album-screen .panel > button[data-action] {
      align-self: center;
      margin-top: 8px;
      border: 0;
      background: var(--gold);
      color: #2a2118;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .sheet-art {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 0 8px;
    }
    .sheet-cap {
      margin: 0 0 16px;
      text-align: center;
      color: var(--muted);
    }
    .sheet-locks {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
    }
    .sheet-locks p { margin: 0; line-height: 1.55; }
    .sheet-locks b {
      display: inline-block;
      min-width: 4.2em;
      color: var(--gold);
    }
    .ref-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin: 0 0 18px;
    }
    .ref-grid figure { margin: 0; }
    .ref-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #1a1614; }
    .ref-grid img.enemy-ref { aspect-ratio: 3 / 4; object-fit: contain; background: transparent; }
    .ref-grid figcaption { margin-top: 6px; text-align: center; font-weight: 800; }
    .cast-screen { position: relative; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 28px 16px; overflow: hidden; }
    .cast-back {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 6;
      border-radius: 16px;
      border: 1px solid rgba(228, 177, 90, 0.8);
      background: rgba(18, 14, 12, 0.88);
      color: var(--cream);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      padding: 16px 32px;
      cursor: pointer;
    }
    .cast-row { display: flex; gap: 8px; }
    .cast-mini { width: 72px; height: 84px; padding: 0; overflow: hidden; border: 2px solid var(--gold); background: #1a1614; }
    .cast-mini .cast-front { width: 72px; height: 84px; }
    .cast-body { flex: 1; display: grid; grid-template-columns: auto minmax(180px, 34vw) minmax(0, 1fr) auto; gap: 16px; align-items: center; }
    .cast-arrow { width: 64px; height: 64px; border-radius: 50%; font-size: 28px; }
    .cast-front { overflow: hidden; background: #120e0c; }
    .cast-front.big { height: min(78vh, 720px); display: flex; align-items: center; justify-content: center; background: transparent; }
    .cast-front img { width: 500%; height: 100%; max-width: none; object-fit: cover; object-position: left center; }
    .cast-front img.cast-portrait { width: 100%; height: 100%; max-width: 100%; object-fit: contain; object-position: center center; }
    .cast-mini .cast-front { height: 64px; }
    .cast-info h1 { margin: 0 0 8px; color: var(--gold); }
    .cast-info h2 { margin: 14px 0 6px; font-size: 16px; }
    .cast-gear { display: flex; gap: 12px; }
    .cast-gear figure { margin: 0; width: 96px; }
    .cast-gear img { width: 96px; height: 96px; object-fit: cover; display: block; }
    .cast-gear figcaption, .cast-deck { font-size: 14px; }
    .cast-blank { min-height: 1.4em; color: var(--muted); }
    .cast-title {
      margin: 0;
      text-align: center;
      color: #f6d48a;
      font-size: clamp(22px, 2.2vw, 32px);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-shadow: 0 3px 0 #6a4a16, 0 0 18px rgba(240, 195, 106, 0.45);
    }
    .cast-title::after {
      content: "";
      display: block;
      width: min(360px, 70%);
      height: 3px;
      margin: 6px auto 0;
      background: linear-gradient(90deg, transparent, #f0c36a, transparent);
      box-shadow: 0 0 12px rgba(240, 195, 106, 0.65);
    }
    .cast-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .cast-pick {
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #f6d48a;
    }
    .cast-pick img {
      width: min(420px, 46vw);
      height: min(68vh, 640px);
      object-fit: contain;
      filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.45));
    }
    .cast-pick span {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-shadow: 0 2px 0 #6a4a16;
    }
    .cast-detail {
      flex: 1 1 auto;
      min-height: 0;
      width: min(1180px, 100%);
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(280px, 1.1fr) minmax(300px, 460px);
      grid-template-rows: minmax(0, 1fr);
      gap: 28px;
      align-items: end;
      overflow: hidden;
    }
    .cast-stand {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.55));
    }
    .cast-deck-block { flex: 0 0 auto; }
    .cast-deck-block h2 {
      margin: 4px 0 8px;
      text-align: center;
      color: #f0c36a;
      font-size: 18px;
      letter-spacing: 0.18em;
    }
    .cast-plaque {
      max-height: 100%;
      overflow: auto;
      background: linear-gradient(180deg, rgba(54, 40, 26, 0.94), rgba(16, 12, 10, 0.94));
      border: 2px solid #e4b15a;
      border-radius: 18px;
      padding: 22px 26px 24px;
      box-shadow: inset 0 0 0 1px rgba(255, 236, 190, 0.28), 0 14px 28px rgba(0, 0, 0, 0.35);
    }
    .cast-plaque h1 {
      margin: 0 0 8px;
      color: #f6d48a;
      font-size: 48px;
      letter-spacing: 0.2em;
      text-shadow: 0 3px 0 #6a4a16;
    }
    .cast-plaque .stats {
      margin: 0;
      color: #fff6e4;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .cast-plaque h2 {
      margin: 18px 0 8px;
      color: #f0c36a;
      font-size: 18px;
      letter-spacing: 0.18em;
    }
    .cast-deck {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0;
    }
    .cast-deck .card.preview {
      width: 112px;
      pointer-events: none;
    }
    .cast-plaque .cast-gear figcaption { color: #fff6e4; font-size: 16px; font-weight: 800; }
    .cast-roster { display: flex; justify-content: center; min-height: 0; }
    .cast-token {
      border: 0;
      background: transparent;
      color: #f6d48a;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .cast-token span {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-shadow: 0 2px 0 #6a4a16;
    }
    .cast-token.stand img {
      height: min(26vh, 230px);
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.45));
    }
    .cast-token.locked img { filter: drop-shadow(0 0 10px rgba(240, 195, 106, 0.7)) drop-shadow(0 12px 14px rgba(0, 0, 0, 0.45)); }
    .cast-roster.many { gap: 12px; }
    .cast-token.mini {
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 4px;
      background: rgba(18, 14, 12, 0.55);
    }
    .cast-token.mini img { width: 72px; height: 84px; object-fit: contain; }
    .cast-token.mini span { font-size: 14px; letter-spacing: 0.08em; }
    .cast-token.mini.shown { border-color: #e4b15a; }
    .cast-hero {
      height: min(22vh, 200px);
      width: auto;
      margin: 0 auto;
      object-fit: contain;
    }
    .cast-main {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(340px, 480px);
      grid-template-rows: minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      overflow: hidden;
    }
    .cast-action {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      object-position: center;
      border-radius: 16px;
      border: 2px solid rgba(228, 177, 90, 0.6);
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.35);
    }
    .cast-side {
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    .cast-side .cast-plaque { max-height: none; flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 12px 14px 8px; }
    .cast-side .cast-plaque h1 { font-size: 32px; margin-bottom: 4px; }
    .cast-side .cast-plaque h2 { margin: 8px 0 4px; }
    .cast-side .cast-plaque .stats { font-size: 18px; }
    .cast-side .cast-gear figure { width: 56px; }
    .cast-side .cast-gear img { width: 56px; height: 56px; }
    .cast-side .cast-deck .card.preview { width: 72px; }
    .cast-deck .stack-count {
      position: absolute;
      right: 4px;
      bottom: 4px;
      z-index: 2;
      color: #2a2118;
      background: #f0c36a;
      border-radius: 999px;
      padding: 0 5px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
    }
    .cast-start {
      position: static;
      align-self: flex-end;
      width: auto;
      margin: 8px 0 0 auto;
      font-size: 22px;
      padding: 14px 28px;
      border-radius: 999px;
      letter-spacing: 0.12em;
    }
    .cast-start[hidden] { display: none; }
    .sprite {
      width: 100%;
      height: 100%;
      min-height: 0;
      background: none;
      box-shadow: none;
      position: relative;
    }
    .sprite img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.5));
    }
    .sprite .eye {
      position: absolute;
      top: 36px;
      width: 16px;
      height: 16px;
      background: #f4ead7;
      border-radius: 50%;
    }
    .sprite .eye::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: #1a120e;
      border-radius: 50%;
      top: 5px;
      left: 5px;
    }
    .sprite .eye.l { left: 34px; }
    .sprite .eye.r { right: 34px; }
    .sprite { overflow: hidden; }
    .sprite.slash { animation: shake 0.45s linear; overflow: visible; }
    .dmg-pop {
      position: absolute;
      left: 50%;
      top: 22%;
      z-index: 5;
      margin: 0;
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      color: #fff8ee;
      text-shadow: 0 3px 0 #6e1610, 0 0 12px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      animation: dmg-pop 1.05s ease-out forwards;
    }
    .stage-fx {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;

    .dmg-pop.me {

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      }[c]));
    }

    function trimLog() {
      while (logLines.length > 16) logLines.pop();
    }

    function logTurn(kind) {
      const text = kind === "player" ? "-戦士のターン-" : "-敵のターン-";
      logLines.unshift({ kind, text });
      trimLog();
    }

    function log(msg) {
      const line = { text: msg };
      const marker = logLines.findIndex((item) => item && item.kind);
      if (marker === -1) logLines.unshift(line);
      else {
        let at = marker + 1;
        while (at < logLines.length && !(logLines[at] && logLines[at].kind)) at += 1;
        logLines.splice(at, 0, line);
      }
      trimLog();
    }

    function enemyByName(name) {
      const key = name === "仮の相手" ? "スライム" : name;

    function rollRank(tier) {
      const names = DUNGEON.pools[tier] || [];
      if (!names.length) return DUNGEON.boss;
      return names[Math.floor(Math.random() * names.length)];
    }

    function freshRoute() {
      return buildRoute(20, "はじまりの洞窟");

    function isEventNode(name) {
      return String(name || "").startsWith("出来事:");
    }

    const JOB_CHANGE_FLOORS = [10, 20, 30, 40, 50, 60, 70, 80, 90, 99];

    function buildRoute(floors, name) {
      const route = new Array(floors);
      const jobFloors = !name || name === "はじまりの洞窟"
        ? []
        : JOB_CHANGE_FLOORS.filter((floor) => floor >= 1 && floor <= floors);
      for (const floor of jobFloors) route[floor - 1] = "出来事:ジョブ";
      if (route[floors - 1] !== "出来事:ジョブ") route[floors - 1] = DUNGEON.boss;
      const open = [];
      for (let i = 0; i < floors; i++) if (!route[i]) open.push(i);
      const combatTarget = Math.floor(floors / 2);
      const combatsPlaced = route.filter((node) => node && !isEventNode(node)).length;
      const combatLeft = Math.max(0, combatTarget - combatsPlaced);
      const eventLeft = open.length - combatLeft;
      const events = ["出来事:探索", "出来事:未知", "出来事:キャンプ", "出来事:お店"];
      const filler = [];
      for (let i = 0; i < combatLeft; i++) filler.push(rollRank(i < combatLeft / 2 ? 1 : 2));
      for (let i = 0; i < eventLeft; i++) filler.push(events[i % events.length]);
      shuffle(filler).forEach((node, i) => { route[open[i]] = node; });
      return route;
    }

    function enemyNow() {
      return enemyByName(route[battleIndex] || DUNGEON.boss);

      route.splice(battleIndex + 1, 0, extra);

    function actionMark(intent, big) {

    function sourcePattern() {
      return (enemyNow().pattern || []).map((card) => ({ ...card }));
    }

    function deckKey(cards) {
      return (cards || []).map((card) => card.name).sort().join("|");
    }

    function startEnemyLoop(first) {
      enemyLoop = shuffle(sourcePattern());
      intentIndex = first && enemyLoop.length ? Math.floor(Math.random() * enemyLoop.length) : 0;
    }

    function advanceEnemyLoop() {
      intentIndex += 1;
      if (enemyLoop.length && intentIndex >= enemyLoop.length) startEnemyLoop(false);
    }

    function restoreEnemyLoop(data) {
      const saved = Array.isArray(data.enemyLoop) ? data.enemyLoop : [];
      if (saved.length && deckKey(saved) === deckKey(sourcePattern())) {
        enemyLoop = saved.map((card) => ({ ...card }));
        intentIndex = Number.isInteger(data.intentIndex) ? data.intentIndex : 0;
        if (intentIndex < 0 || intentIndex >= enemyLoop.length) startEnemyLoop(false);
        return;
      }
      startEnemyLoop(true);
    }

    function intentAt(offset) {
      if (!enemyLoop.length) startEnemyLoop(false);
      const at = intentIndex + (offset || 0);
      if (at >= 0 && at < enemyLoop.length) return enemyLoop[at];
      return enemyLoop[Math.min(intentIndex, enemyLoop.length - 1)];
    }

    function applyDamage(target, amount) {
      const blocked = Math.min(target.block, amount);
      target.block -= blocked;
      const hpLoss = amount - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      target.hit = true;
      return { blocked, hpLoss };
    }

    function shownEnemy() {
      return shown.enemy == null ? enemy.hp : shown.enemy;
    }

    function shownPlayer() {
      return shown.player == null ? player.hp : shown.player;

    function bindShown() {
      if (player) shown.player = player.hp;
      if (enemy) shown.enemy = enemy.hp;
    }

    function drainMs() {
      const enemyGap = enemy ? Math.abs(enemy.hp - shownEnemy()) : 0;
      const playerGap = player ? Math.abs(player.hp - shownPlayer()) : 0;
      const enemyWait = enemyGap < 0.2 ? 0 : Math.min(1700, Math.max(620, (enemyGap / 6.5) * 1000));
      const playerWait = playerGap < 0.2 ? 0 : Math.min(2400, Math.max(900, (playerGap / 4) * 1000));
      return Math.max(enemyWait, playerWait);
    }

    function paintShown() {
      for (const who of ["enemy", "player"]) {
        const hp = who === "enemy" ? shown.enemy : shown.player;
        const max = who === "enemy" ? enemy && enemy.maxHp : player && player.maxHp;
        if (hp == null || !max) continue;
        const bar = root.querySelector(`[data-bar="${who}"]`);
        if (bar) bar.style.width = `${Math.max(0, Math.min(100, (hp / max) * 100))}%`;
        const text = String(Math.max(0, Math.round(hp)));
        root.querySelectorAll(`[data-hp="${who}"]`).forEach((el) => { el.textContent = text; });
      }
    }

    function pumpHp(stamp) {
      const dt = hpStamp ? Math.min(0.05, (stamp - hpStamp) / 1000) : 0.016;
      hpStamp = stamp;
      const ease = (current, target, quick) => {
        const diff = target - current;
        if (Math.abs(diff) < 0.04) return target;
        const speed = quick ? Math.max(6.5, Math.abs(diff) / 1.5) : Math.max(4, Math.abs(diff) / 2.4);
        return current + Math.sign(diff) * Math.min(Math.abs(diff), speed * dt);
      };
      let moving = false;
      if (enemy && shown.enemy != null && Math.abs(shown.enemy - enemy.hp) >= 0.04) {
        shown.enemy = ease(shown.enemy, enemy.hp, true);
        moving = true;
      } else if (enemy) shown.enemy = enemy.hp;
      if (player && shown.player != null && Math.abs(shown.player - player.hp) >= 0.04) {
        shown.player = ease(shown.player, player.hp, false);
        moving = true;
      } else if (player) shown.player = player.hp;
      paintShown();
      hpFrame = moving ? requestAnimationFrame(pumpHp) : 0;
    }

    function kickHp() {
      if (player && shown.player == null) shown.player = player.hp;
      if (enemy && shown.enemy == null) shown.enemy = enemy.hp;
      hpStamp = 0;
      if (hpFrame) cancelAnimationFrame(hpFrame);
      hpFrame = requestAnimationFrame(pumpHp);
    }

    function spawnManaBit(w, h, fresh) {
      const life = 0.26 + Math.random() * 0.22;
      return {
        x: w * (0.32 + Math.random() * 0.36),
        y: h * (fresh ? 0.64 + Math.random() * 0.2 : 0.8),
        vx: (Math.random() - 0.5) * 22,
        vy: -70 - Math.random() * 80,
        life,
        max: life,
        r: 14 + Math.random() * 14,
      };
    }

    function paintManaBit(ctx, bit) {
      const t = 1 - bit.life / bit.max;
      const radius = bit.r * (1 - t * 0.55);
      const glow = ctx.createRadialGradient(bit.x, bit.y, 0, bit.x, bit.y, radius);
      if (t < 0.3) {
        glow.addColorStop(0, "rgba(255, 252, 230, 0.95)");
        glow.addColorStop(0.4, "rgba(255, 186, 48, 0.75)");
        glow.addColorStop(1, "rgba(255, 70, 8, 0)");
      } else if (t < 0.65) {
        glow.addColorStop(0, "rgba(255, 196, 60, 0.8)");
        glow.addColorStop(0.55, "rgba(255, 78, 12, 0.45)");
        glow.addColorStop(1, "rgba(160, 20, 0, 0)");
      } else {
        glow.addColorStop(0, "rgba(255, 60, 10, 0.28)");
        glow.addColorStop(1, "rgba(90, 8, 0, 0)");
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(bit.x, bit.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function startManaFires() {
      const gen = ++manaFireGen;
      const canvases = [...document.querySelectorAll(".pip.on .mana-fire")];
      if (!canvases.length) return;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fires = canvases.map((canvas) => {
        const ctx = canvas.getContext("2d");
        const bits = Array.from({ length: 34 }, () => spawnManaBit(canvas.width, canvas.height, true));
        return { canvas, ctx, bits };
      });
      const draw = (dt) => {
        fires.forEach(({ canvas, ctx, bits }) => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          bits.forEach((bit) => {
            bit.life -= dt;
            if (bit.life <= 0) Object.assign(bit, spawnManaBit(canvas.width, canvas.height, false));
            bit.x += bit.vx * dt;
            bit.y += bit.vy * dt;
            bit.vx += (Math.random() - 0.5) * 80 * dt;
            paintManaBit(ctx, bit);
          });
        });
      };
      if (reduce) {
        draw(0);
        return;
      }
      let last = 0;
      const frame = (now) => {
        if (gen !== manaFireGen) return;
        const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        draw(dt);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }

    function damageSentence(actor, card, raw, result) {
      const head = `${actor}は${card}で${raw}ダメージ。`;
      if (result.blocked && result.hpLoss) {
        return `${head}ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${head}ブロックで防いだ。`;
      return head;
    }

    function mitigate(amount, defense) {
      const reduced = Math.min(Math.max(0, defense || 0), Math.max(0, amount));
      return { reduced, dealt: amount - reduced };
    }

    function hurtSentence(actor, card, raw, reduced, result) {
      const head = `${actor}は${card}で${raw}ダメージ。`;
      if (!reduced) return damageSentence(actor, card, raw, result);
      if (!result.hpLoss && !result.blocked) return `${head}防御で防いだ。`;
      if (result.blocked && result.hpLoss) {
        return `${head}防御で${reduced}軽減し、ブロックで${result.blocked}防ぎ、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${head}防御で${reduced}軽減し、残りはブロックで防いだ。`;
      return `${head}防御で${reduced}軽減し、体力${result.hpLoss}。`;
    }

    function strikeSentence(actor, card, base, focusAdd, atk, result) {
      const boosted = base + (focusAdd || 0);
      const total = boosted + (atk || 0);
      let head = `${actor}は${card}で${base}ダメージ。`;
      if (focusAdd) head += `集中で${focusAdd}加算し、${boosted}。`;
      if (!atk) {
        if (result.blocked && result.hpLoss) return `${head}ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
        if (result.blocked) return `${head}ブロックで防いだ。`;
        return focusAdd ? head : damageSentence(actor, card, base, result);
      }
      if (result.blocked && result.hpLoss) {
        return `${head}攻撃で${atk}加算し、ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${head}攻撃で${atk}加算し、ブロックで防いだ。`;
      return `${head}攻撃で${atk}加算し、${total}。`;
    }

    function hitPower(n) {
      const value = Math.max(1, Number(n) || 1);
      return Math.max(0, Math.min(1, (value - 1) / 14)).toFixed(2);
    }

    function noteHit(side, landed, swung) {
      const n = landed > 0 ? landed : swung;
      if (n > 0) fxHit = { side, n };
    }

    function poisonSentence(name, raw, reduced, result) {
      let line = `${name}は毒で${raw}ダメージ。`;
      if (reduced) line += `防御で${reduced}軽減し、`;
      if (!result.hpLoss && !result.blocked) return `${line}防いだ。`;
      if (result.blocked && result.hpLoss) return `${line}ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      if (result.blocked) return `${line}残りはブロックで防いだ。`;
      return reduced ? `${line}体力${result.hpLoss}。` : line;
    }

    function tickPoison(who) {
      const target = who === "player" ? player : enemy;
      if (!target || !target.poison || POISON_DAMAGE <= 0) return false;
      const name = who === "player" ? CHARACTER_NAME : enemy.name;
      if (who === "player" && player.parry) {
        player.parry = false;
        log(`${name}は毒で${POISON_DAMAGE}ダメージ。パリィで無効。`);
        return false;
      }
      const defense = who === "player" ? player.def : 0;
      const cut = mitigate(POISON_DAMAGE, defense);
      const result = applyDamage(target, cut.dealt);
      if (who === "player") {
        if (result.hpLoss > 0) {
          fxHurt = true;
          noteHit("player", result.hpLoss, cut.dealt);
        }
        if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      } else if (result.hpLoss || result.blocked) {
        fxSlash = true;
        noteHit("enemy", result.hpLoss, POISON_DAMAGE);
      }
      log(poisonSentence(name, POISON_DAMAGE, cut.reduced, result));
      return target.hp <= 0;
    }

    function takeEnemyHit(raw, label) {
      if (player.parry) {
        player.parry = false;
        noteHit("player", 0, raw);
        log(`${enemy.name}は${label || "攻撃"}で${raw}ダメージ。パリィで無効。`);
        return;
      }
      const cut = mitigate(raw, player.def);
      const result = applyDamage(player, cut.dealt);
      if (result.hpLoss > 0) {
        fxHurt = true;
        noteHit("player", result.hpLoss, cut.dealt);
      }
      if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      log(hurtSentence(enemy.name, label || "攻撃", raw, cut.reduced, result));
    }

    function restoreHp(amount) {
      const room = Math.max(0, player.maxHp - player.hp);
      const gain = Math.max(0, Math.min(Math.floor(Number(amount) || 0), room));
      if (!gain) return 0;
      player.hp += gain;
      fxHeal = true;
      return gain;
    }

    function buildDeck() {
      const specs = [];
      for (const [name, count] of CARD_POOL) {
        for (let i = 0; i < count; i++) {
          specs.push({ uid: uid++, name, ...CARDS[name] });
        }
      }
      for (const extra of stolen) specs.push({ uid: uid++, ...extra });
      deck = shuffle(specs);
      openingDeck = deck.map((card) => ({ ...card }));
      hand = [];
      discard = [];
      inPlay = [];
      resolveAt = 0;
    }

    function draw(n) {
      for (let i = 0; i < n; i++) {
        if (hand.length >= HAND_CAP) break;
        if (!deck.length) {
          if (!discard.length) break;
          deck = shuffle(discard);
          discard = [];
          log(`${CHARACTER_NAME}は捨て札を山札に戻した。`);
        }
        hand.push(deck.pop());
      }
    }

    function pullKind(kind) {
      if (hand.length >= HAND_CAP) return null;
      const take = () => {
        for (let i = deck.length - 1; i >= 0; i--) {
          if (cardKind(deck[i]) === kind) return deck.splice(i, 1)[0];
        }
        return null;
      };
      let card = take();
      if (!card && !deck.length && discard.length) {
        deck = shuffle(discard);
        discard = [];
        log(`${CHARACTER_NAME}は捨て札を山札に戻した。`);
        card = take();
      }
      if (!card) return null;
      hand.push(card);
      return card;
    }

    function pullFromBracelets() {
      const right = gear.braceletR;
      const left = gear.braceletL;
      if (right && right.id === "chain-attack" && !hand.some((card) => cardKind(card) === "attack")) {
        if (hand.length >= HAND_CAP) log(`${CHARACTER_NAME}は${right.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("attack");
          log(card ? `${CHARACTER_NAME}は${right.name}で${card.name}を引いた。` : `${CHARACTER_NAME}は${right.name}。山札に攻撃カードがない。`);
        }
      }
      if (left && left.id === "chain-guard" && !hand.some((card) => cardKind(card) === "block")) {
        if (hand.length >= HAND_CAP) log(`${CHARACTER_NAME}は${left.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("block");
          log(card ? `${CHARACTER_NAME}は${left.name}で${card.name}を引いた。` : `${CHARACTER_NAME}は${left.name}。山札に防御カードがない。`);
        }
      }
    }

    function resolveCard(card) {
      if (card.focus) {
        player.focus = (player.focus || 0) + card.focus;
        log(`${CHARACTER_NAME}は${card.name}。次の攻撃カードか防御カードの数値を+${player.focus}。`);
        return;
      }
      if (card.parry) {
        if (player.parry) log(`${CHARACTER_NAME}は${card.name}。パリィは重複しない。`);
        else {
          player.parry = true;
          log(`${CHARACTER_NAME}は${card.name}。パリィを得た。次の攻撃を無効。攻撃を受けるまで残る。`);
        }
        return;
      }
      if (card.press) {
        const amount = player.block || 0;
        if (!amount) {
          log(`${CHARACTER_NAME}は${card.name}。ブロックが無く、0ダメージ。`);
          return;
        }
        const result = applyDamage(enemy, amount);
        if (result.hpLoss || result.blocked) {
          fxSlash = true;
          noteHit("enemy", result.hpLoss, amount);
        }
        log(damageSentence(CHARACTER_NAME, card.name, amount, result));
        return;
      }
      if (card.poison) {
        enemy.poison = true;
        log(`${CHARACTER_NAME}は${card.name}。${enemy.name}は毒状態。`);
        return;
      }
      const added = player.focus && (card.damage || card.block) ? player.focus : 0;
      if (added) player.focus = 0;
      if (card.damage) {
        const atk = player.atk || 0;
        const amount = card.damage + added + atk;
        const result = applyDamage(enemy, amount);
        if (amount > 0 && (result.hpLoss || result.blocked)) {
          fxSlash = true;
          noteHit("enemy", result.hpLoss, amount);
        }
        log(strikeSentence(CHARACTER_NAME, card.name, card.damage, added, atk, result));
      }
      if (card.block) {
        const gain = card.block + added;
        player.block += gain;
        const boost = added ? `集中で${added}加算し、${gain}。` : "";
        log(`${CHARACTER_NAME}は${card.name}でブロック${card.block}。${boost}いま${player.block}。`);
      }
      if (!card.damage && !card.block) log(`${CHARACTER_NAME}は${card.name}。${card.text}`);
    }

    function playCard(index) {
      if (phase !== "player" || outcome) return false;
      const card = hand[index];
      if (!card) return false;
      if (player.energy < card.cost) {
        note = "マナが足りない";
        render();
        return false;
      }
      player.energy -= card.cost;
      hand.splice(index, 1);
      inPlay.push(card);
      note = "";
      pullFromBracelets();
      if (finishIfStuck()) return true;
      render();
      return true;
    }

    function noPlayableHand() {
      return !hand.some((card) => (Number(card.cost) || 0) <= player.energy);
    }

    function finishIfStuck() {
      if (phase !== "player" || outcome || !noPlayableHand()) return false;
      if (!hand.length || autoEndTurn) {
        endTurn();
        return true;
      }
      return false;
    }

    function handCardBox(index) {
      const cardEl = document.querySelector(`.hand [data-card="${index}"]`);
      if (!cardEl) return null;
      const rect = cardEl.getBoundingClientRect();
      return {
        cx: rect.left + rect.width / 2,
        cy: rect.top + rect.height / 2,
        w: cardEl.offsetWidth,
        h: cardEl.offsetHeight,
        fan: parseFloat(cardEl.style.getPropertyValue("--fan")) || 0,
      };
    }

    function flyCardToPlay(from) {
      if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(".play-side.mine .play-card:last-child .card");
      if (!target) return;
      const to = target.getBoundingClientRect();
      if (!to.width || !to.height || !from.w || !from.h) return;
      const ghost = target.cloneNode(true);
      const kind = target.classList.contains("attack") ? "attack" : target.classList.contains("block") ? "block" : "skill";
      ghost.className = `card fly-card ${kind}`;
      ghost.style.left = `${from.cx - from.w / 2}px`;
      ghost.style.top = `${from.cy - from.h / 2}px`;
      ghost.style.width = `${from.w}px`;
      ghost.style.height = `${from.h}px`;
      ghost.style.transition = "none";
      ghost.style.transform = `rotate(${from.fan}deg)`;
      document.body.appendChild(ghost);
      target.style.visibility = "hidden";
      const dx = to.left + to.width / 2 - from.cx;
      const dy = to.top + to.height / 2 - from.cy;
      const scale = to.height / from.h;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
        if (target.isConnected) target.style.visibility = "";
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 560);
    }

    function playFromHand(index) {
      const from = handCardBox(index);
      if (!playCard(index)) return;
      flyCardToPlay(from);
    }

    function scrapPlay() {
      while (inPlay.length) discard.push(inPlay.shift());
      resolveAt = 0;
    }

    function finishResolve() {
      timer = null;
      scrapPlay();
      banner = "";
      startPlayerTurn();
    }

    function stepResolve() {
      timer = null;
      const enemyIndex = inPlay.length;
      if (phase !== "resolve" || resolveAt > enemyIndex) {
        finishResolve();
        return;
      }
      const index = resolveAt;
      resolveAt += 1;
      if (index < enemyIndex) {
        resolveCard(inPlay[index]);
        if (enemy.hp <= 0) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
      } else {
        logTurn("enemy");
        const card = intentAt(0);
        if (tickPoison("enemy")) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
        if (!card.press) enemy.block = 0;
        if (card.press) {
          const amount = enemy.block || 0;
          if (amount > 0) takeEnemyHit(amount, card.name);
          else log(`${enemy.name}は${card.name}。ブロックが無く、0ダメージ。`);
        } else if (card.damage) {
          takeEnemyHit(card.damage, card.name);
        } else if (card.block) {
          enemy.block += card.block;
          log(`${enemy.name}は${card.name}でブロック${card.block}。`);
        } else if (card.poison) {
          player.poison = true;
          log(`${enemy.name}は${card.name}。${CHARACTER_NAME}は毒状態。`);
        } else {
          log(`${enemy.name}は${card.name}。${card.text}`);
        }
        advanceEnemyLoop();
        if (player.hp <= 0) {
          scrapPlay();
          scheduleFinish("lose");
          return;
        }
      }
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      render();
      const wait = Math.max(720, drainMs(), playerNumber ? 1850 : 0, guardKind ? 1300 : 0);
      timer = setTimeout(resolveAt > enemyIndex ? finishResolve : stepResolve, wait);
    }

    function endTurn() {
      if (phase !== "player" || outcome) return;
      phase = "resolve";
      resolveAt = 0;
      while (hand.length) discard.push(hand.pop());
      note = "";
      turnCall = "enemy";
      render();
      timer = setTimeout(stepResolve, 1100);
    }

    function startPlayerTurn() {
      if (player.hp <= 0) {
        finish("lose");
        return;
      }
      logTurn("player");
      turn += 1;
      player.block = 0;
      if (tickPoison("player")) {
        finish("lose");
        return;
      }
      player.maxEnergy = MANA;
      player.energy = MANA;
      draw(5);
      pullFromBracelets();
      fxDeal = true;
      turnCall = "player";
      phase = "player";
      if (finishIfStuck()) return;
      render();
    }

    function finish(kind) {
      clearTimer();
      outcome = kind;
      phase = "end";
      banner = "";
      log(kind === "win" ? `${CHARACTER_NAME}は${enemy.name}を倒した。` : `${CHARACTER_NAME}は倒された。`);
      if (kind === "lose") {
        endRun(false);
        screen = "defeat";
        render();
        return;
      }
      if (kind === "win") {
        prepareReward();
        persistSave(true);
      }
      render();
    }

    function scheduleFinish(kind) {
      phase = "end";
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const wait = Math.max(720, drainMs(), playerNumber ? 1850 : 0, guardKind ? 1300 : 0);
      clearTimer();
      render();
      timer = setTimeout(() => finish(kind), wait);
    }

    function loadMeta() {
      try {
        const saved = JSON.parse(localStorage.getItem(META_KEY) || "{}");
        meta = {
          uses: Number(saved.uses) || 0,
          clears: Number(saved.clears) || 0,
          stars: Number(saved.stars) || 0,
        };
      } catch (error) {
        meta = { uses: 0, clears: 0, stars: 0 };
      }
    }

    function endRun(clearedRun) {
      gear = emptyGear();
      gearOpen = null;
      stolen = [];
      localStorage.removeItem(SAVE_KEY);
      clearLive();
      meta.uses += 1;
      if (clearedRun) meta.clears += 1;
      localStorage.setItem(META_KEY, JSON.stringify(meta));
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (typeof saved.showLog === "boolean") showLog = saved.showLog;
        if (typeof saved.autoEndTurn === "boolean") autoEndTurn = saved.autoEndTurn;
      } catch (error) {
        showLog = true;
        autoEndTurn = true;
      }
    }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ showLog, autoEndTurn }));
    }

    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function battleSnapshot() {
      return {
        v: 1,
        cleared,
        battleIndex,
        turn,
        intentIndex,
        enemyLoop,
        phase,
        note,
        banner,
        outcome,
        logLines,
        deck,
        hand,
        discard,
        inPlay,
        openingDeck,
        resolveAt,
        player,
        enemy,
        gear,
        stolen,
        battleTotal,
        route,
        retreatUsed,
        dungeonName,
        job,
        jobsHad,
        ultimate,
        rewardReady,
        rewardStars,
        rewardPicks,
        rewardPaths,
        rewardStep,
        bonusCard,
      };
    }

    function persistSave(silent) {
      localStorage.setItem(SAVE_KEY, JSON.stringify(battleSnapshot()));
      if (!silent) {
        saveNote = "セーブした";
        render();
      }
    }

    function readLive() {
      try {
        return JSON.parse(localStorage.getItem(LIVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function persistLive() {
      if (!player || !enemy) return;
      localStorage.setItem(LIVE_KEY, JSON.stringify(battleSnapshot()));
    }

    function clearLive() {
      localStorage.removeItem(LIVE_KEY);
    }

    function applySave(data) {
      cleared = !!data.cleared;
      battleIndex = data.battleIndex || 0;
      turn = data.turn || 0;
      intentIndex = data.intentIndex || 0;
      phase = data.phase || "player";
      note = data.note || "";
      banner = data.banner || "";
      outcome = data.outcome || null;
      logLines = data.logLines || [];
      deck = data.deck || [];
      hand = data.hand || [];
      discard = data.discard || [];
      inPlay = Array.isArray(data.inPlay) ? data.inPlay : [];
      openingDeck = (Array.isArray(data.openingDeck) && data.openingDeck.length
        ? data.openingDeck
        : deck.concat(hand, inPlay, discard)
      ).map((card) => ({ ...card }));
      resolveAt = data.resolveAt || 0;
      player = data.player;
      enemy = data.enemy;
      if (enemy) enemy.image = enemyByName(enemy.name).image;
      if (player) {
        player.hit = false;
        player.atk = player.atk || 0;
        player.def = player.def || 0;
        player.maxHp = 30;
        if (player.hp > player.maxHp) player.hp = player.maxHp;
        player.maxEnergy = MANA;
        if (player.energy > MANA) player.energy = MANA;
        player.focus = player.focus || 0;
        player.parry = !!player.parry;
        player.poison = !!player.poison;
      }
      if (enemy) {
        enemy.hit = false;
        enemy.poison = !!enemy.poison;
        if (enemy.name === "仮の相手") enemy.name = "スライム";
      }
      gear = normalizeGear(data.gear);
      if (!gear.sword && !gear.shield) gear = starterGear();
      syncGearStats();
      gearOpen = null;
      stolen = Array.isArray(data.stolen) ? data.stolen : [];
      if (Array.isArray(data.route) && data.route.length) {
        route = data.route.map((name) => (name === "仮の相手" ? "スライム" : name));
      } else {
        route = CLASSIC_ROUTE.slice();
        const total = data.battleTotal || route.length;
        while (route.length < total) {
          const bossAt = route.indexOf(DUNGEON.boss);
          const tier = DUNGEON.road[DUNGEON.road.length - 1];
          if (bossAt >= 0) route.splice(bossAt, 0, rollRank(tier));
          else route.push(rollRank(tier));
        }
      }
      battleTotal = route.length;
      restoreEnemyLoop(data);
      retreatUsed = !!data.retreatUsed;
      if (data.dungeonName) dungeonName = data.dungeonName === "20" ? "はじまりの洞窟" : data.dungeonName;
      job = data.job || "戦士";
      jobsHad = Array.isArray(data.jobsHad) && data.jobsHad.length ? data.jobsHad : ["戦士"];
      ultimate = data.ultimate || "";
      rewardReady = !!data.rewardReady;
      rewardStars = data.rewardStars || 0;
      rewardPicks = Array.isArray(data.rewardPicks) ? data.rewardPicks : [];
      rewardPaths = Array.isArray(data.rewardPaths) ? data.rewardPaths : [];
      rewardStep = data.rewardStep || "cards";
      bonusCard = data.bonusCard || null;
      if (outcome === "win" && !rewardReady) prepareReward();
      saveNote = "";
      bindShown();
    }

    function startBattle(keepHp) {
      clearTimer();
      clearReward();
      screen = "battle";
      cleared = false;
      const hp = keepHp == null ? 30 : Math.min(30, keepHp);
      player = { hp, maxHp: 30, block: 0, energy: 0, maxEnergy: 0, atk: 0, def: 0, focus: 0, parry: false, poison: false, hit: false };
      syncGearStats();
      const foe = enemyNow();
      enemy = { name: foe.name, image: foe.image, hp: foe.hp, maxHp: foe.hp, block: 0, poison: false, hit: false };
      bindShown();
      turn = 0;
      startEnemyLoop(true);
      phase = "player";
      note = "";
      banner = "";
      outcome = null;
      askLeave = false;
      logLines = [];
      saveNote = "";
      buildDeck();
      startPlayerTurn();
    }

    function grantExplore() {
      const kind = ["カード", "装備", "アイテム"][Math.floor(Math.random() * 3)];
      if (kind === "カード") {
        const names = Object.keys(COMMON);
        const name = names[Math.floor(Math.random() * names.length)];
        stolen.push(keepCard({ name, ...COMMON[name], stars: 1 }));
        return `${name}のカードをもらった。`;
      }
      if (kind === "装備") {
        const item = GEAR_ITEMS[Math.floor(Math.random() * GEAR_ITEMS.length)];
        if (!gear || !gear.sword) gear = starterGear();
        gear[item.slot] = { ...item };
        syncGearStats();
        return `${item.name}を装備した。`;
      }
      return "アイテムを拾った。効果はまだ無い。";
    }

    function jobCandidates() {
      const list = [];
      if (jobsHad.includes("戦士") && jobsHad.includes("魔法使い")) list.push("パラディン");
      if (job !== "魔法使い") list.push("魔法使い");
      if (job !== "戦士") list.push("戦士");
      return list;
    }

    function rollUltimates() {
      const pairs = [];
      for (let w = 0; w <= 4; w++) pairs.push(`${w}:${4 - w}`);
      return shuffle(pairs).slice(0, 2);
    }

    function ultimateLabel(pair) {
      const [w, m] = String(pair).split(":");
      return `戦士${w}と魔法使い${m}`;
    }

    function openFloor(keepHp) {
      floorHp = keepHp == null ? 30 : Math.min(30, keepHp);
      const kind = String(route[battleIndex] || "").slice("出来事:".length);
      floorKind = kind;
      floorNote = "";
      floorPhase = "show";
      ultimatePicks = [];
      if (kind === "キャンプ") {
        floorHp = 30;
        if (player) player.hp = 30;
        floorNote = "体力が全快した。";
      } else if (kind === "お店") {
        floorNote = "品ぞろえは、これから決める。";
      } else if (kind === "探索") {
        if (Math.random() < 0.5) {
          route[battleIndex] = rollRank(battleIndex < route.length / 2 ? 1 : 2);
          startBattle(floorHp);
          return;
        }
        floorNote = grantExplore();
      } else if (kind === "未知") {
        const roll = ["キャンプ", "お店", "探索", "戦闘"][Math.floor(Math.random() * 4)];
        if (roll === "戦闘") {
          route[battleIndex] = rollRank(battleIndex < route.length / 2 ? 1 : 2);
          startBattle(floorHp);
          return;
        }
        if (roll === "キャンプ") {
          floorHp = 30;
          if (player) player.hp = 30;
          floorNote = "未知は、キャンプだった。体力が全快した。";
        } else if (roll === "探索") {
          floorNote = `未知は、探索だった。${grantExplore()}`;
        } else {
          floorNote = "未知は、お店だった。品ぞろえは、これから決める。";
        }
      } else if (kind === "ジョブ") {
        floorPhase = "job";
        floorNote = `いまのジョブは${job}。カードは捨てない。`;
      }
      screen = "floor";
      render();
    }

    function enterNode(keepHp) {
      if (isEventNode(route[battleIndex])) {
        openFloor(keepHp);
        return;
      }
      startBattle(keepHp);
    }

    function beginRun(floors, name) {
      dungeonName = name || "はじまりの洞窟";
      battleIndex = 0;
      route = buildRoute(floors || 20, dungeonName);
      battleTotal = route.length;
      retreatUsed = false;
      cleared = false;
      gear = starterGear();
      gearOpen = null;
      stolen = [];
      job = "戦士";
      jobsHad = ["戦士"];
      ultimate = "";
      enterNode(30);
    }

    function continueGame() {
      const data = readSave();
      if (!data) return;
      clearTimer();
      applySave(data);
      if (data.cleared) {
        localStorage.removeItem(SAVE_KEY);
        screen = "title";
        render();
        return;
      }
      screen = "battle";
      render();
    }

    function goTitle() {
      clearTimer();
      askLeave = false;
      clearLive();
      screen = "title";
      saveNote = "";
      render();
    }

    function resumeLive() {
      const data = readLive();
      if (!data || !data.player || !data.enemy) return false;
      if (data.cleared) {
        clearLive();
        screen = "title";
        render();
        return true;
      }
      clearTimer();
      applySave(data);
      askLeave = false;
      screen = "battle";
      if (screen === "battle" && !outcome && enemy && enemy.hp <= 0) {
        finish("win");
        return true;
      }
      if (screen === "battle" && !outcome && player && player.hp <= 0) {
        finish("lose");
        return true;
      }
      if (screen === "battle" && phase === "resolve" && !outcome) {
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "enemy" && !outcome) {
        phase = "resolve";
        resolveAt = inPlay.length;
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "recoil" && !outcome) {
        render();
        timer = setTimeout(startPlayerTurn, 650);
      } else {
        render();
      }
      return true;
    }

    function meters(who, hp, maxHp, block) {
      const hpPct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
      const blockPct = Math.max(0, Math.min(100, (block / maxHp) * 100));
      const shield = block > 0 ? `<div class="shield-row"><div class="meter shield" style="width:${blockPct}%"><span></span></div><div class="shield-line">シールド <b>${block}</b></div></div>` : "";
      return `<div class="meters">${shield}<div class="meter hp"><span data-bar="${who}" style="width:${hpPct}%"></span></div></div>`;
    }

    function pips() {
      return Array.from({ length: player.maxEnergy }, (_, i) =>

          : `<i class="pip"></i>`
