<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>わちゅえりカードゲーム</title>
  <style>
    :root {
      --hand-scale: 1.5;
      --bg: #12100e;
      --ink: #2a2118;
      --cream: #f4ead7;
      --gold: #e4b15a;
      --hp: #d85a4a;
      --hp-bg: #3a2422;
      --block: #7eb0e6;
      --attack: #e07a55;
      --guard: #6f9ed4;
      --muted: #b7a898;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 18%, #3a2c24 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #1c1612 0%, #12100e 70%);
    }
    button, body { -webkit-user-select: none; user-select: none; }
    .battle-screen { height: 100%; display: flex; }
    .game {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 18px 14px;
      gap: 8px;
    }
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(228, 177, 90, 0.35);
    }
    .dungeon { display: flex; align-items: baseline; gap: 16px; }
    .dungeon-name {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--cream);
    }
    .dungeon-progress {
      color: var(--gold);
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .hud-actions { display: flex; gap: 8px; }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .turn { color: var(--gold); font-weight: 700; }
    .chip b { font-size: 20px; }
    .bar {
      height: 8px;
      width: 88px;
      border-radius: 99px;
      background: var(--hp-bg);
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--hp); }
    .block-num { color: var(--block); }
    .energy-pips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
    }
    .pip.on { background: var(--gold); }
    .next-energy, .rules, .logline { color: var(--muted); font-size: 13px; }
    .rules { margin: 0; }
    .note { min-height: 1.1em; color: #f0c7a2; font-size: 13px; }
    .stage {
      flex: 1 1 38%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 8px;
      margin: 0;
      padding: 12px 10px 6px;
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(10, 8, 7, 0.28) 0%, rgba(10, 8, 7, 0.18) 42%, rgba(10, 8, 7, 0.62) 100%),
        url("dungeon-bg.jpg") center 38% / cover no-repeat;
    }
    .enemy-field { position: relative; display: flex; align-items: stretch; gap: 12px; width: 100%; flex: 1 1 auto; min-height: 0; }
    .enemy-main {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      width: max-content;
      max-width: 70%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }
    .intent { flex: none; text-align: center; background: transparent; border: 0; padding: 0; }
    .intent .now { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; font-size: 32px; font-weight: 800; line-height: 1.2; }
    .act { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; line-height: 1; }
    .act .ico { display: block; }
    .act.big .ico { width: 36px; height: 36px; }
    .act.big b, .act.big.skill { font-size: 36px; }
    .act.small { gap: 4px; }
    .act.small .ico { width: 18px; height: 18px; }
    .act.small b, .act.small.skill { font-size: 16px; }
    .ico.sword { transform: rotate(28deg); transform-origin: 50% 50%; }
    .act.attack { color: var(--attack); }
    .act.block { color: var(--block); }
    .act.skill { color: var(--gold); }
    .skill-note, .trait-note {
      position: relative;
      z-index: 2;
      flex: 0 0 25%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      border: 2px solid rgba(228, 177, 90, 0.92);
      border-radius: 12px;
      background: rgba(20, 14, 12, 0.72);
      padding: 16px 14px;
      color: var(--cream);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.45;
    }
    .trait-note .trait-label { color: var(--gold); font-size: 13px; letter-spacing: 0.14em; }
    .foe-next {
      position: relative;
      z-index: 2;
      flex: 0 0 25%;
      margin-left: auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px;
      container-type: size;
      overflow: hidden;
    }
    .card.preview {
      flex: none;
      width: min(100%, 168px);
      height: min(220px, 34vh);
      margin: 0;
      transform: none;
      cursor: default;
    }
    .card.preview:hover { transform: none; }
    .card.preview .cost { width: 28px; height: 28px; font-size: 16px; border-width: 2px; }
    .card.preview .name { min-height: 32px; padding: 6px 6px 2px 38px; font-size: 15px; }
    .card.preview .fx b { font-size: 22px; }
    .card.preview .fx .ico { width: 22px; height: 22px; }
    .foe-next .card.preview {
      width: min(100cqw, calc(100cqh * 204 / 300));
      height: auto;
      max-width: none;
      max-height: none;
      aspect-ratio: 204 / 300;
      container-type: size;
    }
    .foe-next .card.preview .cost {
      width: 14cqh;
      height: 14cqh;
      font-size: 8cqh;
      border-width: 0.5cqh;
      top: 2cqh;
      left: 2cqh;
    }
    .foe-next .card.preview .name {
      min-height: 14cqh;
      padding: 3cqh 2cqh 1cqh 18cqh;
      font-size: 7cqh;
    }
    .foe-next .card.preview .fx b { font-size: 12cqh; }
    .foe-next .card.preview .fx .ico { width: 10cqh; height: 10cqh; }
    .reward-row { display: flex; gap: 12px; justify-content: center; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .reward-pick { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .reward-pick .card.preview { width: 132px; height: 184px; }
    .deck-view .panel {
      width: min(1080px, calc(100vw - 48px));
      max-height: calc(100vh - 56px);
      overflow: auto;
      align-items: stretch;
      text-align: left;
    }
    .deck-view .panel h2 { text-align: center; }
    .deck-group { width: 100%; margin: 0 0 18px; }
    .deck-group h3 {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 16px;
      letter-spacing: 0.12em;
      font-weight: 800;
    }
    .deck-cards { display: flex; flex-wrap: wrap; gap: 10px; }
    .deck-view .card.preview { width: 132px; height: 184px; }
    .deck-empty { margin: 0; color: var(--muted); }
    .deck-view .panel > button { align-self: center; }
    .sprite {
      flex: none;
      width: 210px;
      height: 156px;
      border-radius: 46% 46% 40% 40%;
      background:
        radial-gradient(circle at 30% 30%, #8d847c, transparent 40%),
        linear-gradient(160deg, #6e675f, #3c3834 60%, #2a2724);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), inset 0 -10px 16px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    .sprite .eye {
      position: absolute;
      top: 58px;
      width: 26px;
      height: 26px;
      background: #f4ead7;
      border-radius: 50%;
    }
    .sprite .eye::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #1a120e;
      border-radius: 50%;
      top: 8px;
      left: 8px;
    }
    .sprite .eye.l { left: 54px; }
    .sprite .eye.r { right: 54px; }
    .sprite { overflow: hidden; }
    .sprite.slash { animation: shake 0.45s linear; overflow: visible; }
    .dmg-pop {
      position: absolute;
      left: 50%;
      top: 22%;
      z-index: 5;
      margin: 0;
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      color: #fff8ee;
      text-shadow: 0 3px 0 #6e1610, 0 0 12px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      animation: dmg-pop 1.05s ease-out forwards;
    }
    .dmg-pop.me {
      position: fixed;
      top: 42%;
      z-index: 26;
      font-size: 72px;
      animation-duration: 1.15s;
    }
    .sprite .cut {
      position: absolute;
      left: -46%;
      width: 190%;
      height: 5px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 248, 236, 0) 10%, #fff 42%, #fff 58%, rgba(255, 248, 236, 0) 90%, transparent 100%);
      box-shadow: 0 0 8px #fff, 0 3px 0 rgba(196, 48, 36, 0.85);
      opacity: 0;
      pointer-events: none;
    }
    .sprite.slash .cut.a { top: 24%; animation: slash 1.05s ease-out forwards; }
    .sprite.slash .cut.b { top: 48%; height: 8px; animation: slash 1.1s ease-out 0.08s forwards; }
    .sprite.slash .cut.c { top: 70%; animation: slash 1.05s ease-out 0.16s forwards; }
    .battle-screen.hurt { animation: screen-shake 0.55s linear; }
    .screen-hurt {
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      background: rgba(150, 18, 12, 0.46);
      animation: hurt-fade 1.15s ease-out forwards;
    }
    .enemy { text-align: center; }
    .enemy.vitals { align-self: center; width: clamp(300px, 66%, 420px); padding: 0; }
    .enemy.vitals[data-rank="雑魚"] { width: clamp(200px, 46%, 280px); }
    .enemy.vitals[data-rank="普通"] { width: clamp(300px, 66%, 420px); }
    .enemy.vitals[data-rank="強敵"] { width: clamp(400px, 86%, 560px); }
    .enemy h2 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0.14em;
      color: var(--cream);
      font-weight: 800;
    }
    .bar.wide { width: 180px; height: 10px; }
    .banner { min-height: 0; text-align: center; color: var(--gold); font-size: 18px; }
    .logline { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .play-row {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 28px;
      padding: 8px 8px 0;
    }
    .play-side { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .play-side.mine { align-items: flex-start; }
    .play-label {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }
    .play-cards { display: flex; align-items: flex-end; gap: 8px; min-height: 136px; }
    .play-row .card.preview { width: 92px; height: 136px; pointer-events: none; }
    .play-card.on .card.preview { transform: translateY(-12px); box-shadow: 0 0 0 2px var(--gold), 0 12px 20px rgba(0, 0, 0, 0.35); }
    .party {
      flex: 1 1 62%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 2px solid rgba(228, 177, 90, 0.92);
    }
    .party-band {
      display: flex;
      align-items: stretch;
      gap: 12px;
      width: 100%;
    }
    .party-stats {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 14px;
      padding: 12px 16px 14px;
      border: 1px solid rgba(228, 177, 90, 0.55);
      border-radius: 14px;
      background: rgba(20, 14, 12, 0.5);
    }
    .party-attrs {
      flex: 0 0 auto;
      align-self: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: max-content;
      padding: 10px 14px;
      border: 1px solid rgba(228, 177, 90, 0.55);
      border-radius: 14px;
      background: rgba(20, 14, 12, 0.5);
    }
    .attr {
      display: grid;
      grid-template-columns: 30px 3.4em auto;
      align-items: center;
      column-gap: 8px;
      text-align: left;
    }
    .attr .mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
    }
    .attr .mark .ico { width: 24px; height: 24px; }
    .attr.hp .mark { color: var(--hp); }
    .attr.atk .mark { color: var(--attack); }
    .attr.def .mark { color: var(--block); }
    .attr.spd .mark { color: var(--gold); }
    .attr.nrg .mark { color: var(--gold); }
    .attr span {
      color: var(--gold);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .attr b {
      color: #fff8ee;
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }
    .vitals { position: relative; text-align: center; }
    .meters { width: 240px; margin: 0 auto; }
    .meter {
      height: 14px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--hp-bg);
    }
    .meter > span { display: block; height: 100%; }
    .meter.hp > span { background: var(--hp); }
    .meter.shield { background: transparent; margin-bottom: 4px; }
    .meter.shield > span { width: 100%; background: var(--block); }
    .vitals .meters { width: 100%; }
    .vitals .meter.hp {
      height: 44px;
      border-radius: 10px;
      background: #2a1814;
      box-shadow: inset 0 0 0 1px rgba(255, 236, 210, 0.16);
    }
    .vitals .meter.shield { height: 12px; margin-bottom: 6px; border-radius: 6px; }
    .vitals .hp-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 44px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff8ee;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
    .vitals .hp-line b { font-size: 28px; letter-spacing: 0.02em; }
    .energy-pips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .pip {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #6e5a42;
      background: #241c16;
    }
    .pip.on {
      background: radial-gradient(circle at 35% 32%, #fff1c2, #f2c14e 46%, #c48a1e);
      border-color: #ffe7a3;
      box-shadow: 0 0 12px rgba(242, 193, 78, 0.55);
    }
    .handbar { flex: 1; width: 100%; min-width: 0; display: flex; align-items: flex-end; justify-content: center; gap: 10px; min-height: 0; overflow-x: auto; container-type: size; }
    .pile { width: auto; height: 100%; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
    .pile-card {
      position: relative;
      width: auto;
      height: min(calc(168px * var(--hand-scale)), calc(100cqh * 168 / 300));
      aspect-ratio: 118 / 168;
      border-radius: 14px;
    }
    .pile-card.back {
      background:
        radial-gradient(circle at 50% 46%, rgba(228, 177, 90, 0.2), transparent 42%),
        repeating-linear-gradient(135deg, rgba(228, 177, 90, 0.18) 0 1px, transparent 1px 12px),
        #2a2118;
      border: 2px solid #c8963e;
      box-shadow: inset 0 0 0 6px rgba(18, 14, 10, 0.55), inset 0 0 0 7px rgba(228, 177, 90, 0.4);
    }
    .pile-card.discard {
      background:
        radial-gradient(circle at 50% 46%, rgba(140, 128, 116, 0.16), transparent 42%),
        repeating-linear-gradient(135deg, rgba(150, 138, 124, 0.16) 0 1px, transparent 1px 12px),
        #14110e;
      border-color: #5a5148;
      box-shadow: inset 0 0 0 6px rgba(8, 6, 5, 0.72), inset 0 0 0 7px rgba(110, 100, 90, 0.38);
    }
    .pile-card.stack { box-shadow: 5px 5px 0 #16120f, 6px 6px 0 rgba(200, 150, 62, 0.7); }
    .pile-card.discard.stack { box-shadow: 5px 5px 0 #0c0a09, 6px 6px 0 rgba(90, 81, 72, 0.75); }
    .pile-count {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: calc(68px * var(--hand-scale));
      font-weight: 800;
      line-height: 1;
      color: #fff8ee;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 1;
    }
    .pile-card.empty {
      background: transparent;
      border: 1px solid rgba(244, 234, 215, 0.28);
      box-shadow: none;
    }
    .pile-card.empty .pile-count {
      color: rgba(244, 234, 215, 0.32);
      text-shadow: none;
      font-weight: 600;
    }
    .pile-label { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
    .hand { flex: 1 1 auto; height: 100%; min-width: 0; display: flex; justify-content: center; align-items: flex-end; gap: 0; padding: 8px 8px 0; }
    .battle-log {
      flex: 0 0 8.333%;
      height: 100%;
      overflow: auto;
      padding: 14px 10px;
      border-left: 1px solid rgba(228, 177, 90, 0.35);
    }
    .gear-rail {
      flex: 0 0 auto;
      width: max-content;
      height: 100%;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 32px;
      border-right: 1px solid rgba(228, 177, 90, 0.35);
    }
    .gear-rail h2 {
      margin: 0 0 4px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--gold);
    }
    .gear-rail .party-attrs { margin-top: auto; align-self: stretch; width: auto; }
    .gear-board {
      display: grid;
      grid-template-columns: repeat(2, 208px);
      gap: 8px 40px;
      justify-content: center;
    }
    .gear-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: auto;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
    }
    .gear-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 208px;
      height: 52px;
      flex: none;
      overflow: hidden;
      border: 1px solid rgba(228, 177, 90, 0.55);
      border-radius: 10px;
      background: rgba(20, 14, 12, 0.5);
    }
    .gear-slot.open .gear-frame { border-color: var(--gold); }
    .gear-frame img { width: 100%; height: 100%; object-fit: cover; }
    .gear-mark { color: rgba(228, 177, 90, 0.55); display: flex; }
    .gear-mark .ico { width: 26px; height: 26px; }
    .gear-label {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .gear-effect {
      margin: 4px 0 0;
      padding: 8px;
      border: 1px solid rgba(228, 177, 90, 0.7);
      border-radius: 10px;
      color: var(--cream);
      font-size: 13px;
      line-height: 1.45;
    }
    .battle-log p { margin: 0 0 10px; font-size: 13px; line-height: 1.45; color: var(--cream); }
    .card {
      width: auto;
      flex: 1 1 0;
      max-width: calc(204px * var(--hand-scale));
      min-width: 0;
      margin-inline: calc(-22px * var(--hand-scale));
      height: min(calc(300px * var(--hand-scale)), calc(44vh * var(--hand-scale)));
      border-radius: 16px;
      border: 3px solid transparent;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow: hidden;
      font-family: inherit;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      position: relative;
      transform: translateY(var(--drop, 0px)) rotate(var(--fan, 0deg));
      transform-origin: center bottom;
      transition: transform 0.15s ease;
    }
    .hand .card {
      flex: 0 0 auto;
      width: auto;
      max-width: none;
      height: min(calc(300px * var(--hand-scale)), 100cqh);
      aspect-ratio: 204 / 300;
    }
    .hand .card.deal {
      animation: deal-flow 0.7s cubic-bezier(0.16, 0.84, 0.28, 1) backwards;
      animation-delay: calc(var(--deal, 0) * 0.14s);
    }
    @keyframes deal-flow {
      0% {
        opacity: 0;
        transform: translateX(calc(-180px - var(--deal, 0) * 36px)) translateY(calc(var(--drop, 0px) + 16px)) rotate(calc(var(--fan, 0deg) - 7deg));
      }
      28% { opacity: 1; }
      100% {
        opacity: 1;

    .card.attack { background: #9d3a32; border-color: #7a2a24; color: #fff7f4; }

    .card:hover:not(:disabled) {

    }
    .card:disabled { cursor: default; }
    .card.unaffordable { filter: saturate(0.7) brightness(0.92); }
    .card .face {

    .card .cost {

    .card .name {

      font-size: calc(18px * var(--hand-scale));

    .card .fx { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; line-height: 1; color: #1a120e; }
    .card .fx b { font-size: calc(30px * var(--hand-scale)); color: #1a120e; }
    .card .fx .ico { width: calc(32px * var(--hand-scale)); height: calc(32px * var(--hand-scale)); color: #1a120e; }
    .card .fx.attack, .card .fx.block { color: #1a120e; }
    .end {

    .overlay {

    .overlay .panel {

    .overlay button {

    #game { height: 100%; }
    .menu {

      mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, transparent, #000 10%, #000 88%, transparent);

    .title-hero h1 {

    .small-btn { min-width: 0; font-size: 14px; padding: 8px 10px; }
    @keyframes shake {
      25% { transform: translateX(-6px); }
      50% { transform: translateX(5px); }

    }
    @keyframes dmg-pop {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
      12% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      62% { opacity: 1; transform: translate(-50%, -12px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -28px) scale(1); }
    }
    @keyframes slash {
      0% { opacity: 0; transform: rotate(-48deg) translateX(-22%) scaleX(0.25); }
      16% { opacity: 1; transform: rotate(-34deg) translateX(0) scaleX(1); }
      62% { opacity: 1; transform: rotate(-28deg) translateX(4%) scaleX(1); }
      100% { opacity: 0; transform: rotate(-18deg) translateX(16%) scaleX(1.04); }
    }
    @keyframes screen-shake {
      0%, 100% { transform: none; }
      15% { transform: translate(-10px, 5px); }
      30% { transform: translate(8px, -4px); }
      45% { transform: translate(-6px, -5px); }

      75% { transform: translate(-3px, 2px); }

      14% { opacity: 1; }
      100% { opacity: 0; }

      .sprite { width: 180px; height: 136px; }

      .sprite .eye.l { left: 46px; }
      .sprite .eye.r { right: 46px; }
      .end { width: 96px; height: 96px; font-size: 14px; }
      .pip { width: 22px; height: 22px; }

      .vitals .hp-line b { font-size: 22px; }

  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // 試し用カード。名前・コスト・効果を差し替えると中身が変わる。
    const CARD_POOL = [
      ["斬撃", 3],
      ["防御", 3],
      ["強撃", 2],
      ["踏み込み", 2],
    ];
    const CARDS = {
      斬撃: { cost: 1, text: "6ダメージ", damage: 6 },
      防御: { cost: 1, text: "ブロック5", block: 5 },
      強撃: { cost: 2, text: "12ダメージ", damage: 12 },
      踏み込み: { cost: 1, text: "4ダメージ\nブロック3", damage: 4, block: 3 },
    };
    const ENEMIES = [
      {
        name: "仮の相手",
        rank: "雑魚",
        hp: 22,
        pattern: [
          { name: "斬り", cost: 1, text: "8ダメージ", damage: 8 },
          { name: "備え", cost: 2, text: "ブロック10", block: 10 },
          { name: "強打", cost: 2, text: "13ダメージ", damage: 13 },
        ],
      },
      {
        name: "荒くれ",
        rank: "普通",
        hp: 24,
        pattern: [
          { name: "殴打", cost: 1, text: "4ダメージ", damage: 4 },
          { name: "殴打", cost: 1, text: "4ダメージ", damage: 4 },
          { name: "叩き", cost: 1, text: "8ダメージ", damage: 8 },
        ],
      },
      {
        name: "重騎士",
        rank: "強敵",
        hp: 30,
        pattern: [
          { name: "静止", cost: 1, text: "このターンは動かない" },
          { name: "重撃", cost: 2, text: "12ダメージ", damage: 12 },
          { name: "堅守", cost: 2, text: "ブロック8", block: 8 },
        ],
      },
    ];

    const root = document.getElementById("game");
    let uid = 1;
    let deck = [];
    let hand = [];
    let discard = [];
    let inPlay = [];
    let resolveAt = 0;
    let player = null;
    let enemy = null;
    let turn = 0;
    let intentIndex = 0;
    let phase = "player";
    let note = "";
    let banner = "";
    let outcome = null;
    let logLines = [];
    let timer = null;
    let screen = "title";
    let battleIndex = 0;
    let showLog = true;
    let autoEndTurn = true;
    let cleared = false;
    let saveNote = "";
    let returnScreen = "title";
    let askLeave = false;
    let showDeck = false;
    let gear = emptyGear();
    let gearOpen = null;
    let stolen = [];
    let shown = { enemy: null, player: null };
    let hpFrame = 0;
    let hpStamp = 0;
    let fxSlash = false;
    let fxHurt = false;
    let fxHit = null;
    let fxDeal = false;
    const SAVE_KEY = "card-battle-save-v1";
    const LIVE_KEY = "card-battle-live-v1";
    const SETTINGS_KEY = "card-battle-settings-v1";
    const BATTLE_TOTAL = 3;
    const MANA = 3;
    const DUNGEON_NAME = "仮の三連戦";

    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      }[c]));
    }

    function log(msg) {
      logLines.unshift(msg);
      if (logLines.length > 16) logLines.pop();
    }

    function clearTimer() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function enemyNow() {
      return ENEMIES[battleIndex];
    }

    function signed(n) {
      const value = n || 0;
      if (value > 0) return `+${value}`;
      if (value < 0) return String(value);
      return "±0";
    }

    function emptyGear() {
      return { sword: null, shield: null, braceletR: null, braceletL: null };
    }

    function normalizeGear(data) {
      const next = emptyGear();
      if (!data) return next;
      for (const key of Object.keys(next)) next[key] = data[key] || null;
      return next;
    }

    function braceletIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>`;
    }

    function gearMarkup() {
      const slots = [
        { id: "shield", label: "盾", icon: shieldIcon() },
        { id: "sword", label: "剣", icon: swordIcon() },
        { id: "braceletL", label: "腕輪左", icon: braceletIcon() },
        { id: "braceletR", label: "腕輪右", icon: braceletIcon() },
      ];
      const buttons = slots.map((slot) => {
        const item = gear[slot.id];
        const picture = item && item.image
          ? `<img src="${esc(item.image)}" alt="">`
          : `<span class="gear-mark">${slot.icon}</span>`;
        return `<button type="button" class="gear-slot${item ? " filled" : ""}${gearOpen === slot.id ? " open" : ""}" data-gear="${slot.id}" aria-label="${esc(slot.label)}"><span class="gear-frame">${picture}</span><span class="gear-label">${esc(item && item.name ? item.name : slot.label)}</span></button>`;
      }).join("");
      return `<div class="gear-board">${buttons}</div>`;
    }

    function gearEffectText() {
      if (!gearOpen) return "";
      const item = gear[gearOpen];
      const text = item && item.effect ? item.effect : "なにも入っていない";
      return `<p class="gear-effect">${esc(text)}</p>`;
    }

    function swordIcon() {
      return `<svg class="ico sword" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0 14.5 7 14.1 16.4H18.3v2.2h-5.05V23.4h-2.5v-4.8H5.7v-2.2h4.2L9.5 7z"/></svg>`;
    }

    function shieldIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l8 3v7c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V5z"/></svg>`;
    }

    function heartIcon() {
      return `<svg class="ico heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20.4 10.7 19.2C5.5 14.6 2.2 11.6 2.2 8 2.2 5 4.6 2.6 7.6 2.6c1.7 0 3.4.8 4.4 2.1 1-1.3 2.7-2.1 4.4-2.1 3 0 5.4 2.4 5.4 5.4 0 3.6-3.3 6.6-8.5 11.2L12 20.4z"/></svg>`;
    }

    function manaIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>`;
    }

    function bootIcon() {
      return `<svg class="ico boot" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 1.4h6.4v2.6h-1.2V9h6.4c2.1 0 3.6 1.6 3.6 3.5 0 1.7-1.4 3.1-3.2 3.1H7.2V4.2h.8V1.4z"/></svg>`;
    }

    function actionMark(intent, big) {
      const size = big ? "big" : "small";
      if (intent.type === "attack") {
        return `<span class="act attack ${size}" aria-label="攻撃 ${intent.value}">${swordIcon()}<b>${intent.value}</b></span>`;
      }
      if (intent.type === "block") {
        return `<span class="act block ${size}" aria-label="シールド ${intent.value}">${shieldIcon()}<b>${intent.value}</b></span>`;
      }
      return `<span class="act skill ${size}" aria-label="スキル">★</span>`;
    }

    function intentAt(offset) {
      const pattern = enemyNow().pattern;
      return pattern[(intentIndex + offset) % pattern.length];
    }

    function applyDamage(target, amount) {
      const blocked = Math.min(target.block, amount);
      target.block -= blocked;
      const hpLoss = amount - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      target.hit = true;
      return { blocked, hpLoss };
    }

    function shownEnemy() {
      return shown.enemy == null ? enemy.hp : shown.enemy;
    }

    function shownPlayer() {
      return shown.player == null ? player.hp : shown.player;
    }

    function bindShown() {
      if (player) shown.player = player.hp;
      if (enemy) shown.enemy = enemy.hp;
    }

    function drainMs() {
      const enemyGap = enemy ? Math.abs(enemy.hp - shownEnemy()) : 0;
      const playerGap = player ? Math.abs(player.hp - shownPlayer()) : 0;
      const gap = Math.max(enemyGap, playerGap);
      if (gap < 0.2) return 0;
      return Math.min(2400, Math.max(900, (gap / 4) * 1000));
    }

    function paintShown() {
      for (const who of ["enemy", "player"]) {
        const hp = who === "enemy" ? shown.enemy : shown.player;
        const max = who === "enemy" ? enemy && enemy.maxHp : player && player.maxHp;
        if (hp == null || !max) continue;
        const bar = root.querySelector(`[data-bar="${who}"]`);
        if (bar) bar.style.width = `${Math.max(0, Math.min(100, (hp / max) * 100))}%`;
        const text = String(Math.max(0, Math.round(hp)));
        root.querySelectorAll(`[data-hp="${who}"]`).forEach((el) => { el.textContent = text; });
      }
    }

    function pumpHp(stamp) {
      const dt = hpStamp ? Math.min(0.05, (stamp - hpStamp) / 1000) : 0.016;
      hpStamp = stamp;
      const ease = (current, target) => {
        const diff = target - current;
        if (Math.abs(diff) < 0.04) return target;
        const speed = Math.max(4, Math.abs(diff) / 2.4);
        return current + Math.sign(diff) * Math.min(Math.abs(diff), speed * dt);
      };
      let moving = false;
      if (enemy && shown.enemy != null && Math.abs(shown.enemy - enemy.hp) >= 0.04) {
        shown.enemy = ease(shown.enemy, enemy.hp);
        moving = true;
      } else if (enemy) shown.enemy = enemy.hp;
      if (player && shown.player != null && Math.abs(shown.player - player.hp) >= 0.04) {
        shown.player = ease(shown.player, player.hp);
        moving = true;
      } else if (player) shown.player = player.hp;
      paintShown();
      hpFrame = moving ? requestAnimationFrame(pumpHp) : 0;
    }

    function kickHp() {
      if (player && shown.player == null) shown.player = player.hp;
      if (enemy && shown.enemy == null) shown.enemy = enemy.hp;
      hpStamp = 0;
      if (hpFrame) cancelAnimationFrame(hpFrame);
      hpFrame = requestAnimationFrame(pumpHp);
    }

    function damageSentence(label, raw, result) {
      if (result.blocked && result.hpLoss) {
        return `${label}の${raw}ダメージ。ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      }
      if (result.blocked) {
        return `${label}の${raw}ダメージをブロックで防いだ。`;
      }
      return `${label}の${raw}ダメージ。`;
    }

    function mitigate(amount, defense) {
      const reduced = Math.min(Math.max(0, defense || 0), Math.max(0, amount));
      return { reduced, dealt: amount - reduced };
    }

    function hurtSentence(label, raw, reduced, result) {
      if (!reduced) return damageSentence(label, raw, result);
      if (!result.hpLoss && !result.blocked) return `${label}の${raw}ダメージ。防御で防いだ。`;
      if (result.blocked && result.hpLoss) {
        return `${label}の${raw}ダメージ。防御で${reduced}軽減し、ブロックで${result.blocked}防ぎ、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${label}の${raw}ダメージ。防御で${reduced}軽減し、残りはブロックで防いだ。`;
      return `${label}の${raw}ダメージ。防御で${reduced}軽減し、体力${result.hpLoss}。`;
    }

    function strikeSentence(label, base, bonus, result) {
      if (!bonus) return damageSentence(label, base, result);
      if (result.blocked && result.hpLoss) {
        return `${label}の${base}ダメージ。攻撃で${bonus}加算し、ブロックで${result.blocked}軽減し、体力${result.hpLoss}。`;
      }
      if (result.blocked) return `${label}の${base}ダメージ。攻撃で${bonus}加算し、ブロックで防いだ。`;
      return `${label}の${base}ダメージ。攻撃で${bonus}加算し、${base + bonus}。`;
    }

    function noteHit(side, landed, swung) {
      const n = landed > 0 ? landed : swung;
      if (n > 0) fxHit = { side, n };
    }

    function takeEnemyHit(raw, label) {
      const cut = mitigate(raw, player.def);
      const result = applyDamage(player, cut.dealt);
      if (result.hpLoss > 0) {
        fxHurt = true;
        noteHit("player", result.hpLoss, cut.dealt);
      }
      log(hurtSentence(label || enemy.name, raw, cut.reduced, result));
    }

    function buildDeck() {
      const specs = [];
      for (const [name, count] of CARD_POOL) {
        for (let i = 0; i < count; i++) {
          specs.push({ uid: uid++, name, ...CARDS[name] });
        }
      }
      for (const extra of stolen) specs.push({ uid: uid++, ...extra });
      deck = shuffle(specs);
      hand = [];
      discard = [];
      inPlay = [];
      resolveAt = 0;
    }

    function draw(n) {
      for (let i = 0; i < n; i++) {
        if (!deck.length) {
          if (!discard.length) break;
          deck = shuffle(discard);
          discard = [];
          log("捨て札を山札に戻した。");
        }
        hand.push(deck.pop());
      }
    }

    function resolveCard(card) {
      if (card.damage) {
        const bonus = player.atk || 0;
        const amount = card.damage + bonus;
        const result = applyDamage(enemy, amount);
        if (amount > 0 && (result.hpLoss || result.blocked)) {
          fxSlash = true;
          noteHit("enemy", result.hpLoss, amount);
        }
        log(strikeSentence(card.name, card.damage, bonus, result));
      }
      if (card.block) {
        player.block += card.block;
        log(`${card.name}でブロック${card.block}。いま${player.block}。`);
      }
      if (!card.damage && !card.block) log(`${card.name}。${card.text}`);
    }

    function playCard(index) {
      if (phase !== "player" || outcome) return;
      const card = hand[index];
      if (!card) return;
      if (player.energy < card.cost) {
        note = "マナが足りない";
        render();
        return;
      }
      player.energy -= card.cost;
      hand.splice(index, 1);
      inPlay.push(card);
      note = "";
      if (autoEndTurn && player.energy <= 0 && !hand.some((card) => card.cost === 0)) {
        endTurn();
        return;
      }
      render();
    }

    function scrapPlay() {
      while (inPlay.length) discard.push(inPlay.shift());
      resolveAt = 0;
    }

    function finishResolve() {
      timer = null;
      scrapPlay();
      banner = "";
      startPlayerTurn();
    }

    function stepResolve() {
      timer = null;
      const enemyIndex = inPlay.length;
      if (phase !== "resolve" || resolveAt > enemyIndex) {
        finishResolve();
        return;
      }
      const index = resolveAt;
      resolveAt += 1;
      if (index < enemyIndex) {
        resolveCard(inPlay[index]);
        if (enemy.hp <= 0) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
      } else {
        const card = intentAt(0);
        enemy.block = 0;
        if (card.damage) {
          takeEnemyHit(card.damage, card.name);
        } else if (card.block) {
          enemy.block += card.block;
          log(`${enemy.name}の${card.name}。ブロック${card.block}。`);
        } else {
          log(`${enemy.name}の${card.name}。${card.text}`);
        }
        intentIndex = (intentIndex + 1) % enemyNow().pattern.length;
        if (player.hp <= 0) {
          scrapPlay();
          scheduleFinish("lose");
          return;
        }
      }
      render();
      const wait = Math.max(720, drainMs());
      timer = setTimeout(resolveAt > enemyIndex ? finishResolve : stepResolve, wait);
    }

    function endTurn() {
      if (phase !== "player" || outcome) return;
      phase = "resolve";
      resolveAt = 0;
      while (hand.length) discard.push(hand.pop());
      note = "";
      render();
      timer = setTimeout(stepResolve, 480);
    }

    function startPlayerTurn() {
      if (player.hp <= 0) {
        finish("lose");
        return;
      }
      turn += 1;
      player.block = 0;
      player.maxEnergy = MANA;
      player.energy = MANA;
      draw(3);
      fxDeal = true;
      phase = "player";
      render();
    }

    function finish(kind) {
      clearTimer();
      outcome = kind;
      phase = "end";
      banner = "";
      log(kind === "win" ? `${enemy.name}を倒した。` : "倒された。");
      if (kind === "win" && battleIndex >= BATTLE_TOTAL - 1) cleared = true;
      if (kind === "win") persistSave(true);
      render();
    }

    function scheduleFinish(kind) {
      phase = "end";
      const wait = Math.max(720, drainMs());
      clearTimer();
      render();
      timer = setTimeout(() => finish(kind), wait);
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (typeof saved.showLog === "boolean") showLog = saved.showLog;
        if (typeof saved.autoEndTurn === "boolean") autoEndTurn = saved.autoEndTurn;
      } catch (error) {
        showLog = true;
        autoEndTurn = true;
      }
    }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ showLog, autoEndTurn }));
    }

    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function battleSnapshot() {
      return {
        v: 1,
        cleared,
        battleIndex,
        turn,
        intentIndex,
        phase,
        note,
        banner,
        outcome,
        logLines,
        deck,
        hand,
        discard,
        inPlay,
        resolveAt,
        player,
        enemy,
        gear,
        stolen,
      };
    }

    function persistSave(silent) {
      localStorage.setItem(SAVE_KEY, JSON.stringify(battleSnapshot()));
      if (!silent) {
        saveNote = "セーブした";
        render();
      }
    }

    function readLive() {
      try {
        return JSON.parse(localStorage.getItem(LIVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function persistLive() {
      if (!player || !enemy) return;
      localStorage.setItem(LIVE_KEY, JSON.stringify(battleSnapshot()));
    }

    function clearLive() {
      localStorage.removeItem(LIVE_KEY);
    }

    function applySave(data) {
      cleared = !!data.cleared;
      battleIndex = data.battleIndex || 0;
      turn = data.turn || 0;
      intentIndex = data.intentIndex || 0;
      phase = data.phase || "player";
      note = data.note || "";
      banner = data.banner || "";
      outcome = data.outcome || null;
      logLines = data.logLines || [];
      deck = data.deck || [];
      hand = data.hand || [];
      discard = data.discard || [];
      inPlay = Array.isArray(data.inPlay) ? data.inPlay : [];
      resolveAt = data.resolveAt || 0;
      player = data.player;
      enemy = data.enemy;
      if (player) {
        player.hit = false;
        player.atk = player.atk || 0;
        player.def = player.def || 0;
        player.maxHp = 30;
        if (player.hp > player.maxHp) player.hp = player.maxHp;
        player.maxEnergy = MANA;
        if (player.energy > MANA) player.energy = MANA;
      }
      if (enemy) enemy.hit = false;
      gear = normalizeGear(data.gear);
      gearOpen = null;
      stolen = Array.isArray(data.stolen) ? data.stolen : [];
      saveNote = "";
      bindShown();
    }

    function startBattle(keepHp) {
      clearTimer();
      screen = "battle";
      cleared = false;
      const hp = keepHp == null ? 30 : Math.min(30, keepHp);
      player = { hp, maxHp: 30, block: 0, energy: 0, maxEnergy: 0, atk: 0, def: 0, hit: false };
      const foe = enemyNow();
      enemy = { name: foe.name, hp: foe.hp, maxHp: foe.hp, block: 0, hit: false };
      bindShown();
      turn = 0;
      intentIndex = 0;
      phase = "player";
      note = "";
      banner = "";
      outcome = null;
      askLeave = false;
      logLines = [];
      saveNote = "";
      buildDeck();
      startPlayerTurn();
    }

    function beginRun() {
      battleIndex = 0;
      cleared = false;
      gear = emptyGear();
      gearOpen = null;
      stolen = [];
      startBattle(30);
    }

    function continueGame() {
      const data = readSave();
      if (!data) return;
      clearTimer();
      applySave(data);
      screen = data.outcome === "win" ? "battle" : data.cleared ? "clear" : "battle";
      render();
    }

    function goTitle() {
      clearTimer();
      askLeave = false;
      clearLive();
      screen = "title";
      saveNote = "";
      render();
    }

    function resumeLive() {
      const data = readLive();
      if (!data || !data.player || !data.enemy) return false;
      clearTimer();
      applySave(data);
      askLeave = false;
      screen = data.outcome === "win" ? "battle" : data.cleared ? "clear" : "battle";
      if (screen === "battle" && !outcome && enemy && enemy.hp <= 0) {
        finish("win");
        return true;
      }
      if (screen === "battle" && !outcome && player && player.hp <= 0) {
        finish("lose");
        return true;
      }
      if (screen === "battle" && phase === "resolve" && !outcome) {
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "enemy" && !outcome) {
        phase = "resolve";
        resolveAt = inPlay.length;
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "recoil" && !outcome) {
        render();
        timer = setTimeout(startPlayerTurn, 650);
      } else {
        render();
      }
      return true;
    }

    function meters(who, hp, maxHp, block) {
      const hpPct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
      const blockPct = Math.max(0, Math.min(100, (block / maxHp) * 100));
      const shield = block > 0 ? `<div class="meter shield" style="width:${blockPct}%"><span></span></div>` : "";
      return `<div class="meters">${shield}<div class="meter hp"><span data-bar="${who}" style="width:${hpPct}%"></span></div></div>`;
    }

    function pips() {
      return Array.from({ length: player.maxEnergy }, (_, i) =>
        `<i class="pip${i < player.energy ? " on" : ""}"></i>`
      ).join("");
    }

    function menuButton(label, action, primary, disabled) {
      return `<button type="button" class="${primary ? "primary" : ""}" data-action="${action}" ${disabled ? "disabled" : ""}>${esc(label)}</button>`;
    }

    function renderTitle() {
      root.innerHTML = `
        <div class="title-screen">
          <div class="title-hero">
            <img class="title-art" src="title-art.jpg" alt="">
            <h1>わちゅえりカードゲーム</h1>
          </div>
          <div class="title-actions">
            ${menuButton("はじめから", "new", true)}
            ${menuButton("つづきから(あいことば)", "continue", false, !readSave())}
            ${menuButton("せってい", "settings")}
          </div>
        </div>`;
    }

    function renderSettings() {
      root.innerHTML = `
        <div class="menu">
          <h1>せってい</h1>
          ${menuButton(showLog ? "ログの表示：オン" : "ログの表示：オフ", "toggle-log", true)}
          ${menuButton(autoEndTurn ? "使い切ったらターン終了：オン" : "使い切ったらターン終了：オフ", "toggle-auto-end", true)}
          <p>マナが0になったら、ターンを終える。手札にコスト0があるときは終わらない。</p>
          ${menuButton("もどる", "back")}
        </div>`;
    }

    function renderConfirm() {
      root.innerHTML = `
        <div class="menu">
          <h1>はじめから</h1>
          <p>今のセーブは消える。</p>
          ${menuButton("消してはじめる", "new-force", true)}
          ${menuButton("もどる", "title")}
        </div>`;
    }

    function renderClear() {
      root.innerHTML = `
        <div class="menu">
          <h1>クリア</h1>
          <p>3つの戦いに勝った。</p>
          ${menuButton("タイトルへ", "title", true)}
        </div>`;
    }

    function render() {
      if (screen === "title") return renderTitle();
      if (screen === "settings") return renderSettings();
      if (screen === "confirm") return renderConfirm();
      if (screen === "clear") return renderClear();
      renderBattle();
    }

    function pileMarkup(kind, count) {
      const label = kind === "deck" ? "山札" : "捨て札";
      const empty = count === 0;
      const stack = count > 1 ? " stack" : "";
      const look = empty ? "empty" : kind === "deck" ? "back" : "back discard";
      return `<div class="pile" aria-label="${label} ${count}"><div class="pile-card ${look}${stack}"><span class="pile-count">${count}</span></div><div class="pile-label">${label}</div></div>`;
    }

    function cardKind(card) {
      if (card.damage && !card.block) return "attack";
      if (card.block && !card.damage) return "block";
      return "skill";
    }

    function cardFace(card) {
      const effects = [
        card.damage ? `<span class="fx attack">${swordIcon()}<b>${card.damage}</b></span>` : "",
        card.block ? `<span class="fx block">${shieldIcon()}<b>${card.block}</b></span>` : "",
      ].join("") || `<span class="fx">${esc(card.text)}</span>`;
      return `<div class="face"><span class="cost">${card.cost}</span><div class="name">${esc(card.name)}</div><div class="art" aria-hidden="true"></div></div><div class="text">${effects}</div>`;
    }

    function playFace(card, on) {
      return `<div class="play-card${on ? " on" : ""}"><div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div></div>`;
    }

    function playRow() {
      const foe = intentAt(0);
      const hot = phase === "resolve" ? resolveAt - 1 : -1;
      const mine = inPlay.map((card, i) => playFace(card, hot === i)).join("");
      return `<div class="play-row" aria-label="プレイエリア"><div class="play-side foe"><span class="play-label">敵</span>${playFace(foe, hot === inPlay.length)}</div><div class="play-side mine"><span class="play-label">自分</span><div class="play-cards">${mine}</div></div></div>`;
    }

    function foeNext() {
      const card = intentAt(0);
      return `<div class="foe-next"><div class="card preview ${cardKind(card)}" aria-label="次のカード ${card.cost} ${esc(card.name)}">${cardFace(card)}</div></div>`;
    }

    function traitNote() {
      const trait = enemyNow().trait;
      if (!trait) return "";
      return `<aside class="trait-note"><span class="trait-label">特性</span><span>${esc(trait)}</span></aside>`;
    }

    function sortedCards(cards) {
      return cards.slice().sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name, "ja"));
    }

    function deckGroup(label, cards) {
      const faces = sortedCards(cards).map((card) =>
        `<div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div>`
      ).join("");
      return `<section class="deck-group"><h3>${label} ${cards.length}</h3><div class="deck-cards">${faces || `<p class="deck-empty">なし</p>`}</div></section>`;
    }

    function deckOverlay() {
      if (!showDeck || outcome || askLeave) return "";
      return `<div class="overlay deck-view"><div class="panel"><h2>デッキ</h2>${deckGroup("山札", deck)}${deckGroup("手札", hand)}${deckGroup("プレイ", inPlay)}${deckGroup("捨て札", discard)}<button type="button" data-action="close-deck">閉じる</button></div></div>`;
    }

    function rewardCards() {
      const seen = new Set();
      const list = [];
      for (const card of enemyNow().pattern) {
        if (seen.has(card.name)) continue;
        seen.add(card.name);
        list.push(card);
      }
      return list;
    }

    function finishReward(name) {
      if (name) {
        const card = enemyNow().pattern.find((item) => item.name === name);
        if (card) stolen.push({ name: card.name, cost: card.cost, text: card.text, damage: card.damage, block: card.block });
      }
      outcome = null;
      if (battleIndex >= BATTLE_TOTAL - 1) {
        cleared = true;
        screen = "clear";
        clearLive();
        persistSave(true);
        render();
        return;
      }
      battleIndex += 1;
      startBattle(player.hp);
    }

    function renderBattle() {
      const dealNow = fxDeal;
      const cards = hand.map((card, i) => {
        const poor = player.energy < card.cost;
        const mid = (hand.length - 1) / 2;
        const fan = (i - mid) * 8;
        const drop = Math.abs(i - mid) * 12;
        const label = `${card.cost} ${card.name} ${String(card.text).replace(/\n/g, " ")}`;
        return `<button type="button" class="card ${cardKind(card)}${poor ? " unaffordable" : ""}${dealNow ? " deal" : ""}" data-card="${i}" aria-label="${esc(label)}" style="--fan:${fan}deg;--drop:${drop}px;--deal:${i};z-index:${i + 1}" ${phase !== "player" ? "disabled" : ""}>${cardFace(card)}</button>`;
      }).join("");
      const picks = rewardCards().map((card) => `<div class="reward-pick"><div class="card preview ${cardKind(card)}">${cardFace(card)}</div><button type="button" data-action="loot" data-loot="${esc(card.name)}">奪う</button></div>`).join("");
      const overlay = outcome === "win"
        ? `<div class="overlay"><div class="panel"><h2>勝った</h2><p>カードを1枚奪える。</p><div class="reward-row">${picks}</div><button type="button" class="ghost" data-action="skip-loot">スキップ</button></div></div>`
        : outcome === "lose"
        ? `<div class="overlay"><div class="panel">
            <h2>倒された</h2>
            <p>つづきからは、最後のセーブに戻る。</p>
            <button type="button" data-action="title">タイトルへ</button>
          </div></div>`
        : "";
      const leaveOverlay = askLeave
        ? `<div class="overlay"><div class="panel">
            <h2>タイトルに戻る？</h2>
            <p>終わっていない戦いは残らない。</p>
            <button type="button" data-action="title">タイトルへ戻る</button>
            <button type="button" class="ghost" data-action="stay">戦いを続ける</button>
          </div></div>`
        : "";

      const slashNow = fxSlash;
      const hurtNow = fxHurt;
      const hitNow = fxHit;
      fxSlash = false;
      fxHurt = false;
      fxHit = null;
      fxDeal = false;
      const logHtml = logLines.map((line) => `<p>${esc(line)}</p>`).join("");
      const enemyShown = Math.round(shownEnemy());
      const playerShown = Math.round(shownPlayer());
      root.innerHTML = `
        <div class="battle-screen${hurtNow ? " hurt" : ""}">
        ${hurtNow ? `<div class="screen-hurt" aria-hidden="true"></div>` : ""}
        ${hurtNow && hitNow && hitNow.side === "player" ? `<b class="dmg-pop me">${hitNow.n}</b>` : ""}
        <aside class="gear-rail"><h2>装備</h2>${gearMarkup()}${gearEffectText()}<div class="party-attrs" aria-label="ステータス"><div class="vitals">${meters("player", shownPlayer(), player.maxHp, player.block)}<div class="hp-line">体力 <b data-hp="player">${playerShown}</b> / ${player.maxHp}</div></div><div class="attr hp"><span class="mark">${heartIcon()}</span><span>HP</span><b>${player.maxHp}</b></div><div class="attr atk"><span class="mark">${swordIcon()}</span><span>ATK</span><b>${signed(player.atk)}</b></div><div class="attr def"><span class="mark">${shieldIcon()}</span><span>DEF</span><b>${signed(player.def)}</b></div><div class="attr spd"><span class="mark">${bootIcon()}</span><span>SPD</span><b>${hand.length}</b></div><div class="attr nrg"><span class="mark">${manaIcon()}</span><span>NRG</span><b>${player.energy}</b></div></div></aside>
        <div class="game">
          <header class="hud-top">
            <div class="dungeon">
              <h1 class="dungeon-name">${esc(DUNGEON_NAME)}</h1>
              <div class="dungeon-progress">${battleIndex + 1}/${BATTLE_TOTAL}</div>
            </div>
            <div class="hud-actions">
              <button type="button" class="small-btn" data-action="deck">デッキ確認</button>
              <button type="button" class="small-btn" data-action="settings">せってい</button>
              <button type="button" class="small-btn" data-action="ask-title" ${phase === "player" ? "" : "disabled"}>タイトル</button>
            </div>
          </header>
          <div class="stage">
            <div class="enemy-field">
            ${traitNote()}
            <div class="enemy-main">
            <div class="sprite${slashNow ? " slash" : ""}" aria-hidden="true">
              <i class="eye l"></i><i class="eye r"></i>
              ${slashNow ? `<span class="cut a"></span><span class="cut b"></span><span class="cut c"></span>` : ""}
              ${slashNow && hitNow && hitNow.side === "enemy" ? `<b class="dmg-pop">${hitNow.n}</b>` : ""}
            </div>
            <section class="enemy vitals" data-rank="${esc(enemyNow().rank || "普通")}">
              <h2>${esc(enemy.name)}</h2>
              ${meters("enemy", shownEnemy(), enemy.maxHp, enemy.block)}
              <div class="hp-line">体力 <b data-hp="enemy">${enemyShown}</b> / ${enemy.maxHp}</div>
            </section>
            <div class="banner">${esc(banner)}</div>
            <div class="note">${esc(note)}</div>
            </div>
            ${foeNext()}
            </div>
          </div>
          ${playRow()}
          <section class="party">
            <div class="party-band">
            <div class="party-stats">
              <div class="energy-pips" aria-label="NRG ${player.energy}">${pips()}</div>
            </div>
            </div>
            <div class="handbar">
              ${pileMarkup("deck", deck.length)}
              <div class="hand">${cards}</div>
              ${pileMarkup("discard", discard.length)}
              <button type="button" class="end" data-end ${phase === "player" ? "" : "disabled"}>ターン終了</button>
            </div>
          </section>
        </div>
        ${showLog ? `<aside class="battle-log"><h2>ログ</h2>${logHtml}</aside>` : ""}
        </div>
        ${deckOverlay()}
        ${overlay}
        ${leaveOverlay}`;
      player.hit = false;
      enemy.hit = false;
      persistLive();
      kickHp();
    }

    root.addEventListener("click", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      const action = el.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "title") goTitle();
        if (name === "ask-title") { askLeave = true; showDeck = false; render(); }
        if (name === "deck") { showDeck = true; render(); }
        if (name === "close-deck") { showDeck = false; render(); }
        if (name === "stay") { askLeave = false; render(); }
        if (name === "settings") { returnScreen = screen; screen = "settings"; render(); }
        if (name === "back") { screen = returnScreen; render(); }
        if (name === "toggle-log") { showLog = !showLog; persistSettings(); render(); }
        if (name === "toggle-auto-end") { autoEndTurn = !autoEndTurn; persistSettings(); render(); }
        if (name === "new") {
          if (readSave()) { screen = "confirm"; render(); }
          else beginRun();
        }
        if (name === "new-force") { localStorage.removeItem(SAVE_KEY); clearLive(); beginRun(); }
        if (name === "continue") continueGame();
        if (name === "loot") finishReward(action.dataset.loot || "");
        if (name === "skip-loot") finishReward("");
        return;
      }
      if (screen !== "battle") return;
      const gearBtn = el.closest("[data-gear]");
      if (gearBtn) {
        const id = gearBtn.dataset.gear;
        gearOpen = gearOpen === id ? null : id;
        render();
        return;
      }
      const card = el.closest("[data-card]");
      if (card) playCard(Number(card.dataset.card));
      if (el.closest("[data-end]")) endTurn();
    });

    document.addEventListener("keydown", (event) => {
      if (screen !== "battle" || askLeave) return;
      if (showDeck) {
        if (event.key === "Escape") { showDeck = false; render(); }
        return;
      }
      if (event.key === "Enter") endTurn();
      if (event.key === "1" || event.key === "2" || event.key === "3") {
        playCard(Number(event.key) - 1);
      }
    });

    loadSettings();
    if (!resumeLive()) render();
  </script>
</body>
</html>
