        log(`${heroName()}は${card.name}で${hand.length - before}枚引いた。`, card);
        return;
      }
      if (card.redTimes) {
        const reds = inPlay.filter((item) => cardKind(item) === "attack").length;
        const added = player.focus ? player.focus : 0;
        if (added) player.focus = 0;
        strike(card, reds * card.redTimes + (player.atk || 0) + added);
        return;
      }
      if (card.counter) {
        const reds = inPlay.filter((item) => cardKind(item) === "attack").length;
        if (reds) {
          log(`${heroName()}は${card.name}。プレイエリアにアタックがあるので、発動しない。`, card);
          return;
        }
        strike(card, card.counter);
        return;
      }
      if (card.hits) {
        const added = player.focus ? player.focus : 0;
        if (added) player.focus = 0;
        const atk = player.atk || 0;
        for (let hit = 0; hit < card.hits; hit++) strike(card, card.damage + atk + (hit === 0 ? added : 0));
        return;
      }
      const added = player.focus && (card.damage || card.block) ? player.focus : 0;
      if (added) player.focus = 0;
      if (card.burnFirst && card.burn) {
        addBurn(enemy, card.burn);
        log(`${heroName()}は${card.name}。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
      if (card.damage) {
        let bonus = 0;
        if (card.fullBonus && player.hp >= player.maxHp) bonus += card.fullBonus;
        if (card.safeBonus && !player.hurtLast) bonus += card.safeBonus;
        if (card.kick && enemy.block > 0) bonus += card.kick;
        const atk = player.atk || 0;
        strike(card, rollCrit(card, card.damage) + added + atk + bonus);
      }
      if (card.burn && !card.burnFirst) {
        addBurn(enemy, card.burn);
        log(`${heroName()}は${card.name}。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
      if (card.expose) {
        player.expose = (Number(player.expose) || 0) + card.expose;
        log(`${heroName()}は次に受けるダメージ+${player.expose}。`, card);
      }
      if (card.parry && card.damage) gainParry(card);
      if (card.block) gainBlock(card.block + added, card);
      if (card.nextDraw) {
        player.extraDraw = (Number(player.extraDraw) || 0) + card.nextDraw;
        log(`${heroName()}は次のターンに${card.nextDraw}枚多く引く。`, card);
      }
      if (!card.damage && !card.block && !card.expose && !card.nextDraw && !card.burn) log(`${heroName()}は${card.name}。${card.text}`, card);
    }

    function cardPlayable(card) {
      if (!card) return false;
      if ((Number(card.cost) || 0) > player.energy) return false;
      if (card.headbutt && !inPlay.length) return false;
      if (card.halfOnly && !hpHalf(player)) return false;
      if (card.fullOnly && player.hp < player.maxHp) return false;
      return true;
    }

    function playCard(index) {
      if (phase !== "player" || outcome) return false;
      const card = hand[index];
      if (!card) return false;
      if (player.energy < card.cost) {
        note = "";
        fxNoMana = true;
        render();
        return false;
      }
      if (card.headbutt && !inPlay.length) {
        note = "プレイエリアの自分のカードを廃棄すると使える";
        render();
        return false;
      }
      if (card.fullOnly && player.hp < player.maxHp) {
        note = "体力が満タンのときだけ使える";
        render();
        return false;
      }
      spendEnergy(card.cost);
      hand.splice(index, 1);
      if (card.quick) {
        resolveCard(card);
        discard.push(card);
        note = "";
        pullFromBracelets();
        if (finishIfStuck()) return true;
        render();
        return true;
      }
      if (card.headbutt) {
        const names = inPlay.map((item) => item.name).join("、");
        capturePlayClearFlights(null, "exile");
        while (inPlay.length) battleExile.push(inPlay.shift());
        log(`${heroName()}は${names}を廃棄した。`);
      }
      inPlay.push(card);
      note = "";
      pullFromBracelets();
      if (finishIfStuck()) return true;
      render();
      return true;
    }

    function noPlayableHand() {
      return !hand.some((card) => cardPlayable(card));
    }

    function finishIfStuck() {
      if (phase !== "player" || outcome || !noPlayableHand()) return false;
      if (!hand.length || autoEndTurn) {
        endTurn();
        return true;
      }
      return false;
    }

    function handCardBox(index) {
      const cardEl = document.querySelector(`.hand [data-card="${index}"]`);
      if (!cardEl) return null;
      const rect = cardEl.getBoundingClientRect();
      return {
        cx: rect.left + rect.width / 2,
        cy: rect.top + rect.height / 2,
        w: rect.width,
        h: rect.height,
        fan: parseFloat(cardEl.style.getPropertyValue("--fan")) || 0,
      };
    }

    function flyCardToPlay(from) {
      if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(".play-side.mine .play-card:last-child .card");
      if (!target) return;
      const to = target.getBoundingClientRect();
      if (!to.width || !to.height || !from.w || !from.h) return;
      const ghost = target.cloneNode(true);
      const kind = target.classList.contains("attack") ? "attack" : target.classList.contains("block") ? "block" : target.classList.contains("power") ? "power" : "skill";
      ghost.className = `card fly-card ${kind}`;
      ghost.style.left = `${from.cx - from.w / 2}px`;
      ghost.style.top = `${from.cy - from.h / 2}px`;
      ghost.style.width = `${from.w}px`;
      ghost.style.height = `${from.h}px`;
      ghost.style.transition = "none";
      ghost.style.transform = `rotate(${from.fan}deg)`;
      document.body.appendChild(ghost);
      target.style.visibility = "hidden";
      const dx = to.left + to.width / 2 - from.cx;
      const dy = to.top + to.height / 2 - from.cy;
      const scale = to.height / from.h;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
        if (target.isConnected) target.style.visibility = "";
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 560);
    }

    function playFromHand(index) {
      const card = hand[index];
      const from = handCardBox(index);
      if (!playCard(index)) return;
      if (!card || !card.quick) flyCardToPlay(from);
    }

    function goesToDiscard(card) {
      if (!card) return false;
      if (card.power || card.instant || card.kind === "power") return false;
      return true;
    }

    let pendingPlayClearFly = [];

    function makeFlyGhost(el) {
      const rect = el.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      const ghost = el.cloneNode(true);
      ghost.classList.add("fly-card");
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${rect.top}px`;
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.height}px`;
      ghost.style.margin = "0";
      ghost.style.transition = "none";
      ghost.style.transform = "none";
      ghost.style.opacity = "1";
      document.body.appendChild(ghost);
      return { ghost, from: rect };
    }

    function captureFoeLeave() {
      foeLeaveGhost = null;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const el = document.querySelector(".play-side.foe .play-card .card");
      if (!el) return;
      foeLeaveGhost = makeFlyGhost(el);
    }

    function showFoePlay(play) {
      if (!play) return;
      const wrap = play.closest(".play-card");
      if (wrap) wrap.classList.remove("await-draw");
    }

    function flyFoeFromDeck(play) {
      if (!play || !play.isConnected) return;
      const deck = document.querySelector(".foe-pile .pile-card");
      if (!deck) {
        showFoePlay(play);
        return;
      }
      const from = deck.getBoundingClientRect();
      const to = play.getBoundingClientRect();
      if (!from.width || !to.width) {
        showFoePlay(play);
        return;
      }
      const ghost = play.cloneNode(true);
      ghost.classList.add("fly-card");
      ghost.style.visibility = "visible";
      ghost.style.position = "fixed";
      ghost.style.zIndex = "70";
      ghost.style.left = `${from.left}px`;
      ghost.style.top = `${from.top}px`;
      ghost.style.width = `${from.width}px`;
      ghost.style.height = `${from.height}px`;
      ghost.style.margin = "0";
      ghost.style.transition = "none";
      document.body.appendChild(ghost);
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      const scale = to.height / from.height;
      const finish = () => {
        if (ghost.dataset.landed) return;
        ghost.dataset.landed = "1";
        ghost.remove();
        showFoePlay(play);
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 520);
    }

    function flyDiscardIntoDeck(done) {
      const fromEl = document.querySelector(".foe-discard .pile-card");
      const toEl = document.querySelector(".foe-pile .pile-card");
      if (!fromEl || !toEl || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        done();
        return;
      }
      const from = fromEl.getBoundingClientRect();
      const to = toEl.getBoundingClientRect();
      if (!from.width || !to.width) {
        done();
        return;
      }
      const ghost = fromEl.cloneNode(true);
      ghost.classList.add("fly-card");
      ghost.style.position = "fixed";
      ghost.style.zIndex = "70";
      ghost.style.left = `${from.left}px`;
      ghost.style.top = `${from.top}px`;
      ghost.style.width = `${from.width}px`;
      ghost.style.height = `${from.height}px`;
      ghost.style.margin = "0";
      ghost.style.transition = "none";
      document.body.appendChild(ghost);
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      let landed = false;
      const finish = () => {
        if (landed) return;
        landed = true;
        ghost.remove();
        done();
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.7s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px)`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 820);
    }

    function launchFoeTurnTravel() {
      const leave = foeLeaveGhost;
      const draw = foeDrawPending;
      foeLeaveGhost = null;
      foeDrawPending = false;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        showFoePlay(document.querySelector(".play-side.foe .play-card .card"));
        if (leave) leave.ghost.remove();
        return;
      }
      if (!leave && !draw) return;
      const play = document.querySelector(".play-side.foe .play-card .card");
      const goDraw = () => {
        if (!draw) return;
        flyFoeFromDeck(play);
      };
      if (!leave) {
        goDraw();
        return;
      }
      const dest = document.querySelector(".foe-discard .pile-card");
      if (!dest) {
        leave.ghost.remove();
        goDraw();
        return;
      }
      const to = dest.getBoundingClientRect();
      const from = leave.from;
      const ghost = leave.ghost;
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      const scale = Math.max(0.22, to.height / Math.max(1, from.height));
      const finish = () => {
        if (ghost.dataset.landed) return;
        ghost.dataset.landed = "1";
        ghost.remove();
        goDraw();
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.48s cubic-bezier(0.22, 0.7, 0.18, 1), opacity 0.42s ease 80ms";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-18deg) scale(${scale})`;
          ghost.style.opacity = "0.2";
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 560);
    }

    // プレイエリアの自分のカード：捨て札へ／廃棄へ飛ばす準備（次の描画のあとで動かす）
    // forceMode があれば全枚その行き先（頭突きの一括廃棄など）
    function capturePlayClearFlights(cards, forceMode) {
      pendingPlayClearFly.forEach((item) => item.ghost.remove());
      pendingPlayClearFly = [];
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const list = cards || inPlay;
      const nodes = [...document.querySelectorAll(".play-side.mine .play-card .card")];
      nodes.forEach((el, i) => {
        const card = list[i];
        if (!card) return;
        const made = makeFlyGhost(el);
        if (!made) return;
        const mode = forceMode || (goesToDiscard(card) ? "discard" : "exile");
        pendingPlayClearFly.push({ ...made, mode });
      });
    }

    function launchPendingPlayClearFly() {
      const flights = pendingPlayClearFly;
      pendingPlayClearFly = [];
      if (!flights.length) return 0;
      const discards = flights.filter((item) => item.mode === "discard");
      const exiles = flights.filter((item) => item.mode === "exile");
      const dest = document.querySelector('[data-pile="discard"] .pile-card');
      const countEl = dest && dest.querySelector(".pile-count");
      const finalCount = discard.length;
      const startCount = Math.max(0, finalCount - discards.length);
      if (countEl) countEl.textContent = String(startCount);
      let landed = 0;
      let maxWait = 0;

      discards.forEach((item, i) => {
        if (!dest) {
          item.ghost.remove();
          return;
        }
        const to = dest.getBoundingClientRect();
        const from = item.from;
        const ghost = item.ghost;
        const dx = to.left + to.width / 2 - (from.left + from.width / 2);
        const dy = to.top + to.height / 2 - (from.top + from.height / 2);
        const scale = Math.max(0.22, to.height / from.height);
        const delay = i * 70;
        maxWait = Math.max(maxWait, 560 + delay);
        const finish = () => {
          if (ghost.dataset.landed) return;
          ghost.dataset.landed = "1";
          ghost.remove();
          landed += 1;
          if (countEl && countEl.isConnected) countEl.textContent = String(startCount + landed);
        };
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.transition = `transform 0.48s cubic-bezier(0.22, 0.7, 0.18, 1) ${delay}ms, opacity 0.42s ease ${delay + 80}ms`;
            ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-18deg) scale(${scale})`;
            ghost.style.opacity = "0.15";
          });
        });
        ghost.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 560 + delay);
      });

      exiles.forEach((item, i) => {
        const ghost = item.ghost;
        const delay = i * 80;
        maxWait = Math.max(maxWait, 620 + delay);
        const finish = () => {
          if (ghost.dataset.landed) return;
          ghost.dataset.landed = "1";
          ghost.remove();
        };
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.transition = `transform 0.55s cubic-bezier(0.2, 0.75, 0.2, 1) ${delay}ms, opacity 0.5s ease ${delay + 40}ms, filter 0.5s ease ${delay}ms`;
            ghost.style.transform = "translateY(-120px) rotate(22deg) scale(0.35)";
            ghost.style.opacity = "0";
            ghost.style.filter = "brightness(1.4) saturate(0.2)";
          });
        });
        ghost.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 640 + delay);
      });

      return maxWait;
    }

    function scrapPlay() {
      capturePlayClearFlights();
      while (inPlay.length) {
        const card = inPlay.shift();
        if (card.power || card.instant) battleExile.push(card);
        else discard.push(card);
      }
      resolveAt = 0;
    }

    function flyPlayToHand(from, handIndex) {
      if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(`.hand [data-card="${handIndex}"]`);
      if (!target) return;
      const to = target.getBoundingClientRect();
      if (!to.width || !to.height || !from.width || !from.height) return;
      const ghost = target.cloneNode(true);
      const kind = target.classList.contains("attack") ? "attack" : target.classList.contains("block") ? "block" : target.classList.contains("power") ? "power" : "skill";
      ghost.className = `card fly-card ${kind}`;
      ghost.style.left = `${from.left}px`;
      ghost.style.top = `${from.top}px`;
      ghost.style.width = `${from.width}px`;
      ghost.style.height = `${from.height}px`;
      ghost.style.transition = "none";
      ghost.style.transform = "none";
      document.body.appendChild(ghost);
      target.style.visibility = "hidden";
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      const scale = to.height / from.height;
      const fan = parseFloat(target.style.getPropertyValue("--fan")) || 0;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
        if (target.isConnected) target.style.visibility = "";
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.42s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(${fan}deg) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 520);
    }

    function unplayFromPlay(index) {
      if (phase !== "player" || outcome) return false;
      const card = inPlay[index];
      if (!card) return false;
      const el = document.querySelector(`.play-side.mine .play-card[data-unplay="${index}"] .card`)
        || document.querySelectorAll(".play-side.mine .play-card .card")[index];
      const from = el ? el.getBoundingClientRect() : null;
      inPlay.splice(index, 1);
      refundEnergy(card.cost);
      hand.push(card);
      sortHand();
      note = "";
      const handIndex = hand.indexOf(card);
      render();
      if (from) flyPlayToHand(from, handIndex);
      return true;
    }

    function enemyUseCard(card) {
      if (card.halfOnly && !hpHalf(enemy)) {
        log(`${enemy.name}は${card.name}。体力が半分より上なので、使えない。`, card, true);
        return;
      }
      if (card.press) {
        fxStruck = true;
        const amount = enemy.block || 0;
        if (amount > 0) takeEnemyHit(amount, card);
        else log(`${enemy.name}は${card.name}で0ダメージ。`, card, true);
        return;
      }
      if (card.burnFirst && card.burn) {
        if (addBurn(player, card.burn)) log(`${enemy.name}は${card.name}。${heroName()}は炎上+${player.burn}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      }
      if (card.damage) {
        const kick = card.kick && player.block > 0 ? card.kick : 0;
        takeEnemyHit(rollCrit(card, card.damage) + kick, card);
      } else if (card.block) {
        const gain = Math.max(0, card.block + (Number(enemy.def) || 0));
        if (gain) {
          enemy.block += gain;
          fxShieldEnemy = true;
        }
        log(`${enemy.name}は${card.name}でブロック${gain}。`, card, true);
      } else if (card.poison) {
        if (addPoison(player, card.poison)) log(`${enemy.name}は${card.name}。${heroName()}は毒+${player.poison}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      }
      if (card.burn && !card.burnFirst) {
        if (addBurn(player, card.burn)) log(`${enemy.name}は${card.name}。${heroName()}は炎上+${player.burn}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      } else if (!card.damage && !card.block && !card.poison && !card.burnFirst) {
        log(`${enemy.name}は${card.name}。${card.text}`, card, true);
      }
    }

    function leaveFoeCard() {
      timer = null;
      if (outcome) return;
      captureFoeLeave();
      advanceEnemyLoop();
      intentShown = false;
      foeDrawPending = false;
      foeAngerShow = false;
      render();
      timer = setTimeout(finishResolve, 720);
    }

    function drawFoeFromDeck() {
      if (phase !== "player" || outcome) return;
      foeAngerShow = false;
      intentShown = true;
      foeDrawPending = true;
      render();
    }

    function burnFoeAnger(done) {
      const el = document.querySelector(".play-side.foe .play-card .card");
      if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        done();
        return;
      }
      const made = makeFlyGhost(el);
      el.style.visibility = "hidden";
      if (!made) {
        done();
        return;
      }
      const ghost = made.ghost;
      const finish = () => {
        if (ghost.dataset.landed) return;
        ghost.dataset.landed = "1";
        ghost.remove();
        done();
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.55s ease, filter 0.55s ease";
          ghost.style.transform = "translateY(-70px) scale(1.08)";
          ghost.style.filter = "sepia(1) saturate(6) brightness(1.7)";
          ghost.style.opacity = "0";
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 640);
    }

    function presentNextFoeCard() {
      timer = null;
      if (phase !== "player" || outcome) return;
      if (foeDeckEmpty) {
        foeDeckEmpty = false;
        foeRageBusy = true;
        foeAngerShow = true;
        intentShown = true;
        foeDrawPending = true;
        render();
        timer = setTimeout(() => {
          if (outcome) return;
          gainEnemyAnger();
          render();
          timer = setTimeout(() => {
            if (outcome) return;
            burnFoeAnger(() => {
              if (outcome) return;
              foeAngerShow = false;
              intentShown = false;
              foeDrawPending = false;
              render();
              flyDiscardIntoDeck(() => {
                if (outcome) return;
                recycleEnemyDeck();
                foeRageBusy = false;
                if (phase === "player") drawFoeFromDeck();
              });
            });
          }, 720);
        }, 700);
        return;
      }
      drawFoeFromDeck();
    }

    function finishResolve() {
      timer = null;
      scrapPlay();
      banner = "";
      if (tickPoison("enemy")) {
        scheduleFinish("win");
        return;
      }
      const wait = pendingPlayClearFly.length
        ? 560 + (pendingPlayClearFly.length - 1) * 70
        : 0;
      render();
      if (wait) timer = setTimeout(startPlayerTurn, wait);
      else startPlayerTurn();
    }

    function stepResolve() {
      timer = null;
      const enemyIndex = inPlay.length;
      if (phase !== "resolve" || resolveAt > enemyIndex) {
        finishResolve();
        return;
      }
      const index = resolveAt;
      resolveAt += 1;
      if (index < enemyIndex) {
        resolveCard(inPlay[index]);
        if (enemy.hp <= 0) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
      } else {
        logTurn("enemy");
        dropShield(enemy);
        const card = intentAt(0);
        enemyUseCard(card);
        if (player.hp > 0 && enemyNow().rally && !enemy.rallied && hpHalf(enemy) && !swordIgnoresTrait()) {
          enemy.rallied = true;
          const extra = shuffle(sourcePattern()).slice(0, 2);
          log(`${enemy.name}の特性。デッキから2枚引いて、続けて使う。`, null, true);
          for (const more of extra) {
            if (player.hp <= 0) break;
            enemyUseCard(more);
          }
        }
        if (player.hp <= 0) {
          const saved = cheatDeath();
          if (saved === "retry") return;
          if (!saved) {
            scrapPlay();
            scheduleFinish("lose");
            return;
          }
        }
        const guardKind = fxGuard;
        const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
        const slashCount = fxSlashes.length;
        render();
        const wait = Math.max(1400 + Math.max(0, slashCount - 1) * 340, drainMs(), playerNumber ? 1850 : 0, guardKind ? 1300 : 0);
        timer = setTimeout(leaveFoeCard, wait);
        return;
      }
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const slashCount = fxSlashes.length;
      render();
      const wait = Math.max(720 + Math.max(0, slashCount - 1) * 340, drainMs(), playerNumber ? 1850 : 0, guardKind ? 1300 : 0);
      timer = setTimeout(resolveAt > enemyIndex ? finishResolve : stepResolve, wait);
    }

    function dropShield(who) {
      const had = Math.max(0, Number(who && who.block) || 0);
      if (!had) return;
      who.block = 0;
    }

    function endTurn() {
      if (phase !== "player" || outcome || foeRageBusy) return;
      if (hasReuseBracelet()) {
        const left = Math.max(0, Number(player.energy) || 0);
        player.pendingCarry = left;
        if (left > 0) log(`${heroName()}は再利用の腕輪。マナ${left}を次のターンへ持ち越す。`);
      } else {
        player.pendingCarry = 0;
      }
      phase = "resolve";
      resolveAt = 0;
      while (hand.length) discard.push(hand.pop());
      note = "";
      const poisoned = tickPoison("player");
      turnCall = "resolve";
      if (poisoned) {
        const saved = cheatDeath();
        if (saved === "retry") return;
        if (!saved) {
          scheduleFinish("lose");
          return;
        }
      }
      render();
      timer = setTimeout(stepResolve, 1100);
    }

    function startPlayerTurn(quiet) {
      if (player.hp <= 0) {
        const saved = cheatDeath();
        if (saved === "retry") return;
        if (!saved) {
          fxFatal = true;
          fatalHold = true;
          scheduleFinish("lose");
          return;
        }
      }
      turn += 1;
      logTurn("player");
      player.hurtLast = !!player.hurtThis;
      player.hurtThis = false;
      if (parryCount(player) > 0) {
        player.parry = 0;
        log(`${heroName()}のパリィが、ターンの終わりに消失した。`);
      }
      // 自分のシールドは、敵の番が終わって次の自分の番になるときに消える
      dropShield(player);
      syncGearStats();
      const halfMana = hpHalf(player) && (gear.braceletL && gear.braceletL.halfMana || gear.braceletR && gear.braceletR.halfMana) ? 1 : 0;
      const carried = Math.max(0, Number(player.pendingCarry) || 0);
      player.pendingCarry = 0;
      player.baseMax = MANA + (Number(player.manaMod) || 0) + halfMana;
      player.baseEnergy = player.baseMax;
      player.tempEnergy = carried;
      syncEnergyTotal();
      if (halfMana) log(`${heroName()}はミノタウロスの腕輪。体力が半分以下なので、このターンのマナ+1。`);
      if (carried > 0) log(`${heroName()}は持ち越したマナ${carried}（オレンジ）。`);
      const extra = Math.max(0, Number(player.extraDraw) || 0);
      player.extraDraw = 0;
      draw(DRAW_PER_TURN + (Number(player.spdMod) || 0) + extra);
      pullFromBracelets();
      fxDeal = true;
      slashSeq = 0;
      if (!quiet) turnCall = "player";
      phase = "player";
      intentShown = false;
      foeAngerShow = false;
      if (finishIfStuck()) return;
      render();
      timer = setTimeout(presentNextFoeCard, quiet ? 280 : 1150);
    }

    function finish(kind) {
      clearTimer();
      clearBattleMods();
      outcome = kind;
      phase = "end";
      banner = "";
      fatalHold = false;
      fxFatal = false;
      log(kind === "win" ? `${heroName()}は${enemy.name}を倒した。` : `${heroName()}は倒された。`);
      if (kind === "lose") {
        defeatSnap = captureDefeat();
        endRun(false);
        screen = "defeat";
        render();
        return;
      }
      if (kind === "win") {
        prepareReward();
        persistSave(true);
      }
      render();
    }

    function scheduleFinish(kind) {
      phase = "end";
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const fatal = kind === "lose" && (fxFatal || fatalHold);
      if (fatal) {
        fxFatal = true;
        fatalHold = true;
      }
      const fatalWait = fatal ? 3600 : 0;
      const wait = Math.max(720, drainMs(), playerNumber ? (fatal ? 3200 : 1850) : 0, guardKind ? 1300 : 0, fatalWait);
      clearTimer();
      render();
      timer = setTimeout(() => finish(kind), wait);
    }

    function captureDefeat() {
      const blow = lastFoeBlow;
      const foeName = enemy && enemy.name ? enemy.name : "敵";
      const hit = blow && blow.hpLoss ? `${blow.hpLoss}ダメージ` : "";
      const why = blow && blow.name === "毒"
        ? `毒で体力が尽きた。`
        : blow && blow.name
          ? `${foeName}の${blow.name}${hit ? `で${hit}` : ""}。体力が尽きた。`
          : `${foeName}に倒された。`;
      return {
        hero: heroName(),
        defeatArt: heroItem().defeat,
        victoryArt: heroItem().victory,
        foeName,
        foeImage: enemy && enemy.image ? enemy.image : "",
        foeHp: enemy ? `${enemy.hp}/${enemy.maxHp}` : "",
        why,
        log: (logLines || []).map((line) => (typeof line === "string" ? { text: line } : { ...line })),
        deck: (openingDeck || []).map((card) => ({ ...card })),
        dungeon: dungeonName,
        floor: floorLabel(),
        stars: meta.stars,
      };
    }

    function logLinesHtml(lines) {
      let logTurnShown = 0;
      return (lines || []).map((line, index) => {
        const text = typeof line === "string" ? line : line.text;
        const kind = line && line.kind;
        const cls = kind === "player" ? "turn-player" : kind === "enemy" ? "turn-enemy" : "";
        const hover = line && line.card ? ` data-log="${index}"` : "";
        const foe = line && line.foe ? ` data-foe="1"` : "";
        let head = "";
        if (kind && line.turn && line.turn !== logTurnShown) {
          logTurnShown = line.turn;
          head = `<p class="turn-head"><span>${line.turn}ターン目</span></p>`;
        }
        const body = kind ? esc(text) : colorNames(text);
        return `${head}<p class="${cls}"${hover}${foe}>${body}</p>`;
      }).join("");
    }

    function emptyMeta() {
      return { uses: 0, clears: 0, stars: 0, cleared: {} };
    }

    function metaFrom(saved) {
      const source = saved && typeof saved === "object" ? saved : {};
      const clearedMap = (source.cleared && typeof source.cleared === "object") ? { ...source.cleared } : {};
      if (!source.cleared && (Number(source.clears) || 0) > 0) clearedMap["20"] = true;
      return {
        uses: Number(source.uses) || 0,
        clears: Number(source.clears) || 0,
        stars: Number(source.stars) || 0,
        cleared: clearedMap,
      };
    }

    function readAccount() {
      try {
        const data = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "{}");
        if (!data || typeof data !== "object") return { login: "", slots: {} };
        if (!data.slots || typeof data.slots !== "object") data.slots = {};
        return data;
      } catch (error) {
        return { login: "", slots: {} };
      }
    }

    function writeAccount(data) {
      localStorage.setItem(ACCOUNT_KEY, JSON.stringify(data));
    }

    function accountSlot(account, word) {
      if (!account.slots[word]) account.slots[word] = {};
      return account.slots[word];
    }

    function claimLegacy(slot) {
      if (!slot.save) {
        try {
          const old = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
          if (old) slot.save = old;
        } catch (error) { /* 古いセーブが壊れていても、新しい言葉は空で始める */ }
      }
      if (!slot.meta) {
        try {
          const old = JSON.parse(localStorage.getItem(META_KEY) || "null");
          if (old && typeof old === "object") slot.meta = old;
        } catch (error) { /* 同上 */ }
      }
      if (!slot.live) {
        try {
          const old = JSON.parse(localStorage.getItem(LIVE_KEY) || "null");
          if (old) slot.live = old;
        } catch (error) { /* 同上 */ }
      }
      if (slot.save || slot.meta || slot.live) {
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(META_KEY);
        localStorage.removeItem(LIVE_KEY);
      }
    }

    function loadMeta() {
      if (!loginWord) {
        meta = emptyMeta();
        return;
      }
      const slot = readAccount().slots[loginWord];
      meta = metaFrom(slot && slot.meta);
    }

    function persistMeta() {
      if (!loginWord) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      slot.meta = meta;
      account.login = loginWord;
      writeAccount(account);
    }

    function setLogin(word) {
      const account = readAccount();
      const slot = accountSlot(account, word);
      if (!slot.save && !slot.meta && !slot.live) claimLegacy(slot);
      account.login = word;
      writeAccount(account);
      loginWord = word;
      loadMeta();
      touchLogin();
    }

    function logout() {
      const account = readAccount();
      account.login = "";
      writeAccount(account);
      loginWord = "";
      meta = emptyMeta();
      screen = "title";
      render();
    }

    function wipeLogin() {
      if (!loginWord) return;
      const account = readAccount();
      delete account.slots[loginWord];
      account.login = "";
      writeAccount(account);
      loginWord = "";
      meta = emptyMeta();
      screen = "title";
      render();
    }

    function loadAccount() {
      const account = readAccount();
      loginWord = typeof account.login === "string" ? account.login : "";
      if (loginWord && !/^[ぁ-んー]+$/.test(loginWord)) loginWord = "";
      loadMeta();
      touchLogin();
    }

    function touchLogin() {
      if (!loginWord) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      const list = Array.isArray(slot.logins) ? slot.logins.map(Number).filter((n) => n > 0) : [];
      const now = Date.now();
      if (!list.length || now - list[0] > 2 * 60 * 1000) list.unshift(now);
      slot.logins = list.slice(0, 8);
      account.login = loginWord;
      writeAccount(account);
    }

    function formatLogin(ts) {
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
      }).format(new Date(ts));
    }

    function endRun(clearedRun) {
      const item = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonName);
      const floorsKey = item ? item.floors : 20;
      gear = emptyGear();
      gearOpen = null;
      stolen = [];
      runEnded = clearedRun ? "win" : "lose";
      if (clearedRun) cleared = true;
      clearLive();
      meta.uses += 1;
      if (clearedRun) {
        meta.clears += 1;
        markDungeonCleared(floorsKey);
      }
      persistMeta();
      persistSave(true);
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (typeof saved.showLog === "boolean") showLog = saved.showLog;
        if (typeof saved.autoEndTurn === "boolean") autoEndTurn = saved.autoEndTurn;
      } catch (error) {
        showLog = true;
        autoEndTurn = true;
      }
      paintEdgeClear();
    }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ showLog, autoEndTurn }));
    }

    function paintEdgeClear() {
      document.body.classList.remove("edge-clear");
      root.classList.remove("edge-clear-screen");
    }

    function readSave() {
      if (!loginWord) return null;
      const slot = readAccount().slots[loginWord];
      return slot && slot.save ? slot.save : null;
    }

    function battleSnapshot() {
      return {
        v: 1,
        cleared,
        runEnded,
        defeatSnap,
        battleIndex,
        turn,
        intentIndex,
        enemyLoop,
        foeDiscard,
        phase,
        note,
        banner,
        outcome,
        logLines,
        deck,
        hand,
        discard,
        inPlay,
        openingDeck,
        resolveAt,
        player,
        enemy,
        gear,
        stolen,
        removed,
        beggarGift,
        beggarBattle,
        battleTotal,
        route,
        dungeonFloors,
        floorAt,
        battleStartHp,
        floorZero: true, // 祝福を0層目として数える新しい道（古いセーブの見分け用）
        dungeonName,
        heroCast,
        job,
        jobsHad,
        ultimate,
        rewardReady,
        rewardStars,
        rewardPicks,
        rewardPaths,
        rewardStep,
        pathEventTitle,
        bonusCard,
        floorGift,
        runBonus,
        bossPicks,
        shopStock,
        gearOffer,
      };
    }

    function persistSave(silent) {
      if (!loginWord) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      slot.save = battleSnapshot();
      account.login = loginWord;
      writeAccount(account);
      if (!silent) {
        saveNote = "セーブした";
        render();
      }
    }

    function readLive() {
      if (!loginWord) return null;
      const slot = readAccount().slots[loginWord];
      return slot && slot.live ? slot.live : null;
    }

    function persistLive() {
      if (!loginWord || !player || !enemy) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      slot.live = battleSnapshot();
      account.login = loginWord;
      writeAccount(account);
    }

    function clearLive() {
      if (!loginWord) return;
      const account = readAccount();
      if (account.slots[loginWord]) account.slots[loginWord].live = null;
      writeAccount(account);
    }

    function applySave(data) {
      runBonus = data.runBonus && typeof data.runBonus === "object"
        ? { hp: Number(data.runBonus.hp) || 0, spd: Number(data.runBonus.spd) || 0, mana: Number(data.runBonus.mana) || 0 }
        : emptyRunBonus();
      cleared = !!data.cleared;
      runEnded = data.runEnded || (data.cleared ? "win" : null);
      defeatSnap = data.defeatSnap || null;
      battleIndex = data.battleIndex || 0;
      battleStartHp = Number(data.battleStartHp) || (data.player && Number(data.player.hp)) || 30;
      turn = data.turn || 0;
      intentIndex = data.intentIndex || 0;
      phase = data.phase || "player";
      note = data.note || "";
      banner = data.banner || "";
      outcome = data.outcome || null;
      logLines = data.logLines || [];
      const dropFocus = (list) => (list || []).filter((card) => card && card.name !== "集中");
      deck = dropFocus(data.deck || []);
      hand = dropFocus(data.hand || []);
      discard = dropFocus(data.discard || []);
      inPlay = dropFocus(Array.isArray(data.inPlay) ? data.inPlay : []);
      openingDeck = dropFocus(Array.isArray(data.openingDeck) && data.openingDeck.length
        ? data.openingDeck
        : deck.concat(hand, inPlay, discard)
      ).map((card) => ({ ...card }));
      resolveAt = data.resolveAt || 0;
      player = data.player;
      enemy = data.enemy;
      if (enemy) enemy.image = enemyByName(enemy.name).image;
      if (player) {
        player.hit = false;
        player.atk = player.atk || 0;
        player.def = player.def || 0;
        player.maxHp = Math.max(runMaxHp(), Number(player.maxHp) || 30);
        player.manaMod = Number(player.manaMod) || runBonus.mana || 0;
        player.spdMod = Number(player.spdMod) || runBonus.spd || 0;
        if (player.hp > player.maxHp) player.hp = player.maxHp;
        player.maxEnergy = Math.min(MANA + (Number(player.manaMod) || 0) + 1, Math.max(MANA + (Number(player.manaMod) || 0), Number(player.maxEnergy) || MANA));
        if (player.energy > player.maxEnergy) player.energy = player.maxEnergy;
        if (player.baseMax == null) player.baseMax = Math.max(0, Number(player.maxEnergy) || MANA);
        if (player.tempEnergy == null) player.tempEnergy = 0;
        if (player.baseEnergy == null) player.baseEnergy = Math.max(0, (Number(player.energy) || 0) - (Number(player.tempEnergy) || 0));
        if (player.pendingCarry == null) player.pendingCarry = 0;
        syncEnergyTotal();
        player.burn = burnStacks(player);
        player.focus = 0;
        player.parry = player.parry === true ? 1 : Math.max(0, Number(player.parry) || 0);
        player.atkMod = Number(player.atkMod) || 0;
        player.defMod = Number(player.defMod) || 0;
        player.expose = Number(player.expose) || 0;
        player.guardThrough = !!player.guardThrough;
        player.extraDraw = Math.max(0, Number(player.extraDraw) || 0);
        player.poison = poisonStacks(player);
      }
      if (enemy) {
        enemy.hit = false;
        enemy.poison = poisonStacks(enemy);
        enemy.burn = burnStacks(enemy);
        enemy.rallied = !!enemy.rallied;
        enemy.anger = Math.max(0, Number(enemy.anger) || 0);
        enemy.name = enemyKey(enemy.name);
        const foe = enemyByName(enemy.name);
        enemy.atk = hiddenAtk(foe) + enemy.anger;
        enemy.def = hiddenDef(foe) - enemy.anger;
        if (enemy.maxHp !== foe.hp) {
          enemy.maxHp = foe.hp;
          if (enemy.hp > foe.hp) enemy.hp = foe.hp;
        }
      }
      gear = normalizeGear(data.gear);
      if (!gear.sword && !gear.shield) gear = starterGear();
      syncGearStats();
      gearOpen = null;
      stolen = Array.isArray(data.stolen) ? data.stolen : [];
      removed = Array.isArray(data.removed) ? data.removed.filter((card) => card && card.name) : [];
      beggarGift = Array.isArray(data.beggarGift) ? data.beggarGift.filter((card) => card && card.name) : [];
      beggarBattle = !!data.beggarBattle;
      if (Array.isArray(data.route) && data.route.length) {
        route = data.route.map((name) => enemyKey(name)).map((name) => name === "出来事:ジョブ" ? "出来事:探索" : name);
      } else {
        route = CLASSIC_ROUTE.slice();
        const total = data.battleTotal || route.length;
        while (route.length < total) {
          const bossAt = route.indexOf(DUNGEON.boss);
          const tier = DUNGEON.road[DUNGEON.road.length - 1];
          if (bossAt >= 0) route.splice(bossAt, 0, rollRank(tier));
          else route.push(rollRank(tier));
        }
      }
      // 古いセーブ（祝福が1層目だった道）は、1層目に雑魚を1つ足して新しい数え方に合わせる
      if (!data.floorZero && route[0] === "出来事:祝福" && route.length > 1) {
        route.splice(battleIndex === 0 ? 1 : battleIndex + 1, 0, rollRank(1));
      }
      battleTotal = route.length;
      if (data.dungeonName) {
        const legacy = { "20": "洞窟", "はじまりの洞窟": "洞窟", "骸洞窟": "洞窟", "50": "古城", "竜の遺骸城": "古城", "100": "深淵", "深淵なる寝所": "深淵" };
        dungeonName = legacy[data.dungeonName] || data.dungeonName;
      }
      if (Array.isArray(data.floorAt) && data.floorAt.length === route.length) {
        dungeonFloors = Number(data.dungeonFloors) || floorsOf(dungeonName);
        floorAt = data.floorAt.map((n) => Number(n) || 0);
        clampBlessingNext();
      } else {
        rememberFloors(Number(data.dungeonFloors) || floorsOf(dungeonName));
      }
      if (enemy && route[battleIndex] && !isEventNode(route[battleIndex])) {
        const foe = enemyNow();
        enemy.name = foeLabel();
        enemy.image = foe.image;
        enemy.anger = Math.max(0, Number(enemy.anger) || 0);
        enemy.atk = hiddenAtk(foe) + enemy.anger;
        enemy.def = hiddenDef(foe) - enemy.anger;
      }
      restoreEnemyLoop(data);
      heroCast = castByName(data.heroCast || "戦士").name;
      job = data.job || "戦士";
      jobsHad = Array.isArray(data.jobsHad) && data.jobsHad.length ? data.jobsHad : ["戦士"];
      ultimate = data.ultimate || "";
      rewardReady = !!data.rewardReady;
      rewardStars = data.rewardStars || 0;
      rewardPicks = Array.isArray(data.rewardPicks) ? data.rewardPicks : [];
      rewardPaths = Array.isArray(data.rewardPaths) ? data.rewardPaths : [];
      // 古い保存（走り抜けが混ざる・右端が未知との遭遇でない）は引き直す
      if (rewardPaths.length && (rewardPaths[1] !== "straight" || rewardPaths.length !== 3)) rewardPaths = rollPaths();
      rewardStep = data.rewardStep || "cards";
      pathEventTitle = data.pathEventTitle || "探索";
      bonusCard = data.bonusCard || null;
      floorGift = data.floorGift && data.floorGift.kind ? data.floorGift : null;
      bossPicks = Array.isArray(data.bossPicks) ? data.bossPicks : [];
      shopStock = Array.isArray(data.shopStock) ? data.shopStock : [];
      gearOffer = data.gearOffer && data.gearOffer.item ? data.gearOffer : null;
      if (outcome === "win" && !rewardReady) prepareReward();
      saveNote = "";
      bindShown();
    }

    function startBattle(keepHp) {
      clearTimer();
      clearReward();
      lastFoeBlow = null;
      fxFatal = false;
      fatalHold = false;
      screen = "battle";
      cleared = false;
      runEnded = null;
      const maxHp = runMaxHp();
      const hp = keepHp == null ? maxHp : Math.min(maxHp, keepHp);
      battleStartHp = hp;
      player = { hp, maxHp, block: 0, energy: 0, maxEnergy: 0, baseMax: 0, baseEnergy: 0, tempEnergy: 0, pendingCarry: 0, atk: 0, def: 0, focus: 0, parry: 0, poison: 0, burn: 0, hit: false, atkMod: 0, defMod: 0, expose: 0, guardThrough: false, hurtThis: false, hurtLast: false, extraDraw: 0, manaMod: Number(runBonus.mana) || 0, spdMod: Number(runBonus.spd) || 0 };
      battleExile = [];
      syncGearStats();
      const foe = enemyNow();
      enemy = { name: foeLabel(), image: foe.image, hp: foe.hp, maxHp: foe.hp, block: 0, poison: 0, burn: 0, def: hiddenDef(foe), atk: hiddenAtk(foe), anger: 0, rallied: false, hit: false };
      bindShown();
      turn = 0;
      startEnemyLoop(true);
      phase = "intro";
      floorCall = true;
      encounter = false;
      intentShown = false;
      intentArrive = false;
      note = "";
      banner = "";
      outcome = null;
      askLeave = false;
      logLines = [];
      if (beggarBattle) log("物乞いが襲ってきた。");
      saveNote = "";
      buildDeck();
      render();
      timer = setTimeout(showEncounter, 1400);
    }

    function showEncounter() {
      timer = null;
      if (phase !== "intro" || outcome) return;
      floorCall = false;
      encounter = true;
      render();
      timer = setTimeout(beginEncounter, 1600);
    }

    function foeRankName() {
      if (bossNow()) return "ボス";
      return (enemyNow() && enemyNow().rank) || "普通";
    }

    function foeStarText() {
      const rank = (enemyNow() && enemyNow().rank) || "普通";
      return "★".repeat(starsForRank(rank));
    }

    function appearLine() {
      if (beggarBattle) return "物乞いが襲ってきた";
      if (bossNow()) return "ボスが現れた!!!";
      const rank = (enemyNow() && enemyNow().rank) || "普通";
      if (rank === "強敵") return "強敵が現れた!!";
      return "敵が現れた!";
    }

    function beginEncounter() {
      timer = null;
      if (phase !== "intro" || outcome) return;
      encounter = false;
      turnCall = "start";
      render();
      timer = setTimeout(openFight, 1200);
    }

    function openFight() {
      timer = null;
      if (phase !== "intro" || outcome) return;
      startPlayerTurn(true);
    }

    const ITEM_IMAGE = "gear-item.jpg?v=1";
    // 使い捨てアイテム。クイックは戦闘中の自分のターンに押して使う（マナはいらない）。
    // 天使の輪・天使のペンダントは持っているだけでよく、死んだときひとりでに使われる。
    // stars が 0 のものはレアリティ未定（お店に並べるときの値段が決まっていない）。
    const ITEMS = [];
    function itemDef(id) {
      return ITEMS.find((item) => item.id === id) || null;
    }
    function rollItem() {
      return null;
    }
    function blessItem() {
      return rollItem(2);
    }
    function rollBlessGear() {
      const pool = GEAR_ITEMS.filter((item) => (Number(item.stars) || 0) >= 2);
      const list = pool.length ? pool : GEAR_ITEMS;
      return { ...list[Math.floor(Math.random() * list.length)] };
    }
    function rollBlessCard() {
      const offers = Object.keys(COMMON).map((name) => ({ name, ...COMMON[name], stars: COMMON[name].stars || 1 }))
        .concat(classCards())
        .filter((card) => (Number(card.stars) || 1) >= 2);
      const pick = offers[Math.floor(Math.random() * offers.length)] || { name: "ツインアタック", ...COMMON["ツインアタック"], stars: 3 };
      return keepCard(pick);
    }
    function itemSlotWith(flag) {
      return ["itemL", "itemR"].find((key) => gear && gear[key] && gear[key][flag]) || "";
    }

    function giveItem(gift) {
      if (!gear.itemL) gear.itemL = { ...gift };
      else if (!gear.itemR) gear.itemR = { ...gift };
      else gear.itemL = { ...gift };
    }

    // クイックのアイテムを使う（自分のターンだけ。マナはいらない。使ったら消える）
    function useItem(slot) {
      if (screen !== "battle" || phase !== "player" || outcome) return;
      const item = gear && gear[slot];
      if (!item || !item.quick) return;
      if (item.heal) {
        const gain = restoreHp(item.heal);
        log(`${heroName()}は${item.name}を使った。HPが${gain}回復。`);
      } else if (item.damage) {
        const result = applyDamage(enemy, item.damage);
        if (result.hpLoss || result.blocked) {
          slashFoe();
          noteHit("enemy", result.hpLoss, item.damage);
        }
        log(`${heroName()}は${item.name}を投げた。${enemy.name}に${result.hpLoss}ダメージ。`);
      }
      gear[slot] = null;
      gearOpen = null;
      if (enemy.hp <= 0) {
        scrapPlay();
        scheduleFinish("win");
        return;
      }
      render();
    }

    // 死んだとき、天使の輪（復活）→天使のペンダント（戦闘をやり直す）の順に、ひとりでに使われる。
    // 戻り値：使ったものが無ければ ""。"revive" はその場で続行、"retry" は startBattle をやり直し済み。
    function cheatDeath() {
      if (!player || player.hp > 0) return "";
      const halo = itemSlotWith("revive");
      if (halo) {
        const item = gear[halo];
        gear[halo] = null;
        player.hp = player.maxHp;
        fxHeal = true;
        fxFatal = false;
        fatalHold = false;
        log(`${heroName()}は倒れた。${item.name}が光り、復活した。`);
        return "revive";
      }
      const pendant = itemSlotWith("retry");
      if (pendant) {
        const item = gear[pendant];
        gear[pendant] = null;
        clearTimer();
        clearBattleMods();
        startBattle(battleStartHp);
        log(`${item.name}が砕けた。時が戻り、戦闘をはじめからやり直す。`);
        render();
        return "retry";
      }
      return "";
    }

    function emptyRunBonus() {
      return { hp: 0, spd: 0, mana: 0 };
    }

    function runMaxHp() {
      return 30 + Math.max(0, Number(runBonus && runBonus.hp) || 0);
    }

    function rollBlessPicks() {
      const kinds = shuffle(["maxhp", "spd", "mana", "gear", "card"]).slice(0, 3);
      return kinds.map((kind) => {
        if (kind === "maxhp") return { kind, label: "最大HP" };
        if (kind === "spd") return { kind, label: "SPD" };
        if (kind === "mana") return { kind, label: "マナ" };
        if (kind === "gear") return { kind, gear: rollBlessGear(), label: "装備" };
        return { kind: "card", card: rollBlessCard(), label: "カード" };
      });
    }

    function takeGift(pick) {
      if (!pick) return "";
      if (pick.kind === "item") return "";
      if (pick.kind === "gear") {
        if (!gear || !gear.sword) gear = starterGear();
        if (offerWeapon(pick.gear, { source: "gift" })) return "";
        giveGear(pick.gear);
        floorGift = { kind: "gear", gear: { ...pick.gear } };
        armRare("gift");
        return `${pick.gear.name}を受け取った。`;
      }
      stolen.push(keepCard(pick.card));
      floorGift = { kind: "card", card: keepCard(pick.card) };
      armRare("gift");
      return `${pick.card.name}を1枚受け取った。`;
    }

    function playPickCenter(_selector, done) {
      if (typeof done === "function") done();
    }

    function takeBless(index) {
      if (floorKind !== "挑戦者に祝福を" || floorPhase !== "bless") return;
      const pick = blessPicks[index];
      if (!pick) return;
      playPickCenter(`[data-action="bless-pick"][data-bless="${index}"]`, () => {
        if (floorKind !== "挑戦者に祝福を" || floorPhase !== "bless") return;
        if (pick.kind === "maxhp") {
          runBonus.hp = (Number(runBonus.hp) || 0) + 10;
          floorHp = runMaxHp();
        } else if (pick.kind === "spd") {
          runBonus.spd = (Number(runBonus.spd) || 0) + 1;
        } else if (pick.kind === "mana") {
          runBonus.mana = (Number(runBonus.mana) || 0) + 1;
        } else if (!takeGift(pick)) {
          return;
        }
        blessPicks = [];
        finishEvent();
      });
    }

    function cardBuildName(name) {
      if (CARD_BUILD[name]) return CARD_BUILD[name];
      if (name === "パリィ") return "パリィ";
      return "";
    }

    function playerBuild() {
      const counts = {};
      for (const card of runDeck()) {
        const build = cardBuildName(card.name);
        if (!build) continue;
        counts[build] = (counts[build] || 0) + 1;
      }
      let best = "パリィ";
      let bestN = -1;
      for (const build of Object.keys(counts)) {
        if (counts[build] > bestN) {
          best = build;
          bestN = counts[build];
        }
      }
      return best;
    }

    function grantTrain() {
      const build = playerBuild();
      const names = Object.keys(CARD_BUILD).filter((name) => CARD_BUILD[name] === build && WARRIOR[name]);
      const pool = names.length ? names : Object.keys(WARRIOR);
      const name = shuffle(pool)[0];
      const def = WARRIOR[name];
      if (!def) return "";
      return takeGift({ kind: "card", card: keepCard({ name, ...def, stars: def.stars || 1 }) });
    }

    function grantExplore() {
      const item = GEAR_ITEMS[Math.floor(Math.random() * GEAR_ITEMS.length)];
      if (!item) return "";
      return takeGift({ kind: "gear", gear: { ...item } });
    }

    function giftMarkup(gift, big, hot, index) {
      if (!gift) return "";
      const cls = big ? "gift-show" : "gift-pick";
      const lv = hot ? rareLevel(giftEntity(gift)) : 0;
      const fx = rareFx(lv);
      const style = rareStyle(lv, index || 0);
      if (gift.kind === "card" && gift.card) {
        return `<div class="${cls}${rareClass(lv)}"${style}>${fx}<div class="card preview ${cardKind(gift.card)}">${cardFace(gift.card)}</div></div>`;
      }
      if (gift.kind === "spd" || gift.kind === "maxhp" || gift.kind === "mana") {
        const boon = gift.kind === "maxhp"
          ? { slot: "hp", name: "最大HP+10", image: "reward-hp.jpg?v=1" }
          : gift.kind === "mana"
            ? { slot: "mana", name: "マナ+1", image: "reward-mana.jpg?v=1" }
            : { slot: "spd", name: "SPD+1", image: "reward-spd.jpg?v=1" };
        return `<div class="${cls}">${gearPopShell(boon.slot, {
          name: boon.name,
          image: boon.image,
        })}</div>`;
      }
      const item = gift.kind === "gear" ? gift.gear : gift.item;
      if (!item) return "";
      if (gift.kind === "gear") {
        return `<div class="${cls}${rareClass(lv)}"${style}>${fx}${gearPopShell(item.slot || "sword", {
          name: item.name,
          image: item.image || "",
          rarity: gearRarityText(item),
          body: esc(gearSpecialText(item)),
        })}</div>`;
      }
      const picture = item.image ? `<img class="gift-img" src="${esc(item.image)}" alt="">` : "";
      const detail = `<b>${esc(item.name)}</b><small>${esc(item.effect || "")}</small>`;
      return `<div class="${cls}${rareClass(lv)}"${style}>${fx}${rareCaption(item)}${picture}${detail}</div>`;
    }

    function jobCandidates() {
      const list = [];
      if (jobsHad.includes("戦士") && jobsHad.includes("魔法使い")) list.push("パラディン");
      if (job !== "魔法使い") list.push("魔法使い");
      if (job !== "戦士") list.push("戦士");
      return list;
    }

    function rollUltimates(nextJob) {
      const pairs = [];
      for (let w = 0; w <= 4; w++) pairs.push(`${w}:${4 - w}`);
      const picks = shuffle(pairs).slice(0, nextJob === "戦士" ? 1 : 2);
      if (nextJob === "戦士") picks.unshift("parry-stack");
      return picks;
    }

    function ultimateLabel(pair) {
      if (pair === "parry-stack") return "パリィが重複する";
      const [w, m] = String(pair).split(":");
      return `戦士${w}と魔法使い${m}`;
    }

    function openFloor(keepHp) {
      floorHp = keepHp == null ? runMaxHp() : Math.min(runMaxHp(), keepHp);
      const kind = String(route[battleIndex] || "").slice("出来事:".length);
      floorKind = kind;
      floorNote = "";
      floorPrompt = "";
      floorPhase = "show";
      eventFloorCall = false;
      floorGift = null;
      blessPicks = [];
      beggarCut = false;
      ultimatePicks = [];
      if (kind === "祝福") {
        floorKind = "挑戦者に祝福を";
        floorPhase = "bless";
        blessPicks = rollBlessPicks();
        floorNote = "女神が三つを差し出した。ひとつだけ受け取れる。";
        floorPrompt = "";
        armRare("bless");
      } else if (kind === "キャンプ") {
        floorKind = "休憩";
        const max = runMaxHp();
        const before = Math.min(max, floorHp);
        const gain = Math.round(max * 0.2);
        const after = Math.min(max, before + gain);
        const healed = after - before;
        floorHp = after;
        if (player) {
          player.maxHp = max;
          player.hp = after;
        }
        floorNote = "焚き火のそばで、女の戦士は丸くなってひと息ついた。頬が赤く、静かな寝息が落ちる。";
        floorPrompt = healed
          ? `現在HP ${before} / 最大HP ${max}。${healed} 回復して、${after} / ${max}。最大HPの20%。`
          : `現在HP ${before} / 最大HP ${max}。すでに満タンで、回復は0。`;
      } else if (kind === "お店") {
        shopStock = rollShopStock();
        floorNote = "";
        floorPrompt = "★で買い物。カード2つ、装備2つ。値段はレアリティと同じ。";
        armRare("shop");
      } else if (kind === "探索") {
        const item = GEAR_ITEMS[Math.floor(Math.random() * GEAR_ITEMS.length)];
        floorGift = item ? { kind: "gear", gear: { ...item } } : null;
        floorPhase = floorGift ? "search" : "show";
        floorNote = "松明の光が、古びた宝箱を照らしている。女の戦士は蓋に手をかけ、今にも開けようとしている。目は星のように輝き、よだれが一筋落ちた。";
        floorPrompt = floorGift ? "宝箱の中から使えそうな装備を見つけた。" : "中は空っぽだった。";
      } else if (kind === "未知") {
        if (Math.random() < 0.5) {
          floorKind = "物乞いに遭遇";
          beggarGift = [];
          floorNote = "フードの物乞いが道をふさぎ、高価なカードを要求している。腰には、きらりと光るものがある。";
          floorPrompt = "物乞いにカードをあげろ。";
        } else {
          floorKind = "挑戦者に祝福を";
          floorPhase = "bless";
          blessPicks = rollBlessPicks();
          floorNote = "";
          floorPrompt = "";
          armRare("bless");
        }
      } else if (kind === "修行") {
        floorKind = "修行";
        const gotCard = grantTrain();
        floorNote = "女の戦士は汗を飛ばしながら素振りを続け、新しい技が腕に残った。";
        floorPrompt = gotCard ? `${playerBuild()}のカードを1枚もらった。` : "もらえるカードは無かった。";
      } else if (kind === "物乞い") {
        floorKind = "物乞いに遭遇";
        beggarGift = [];
        beggarPick = -1;
        floorNote = "フードの物乞いが道をふさぎ、高価なカードを要求している。腰には、きらりと光るものがある。";
        floorPrompt = "物乞いにカードをあげろ。";
      } else if (kind === "ジョブ") {
        floorPhase = "job";
        floorNote = "光る紋章の前に立つと、別の戦い方が見えてきた。";
        floorPrompt = `いまのジョブは${job}。カードは捨てない。ジョブを1つ選ぶ。`;
      }
      screen = "floor";
      render();
      if (floorKind === "挑戦者に祝福を" && floorPhase === "bless") playBlessArrive();
    }

    function playBlessArrive() {
      const flash = document.createElement("div");
      flash.className = "screen-flash";
      document.body.appendChild(flash);
      setTimeout(() => { if (flash.parentNode) flash.remove(); }, 700);
    }

    function pickBeggar(index) {
      if (floorKind !== "物乞いに遭遇" || beggarCut) return;
      if (!runDeck()[index]) return;
      beggarPick = index;
      render();
    }

    function beginBeggarFight() {
      beggarBattle = true;
      startBattle(floorHp);
    }

    function confirmBeggar() {
      if (floorKind !== "物乞いに遭遇" || beggarCut) return;
      const card = runDeck()[beggarPick];
      if (!card) return;
      const gift = keepCard(card);
      removed.push(gift);
      beggarCut = true;
      if ((Number(card.stars) || 1) <= 2) {
        beggarGift = [gift];
        beginBeggarFight();
        return;
      }
      beggarGift = [];
      floorNote = "物乞いはカードを受け取ると、道を開けた。";
      floorPrompt = "";
      finishEvent();
    }

    function skipBeggar() {
      if (floorKind !== "物乞いに遭遇") return;
      beggarGift = [];
      beggarCut = true;
      finishEvent();
    }

    function takeSearchGear() {
      if (floorKind !== "探索" || floorPhase !== "search" || !floorGift) return;
      const got = takeGift(floorGift);
      if (!got) return;
      floorPrompt = got;
      floorPhase = "show";
      render();
    }

    function skipSearchGear() {
      if (floorKind !== "探索") return;
      floorGift = null;
      finishEvent();
    }

    function enterNode(keepHp) {
      if (isEventNode(route[battleIndex])) {
        openFloor(keepHp);
        return;
      }
      startBattle(keepHp);
    }

    function departRun(floors, name) {
      if (departing) return;
      const chosen = DUNGEON_LIST.find((dungeon) => dungeon.name === name) || pendingDungeon || DUNGEON_LIST[0];
      if (!chosen || !dungeonOpen(chosen.floors)) return;
      departing = true;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ms = reduce ? 700 : 2600;
      const veil = document.createElement("div");
      veil.className = reduce ? "depart depart-fast" : "depart";
      veil.setAttribute("role", "status");
      veil.innerHTML = `<img class="depart-art" src="${chosen.art}" alt=""><h1 class="depart-name"><span>${esc(chosen.name)}</span></h1>`;
      document.body.appendChild(veil);
      if (departTimer) clearTimeout(departTimer);
      departTimer = setTimeout(() => {
        departTimer = null;
        departing = false;
        beginRun(chosen.floors, chosen.name);
        veil.classList.add("depart-out");
        setTimeout(() => { if (veil.parentNode) veil.remove(); }, reduce ? 200 : 800);
      }, ms);
    }

    function beginRun(floors, name) {
      defeatSnap = null;
      lastFoeBlow = null;
      fxFatal = false;
      fatalHold = false;
      dungeonName = name || "洞窟";
      battleIndex = 0;
      route = buildRoute(floors || 20, dungeonName);
      rememberFloors(floors || 20);
      battleTotal = route.length;
      cleared = false;
      runBonus = emptyRunBonus();
      runEntrance = true;
      gear = starterGear();
      gearOpen = null;
      gearOffer = null;
      stolen = [];
      removed = [];
      beggarGift = [];
      heroCast = castByName(castLock).name;
      job = "戦士";
      jobsHad = ["戦士"];
      ultimate = "";
      runEnded = null;
      enterNode(30);
      persistSave(true);
    }

    function continueGame() {
      const data = readSave();
      if (!loginWord || !data) return;
      clearTimer();
      applySave(data);
      if (runEnded === "lose") {
        screen = "defeat";
        render();
        return;
      }
      if (runEnded === "win") {
        screen = "clear";
        render();
        return;
      }
      screen = "battle";
      render();
    }

    function goTitle() {
      clearTimer();
      askLeave = false;
      clearLive();
      clearArtZoom();
      screen = "title";
      saveNote = "";
      render();
    }

    function resumeLive() {
      const data = readLive();
      if (!data || !data.player || !data.enemy) return false;
      if (data.cleared) {
        clearLive();
        screen = "title";
        render();
        return true;
      }
      clearTimer();
      applySave(data);
      askLeave = false;
      screen = "battle";
      if (screen === "battle" && !outcome && enemy && enemy.hp <= 0) {
        finish("win");
        return true;
      }
      if (screen === "battle" && !outcome && player && player.hp <= 0) {
        finish("lose");
        return true;
      }
      if (screen === "battle" && phase === "resolve" && !outcome) {
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "enemy" && !outcome) {
        phase = "resolve";
        resolveAt = inPlay.length;
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "recoil" && !outcome) {
        render();
        timer = setTimeout(startPlayerTurn, 650);
      } else if (screen === "battle" && phase === "intro" && !outcome) {
        floorCall = true;
        encounter = false;
        intentShown = false;
        render();
        timer = setTimeout(showEncounter, 1400);
      } else {
        render();
      }
      return true;
    }

    function meters(who, hp, maxHp, block) {
      const cap = Math.max(1, maxHp);
      const hpPct = Math.max(0, Math.min(100, (hp / cap) * 100));
      const blockPct = Math.max(0, Math.min(100, (block / cap) * 100));
      const shield = block > 0 ? `<div class="shield-row"><div class="meter shield" style="width:${blockPct}%"><span></span></div></div>` : "";
      return `<div class="meters">${shield}<div class="meter hp" style="--cap:${cap}; --max:${cap}" aria-label="HP ${Math.round(hp)}/${Math.round(cap)}"><span data-bar="${who}" style="width:${hpPct}%"></span><b class="hp-now"><span data-hp="${who}">${Math.round(hp)}/${Math.round(cap)}</span></b><i class="hp-ticks"></i></div></div>`;
    }

    // 戦闘画面の名前と体力の板。自分と敵で同じ作り（左の帯の色だけ違う）。
    function plateMarkup(cls, who, name, tag, shownHp, maxHp, block, extra) {
      const low = maxHp > 0 && shownHp / maxHp <= 0.3 ? " low" : "";
      const parryN = who === "player" && typeof player !== "undefined" && player ? parryCount(player) : 0;
      const parried = parryN > 0;
      // シールドは板の右上の青鋼ヒーター盾。パリィは同じ形の金の盾。両方あるときはパリィをとなりへ
      const fresh = Boolean(extra && extra.shieldFlash && block > 0);
      const shieldBadge = block > 0 ? `<div class="shield-badge${fresh ? " fresh" : ""}" aria-label="シールド ${block}">${plateShieldSvg(false)}<b>${block}</b></div>` : "";
      const parryBadge = parried ? `<div class="shield-badge parry-badge" aria-label="パリィ ${parryN}">${plateShieldSvg(true)}${parryN > 1 ? `<b>${parryN}</b>` : ""}</div>` : "";
      const mods = `${low}${block > 0 ? " shielded" : ""}${parried ? " parried" : ""}`;
      const invuln = parried ? ` aria-label="${esc(name)} パリィ中・次の攻撃を無効"` : "";
      const badges = extra && extra.badges
        ? `<span class="plate-badges">${extra.badges}</span>`
        : "";
      const stars = extra && extra.stars
        ? `<span class="plate-stars" aria-label="ランク">${esc(extra.stars)}</span>`
        : "";
      // 板の数値は＋を付けない。値は中央ぞろえ。HP行は出さない。いま/最大は体力バーに出す。
      const statLine = (icon, label, value, kind) => `<div class="hp-line${kind ? ` ${kind}` : ""}"><span class="lbl">${icon}${label}</span><span class="num"><b>${value}</b></span></div>`;
      const atkLine = extra && extra.atk != null ? statLine(swordIcon(), "ATK", extra.atk, "stat-atk") : "";
      const defLine = extra && extra.def != null ? statLine(shieldIcon(), "DEF", extra.def, "stat-def") : "";
      const spdLine = extra && extra.spd != null ? statLine(bootIcon(), "SPD", extra.spd, "stat-spd") : "";
      return `<section class="battle-plate ${cls}${mods}"${invuln}${extra && extra.attrs ? extra.attrs : ""}>${shieldBadge}${parryBadge}
        <h2><span class="who">${esc(name)}</span>${stars}${tag ? `<span class="tag">${esc(tag)}</span>` : ""}${badges}</h2>
        ${meters(who, shownHp, maxHp, block)}
        ${atkLine}${defLine}${spdLine}${extra && extra.tail ? extra.tail : ""}
      </section>`;
    }

    function pips() {
      const baseOn = Math.max(0, Number(player.baseEnergy != null ? player.baseEnergy : player.energy) || 0);
      const temp = Math.max(0, Number(player.tempEnergy) || 0);
      const total = baseOn + temp;
      return `<div class="mana-read${temp ? " has-temp" : ""}" aria-label="マナ残り ${total}${temp ? `。持ち越し ${temp}` : ""}"><b>${total}</b>${temp ? `<i class="mana-temp">+${temp}</i>` : ""}</div>`;
    }

    function fillHandForLook() {
      if (screen !== "settings" || returnScreen !== "battle") return;
      draw(HAND_CAP - hand.length);
      const names = CARD_POOL.map(([name]) => name).filter((name) => cardDef(name));
      let i = 0;
      while (hand.length < HAND_CAP && names.length) {
        const name = names[i % names.length];
        i += 1;
        hand.push(keepCard({ name, ...cardDef(name) }));
      }
      log(`手札を${hand.length}枚にした（見た目確認）。`);
      screen = "battle";
      render();
    }

    function showCastGear(button) {
      const item = gearItem(button.dataset.castGear || "");

      if (!item) return;
      root.insertAdjacentHTML("beforeend", gearPopShell(item.slot, {
        name: item.name,

      }).replace('class="gear-effect', 'class="gear-effect cast-pop'));

      const r = button.getBoundingClientRect();
      const w = box.offsetWidth || 288;
      const h = box.offsetHeight || 120;
      let left = r.right + 12;
      let top = r.top;
      if (left + w > window.innerWidth - 8) left = Math.max(8, r.left - 12 - w);
      if (top + h > window.innerHeight - 8) top = Math.max(8, window.innerHeight - 8 - h);
      box.style.left = `${Math.round(left)}px`;
      box.style.top = `${Math.round(top)}px`;

        token.classList.toggle("locked", token.dataset.cast === castLock);

    function placeCastCardPop(action) {
      const old = root.querySelector(".cast-card-pop");
      if (old && old.dataset.index === (action.dataset.index || "")) return;
      if (old) old.remove();
      const card = action.querySelector(".card");
      if (!card) return;
      const pop = document.createElement("div");
      pop.className = "cast-card-pop";
      pop.dataset.index = action.dataset.index || "";
      pop.innerHTML = card.outerHTML;
      root.appendChild(pop);
      const rect = action.getBoundingClientRect();
      const width = pop.offsetWidth || 280;
      const height = pop.offsetHeight || 420;
      let left = rect.left - width - 12;
      if (left < 8) left = Math.min(rect.right + 12, window.innerWidth - width - 8);
      let top = rect.top + rect.height / 2 - height / 2;
      top = Math.max(8, Math.min(window.innerHeight - height - 8, top));
      pop.style.left = `${Math.round(left)}px`;
      pop.style.top = `${Math.round(top)}px`;
    }

      const pop = root.querySelector(".cast-card-pop");

    function albumCatalog() {
      const list = [];
      const seen = new Set();
      const push = (name, data, klass) => {
        if (!name || seen.has(name)) return;
        seen.add(name);
        list.push({ name, klass, stars: data.stars || 1, ...data });
      };
      for (const [name, data] of Object.entries(CARDS)) push(name, data, "基本");
      for (const [name, data] of Object.entries(WARRIOR)) push(name, data, "戦士");
      for (const [name, data] of Object.entries(COMMON)) push(name, data, "共通");
      for (const foe of ENEMIES) {
        for (const card of foe.pattern || []) {
          const name = card && card.name;
          if (!name || seen.has(name)) continue;
          if (name === "アタック" || name === "ブロック") continue;
          if (CARDS[name] || WARRIOR[name] || COMMON[name]) continue;
          const base = CARDS[name] || WARRIOR[name] || COMMON[name] || {};
          push(name, { ...base, ...card }, "敵");
        }
      }
      return list;
    }

    function zoomSidePanel(title, body, withClose = true) {
      if (!title || !body) return "";

      return `<aside class="art-zoom-side" aria-label="${esc(title)}の拡大"><h3>${esc(title)}</h3>${body}${close}</aside>`;

    function artZoomSide(name) {

      }
      const face = ALBUM_FACE.find((item) => item[0] === name);
      if (face) {
        return zoomSidePanel(face[1], `<div class="art-zoom-frame"><img class="art-zoom-img" src="${face[2]}" alt="${esc(face[1])}"></div>`, false);
      }
      const style = CARD_STYLE.find((item) => item[0] === name);
      if (style) {
        return zoomSidePanel(style[1], `<div class="art-zoom-frame"><img class="art-zoom-img" src="${style[2]}" alt="${esc(style[1])}"></div>`, false);
      }
      const card = albumCatalog().find((item) => item.name === name) || { name, ...(CARDS[name] || WARRIOR[name] || COMMON[name] || {}) };
      const body = `<div class="art-zoom-card"><div class="card preview ${cardKind(card)}">${cardFace(card, false)}</div></div>`;
      return zoomSidePanel(name, body, false);

          return `<button type="button" class="gift-btn${rareClass(lv)}"${rareStyle(lv, i)} data-action="bless-pick" data-bless="${i}">${rareFx(lv)}<span class="gift-label">${esc(pick.label)}</span>${giftMarkup(pick, false)}</button>`;
        })
        : [];
      const bless = blessButtons.length ? `<div class="gift-row${rareJack(blessLevels)}">${blessButtons.join("")}</div>` : "";
      const giftLv = giftLive ? rareLevel(giftEntity(floorGift)) : 0;
      const gift = floorPhase === "show" || floorPhase === "search" ? giftMarkup(floorGift, true, giftLive, 0) : "";
      const rareFlash = rareScreen(blessLevels.concat(giftLv ? [giftLv] : []));
      const shop = floorKind === "お店" && floorPhase === "show" ? shopMarkup(shopStock, "", takeRare("shop")) : "";
      const floorFlash = eventFloorCall ? `<div class="event-floor-call" aria-hidden="true"><b>現在 ${floorNo()}Ｆ</b></div>` : "";
      eventFloorCall = false;
      const title = `<h1>${esc(floorKind)}<small>-${floorNo()}Ｆ-</small></h1>`;
      const choice = `${rareFlash}${eventNoteHtml()}${shop}${gift}${searchActions}${bless}${beggar}${jobs}${ultimates}${next}`;
      const shopMode = floorKind === "お店";
      const picture = art || "";
        root.innerHTML = eventShell(`<div class="menu event${runEntrance ? " run-in" : ""}${floorKind === "物乞いに遭遇" ? " beggar" : ""}${floorKind === "探索" ? " search" : ""}${floorKind === "挑戦者に祝福を" ? " bless" : ""}${shopMode ? " shop" : ""}">${floorFlash}${title}${picture}<div class="event-choice">${choice}</div></div>`);
      runEntrance = false;
    }

    function renderClear() {
      root.innerHTML = `
        <div class="overlay victory finale clear-finale">
          ${victoryStage("踏破")}
          <div class="panel wide reward-panel">
            <h2>踏破</h2>
            <p class="victory-count">${esc(dungeonName)}を抜けた。解放が進んだ。</p>
            <p>所持 <span data-star-count>★${meta.stars}</span> は残っている。次の攻略も、初期デッキから。</p>
            <div class="gear-offer-actions">
              ${menuButton("カードリスト", "album")}
              ${menuButton("キャラクター選択へ", "character", true)}
            </div>
          </div>
        </div>`;
    }

    function hideLogPeek() {
      const peek = document.querySelector(".log-peek");
      if (peek) peek.hidden = true;
    }

    function bindLogPeek() {
      const host = document.querySelector(".battle-log");
      if (!host) return;
      let peek = document.querySelector(".log-peek");
      if (!peek) {
        peek = document.createElement("div");
        peek.className = "log-peek";
        peek.hidden = true;
        document.body.appendChild(peek);
      }
      host.querySelectorAll("[data-log]").forEach((line) => {
        line.addEventListener("pointerenter", () => {
          const card = logLines[Number(line.dataset.log)] && logLines[Number(line.dataset.log)].card;
          if (!card) return;
          const tone = line.dataset.foe === "1" ? "foe" : cardKind(card);
          peek.innerHTML = `<div class="card preview ${tone}">${cardFace(card, false)}</div>`;
          const rect = line.getBoundingClientRect();
          const width = 148;
          const height = Math.round(width * 300 / 204);
          peek.hidden = false;
          peek.style.left = `${Math.max(8, rect.left - width - 12)}px`;
          peek.style.top = `${Math.max(8, Math.min(window.innerHeight - height - 8, rect.top + rect.height / 2 - height / 2))}px`;
        });
        line.addEventListener("pointerleave", () => {
          peek.hidden = true;
        });
      });
    }

    function paintTitleNav() {
      root.querySelectorAll(".nav-title").forEach((el) => el.remove());
      if (screen === "title" || screen === "battle" || screen === "floor") return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-title";
      btn.dataset.action = "title";
      btn.textContent = "タイトルへ";
      root.appendChild(btn);
    }

    function render() {
      hideLogPeek();
      if (screen === "title") {
        renderTitle();
        return;
      }
      if (screen === "account") renderAccount();
      else if (screen === "wipe") renderWipe(1);
      else if (screen === "wipe2") renderWipe(2);
      else if (screen === "pass") renderPass();
      else if (screen === "character") renderCharacter();
      else if (screen === "dungeon") renderDungeon();
      else if (screen === "dungeon-gate") renderDungeonGate();
      else if (screen === "album") renderAlbum();
      else if (screen === "sheet") renderSheet();
      else if (screen === "defeat") renderDefeat();
      else if (screen === "settings") renderSettings();
      else if (screen === "confirm") renderConfirm();
      else if (screen === "clear") renderClear();
      else if (screen === "floor") {
        renderFloor();
        paintGearOffer();
      } else {
        renderBattle();
        paintGearOffer();
      }
      paintEdgeClear();
      paintTitleNav();
      requestAnimationFrame(() => {
        placeRoad();
        fitCardNames();
      });
