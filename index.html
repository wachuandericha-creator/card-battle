    function printedDamage(card) {
      if (!card) return 0;
      if (card.name === "アタック" || card.name === "アタック+") return CARDS.アタック.damage || 4; // 旧名互換
      return Number(card.damage) || 0;
    }

    function printedBlock(card) {
      if (!card) return 0;
      if (card.name === "ブロック" || card.name === "ブロック+") return CARDS.ブロック.block || 4;
      return Number(card.block) || 0;
    }

    function usesStrike(card) {
      return !!(card && (card.damage || card.press || card.redTimes || card.counter || card.finisher || card.hits));
    }

    function usesFocus(card) {
      return !!(card && (card.damage || card.block || card.press || card.redTimes || card.hits || card.finisher));
    }

    function focusLeftFor(card, fromHand) {
      if (!player || !player.focus || !usesFocus(card)) return 0;
      const before = fromHand ? (inPlay || []) : (inPlay || []).slice(0, Math.max(0, inPlay.indexOf(card)));
      if (before.some(usesFocus)) return 0;
      return player.focus;
    }

    function expectedHits(card, fromHand, foe) {
      if (!card || !usesStrike(card)) return null;
      const atk = foe ? 0 : (player && player.atk) || 0;
      const focus = foe ? 0 : focusLeftFor(card, fromHand);
      if (card.press) {
        const shield = foe ? (enemy && enemy.block) || 0 : (player && player.block) || 0;
        return [Math.max(0, shield)];
      }
      if (card.finisher) {
        const hits = Math.max(0, Number(player && player.parryHitsLast) || 0);
        return [hits * 20];
      }
      if (card.counter) {
        const reds = (inPlay || []).filter((item) => cardKind(item) === "attack").length;
        return reds ? null : [card.counter];
      }
      if (card.redTimes) {
        const mine = fromHand ? 1 : 0;
        const reds = (inPlay || []).filter((item) => cardKind(item) === "attack").length + mine;
        return [Math.max(0, reds * card.redTimes + atk + focus)];
      }
      if (card.hits) {
        const hits = [];
        for (let n = 0; n < card.hits; n++) hits.push(Math.max(0, printedDamage(card) + atk + (n === 0 ? focus : 0)));
        return hits;
      }
      if (card.damage) {
        let bonus = 0;
        if (!foe) {
          if (card.fullBonus && player && player.hp >= player.maxHp) bonus += card.fullBonus;
          if (card.safeBonus && player && !player.hurtLast) bonus += card.safeBonus;
          if (card.kick && enemy && enemy.block > 0) bonus += card.kick;
        } else if (foe) {
          if (card.fullBonus && enemy && enemy.hp >= enemy.maxHp) bonus += card.fullBonus;
          if (card.kick && player && player.block > 0) bonus += card.kick;
        }
        const base = foe ? (Number(card.damage) || 0) : printedDamage(card);
        return [Math.max(0, base + atk + focus + bonus)];
      }
      return null;
    }

    function expectedDamageLabel(card, fromHand, foe) {
      const hits = expectedHits(card, fromHand, foe);
      if (!hits || !hits.length) return "";
      if (hits.length === 1) return String(hits[0]);
      if (hits.every((n) => n === hits[0])) return `${hits[0]}×${hits.length}`;
      return hits.join("+");
    }

    function expectedBlockValue(card, fromHand, foe) {
      if (!card) return null;
      const base = foe ? (Number(card.block) || 0) : printedBlock(card);
      if (!base && !card.block && card.name !== "ブロック" && card.name !== "ブロック+") return null;
      if (foe) return Math.max(0, base + (Number(enemy && enemy.def) || 0));
      return Math.max(0, base + focusLeftFor(card, fromHand) + (Number(player && player.def) || 0));
    }

    // 句点・読点のあと、または意味の切れ目でのみ改行する。行頭に句読点や助詞を出さない。
    function canBreakCardText(text, i, start) {
      if (i <= 0 || i >= text.length) return false;
      const prev = text[i - 1];
      const next = text[i];
      if ("、。！？…・）】」』ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮー％%はがをにでとのへもや".includes(next)) return false;
      if ("（「『【〈《".includes(prev)) return false;
      if (next === "×" || prev === "×") return false;
      if (text.startsWith("ない", i) || text.startsWith("から", i) || text.startsWith("まで", i)) return false;
      if ((next === "+" || next === "＋") && (text.slice(Math.max(0, i - 3), i) === "パリィ" || text.slice(Math.max(0, i - 2), i) === "トゲ")) return false;
      if (/[0-9０-９]/.test(prev) && /[0-9０-９＋+×\-－回枚倍%％]/.test(next)) return false;
      if (/[0-9０-９%％]/.test(next) && i >= 6 && text.slice(i - 6, i) === "クリティカル") return false;
      if (/[＋+\-－×]/.test(prev) && /[0-9０-９]/.test(next)) return false;
      if (/[0-9０-９]/.test(prev) && (text.startsWith("ダメージ", i) || text.startsWith("回復", i) || text.startsWith("枚", i) || text.startsWith("回", i) || text.startsWith("倍", i))) return false;
      const glued = ["ダメージ", "ブロック", "シールド", "パリィ", "アタック", "インスタント", "プレイエリア", "クイック", "フラッシュ", "バースト", "キープ", "クリティカル", "トゲ", "炎上"];
      for (const word of glued) {
        for (let k = 1; k < word.length; k++) {
          if (i >= k && text.startsWith(word, i - k)) return false;
        }
      }
      const chunk = i - (start || 0);
      const rest = text.length - i;
      if (rest < 3) return false;
      if ("、。！？".includes(prev)) return true;
      if (chunk < 7) return false;
      if (text.slice(i - 2, i) === "って") return false;
      if ((prev === "て" || text.slice(i - 2, i) === "した" || text.slice(i - 2, i) === "ない") && /[\u4E00-\u9FFF\u30A0-\u30FF]/.test(next)) return true;
      const tails = ["から", "まで", "だけ", "たら", "なら", "は", "が", "を", "に", "で", "と", "へ"];
      for (const tail of tails) {
        if (tail === "と" && (text.startsWith("き", i) || text.startsWith("ころ", i) || text.startsWith("きに", i))) continue;
        if (i >= tail.length && text.slice(i - tail.length, i) === tail) return true;
      }
      return false;
    }

    function cardNoteHtml(raw) {
      return String(raw || "").split("\n").map((line) => {
        const parts = [];
        let start = 0;
        for (let i = 1; i <= line.length; i++) {
          if (i === line.length || canBreakCardText(line, i, start)) {
            parts.push(`<span class="nobr">${esc(line.slice(start, i))}</span>`);
            start = i;
          }
        }
        return parts.join("");
      }).join("<br>");
    }

    function liveCardText(card, fromHand, foe) {
      let text = String(card.text || "");
      const hits = expectedHits(card, fromHand, foe);
      const dmg = expectedDamageLabel(card, fromHand, foe);
      const blk = expectedBlockValue(card, fromHand, foe);
      if (dmg) {
        if (card.hits && hits && hits.length > 1) {
          if (hits.every((n) => n === hits[0])) {
            text = text.replace(/\d+ダメージを\d+回/u, `${hits[0]}ダメージを${hits.length}回`);
          } else {
            text = text.replace(/\d+ダメージを\d+回/u, `${hits.join("+")}ダメージ`);
          }
        } else if (card.press) {
          text = text.replace(/自分のシールドの数だけダメージ|ブロックの数だけダメージ(?:\nブロックがなければ0)?/u, `${dmg}ダメージ`);
        } else if (card.finisher) {
          text = text.replace(/直前のターンに成功したパリィの数×\d+ダメージ|直前3ターンで、パリィが成功したターンの数×\d+ダメージ|消費した数×\d+ダメージ/u, `${dmg}ダメージ`);
        } else if (card.redTimes) {
          text = text.replace(/プレイエリアの赤いカードの数×\d+ダメージ/u, `${dmg}ダメージ`);
        } else if (card.counter) {
          text = text.replace(/プレイエリアにアタックがないとき、\d+ダメージ/u, `プレイエリアにアタックがないとき、${dmg}ダメージ`);
          if (!/ダメージ/u.test(text)) text = `${dmg}ダメージ`;
        } else if (card.fullBonus) {
          // 本体は剣アイコン。本文の数字は追加分のままにする
        } else {
          text = text.replace(/\d+ダメージ/u, `${dmg}ダメージ`);
        }
      }
      if (blk != null) text = text.replace(/ブロック\d+/u, `ブロック${blk}`);
      return text;
    }

    // 剣・盾・ハートで出している数字は、本文に重ねない。
    function withoutIconEcho(text, opts) {
      return String(text || "").split("\n").map((line) => line.trim()).filter((line) => {
        if (!line) return false;
        if (opts.attack && /^\d+ダメージ$/u.test(line)) return false;
        if (opts.attack && opts.hits && /^\d+ダメージを\d+回$/u.test(line)) return false;
        if (opts.block && /^ブロック\d+$/u.test(line)) return false;
        if (opts.heal && /^体力を\d+回復$/u.test(line)) return false;
        return true;
      }).join("\n");
    }

    function cardFace(card, live, foe) {
      const fromHand = !!(live && !foe && (!inPlay || !inPlay.includes(card)));
      const dmgLabel = live ? expectedDamageLabel(card, fromHand, foe) : "";
      const liveBlock = live ? expectedBlockValue(card, fromHand, foe) : null;
      let shown = printedDamage(card);
      let shownBlock = printedBlock(card);
      let showAttack = !!card.damage;
      let showBlock = !!card.block;
      if (live) {
        if (dmgLabel) {
          showAttack = true;
          shown = dmgLabel;
        } else if (foe && card.damage) {
          shown = Number(card.damage) || 0;
        }
        if (liveBlock != null) {
          showBlock = true;
          shownBlock = liveBlock;
        } else if (foe && card.block) {
          shownBlock = Number(card.block) || 0;
        }
      }
      if (showAttack && card.hits > 1 && !/[×+]/.test(String(shown))) shown = `${shown}×${card.hits}`;
      const rawNote = withoutIconEcho(live ? liveCardText(card, fromHand, foe) : (card.text || ""), {
        attack: showAttack,
        block: showBlock,
        heal: !!card.heal,
        hits: !!card.hits,
        live: !!live,
      });
      const kwLine = (word, note, key) => `<span class="kw-line hint" data-word="${esc(key || word)}">${word}<i>${esc(note)}</i></span>`;
      const keywords = [];
      const item = isItemCard(card);
      let noteText = cardNoteHtml(rawNote);
      const hintWord = (text, word, note) => {
        if (!word || !note || !text.includes(word)) return text;
        return text.replaceAll(word, `<span class="hint" data-word="${esc(word)}">${word}<i>${esc(note)}</i></span>`);
      };
      noteText = hintWord(noteText, "パリィ", (card.parry && card.note) ? card.note : PARRY_NOTE);
      noteText = hintWord(noteText, "トゲ", THORN_NOTE);
      noteText = hintWord(noteText, "毒", POISON_NOTE);
      noteText = hintWord(noteText, "炎上", BURN_NOTE);
      noteText = noteText.replace(/クリティカル\d+%/g, (word) => `<span class="hint" data-word="クリティカル">${word}<i>${esc(CRIT_NOTE)}</i></span>`);
      if (card.during) noteText = noteText.replace(/^戦闘中(?:<br>)?/u, "");
      if (isFlashCard(card) && !item) keywords.push(kwLine("フラッシュ", FLASH_NOTE));
      if (card.burst && !item) keywords.push(kwLine("バースト", BURST_NOTE));
      if (card.quick && !item) keywords.push(kwLine("クイック", QUICK_NOTE));
      if (card.keep && !item) keywords.push(kwLine("キープ", KEEP_NOTE));
      if (item) keywords.push(kwLine("アイテム", ITEM_NOTE));
      const icons = [
        showAttack ? `<span class="fx attack">${swordIcon()}<b>${shown}</b></span>` : "",
        showBlock ? `<span class="fx block">${shieldIcon()}<b>${shownBlock}</b></span>` : "",
        card.heal ? `<span class="fx heal">${heartIcon()}<b>${card.heal}</b></span>` : "",
      ].join("");
      const kwHtml = keywords.length ? `<span class="fx kw">${keywords.join("")}</span>` : "";
      const iconHtml = icons ? `<span class="fx-row">${icons}</span>` : "";
      const noteHtml = noteText ? `<span class="fx note">${noteText}</span>` : "";
      const effects = `${kwHtml}${iconHtml}${noteHtml}`;
      const stars = card.stars || 1;
      const picture = (card.image || cardArtSrc(card.name)) ? `<img src="${card.image || cardArtSrc(card.name)}" alt="">` : "";
      const rank = card.boss ? "rboss" : stars >= 3 ? "r3" : stars === 2 ? "r2" : "r1";
      const kind = foe ? "foe" : cardKind(card);
      const genre = `<span class="genre" aria-label="ジャンル ${genreName(kind)}">${genreName(kind)}</span>`;
      const textClass = keywords.length ? "text has-kw" : "text";
      return `<div class="card-fit ${rank} k-${kind}"><div class="nameplate">${costOrbs(card.cost)}<div class="name">${esc(card.name)}</div></div><div class="art" aria-hidden="true">${picture}${genre}</div><div class="${textClass}">${effects}</div><div class="rarity" aria-label="レアリティ ${stars}">${"★".repeat(stars)}</div><i class="frame" aria-hidden="true"></i></div>`;
    }

    function playFace(card, on, live, foe, recallIndex, extra) {
      const tone = foe ? "foe" : cardKind(card);
      const recall = recallIndex != null && phase === "player" && !outcome;
      const bits = ["play-card"];
      if (recall) bits.push("can-recall");
      if (on) bits.push("on");
      if (extra && extra.held) bits.push("held");
      if (extra && extra.awaitDraw) bits.push("await-draw");
      const attrs = recall ? ` data-unplay="${recallIndex}" class="${bits.join(" ")}"` : ` class="${bits.join(" ")}"`;
      const label = recall
        ? `${card.cost} ${esc(card.name)}。クリックで手札に戻す`
        : `${card.cost} ${esc(card.name)}`;
      return `<div${attrs}><div class="card preview ${tone}" aria-label="${label}">${cardFace(card, live, foe)}</div></div>`;
    }

    function scratchApply(target, amount, fromThorns) {
      const n = Math.max(0, Number(amount) || 0);
      const hadHp = target.hp > 0;
      const blocked = Math.min(Math.max(0, target.block), n);
      target.block -= blocked;
      const hpLoss = n - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      if (!fromThorns && hadHp && n > 0 && target.thorns > 0 && target.opp) scratchApply(target.opp, target.thorns, true);
      return { raw: n, hpLoss };
    }

    function scratchHeal(who, amount) {
      const room = Math.max(0, who.maxHp - who.hp);
      const gain = Math.max(0, Math.min(Math.floor(Number(amount) || 0), room));
      who.hp += gain;
    }

    function scratchGainParry(who, add) {
      if (who.block > 0) who.block = 0;
      who.parry += Math.max(1, Number(add) || 1);
    }

    function scratchGainBlock(who, amount) {
      const gain = Math.max(0, Math.floor((Number(amount) || 0) + (Number(who.def) || 0)));
      if (!gain || (who.parry > 0 && !who.guardThrough)) return;
      who.block += gain;
    }

    function scratchStrike(enemySide, give, amount) {
      const hit = scratchApply(enemySide, amount);
      give.raw += hit.raw;
      give.hp += hit.hpLoss;
      if (hit.raw > 0) give.show = true;
    }

    // ターン終了と同じ順。毒 → 置いたカード → 敵のシールド消滅 → 敵の次の札。状態はコピーだけ。
    function forecastTurn() {
      if (phase !== "player" || outcome || !player || !enemy) return { give: null, take: null };
      const mine = {
        hp: player.hp,
        maxHp: player.maxHp,
        block: Math.max(0, Number(player.block) || 0),
        atk: Number(player.atk) || 0,
        def: Number(player.def) || 0,
        focus: Number(player.focus) || 0,
        parry: parryCount(player),
        expose: Math.max(0, Number(player.expose) || 0),
        doubleNext: !!player.doubleNext,
        hurtLast: !!player.hurtLast,
        guardThrough: !!player.guardThrough,
        parryHitsLast: Math.max(0, Number(player.parryHitsLast) || 0),
        masterOnce: !!player.masterOnce,
        thorns: thornCount(player),
      };
      const foe = {
        hp: enemy.hp,
        maxHp: enemy.maxHp,
        block: Math.max(0, Number(enemy.block) || 0),
        thorns: Math.max(0, Number(enemy.thorns) || 0),
      };
      mine.opp = foe;
      foe.opp = mine;
      const foeHadBlock = foe.block > 0;
      const poison = Math.max(0, Number(player.poison) || 0);
      if (poison) {
        let amount = poison;
        if (mine.expose) {
          amount += mine.expose;
          mine.expose = 0;
        }
        scratchApply(mine, amount);
        if (mine.hp <= 0) return { give: null, take: null };
      }
      const give = { raw: 0, hp: 0, show: false };
      const queue = inPlay || [];
      for (const card of queue) {
        if (card.keep && card.resolved) continue;
        scratchPlayerCard(card, mine, foe, queue, give);
        if (foe.hp <= 0) break;
      }
      const breakShield = foeHadBlock && foe.block <= 0;
      if (foe.hp <= 0) return { give: give.show ? give : null, take: null, breakShield };
      foe.block = 0;
      let take = null;
      let angerAhead = false;
      for (const step of foePlan) {
        if (step.anger) {
          if (!(enemy && enemy.anger)) angerAhead = true;
          continue;
        }
        let card = step.card;
        if (angerAhead && card && card.name === "アタック") {
          const dmg = (Number(card.damage) || 0) + 2;
          card = { ...card, damage: dmg };
        }
        const times = Math.max(1, Number(card.hits) || 1);
        for (let n = 0; n < times; n += 1) {
          const blow = scratchEnemyBlow(card, mine, foe);
          if (!blow) continue;
          if (!take) take = { raw: 0, hp: 0, parry: false, show: false };
          take.raw += blow.raw;
          take.hp += blow.hp;
          take.show = take.show || blow.show;
          take.parry = take.parry && blow.parry;
          if (blow.parry && take.raw === blow.raw) take.parry = true;
        }
      }
      return { give: give.show ? give : null, take, breakShield };
    }

    function scratchPlayerCard(card, mine, foe, queue, give) {
      if (!card) return;
      if (card.thorns) mine.thorns += Number(card.thorns) || 1;
      if (card.power) {
        if (card.coward) mine.guardThrough = true;
        return;
      }
      if (card.rage) {
        mine.atk += 2;
        mine.def -= 2;
        return;
      }
      if (card.poise) {
        scratchGainParry(mine, 1);
        return;
      }
      if (card.guardBreak) {
        foe.block = 0;
        return;
      }
      if (card.finisher) {
        scratchStrike(foe, give, mine.parryHitsLast * 20);
        return;
      }
      if (card.parryAdd) {
        scratchGainParry(mine, card.parryAdd);
        return;
      }
      if (card.knife) {
        scratchGainParry(mine, 1);
        return;
      }
      if (card.masterOnce) {
        if (mine.masterOnce) return;
        mine.masterOnce = true;
        scratchHeal(mine, card.heal || 10);
        scratchGainParry(mine, 1);
        return;
      }
      if (card.magicParry || card.pride || card.shave) return;
      if (card.step) return;
      if (card.focus) {
        mine.focus += card.focus;
        return;
      }
      if (card.parry && !card.damage && !card.block) {
        scratchGainParry(mine, 1);
        return;
      }
      if (card.press) {
        scratchStrike(foe, give, mine.block || 0);
        return;
      }
      if ((card.poison && !card.damage && !card.block) || card.heal || card.draw) {
        if (card.heal) scratchHeal(mine, card.heal);
        return;
      }
      if (card.redTimes) {
        const reds = queue.filter((item) => cardKind(item) === "attack").length;
        const added = mine.focus || 0;
        if (added) mine.focus = 0;
        scratchStrike(foe, give, reds * card.redTimes + mine.atk + added);
        return;
      }
      if (card.counter) {
        const reds = queue.filter((item) => cardKind(item) === "attack").length;
        if (!reds) scratchStrike(foe, give, card.counter);
        return;
      }
      if (card.hits) {
        const added = mine.focus || 0;
        if (added) mine.focus = 0;
        const base = Number(card.damage) || 0;
        for (let hit = 0; hit < card.hits; hit++) scratchStrike(foe, give, base + mine.atk + (hit === 0 ? added : 0));
        return;
      }
      const added = mine.focus && (card.damage || card.block) ? mine.focus : 0;
      if (added) mine.focus = 0;
      if (card.damage) {
        let bonus = 0;
        if (card.fullBonus && mine.hp >= mine.maxHp) bonus += card.fullBonus;
        if (card.safeBonus && !mine.hurtLast) bonus += card.safeBonus;
        if (card.kick && foe.block > 0) bonus += card.kick;
        scratchStrike(foe, give, (Number(card.damage) || 0) + added + mine.atk + bonus);
        if (card.doubleNext) mine.doubleNext = true;
      }
      if (card.expose) mine.expose = (Number(mine.expose) || 0) + card.expose;
      if (card.parry && card.damage) scratchGainParry(mine, 1);
      if (card.block) scratchGainBlock(mine, (Number(card.block) || 0) + added);
      if (card.parry && card.block && !card.damage) scratchGainParry(mine, 1);
    }

    function planCardFace(index) {
      let angerAhead = false;
      for (let i = 0; i < index; i += 1) {
        if (foePlan[i] && foePlan[i].anger && !(enemy && enemy.anger)) angerAhead = true;
      }
      const step = foePlan[index];
      if (!step) return null;
      if (step.anger) return step.card;
      if (angerAhead && step.card && step.card.name === "アタック") {
        const dmg = (Number(step.card.damage) || 0) + 2;
        return { ...step.card, damage: dmg, text: `${dmg}ダメージ` };
      }
      return step.card;
    }

    function shownFoeCard() {
      if (phase === "intro" || !enemy || !foePlan.length) return null;
      const step = foePlan.find((item) => !item.anger) || foePlan[0];
      return step ? step.card : null;
    }

    function scratchEnemyBlow(card, mine, foe) {
      if (card && card.thorns && !(card.halfOnly && !(foe.hp <= foe.maxHp / 2))) foe.thorns += Number(card.thorns) || 1;
      if (!card || card.halfOnly && !(foe.hp <= foe.maxHp / 2) || !card.damage) return null;
      let swing = Math.max(0, Number(card.damage) || 0);
      if (card.kick && mine.block > 0) swing += Number(card.kick) || 0;
      if (card.fullBonus && foe.hp >= foe.maxHp) swing += Number(card.fullBonus) || 0;
      if (mine.doubleNext) swing *= 2;
      if (!swing && !mine.expose) return null;
      if (mine.parry > 0) return { raw: swing, hp: 0, parry: true, show: swing > 0 };
      const dealt = swing + (mine.expose || 0);
      if (!dealt) return null;
      const hit = scratchApply(mine, dealt);
      return { raw: dealt, hp: hit.hpLoss, parry: false, show: true };
    }

    function useZoneMarkup() {
      const resolving = phase === "resolve";
      const active = resolving ? resolveAt - 1 : -1;
      const mine = inPlay.map((card, i) => {
        const on = active === i;
        const held = resolving && i < active;
        return playFace(card, on, true, false, i, { held });
      }).join("");
      const foeCards = phase === "intro" ? "" : foePlan.map((step, i) => {
        const face = planCardFace(i);
        const hot = resolving && active === inPlay.length && i === 0;
        return face ? playFace(face, hot, true, true, null, { awaitDraw: foeArriveHide && !hot }) : "";
      }).join("");
      return `<div class="use-board" aria-label="プレイエリア">
        <div class="use-split">
          <div class="play-side mine use-half"><div class="play-cards">${mine}</div></div>
          <div class="play-side foe use-half"><div class="play-cards">${foeCards}</div></div>
        </div>
        ${vsMarkup()}
      </div>`;
    }

    function stageFxMarkup(encounterNow, turnNow, fatalNow, hurtNow, hitNow, hitPow, noManaNow) {
      const calls = [];
      if (noManaNow) calls.push(`<div class="turn-call player mana-call" aria-hidden="true"><b>マナが足りない</b></div>`);
      if (floorCall) calls.push(`<div class="turn-call floor-call" aria-hidden="true">${fadeSandwichMarkup(`<b>${floorNo()}Ｆ</b>`, { tag: "div" })}</div>`);
      else if (encounterNow) calls.push(`<div class="turn-call enemy encounter-call" aria-hidden="true"><b>${esc(appearLine())}</b><span class="encounter-stars">${esc(foeStarText())}</span></div>`);
      if (turnNow === "start") calls.push(`<div class="turn-call start" aria-hidden="true"><b>戦闘開始!!</b></div>`);
      else if (turnNow === "resolve") calls.push(`<div class="turn-call resolve" aria-hidden="true"><b>解決フェイズ</b></div>`);
      else if (turnNow === "player" || turnNow === "enemy") calls.push(`<div class="turn-call ${turnNow}" aria-hidden="true"><b>${turnNow === "player" ? "自分のターン" : "敵のターン"}</b></div>`);
      if (fatalNow) calls.push(`<div class="fatal-call" aria-hidden="true">止め</div>`);
      if (!calls.length) return "";
      return `<div class="stage-fx">${calls.join("")}</div>`;
    }

    function vsMarkup() {
      const live = phase === "player" && !foeRageBusy && !outcome;
      const spent = live && (Number(player.energy) || 0) <= 0 && (Number(player.maxEnergy) || 0) > 0;
      return `<button type="button" class="vs-mark${spent ? " spent" : ""}" data-end aria-label="ターン終了"${live ? "" : " disabled"}>VS</button>`;
    }

    let heroImage = null;
    let heroImageTask = null;
    let heroLiveGen = 0;
    let heroLiveRaf = 0;

    let heroImageSrc = "";
    function ensureHeroImage() {
      if (heroImageSrc !== heroItem().battle) { heroImage = null; heroImageTask = null; heroImageSrc = heroItem().battle; }
      if (heroImage) return Promise.resolve(heroImage);
      if (!heroImageTask) {
        heroImageTask = new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => { heroImage = img; resolve(img); };
          img.onerror = () => reject(new Error("hero"));
          img.src = heroItem().battle;
        });
      }
      return heroImageTask;
    }

    function smooth01(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      return t * t * (3 - 2 * t);
    }

    function falloff(d) {
      if (d >= 1) return 0;
      const t = 1 - d;
      return t * t * (3 - 2 * t);
    }

    function poisonFxHtml(stamp) {
      const word = stamp ? `<b class="poison-stamp">毒</b>` : "";
      return `<div class="poison-hit" aria-hidden="true">${word}<i class="mist"></i><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i><i class="bubble b4"></i><i class="bubble b5"></i><i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i></div>`;
    }

    function healFxHtml() {
      return `<div class="hero-hit heal" aria-hidden="true"><i class="glow"></i><b class="plus p1">+</b><b class="plus p2">+</b><b class="plus p3">+</b><b class="plus p4">+</b><b class="plus p5">+</b></div>`;
    }

    function wardFxHtml(gold) {
      return `<div class="hero-hit ward${gold ? " spark-gold" : ""}" aria-hidden="true"><b class="mark m1">✨</b><b class="mark m2">✨</b><b class="mark m3">✨</b><b class="mark m4">✨</b><b class="mark m5">✨</b></div>`;
    }

    function heroShoulder(vitals, hurt, pow, guard, fatal, kind, struck, poisonApply, heal, ward, sparkGold, hitPop) {
      const poisonTick = Boolean(hurt && kind === "poison");
      const poison = poisonTick || Boolean(poisonApply);
      const blunt = Boolean(hurt && !poisonTick);
      const poisonHtml = poison
        ? `<div class="hero-hit poison${fatal && poisonTick ? " fatal" : ""}" style="--pow:${pow}" aria-hidden="true">${poisonFxHtml(!poisonTick)}</div>`
        : "";
      const bluntHtml = blunt
        ? `<div class="hero-hit blunt${fatal ? " fatal" : ""}" style="--pow:${pow}" aria-hidden="true"><span class="flash"></span><i class="ember e1"></i><i class="ember e2"></i><i class="ember e3"></i><i class="ember e4"></i><i class="ember e5"></i><span class="ring a"></span><span class="ring b"></span><span class="star s1"></span><span class="star s2"></span><span class="star s3"></span><span class="star s4"></span><span class="star s5"></span><span class="dust"></span></div>`
        : "";
      const hit = poisonHtml + bluntHtml;
      const healHtml = heal ? healFxHtml() : "";
      const goldSpark = Boolean(sparkGold);
      const wardHtml = ward || goldSpark ? wardFxHtml(goldSpark) : "";
      const guardHtml = guard === "hold" ? holdGuard() : "";
      const who = heroItem();
      const wash = blunt ? `<i class="hurt-wash" style="-webkit-mask-image:url('${esc(who.battle)}');mask-image:url('${esc(who.battle)}')"></i>` : "";
      return `<div class="hero-shoulder${hurt ? " hurt" : ""}${struck && !hurt ? " struck" : ""}${poison ? " poison" : ""}${blunt ? " blunt" : ""}${heal ? " healed" : ""}${ward || goldSpark ? " ward" : ""}${goldSpark ? " spark-gold" : ""}${guard === "hold" ? " held" : ""}${fatal ? " fatal" : ""}">${vitals}<div class="hero-body" style="aspect-ratio:${who.battleRatio}"><img class="hero-fig" src="${who.battle}" alt="${esc(who.name)}">${wash}${hit}${healHtml}${wardHtml}${guardHtml}${hitPop || ""}</div></div>`;
    }

    function startHeroIdle() {
      const canvas = document.querySelector(".hero-live");
      const gen = ++heroLiveGen;
      cancelAnimationFrame(heroLiveRaf);
      if (!canvas) return;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      ensureHeroImage().then((img) => {
        if (gen !== heroLiveGen || !canvas.isConnected) return;
        runHeroLive(canvas, img, gen, reduce);
      }).catch(() => {});
    }

    function runHeroLive(canvas, img, gen, reduce) {
      const ctx = canvas.getContext("2d", { alpha: true });
      let model = null;
      let frame = null;
      let last = 0;

      function rebuild() {
        const cssW = Math.max(1, canvas.clientWidth);
        const cssH = Math.max(1, canvas.clientHeight);
        let dpr = Math.min(window.devicePixelRatio || 1, 1.35);
        let cw = Math.round(cssW * dpr);
        let ch = Math.round(cssH * dpr);
        const cap = 680;
        if (cw > cap) {
          ch = Math.round(ch * cap / cw);
          cw = cap;
        }
        canvas.width = cw;
        canvas.height = ch;
        const scale = Math.min(cw / img.naturalWidth, ch / img.naturalHeight);
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        const left = 0;
        const top = ch - dh;
        ctx.imageSmoothingEnabled = true;
        ctx.clearRect(0, 0, cw, ch);
        ctx.drawImage(img, left, top, dw, dh);
        const snap = ctx.getImageData(0, 0, cw, ch);
        const straight = new Uint8ClampedArray(snap.data);
        const premul = new Uint8ClampedArray(straight);
        for (let i = 0; i < premul.length; i += 4) {
          const a = premul[i + 3] / 255;
          premul[i] *= a;
          premul[i + 1] *= a;
          premul[i + 2] *= a;
        }
        const pad = 20;
        const x0 = Math.max(0, Math.floor(left) - pad);
        const y0 = Math.max(0, Math.floor(top) - pad);
        const x1 = Math.min(cw, Math.ceil(left + dw) + pad);
        const y1 = Math.min(ch, Math.ceil(top + dh) + pad);
        const rw = Math.max(0, x1 - x0);
        const rh = Math.max(0, y1 - y0);
        const field = new Float32Array(rw * rh * 10);
        const breathAmp = dh * 0.016;
        for (let y = 0; y < rh; y++) {
          const v = (y0 + y - top) / dh;
          for (let x = 0; x < rw; x++) {
            const u = (x0 + x - left) / dw;
            const head = falloff(Math.hypot((u - 0.30) / 0.22, (v - 0.17) / 0.20));
            let chest = falloff(Math.hypot((u - 0.38) / 0.26, (v - 0.62) / 0.42));
            chest *= smooth01((u - 0.14) / 0.12) * smooth01((v - 0.30) / 0.10);
            let shield = falloff(Math.hypot((u - 0.15) / 0.18, (v - 0.68) / 0.34));
            shield *= smooth01((0.38 - u) / 0.12);
            const arm = smooth01((u - 0.60) / 0.12) * smooth01((v - 0.46) / 0.10) * smooth01((0.92 - v) / 0.10);
            const hair = head * smooth01((0.15 - v) / 0.10);
            const sumW = head + chest + shield + arm;
            if (sumW < 0.04 && hair < 0.04) continue;
            const p = (y * rw + x) * 10;
            field[p] = sumW;
            field[p + 1] = chest * breathAmp * (u - 0.38) * 0.55;
            field[p + 2] = chest * -breathAmp;
            field[p + 3] = head * -((v - 0.38) * dh);
            field[p + 4] = head * ((u - 0.30) * dw);
            field[p + 5] = shield * -((v - 0.68) * dh);
            field[p + 6] = shield * ((u - 0.15) * dw);
            field[p + 7] = arm * -((v - 0.79) * dh);
            field[p + 8] = arm * ((u - 0.88) * dw);
            field[p + 9] = hair;
          }
        }
        model = { cw, ch, straight, premul, field, x0, y0, rw, rh, cssW, cssH, hairAmp: dh * 0.022 };
        frame = ctx.createImageData(cw, ch);
      }

      function paint(now) {
        const dst = frame.data;
        const { cw, ch, straight, premul, field, x0, y0, rw, rh, hairAmp } = model;
        dst.set(straight);
        const t = now / 1000;
        const breath = Math.sin(t * 1.05);
        const hairS = Math.sin(t * 0.78 + 1.2);
        const headA = Math.sin(t * 0.4) * 0.012;
        const shieldA = Math.sin(t * 0.48 + 0.9) * 0.07;
        const armA = Math.sin(t * 0.55 + 2.0) * 0.09;
        for (let y = 0; y < rh; y++) {
          const cy = y0 + y;
          const row = y * rw;
          for (let x = 0; x < rw; x++) {
            const p = (row + x) * 10;
            const sumW = field[p];
            const hairW = field[p + 9];
            if (sumW < 0.04 && hairW < 0.04) continue;
            let dx = 0;
            let dy = 0;
            dx = breath * field[p + 1] + headA * field[p + 3] + shieldA * field[p + 5] + armA * field[p + 7];
            dy = breath * field[p + 2] + headA * field[p + 4] + shieldA * field[p + 6] + armA * field[p + 8];
            dx += hairS * hairAmp * hairW;
            dy += hairS * hairAmp * 0.22 * hairW;
            const sx = x0 + x - dx;
            const sy = cy - dy;
            const xi = sx | 0;
            const yi = sy | 0;
            const di = (cy * cw + x0 + x) * 4;
            if (xi < 0 || yi < 0 || xi + 1 >= cw || yi + 1 >= ch) {
              dst[di] = dst[di + 1] = dst[di + 2] = dst[di + 3] = 0;
              continue;
            }
            const tx = sx - xi;
            const ty = sy - yi;
            const ax = 1 - tx;
            const ay = 1 - ty;
            const i00 = (yi * cw + xi) * 4;
            const i10 = i00 + 4;
            const i01 = i00 + cw * 4;
            const i11 = i01 + 4;
            const w00 = ax * ay;
            const w10 = tx * ay;
            const w01 = ax * ty;
            const w11 = tx * ty;
            const a = premul[i00 + 3] * w00 + premul[i10 + 3] * w10 + premul[i01 + 3] * w01 + premul[i11 + 3] * w11;
            if (a < 1) {
              dst[di] = dst[di + 1] = dst[di + 2] = dst[di + 3] = 0;
              continue;
            }
            const inv = 255 / a;
            dst[di] = (premul[i00] * w00 + premul[i10] * w10 + premul[i01] * w01 + premul[i11] * w11) * inv;
            dst[di + 1] = (premul[i00 + 1] * w00 + premul[i10 + 1] * w10 + premul[i01 + 1] * w01 + premul[i11 + 1] * w11) * inv;
            dst[di + 2] = (premul[i00 + 2] * w00 + premul[i10 + 2] * w10 + premul[i01 + 2] * w01 + premul[i11 + 2] * w11) * inv;
            dst[di + 3] = a;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }

      function tick(now) {
        if (gen !== heroLiveGen || !canvas.isConnected) return;
        if (canvas.clientWidth !== model.cssW || canvas.clientHeight !== model.cssH) rebuild();
        if (!document.hidden && now - last >= 64) {
          last = now;
          paint(now);
        }
        heroLiveRaf = requestAnimationFrame(tick);
      }

      rebuild();
      if (reduce) return;
      paint(performance.now());
      heroLiveRaf = requestAnimationFrame(tick);
    }
    function traitNote() {
      const trait = enemyNow().trait;
      if (!trait) return "";
      return `<aside class="trait-note"><span class="trait-label">特性</span><span>${esc(trait)}</span></aside>`;
    }

    function sortedCards(cards) {
      return cards.slice().sort((a, b) => {
        const ga = cardGenreRank(a);
        const gb = cardGenreRank(b);
        if (ga !== gb) return ga - gb;
        const ca = Number(a.cost) || 0;
        const cb = Number(b.cost) || 0;
        if (ca !== cb) return ca - cb;
        return a.name.localeCompare(b.name, "ja");
      });
    }

    function deckGroup(label, cards) {
      const faces = sortedCards(cards).map((card) =>
        `<div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div>`
      ).join("");
      const heading = label ? `${label} ${cards.length}` : `${cards.length}枚`;
      return `<section class="deck-group"><h3>${heading}</h3><div class="deck-cards">${faces || `<p class="deck-empty">なし</p>`}</div></section>`;
    }

    function eventToolsHtml() {
      const map = `<aside class="event-map${eventMapOpen ? " on" : ""}">${roadMapHtml()}</aside>`;
      const label = eventMapOpen ? "MAP:ON" : "MAP:OFF";
      return `${map}<div class="event-hud"><button type="button" class="small-btn" data-action="deck">デッキ確認</button><button type="button" class="small-btn" data-action="title">タイトル</button><button type="button" class="small-btn${eventMapOpen ? " on" : ""}" data-action="toggle-map">${label}</button></div>`;
    }

    function deckOverlay() {
      if (!showDeck || outcome || askLeave) return "";

      return `<div class="overlay deck-view"><div class="panel"><h2>マイデッキ</h2><div class="deck-scroll">${deckGroup("", cards)}</div><button type="button" data-action="close-deck">閉じる</button></div></div>`;

    function foeDeckOverlay() {
      if (!showFoeDeck || outcome || askLeave || !enemy) return "";
      const n = sourcePattern().length;
      const lead = "毎ターン、残りの中からSPDの枚数だけ無作為に置く。置けない枠は怒りが代わりに入る（ATK+2、DEF-2。1回だけ）。置いたあと、捨て札を山札に戻す。残りの枠があれば、戻した山札から引く。";
      return `<div class="overlay deck-view foe-deck-view"><div class="panel wide"><h2>${esc(enemy.name)}の山札</h2><p class="deck-lead">${lead}</p><div class="deck-scroll"><section class="deck-group"><h3>${n}枚</h3>${foeDeckCards()}</section></div><button type="button" data-action="close-foe-deck">閉じる</button></div></div>`;
    }

    // 敵の行動パターン（山札）。順番は見せず、中身だけ。
    function foeDeckCards() {
      const cards = sortedCards(sourcePattern());
      const faces = cards.map((card) => `<div class="card preview foe" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div>`).join("");
      return `<div class="deck-cards">${faces || `<p class="deck-empty">なし</p>`}</div>`;
    }

    function foePileFace(count, discard) {
      const empty = count === 0;
      const look = empty ? "empty" : discard ? "back discard" : "back";
      const stack = count > 1 ? " stack" : "";
      return `<div class="pile-card ${look}${stack}"><span class="pile-count">${count}</span></div>`;
    }

    function foePileMarkup() {
      const left = foeDeckRemain();
      const dumped = foeDiscard.length;
      return `<div class="foe-piles"><button type="button" class="foe-pile${showFoeDeck ? " open" : ""}" data-action="foe-deck" aria-label="${esc(enemy.name)}の山札 ${left}枚を見る" aria-pressed="${showFoeDeck ? "true" : "false"}">${foePileFace(left, false)}<div class="pile-label">山札</div></button><div class="foe-discard" aria-label="${esc(enemy.name)}の捨て札 ${dumped}枚">${foePileFace(dumped, true)}<div class="pile-label">捨て札</div></div></div>`;
    }

    function clearFoeDeckPop() {
      document.querySelectorAll("#stage-float > .foe-deck-pop, body > .foe-deck-pop").forEach((el) => el.remove());
    }

    const PATHS = {
      camp: { name: "休憩", text: "最大HPの20%回復する。", image: "path-rest.jpg?v=3" },
      straight: { name: "戦闘", text: "このダンジョンの敵と戦う。", image: "path-fight.jpg?v=5" },
      search: { name: "探索", text: "装備だけ。戦闘にはならない。", image: "path-search.jpg?v=13" },
      beggar: { name: "物乞い", text: "カードを1枚捨てると、物乞いが襲ってくる。", image: "path-beggar.jpg?v=6" },
      shop: { name: "お店", text: "★で買い物。カード2つと装備2つ。", image: "path-shop.jpg?v=12" },
      lost: { name: "迷子", text: "見えている2枚を消して、道を引き直す。階は進まない。", image: "path-lost.jpg?v=11" },
      smith: { name: "鍛冶屋", text: "合成は★3。エンチャントは★2。★が無いと使えない。", image: "path-smith.svg?v=2" },
      unknown: { name: "遭遇", text: "物乞いか、祝福が起きる。", image: "path-unknown.jpg?v=9" },
      train: { name: "修行", text: "カードを3つから1つ選ぶ。デッキの1枚が熟練する。", image: "path-train.jpg?v=5" },
      bless: { name: "祝福", text: "女神が三つを差し出す。", image: "path-bless-v4.jpg?v=1" },
    };
    // 右の1枠。左は休憩、真ん中は戦闘で固定
    const PATH_RIGHT = ["search", "beggar", "shop", "lost", "unknown", "train"];
    // 迷子は、見えている2つと迷子自身を除く。休憩・戦闘を含め、ボス戦は入れない。祝福は遭遇だけ
    const LOST_POOL = ["camp", "straight", "search", "beggar", "shop", "unknown", "train"];

    function starsForRank(rank) {
      if (rank === "★★★★") return 4;
      if (rank === "強敵") return 3;
      if (rank === "普通") return 2;
      return 1;
    }

    // 初期デッキは CARDS、報酬は WARRIOR／COMMON。名前だけで引くときはここを通す。
    function cardDef(name) {
      return CARDS[name] || WARRIOR[name] || COMMON[name] || null;
    }

    function keepCard(card) {
      const next = { name: card.name, cost: card.cost, text: card.text, damage: card.damage, block: card.block };
      if (card.kind) next.kind = card.kind;
      if (card.focus) next.focus = card.focus;
      if (card.parry) next.parry = true;
      if (card.poison) next.poison = Number(card.poison) || 1;
      if (card.thorns) next.thorns = Number(card.thorns) || 1;
      if (card.press) next.press = true;
      if (card.power) next.power = true;
      if (card.rage) next.rage = true;
      if (card.during) next.during = true;
      if (card.flash) next.flash = true;
      if (card.burst) next.burst = true;
      if (card.expose) next.expose = card.expose;
      if (card.fullBonus) next.fullBonus = card.fullBonus;
      if (card.safeBonus) next.safeBonus = card.safeBonus;
      if (card.kick) next.kick = card.kick;
      if (card.headbutt) next.headbutt = true;
      if (card.poise) next.poise = true;
      if (card.guardBreak) next.guardBreak = true;
      if (card.fullOnly) next.fullOnly = true;
      if (card.finisher) next.finisher = true;
      if (card.knife) next.knife = true;
      if (card.parryAdd) next.parryAdd = card.parryAdd;
      if (card.doubleNext) next.doubleNext = true;
      if (card.masterOnce) next.masterOnce = true;
      if (card.magicParry) next.magicParry = true;
      if (card.pride) next.pride = true;
      if (card.shave) next.shave = card.shave;
      if (card.step) next.step = true;
      if (card.unrated) next.unrated = true;
      if (card.coward) next.coward = true;
      if (card.note) next.note = card.note;
      if (card.hits) next.hits = card.hits;
      if (card.nextDraw) next.nextDraw = card.nextDraw;
      if (card.redTimes) next.redTimes = card.redTimes;
      if (card.counter) next.counter = card.counter;
      if (card.heal) next.heal = card.heal;
      if (card.instant) next.instant = true;
      if (card.quick) next.quick = true;
      if (card.permanent) next.permanent = true;
      if (card.keep) next.keep = true;
      if (card.draw) next.draw = card.draw;
      if (card.critChance) next.critChance = Number(card.critChance) || 0;
      if (card.halfOnly) next.halfOnly = true;
      if (card.burn) next.burn = card.burn;
      if (card.burnFirst) next.burnFirst = true;
      next.stars = card.unrated ? 0 : (card.stars || 1);
      return next;
    }

    function playerCopy(card) {
      // 敵のカードに「+」の概念は無い。アタック／ブロックは奪うと自分の基本版になる。旧名アタック+等は互換だけ。
      let name = String(card.name || "");
      if (name === "アタック+" || name === "ブロック+") name = name.slice(0, -1);
      if (name === "アタック" || name === "ブロック") {
        return { ...keepCard({ name, ...CARDS[name], stars: 1 }), source: "敵" };
      }
      return { ...keepCard({ ...card, name, stars: 1 }), source: "敵" };
    }

    function classCards() {
      if (job !== "戦士") return [];
      const starter = new Set(CARD_POOL.map(([name]) => name));
      return Object.keys(WARRIOR).filter((name) => !starter.has(name)).map((name) => ({ ...keepCard({ name, ...WARRIOR[name] }), source: "戦士" }));
    }

    function rewardPool() {
      const list = Object.keys(COMMON).map((name) => ({ ...keepCard({ name, ...COMMON[name], stars: COMMON[name].stars || 1 }), source: "共通" }));
      list.push(...classCards());
      const seen = new Set();
      for (const card of enemyNow().pattern) {
        if (!card || card.slack || card.name === "チャージアタック") continue;
        const reward = playerCopy(card);
        if (seen.has(reward.name)) continue;
        seen.add(reward.name);
        list.push(reward);
      }
      return list;
    }

    function drawDistinct(n) {
      return shuffle(rewardPool()).slice(0, n);
    }

    // ふだんの3枚は、共通・クラス専用・敵のカードの3プールから1枚ずつ。足りないプールは全体から補う。
    function rewardTrio() {
      const all = rewardPool();
      const picks = [];
      const seen = new Set();
      for (const source of ["共通", "戦士", "敵"]) {
        const pool = all.filter((card) => card.source === source && !seen.has(card.name));
        const card = pickWeighted(pool, (item) => rarityWeight(item.stars));
        if (card) { picks.push(card); seen.add(card.name); }
      }
      while (picks.length < 3) {
        const pool = all.filter((card) => !seen.has(card.name));
        const card = pickWeighted(pool, (item) => rarityWeight(item.stars));
        if (!card) break;
        picks.push(card);
        seen.add(card.name);
      }
      return shuffle(picks);
    }

    function clearReward() {
      rewardReady = false;
      rewardStars = 0;
      pendingStars = 0;
      rewardPicks = [];
      rewardPaths = [];
      rewardStep = "cards";
    }

    function removeBagOne(id) {
      if (!Array.isArray(pathBag)) return;
      const at = pathBag.indexOf(id);
      if (at >= 0) pathBag.splice(at, 1);
    }

    function nodePathName(node) {
      const names = {
        "出来事:探索": "探索",
        "出来事:未知": "遭遇",
        "出来事:キャンプ": "休憩",
        "出来事:お店": "お店",
        "出来事:物乞い": "物乞い",
        "出来事:修行": "修行",
        "出来事:鍛冶屋": "鍛冶屋",
        "出来事:祝福": "祝福",
      };
      if (!node) return "";
      if (names[node]) return names[node];
      if (String(node).startsWith("出来事:")) return "";
      return "戦闘";
    }

    function rollPathsLegacy() {
      const pool = shuffle(["camp"].concat(PATH_RIGHT));
      const paths = [pool[0], "straight", pool[1]];
      if (!hpHalf(player)) {
        hurtRestUsed = false;
        return paths;
      }
      if (hurtRestUsed || paths.indexOf("camp") >= 0) return paths;
      paths[Math.random() < 0.5 ? 0 : 2] = "camp";
      hurtRestUsed = true;
      return paths;
    }

    function rollPaths() {
      if (!Array.isArray(pathBag)) return rollPathsLegacy();
      const prev = nodePathName(route[battleIndex]);
      const others = pathBag.some((id) => PATHS[id] && PATHS[id].name !== prev);
      const picked = [];
      const seen = new Set();
      for (const id of shuffle(pathBag)) {
        const path = PATHS[id];
        if (!path || seen.has(path.name)) continue;
        if (path.name === prev && others) continue;
        picked.push(id);
        seen.add(path.name);
        if (picked.length >= 3) break;
      }
      if (!picked.length && pathBag.length) picked.push(pathBag[0]);
      return picked;
    }

    function resolveLost(shown) {
      const ban = new Set([].concat(shown || [], ["lost"]));
      const rest = LOST_POOL.filter((id) => !ban.has(id));
      return shuffle(rest.length ? rest : ["search"])[0];
    }

    function resolveEncounter() {
      return Math.random() < 0.5 ? "beggar" : "bless";
    }

    function pathNode(id) {
      return {
        camp: "出来事:キャンプ",
        search: "出来事:探索",
        shop: "出来事:お店",
        beggar: "出来事:物乞い",
        train: "出来事:修行",
        bless: "出来事:祝福",
        smith: "出来事:鍛冶屋",
      }[id] || "";
    }

    function pathIdForNode(node) {
      const name = String(node || "");
      if (!name) return "";
      if (name === DUNGEON.boss || !isEventNode(name)) return "straight";
      return {
        "出来事:祝福": "bless",
        "出来事:キャンプ": "camp",
        "出来事:探索": "search",
        "出来事:お店": "shop",
        "出来事:物乞い": "beggar",
        "出来事:修行": "train",
        "出来事:鍛冶屋": "smith",
      }[name] || "";
    }

    function pathAlreadyAtNext(id) {
      const at = battleIndex + 1;
      const node = route[at];
      if (!node) return false;
      if (id === "straight") return !isEventNode(node);
      return pathNode(id) === node;
    }

    function offerPathChoice(paths) {
      rewardPaths = (paths || []).filter((id) => PATHS[id]);
      if (!rewardPaths.length) return false;
      rewardStep = "paths";
      if (screen !== "battle") {
        floorPhase = "paths";
        screen = "floor";
      }
      persistSave(true);
      render();
      return true;
    }

    function isBossFight() {
      return bossNow();
    }

    function bossChoices() {
      const foe = enemyNow();
      const card = shuffle(foe.pattern.map((item) => playerCopy(item)))[0] || null;
      const item = shuffle(GEAR_ITEMS)[0] || null;
      const bracelet = BOSS_GEAR.find((entry) => entry.id === "minotaur-bracelet") || null;
      const picks = [];
      if (card) picks.push({ kind: "card", card });
      if (item) picks.push({ kind: "gear", gear: item });
      if (bracelet) picks.push({ kind: "gear", gear: bracelet });
      return picks;
    }

    // お店の値段はレアリティ（★の数）と同じ。★が決まっていない品は値段も未定で、買えない。
    function shopPrice(slot) {
      if (!slot) return null;
      if (slot.kind === "card" && slot.card) return Number(slot.card.stars) || 1;
      if (slot.kind === "gear" && slot.gear) return Number(slot.gear.stars) > 0 ? Number(slot.gear.stars) : null;
      return null;
    }

    function rollShopStock() {
      const cards = takeWeighted(classCards(), 2, (card) => rarityWeight(card.stars)).map((card) => ({ kind: "card", card }));
      const items = shuffle(GEAR_ITEMS).slice(0, 2).map((item) => ({ kind: "gear", gear: item }));
      return cards.concat(items).map((slot) => ({ ...slot, price: shopPrice(slot), sold: false }));
    }

    function buyShop(index) {
      const slot = (shopStock || [])[index];
      if (!slot || slot.sold) return;
      const price = slot.price == null ? shopPrice(slot) : slot.price;
      if (price == null) return;
      const have = Number(meta.stars) || 0;
      if (have < price) return;
      meta.stars = have - price;
      persistMeta();
      if (slot.kind === "card") {
        stolen.push(keepCard(slot.card));
      } else if (slot.kind === "gear") {
        if (!gear) gear = emptyGear();
        if (offerWeapon(slot.gear, { source: "shop", shopIndex: index, price })) {
          persistSave(true);
          render();
          return;
        }
        giveGear(slot.gear);
      }
      slot.sold = true;
      persistSave(true);
      render();
    }

    function rollVictoryExtra() {
      victoryGear = null;
      const boss = typeof bossNow === "function" && bossNow();
      const table = boss ? VICTORY_EXTRA.boss : VICTORY_EXTRA.road;
      const kind = pickWeighted(Object.keys(table), (key) => table[key]);
      if (kind === "gear") {
        const item = shuffle(GEAR_ITEMS)[0];
        if (!item) return "";
        if (!gear) gear = emptyGear();
        giveGear(item);
        victoryGear = item;
        return `${item.name}を手に入れた。`;
      }
      if (kind === "item") {
        const names = EXTRA_ITEM_NAMES.filter((name) => cardDef(name));
        const name = pickWeighted(names, (itemName) => rarityWeight((cardDef(itemName) || {}).stars));
        if (!name) return "";
        const def = cardDef(name);
        stolen.push(keepCard({ name, ...def, stars: def.stars || 1 }));
        return `${name}を手に入れた。`;
      }
      if (kind !== "enchant") return "";
      const names = enchantTargets();
      if (!names.length) return "";
      const name = shuffle(names)[0];
      const elem = pickWeighted(ENCHANT_ELEMS, enchantWeight);
      const word = grantEnchant(name, elem);
      if (!runEnchants[name]) return "";
      const face = enchantFace(elem);
      const added = word ? `　${word}` : "";
      return `${name}に、${face.name}のエンチャント。${face.sub}${added}。`;
    }

    function prepareReward() {
      if (rewardReady) return;
      rewardReady = true;
      gainLevel();
      dropLine = rollVictoryExtra();
      const foe = enemyNow();
      const medal = bossNow() && foe.medal ? gearItem(foe.medal) : null;
      // ボスも道中と同じく★をもらう。戦利品は、その敵に枠があるときだけ追加
      rewardStars = foe.tier || starsForRank(foe.rank);
      starBurst = rewardStars;
      pendingStars = rewardStars;
      meta.stars = (Number(meta.stars) || 0) + rewardStars;
      persistMeta();
      rewardPaths = [];
      bossPicks = [];
      shopStock = [];
      if (bossNow()) {
        if (medal) {
          giveGear(medal);
          log(`${heroName()}は${medal.name}を手に入れた。`);
        }
        rewardPicks = [];
        bossPicks = bossChoices();
        rewardStep = "boss";
        armRare("reward");
        return;
      }
      rewardPicks = rewardTrio();
      rewardStep = "cards";
      armRare("reward");
    }

    function takeBossPick(index) {
      if (rewardStep !== "boss") return;
      const pick = bossPicks[index];
      if (!pick) return;
      playPickCenter(`[data-action="reward-boss"][data-reward="${index}"]`, () => {
        if (rewardStep !== "boss") return;
        const flight = pick.kind === "card" && pick.card
          ? captureRewardCardFlight(`[data-action="reward-boss"][data-reward="${index}"] .card`)
          : null;
        if (pick.kind === "card" && pick.card) stolen.push(keepCard(pick.card));
        if (pick.kind === "gear" && pick.gear) {
          if (!gear) gear = emptyGear();
          if (offerWeapon(pick.gear, { source: "boss" })) {
            if (flight) flight.ghost.remove();
            persistSave(true);
            render();
            return;
          }
          giveGear(pick.gear);
        }
        bossPicks = [];
        offerPathsOrAdvance();
        flyRewardCardToDeck(flight);
      });
    }

    // 報酬を選んだあと、もらった★がステータスの★へ飛んで吸い込まれ、届くたびに数が増える
    function starStartPoints() {
      const burst = [...document.querySelectorAll(".fly-star")].map((el) => el.getBoundingClientRect());
      if (burst.length) return burst.map((r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 }));
      const el = document.querySelector(".victory-count") || document.querySelector(".overlay .panel");
      const r = el ? el.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 3, width: 0, height: 0 };
      return [{ x: r.left + r.width / 2, y: r.top + r.height / 2 }];
    }

    function starHomePoint() {
      const el = root.querySelector(".hud-top [data-star-count]") || root.querySelector("[data-star-count]");
      if (!el) return { x: window.innerWidth / 2, y: 48 };
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function bumpStarCount() {
      const n = shownStarCount();
      root.querySelectorAll("[data-star-count]").forEach((el) => {
        el.setAttribute("aria-label", `スター ${n}`);
        el.textContent = `★${n}`;
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
      });
    }

    function flyStarsHome(points) {
      const n = pendingStars;
      if (!n) return;
      if (!("animate" in Element.prototype)) { pendingStars = 0; bumpStarCount(); return; }
      const layer = document.createElement("div");
      layer.className = "star-home-layer";
      layer.setAttribute("aria-hidden", "true");
      mountFloat(layer);
      const hop = 90 / stageScale();
      let left = n;
      for (let i = 0; i < n; i++) {
        const from = points[Math.min(i, points.length - 1)];
        const home = starHomePoint();
        const a = viewportToStage(from.x, from.y);
        const b = viewportToStage(home.x, home.y);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const el = document.createElement("span");
        el.className = "home-star";
        el.textContent = "★";
        el.style.left = `${a.x}px`;
        el.style.top = `${a.y}px`;
        layer.appendChild(el);
        const anim = el.animate([
          { transform: "translate(-50%, -50%) scale(1) rotate(0deg)", opacity: 1, offset: 0 },
          { transform: `translate(calc(-50% + ${dx * 0.45}px), calc(-50% + ${dy * 0.45 - hop}px)) scale(0.95) rotate(200deg)`, opacity: 1, offset: 0.5 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.3) rotate(420deg)`, opacity: 0.95, offset: 1 },
        ], { duration: 860, delay: 180 + i * 150, easing: "cubic-bezier(0.32, 0.08, 0.2, 1)", fill: "forwards" });
        anim.onfinish = () => {
          el.remove();
          pendingStars = Math.max(0, pendingStars - 1);
          bumpStarCount();
          left -= 1;
          if (left <= 0) layer.remove();
        };
      }
    }

    function skipReward() {
      if (rewardStep === "cards" || rewardStep === "boss") {
        const from = starStartPoints();
        bossPicks = [];
        offerPathsOrAdvance();
        flyStarsHome(from);
        return;
      }
    }

    function openShop() {
      shopStock = rollShopStock();
      rewardStep = "shop";
      armRare("shop");
      persistSave(true);
      render();
    }

    function shopMarkup(stock, heading, hot) {
      const have = Number(meta.stars) || 0;
      const levels = [];
      const slots = (stock || []).map((slot, index) => {
        const price = slot.price == null ? shopPrice(slot) : slot.price;
        const tag = price == null ? "値段は未定" : `★${price}`;
        const entity = slot.kind === "card" ? slot.card : slot.gear;
        const lv = hot ? rareLevel(entity) : 0;
        if (lv) levels.push(lv);
        let action = "";
        if (slot.sold) action = `<span class="shop-sold">売り切れ</span>`;
        else if (price == null) action = `<button type="button" class="shop-buy" disabled>買えない</button>`;
        else action = `<button type="button" class="shop-buy" data-action="shop-buy" data-slot="${index}" ${have < price ? "disabled" : ""}>買う</button>`;
        const sold = slot.sold ? " sold" : "";
        const limited = slot.limited ? " limited" : "";
        const ribbon = slot.limited ? `<i class="shop-ribbon">ショップ限定</i>` : "";
        const fx = "";
        if (slot.kind === "card" && slot.card) {
          return `<div class="shop-slot${sold}${limited}">${ribbon}<div class="card preview ${cardKind(slot.card)}">${cardFace(slot.card)}</div><span>${esc(tag)}</span>${action}</div>`;
        }
        if (slot.kind === "gear" && slot.gear) {
          const item = slot.gear;
          const face = gearPopShell(item.slot || "sword", {
            item,
            name: item.name || "",
            image: item.image || "",
            rarity: gearRarityText(item),
            embedded: true,
          });
          return `<div class="shop-slot${sold}${limited}">${ribbon}${face}<span>${esc(tag)}</span>${action}</div>`;
        }
        return "";
      }).join("");
      const head = heading ? `<h2>${esc(heading)}</h2><p>所持 ★${have}</p><p>品は4つ。カード2つ、装備2つ。</p>` : `<p class="shop-have">所持 ★${have}</p>`;
      return `${head}<div class="shop-row">${slots}</div>`;
    }

    function flyRewardCardToDeck(made) {
      if (!made || !made.ghost) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        made.ghost.remove();
        return;
      }
      const dest = document.querySelector('[data-pile="deck"] .pile-card');
      if (!dest) {
        made.ghost.remove();
        return;
      }
      const ghost = made.ghost;
      ghost.classList.add("reward-fly");
      const from = made.from;
      const to = stageFrameOf(dest);
      if (!to.w || !to.h || !from.w || !from.h) {
        ghost.remove();
        return;
      }
      const move = stageDelta(from, to);
      const dx = move.dx;
      const dy = move.dy;
      const scale = Math.max(0.16, move.scale);
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.55s cubic-bezier(0.22, 0.7, 0.18, 1), opacity 0.48s ease 0.08s";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-22deg) scale(${scale})`;
          ghost.style.opacity = "0.08";
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 700);
    }

    function captureRewardCardFlight(selector) {
      const el = document.querySelector(selector);
      if (!(el instanceof Element)) return null;
      return makeFlyGhost(el);
    }

    function takeReward(index) {
      if (rewardStep !== "cards") return;
      const card = rewardPicks[index];
      if (!card) return;
      playPickCenter(`[data-action="reward-card"][data-reward="${index}"]`, () => {
        if (rewardStep !== "cards") return;
        const flight = captureRewardCardFlight(`[data-action="reward-card"][data-reward="${index}"] .card`);
        const from = starStartPoints();
        stolen.push(keepCard(card));
        offerPathsOrAdvance();
        flyStarsHome(from);
        flyRewardCardToDeck(flight);
      });
    }

    function skipToNextPlaced() {
      let next = battleIndex + 1;
      while (next < route.length && !route[next]) next += 1;
      if (next >= route.length) {
        rewardPaths = [];
        rewardStep = "done";
        clearReward();
        cleared = true;
        endRun(true);
        screen = "clear";
        render();
        return;
      }
      const pid = pathIdForNode(route[next]);
      if (pid && offerPathChoice([pid])) return;
      rewardPaths = [];
      rewardStep = "done";
      const hp = player ? player.hp : floorHp;
      outcome = null;
      beggarBattle = false;
      battleIndex = next;
      enterNode(hp);
    }

    function offerPathsOrAdvance() {
      const next = battleIndex + 1;
      if (next < route.length && route[next]) {
        const pid = pathIdForNode(route[next]);
        if (pid && offerPathChoice([pid])) return;
        rewardStep = "done";
        advance(1);
        return;
      }
      if (Array.isArray(pathBag) && !pathBag.length) {
        skipToNextPlaced();
        return;
      }
      rewardPaths = rollPaths();
      if (Array.isArray(pathBag) && !rewardPaths.length) {
        skipToNextPlaced();
        return;
      }
      rewardStep = "paths";
      if (screen !== "battle") {
        floorPhase = "paths";
        screen = "floor";
      }
      persistSave(true);
      render();
    }

    function finishEvent() {
      if (route[0] === "出来事:祝福" && floorNo() === 0) {
        offerPathChoice(["straight"]);
        return;
      }
      offerPathsOrAdvance();
    }

    function advance(step) {
      beggarBattle = false;
      const hp = screen === "floor" ? floorHp : (player ? player.hp : floorHp);
      const next = battleIndex + step;
      outcome = null;
      if (next >= battleTotal) {
        clearReward();
        cleared = true;
        endRun(true);
        screen = "clear";
        render();
        return;
      }
      battleIndex = next;
      enterNode(hp);
    }

    function nextFixedFloor() {
      for (let i = battleIndex + 1; i < route.length; i++) {
        if (roadFixed(route[i], i) && floorAt[i] != null) return Number(floorAt[i]);
      }
      return dungeonFloors;
    }

    function nextFloorNumber() {
      const now = floorAt[battleIndex] != null ? Number(floorAt[battleIndex]) : floorNo();
      if (route[0] === "出来事:祝福" && Number(now) === 0) return 1;
      return Math.min(dungeonFloors, nextFixedFloor(), now + 1);
    }

    function dungeonEnemy() {
      return rollRank();
    }

    function placeNext(node) {
      const at = battleIndex + 1;
      const mark = nextFloorNumber();
      if (at >= route.length) {
        route.push(node);
        floorAt.push(mark);
        battleTotal = route.length;
        clampBlessingNext();
        return;
      }
      const next = route[at];
      const locked = !!(next && roadFixed(next, at));
      if (locked) {
        route.splice(at, 0, node);
        floorAt.splice(at, 0, mark);
        battleTotal = route.length;
        clampBlessingNext();
        return;
      }
      route[at] = node;
      floorAt[at] = mark;
      clampBlessingNext();
    }

    function applyPath(id) {
      if (rewardStep === "done" || rewardStep === "cards") return;
      rewardStep = "done";
      if (id === "straight") placeNext(dungeonEnemy());
      advance(1);
    }

    function enterPath(id) {
      if (id === "lost") {
        enterPath(resolveLost(rewardPaths));
        return;
      }
      if (id === "unknown") {
        enterPath(resolveEncounter());
        return;
      }
      if (id === "straight") {
        applyPath(id);
        return;
      }
      const node = pathNode(id);
      if (!node || rewardStep === "done" || rewardStep === "cards") {
        applyPath("straight");
        return;
      }
      rewardStep = "done";
      placeNext(node);
      advance(1);
    }

    function capturePathShot(id) {
      const button = document.querySelector(`[data-action="reward-path"][data-path="${id}"]`);
      const img = button && button.querySelector("img");
      if (button) {
        document.querySelectorAll(".overlay.paths .path-list button").forEach((el) => {
          el.classList.toggle("path-chosen", el === button);
          el.classList.toggle("path-dismiss", el !== button);
        });
      }
      if (!img) return null;
      return { frame: stageFrameOf(img), src: img.getAttribute("src") || "" };
    }

    function pathLandNode() {
      const maps = [...document.querySelectorAll(".road-map")];
      const map = maps.find((el) => el.offsetWidth > 0 && el.offsetHeight > 0) || maps[0];
      if (!map) return null;
      const now = map.querySelector(".road-node.now");
      if (!now) return null;
      const above = now.previousElementSibling;
      if (above && above.classList.contains("road-node") && !above.classList.contains("pad")) return above;
      return now;
    }

    function flyPathIntoMap(shot, done) {
      let settled = false;
      let ghost = null;
      let dest = null;
      const finish = () => {
        if (settled) return;
        settled = true;
        if (ghost && ghost.parentNode) ghost.remove();
        if (dest) dest.classList.remove("path-inbound");
        done();
      };
      placeRoad("instant");
      dest = pathLandNode();
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce || !shot || !shot.frame || !dest || !("animate" in Element.prototype)) {
        finish();
        return;
      }
      const face = dest.querySelector("img, i") || dest;
      const to = stageFrameOf(face);
      const from = shot.frame;
      if (!from.w || !from.h || !to.w || !to.h) {
        finish();
        return;
      }
      dest.classList.add("path-inbound");
      ghost = document.createElement("div");
      ghost.className = "path-flyer";
      ghost.setAttribute("aria-hidden", "true");
      const pic = document.createElement("img");
      pic.alt = "";
      pic.src = shot.src;
      ghost.appendChild(pic);
      ghost.style.left = `${from.cx}px`;
      ghost.style.top = `${from.cy}px`;
      ghost.style.width = `${from.w}px`;
      ghost.style.height = `${from.h}px`;
      mountFloat(ghost);
      const dx = to.cx - from.cx;
      const dy = to.cy - from.cy;
      const arc = Math.max(56, Math.min(170, Math.abs(dx) * 0.2 + 48));
      const sx = Math.max(0.16, to.w / from.w);
      const sy = Math.max(0.16, to.h / from.h);
      const anim = ghost.animate([
        { transform: "translate(-50%, -50%) scale(1.06)", opacity: 1, offset: 0 },
        { transform: `translate(calc(-50% + ${dx * 0.34}px), calc(-50% + ${dy * 0.18 - arc}px)) scale(0.74)`, opacity: 1, offset: 0.46 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${sx}, ${sy})`, opacity: 1, offset: 1 },
      ], { duration: 1000, easing: "cubic-bezier(0.18, 0.74, 0.16, 1)", fill: "forwards" });
      anim.onfinish = finish;
      setTimeout(finish, 1000);
    }

    function beginPathFlight(id, place, step) {
      const shot = capturePathShot(id);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      rewardStep = "lifting";
      const go = () => {
        const button = document.querySelector(`[data-action="reward-path"][data-path="${id}"]`);
        const img = button && button.querySelector("img");
        const live = img ? { frame: stageFrameOf(img), src: img.getAttribute("src") || "" } : shot;
        if (button) button.style.visibility = "hidden";
        rewardStep = "flying";
        requestAnimationFrame(() => requestAnimationFrame(() => {
          flyPathIntoMap(live, () => {
            rewardStep = "done";
            if (place) place();
            advance(step);
            schedulePlaceRoad();
          });
        }));
      };
      if (shot && !reduce) setTimeout(go, 280);
      else go();
    }

    function takePath(id) {
      if (rewardStep !== "paths" || !PATHS[id]) return;
      if (Array.isArray(pathBag) && id === "lost") {
        for (const shown of rewardPaths) removeBagOne(shown);
        rewardPaths = [];
        if (!pathBag.length) {
          skipToNextPlaced();
          return;
        }
        rewardPaths = rollPaths();
        rewardStep = "paths";
        floorPhase = "paths";
        if (screen !== "battle") screen = "floor";
        persistSave(true);
        render();
        return;
      }
      if (Array.isArray(pathBag)) {
        if (id === "unknown") removeBagOne("unknown");
        else removeBagOne(id);
      }
      if (id === "unknown") {
        const resolved = pathNode(resolveEncounter());
        beginPathFlight(id, () => placeNext(resolved || dungeonEnemy()), 1);
        return;
      }
      if (id === "straight") {
        const place = pathAlreadyAtNext(id) ? null : () => placeNext(dungeonEnemy());
        beginPathFlight(id, place, 1);
        return;
      }
      const node = pathNode(id);
      const place = pathAlreadyAtNext(id) ? null : () => placeNext(node || dungeonEnemy());
      beginPathFlight(id, place, 1);
    }

    function offerTone(card) {
      return card && card.source === "敵" ? "foe" : cardKind(card);
    }

    function armRare(id) { rareArmed = id; }

    function takeRare(id) {
      if (rareArmed !== id) return false;
      rareArmed = "";
      return true;
    }

    function rareCaption() { return ""; }

    function gearOfferHtml(item) {
      if (!item) return "";
      return gearPopShell(item.slot || "sword", {
        item,
        name: item.name || "",
        image: item.image || "",
        rarity: gearRarityText(item),
        body: esc(gearSpecialText(item)),
        embedded: true,
      });
    }

    function gearCompareHtml(item) {
      if (!item || !gear) return "";
      const slot = item.slot === "braceletAny"
        ? (!gear.braceletL ? "braceletL" : !gear.braceletR ? "braceletR" : "braceletL")
        : item.slot;
      const now = slot ? gear[slot] : null;
      const fromAtk = Number(now && now.atk) || 0;
      const toAtk = Number(item.atk) || 0;
      const fromDef = Number(now && now.def) || 0;
      const toDef = Number(item.def) || 0;
      const row = (label, from, to) => {
        const d = to - from;
        const cls = d > 0 ? "up" : d < 0 ? "down" : "same";
        const mark = d > 0 ? `+${d}` : d < 0 ? String(d) : "±0";
        return `<div class="delta ${cls}"><span>${label}</span><b>${signed(from)}</b><i>→</i><b>${signed(to)}</b><em>${mark}</em></div>`;
      };
      const rows = [];
      if (fromAtk || toAtk) rows.push(row("ATK", fromAtk, toAtk));
      if (fromDef || toDef) rows.push(row("DEF", fromDef, toDef));
      const fromFx = now ? (weaponExtra(now) || gearEffectPlain(now)) : "";
      const toFx = weaponExtra(item) || gearEffectPlain(item);
      const fx = fromFx !== toFx
        ? `<p class="delta-fx">${esc(fromFx || "効果なし")} → ${esc(toFx || "効果なし")}</p>`
        : "";
      const nowName = now && now.name ? now.name : "なし";
      return `<div class="gear-delta"><p class="delta-names"><span>${esc(nowName)}</span><i>→</i><span>${esc(item.name || "")}</span></p>${rows.join("")}${fx}</div>`;
    }

    function splitEventStory(text) {
      const raw = String(text || "").trim();
      if (!raw) return [];
      if (raw.includes("\n")) return raw.split(/\n+/).map((line) => line.trim()).filter(Boolean);
      const parts = raw.match(/[^。]+。/g);
      if (parts && parts.length > 1) return parts.map((line) => line.trim());
      return [raw];
    }

    // hand-sort-v2
    function sortHand() {
      // 色：黄（スキル）→緑（アイテム）→赤（攻撃）→青（防御）
      const colorRank = (card) => {
        const kind = cardKind(card);
        if (kind === "skill") return 0;
        if (kind === "power") return 1;
        if (kind === "attack") return 2;
        if (kind === "block") return 3;
        return 4;
      };
      const expectDmg = (card) => {
        const hits = expectedHits(card, true, false);
        if (!hits || !hits.length) return 0;
        return hits.reduce((sum, n) => sum + n, 0);
      };
      const expectBlk = (card) => {
        const base = printedBlock(card);
        if (!base && !card.block) return 0;
        return Math.max(0, base + focusLeftFor(card, true));
      };
      const expectHeal = (card) => Number(card.heal) || 0;
      // 手札の並び：色 → コスト → 予想ダメージ昇順 → 予想ブロック昇順 → 予想回復量昇順
      hand.sort((a, b) =>
        colorRank(a) - colorRank(b)
        || (Number(a.cost) || 0) - (Number(b.cost) || 0)
        || expectDmg(a) - expectDmg(b)
        || expectBlk(a) - expectBlk(b)
        || expectHeal(a) - expectHeal(b)
        || String(a.name).localeCompare(b.name, "ja")
      );
    }
