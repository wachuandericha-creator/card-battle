    }

    function heartIcon() {
      return `<svg class="ico heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20.4 10.7 19.2C5.5 14.6 2.2 11.6 2.2 8 2.2 5 4.6 2.6 7.6 2.6c1.7 0 3.4.8 4.4 2.1 1-1.3 2.7-2.1 4.4-2.1 3 0 5.4 2.4 5.4 5.4 0 3.6-3.3 6.6-8.5 11.2L12 20.4z"/></svg>`;
    }

    function manaIcon() {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>`;
    }

    function bootIcon() {
      return `<svg class="ico boot" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 1.4h6.4v2.6h-1.2V9h6.4c2.1 0 3.6 1.6 3.6 3.5 0 1.7-1.4 3.1-3.2 3.1H7.2V4.2h.8V1.4z"/></svg>`;
    }

    function actionMark(intent, big) {
      const size = big ? "big" : "small";
      if (intent.type === "attack") {
        return `<span class="act attack ${size}" aria-label="攻撃 ${intent.value}">${swordIcon()}<b>${intent.value}</b></span>`;
      }
      if (intent.type === "block") {
        return `<span class="act block ${size}" aria-label="シールド ${intent.value}">${shieldIcon()}<b>${intent.value}</b></span>`;
      }
      return `<span class="act skill ${size}" aria-label="スキル">★</span>`;
    }

    function sourcePattern() {
      const foe = enemyNow();
      const base = (foe.pattern || []).map((card) => applyEnemyHidden(card, foe));
      if (foe.name === "物乞い") {
        return base.concat((beggarGift || []).map((card) => ({ ...card })));
      }
      return base;
    }

    function deckKey(cards) {
      return (cards || []).map((card) => card.name).sort().join("|");
    }

    function startEnemyLoop(first) {
      enemyLoop = shuffle(sourcePattern());
      intentIndex = first && enemyLoop.length ? Math.floor(Math.random() * enemyLoop.length) : 0;
    }

    function advanceEnemyLoop() {
      intentIndex += 1;
      if (enemyLoop.length && intentIndex >= enemyLoop.length) startEnemyLoop(false);
    }

    function restoreEnemyLoop(data) {
      const saved = Array.isArray(data.enemyLoop) ? data.enemyLoop : [];
      if (saved.length && deckKey(saved) === deckKey(sourcePattern())) {
        enemyLoop = saved.map((card) => ({ ...card }));
        intentIndex = Number.isInteger(data.intentIndex) ? data.intentIndex : 0;
        if (intentIndex < 0 || intentIndex >= enemyLoop.length) startEnemyLoop(false);
        return;
      }
      startEnemyLoop(true);
    }

    function intentAt(offset) {
      if (!enemyLoop.length) startEnemyLoop(false);
      const at = intentIndex + (offset || 0);
      if (at >= 0 && at < enemyLoop.length) return enemyLoop[at];
      return enemyLoop[Math.min(intentIndex, enemyLoop.length - 1)];
    }

    function applyDamage(target, amount) {
      const blocked = Math.min(target.block, amount);
      target.block -= blocked;
      const hpLoss = amount - blocked;
      target.hp = Math.max(0, target.hp - hpLoss);
      target.hit = true;
      return { blocked, hpLoss };
    }

    function shownEnemy() {
      return shown.enemy == null ? enemy.hp : shown.enemy;
    }

    function shownPlayer() {
      return shown.player == null ? player.hp : shown.player;
    }

    function bindShown() {
      if (player) shown.player = player.hp;
      if (enemy) shown.enemy = enemy.hp;
    }

    function drainMs() {
      const enemyGap = enemy ? Math.abs(enemy.hp - shownEnemy()) : 0;
      const playerGap = player ? Math.abs(player.hp - shownPlayer()) : 0;
      const enemyWait = enemyGap < 0.2 ? 0 : Math.min(1700, Math.max(620, (enemyGap / 6.5) * 1000));
      const playerWait = playerGap < 0.2 ? 0 : Math.min(fxFatal ? 3200 : 2400, Math.max(fxFatal ? 1800 : 900, (playerGap / (fxFatal ? 2.2 : 4)) * 1000));
      return Math.max(enemyWait, playerWait);
    }

    function paintShown() {
      for (const who of ["enemy", "player"]) {
        const hp = who === "enemy" ? shown.enemy : shown.player;
        const max = who === "enemy" ? enemy && enemy.maxHp : player && player.maxHp;
        if (hp == null || !max) continue;
        const bar = root.querySelector(`[data-bar="${who}"]`);
        const cap = who === "player" ? HP_CAP : max;
        if (bar) bar.style.width = `${Math.max(0, Math.min(100, (hp / cap) * 100))}%`;
        const text = String(Math.max(0, Math.round(hp)));
        root.querySelectorAll(`[data-hp="${who}"]`).forEach((el) => { el.textContent = text; });
      }
    }

    function pumpHp(stamp) {
      const dt = hpStamp ? Math.min(0.05, (stamp - hpStamp) / 1000) : 0.016;
      hpStamp = stamp;
      const ease = (current, target, quick) => {
        const diff = target - current;
        if (Math.abs(diff) < 0.04) return target;
        const speed = quick
          ? Math.max(6.5, Math.abs(diff) / 1.5)
          : fatalHold
            ? Math.max(1.35, Math.abs(diff) / 5.2)
            : Math.max(4, Math.abs(diff) / 2.4);
        return current + Math.sign(diff) * Math.min(Math.abs(diff), speed * dt);
      };
      let moving = false;
      if (enemy && shown.enemy != null && Math.abs(shown.enemy - enemy.hp) >= 0.04) {
        shown.enemy = ease(shown.enemy, enemy.hp, true);
        moving = true;
      } else if (enemy) shown.enemy = enemy.hp;
      if (player && shown.player != null && Math.abs(shown.player - player.hp) >= 0.04) {
        shown.player = ease(shown.player, player.hp, false);
        moving = true;
      } else if (player) shown.player = player.hp;
      paintShown();
      hpFrame = moving ? requestAnimationFrame(pumpHp) : 0;
    }

    function kickHp() {
      if (player && shown.player == null) shown.player = player.hp;
      if (enemy && shown.enemy == null) shown.enemy = enemy.hp;
      hpStamp = 0;
      if (hpFrame) cancelAnimationFrame(hpFrame);
      hpFrame = requestAnimationFrame(pumpHp);
    }

    function finalDamageLine(actor, card, result) {
      if (result.blocked && !result.hpLoss) return `${actor}は${card}。ブロックで防いだ。`;
      return `${actor}は${card}で${result.hpLoss}ダメージ。`;
    }

    function damageSentence(actor, card, raw, result) {
      return finalDamageLine(actor, card, result);
    }

    function mitigate(amount, defense) {
      const def = Number(defense) || 0;
      const incoming = Math.max(0, amount);
      if (def < 0) return { reduced: 0, dealt: incoming - def };
      const reduced = Math.min(def, incoming);
      return { reduced, dealt: incoming - reduced };
    }

    function parryCount(target) {
      if (!target || !target.parry) return 0;
      if (target.parry === true) return 1;
      return Math.max(0, Number(target.parry) || 0);
    }

    function clearBattleMods() {
      if (!player) return;
      player.atkMod = 0;
      player.defMod = 0;
      player.expose = 0;
      player.guardThrough = false;
      player.parry = 0;
      player.burn = 0;
      player.hurtThis = false;
      player.hurtLast = false;
      player.extraDraw = 0;
      syncGearStats();
    }

    function gainParry(card) {
      const now = parryCount(player);
      if (now > 0 && ultimate !== "パリィが重複する") {
        log(`${heroName()}は${card.name}。パリィは重複しない。`, card);
        return;
      }
      player.parry = now + 1;
      const detail = ultimate === "パリィが重複する" ? `パリィ${player.parry}。` : "パリィを得た。次の攻撃を無効。";
      log(`${heroName()}は${card.name}。${detail}`, card);
    }

    function gainBlock(amount, card) {
      const gain = Math.max(0, Math.floor(Number(amount) || 0));
      if (!gain) return;
      if (parryCount(player) > 0 && !player.guardThrough) {
        log(`${heroName()}は${card.name}。パリィ中はシールドを得られない。`, card);
        return;
      }
      player.block += gain;
      log(`${heroName()}は${card.name}でブロック${gain}。`, card);
    }

    function hurtSentence(actor, card, raw, reduced, result) {
      return finalDamageLine(actor, card, result);
    }

    function strikeSentence(actor, card, base, focusAdd, atk, result) {
      return finalDamageLine(actor, card, result);
    }

    function hitPower(n) {
      const value = Math.max(1, Number(n) || 1);
      return Math.max(0, Math.min(1, (value - 1) / 14)).toFixed(2);
    }

    function noteHit(side, landed, swung) {
      const n = landed > 0 ? landed : swung;
      if (n > 0) fxHit = { side, n };
      if (n > 0 && side === "enemy") fxFoeHits.push(n);
    }

    // 敵への斬撃エフェクト。1ターンの中で 右上→左下、左上→右下、上→下 の順に回す。
    // 2回攻撃のカードは、この順を2つ進める。
    function slashFoe() {
      fxSlash = true;
      fxSlashes.push(slashSeq % 3);
      slashSeq += 1;
    }

    function poisonSentence(name, raw, reduced, result) {
      if (result.blocked && !result.hpLoss) return `${name}は毒。ブロックで防いだ。`;
      return `${name}は毒で${result.hpLoss}ダメージ。`;
    }

    function poisonStacks(target) {
      return Math.max(0, Number(target && target.poison) || 0);
    }

    function addPoison(target, amount) {
      if (target === player && hasStatusImmune()) {
        log(`${heroName()}は${gear.shield.name}。毒を無視した。`);
        return false;
      }
      target.poison = poisonStacks(target) + Math.max(1, Number(amount) || 1);
      return true;
    }

    function poisonBadge(stacks) {
      if (!stacks) return "";
      return `<span class="hint poison-mark">毒+${stacks}<i>${esc(POISON_NOTE)}</i></span>`;
    }

    function tickPoison(who) {
      const target = who === "player" ? player : enemy;
      const stacks = poisonStacks(target);
      if (!stacks) return false;
      const name = who === "player" ? heroName() : enemy.name;
      let amount = stacks;
      if (who === "player") {
        const extra = Math.max(0, Number(player.expose) || 0);
        if (extra) {
          player.expose = 0;
          amount += extra;
        }
      }
      const result = applyDamage(target, amount);
      if (who === "player" && result.hpLoss > 0) player.hurtThis = true;
      if (who === "player") {
        if (result.hpLoss > 0) {
          fxHurt = true;
          noteHit("player", result.hpLoss, amount);
          lastFoeBlow = { name: "毒", hpLoss: result.hpLoss };
          if (target.hp <= 0) {
            fxFatal = true;
            fatalHold = true;
          }
        }
        if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      } else if (result.hpLoss || result.blocked) {
        slashFoe();
        noteHit("enemy", result.hpLoss, stacks);
      }
      log(poisonSentence(name, stacks, 0, result));
      return target.hp <= 0;
    }

    function takeEnemyHit(raw, card) {
      const name = card && card.name ? card.name : "攻撃";
      const stacks = parryCount(player);
      if (stacks > 0) {
        player.parry = stacks - 1;
        noteHit("player", 0, raw);
        log(`${enemy.name}は${name}。パリィで無効。`, card, true);
        return;
      }
      const extra = Math.max(0, Number(player.expose) || 0);
      if (extra) player.expose = 0;
      const cut = mitigate(raw + extra, player.def);
      const result = applyDamage(player, cut.dealt);
      if (result.hpLoss > 0) {
        player.hurtThis = true;
        fxHurt = true;
        noteHit("player", result.hpLoss, cut.dealt);
        lastFoeBlow = { name, hpLoss: result.hpLoss };
        if (player.hp <= 0) {
          fxFatal = true;
          fatalHold = true;
        }
      }
      if (result.blocked > 0) fxGuard = result.hpLoss > 0 ? "break" : "hold";
      log(hurtSentence(enemy.name, name, raw + extra, cut.reduced, result), card, true);
      // バトルカウンター：ダメージを食らったら、いまのDEFだけ相手へ
      if (result.hpLoss > 0 && hasReflectDef() && enemy.hp > 0 && player.hp > 0) {
        const reflect = Math.max(0, Number(player.def) || 0);
        if (reflect > 0) {
          const back = mitigate(reflect, enemyDef());
          const hit = applyDamage(enemy, back.dealt);
          if (back.dealt > 0 && (hit.hpLoss || hit.blocked)) {
            slashFoe();
            noteHit("enemy", hit.hpLoss, back.dealt);
          }
          log(`${gear.shield.name}。${enemy.name}に${back.dealt}ダメージ。`, card);
        }
      }
    }

    function restoreHp(amount) {
      const room = Math.max(0, player.maxHp - player.hp);
      const gain = Math.max(0, Math.min(Math.floor(Number(amount) || 0), room));
      if (!gain) return 0;
      player.hp += gain;
      fxHeal = true;
      return gain;
    }

    function runDeck() {
      const cards = [];
      const skip = {};
      for (const card of removed) {
        if (!card || !card.name) continue;
        skip[card.name] = (skip[card.name] || 0) + 1;
      }
      for (const [name, count] of CARD_POOL) {
        let left = count;
        const cut = Math.min(left, skip[name] || 0);
        left -= cut;
        skip[name] = (skip[name] || 0) - cut;
        for (let i = 0; i < left; i++) cards.push(keepCard({ name, ...CARDS[name] }));
      }
      for (const extra of stolen) {
        if (skip[extra.name] > 0) {
          skip[extra.name] -= 1;
          continue;
        }
        cards.push({ ...extra });
      }
      return cards;
    }

    function buildDeck() {
      const specs = runDeck().map((card) => ({ uid: uid++, ...card }));
      deck = shuffle(specs);
      openingDeck = deck.map((card) => ({ ...card }));
      hand = [];
      discard = [];
      inPlay = [];
      resolveAt = 0;
    }

    function draw(n) {
      for (let i = 0; i < n; i++) {
        if (hand.length >= HAND_CAP) break;
        if (!deck.length) {
          if (!discard.length) break;
          deck = shuffle(discard);
          discard = [];
          log(`${heroName()}は捨て札を山札に戻した。`);
        }
        hand.push(deck.pop());
      }
    }

    function pullKind(kind) {
      if (hand.length >= HAND_CAP) return null;
      const take = () => {
        for (let i = deck.length - 1; i >= 0; i--) {
          if (cardKind(deck[i]) === kind) return deck.splice(i, 1)[0];
        }
        return null;
      };
      let card = take();
      if (!card && !deck.length && discard.length) {
        deck = shuffle(discard);
        discard = [];
        log(`${heroName()}は捨て札を山札に戻した。`);
        card = take();
      }
      if (!card) return null;
      hand.push(card);
      return card;
    }

    function pullFromBracelets() {
      const right = gear.braceletR;
      const left = gear.braceletL;
      if (right && right.id === "chain-attack" && !hand.some((card) => cardKind(card) === "attack")) {
        if (hand.length >= HAND_CAP) log(`${heroName()}は${right.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("attack");
          log(card ? `${heroName()}は${right.name}で${card.name}を引いた。` : `${heroName()}は${right.name}。山札に攻撃カードがない。`);
        }
      }
      if (left && left.id === "chain-guard" && !hand.some((card) => cardKind(card) === "block")) {
        if (hand.length >= HAND_CAP) log(`${heroName()}は${left.name}。手札が10枚なので引かない。`);
        else {
          const card = pullKind("block");
          log(card ? `${heroName()}は${left.name}で${card.name}を引いた。` : `${heroName()}は${left.name}。山札に防御カードがない。`);
        }
      }
    }

    function strike(card, amount) {
      const pierce = !!(gear && gear.sword && gear.sword.ignoreDef);
      const defense = pierce ? 0 : enemyDef();
      const cut = amount > 0 ? mitigate(amount, defense) : { reduced: 0, dealt: 0 };
      const result = applyDamage(enemy, cut.dealt);
      if (cut.dealt > 0 && (result.hpLoss || result.blocked)) {
        slashFoe();
        noteHit("enemy", result.hpLoss, cut.dealt);
      }
      log(damageSentence(heroName(), card.name, cut.dealt, result), card);
      // ポイズンソード：アタックカードなら、シールドで防がれても毒
      const poisonHit = gear && gear.sword && Number(gear.sword.poisonHit) || 0;
      if (poisonHit > 0 && amount > 0 && cardKind(card) === "attack" && enemy.hp > 0) {
        addPoison(enemy, poisonHit);
        log(`${gear.sword.name}の毒。${enemy.name}は毒+${enemy.poison}。`, card);
      }
      // フレイムソード／業火の剣：ダメージが通るたび炎上
      const burnHit = gear && gear.sword && Number(gear.sword.burnHit) || 0;
      if (burnHit > 0 && cut.dealt > 0 && enemy.hp > 0) {
        addBurn(enemy, burnHit);
        log(`${gear.sword.name}の炎。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
    }

    function rollCrit(card, base) {
      if (!card.crit) return base;
      return Math.random() < (Number(card.critChance) || 0) ? card.crit : base;
    }

    function resolveCard(card) {
      syncGearStats();
      if (card.power) {
        if (card.coward) {
          player.guardThrough = true;
          log(`${heroName()}は${card.name}。この戦闘中は、パリィ中でもシールドを得る。このカードは、この戦闘のデッキから廃棄。`, card);
        }
        return;
      }
      if (card.rage) {
        player.atkMod = (Number(player.atkMod) || 0) + 1;
        player.defMod = (Number(player.defMod) || 0) - 2;
        syncGearStats();
        log(`${heroName()}は${card.name}。ATK${signed(player.atk)}、DEF${signed(player.def)}。戦闘が終わると戻る。`, card);
        return;
      }
      if (card.poise) {
        gainParry(card);
        return;
      }
      if (card.guardBreak) {
        const had = Math.max(0, Number(enemy.block) || 0);
        enemy.block = 0;
        log(had ? `${heroName()}は${card.name}。${enemy.name}のシールド${had}をすべて割った。` : `${heroName()}は${card.name}。${enemy.name}にシールドは無かった。`, card);
        return;
      }
      if (card.finisher) {
        const stacks = parryCount(player);
        player.parry = 0;
        strike(card, stacks * 15);
        return;
      }
      if (card.focus) {
        player.focus = (player.focus || 0) + card.focus;
        log(`${heroName()}は${card.name}。次の攻撃カードか防御カードの数値を+${player.focus}。`, card);
        return;
      }
      if (card.parry && !card.damage) {
        gainParry(card);
        return;
      }
      if (card.press) {
        strike(card, player.block || 0);
        return;
      }
      if (card.poison) {
        addPoison(enemy, card.poison);
        log(`${heroName()}は${card.name}。${enemy.name}は毒+${enemy.poison}。`, card);
        return;
      }
      if (card.heal) {
        const gain = restoreHp(card.heal);
        log(gain ? `${heroName()}は${card.name}で${gain}回復。` : `${heroName()}は${card.name}。体力は満タン。`, card);
        return;
      }
      if (card.draw) {
        const before = hand.length;
        draw(card.draw);
        log(`${heroName()}は${card.name}で${hand.length - before}枚引いた。`, card);
        return;
      }
      if (card.redTimes) {
        const reds = inPlay.filter((item) => cardKind(item) === "attack").length;
        const added = player.focus ? player.focus : 0;
        if (added) player.focus = 0;
        strike(card, reds * card.redTimes + (player.atk || 0) + added);
        return;
      }
      if (card.counter) {
        const reds = inPlay.filter((item) => cardKind(item) === "attack").length;
        if (reds) {
          log(`${heroName()}は${card.name}。プレイエリアにアタックがあるので、発動しない。`, card);
          return;
        }
        strike(card, card.counter);
        return;
      }
      if (card.hits) {
        const added = player.focus ? player.focus : 0;
        if (added) player.focus = 0;
        const atk = player.atk || 0;
        for (let hit = 0; hit < card.hits; hit++) strike(card, card.damage + atk + (hit === 0 ? added : 0));
        return;
      }
      const added = player.focus && (card.damage || card.block) ? player.focus : 0;
      if (added) player.focus = 0;
      if (card.burnFirst && card.burn) {
        addBurn(enemy, card.burn);
        log(`${heroName()}は${card.name}。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
      if (card.damage) {
        let bonus = 0;
        if (card.fullBonus && player.hp >= player.maxHp) bonus += card.fullBonus;
        if (card.safeBonus && !player.hurtLast) bonus += card.safeBonus;
        if (card.kick && enemy.block > 0) bonus += card.kick;
        const atk = player.atk || 0;
        strike(card, rollCrit(card, card.damage) + added + atk + bonus);
      }
      if (card.burn && !card.burnFirst) {
        addBurn(enemy, card.burn);
        log(`${heroName()}は${card.name}。${enemy.name}は炎上+${enemy.burn}。`, card);
      }
      if (card.expose) {
        player.expose = (Number(player.expose) || 0) + card.expose;
        log(`${heroName()}は次に受けるダメージ+${player.expose}。`, card);
      }
      if (card.parry && card.damage) gainParry(card);
      if (card.block) gainBlock(card.block + added, card);
      if (card.nextDraw) {
        player.extraDraw = (Number(player.extraDraw) || 0) + card.nextDraw;
        log(`${heroName()}は次のターンに${card.nextDraw}枚多く引く。`, card);
      }
      if (!card.damage && !card.block && !card.expose && !card.nextDraw && !card.burn) log(`${heroName()}は${card.name}。${card.text}`, card);
    }

    function cardPlayable(card) {
      if (!card) return false;
      if ((Number(card.cost) || 0) > player.energy) return false;
      if (card.headbutt && !inPlay.length) return false;
      if (card.halfOnly && !hpHalf(player)) return false;
      if (card.fullOnly && player.hp < player.maxHp) return false;
      return true;
    }

    function playCard(index) {
      if (phase !== "player" || outcome) return false;
      const card = hand[index];
      if (!card) return false;
      if (player.energy < card.cost) {
        note = "なにをやっている！　マナが足りないぞ!!";
        fxNoMana = true;
        render();
        return false;
      }
      if (card.headbutt && !inPlay.length) {
        note = "プレイエリアの自分のカードを廃棄すると使える";
        render();
        return false;
      }
      if (card.fullOnly && player.hp < player.maxHp) {
        note = "体力が満タンのときだけ使える";
        render();
        return false;
      }
      spendEnergy(card.cost);
      hand.splice(index, 1);
      if (card.quick) {
        resolveCard(card);
        discard.push(card);
        note = "";
        pullFromBracelets();
        if (finishIfStuck()) return true;
        render();
        return true;
      }
      if (card.headbutt) {
        const names = inPlay.map((item) => item.name).join("、");
        capturePlayClearFlights(null, "exile");
        while (inPlay.length) battleExile.push(inPlay.shift());
        log(`${heroName()}は${names}を廃棄した。`);
      }
      inPlay.push(card);
      note = "";
      pullFromBracelets();
      if (finishIfStuck()) return true;
      render();
      return true;
    }

    function noPlayableHand() {
      return !hand.some((card) => cardPlayable(card));
    }

    function finishIfStuck() {
      if (phase !== "player" || outcome || !noPlayableHand()) return false;
      if (!hand.length || autoEndTurn) {
        endTurn();
        return true;
      }
      return false;
    }

    function handCardBox(index) {
      const cardEl = document.querySelector(`.hand [data-card="${index}"]`);
      if (!cardEl) return null;
      const rect = cardEl.getBoundingClientRect();
      return {
        cx: rect.left + rect.width / 2,
        cy: rect.top + rect.height / 2,
        w: cardEl.offsetWidth,
        h: cardEl.offsetHeight,
        fan: parseFloat(cardEl.style.getPropertyValue("--fan")) || 0,
      };
    }

    function flyCardToPlay(from) {
      if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(".play-side.mine .play-card:last-child .card");
      if (!target) return;
      const to = target.getBoundingClientRect();
      if (!to.width || !to.height || !from.w || !from.h) return;
      const ghost = target.cloneNode(true);
      const kind = target.classList.contains("attack") ? "attack" : target.classList.contains("block") ? "block" : target.classList.contains("power") ? "power" : "skill";
      ghost.className = `card fly-card ${kind}`;
      ghost.style.left = `${from.cx - from.w / 2}px`;
      ghost.style.top = `${from.cy - from.h / 2}px`;
      ghost.style.width = `${from.w}px`;
      ghost.style.height = `${from.h}px`;
      ghost.style.transition = "none";
      ghost.style.transform = `rotate(${from.fan}deg)`;
      document.body.appendChild(ghost);
      target.style.visibility = "hidden";
      const dx = to.left + to.width / 2 - from.cx;
      const dy = to.top + to.height / 2 - from.cy;
      const scale = to.height / from.h;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
        if (target.isConnected) target.style.visibility = "";
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 560);
    }

    function playFromHand(index) {
      const card = hand[index];
      const from = handCardBox(index);
      if (!playCard(index)) return;
      if (!card || !card.quick) flyCardToPlay(from);
    }

    function goesToDiscard(card) {
      if (!card) return false;
      if (card.power || card.instant || card.kind === "power") return false;
      return true;
    }

    let pendingPlayClearFly = [];

    function makeFlyGhost(el) {
      const rect = el.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      const ghost = el.cloneNode(true);
      ghost.classList.add("fly-card");
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${rect.top}px`;
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.height}px`;
      ghost.style.margin = "0";
      ghost.style.transition = "none";
      ghost.style.transform = "none";
      ghost.style.opacity = "1";
      document.body.appendChild(ghost);
      return { ghost, from: rect };
    }

    // プレイエリアの自分のカード：捨て札へ／廃棄へ飛ばす準備（次の描画のあとで動かす）
    // forceMode があれば全枚その行き先（頭突きの一括廃棄など）
    function capturePlayClearFlights(cards, forceMode) {
      pendingPlayClearFly.forEach((item) => item.ghost.remove());
      pendingPlayClearFly = [];
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const list = cards || inPlay;
      const nodes = [...document.querySelectorAll(".play-side.mine .play-card .card")];
      nodes.forEach((el, i) => {
        const card = list[i];
        if (!card) return;
        const made = makeFlyGhost(el);
        if (!made) return;
        const mode = forceMode || (goesToDiscard(card) ? "discard" : "exile");
        pendingPlayClearFly.push({ ...made, mode });
      });
    }

    function launchPendingPlayClearFly() {
      const flights = pendingPlayClearFly;
      pendingPlayClearFly = [];
      if (!flights.length) return 0;
      const discards = flights.filter((item) => item.mode === "discard");
      const exiles = flights.filter((item) => item.mode === "exile");
      const dest = document.querySelector('[data-pile="discard"] .pile-card');
      const countEl = dest && dest.querySelector(".pile-count");
      const finalCount = discard.length;
      const startCount = Math.max(0, finalCount - discards.length);
      if (countEl) countEl.textContent = String(startCount);
      let landed = 0;
      let maxWait = 0;

      discards.forEach((item, i) => {
        if (!dest) {
          item.ghost.remove();
          return;
        }
        const to = dest.getBoundingClientRect();
        const from = item.from;
        const ghost = item.ghost;
        const dx = to.left + to.width / 2 - (from.left + from.width / 2);
        const dy = to.top + to.height / 2 - (from.top + from.height / 2);
        const scale = Math.max(0.22, to.height / from.height);
        const delay = i * 70;
        maxWait = Math.max(maxWait, 560 + delay);
        const finish = () => {
          if (ghost.dataset.landed) return;
          ghost.dataset.landed = "1";
          ghost.remove();
          landed += 1;
          if (countEl && countEl.isConnected) countEl.textContent = String(startCount + landed);
        };
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.transition = `transform 0.48s cubic-bezier(0.22, 0.7, 0.18, 1) ${delay}ms, opacity 0.42s ease ${delay + 80}ms`;
            ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(-18deg) scale(${scale})`;
            ghost.style.opacity = "0.15";
          });
        });
        ghost.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 560 + delay);
      });

      exiles.forEach((item, i) => {
        const ghost = item.ghost;
        const delay = i * 80;
        maxWait = Math.max(maxWait, 620 + delay);
        const finish = () => {
          if (ghost.dataset.landed) return;
          ghost.dataset.landed = "1";
          ghost.remove();
        };
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ghost.style.transition = `transform 0.55s cubic-bezier(0.2, 0.75, 0.2, 1) ${delay}ms, opacity 0.5s ease ${delay + 40}ms, filter 0.5s ease ${delay}ms`;
            ghost.style.transform = "translateY(-120px) rotate(22deg) scale(0.35)";
            ghost.style.opacity = "0";
            ghost.style.filter = "brightness(1.4) saturate(0.2)";
          });
        });
        ghost.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 640 + delay);
      });

      return maxWait;
    }

    function scrapPlay() {
      capturePlayClearFlights();
      while (inPlay.length) {
        const card = inPlay.shift();
        if (card.power || card.instant) battleExile.push(card);
        else discard.push(card);
      }
      resolveAt = 0;
    }

    function flyPlayToHand(from, handIndex) {
      if (!from || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(`.hand [data-card="${handIndex}"]`);
      if (!target) return;
      const to = target.getBoundingClientRect();
      if (!to.width || !to.height || !from.width || !from.height) return;
      const ghost = target.cloneNode(true);
      const kind = target.classList.contains("attack") ? "attack" : target.classList.contains("block") ? "block" : target.classList.contains("power") ? "power" : "skill";
      ghost.className = `card fly-card ${kind}`;
      ghost.style.left = `${from.left}px`;
      ghost.style.top = `${from.top}px`;
      ghost.style.width = `${from.width}px`;
      ghost.style.height = `${from.height}px`;
      ghost.style.transition = "none";
      ghost.style.transform = "none";
      document.body.appendChild(ghost);
      target.style.visibility = "hidden";
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      const scale = to.height / from.height;
      const fan = parseFloat(target.style.getPropertyValue("--fan")) || 0;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        ghost.remove();
        if (target.isConnected) target.style.visibility = "";
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.transition = "transform 0.42s cubic-bezier(0.22, 0.7, 0.2, 1)";
          ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(${fan}deg) scale(${scale})`;
        });
      });
      ghost.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 520);
    }

    function unplayFromPlay(index) {
      if (phase !== "player" || outcome) return false;
      const card = inPlay[index];
      if (!card) return false;
      const el = document.querySelector(`.play-side.mine .play-card[data-unplay="${index}"] .card`)
        || document.querySelectorAll(".play-side.mine .play-card .card")[index];
      const from = el ? el.getBoundingClientRect() : null;
      inPlay.splice(index, 1);
      refundEnergy(card.cost);
      hand.push(card);
      sortHand();
      note = "";
      const handIndex = hand.indexOf(card);
      render();
      if (from) flyPlayToHand(from, handIndex);
      return true;
    }

    function enemyUseCard(card) {
      if (card.halfOnly && !hpHalf(enemy)) {
        log(`${enemy.name}は${card.name}。体力が半分より上なので、使えない。`, card, true);
        return;
      }
      if (card.press) {
        const amount = enemy.block || 0;
        if (amount > 0) takeEnemyHit(amount, card);
        else log(`${enemy.name}は${card.name}で0ダメージ。`, card, true);
        return;
      }
      if (card.burnFirst && card.burn) {
        if (addBurn(player, card.burn)) log(`${enemy.name}は${card.name}。${heroName()}は炎上+${player.burn}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      }
      if (card.damage) {
        const kick = card.kick && player.block > 0 ? card.kick : 0;
        takeEnemyHit(rollCrit(card, card.damage) + kick, card);
      } else if (card.block) {
        enemy.block += card.block;
        log(`${enemy.name}は${card.name}でブロック${card.block}。`, card, true);
      } else if (card.poison) {
        if (addPoison(player, card.poison)) log(`${enemy.name}は${card.name}。${heroName()}は毒+${player.poison}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      }
      if (card.burn && !card.burnFirst) {
        if (addBurn(player, card.burn)) log(`${enemy.name}は${card.name}。${heroName()}は炎上+${player.burn}。`, card, true);
        else log(`${enemy.name}は${card.name}。`, card, true);
      } else if (!card.damage && !card.block && !card.poison && !card.burnFirst) {
        log(`${enemy.name}は${card.name}。${card.text}`, card, true);
      }
    }

    function finishResolve() {
      timer = null;
      scrapPlay();
      banner = "";
      if (tickPoison("enemy")) {
        scheduleFinish("win");
        return;
      }
      const wait = pendingPlayClearFly.length
        ? 560 + (pendingPlayClearFly.length - 1) * 70
        : 0;
      render();
      if (wait) timer = setTimeout(startPlayerTurn, wait);
      else startPlayerTurn();
    }

    function stepResolve() {
      timer = null;
      const enemyIndex = inPlay.length;
      if (phase !== "resolve" || resolveAt > enemyIndex) {
        finishResolve();
        return;
      }
      const index = resolveAt;
      resolveAt += 1;
      if (index < enemyIndex) {
        resolveCard(inPlay[index]);
        if (enemy.hp <= 0) {
          scrapPlay();
          scheduleFinish("win");
          return;
        }
      } else {
        logTurn("enemy");
        const card = intentAt(0);
        // シールドはターンの終わりに消えない（敵も同じ。削られるまで残る）
        enemyUseCard(card);
        advanceEnemyLoop();
        if (player.hp > 0 && enemyNow().trait && !enemy.rallied && hpHalf(enemy)) {
          enemy.rallied = true;
          const extra = shuffle(sourcePattern()).slice(0, 2);
          log(`${enemy.name}の特性。デッキから2枚引いて、続けて使う。`, null, true);
          for (const more of extra) {
            if (player.hp <= 0) break;
            enemyUseCard(more);
          }
        }
        if (player.hp <= 0) {
          const saved = cheatDeath();
          if (saved === "retry") return;
          if (!saved) {
            scrapPlay();
            scheduleFinish("lose");
            return;
          }
        }
      }
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const slashCount = fxSlashes.length;
      render();
      const wait = Math.max(720 + Math.max(0, slashCount - 1) * 340, drainMs(), playerNumber ? 1850 : 0, guardKind ? 1300 : 0);
      timer = setTimeout(resolveAt > enemyIndex ? finishResolve : stepResolve, wait);
    }

    function endTurn() {
      if (phase !== "player" || outcome) return;
      if (hasReuseBracelet()) {
        const left = Math.max(0, Number(player.energy) || 0);
        player.pendingCarry = left;
        if (left > 0) log(`${heroName()}は再利用の腕輪。マナ${left}を次のターンへ持ち越す。`);
      } else {
        player.pendingCarry = 0;
      }
      phase = "resolve";
      resolveAt = 0;
      while (hand.length) discard.push(hand.pop());
      note = "";
      const poisoned = tickPoison("player");
      turnCall = "enemy";
      if (poisoned) {
        const saved = cheatDeath();
        if (saved === "retry") return;
        if (!saved) {
          scheduleFinish("lose");
          return;
        }
      }
      render();
      timer = setTimeout(stepResolve, 1100);
    }

    function startPlayerTurn() {
      if (player.hp <= 0) {
        const saved = cheatDeath();
        if (saved === "retry") return;
        if (!saved) {
          fxFatal = true;
          fatalHold = true;
          scheduleFinish("lose");
          return;
        }
      }
      turn += 1;
      logTurn("player");
      player.hurtLast = !!player.hurtThis;
      player.hurtThis = false;
      // シールドはターンの終わりに消えない。削られるまで残る
      syncGearStats();
      const halfMana = hpHalf(player) && (gear.braceletL && gear.braceletL.halfMana || gear.braceletR && gear.braceletR.halfMana) ? 1 : 0;
      const carried = Math.max(0, Number(player.pendingCarry) || 0);
      player.pendingCarry = 0;
      player.baseMax = MANA + halfMana;
      player.baseEnergy = player.baseMax;
      player.tempEnergy = carried;
      syncEnergyTotal();
      if (halfMana) log(`${heroName()}はミノタウロスの腕輪。体力が半分以下なので、このターンのマナ+1。`);
      if (carried > 0) log(`${heroName()}は持ち越したマナ${carried}（オレンジ）。`);
      const extra = Math.max(0, Number(player.extraDraw) || 0);
      player.extraDraw = 0;
      draw(5 + extra);
      pullFromBracelets();
      fxDeal = true;
      slashSeq = 0;
      turnCall = "player";
      phase = "player";
      if (finishIfStuck()) return;
      render();
    }

    function finish(kind) {
      clearTimer();
      clearBattleMods();
      outcome = kind;
      phase = "end";
      banner = "";
      fatalHold = false;
      fxFatal = false;
      log(kind === "win" ? `${heroName()}は${enemy.name}を倒した。` : `${heroName()}は倒された。`);
      if (kind === "lose") {
        defeatSnap = captureDefeat();
        endRun(false);
        screen = "defeat";
        render();
        return;
      }
      if (kind === "win") {
        prepareReward();
        persistSave(true);
      }
      render();
    }

    function scheduleFinish(kind) {
      phase = "end";
      const guardKind = fxGuard;
      const playerNumber = fxHurt && fxHit && fxHit.side === "player" && fxHit.n > 0;
      const fatal = kind === "lose" && (fxFatal || fatalHold);
      if (fatal) {
        fxFatal = true;
        fatalHold = true;
      }
      const fatalWait = fatal ? 3600 : 0;
      const wait = Math.max(720, drainMs(), playerNumber ? (fatal ? 3200 : 1850) : 0, guardKind ? 1300 : 0, fatalWait);
      clearTimer();
      render();
      timer = setTimeout(() => finish(kind), wait);
    }

    function captureDefeat() {
      const blow = lastFoeBlow;
      const foeName = enemy && enemy.name ? enemy.name : "敵";
      const hit = blow && blow.hpLoss ? `${blow.hpLoss}ダメージ` : "";
      const why = blow && blow.name === "毒"
        ? `毒で体力が尽きた。`
        : blow && blow.name
          ? `${foeName}の${blow.name}${hit ? `で${hit}` : ""}。体力が尽きた。`
          : `${foeName}に倒された。`;
      return {
        hero: heroName(),
        defeatArt: heroItem().defeat,
        victoryArt: heroItem().victory,
        foeName,
        foeImage: enemy && enemy.image ? enemy.image : "",
        foeHp: enemy ? `${enemy.hp}/${enemy.maxHp}` : "",
        why,
        log: (logLines || []).map((line) => (typeof line === "string" ? { text: line } : { ...line })),
        deck: (openingDeck || []).map((card) => ({ ...card })),
        dungeon: dungeonName,
        floor: floorLabel(),
        stars: meta.stars,
      };
    }

    function logLinesHtml(lines) {
      let logTurnShown = 0;
      return (lines || []).map((line, index) => {
        const text = typeof line === "string" ? line : line.text;
        const kind = line && line.kind;
        const cls = kind === "player" ? "turn-player" : kind === "enemy" ? "turn-enemy" : "";
        const hover = line && line.card ? ` data-log="${index}"` : "";
        const foe = line && line.foe ? ` data-foe="1"` : "";
        let head = "";
        if (kind && line.turn && line.turn !== logTurnShown) {
          logTurnShown = line.turn;
          head = `<p class="turn-head"><span>${line.turn}ターン目</span></p>`;
        }
        const body = kind ? esc(text) : colorNames(text);
        return `${head}<p class="${cls}"${hover}${foe}>${body}</p>`;
      }).join("");
    }

    function loadMeta() {
      try {
        const saved = JSON.parse(localStorage.getItem(META_KEY) || "{}");
        const cleared = (saved.cleared && typeof saved.cleared === "object") ? { ...saved.cleared } : {};
        // 旧セーブ：クリア回数だけある場合は 20 クリア済みとみなす
        if (!saved.cleared && (Number(saved.clears) || 0) > 0) cleared["20"] = true;
        meta = {
          uses: Number(saved.uses) || 0,
          clears: Number(saved.clears) || 0,
          stars: Number(saved.stars) || 0,
          cleared,
        };
      } catch (error) {
        meta = { uses: 0, clears: 0, stars: 0, cleared: {} };
      }
    }

    function endRun(clearedRun) {
      const item = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonName);
      const floorsKey = item ? item.floors : 20;
      gear = emptyGear();
      gearOpen = null;
      stolen = [];
      localStorage.removeItem(SAVE_KEY);
      clearLive();
      meta.uses += 1;
      if (clearedRun) {
        meta.clears += 1;
        markDungeonCleared(floorsKey);
      }
      localStorage.setItem(META_KEY, JSON.stringify(meta));
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (typeof saved.showLog === "boolean") showLog = saved.showLog;
        if (typeof saved.autoEndTurn === "boolean") autoEndTurn = saved.autoEndTurn;
      } catch (error) {
        showLog = true;
        autoEndTurn = true;
      }
    }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ showLog, autoEndTurn }));
    }

    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function battleSnapshot() {
      return {
        v: 1,
        cleared,
        battleIndex,
        turn,
        intentIndex,
        enemyLoop,
        phase,
        note,
        banner,
        outcome,
        logLines,
        deck,
        hand,
        discard,
        inPlay,
        openingDeck,
        resolveAt,
        player,
        enemy,
        gear,
        stolen,
        removed,
        beggarGift,
        battleTotal,
        route,
        battleStartHp,
        floorZero: true, // 祝福を0層目として数える新しい道（古いセーブの見分け用）
        dungeonName,
        heroCast,
        job,
        jobsHad,
        ultimate,
        rewardReady,
        rewardStars,
        rewardPicks,
        rewardPaths,
        rewardStep,
        pathEventTitle,
        bonusCard,
        floorGift,
        bossPicks,
        shopStock,
        gearOffer,
      };
    }

    function persistSave(silent) {
      localStorage.setItem(SAVE_KEY, JSON.stringify(battleSnapshot()));
      if (!silent) {
        saveNote = "セーブした";
        render();
      }
    }

    function readLive() {
      try {
        return JSON.parse(localStorage.getItem(LIVE_KEY) || "null");
      } catch (error) {
        return null;
      }
    }

    function persistLive() {
      if (!player || !enemy) return;
      localStorage.setItem(LIVE_KEY, JSON.stringify(battleSnapshot()));
    }

    function clearLive() {
      localStorage.removeItem(LIVE_KEY);
    }

    function applySave(data) {
      cleared = !!data.cleared;
      battleIndex = data.battleIndex || 0;
      battleStartHp = Number(data.battleStartHp) || (data.player && Number(data.player.hp)) || 30;
      turn = data.turn || 0;
      intentIndex = data.intentIndex || 0;
      phase = data.phase || "player";
      note = data.note || "";
      banner = data.banner || "";
      outcome = data.outcome || null;
      logLines = data.logLines || [];
      deck = data.deck || [];
      hand = data.hand || [];
      discard = data.discard || [];
      inPlay = Array.isArray(data.inPlay) ? data.inPlay : [];
      openingDeck = (Array.isArray(data.openingDeck) && data.openingDeck.length
        ? data.openingDeck
        : deck.concat(hand, inPlay, discard)
      ).map((card) => ({ ...card }));
      resolveAt = data.resolveAt || 0;
      player = data.player;
      enemy = data.enemy;
      if (enemy) enemy.image = enemyByName(enemy.name).image;
      if (player) {
        player.hit = false;
        player.atk = player.atk || 0;
        player.def = player.def || 0;
        player.maxHp = 30;
        if (player.hp > player.maxHp) player.hp = player.maxHp;
        player.maxEnergy = Math.min(MANA + 1, Math.max(MANA, Number(player.maxEnergy) || MANA));
        if (player.energy > player.maxEnergy) player.energy = player.maxEnergy;
        if (player.baseMax == null) player.baseMax = Math.max(0, Number(player.maxEnergy) || MANA);
        if (player.tempEnergy == null) player.tempEnergy = 0;
        if (player.baseEnergy == null) player.baseEnergy = Math.max(0, (Number(player.energy) || 0) - (Number(player.tempEnergy) || 0));
        if (player.pendingCarry == null) player.pendingCarry = 0;
        syncEnergyTotal();
        player.burn = burnStacks(player);
        player.focus = player.focus || 0;
        player.parry = player.parry === true ? 1 : Math.max(0, Number(player.parry) || 0);
        player.atkMod = Number(player.atkMod) || 0;
        player.defMod = Number(player.defMod) || 0;
        player.expose = Number(player.expose) || 0;
        player.guardThrough = !!player.guardThrough;
        player.extraDraw = Math.max(0, Number(player.extraDraw) || 0);
        player.poison = poisonStacks(player);
      }
      if (enemy) {
        enemy.hit = false;
        enemy.poison = poisonStacks(enemy);
        enemy.burn = burnStacks(enemy);
        enemy.def = Number(enemy.def) || 0;
        enemy.rallied = !!enemy.rallied;
        enemy.name = enemyKey(enemy.name);
        const foe = enemyByName(enemy.name);
        enemy.atk = hiddenAtk(foe);
        if (enemy.maxHp !== foe.hp) {
          enemy.maxHp = foe.hp;
          if (enemy.hp > foe.hp) enemy.hp = foe.hp;
        }
      }
      gear = normalizeGear(data.gear);
      if (!gear.sword && !gear.shield) gear = starterGear();
      syncGearStats();
      gearOpen = null;
      stolen = Array.isArray(data.stolen) ? data.stolen : [];
      removed = Array.isArray(data.removed) ? data.removed.filter((card) => card && card.name) : [];
      beggarGift = Array.isArray(data.beggarGift) ? data.beggarGift.filter((card) => card && card.name) : [];
      if (Array.isArray(data.route) && data.route.length) {
        route = data.route.map((name) => enemyKey(name));
      } else {
        route = CLASSIC_ROUTE.slice();
        const total = data.battleTotal || route.length;
        while (route.length < total) {
          const bossAt = route.indexOf(DUNGEON.boss);
          const tier = DUNGEON.road[DUNGEON.road.length - 1];
          if (bossAt >= 0) route.splice(bossAt, 0, rollRank(tier));
          else route.push(rollRank(tier));
        }
      }
      // 古いセーブ（祝福が1層目だった道）は、1層目に雑魚を1つ足して新しい数え方に合わせる
      if (!data.floorZero && route[0] === "出来事:祝福" && route.length > 1) {
        route.splice(battleIndex === 0 ? 1 : battleIndex + 1, 0, rollRank(1));
      }
      battleTotal = route.length;
      if (enemy && route[battleIndex] && !isEventNode(route[battleIndex])) {
        const foe = enemyNow();
        enemy.name = foeLabel();
        enemy.image = foe.image;
        enemy.atk = hiddenAtk(foe);
      }
      restoreEnemyLoop(data);
      if (data.dungeonName) {
        const legacy = { "20": "骸洞窟", "はじまりの洞窟": "骸洞窟", "50": "竜の遺骸城", "100": "深淵なる寝所" };
        dungeonName = legacy[data.dungeonName] || data.dungeonName;
      }
      heroCast = castByName(data.heroCast || "戦士").name;
      job = data.job || "戦士";
      jobsHad = Array.isArray(data.jobsHad) && data.jobsHad.length ? data.jobsHad : ["戦士"];
      ultimate = data.ultimate || "";
      rewardReady = !!data.rewardReady;
      rewardStars = data.rewardStars || 0;
      rewardPicks = Array.isArray(data.rewardPicks) ? data.rewardPicks : [];
      rewardPaths = Array.isArray(data.rewardPaths) ? data.rewardPaths : [];
      // 古い保存（走り抜けが混ざる・右端が未知との遭遇でない）は引き直す
      if (rewardPaths.includes("skip") || (rewardPaths.length && rewardPaths[rewardPaths.length - 1] !== "unknown")) rewardPaths = rollPaths();
      rewardStep = data.rewardStep || "cards";
      pathEventTitle = data.pathEventTitle || "探索";
      bonusCard = data.bonusCard || null;
      floorGift = data.floorGift && data.floorGift.kind ? data.floorGift : null;
      bossPicks = Array.isArray(data.bossPicks) ? data.bossPicks : [];
      shopStock = Array.isArray(data.shopStock) ? data.shopStock : [];
      gearOffer = data.gearOffer && data.gearOffer.item ? data.gearOffer : null;
      if (outcome === "win" && !rewardReady) prepareReward();
      saveNote = "";
      bindShown();
    }

    function startBattle(keepHp) {
      clearTimer();
      clearReward();
      lastFoeBlow = null;
      fxFatal = false;
      fatalHold = false;
      screen = "battle";
      cleared = false;
      const hp = keepHp == null ? 30 : Math.min(30, keepHp);
      battleStartHp = hp;
      player = { hp, maxHp: 30, block: 0, energy: 0, maxEnergy: 0, baseMax: 0, baseEnergy: 0, tempEnergy: 0, pendingCarry: 0, atk: 0, def: 0, focus: 0, parry: 0, poison: 0, burn: 0, hit: false, atkMod: 0, defMod: 0, expose: 0, guardThrough: false, hurtThis: false, hurtLast: false, extraDraw: 0 };
      battleExile = [];
      syncGearStats();
      const foe = enemyNow();
      enemy = { name: foeLabel(), image: foe.image, hp: foe.hp, maxHp: foe.hp, block: 0, poison: 0, burn: 0, def: 0, atk: hiddenAtk(foe), rallied: false, hit: false };
      bindShown();
      turn = 0;
      startEnemyLoop(true);
      phase = "intro";
      encounter = true;
      note = "";
      banner = "";
      outcome = null;
      askLeave = false;
      logLines = [];
      saveNote = "";
      buildDeck();
      render();
      timer = setTimeout(beginEncounter, 1700);
    }

    function beginEncounter() {
      timer = null;
      if (phase !== "intro" || outcome) return;
      encounter = false;
      startPlayerTurn();
    }

    const ITEM_IMAGE = "gear-item.jpg?v=1";
    // 使い捨てアイテム。クイックは戦闘中の自分のターンに押して使う（マナはいらない）。
    // 天使の輪・天使のペンダントは持っているだけでよく、死んだときひとりでに使われる。
    // stars が 0 のものはレアリティ未定（お店に並べるときの値段が決まっていない）。
    const ITEMS = [
      { id: "herb", name: "薬草", effect: "HP10回復。クイック", heal: 10, quick: true, stars: 1, image: "item-herb.jpg?v=1" },
      { id: "angel-halo", name: "天使の輪", effect: "一度だけ、死んでも復活する", revive: true, stars: 3, image: "item-angel-halo.jpg?v=1" },
      { id: "angel-pendant", name: "天使のペンダント", effect: "一度死んだとき、はじめから戦闘をやり直す", retry: true, stars: 3, image: "item-angel-pendant.jpg?v=1" },
      { id: "spike-ball", name: "棘ボール", effect: "相手に10ダメージ。クイック", damage: 10, quick: true, stars: 0, image: "item-spike-ball.jpg?v=1" },
    ];
    function itemDef(id) {
      return ITEMS.find((item) => item.id === id) || null;
    }
    function blessItem() {
      return { ...ITEMS[Math.floor(Math.random() * ITEMS.length)] };
    }
    function itemSlotWith(flag) {
      return ["itemL", "itemR"].find((key) => gear && gear[key] && gear[key][flag]) || "";
    }

    function giveItem(gift) {
      if (!gear.itemL) gear.itemL = { ...gift };
      else if (!gear.itemR) gear.itemR = { ...gift };
      else gear.itemL = { ...gift };
    }

    // クイックのアイテムを使う（自分のターンだけ。マナはいらない。使ったら消える）
    function useItem(slot) {
      if (screen !== "battle" || phase !== "player" || outcome) return;
      const item = gear && gear[slot];
      if (!item || !item.quick) return;
      if (item.heal) {
        const gain = restoreHp(item.heal);
        log(`${heroName()}は${item.name}を使った。HPが${gain}回復。`);
      } else if (item.damage) {
        const result = applyDamage(enemy, item.damage);
        if (result.hpLoss || result.blocked) {
          slashFoe();
          noteHit("enemy", result.hpLoss, item.damage);
        }
        log(`${heroName()}は${item.name}を投げた。${enemy.name}に${result.hpLoss}ダメージ。`);
      }
      gear[slot] = null;
      gearOpen = null;
      if (enemy.hp <= 0) {
        scrapPlay();
        scheduleFinish("win");
        return;
      }
      render();
    }

    // 死んだとき、天使の輪（復活）→天使のペンダント（戦闘をやり直す）の順に、ひとりでに使われる。
    // 戻り値：使ったものが無ければ ""。"revive" はその場で続行、"retry" は startBattle をやり直し済み。
    function cheatDeath() {
      if (!player || player.hp > 0) return "";
      const halo = itemSlotWith("revive");
      if (halo) {
        const item = gear[halo];
        gear[halo] = null;
        player.hp = player.maxHp;
        fxHeal = true;
        fxFatal = false;
        fatalHold = false;
        log(`${heroName()}は倒れた。${item.name}が光り、復活した。`);
        return "revive";
      }
      const pendant = itemSlotWith("retry");
      if (pendant) {
        const item = gear[pendant];
        gear[pendant] = null;
        clearTimer();
        clearBattleMods();
        startBattle(battleStartHp);
        log(`${item.name}が砕けた。時が戻り、戦闘をはじめからやり直す。`);
        render();
        return "retry";
      }
      return "";
    }

    function rollBlessPicks() {
      const item = GEAR_ITEMS[Math.floor(Math.random() * GEAR_ITEMS.length)];
      const names = Object.keys(CARDS);
      const name = names[Math.floor(Math.random() * names.length)];
      return [
        { kind: "item", item: blessItem(), label: "あなたにアイテムを" },
        { kind: "gear", gear: { ...item }, label: "あなたに装備を" },
        { kind: "card", card: keepCard({ name, ...CARDS[name] }), label: "あなたに技を" },
      ];
    }

    function takeGift(pick) {
      if (!pick) return "";
      if (pick.kind === "item") {
        giveItem(pick.item);
        floorGift = { kind: "item", item: { ...pick.item } };
        return "アイテムを1つ受け取った。";
      }
      if (pick.kind === "gear") {
        if (!gear || !gear.sword) gear = starterGear();
        if (offerWeapon(pick.gear, { source: "gift" })) return "";
        giveGear(pick.gear);
        floorGift = { kind: "gear", gear: { ...pick.gear } };
        return `${pick.gear.name}を受け取った。`;
      }
      stolen.push(keepCard(pick.card));
      floorGift = { kind: "card", card: keepCard(pick.card) };
      return `${pick.card.name}を1枚受け取った。`;
    }

    function takeBless(index) {
      if (floorKind !== "挑戦者に祝福を" || floorPhase !== "bless") return;
      const pick = blessPicks[index];
      if (!pick) return;
      floorNote = takeGift(pick);
      blessPicks = [];
      floorPhase = "show";
      render();
    }

    function grantExplore() {
      const kind = ["カード", "装備", "アイテム"][Math.floor(Math.random() * 3)];
      if (kind === "カード") {
        const offers = Object.keys(COMMON).map((name) => ({ name, ...COMMON[name] })).concat(classCards());
        const pick = offers[Math.floor(Math.random() * offers.length)];
        return takeGift({ kind: "card", card: keepCard({ ...pick, stars: pick.stars || 1 }) });
      }
      if (kind === "装備") {
        const item = GEAR_ITEMS[Math.floor(Math.random() * GEAR_ITEMS.length)];
        return takeGift({ kind: "gear", gear: { ...item } });
      }
      return takeGift({ kind: "item", item: blessItem() });
    }

    function giftMarkup(gift, big) {
      if (!gift) return "";
      const cls = big ? "gift-show" : "gift-pick";
      if (gift.kind === "card" && gift.card) {
        return `<div class="${cls}"><div class="card preview ${cardKind(gift.card)}">${cardFace(gift.card)}</div><b>${esc(gift.card.name)}</b></div>`;
      }
      const item = gift.kind === "gear" ? gift.gear : gift.item;
      if (!item) return "";
      const picture = item.image ? `<img class="gift-img" src="${esc(item.image)}" alt="">` : "";
      return `<div class="${cls}">${picture}<b>${esc(item.name)}</b><small>${esc(item.effect || "")}</small></div>`;
    }

    function jobCandidates() {
      const list = [];
      if (jobsHad.includes("戦士") && jobsHad.includes("魔法使い")) list.push("パラディン");
      if (job !== "魔法使い") list.push("魔法使い");
      if (job !== "戦士") list.push("戦士");
      return list;
    }

    function rollUltimates(nextJob) {
      const pairs = [];
      for (let w = 0; w <= 4; w++) pairs.push(`${w}:${4 - w}`);
      const picks = shuffle(pairs).slice(0, nextJob === "戦士" ? 1 : 2);
      if (nextJob === "戦士") picks.unshift("parry-stack");
      return picks;
    }

    function ultimateLabel(pair) {
      if (pair === "parry-stack") return "パリィが重複する";
      const [w, m] = String(pair).split(":");
      return `戦士${w}と魔法使い${m}`;
    }

    function openFloor(keepHp) {
      floorHp = keepHp == null ? 30 : Math.min(30, keepHp);
      const kind = String(route[battleIndex] || "").slice("出来事:".length);
      floorKind = kind;
      floorNote = "";
      floorPhase = "show";
      floorGift = null;
      blessPicks = [];
      beggarCut = false;
      ultimatePicks = [];
      if (kind === "祝福") {
        floorKind = "挑戦者に祝福を";
        floorPhase = "bless";
        blessPicks = rollBlessPicks();
        floorNote = "女神が三つを差し出した。ひとつだけ受け取れる。";
      } else if (kind === "キャンプ") {
        floorHp = 30;
        if (player) player.hp = 30;
        floorNote = "体力が全快した。";
      } else if (kind === "お店") {
        shopStock = rollShopStock();
        floorNote = "怪しげな商人が笑っている。";
      } else if (kind === "探索") {
        if (Math.random() < 0.5) {
          route[battleIndex] = rollRank(battleIndex < route.length / 2 ? 1 : 2);
          startBattle(floorHp);
          return;
        }
        floorNote = grantExplore();
      } else if (kind === "未知") {
        const roll = ["キャンプ", "お店", "探索", "戦闘"][Math.floor(Math.random() * 4)];
        if (roll === "戦闘") {
          route[battleIndex] = rollRank(battleIndex < route.length / 2 ? 1 : 2);
          startBattle(floorHp);
          return;
        }
        if (roll === "キャンプ") {
          floorHp = 30;
          if (player) player.hp = 30;
          floorNote = "未知は、キャンプだった。体力が全快した。";
        } else if (roll === "探索") {
          floorNote = `未知は、探索だった。${grantExplore()}`;
        } else {
          floorKind = "お店";
          shopStock = rollShopStock();
          floorNote = "未知は、お店だった。怪しげな商人が笑っている。";
        }
      } else if (kind === "物乞い") {
        floorKind = "物乞いに遭遇";
        beggarGift = [];
        floorNote = "デッキから1枚だけ外せる。外さずに進んでもよい。進むと、物乞いが襲ってくる。";
      } else if (kind === "ジョブ") {
        floorPhase = "job";
        floorNote = `いまのジョブは${job}。カードは捨てない。`;
      }
      screen = "floor";
      render();
    }

    function dropBeggar(index) {
      if (floorKind !== "物乞いに遭遇" || beggarCut) return;
      const cards = runDeck();
      const card = cards[index];
      if (!card) return;
      const gift = keepCard(card);
      removed.push(gift);
      beggarGift = [gift];
      beggarCut = true;
      floorNote = `${card.name}を1枚、デッキから外した。進むと、物乞いがそのカードを使ってくる。`;
      render();
    }

    function enterNode(keepHp) {
      if (isEventNode(route[battleIndex])) {
        openFloor(keepHp);
        return;
      }
      startBattle(keepHp);
    }

    function beginRun(floors, name) {
      defeatSnap = null;
      lastFoeBlow = null;
      fxFatal = false;
      fatalHold = false;
      dungeonName = name || "骸洞窟";
      battleIndex = 0;
      route = buildRoute(floors || 20, dungeonName);
      battleTotal = route.length;
      cleared = false;
      gear = starterGear();
      gearOpen = null;
      gearOffer = null;
      stolen = [];
      removed = [];
      beggarGift = [];
      heroCast = castByName(castLock).name;
      job = "戦士";
      jobsHad = ["戦士"];
      ultimate = "";
      enterNode(30);
    }

    function continueGame() {
      const data = readSave();
      if (!data) return;
      clearTimer();
      applySave(data);
      if (data.cleared) {
        localStorage.removeItem(SAVE_KEY);
        screen = "title";
        render();
        return;
      }
      screen = "battle";
      render();
    }

    function goTitle() {
      clearTimer();
      askLeave = false;
      clearLive();
      screen = "title";
      saveNote = "";
      render();
    }

    function resumeLive() {
      const data = readLive();
      if (!data || !data.player || !data.enemy) return false;
      if (data.cleared) {
        clearLive();
        screen = "title";
        render();
        return true;
      }
      clearTimer();
      applySave(data);
      askLeave = false;
      screen = "battle";
      if (screen === "battle" && !outcome && enemy && enemy.hp <= 0) {
        finish("win");
        return true;
      }
      if (screen === "battle" && !outcome && player && player.hp <= 0) {
        finish("lose");
        return true;
      }
      if (screen === "battle" && phase === "resolve" && !outcome) {
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "enemy" && !outcome) {
        phase = "resolve";
        resolveAt = inPlay.length;
        render();
        timer = setTimeout(stepResolve, 480);
      } else if (screen === "battle" && phase === "recoil" && !outcome) {
        render();
        timer = setTimeout(startPlayerTurn, 650);
      } else if (screen === "battle" && phase === "intro" && !outcome) {
        encounter = false;
        startPlayerTurn();
      } else {
        render();
      }
      return true;
    }

    function meters(who, hp, maxHp, block) {
      const cap = who === "player" ? HP_CAP : Math.max(1, maxHp);
      const hpPct = Math.max(0, Math.min(100, (hp / cap) * 100));
      const maxPct = Math.max(0, Math.min(100, (maxHp / cap) * 100));
      const blockPct = Math.max(0, Math.min(100, (block / cap) * 100));
      const shield = block > 0 ? `<div class="shield-row"><div class="meter shield" style="width:${blockPct}%"><span></span></div><div class="shield-line">シールド</div></div>` : "";
      const room = who === "player" ? `<i class="hp-max" style="width:${maxPct}%"></i>` : "";
      return `<div class="meters">${shield}<div class="meter hp" style="--cap:${cap}; --max:${Math.max(1, maxHp)}">${room}<span data-bar="${who}" style="width:${hpPct}%"></span><i class="hp-ticks"></i></div></div>`;
    }

    // 戦闘画面の名前と体力の板。自分と敵で同じ作り（左の帯の色だけ違う）。
    function plateMarkup(cls, who, name, tag, shownHp, maxHp, block, extra) {
      const low = maxHp > 0 && shownHp / maxHp <= 0.3 ? " low" : "";
      const parried = who === "player" && typeof player !== "undefined" && player && parryCount(player) > 0;
      // シールドがあるときは、板の右上に大きな盾の札で数を出す（自分も敵も同じ）
      const shieldBadge = block > 0 ? `<div class="shield-badge" aria-label="シールド ${block}"><i class="plate-shield" aria-hidden="true"></i><b>${block}</b></div>` : "";
      const mods = `${low}${block > 0 ? " shielded" : ""}${parried ? " parried" : ""}`;
      const invuln = parried ? ` aria-label="${esc(name)} パリィ中・次の攻撃を無効"` : "";
      return `<section class="battle-plate ${cls}${mods}"${invuln}${extra && extra.attrs ? extra.attrs : ""}>${shieldBadge}
        <h2><span class="who">${esc(name)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</h2>
        ${meters(who, shownHp, maxHp, block)}
        <div class="hp-line"><span class="lbl">${heartIcon()}HP</span><span class="num"><b data-hp="${who}">${Math.round(shownHp)}</b><small>/ ${maxHp}</small></span></div>
        ${extra && extra.badges ? `<div class="plate-badges">${extra.badges}</div>` : ""}
      </section>`;
    }

    function pips() {
      const baseMax = Math.max(0, Number(player.baseMax) || Number(player.maxEnergy) || 0);
      const baseOn = Math.max(0, Number(player.baseEnergy != null ? player.baseEnergy : player.energy) || 0);
      const temp = Math.max(0, Number(player.tempEnergy) || 0);
      const yellow = Array.from({ length: baseMax }, (_, i) =>
        i < baseOn
          ? `<i class="pip on" style="--i:${i}"></i>`
          : `<i class="pip"></i>`
      ).join("");
      const orange = Array.from({ length: temp }, (_, i) =>
        `<i class="pip temp" style="--i:${baseMax + i}" title="持ち越しの一時マナ"></i>`
      ).join("");
      return yellow + orange;
    }

    function menuButton(label, action, primary, disabled) {
      return `<button type="button" class="${primary ? "primary" : ""}" data-action="${action}" ${disabled ? "disabled" : ""}>${esc(label)}</button>`;
    }

    function renderTitle() {
      root.innerHTML = `
        <div class="title-screen">
          <img class="title-bg" src="title-key.jpg?v=1" alt="">
          <div class="title-vignette" aria-hidden="true"></div>

        return `<div class="card preview ${cardKind(card)}" aria-label="${esc(label)}">${cardFace(card, false)}<b class="stack-count">x${count}</b></div>`;

    function starterDeckCount() {
      return CARD_POOL.reduce((sum, [, count]) => sum + count, 0);

    function castByName(name) {
      return CAST.find((item) => item.name === name) || CAST[0];

    function shownCastName() {
      return castHover || castLock || CAST[0].name;
    }

    function paintCast() {
      const name = shownCastName();
      const fixed = Boolean(castLock) && (!castHover || castHover === castLock);
      if (name !== castShown) {
        castShown = name;
        const item = castByName(name);
        const main = root.querySelector(".cast-main");
        if (main) main.innerHTML = castMainMarkup(item);
      }
      const start = root.querySelector(".cast-start");
      if (start) start.hidden = !fixed;
      root.querySelectorAll("[data-cast]").forEach((token) => {
        token.classList.toggle("locked", token.dataset.cast === castLock);
        token.classList.toggle("shown", token.dataset.cast === name);
      });
    }

    function bindCastHover() {
      root.querySelectorAll("[data-cast]").forEach((token) => {
        token.addEventListener("pointerenter", () => {
          const next = token.dataset.cast || "";
          if (castHover === next) return;
          castHover = next;
          paintCast();
        });
        token.addEventListener("pointerleave", () => {
          if (castHover !== token.dataset.cast) return;
          castHover = "";
          paintCast();
        });
      });
    }

      return dungeonHover || dungeonLock;

    function dungeonChainHtml(count) {
      const n = Math.max(0, Math.min(2, Number(count) || 0));
      if (n <= 0) return "";
      const bands = Array.from({ length: n }, (_, i) => `<i class="chain-band b${i + 1}"></i>`).join("");
      return `<div class="chain-wrap" aria-hidden="true">${bands}<span class="chain-lock"></span></div>`;
    }

    function paintDungeon() {
      const name = shownDungeonName();
      const fixed = Boolean(dungeonLock) && (!dungeonHover || dungeonHover === dungeonLock);
      const lockedItem = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock);
      const canStart = fixed && lockedItem && dungeonOpen(lockedItem.floors);
      const start = root.querySelector(".dungeon-pick .cast-start");
      if (start) start.hidden = !canStart;
      root.querySelectorAll(".dungeon-col").forEach((col) => {
        const active = col.dataset.dungeon === name;
        col.classList.toggle("active", active);
        col.setAttribute("aria-pressed", active && col.dataset.dungeon === dungeonLock ? "true" : "false");
      });
    }

    function bindDungeonHover() {
      root.querySelectorAll(".dungeon-col").forEach((col) => {
        col.addEventListener("pointerenter", () => {
          const next = col.dataset.dungeon || "";
          if (dungeonHover === next) return;
          dungeonHover = next;
          paintDungeon();
        });
        col.addEventListener("pointerleave", () => {
          if (dungeonHover !== col.dataset.dungeon) return;
          dungeonHover = "";
          paintDungeon();
        });
      });
    }

        return `

      root.innerHTML = `

    function albumCatalog() {
      const list = [];
      const seen = new Set();
      const push = (name, data, klass) => {
        if (!name || seen.has(name)) return;
        seen.add(name);
        list.push({ name, klass, stars: data.stars || 1, ...data });
      };
      for (const [name, data] of Object.entries(CARDS)) push(name, data, "基本");
      for (const [name, data] of Object.entries(WARRIOR)) push(name, data, "戦士");
      for (const [name, data] of Object.entries(COMMON)) push(name, data, "共通");
      for (const foe of ENEMIES) {
        for (const card of foe.pattern || []) {
          const name = card && card.name;
          if (!name || seen.has(name)) continue;
          if (name === "アタック" || name === "ブロック") continue;
          if (CARDS[name] || WARRIOR[name] || COMMON[name]) continue;
          const base = CARDS[name] || WARRIOR[name] || COMMON[name] || {};
          push(name, { ...base, ...card }, "敵");
        }
      }
      return list;
    }

    function artZoomSide(name) {

      const body = src
        ? `<img class="art-zoom-img" src="${esc(src)}" alt="${esc(name)}の絵柄">`

      return `<aside class="art-zoom-side" aria-label="${esc(name)}の拡大"><h3>${esc(name)}</h3>${body}<p class="art-zoom-note">${src ? "絵柄" : "カード"}を拡大表示中</p><button type="button" data-action="close-art-zoom">閉じる</button></aside>`;
