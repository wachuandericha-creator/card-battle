    function readLive() {
      if (!loginWord) return null;
      const slot = readAccount().slots[loginWord];
      return slot && slot.live ? slot.live : null;
    }

    function persistLive() {
      if (!loginWord || !player || !enemy) return;
      const account = readAccount();
      const slot = accountSlot(account, loginWord);
      slot.live = battleSnapshot();
      account.login = loginWord;
      writeAccount(account);
    }

    function clearLive() {
      if (!loginWord) return;
      const account = readAccount();
      if (account.slots[loginWord]) account.slots[loginWord].live = null;

    function applySave(data) {
      runLevel = Math.max(0, Number(data.runLevel) || 0);
      runBonus = data.runBonus && typeof data.runBonus === "object"
        ? { hp: Number(data.runBonus.hp) || 0, spd: Number(data.runBonus.spd) || 0, mana: Number(data.runBonus.mana) || 0 }
        : emptyRunBonus();
      cleared = !!data.cleared;
      runEnded = data.runEnded || (data.cleared ? "win" : null);
      defeatSnap = data.defeatSnap || null;
      battleIndex = data.battleIndex || 0;
      turn = data.turn || 0;
      intentIndex = data.intentIndex || 0;
      phase = data.phase || "player";
      note = data.note || "";
      banner = data.banner || "";
      outcome = data.outcome || null;
      logLines = data.logLines || [];
      const dropFocus = (list) => (list || []).filter((card) => card && card.name !== "集中");
      deck = dropFocus(data.deck || []);
      hand = dropFocus(data.hand || []);
      discard = dropFocus(data.discard || []);
      inPlay = dropFocus(Array.isArray(data.inPlay) ? data.inPlay : []);
      openingDeck = dropFocus(Array.isArray(data.openingDeck) && data.openingDeck.length
        ? data.openingDeck
        : deck.concat(hand, inPlay, discard)
      ).map((card) => ({ ...card }));
      resolveAt = data.resolveAt || 0;
      player = data.player;
      enemy = data.enemy;
      if (enemy) enemy.image = enemyByName(enemy.name).image;
      if (player) {
        player.hit = false;
        player.atk = player.atk || 0;
        player.def = player.def || 0;
        player.maxHp = Math.max(runMaxHp(), Number(player.maxHp) || 30);
        player.manaMod = Number(player.manaMod) || runBonus.mana || 0;
        player.spdMod = Number(player.spdMod) || runSpdBonus();
        if (player.hp > player.maxHp) player.hp = player.maxHp;
        player.maxEnergy = Math.min(MANA + (Number(player.manaMod) || 0) + 1, Math.max(MANA + (Number(player.manaMod) || 0), Number(player.maxEnergy) || MANA));
        if (player.energy > player.maxEnergy) player.energy = player.maxEnergy;
        if (player.baseMax == null) player.baseMax = Math.max(0, Number(player.maxEnergy) || MANA);
        if (player.tempEnergy == null) player.tempEnergy = 0;
        if (player.baseEnergy == null) player.baseEnergy = Math.max(0, (Number(player.energy) || 0) - (Number(player.tempEnergy) || 0));
        if (player.pendingCarry == null) player.pendingCarry = 0;
        syncEnergyTotal();
        player.burn = burnStacks(player);
        player.focus = 0;
        player.parry = player.parry === true ? 1 : Math.max(0, Number(player.parry) || 0);
        player.thorns = Math.max(0, Number(player.thorns) || 0);
        player.atkMod = Number(player.atkMod) || 0;
        player.defMod = Number(player.defMod) || 0;
        player.expose = Number(player.expose) || 0;
        player.guardThrough = !!player.guardThrough;
        player.extraDraw = Math.max(0, Number(player.extraDraw) || 0);
        player.poison = poisonStacks(player);
        if (!Array.isArray(player.parryHist)) player.parryHist = [];
        player.parryHitsThis = Math.max(0, Number(player.parryHitsThis) || (player.parryHitThis ? 1 : 0));
        player.parryHitsLast = Math.max(0, Number(player.parryHitsLast) || 0);
        player.parryHitThis = player.parryHitsThis > 0;
        player.parryLast = !!player.parryLast;
        player.knifeReflect = !!player.knifeReflect;
        player.doubleNext = !!player.doubleNext;
        player.magicParry = !!player.magicParry;
        player.pride = !!player.pride;
        player.shave = Math.max(0, Number(player.shave) || 0);
        player.masterOnce = !!player.masterOnce;
      }
      if (enemy) {
        enemy.hit = false;
        enemy.poison = poisonStacks(enemy);
        enemy.burn = burnStacks(enemy);
        enemy.thorns = Math.max(0, Number(enemy.thorns) || 0);
        enemy.rallied = !!enemy.rallied;
        enemy.anger = Math.min(1, Math.max(0, Number(enemy.anger) || 0));
        enemy.name = enemyKey(enemy.name);
        const foe = enemyByName(enemy.name);
        const maxFoe = foeBattleHp(foe);
        enemy.atk = hiddenAtk(foe) + enemy.anger * 2;
        enemy.defCut = Math.max(0, Number(enemy.defCut) || 0);
        syncEnemyDef();
        if (enemy.maxHp !== maxFoe) {
          enemy.maxHp = maxFoe;
          if (enemy.hp > maxFoe) enemy.hp = maxFoe;
        }
      }
      gear = normalizeGear(data.gear);
      syncGearStats();
      gearOpen = null;
      stolen = Array.isArray(data.stolen) ? data.stolen : [];
      removed = Array.isArray(data.removed) ? data.removed.filter((card) => card && card.name) : [];
      beggarGift = Array.isArray(data.beggarGift) ? data.beggarGift.filter((card) => card && card.name) : [];
      beggarBattle = !!data.beggarBattle;
      eventBattleSeen = !!data.eventBattleSeen;
      if (Array.isArray(data.route) && data.route.length) {
        route = data.route.map((name) => {
          if (!name) return null;
          const key = enemyKey(name);
          return key === "出来事:ジョブ" ? "出来事:探索" : key;
        });
      } else {
        route = CLASSIC_ROUTE.slice();
        const total = data.battleTotal || route.length;
        while (route.length < total) {
          const bossAt = route.indexOf(DUNGEON.boss);
          const tier = DUNGEON.road[DUNGEON.road.length - 1];
          if (bossAt >= 0) route.splice(bossAt, 0, rollRank(tier));
          else route.push(rollRank(tier));
        }
      }
      // 古いセーブ（祝福が1層目だった道）は、1層目に雑魚を1つ足して新しい数え方に合わせる
      if (!data.floorZero && route[0] === "出来事:祝福" && route.length > 1) {
        route.splice(battleIndex === 0 ? 1 : battleIndex + 1, 0, rollRank(1));

      battleTotal = route.length;
      if (data.dungeonName) {
        const legacy = { "20": "洞窟", "はじまりの洞窟": "洞窟", "骸洞窟": "洞窟", "50": "古城", "竜の遺骸城": "古城", "100": "深淵", "深淵なる寝所": "深淵" };
        dungeonName = legacy[data.dungeonName] || data.dungeonName;
      }
      if (Array.isArray(data.floorAt) && data.floorAt.length === route.length) {
        dungeonFloors = Number(data.dungeonFloors) || floorsOf(dungeonName);
        floorAt = data.floorAt.map((n) => Number(n) || 0);
        clampBlessingNext();
      } else {
        rememberFloors(Number(data.dungeonFloors) || floorsOf(dungeonName));
      }
      if (enemy && route[battleIndex] && !isEventNode(route[battleIndex])) {
        const foe = enemyNow();
        enemy.name = foeLabel();
        enemy.image = foe.image;
        enemy.anger = Math.min(1, Math.max(0, Number(enemy.anger) || 0));
        enemy.atk = hiddenAtk(foe) + enemy.anger * 2;
        enemy.defCut = Math.max(0, Number(enemy.defCut) || 0);
        syncEnemyDef();
      }
      restoreEnemyLoop(data);
      foePlan = Array.isArray(data.foePlan) ? data.foePlan.map((step) => ({ anger: !!step.anger, card: { ...step.card } })) : [];
      runSlain = Array.isArray(data.runSlain) ? data.runSlain.map((name) => String(name)) : [];
      invalidateFoeAct();
      if (screen === "battle" && phase === "player" && enemy && !foePlan.length && enemyLoop.length) buildFoePlan();
      heroCast = castByName(data.heroCast || "戦士").name;
      job = "戦士";
      rewardReady = !!data.rewardReady;
      rewardStars = data.rewardStars || 0;
      rewardPicks = Array.isArray(data.rewardPicks) ? data.rewardPicks : [];
      rewardPaths = (Array.isArray(data.rewardPaths) ? data.rewardPaths : []).filter((id) => PATHS[id]);
      pathBag = Array.isArray(data.pathBag) ? data.pathBag.filter((id) => PATHS[id]) : null;
      fixedRestAt = Array.isArray(data.fixedRestAt) ? data.fixedRestAt.map((n) => Number(n) || 0) : [];
      runEnchants = data.runEnchants && typeof data.runEnchants === "object" ? { ...data.runEnchants } : {};
      runEnchantWords = data.runEnchantWords && typeof data.runEnchantWords === "object" ? { ...data.runEnchantWords } : {};
      cardAlters = Array.isArray(data.cardAlters) ? data.cardAlters : [];
      cardMastery = Array.isArray(data.cardMastery) ? data.cardMastery : [];
      masteryOffer = null;
      runLevel = Math.max(0, Number(data.runLevel) || 0);
      growthLine = data.growthLine || "";
      dropLine = data.dropLine || "";
      victoryGear = data.victoryGear && data.victoryGear.name ? data.victoryGear : null;
      hurtRestUsed = !!data.hurtRestUsed;
      // 古い保存（走り抜けが混ざる・右端が未知との遭遇でない）は引き直す
      if (!Array.isArray(pathBag) && rewardPaths.length && (rewardPaths[1] !== "straight" || rewardPaths.length !== 3)) rewardPaths = rollPaths();
      rewardStep = data.rewardStep || "cards";
      pathEventTitle = data.pathEventTitle || "探索";
      floorGift = data.floorGift && data.floorGift.kind ? data.floorGift : null;
      bossPicks = Array.isArray(data.bossPicks) ? data.bossPicks : [];
      shopStock = Array.isArray(data.shopStock) ? data.shopStock : [];
      gearOffer = data.gearOffer && data.gearOffer.item ? data.gearOffer : null;
      if (outcome === "win" && !rewardReady) prepareReward();
      saveNote = "";
      bindShown();
    }

    function startBattle(keepHp) {

    function showEncounter() {
      timer = null;
      if (phase !== "intro" || outcome) return;

      encounter = true;
      render();
      timer = setTimeout(beginEncounter, 1600);

    function foeRankName() {
      if (bossNow()) return "ボス";
      return (enemyNow() && enemyNow().rank) || "普通";
    }

      const rank = (enemyNow() && enemyNow().rank) || "普通";

      if (beggarBattle) return "物乞いが襲ってきた";

      timer = null;
      if (phase !== "intro" || outcome) return;

    function rollBlessGear() {
      const pool = GEAR_ITEMS.filter((item) => (Number(item.stars) || 0) >= 2);
      const list = pool.length ? pool : GEAR_ITEMS;
      return { ...list[Math.floor(Math.random() * list.length)] };
    }
    function rollBlessCard() {
      const offers = Object.keys(COMMON).map((name) => ({ name, ...COMMON[name], stars: COMMON[name].stars || 1 }))
        .concat(classCards())
        .filter((card) => (Number(card.stars) || 1) >= 2);
      const pick = pickWeighted(offers, (card) => rarityWeight(card.stars)) || { name: "ツインアタック", ...COMMON["ツインアタック"], stars: 3 };
      return keepCard(pick);
    }
    function emptyRunBonus() {
      return { hp: 0, spd: 0, mana: 0 };
    }

    function levelStep() {
      return Math.floor((Number(runLevel) || 0) / 3);
    }

    function levelSpd() {
      return Math.floor((Number(runLevel) || 0) / 10);
    }

    function runSpdBonus() {
      return levelSpd() + Math.max(0, Number(runBonus && runBonus.spd) || 0);
    }

    function runMaxHp() {
      const grown = Math.min(HP_CAP, 30 + (Number(runLevel) || 0) * 3);
      return grown + Math.max(0, Number(runBonus && runBonus.hp) || 0);
    }

    function gainLevel() {
      const before = player ? Number(player.maxHp) || runMaxHp() : runMaxHp();
      runLevel = (Number(runLevel) || 0) + 1;
      const nextMax = runMaxHp();
      const grew = Math.max(0, nextMax - before);
      if (player) {
        player.maxHp = nextMax;
        player.hp = Math.min(nextMax, (Number(player.hp) || 0) + grew);
        player.spdMod = runSpdBonus();
        syncGearStats();
      }
      floorHp = player ? player.hp : Math.min(nextMax, (Number(floorHp) || 0) + grew);
      const bits = [`レベル${runLevel}`];
      if (grew) bits.push(`最大HP+${grew}`);
      if (runLevel % 3 === 0) bits.push("ATK+1　DEF+1");
      if (runLevel % 10 === 0) bits.push("SPD+1");
      growthLine = bits.join("　");
    }

    const ENCHANT_ELEMS = ["fire", "water", "light", "dark"];

    function enchantFace(elem) {
      if (elem === "water") return { name: "水", sub: "DEF+2", image: "enchant-water.svg?v=1" };
      if (elem === "light") return { name: "光", sub: "マナ-1", image: "enchant-light.svg?v=1" };
      if (elem === "dark") return { name: "闇", sub: "キーワード", image: "enchant-dark.svg?v=1" };
      return { name: "火", sub: "ATK+2", image: "enchant-fire.jpg?v=1" };
    }

    function darkWordLabel(id) {
      if (id === "keep") return "キープ";
      if (id === "flash") return "フラッシュ";
      if (id === "burst") return "バースト";
      if (id === "parry") return "パリィ";
      if (id === "poison") return "毒+3";
      if (id === "burn") return "炎上+3";
      if (id === "crit") return "クリティカル50%";
      if (id === "thorns") return "トゲ+1";
      return "クイック";
    }

    function darkKeywordChoices(card) {
      const list = [];
      if (!card.quick && !isItemCard(card)) list.push("quick");
      if (!card.keep) list.push("keep");
      if (!isFlashCard(card)) list.push("flash");
      if (!card.burst && !isItemCard(card)) list.push("burst");
      if (!card.parry) list.push("parry");
      if (!card.poison) list.push("poison");
      if (!card.burn) list.push("burn");
      if (!card.critChance) list.push("crit");
      if (!card.thorns) list.push("thorns");
      return list;
    }

    function applyDarkWord(card, id) {
      if (!card || !id) return;
      if (id === "quick") card.quick = true;
      else if (id === "keep") card.keep = true;
      else if (id === "flash") card.flash = true;
      else if (id === "burst") card.burst = true;
      else if (id === "parry") {
        card.parry = true;
        if (!String(card.text || "").includes("パリィ")) card.text = `${card.text || ""}\nパリィ`.trim();
      } else if (id === "poison") {
        if (!card.poison) card.poison = 3;
        if (!String(card.text || "").includes("毒")) card.text = `${card.text || ""}\n毒+3`.trim();
      } else if (id === "burn") {
        if (!card.burn) card.burn = 3;
        if (!String(card.text || "").includes("炎上")) card.text = `${card.text || ""}\n炎上+3`.trim();
      } else if (id === "crit") {
        if (!card.critChance) card.critChance = 50;
        if (!/クリティカル\d+%/u.test(String(card.text || ""))) card.text = `${card.text || ""}\nクリティカル50%`.trim();
      } else if (id === "thorns") {
        if (!card.thorns) card.thorns = 1;
        if (!String(card.text || "").includes("トゲ")) card.text = `${card.text || ""}\nトゲ+1を得る`.trim();
      }
    }

    function grantEnchant(name, kind) {
      if (!name || runEnchants[name]) return "";
      if (kind !== "fire" && kind !== "water" && kind !== "light" && kind !== "dark") return "";
      let word = "";
      if (kind === "dark") {
        const raw = deckCore().find((card) => card && card.name === name) || {};
        const choices = darkKeywordChoices(raw);
        if (!choices.length) return "";
        const id = shuffle(choices)[0];
        runEnchantWords[name] = id;
        word = darkWordLabel(id);
      }
      runEnchants[name] = kind;
      return word;
    }

    function enchantTargets() {
      const names = [];
      for (const card of runDeck()) {
        if (!card || !card.name || names.indexOf(card.name) >= 0) continue;
        if (runEnchants[card.name]) continue;
        names.push(card.name);
      }
      return names;
    }

    function rollBlessPicks() {
      const picks = [];
      for (const kind of shuffle(BLESS_KINDS)) {
        if (picks.length >= 3) break;
        if (kind === "maxhp") picks.push({ kind, label: "最大HP" });
        else if (kind === "spd") picks.push({ kind, label: "SPD" });
        else if (kind === "gear") picks.push({ kind, gear: rollBlessGear(), label: "装備" });
        else if (kind === "card") picks.push({ kind: "card", card: rollBlessCard(), label: "カード" });
        else if (kind === "enchant" && enchantTargets(true).length) {
          const elem = pickWeighted(ENCHANT_ELEMS, enchantWeight);
          picks.push({ kind, elem, label: enchantFace(elem).name });
        }
      }
      return picks;
    }

    function takeGift(pick) {
      if (!pick) return "";
      if (pick.kind === "item") return "";
      if (pick.kind === "gear") {
        if (!gear) gear = emptyGear();
        if (offerWeapon(pick.gear, { source: "gift" })) return "";
        giveGear(pick.gear);
        floorGift = { kind: "gear", gear: { ...pick.gear } };
        armRare("gift");
        return `${pick.gear.name}を受け取った。`;
      }
      stolen.push(keepCard(pick.card));
      floorGift = { kind: "card", card: keepCard(pick.card) };
      armRare("gift");
      return `${pick.card.name}を1枚受け取った。`;
    }

    function playPickCenter(_selector, done) {
      if (typeof done === "function") done();
    }

    function takeBless(index) {
      if (floorKind !== "挑戦者に祝福を" || floorPhase !== "bless") return;
      const pick = blessPicks[index];
      if (!pick) return;
      playPickCenter(`[data-action="bless-pick"][data-bless="${index}"]`, () => {
        if (floorKind !== "挑戦者に祝福を" || floorPhase !== "bless") return;
        if (pick.kind === "enchant") {
          if (!enchantTargets(true).length) return;
          blessEnchantAt = index;
          blessCardName = "";
          enchantPop = "bless";
          render();
          return;
        }
        if (pick.kind === "maxhp") {
          runBonus.hp = (Number(runBonus.hp) || 0) + 20;
          floorHp = runMaxHp();
        } else if (pick.kind === "spd") {
          runBonus.spd = (Number(runBonus.spd) || 0) + 1;
        } else if (!takeGift(pick)) {
          return;
        }
        blessPicks = [];
        finishEvent();
      });
    }

    function confirmBlessEnchant() {
      if (enchantPop !== "bless" || floorKind !== "挑戦者に祝福を" || floorPhase !== "bless") return;
      const pick = blessPicks[blessEnchantAt];
      const name = blessCardName;
      if (!pick || pick.kind !== "enchant" || !name) return;
      if (runEnchants[name] || enchantTargets().indexOf(name) < 0) return;
      const word = grantEnchant(name, pick.elem);
      if (pick.elem === "dark" && !word) return;
      const face = enchantFace(pick.elem);
      const added = word ? `　${word}` : "";
      log(`${heroName()}は${name}に${face.name}を付けた。${face.sub}${added}。`);
      blessPicks = [];
      blessEnchantAt = -1;
      blessCardName = "";
      enchantPop = "";
      floorPhase = "show";
      persistSave(true);
      finishEvent();
    }

    function enchantPickOverlay() {
      if (enchantPop !== "bless" && enchantPop !== "smith" && enchantPop !== "smith-elem") return "";
      if (enchantPop === "smith-elem") {
        const wired = ENCHANT_ELEMS.map((id) => {
          const face = enchantFace(id);
          return `<button type="button" class="primary" data-action="smith-elem" data-elem="${id}">${esc(face.name)}　${esc(face.sub)}</button>`;
        }).join("");
        return `<div class="overlay deck-view enchant-pick"><div class="panel"><h2>${esc(smithName)}</h2><p class="deck-lead">どれを付けますか。</p><div class="enchant-actions">${wired}</div>${menuButton("もどる", "enchant-back")}</div></div>`;
      }
      const pick = enchantPop === "bless" ? blessPicks[blessEnchantAt] : null;
      const face = pick && pick.kind === "enchant" ? enchantFace(pick.elem) : null;
      const pickedName = enchantPop === "bless" ? blessCardName : smithName;
      const seen = {};
      const cards = [];
      for (const card of runDeck()) {
        if (!card || !card.name || seen[card.name]) continue;
        if (enchantTargets().indexOf(card.name) < 0) continue;
        seen[card.name] = true;
        cards.push(card);
      }
      const rows = cards.map((card) => {
        const picked = pickedName === card.name ? " picked" : "";
        const action = enchantPop === "bless" ? "bless-enchant-pick" : "smith-name";
        return `<button type="button" class="enchant-card${picked}" data-action="${action}" data-name="${esc(card.name)}"><div class="card preview ${cardKind(card)}">${cardFace(card, false)}</div></button>`;
      }).join("");
      const title = enchantPop === "bless" ? "どれにしますか" : "エンチャント";
      const lead = face ? `${face.name}　${face.sub}` : "カードを一つ選ぶ。";
      const ok = enchantPop === "bless" ? "bless-enchant-ok" : "smith-enchant-ok";
      return `<div class="overlay deck-view enchant-pick"><div class="panel"><h2>${esc(title)}</h2><p class="deck-lead">${esc(lead)}</p><div class="deck-scroll"><div class="deck-cards">${rows || `<p class="deck-empty">付けられるカードは無い。</p>`}</div></div><div class="enchant-actions">${menuButton("決定", ok, true, !pickedName)}${menuButton("もどる", "enchant-back")}</div></div></div>`;
    }

    function cardBuildName(name) {
      if (CARD_BUILD[name]) return CARD_BUILD[name];
      if (name === "パリィ") return "パリィ";
      return "";
    }

    function playerBuild() {
      const counts = {};
      for (const card of runDeck()) {
        const build = cardBuildName(card.name);
        if (!build) continue;
        counts[build] = (counts[build] || 0) + 1;
      }
      let best = "パリィ";
      let bestN = -1;
      for (const build of Object.keys(counts)) {
        if (counts[build] > bestN) {
          best = build;
          bestN = counts[build];
        }
      }
      return best;
    }

    function trainCard(name) {
      const def = WARRIOR[name];
      if (!def) return null;
      return keepCard({ name, ...def, stars: def.stars || 1 });
    }

    function drawTrainNames(pool, picked) {
      const left = pool.filter((name) => picked.indexOf(name) < 0 && WARRIOR[name]);
      while (picked.length < 3 && left.length) {
        const name = pickWeighted(left, (cardName) => rarityWeight((WARRIOR[cardName] && WARRIOR[cardName].stars) || 1));
        const at = left.indexOf(name);
        if (at < 0) break;
        left.splice(at, 1);
        picked.push(name);
      }
    }

    function rollTrainPicks() {
      const build = playerBuild();
      const inBuild = Object.keys(CARD_BUILD).filter((name) => CARD_BUILD[name] === build && WARRIOR[name]);
      const rest = Object.keys(WARRIOR).filter((name) => inBuild.indexOf(name) < 0);
      const names = [];
      drawTrainNames(inBuild, names);
      drawTrainNames(rest, names);
      return names.map(trainCard).filter(Boolean);
    }

    function maxOneMastery() {
      const open = runDeck().filter((card) => {
        if (!card || !card.name || card.copyNth == null) return false;
        const row = masteryRow(card.name, card.copyNth);
        return !row || !row.picked;
      });
      const card = shuffle(open)[0];
      if (!card) return null;
      let row = masteryRow(card.name, card.copyNth);
      if (!row) {
        row = { name: card.name, nth: card.copyNth, plays: 0, picked: "" };
        cardMastery.push(row);
      }
      const need = masteryNeed(card.name);
      row.plays = need;
      masteryOffer = { name: card.name, nth: card.copyNth, need, source: "train" };
      return card;
    }

    function takeTrain(index) {
      if (floorKind !== "修行" || floorPhase !== "train") return;
      const card = trainPicks[index];
      if (!card) return;
      if (!takeGift({ kind: "card", card })) return;
      const grown = maxOneMastery();
      trainPicks = [];
      floorPhase = "show";
      floorPrompt = grown
        ? `${card.name}を受け取った。${grown.name}が熟練の回数に達した。`
        : `${card.name}を受け取った。熟練できるカードは無かった。`;
      log(floorPrompt);
      persistSave(true);
      render();
    }

    function grantExplore() {
      const item = GEAR_ITEMS[Math.floor(Math.random() * GEAR_ITEMS.length)];
      if (!item) return "";
      return takeGift({ kind: "gear", gear: { ...item } });
    }

    function giftMarkup(gift, big, hot, index) {
      if (!gift) return "";
      const cls = big ? "gift-show" : "gift-pick";
      const lv = hot ? rareLevel(giftEntity(gift)) : 0;
      const fx = rareFx(lv);
      const style = rareStyle(lv, index || 0);
      if (gift.kind === "card" && gift.card) {
        return `<div class="${cls}${rareClass(lv)}"${style}>${fx}<div class="card preview ${cardKind(gift.card)}">${cardFace(gift.card)}</div></div>`;
      }
      if (gift.kind === "enchant") {
        const face = enchantFace(gift.elem);
        return `<div class="${cls}">${gearPopShell("enchant", {
          image: face.image,
          boonSub: face.sub,
        })}</div>`;
      }
      if (gift.kind === "spd" || gift.kind === "maxhp" || gift.kind === "mana") {
        const boon = gift.kind === "maxhp"
          ? { slot: "hp", image: "reward-hp.jpg?v=1", boonSub: "HP+20" }
          : gift.kind === "mana"
            ? { slot: "mana", name: "マナ+1", image: "reward-mana.jpg?v=1" }
            : { slot: "spd", image: "reward-spd.jpg?v=1", boonSub: "SPD+1" };
        return `<div class="${cls}">${gearPopShell(boon.slot, {
          name: boon.name,
          image: boon.image,
          boonSub: boon.boonSub || "",
        })}</div>`;
      }
      const item = gift.kind === "gear" ? gift.gear : gift.item;
      if (!item) return "";
      if (gift.kind === "gear") {
        return `<div class="${cls}${rareClass(lv)}"${style}>${fx}${gearPopShell(item.slot || "sword", {
          item,
          name: item.name,
          image: item.image || "",
          rarity: gearRarityText(item),
          embedded: true,
        })}</div>`;
      }
      const picture = item.image ? `<img class="gift-img" src="${esc(item.image)}" alt="">` : "";
      const detail = `<b>${esc(item.name)}</b><small>${esc(item.effect || "")}</small>`;
      return `<div class="${cls}${rareClass(lv)}"${style}>${fx}${rareCaption(item)}${picture}${detail}</div>`;
    }

    function enterFloorScreen() {
      screen = "floor";
      render();
      if (floorKind === "挑戦者に祝福を" && floorPhase === "bless") playBlessArrive();
    }

    function beginFloorEvent(kind, keepHp) {
      floorHp = keepHp == null ? runMaxHp() : Math.min(runMaxHp(), keepHp);
      floorKind = kind;
      floorNote = "";
      floorPrompt = "";
      floorPhase = "show";
      eventFloorCall = false;
      floorGift = null;
      blessPicks = [];
      blessEnchantAt = -1;
      blessCardName = "";
      enchantPop = "";
      trainPicks = [];
      beggarCut = false;
      beggarPick = -1;
      if (kind === "祝福") {
        floorKind = "挑戦者に祝福を";
        floorPhase = "bless";
        blessPicks = rollBlessPicks();
        floorNote = "女神は祝福を三つ差し出した。受け取れるのは一つだけ。";
        floorPrompt = "";
        armRare("bless");
      } else if (kind === "キャンプ") {
        floorKind = "休憩";
        const max = runMaxHp();
        const before = Math.min(max, floorHp);
        const gain = Math.round(max * 0.2);
        const after = Math.min(max, before + gain);
        const healed = after - before;
        floorHp = after;
        if (player) {
          player.maxHp = max;
          player.hp = after;
        }
        floorNote = "焚き火のそばで、女の戦士は丸くなってひと息ついた。頬が赤く、静かな寝息が落ちる。";
        floorPrompt = healed
          ? `現在HP ${before} / 最大HP ${max}。${healed} 回復して、${after} / ${max}。最大HPの20%。`
          : `現在HP ${before} / 最大HP ${max}。すでに満タンで、回復は0。`;
      } else if (kind === "お店") {
        shopStock = rollShopStock();
        floorNote = "";
        floorPrompt = "★で買い物。カード2つ、装備2つ。値段はレアリティと同じ。";
        armRare("shop");
      } else if (kind === "探索") {
        const item = GEAR_ITEMS[Math.floor(Math.random() * GEAR_ITEMS.length)];
        floorGift = item ? { kind: "gear", gear: { ...item } } : null;
        floorPhase = floorGift ? "search" : "show";
        floorNote = "松明の光が、古びた宝箱を照らしている。女の戦士は蓋に手をかけ、今にも開けようとしている。目は星のように輝き、よだれが一筋落ちた。";
        floorPrompt = floorGift ? "宝箱の中から使えそうな装備を見つけた。" : "中は空っぽだった。";
      } else if (kind === "未知") {
        if (Math.random() < ENCOUNTER_BEGGAR) {
          floorKind = "物乞いに遭遇";
          beggarGift = [];
          floorNote = "フードの物乞いが道をふさぎ、高価なカードを要求している。腰には、きらりと光るものがある。";
          floorPrompt = "物乞いにカードをあげろ。";
        } else {
          floorKind = "挑戦者に祝福を";
          floorPhase = "bless";
          blessPicks = rollBlessPicks();
          floorNote = "";
          floorPrompt = "";
          armRare("bless");
        }
      } else if (kind === "修行") {
        floorKind = "修行";
        floorPhase = "train";
        trainPicks = rollTrainPicks();
        floorNote = "女の戦士は汗を飛ばしながら素振りを続け、新しい技が腕に残った。";
        floorPrompt = trainPicks.length ? "カードを一つ選べ。" : "もらえるカードは無かった。";
        if (!trainPicks.length) floorPhase = "show";
      } else if (kind === "物乞い") {
        floorKind = "物乞いに遭遇";
        beggarGift = [];
        beggarPick = -1;
        floorNote = "フードの物乞いが道をふさぎ、高価なカードを要求している。腰には、きらりと光るものがある。";
        floorPrompt = "物乞いにカードをあげろ。";
      } else if (kind === "鍛冶屋") {
        floorKind = "鍛冶屋";
        floorPhase = "show";
        smithBase = -1;
        smithName = "";
        floorNote = "あやしい婆さんが、火の前で手を振っている。";
        floorPrompt = "合成は★3で、同じ土台は一度きり。エンチャントは★2で、同じカード名のすべてにかかる。★が無いと使えない。";
      }
    }

    function dropOneCard(name) {
      const starter = CARD_POOL.reduce((sum, row) => sum + (row[0] === name ? row[1] : 0), 0);
      const gone = removed.filter((card) => card && card.name === name).length;
      if (gone < starter) {
        const def = cardDef(name);
        if (def) removed.push(keepCard({ name, ...def }));
        return;
      }
      const at = stolen.findIndex((card) => card && card.name === name);
      if (at >= 0) stolen.splice(at, 1);
    }

    function fuseSmith(matIndex) {
      if ((Number(meta.stars) || 0) < 3) return;
      const raw = deckCore();
      const shown = runDeck();
      const base = raw[smithBase];
      const mat = raw[matIndex];
      const baseShown = shown[smithBase];
      const matShown = shown[matIndex];
      if (!base || !mat || !baseShown || !matShown || baseShown.fused || smithBase === matIndex) return;
      const baseCost = Number(baseShown.cost) || 0;
      const matCost = Number(matShown.cost) || 0;
      if (baseCost < 2 || matCost >= baseCost) return;
      const nth = raw.slice(0, smithBase).filter((card) => card.name === base.name).length;
      const alter = { name: base.name, nth, text: `${base.text || ""} ${mat.text || ""}`.replace(/\s+/g, " ").trim(), fused: true };
      const damage = (Number(base.damage) || 0) + (Number(mat.damage) || 0);
      const block = (Number(base.block) || 0) + (Number(mat.block) || 0);
      const heal = (Number(base.heal) || 0) + (Number(mat.heal) || 0);
      if (damage) alter.damage = damage;
      if (block) alter.block = block;
      if (heal) alter.heal = heal;
      cardAlters.push(alter);
      dropOneCard(mat.name);
      meta.stars -= 3;
      persistMeta();
      floorPhase = "show";
      floorPrompt = `${base.name}に、${mat.name}の効果を足した。素材は消えた。`;
      persistSave(true);
      render();
    }

    function enchantSmith(kind) {
      if (enchantPop !== "smith-elem") return;
      if ((Number(meta.stars) || 0) < 2 || !smithName || runEnchants[smithName]) return;
      const word = grantEnchant(smithName, kind);
      if (!word && kind === "dark") return;
      if (!runEnchants[smithName]) return;
      meta.stars -= 2;
      persistMeta();
      const face = enchantFace(kind);
      const added = word ? `　${word}` : "";
      enchantPop = "";
      floorPhase = "show";
      floorPrompt = `${smithName}に、${face.name}のエンチャントを付けた。${face.sub}${added}。`;
      persistSave(true);
      render();
    }

    function smithPanelHtml() {
      const have = Number(meta.stars) || 0;
      const cards = runDeck();
      if (floorPhase === "smith-base") {
        const rows = cards.map((card, index) => {
          const cost = Number(card.cost) || 0;
          const ok = cost >= 2 && !card.fused;
          return `<button type="button" data-action="smith-base" data-index="${index}" ${ok ? "" : "disabled"}>${esc(card.name)}　${cost}マナ${card.fused ? "　合成済み" : ""}</button>`;
        }).join("");
        return `<p>2マナ以上の土台を選ぶ。所持 ★${have}</p><div class="event-actions">${rows}${menuButton("もどる", "smith-back")}</div>`;
      }
      if (floorPhase === "smith-mat") {
        const base = cards[smithBase];
        const baseCost = base ? Number(base.cost) || 0 : 0;
        const rows = cards.map((card, index) => {
          const cost = Number(card.cost) || 0;
          const ok = base && index !== smithBase && cost < baseCost;
          return `<button type="button" data-action="smith-mat" data-index="${index}" ${ok ? "" : "disabled"}>${esc(card.name)}　${cost}マナ</button>`;
        }).join("");
        return `<p>${esc(base ? base.name : "")}に足すカード。素材は消える。★3。所持 ★${have}</p><div class="event-actions">${rows}${menuButton("もどる", "smith-back")}</div>`;
      }
      return `<div class="event-actions">${menuButton("合成する　★3", "smith-fuse", true, have < 3)}${menuButton("エンチャント　★2", "smith-enchant", true, have < 2)}${menuButton("出ていく", "smith-leave")}</div>`;
    }

    function openFloor(keepHp) {
      const kind = String(route[battleIndex] || "").slice("出来事:".length);
      beginFloorEvent(kind, keepHp);
      enterFloorScreen();
    }

    function optionEventActive() {
      return screen === "settings";
    }

    function ensureOptionRun() {
      if (player) return;
      if (!route.length) {
        battleIndex = 0;
        route = ["スライム"];

      const gift = keepCard(card);
      removed.push(gift);

      if (departing) return;
      const chosen = DUNGEON_LIST.find((dungeon) => dungeon.name === name) || pendingDungeon || DUNGEON_LIST[0];
      if (!chosen || !dungeonOpen(chosen.floors)) return;
      departing = true;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ms = reduce ? 700 : 2600;
      const veil = document.createElement("div");
      veil.className = reduce ? "depart depart-fast" : "depart";
      veil.setAttribute("role", "status");
      veil.innerHTML = `<img class="depart-art" src="${chosen.art}" alt=""><h1 class="depart-name"><span>${esc(chosen.name)}</span></h1>`;
      mountFloat(veil);
      if (departTimer) clearTimeout(departTimer);
      departTimer = setTimeout(() => {
        departTimer = null;
        departing = false;
        beginRun(chosen.floors, chosen.name);
        veil.classList.add("depart-out");
        setTimeout(() => { if (veil.parentNode) veil.remove(); }, reduce ? 200 : 800);

    function resumeLive() {
      const data = readLive();
      if (!data || !data.player || !data.enemy) return false;
      if (data.cleared) {
        clearLive();
        screen = "title";
        render();
        return true;

      clearTimer();
      applySave(data);
      askLeave = false;

      if (screen === "battle" && !outcome && enemy && enemy.hp <= 0) {
        finish("win");

      }
      if (screen === "battle" && !outcome && player && player.hp <= 0) {
        finish("lose");
        return true;
      }
      if (screen === "battle" && phase === "resolve" && !outcome) {
        render();

      } else if (screen === "battle" && phase === "enemy" && !outcome) {

        render();

      }
      return true;

    function meters(who, hp, maxHp, block, threat) {
      const cap = Math.max(1, maxHp);
      const hpPct = Math.max(0, Math.min(100, (hp / cap) * 100));
      const loss = Math.max(0, Math.min(Number(hp) || 0, Number(threat) || 0));
      const lossPct = (loss / cap) * 100;
      const stayPct = Math.max(0, hpPct - lossPct);
      const blockPct = Math.max(0, Math.min(100, (block / cap) * 100));
      const shield = `<div class="shield-row" aria-label="シールド ${block}"><div class="meter shield" style="width:${blockPct}%"><span></span></div></div>`;
      const threatHtml = loss > 0 ? `<i class="hp-threat" style="left:${stayPct}%;width:${lossPct}%"></i>` : "";
      const aria = loss > 0 ? `HP ${Math.round(hp)}/${Math.round(cap)}。このあと${Math.round(loss)}減る` : `HP ${Math.round(hp)}/${Math.round(cap)}`;
      return `<div class="meters">${shield}<div class="meter hp" style="--cap:${cap}; --max:${cap}" aria-label="${aria}"><span data-bar="${who}" style="width:${hpPct}%"></span>${threatHtml}<b class="hp-now"><span data-hp="${who}">${Math.round(hp)}/${Math.round(cap)}</span></b><i class="hp-ticks"></i></div></div>`;
    }

    // 戦闘画面の名前と体力の板。自分と敵で同じ作り（左の帯の色だけ違う）。
    function plateMarkup(cls, who, name, tag, shownHp, maxHp, block, extra) {
      const low = maxHp > 0 && shownHp / maxHp <= 0.3 ? " low" : "";
      const parryN = extra && extra.parry != null
        ? Math.max(0, Number(extra.parry) || 0)
        : (who === "player" && typeof player !== "undefined" && player ? parryCount(player) : 0);
      const parried = parryN > 0;
      const parryStacks = parryN >= 2;
      // シールドは板の右上の銀盾。パリィは同じ位置の金盾（得ると銀から金に変わる。臆病者の構え時だけ横並び）
      const breaking = Boolean(extra && extra.break);
      const fresh = Boolean(extra && extra.shieldFlash && block > 0);
      const crack = Boolean(extra && extra.crack && block > 0 && !breaking);
      const parryFresh = Boolean(extra && extra.parryFlash);
      const shieldBadge = !breaking && block > 0 ? `<div class="shield-badge${fresh ? " fresh" : ""}${crack ? " crack" : ""}" aria-label="シールド ${block}">${plateShieldSvg(false)}<b>${block}</b></div>` : "";
      const breakHtml = breaking ? shieldBreakHtml() : "";
      const parryBadge = parried
        ? `<div class="shield-badge parry-badge${parryFresh ? " fresh" : ""}${extra && extra.parryFromShield ? " from-shield" : ""}" aria-label="パリィ ${parryN}">${plateShieldSvg(true)}${parryStacks ? `<b>${parryN}</b>` : ""}</div>`
        : "";
      const mods = `${low}${block > 0 ? " shielded" : ""}${parried ? " parried" : ""}`;
      const invuln = parried ? ` aria-label="${esc(name)} パリィ中・次の攻撃を無効"` : "";
      const badges = extra && extra.badges
        ? `<span class="plate-badges">${extra.badges}</span>`
        : "";
      const stars = extra && extra.stars
        ? `<span class="plate-stars" aria-label="ランク">${esc(extra.stars)}</span>`
        : "";
      // 板の数値は＋を付けない。値は中央ぞろえ。HP行は出さない。いま/最大は体力バーに出す。
      const statLine = (icon, label, value, kind) => `<div class="hp-line${kind ? ` ${kind}` : ""}"><span class="lbl">${icon}${label}</span><span class="num"><b>${value}</b></span></div>`;
      const atkLine = extra && extra.atk != null ? statLine(swordIcon(), "ATK", extra.atk, "stat-atk") : "";
      const defLine = extra && extra.def != null ? statLine(shieldIcon(), "DEF", extra.def, "stat-def") : "";
      const spdLine = extra && extra.spd != null ? statLine(bootIcon(), "SPD", extra.spd, "stat-spd") : "";
      return `<section class="battle-plate ${cls}${mods}"${invuln}${extra && extra.attrs ? extra.attrs : ""}>${shieldBadge}${breakHtml}${parryBadge}
        <h2><span class="who">${esc(name)}</span>${stars}${tag ? `<span class="tag">${esc(tag)}</span>` : ""}${badges}</h2>
        ${meters(who, shownHp, maxHp, block, extra && extra.threat)}
        ${atkLine}${defLine}${spdLine}${extra && extra.tail ? extra.tail : ""}
      </section>`;
    }

      const leave = fullscreenActive();
      const target = document.documentElement;
      const ask = leave
        ? (document.exitFullscreen || document.webkitExitFullscreen)
        : (target.requestFullscreen || target.webkitRequestFullscreen);
      if (!ask) return;
      const pending = leave ? ask.call(document) : ask.call(target);
      if (pending && typeof pending.catch === "function") pending.catch(() => {});

      const extra = Number(wait) || 0;

    function fxLabHand(id) {
      const mana = `<div class="mana-dock"><div class="mana-read" aria-label="マナ残り 3"><b>3</b></div></div>`;
      if (id === "deal") {
        const cards = [0, 1, 2].map((i) => `<div class="card deal" style="--deal:${i};--fan:${(i - 1) * 8}deg;--drop:0px"><div class="pile-card back"></div></div>`).join("");
        return `${mana}<div class="hand fx-deal">${cards}</div>`;
      }
      const names = ["アタック", "ブロック", "パリィ"];
      const cards = names.map((name, i) => {
        const base = cardDef(name);
        if (!base) return "";
        const card = { name, ...base };
        const fan = (i - 1) * 8;
        return `<button type="button" class="card ${cardKind(card)}" disabled style="--fan:${fan}deg;--drop:0px;--hand-z:${i + 1}">${cardFace(card, false)}</button>`;
      }).join("");
      return `${mana}<div class="hand">${cards}</div>`;
    }

    function fxLabPlayMarkup(arenaHtml, handHtml, shellCls) {
      const shake = shellCls.includes("shake") ? " shake" : "";
      const fatal = shellCls.includes("fatal") ? " fatal" : "";

    }

    function fxVictory() {
      const pose = heroItem().victory;
      const rain = Array.from({ length: 18 }, (_, i) => `<i style="left:${6 + (i * 5.2) % 92}%;animation-delay:${(i % 9) * 0.12}s;animation-duration:${(1.5 + (i % 5) * 0.18).toFixed(2)}s"></i>`).join("");
      const stars = Array.from({ length: 3 }, (_, i) => `<span class="fly-star" style="--i:${i};--n:3">★</span>`).join("");
      const winFoe = fxLabFoeImage(fxLabFoeName);

    }

    function fxStage(id) {
      let hero = {};
      let foe = {};
      let call = "";
      let cls = "";
      if (id === "guard") hero = { guard: true };
      else if (id === "break") hero = { hurt: true, n: 6, pow: hitPower(6), break: true };
      else if (id === "hurt") hero = { hurt: true, n: 6, pow: hitPower(6) };
      else if (id === "poison-tick") hero = { hurt: true, kind: "poison", n: 3, pow: hitPower(3) };
      else if (id === "poison-give") hero = { poisonApply: true };
      else if (id === "fatal") {
        hero = { hurt: true, fatal: true, n: 12, pow: hitPower(12) };
        foe = { fatal: true };
        call = `<div class="fatal-call" aria-hidden="true">You are Dead</div>`;
        cls = " fatal";
      }       else if (id === "heal") hero = { heal: true };
      else if (id === "shield") hero = { ward: true };
      else if (id === "parry") hero = { sparkGold: true };
      else if (id === "slash") foe = { slash: true, dirs: [0], hits: [6], pow: hitPower(6) };
      else if (id === "foe-break") foe = { slash: true, dirs: [0], hits: [6], pow: hitPower(6), break: true };
      else if (id === "slash-multi") foe = { slash: true, dirs: [0, 1, 2], hits: [4, 5, 8] };
      else if (id === "foe-poison") foe = { poison: true, hits: [3] };
      else if (id === "foe-poison-give") foe = { poison: true, stamp: true };
      else if (id === "arrive") foe = { arrive: true };
      else if (id === "anger") foe = { anger: true };
      else if (id === "floor") call = `<div class="turn-call floor-call" aria-hidden="true">${fadeSandwichMarkup("<b>3Ｆ</b>", { tag: "div" })}</div>`;
      else if (id === "encounter") call = `<div class="turn-call enemy encounter-call" aria-hidden="true"><b>敵が現れた!</b><span class="encounter-stars">★</span></div>`;
      else if (id === "encounter-strong") call = `<div class="turn-call enemy encounter-call" aria-hidden="true"><b>強敵が現れた!!</b><span class="encounter-stars">★★</span></div>`;
      else if (id === "encounter-boss") call = `<div class="turn-call enemy encounter-call" aria-hidden="true"><b>ボスが現れた!!!</b><span class="encounter-stars">★★★</span></div>`;
      else if (id === "start") call = `<div class="turn-call start" aria-hidden="true"><b>戦闘開始!!</b></div>`;
      else if (id === "turn-player") call = `<div class="turn-call player" aria-hidden="true"><b>自分のターン</b></div>`;
      else if (id === "turn-enemy") call = `<div class="turn-call enemy" aria-hidden="true"><b>敵のターン</b></div>`;
      else if (id === "resolve") call = `<div class="turn-call resolve" aria-hidden="true"><b>解決フェイズ</b></div>`;
      else if (id === "no-mana") {
        call = `<div class="turn-call player mana-call" aria-hidden="true"><b>マナが足りない</b></div>`;
        cls = " shake";
      }
      const handHtml = id === "victory" ? "" : fxLabHand(id);
      if (id === "victory") {
        return `<div class="fx-view" data-play="${fxLabTick}"><div class="battle-screen no-log fx-lab-play">${fxVictory()}</div></div>`;
      }
      const calls = call ? `<div class="stage-fx">${call}</div>` : "";
      const foeCard = id === "anger" ? `<div class="play-cards">${playFace(foeAngerCard(), false, false, true)}</div>` : "";
      const mid = `<div class="use-board"><div class="use-split"><div class="play-side mine use-half"></div><div class="play-side foe use-half">${foeCard}</div></div><button type="button" class="vs-mark${id === "end-ready" ? " spent" : ""}" aria-label="ターン終了">VS</button></div>`;
      const hitPop = hero.n ? playerHitPop(hero.n, hero.kind, hero.fatal, hero.n >= 9, hero.break ? 0.7 : 0) : "";
      const arenaHtml = `<div class="stage"><div class="enemy-field">${fxPlate(id)}<div class="duel-side ally"><div class="ally-piles">${pileMarkup("deck", 10)}${pileMarkup("discard", 2)}</div>${heroShoulder("", Boolean(hero.hurt), hero.pow || "0.35", hero.guard ? "hold" : "", Boolean(hero.fatal), hero.kind || "", false, Boolean(hero.poisonApply), Boolean(hero.heal), Boolean(hero.ward), Boolean(hero.sparkGold), hitPop)}</div><div class="duel-mid">${mid}</div><div class="duel-side foe">${fxFoe(foe)}${fxLabPiles(fxLabFoeDef().name)}</div>${calls}</div></div>`;
      return fxLabPlayMarkup(arenaHtml, handHtml, cls);
    }

    function placeFoePoisonWords() {
      root.querySelectorAll(".sprite.poison").forEach((sprite) => {
        const img = sprite.querySelector("img");
        const words = sprite.querySelectorAll(".hurt-word, .dmg-pop.poison");
        if (!img || !words.length) return;
        const place = () => {
          const box = sprite.getBoundingClientRect();
          const nw = img.naturalWidth;
          const nh = img.naturalHeight;
          if (!nw || !nh || box.width < 8 || box.height < 8) return;
          const painted = nh * Math.min(box.width / nw, box.height / nh);
          words.forEach((word) => {
            word.style.top = "auto";
            word.style.bottom = `${Math.round(painted)}px`;
          });
        };
        place();
        if (!img.complete) img.addEventListener("load", place, { once: true });
      });
    }

      if (screen !== "settings" || returnScreen !== "battle") return;
      draw(HAND_CAP - hand.length);
      const names = CARD_POOL.map(([name]) => name).filter((name) => cardDef(name));
      let i = 0;
      while (hand.length < HAND_CAP && names.length) {
        const name = names[i % names.length];
        i += 1;
        hand.push(keepCard({ name, ...cardDef(name) }));
      }
      log(`手札を${hand.length}枚にした（見た目確認）。`);
      screen = "battle";
      render();
    }

    function oddsTable(headers, rows) {
      const head = headers.map((cell) => `<th>${esc(cell)}</th>`).join("");
      const body = rows.map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("");
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function pct(rate) {
      return `${Math.round(Number(rate) * 1000) / 10}%`;
    }

    function pathFillLabel(id) {
      return (PATHS[id] && PATHS[id].name) || id;
    }

    function oddsChips(names) {
      return `<div class="odds-names">${names.map((name) => `<span>${esc(name)}</span>`).join("")}</div>`;
    }

    function rarityRows(cards) {
      const groups = new Map();
      for (const card of cards) {
        const stars = Math.max(1, Number(card.stars) || 1);
        const row = groups.get(stars) || { stars, names: [] };
        row.names.push(card.name);
        groups.set(stars, row);
      }
      const list = [...groups.values()];
      const total = list.reduce((sum, row) => sum + rarityWeight(row.stars) * row.names.length, 0) || 1;
      return list.sort((a, b) => a.stars - b.stars).map((row) => [
        "★".repeat(row.stars),
        String(rarityWeight(row.stars)),
        pct((rarityWeight(row.stars) * row.names.length) / total),
        row.names.join("、"),
      ]);
    }

    function rarityShareRows(cards) {
      const total = cards.reduce((sum, card) => sum + rarityWeight(card.stars), 0) || 1;
      return cards.map((card) => [
        card.name,
        "★".repeat(Math.max(1, Number(card.stars) || 1)),
        String(rarityWeight(card.stars)),
        pct(rarityWeight(card.stars) / total),
      ]);
    }

          spanRows.push([
            dungeon.name,
            `${span.from}〜${span.to}階（${size}枠）`,

            ${oddsTable(["★", "重み", "この表での割合", "カード"], rarityRows(blessCards.map((name) => {
              const def = COMMON[name] || WARRIOR[name] || {};
              return { name, stars: Number(def.stars) || 1 };
            })))}
          </section>
          <section class="odds-block">
            <h2>そのほか</h2>
            ${oddsTable(["出来事", "出るもの"], [
              ["遭遇", `物乞い ${pct(ENCOUNTER_BEGGAR)}　祝福 ${pct(1 - ENCOUNTER_BEGGAR)}`],
              ["探索", "装備を1つ。装備一覧から同じ確率"],
              ["修行", "カード3種から1枚。いちばん多いビルドを先に出す。足りなければ戦士のカード。レアリティの重み。もらったあと、未熟練の1枚が必要回数に達する"],
              ["お店", "カード2枚と装備2つ。カードはレアリティの重み。装備は装備一覧から同じ確率"],
            ])}
          </section>
          ${menuButton("タイトルへ", "title")}
        </div>`;
    }

    function cardGenreRank(card) {
      const kind = cardKind(card);
      const order = { attack: 0, block: 1, skill: 2, power: 3, foe: 4 };
      return order[kind] ?? 5;
    }

    function starterDeckCards() {
      const cards = [];
      for (const [name, count] of CARD_POOL) {
        const def = cardDef(name) || {};
        for (let i = 0; i < count; i += 1) {
          cards.push({ name, ...def });
        }
      }
      cards.sort((a, b) => {
        const ga = cardGenreRank(a);
        const gb = cardGenreRank(b);
        if (ga !== gb) return ga - gb;
        const ca = Number(a.cost) || 0;
        const cb = Number(b.cost) || 0;
        if (ca !== cb) return ca - cb;
        return a.name.localeCompare(b.name, "ja");
      });
      return cards;
    }

    function starterDeckMarkup() {
      return starterDeckCards().map((card) => `<button type="button" class="deck-card" data-card="${esc(card.name)}" aria-label="${esc(card.name)}"><div class="card preview ${cardKind(card)}">${cardFace(card, false)}</div></button>`).join("");
    }

    function starterDeckCount() {
      return CARD_POOL.reduce((sum, [, count]) => sum + count, 0);
    }

    function castByName(name) {
      const want = name === "女の戦士" ? "戦士" : name;
      return CAST.find((item) => item.name === want) || CAST[0];
    }

    function shownCastName() {
      return castHover || castLock || CAST[0].name;
    }

    function castGearButton(id) {
      const item = gearItem(id);
      if (!item) return "";
      return `<button type="button" class="gear-slot cast-gear-slot" data-cast-gear="${esc(id)}" aria-label="${esc(item.name)}"><span class="gear-frame"><img src="${esc(item.image || "")}" alt=""></span><span class="cast-gear-name">${esc(item.name)}</span></button>`;
    }

    function showCastGear(button) {
      const item = gearItem(button.dataset.castGear || "");
      const old = root.querySelector(".gear-effect.cast-pop");
      if (old) old.remove();
      if (!item) return;
      root.insertAdjacentHTML("beforeend", gearPopShell(item.slot || "sword", {
        item,
        name: item.name,
        image: item.image || "",
        rarity: gearRarityText(item),
        body: esc(gearSpecialText(item)),
      }).replace('class="gear-effect', 'class="gear-effect cast-pop'));
      const box = root.querySelector(".gear-effect.cast-pop");
      if (!box) return;
      box.style.left = "0px";
      box.style.top = "0px";
      placeAnchored(box, button, { gap: 12, pad: 8, fallbackW: 288, fallbackH: 120, align: "top" });
    }

    function hideCastGear() {
      const box = root.querySelector(".gear-effect.cast-pop");
      if (box) box.remove();
    }

    function bindCastGearHover() {
      root.querySelectorAll("[data-cast-gear]").forEach((button) => {
        if (button.dataset.hoverBound) return;
        button.dataset.hoverBound = "1";
        button.addEventListener("pointerenter", () => showCastGear(button));
        button.addEventListener("pointerleave", () => hideCastGear());
      });
    }

    function castBlurbParagraphs(text) {
      if (!text) return "";
      const parts = String(text).split(/。/).map((s) => s.trim()).filter(Boolean);
      if (!parts.length) return `<p class="cast-blurb">${esc(text)}</p>`;
      return parts.map((part) => `<p class="cast-blurb">${esc(part)}。</p>`).join("");
    }

    function castOnArtMarkup(item) {
      const blurb = item.blurb
        ? `<div class="cast-blurb-wrap">${castBlurbParagraphs(item.blurb)}</div>`
        : "";
      return `
        <div class="cast-on-stats">
          <p class="cast-stat-caption">初期ステータス</p>
          <div class="cast-stat-board cast-vitals" aria-label="初期ステータス">
            <div class="hp-line stat-hp"><span class="lbl">${heartIcon()}HP</span><span class="num"><b>30</b></span></div>
            <div class="hp-line stat-atk"><span class="lbl">${swordIcon()}ATK</span><span class="num"><b>0</b></span></div>
            <div class="hp-line stat-def"><span class="lbl">${shieldIcon()}DEF</span><span class="num"><b>0</b></span></div>
            <div class="hp-line stat-spd"><span class="lbl">${bootIcon()}SPD</span><span class="num"><b>${DRAW_PER_TURN}</b></span></div>
          </div>
        </div>
        <div class="cast-on-blurb">${blurb}</div>`;
    }

    function castMainMarkup(item) {
      return `
        <div class="cast-side">
          <div class="cast-plaque">
            <div class="cast-mid">
              <div class="cast-gear-col">
                <h2><span>初期装備</span></h2>
                <div class="cast-gear">
                  <p class="cast-blurb">なし</p>
                </div>
              </div>
            </div>
            <div class="cast-deck-block">
              <h2><span>初期デッキ</span></h2>
              <div class="cast-deck" aria-label="初期デッキ">${starterDeckMarkup()}</div>
            </div>
          </div>
        </div>
        <aside class="cast-keys" aria-label="キーワード">
          <section class="cast-key">
            <h2>パリィ</h2>
            <p class="lead">敵から受けるダメージを1度だけ無効にする。</p>
            <p>重複可。</p>
            <p>ターン終了時に消滅</p>
            <p>パリィ状態は、所持中のシールドをすべて破壊し、<br>追加でシールドを得ることはできない。</p>
            <p class="tail">パリィのタイミングを見極めた戦士にシールドは不要だ。</p>
          </section>
        </aside>`;
    }

    function challengeReady() {
      const lockedItem = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock);
      return Boolean(castLock) && lockedItem && dungeonOpen(lockedItem.floors);
    }

    function paintChallengeStart() {
      const start = root.querySelector('[data-action="dungeon-enter"]');
      if (!start) return;
      start.hidden = false;
      start.disabled = !challengeReady();
    }

    function paintCast() {
      const name = shownCastName();
      if (name !== castShown) {
        castShown = name;
        const item = castByName(name);
        const hero = root.querySelector(".cast-hero-slot");
        const board = root.querySelector(".cast-board");
        if (hero) hero.innerHTML = `<button type="button" class="cast-hero-frame" data-action="cast-token" data-cast="${esc(item.name)}" aria-label="${esc(item.name)}"><img class="cast-hero-art" src="${item.action}" alt="${esc(item.name)}の一枚絵">${castOnArtMarkup(item)}</button>`;
        if (board) board.innerHTML = castMainMarkup(item);
      }
      const jobPick = root.querySelector(".cast-screen.character-focus");
      root.querySelectorAll("[data-cast]").forEach((token) => {
        const picked = token.dataset.cast === castLock;
        token.classList.toggle("locked", jobPick ? castLit && picked : picked);
        token.classList.toggle("shown", token.dataset.cast === name);
      });
      paintChallengeStart();
      const decide = root.querySelector('[data-action="open-dungeon"]');
      if (decide) decide.classList.toggle("lit", castLit);
      bindDeckHover();
      bindCastGearHover();
    }

    function showCastCard(button, enlarge = false) {
      const name = button.dataset.card || "";
      const old = root.querySelector(".cast-card-pop");
      if (old && old.dataset.card === name) return;
      if (old) old.remove();
      const def = cardDef(name);
      if (!def) return;
      const card = { name, ...def };
      const pop = document.createElement("div");
      pop.className = `cast-card-pop${enlarge ? " cast-card-pop--enlarge" : ""}`;
      pop.dataset.card = name;
      pop.innerHTML = `<div class="card preview ${cardKind(card)}">${cardFace(card, false)}</div>`;
      root.appendChild(pop);
      if (enlarge) return;
      placeAnchored(pop, button, { gap: 12, pad: 8, fallbackW: 440, fallbackH: 520 });
    }

    function hideCastCardPop() {
      const pop = root.querySelector(".cast-card-pop");
      if (pop) pop.remove();
    }

    function bindDeckHover() {
      const deck = root.querySelector(".cast-deck");
      if (!deck) return;
      if (deck.dataset.deckBound === "1") return;
      deck.dataset.deckBound = "1";
      const focus = deck.closest(".cast-screen.character-focus");
      if (focus) {
        if (!root.dataset.castDeckDismissBound) {
          root.dataset.castDeckDismissBound = "1";
          root.addEventListener("click", (event) => {
            const pop = root.querySelector(".cast-card-pop");
            if (!pop) return;
            const el = event.target;
            if (el instanceof Element && (el.closest(".cast-card-pop") || el.closest(".cast-deck .deck-card"))) return;
            hideCastCardPop();
          });
        }
        deck.addEventListener("click", (event) => {
          const button = event.target instanceof Element ? event.target.closest(".deck-card") : null;
          if (!button || !deck.contains(button)) return;
          event.stopPropagation();
          const pop = root.querySelector(".cast-card-pop");
          if (pop && pop.dataset.card === (button.dataset.card || "")) {
            hideCastCardPop();
            return;
          }
          showCastCard(button, true);
        });
        return;
      }
      deck.addEventListener("pointerover", (event) => {
        const button = event.target instanceof Element ? event.target.closest(".deck-card") : null;
        if (!button || !deck.contains(button)) return;
        showCastCard(button);
      });
      deck.addEventListener("pointerleave", () => hideCastCardPop());
    }

    function bindCastHover() {
      root.querySelectorAll("[data-cast]").forEach((token) => {
        token.addEventListener("pointerenter", () => {
          const next = token.dataset.cast || "";
          if (castHover === next) return;
          castHover = next;
          paintCast();
        });
        token.addEventListener("pointerleave", () => {
          if (castHover !== token.dataset.cast) return;
          castHover = "";
          paintCast();
        });
      });
    }

    function dungeonArt(name) {
      const item = DUNGEON_LIST.find((dungeon) => dungeon.name === name);
      return item ? item.art : DUNGEON_LIST[0].art;
    }

    function renderDungeonGate() {
      const item = pendingDungeon || DUNGEON_LIST[0];
      const open = dungeonOpen(item.floors);
      root.innerHTML = `
        <div class="dungeon-gate">
          <button type="button" class="cast-back" data-action="dungeon-list">もどる</button>
          <img class="dungeon-cover" src="${item.art}" alt="${esc(item.name)}">
          <h1 class="dungeon-gate-name">${esc(item.label || item.name)}</h1>
          ${open
            ? `<button type="button" class="primary dungeon-enter" data-action="dungeon-enter">このダンジョンに入る</button>`
            : `<p class="dungeon-gate-lock">鎖がかかっている</p>`}
        </div>`;
    }

    function shownDungeonName() {
      return dungeonHover || dungeonView || dungeonLock;
    }

    function dungeonChainHtml(count) {
      const n = Math.max(0, Math.min(2, Number(count) || 0));
      if (n <= 0) return "";
      const src = n >= 2 ? "chain-lock.png?v=1" : "chain-one.png?v=3";
      const one = n >= 2 ? "" : " one";
      return `<div class="chain-wrap" aria-hidden="true"><img class="chain-art${one}" src="${src}" alt=""></div>`;
    }

    function paintDungeon() {
      const name = shownDungeonName();
      const fallback = DUNGEON_LIST.find((dungeon) => dungeonOpen(dungeon.floors)) || DUNGEON_LIST[0];
      const shown = DUNGEON_LIST.find((dungeon) => dungeon.name === name) || fallback;
      const previewImg = root.querySelector(".dungeon-preview img");
      const caption = root.querySelector(".dungeon-caption");
      if (previewImg) {
        if (shown) {
          previewImg.hidden = false;
          previewImg.src = shown.art;
          previewImg.alt = shown.name;
        } else {
          previewImg.hidden = true;
          previewImg.removeAttribute("src");
          previewImg.alt = "";
        }
      }
      if (caption) {
        caption.hidden = !shown;
        const nameEl = caption.querySelector(".preview-name");
        const rankEl = caption.querySelector(".preview-rank");
        const floorEl = caption.querySelector(".preview-floor");
        if (shown) {
          if (nameEl) nameEl.textContent = shown.name;
          if (rankEl) rankEl.textContent = shown.rank || "";
          if (floorEl) floorEl.textContent = `最大${shown.label}階`;
        }
      }
      root.querySelectorAll(".dungeon-col").forEach((col) => {
        const active = Boolean(name) && col.dataset.dungeon === name;
        col.classList.toggle("active", active);
        col.setAttribute("aria-pressed", active && col.dataset.dungeon === dungeonLock ? "true" : "false");
      });
      const slot = root.querySelector(".dungeon-clear-slot");
      if (slot) slot.innerHTML = shown ? dungeonClearFaces(shown.floors) : "";
      paintChallengeStart();
      const start = root.querySelector('[data-action="dungeon-enter"]');
      if (start) start.classList.toggle("lit", dungeonLit && !start.disabled);
    }

    function bindDungeonHover() {
      root.querySelectorAll(".dungeon-col").forEach((col) => {
        if (col.dataset.open !== "1") return;
        col.addEventListener("pointerenter", () => {
          const next = col.dataset.dungeon || "";
          if (dungeonHover === next) return;
          dungeonHover = next;
          paintDungeon();
        });
        col.addEventListener("pointerleave", () => {
          if (dungeonHover !== col.dataset.dungeon) return;
          dungeonHover = "";
          paintDungeon();
        });
      });
    }

    function renderCharacter() {
      const tokens = CAST.map((item) => `
        <button type="button" class="cast-token mini" data-action="cast-token" data-cast="${esc(item.name)}" aria-label="${esc(item.name)}">
          <img src="${item.chibi}" alt="">
          <span>${esc(item.name)}</span>
        </button>`).join("");
      castShown = "";
      castLit = false;
      const jobTitle = fadeSandwichMarkup(`<span class="cast-title-name">挑戦するキャラを選んでください</span>`, { tag: "h1", className: "cast-title" });
      root.innerHTML = `
        <div class="cast-screen character-focus">
          ${jobTitle}
          <div class="cast-play">
            <div class="cast-unit">
              <div class="cast-stage"><div class="cast-hero-slot"></div></div>
              <div class="cast-roster many">${tokens}</div>
            </div>
            <div class="cast-actions">
              <button type="button" class="cast-back" data-action="title">タイトルへ</button>
              <button type="button" class="cast-start" data-action="open-dungeon">このキャラに決めた！</button>
            </div>
          </div>
          <div class="cast-board"></div>
        </div>`;
      paintCast();
      bindCastHover();
    }

    function foeStarterCards(foe) {
      return (foe.pattern || []).map((card) => applyEnemyHidden(card, foe)).filter((card) => card && card.name);
    }

    function foeBaseAtk(foe) {
      if (foe && foe.atkHidden != null) return Number(foe.atkHidden) || 0;
      return HIDDEN_ATK[(foe && foe.rank) || "雑魚"] || 0;
    }

    function foeBaseDef(foe) {
      if (foe && foe.defHidden != null) return Number(foe.defHidden) || 0;
      return HIDDEN_DEF[(foe && foe.rank) || "雑魚"] || 0;
    }

    function foeFeatureLines(foe) {
      if (foe.trait) {
        return String(foe.trait).split("。").map((part) => part.trim()).filter(Boolean).map((part) => `${part}。`);
      }
      const seen = new Set();
      const lines = [];
      (foe.pattern || []).forEach((raw) => {
        if (!raw || raw.name === "アタック" || raw.name === "ブロック" || seen.has(raw.name)) return;
        seen.add(raw.name);
        const card = applyEnemyHidden(raw, foe);
        const text = String(card.text || "").replace(/\n/g, " ").trim();
        lines.push(text ? `${card.name}。${text}${/[。！？]$/u.test(text) ? "" : "。"}` : `${card.name}。`);
      });
      return lines;
    }

    function foeStarterStats(foe) {
      const rows = [
        ["HP", heartIcon(), foe.hp || 0],
        ["ATK", swordIcon(), foeBaseAtk(foe)],
        ["DEF", shieldIcon(), foeBaseDef(foe)],
        ["SPD", bootIcon(), Number(foe.spd) || 1],
      ];
      return `<div class="foe-starter-stats" aria-label="ステータス">${rows.map(([label, icon, value]) => `<p class="hp-line"><span class="lbl">${icon}${label}</span><span class="num"><b>${value}</b></span></p>`).join("")}</div>`;
    }

    function foeStarterDeckMarkup(cards) {
      return sortedCards(cards).map((card, i) => `<button type="button" class="deck-card" data-deck-i="${i}" data-card="${esc(card.name)}" aria-label="${esc(card.name)}"><div class="card preview ${cardKind(card)}">${cardFace(card, false)}</div></button>`).join("");
    }

    function showFoeStarterCard(button) {
      const key = button.dataset.deckI || "";
      const old = root.querySelector(".cast-card-pop");
      if (old && old.dataset.deckI === key) {
        hideCastCardPop();
        return;
      }
      if (old) old.remove();
      const face = button.querySelector(".card");
      if (!face) return;
      const pop = document.createElement("div");
      pop.className = "cast-card-pop cast-card-pop--enlarge";
      pop.dataset.deckI = key;
      pop.dataset.card = button.dataset.card || "";
      pop.appendChild(face.cloneNode(true));
      root.appendChild(pop);
    }

    function bindFoeStarterDeck(deck) {
      if (!deck || deck.dataset.deckBound === "1") return;
      deck.dataset.deckBound = "1";
      deck.addEventListener("click", (event) => {
        const button = event.target instanceof Element ? event.target.closest(".deck-card") : null;
        if (!button || !deck.contains(button)) return;
        event.stopPropagation();
        showFoeStarterCard(button);
      });
      if (!root.dataset.foeDeckDismissBound) {
        root.dataset.foeDeckDismissBound = "1";
        root.addEventListener("click", (event) => {
          if (!root.querySelector(".foe-starter")) return;
          const pop = root.querySelector(".cast-card-pop");
          if (!pop) return;
          const el = event.target;
          if (el instanceof Element && (el.closest(".cast-card-pop") || el.closest(".foe-starter .deck-card"))) return;
          hideCastCardPop();
        });
      }
    }

    function closeFoeStarter() {
      hideCastCardPop();
      const pop = root.querySelector(".foe-starter");
      if (pop) pop.remove();
    }

    function openFoeStarter(name) {
      const foe = ENEMIES.find((enemy) => enemy.name === name);
      if (!foe) return;
      closeFoeStarter();
      const boss = foe.name === DUNGEON.boss;
      const mark = boss ? "ボス" : "★".repeat(enemyStar(foe));
      const lines = foeFeatureLines(foe);
      const feature = lines.length
        ? `<div class="foe-starter-blurb">${lines.map((line) => `<p>${esc(line)}</p>`).join("")}</div>`
        : `<div class="foe-starter-blurb"><p>なし</p></div>`;
      const cards = foeStarterCards(foe);
      const portrait = foe.image ? `<img src="${esc(foe.image)}" alt="">` : `<span class="foe-blank" aria-hidden="true"></span>`;
      root.insertAdjacentHTML("beforeend", `<div class="overlay deck-view foe-starter"><div class="panel"><div class="foe-starter-sheet"><div class="foe-starter-portrait">${portrait}</div><div class="foe-starter-info"><div class="foe-starter-id"><p class="foe-starter-rank${boss ? " boss" : ""}">${mark}</p><h2 class="foe-starter-name">${esc(foe.name)}</h2></div><section class="foe-starter-block"><h3>特徴</h3>${feature}</section><section class="foe-starter-block"><h3>ステータス</h3>${foeStarterStats(foe)}</section></div><section class="foe-starter-block foe-starter-deck"><h3>初期デッキ</h3><div class="cast-deck" aria-label="初期デッキ">${foeStarterDeckMarkup(cards)}</div></section></div><button type="button" data-action="close-foe-starter">閉じる</button></div></div>`);
      bindFoeStarterDeck(root.querySelector(".foe-starter .cast-deck"));
    }

    function dungeonEnemyFaces() {
      return ["スライム", "ゴブリン", "トロール", "ちびドラゴン", "ミノタウロス", "ハデス"].map((name) => {
        const foe = ENEMIES.find((enemy) => enemy.name === name);
        if (!foe) return "";
        const boss = name === DUNGEON.boss;
        const mark = boss ? "ボス" : "★".repeat(enemyStar(foe));
        const face = foe.image ? `<img src="${esc(foe.image)}" alt="">` : `<span class="foe-blank" aria-hidden="true"></span>`;
        return `<button type="button" class="dungeon-foe" data-action="foe-starter" data-foe="${esc(name)}" aria-label="${esc(name)}の初期デッキ">${face}<span class="dungeon-foe-name">${esc(name)}</span><span class="dungeon-foe-rank${boss ? " boss" : ""}">${mark}</span></button>`;
      }).join("");
    }

    function dungeonClearFaces(floors) {
      const names = clearNames(floors);
      if (!names.length) return `<div class="dungeon-blurb-wrap"><p class="dungeon-blurb">踏破したキャラは、まだいません。</p></div>`;
      return `<div class="dungeon-clears">${names.map((name) => {
        const who = castByName(name);
        return `<figure><img src="${esc(who.chibi)}" alt=""><figcaption>${esc(who.name)}</figcaption></figure>`;
      }).join("")}</div>`;
    }

    function renderDungeon() {
      const columns = DUNGEON_LIST.map((item) => {
        const chains = dungeonChainCount(item.floors);
        const sealed = chains > 0;
        return `
        <button type="button" class="dungeon-col${sealed ? " sealed" : ""}" data-action="dungeon-token" data-dungeon="${esc(item.name)}" data-open="${sealed ? "0" : "1"}"${sealed ? " disabled" : ""} aria-label="${esc(item.name)}${sealed ? "（鎖）" : ""}">
          <span class="dungeon-shot">
            <img src="${item.art}" alt="">
            ${dungeonChainHtml(chains)}
          </span>
          <span class="dungeon-facts" aria-hidden="true"><span class="dungeon-name-big">${esc(item.name)}</span></span>
        </button>`;
      }).join("");
      dungeonLit = false;
      const dungeonTitle = fadeSandwichMarkup(`<span class="cast-title-name">ダンジョンを選択してください</span>`, { tag: "h1", className: "cast-title" });
      root.innerHTML = `
        <div class="cast-screen dungeon-screen">
          ${dungeonTitle}
          <div class="dungeon-play">
            <div class="dungeon-stage">

    function starterAlbumCards() {
      return CARD_POOL.map(([name, copies]) => {
        const data = cardDef(name) || {};
        return { name, klass: "初期デッキ", stars: data.stars || 1, deckCopies: copies, ...data };
      });
    }

    function albumCatalog() {
      const list = [];
      const seen = new Set();
      const push = (name, data, klass) => {
        if (!name || seen.has(name)) return;
        seen.add(name);
        list.push({ name, klass, ...data, stars: data.unrated ? 0 : (data.stars || 1) });
      };
      for (const [name, data] of Object.entries(CARDS)) push(name, data, "基本");
      for (const [name, data] of Object.entries(WARRIOR)) push(name, data, "戦士");
      for (const [name, data] of Object.entries(COMMON)) push(name, data, "共通");
      for (const foe of ENEMIES) {
        for (const card of foe.pattern || []) {
          const name = card && card.name;
          if (!name || seen.has(name)) continue;
          if (name === "アタック" || name === "ブロック") continue;
          if (CARDS[name] || WARRIOR[name] || COMMON[name]) continue;
          const base = CARDS[name] || WARRIOR[name] || COMMON[name] || {};
          push(name, { ...base, ...card }, "敵");
        }
      }
      for (const [name, data] of Object.entries(FOE_ONLY)) push(name, data, "敵");
      return list;
    }

    // 効果欄はカードごと。余白は固定。そのカードの中では説明と数字を同じ大きさ、アイコンも同じ大きさ（文字より大きい）にする。
    function fitCardEffects() {
      root.querySelectorAll(".card-fit .text").forEach((box) => {
        if (box.clientHeight < 8) return;
        const texts = box.querySelectorAll(".fx.note, .fx.kw, .fx b");
        const icons = box.querySelectorAll(".fx .ico");
        const apply = (scale) => {
          const font = `${(5.2 * scale).toFixed(2)}cqw`;
          texts.forEach((el) => { el.style.fontSize = font; });
          const icon = `${(11.5 * scale).toFixed(2)}cqw`;
          icons.forEach((el) => {
            el.style.width = icon;
            el.style.height = icon;
          });
        };
        const overflows = () => box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1;
        let lo = 0.68;
        let hi = 1.65;
        apply(lo);
        if (overflows()) return;
        for (let n = 0; n < 8; n++) {
          const mid = (lo + hi) / 2;
          apply(mid);
          if (overflows()) hi = mid;
          else lo = mid;
        }
        apply(lo);
      });
    }

    function fitCardNames() {
      root.querySelectorAll(".card .name").forEach((name) => {
        if (name.clientWidth < 8) return;
        let size = 7.4;
        name.style.fontSize = size + "cqw";
        let guard = 0;
        while (name.scrollWidth > name.clientWidth + 1 && size > 4.4 && guard < 16) {
          size = Math.round((size - 0.25) * 100) / 100;
          name.style.fontSize = size + "cqw";
          guard += 1;
        }
      });
    }

    function pileMarkup(kind, count, overlay) {
      const label = kind === "deck" ? "山札" : "捨て札";

      const look = empty ? "empty" : kind === "deck" ? "back" : "back discard";
      return `<div class="pile" data-pile="${kind}" aria-label="${label} ${count}">${overlay || ""}<div class="pile-card ${look}${stack}"><span class="pile-count">${count}</span></div><div class="pile-label">${label}</div></div>`;
    }

    function cardKind(card) {
      if (!card) return "skill";
      if (card.kind === "foe") return "foe";
      if (card.kind === "power" || card.power) return "power";
      if (card.kind === "attack" || card.kind === "block" || card.kind === "skill") return card.kind;
      if (card.parry) return "block";
      if (card.focus) return "skill";
      if (card.press) return "attack";
      if (card.poison) return "skill";
      if (card.damage && !card.block) return "attack";
      if (card.block && !card.damage) return "block";
      return "skill";
    }

    function genreName(kind) {
      return ({
        attack: "攻撃",

    const CARD_STYLE = [

      ["style-yellow", "スキル", "frame-metal-yellow.png?v=7"],

      ["style-star2", "★★", "frame-spike-silver.png?v=5"],
      ["style-star3", "★★★", "frame-spike-gold.png?v=5"],

    function costOrbs(cost) {
      const n = Math.max(0, Math.floor(Number(cost) || 0));
