          ${menuButton("もどる", "title")}
        </div>`;
    }

    function renderFloor() {
      const jobs = floorPhase === "job"
        ? jobCandidates().map((name) => `<button type="button" class="primary" data-action="job-pick" data-job="${esc(name)}">${esc(name)}</button>`).join("")
        : "";
      const ultimates = floorPhase === "ultimate"
        ? ultimatePicks.map((pair) => `<button type="button" class="primary" data-action="ultimate-pick" data-ultimate="${esc(pair)}">${esc(ultimateLabel(pair))}</button>`).join("")
        : "";
      const next = floorPhase === "show" ? menuButton(floorKind === "物乞いに遭遇" && !beggarCut ? "外さずに進む" : "進む", "floor-next", true) : "";
      const beggar = floorKind === "物乞いに遭遇"
        ? `<div class="deck-cards beggar-cards">${runDeck().map((card, i) => {
          const face = `<div class="card preview ${cardKind(card)}">${cardFace(card, false)}</div>`;
          if (beggarCut) return face;
          return `<button type="button" class="beggar-card" data-action="beggar-drop" data-index="${i}">${face}</button>`;
        }).join("") || `<p>外せるカードは無い。</p>`}</div>`
        : "";
      const art = floorKind === "挑戦者に祝福を"
        ? `<img class="bless-art" src="blessing-goddess.jpg?v=1" alt="荘厳な女神が、ひざまずく戦士に祝福を授けている">`
        : "";
      const bless = floorPhase === "bless"
        ? `<div class="gift-row">${blessPicks.map((pick, i) => `<button type="button" class="gift-btn" data-action="bless-pick" data-bless="${i}"><span class="gift-label">${esc(pick.label)}</span>${giftMarkup(pick, false)}</button>`).join("")}</div>`
        : "";
      const gift = floorPhase === "show" ? giftMarkup(floorGift, true) : "";
      if (floorKind === "お店" && floorPhase === "show") {
        root.innerHTML = `
          <div class="menu shop-floor">
            <p>${esc(dungeonName)}　${floorLabel()}</p>
            <div class="shop-panel">${shopMarkup(shopStock, "お店")}</div>
            <p>${esc(floorNote)}</p>
            ${next}
          </div>`;
        return;
      }
      root.innerHTML = `
        <div class="menu${floorKind === "物乞いに遭遇" ? " beggar" : ""}${floorKind === "挑戦者に祝福を" ? " bless" : ""}">
          <h1>${esc(floorKind)}</h1>
          <p>${esc(dungeonName)}　${floorLabel()}</p>
          ${art}
          ${gift}
          <p>${esc(floorNote)}</p>
          ${bless}
          ${beggar}
          ${jobs}
          ${ultimates}
          ${next}
        </div>`;
    }

    function renderClear() {
      root.innerHTML = `
        <div class="menu">
          <h1>踏破</h1>
          <p>${esc(dungeonName)}を抜けた。解放が進んだ。★${meta.stars}は残っている。</p>
          <p>次の攻略も、初期デッキから。</p>
          ${menuButton("カードリスト", "album")}
          ${menuButton("キャラクター選択へ", "character", true)}
        </div>`;
    }

    function hideLogPeek() {
      const peek = document.querySelector(".log-peek");
      if (peek) peek.hidden = true;
    }

    function bindLogPeek() {
      const host = document.querySelector(".battle-log");
      if (!host) return;
      let peek = document.querySelector(".log-peek");
      if (!peek) {
        peek = document.createElement("div");
        peek.className = "log-peek";
        peek.hidden = true;
        document.body.appendChild(peek);
      }
      host.querySelectorAll("[data-log]").forEach((line) => {
        line.addEventListener("pointerenter", () => {
          const card = logLines[Number(line.dataset.log)] && logLines[Number(line.dataset.log)].card;
          if (!card) return;
          const tone = line.dataset.foe === "1" ? "foe" : cardKind(card);
          peek.innerHTML = `<div class="card preview ${tone}">${cardFace(card, false)}</div>`;
          const rect = line.getBoundingClientRect();
          const width = 148;
          const height = Math.round(width * 300 / 204);
          peek.hidden = false;
          peek.style.left = `${Math.max(8, rect.left - width - 12)}px`;
          peek.style.top = `${Math.max(8, Math.min(window.innerHeight - height - 8, rect.top + rect.height / 2 - height / 2))}px`;
        });
        line.addEventListener("pointerleave", () => {
          peek.hidden = true;
        });
      });
    }

    function render() {
      hideLogPeek();
      if (screen === "title") return renderTitle();
      if (screen === "character") return renderCharacter();
      if (screen === "dungeon") return renderDungeon();
      if (screen === "dungeon-gate") return renderDungeonGate();
      if (screen === "album") return renderAlbum();
      if (screen === "sheet") return renderSheet();
      if (screen === "defeat") return renderDefeat();
      if (screen === "settings") return renderSettings();
      if (screen === "confirm") return renderConfirm();
      if (screen === "clear") return renderClear();
      if (screen === "floor") {
        renderFloor();
        paintGearOffer();
        return;
      }
      renderBattle();
      paintGearOffer();
    }

    function pileMarkup(kind, count) {
      const label = kind === "deck" ? "山札" : "捨て札";
      const empty = count === 0;
      const stack = count > 1 ? " stack" : "";
      const look = empty ? "empty" : kind === "deck" ? "back" : "back discard";
      return `<div class="pile" data-pile="${kind}" aria-label="${label} ${count}"><div class="pile-card ${look}${stack}"><span class="pile-count">${count}</span></div><div class="pile-label">${label}</div></div>`;
    }

    function cardKind(card) {
      if (!card) return "skill";
      if (card.kind === "power" || card.power) return "power";
      if (card.kind === "attack" || card.kind === "block" || card.kind === "skill") return card.kind;
      if (card.parry) return "block";
      if (card.focus) return "skill";
      if (card.press) return "attack";
      if (card.poison) return "skill";
      if (card.damage && !card.block) return "attack";
      if (card.block && !card.damage) return "block";
      return "skill";
    }

    function genreName(kind) {
      return ({
        attack: "攻撃",
        block: "防御",
        skill: "技",
        power: "パワー",
        foe: "敵",
      })[kind] || "技";
    }

    // 設定資料用：絵柄の無い空の枠を、色（分類）ごとに1枚ずつ
    const BLANK_FRAMES = [
      { kind: "attack", label: "攻撃（赤）" },
      { kind: "block", label: "防御（青）" },
      { kind: "skill", label: "技（黄）" },
      { kind: "power", label: "パワー（緑）" },
      { kind: "foe", label: "敵のカード（紫）" },
    ];
    function blankCardSheet() {
      return BLANK_FRAMES.map((frame) => {
        const face = cardFace(
          { name: "カード名", cost: "0", text: "効果", kind: frame.kind === "foe" ? "skill" : frame.kind },
          false,
          frame.kind === "foe"
        );
        return `<figure><div class="card preview blank ${frame.kind}">${face}</div><figcaption>${esc(frame.label)}</figcaption></figure>`;
      }).join("");
    }

    function costOrbs(cost) {
      const n = Math.max(0, Math.floor(Number(cost) || 0));
      if (!n) return "";
      return `<span class="cost" aria-label="コスト ${n}">${n}</span>`;
    }

    function printedDamage(card) {
      if (!card) return 0;
      if (card.name === "アタック" || card.name === "アタック+") return CARDS.アタック.damage || 3; // 旧名互換
      return Number(card.damage) || 0;
    }

    function printedBlock(card) {
      if (!card) return 0;
      if (card.name === "ブロック" || card.name === "ブロック+") return CARDS.ブロック.block || 3;
      return Number(card.block) || 0;
    }

    function usesStrike(card) {
      return !!(card && (card.damage || card.press || card.redTimes || card.counter || card.finisher || card.hits));
    }

    function usesFocus(card) {
      return !!(card && (card.damage || card.block || card.press || card.redTimes || card.hits || card.finisher));
    }

    function focusLeftFor(card, fromHand) {
      if (!player || !player.focus || !usesFocus(card)) return 0;
      const before = fromHand ? (inPlay || []) : (inPlay || []).slice(0, Math.max(0, inPlay.indexOf(card)));
      if (before.some(usesFocus)) return 0;
      return player.focus;
    }

    function expectedHits(card, fromHand, foe) {
      if (!card || !usesStrike(card)) return null;
      const atk = foe ? 0 : (player && player.atk) || 0;
      const focus = foe ? 0 : focusLeftFor(card, fromHand);
      if (card.press) return [Math.max(0, (player && player.block) || 0)];
      if (card.finisher) return [parryCount(player) * 15];
      if (card.counter) {
        const reds = (inPlay || []).filter((item) => cardKind(item) === "attack").length;
        return reds ? null : [card.counter];
      }
      if (card.redTimes) {
        const mine = fromHand ? 1 : 0;
        const reds = (inPlay || []).filter((item) => cardKind(item) === "attack").length + mine;
        return [Math.max(0, reds * card.redTimes + atk + focus)];
      }
      if (card.hits) {
        const hits = [];
        for (let n = 0; n < card.hits; n++) hits.push(Math.max(0, printedDamage(card) + atk + (n === 0 ? focus : 0)));
        return hits;
      }
      if (card.damage) {
        let bonus = 0;
        if (!foe) {
          if (card.fullBonus && player && player.hp >= player.maxHp) bonus += card.fullBonus;
          if (card.safeBonus && player && !player.hurtLast) bonus += card.safeBonus;
          if (card.kick && enemy && enemy.block > 0) bonus += card.kick;
        } else if (card.kick && player && player.block > 0) bonus += card.kick;
        const base = foe ? (Number(card.damage) || 0) : printedDamage(card);
        return [Math.max(0, base + atk + focus + bonus)];
      }
      return null;
    }

    function expectedDamageLabel(card, fromHand, foe) {
      const hits = expectedHits(card, fromHand, foe);
      if (!hits || !hits.length) return "";
      if (hits.length === 1) return String(hits[0]);
      if (hits.every((n) => n === hits[0])) return `${hits[0]}×${hits.length}`;
      return hits.join("+");
    }

    function cardFace(card, live, foe) {
      const shown = printedDamage(card);
      const shownBlock = printedBlock(card);
      let noteText = esc(card.text).replaceAll("\n", "<br>");
      if (card.parry && card.note) noteText = noteText.replaceAll("パリィ", `<span class="hint">パリィ<i>${esc(card.note)}</i></span>`);
      if (card.poison) noteText = noteText.replaceAll("毒", `<span class="hint">毒<i>${esc(POISON_NOTE)}</i></span>`);
      if (card.burn) noteText = noteText.replaceAll("炎上", `<span class="hint">炎上<i>${esc(BURN_NOTE)}</i></span>`);
      if (card.instant) noteText = noteText.replaceAll("インスタント", `<span class="hint">インスタント<i>${esc(INSTANT_NOTE)}</i></span>`);
      if (card.quick) noteText = noteText.replaceAll("クイック", `<span class="hint">クイック<i>${esc(QUICK_NOTE)}</i></span>`);
      const icons = [
        card.damage ? `<span class="fx attack">${swordIcon()}<b>${shown}</b></span>` : "",
        card.block ? `<span class="fx block">${shieldIcon()}<b>${shownBlock}</b></span>` : "",
        card.heal ? `<span class="fx heal">${heartIcon()}<b>${card.heal}</b></span>` : "",
      ].join("");
      const extra = card.expose || card.fullBonus || card.safeBonus || card.kick || card.headbutt || card.finisher || card.poise || card.guardBreak || card.hits || card.instant || card.quick || card.burn || (card.parry && card.damage);
      const effects = icons && extra ? `${icons}<span class="fx note">${noteText}</span>` : icons || `<span class="fx note">${noteText}</span>`;
      const fromHand = !!(live && !foe && (!inPlay || !inPlay.includes(card)));
      const forecast = live ? expectedDamageLabel(card, fromHand, foe) : "";
      const forecastHtml = forecast ? `<span class="forecast" aria-label="予想ダメージ ${forecast}">${swordIcon()}<b>${esc(forecast)}</b></span>` : "";
      const stars = card.stars || 1;
      const picture = CARD_ART[card.name] ? `<img src="${CARD_ART[card.name]}" alt="">` : "";
      const rank = stars >= 3 ? "r3" : stars === 2 ? "r2" : "r1";
      const kind = foe ? "foe" : cardKind(card);
      const genre = `<span class="genre" aria-label="ジャンル ${genreName(kind)}">${genreName(kind)}</span>`;
      return `<div class="card-fit ${rank}${forecast ? " has-forecast" : ""}">${forecastHtml}<div class="nameplate">${costOrbs(card.cost)}<div class="name">${esc(card.name)}</div></div><div class="art" aria-hidden="true">${picture}${genre}</div><div class="text">${effects}</div><div class="rarity" aria-label="レアリティ ${stars}">${"★".repeat(stars)}</div><i class="frame" aria-hidden="true"></i></div>`;
    }

    function playFace(card, on, live, foe, recallIndex) {
      const tone = foe ? "foe" : cardKind(card);
      const recall = recallIndex != null && phase === "player" && !outcome;
      const attrs = recall ? ` data-unplay="${recallIndex}" class="play-card can-recall${on ? " on" : ""}"` : ` class="play-card${on ? " on" : ""}"`;
      const label = recall
        ? `${card.cost} ${esc(card.name)}。クリックで手札に戻す`
        : `${card.cost} ${esc(card.name)}`;
      return `<div${attrs}><div class="card preview ${tone}" aria-label="${label}">${cardFace(card, live, foe)}</div></div>`;
    }

    function playRow() {
      const foe = intentAt(0);
      const hot = phase === "resolve" ? resolveAt - 1 : -1;
      const mine = inPlay.map((card, i) => playFace(card, hot === i, true, false, i)).join("");
      const end = `<button type="button" class="end${phase === "player" && noPlayableHand() ? " ready" : ""}" data-end ${phase === "player" ? "" : "disabled"}>ターン<br>終了</button>`;
      return `<div class="play-row" aria-label="プレイエリア"><div class="play-side mine"><span class="play-label"><span>自分</span></span><div class="play-cards">${mine}</div></div>${end}<div class="play-side foe"><span class="play-label"><span>敵</span></span><div class="play-cards">${playFace(foe, hot === inPlay.length, true, true)}</div></div></div>`;
    }

    let heroImage = null;
    let heroImageTask = null;
    let heroLiveGen = 0;
    let heroLiveRaf = 0;

    let heroImageSrc = "";
    function ensureHeroImage() {
      if (heroImageSrc !== heroItem().battle) { heroImage = null; heroImageTask = null; heroImageSrc = heroItem().battle; }
      if (heroImage) return Promise.resolve(heroImage);
      if (!heroImageTask) {
        heroImageTask = new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => { heroImage = img; resolve(img); };
          img.onerror = () => reject(new Error("hero"));
          img.src = heroItem().battle;
        });
      }
      return heroImageTask;
    }

    function smooth01(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      return t * t * (3 - 2 * t);
    }

    function falloff(d) {
      if (d >= 1) return 0;
      const t = 1 - d;
      return t * t * (3 - 2 * t);
    }

    function heroShoulder(vitals, hurt, pow, guard, fatal) {
      const hit = hurt ? `<div class="hero-hit${fatal ? " fatal" : ""}" style="--pow:${pow}" aria-hidden="true"><span class="flash"></span><span class="cut a"></span><span class="cut b"></span><span class="cut c"></span><span class="spark"></span><span class="spark b"></span><span class="spark c"></span></div>` : "";
      const guardHtml = guard === "hold"
        ? `<div class="hero-guard" aria-label="ダメージなし">${guardMark()}</div>`
        : guard === "break"
          ? `<div class="hero-guard break" aria-hidden="true">${brokenShield()}</div>`
          : "";
      const who = heroItem();
      return `<div class="hero-shoulder${hurt ? " hurt" : ""}${fatal ? " fatal" : ""}"><div class="hero-body" style="aspect-ratio:${who.battleRatio}"><img class="hero-fig" src="${who.battle}" alt="${esc(who.name)}">${hit}${guardHtml}</div>${vitals}</div>`;
    }

    function startHeroIdle() {
      const canvas = document.querySelector(".hero-live");
      const gen = ++heroLiveGen;
      cancelAnimationFrame(heroLiveRaf);
      if (!canvas) return;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      ensureHeroImage().then((img) => {
        if (gen !== heroLiveGen || !canvas.isConnected) return;
        runHeroLive(canvas, img, gen, reduce);
      }).catch(() => {});
    }

    function runHeroLive(canvas, img, gen, reduce) {
      const ctx = canvas.getContext("2d", { alpha: true });
      let model = null;
      let frame = null;
      let last = 0;

      function rebuild() {
        const cssW = Math.max(1, canvas.clientWidth);
        const cssH = Math.max(1, canvas.clientHeight);
        let dpr = Math.min(window.devicePixelRatio || 1, 1.35);
        let cw = Math.round(cssW * dpr);
        let ch = Math.round(cssH * dpr);
        const cap = 680;
        if (cw > cap) {
          ch = Math.round(ch * cap / cw);
          cw = cap;
        }
        canvas.width = cw;
        canvas.height = ch;
        const scale = Math.min(cw / img.naturalWidth, ch / img.naturalHeight);
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        const left = 0;
        const top = ch - dh;
        ctx.imageSmoothingEnabled = true;
        ctx.clearRect(0, 0, cw, ch);
        ctx.drawImage(img, left, top, dw, dh);
        const snap = ctx.getImageData(0, 0, cw, ch);
        const straight = new Uint8ClampedArray(snap.data);
        const premul = new Uint8ClampedArray(straight);
        for (let i = 0; i < premul.length; i += 4) {
          const a = premul[i + 3] / 255;
          premul[i] *= a;
          premul[i + 1] *= a;
          premul[i + 2] *= a;
        }
        const pad = 20;
        const x0 = Math.max(0, Math.floor(left) - pad);
        const y0 = Math.max(0, Math.floor(top) - pad);
        const x1 = Math.min(cw, Math.ceil(left + dw) + pad);
        const y1 = Math.min(ch, Math.ceil(top + dh) + pad);
        const rw = Math.max(0, x1 - x0);
        const rh = Math.max(0, y1 - y0);
        const field = new Float32Array(rw * rh * 10);
        const breathAmp = dh * 0.016;
        for (let y = 0; y < rh; y++) {
          const v = (y0 + y - top) / dh;
          for (let x = 0; x < rw; x++) {
            const u = (x0 + x - left) / dw;
            const head = falloff(Math.hypot((u - 0.30) / 0.22, (v - 0.17) / 0.20));
            let chest = falloff(Math.hypot((u - 0.38) / 0.26, (v - 0.62) / 0.42));
            chest *= smooth01((u - 0.14) / 0.12) * smooth01((v - 0.30) / 0.10);
            let shield = falloff(Math.hypot((u - 0.15) / 0.18, (v - 0.68) / 0.34));
            shield *= smooth01((0.38 - u) / 0.12);
            const arm = smooth01((u - 0.60) / 0.12) * smooth01((v - 0.46) / 0.10) * smooth01((0.92 - v) / 0.10);
            const hair = head * smooth01((0.15 - v) / 0.10);
            const sumW = head + chest + shield + arm;
            if (sumW < 0.04 && hair < 0.04) continue;
            const p = (y * rw + x) * 10;
            field[p] = sumW;
            field[p + 1] = chest * breathAmp * (u - 0.38) * 0.55;
            field[p + 2] = chest * -breathAmp;
            field[p + 3] = head * -((v - 0.38) * dh);
            field[p + 4] = head * ((u - 0.30) * dw);
            field[p + 5] = shield * -((v - 0.68) * dh);
            field[p + 6] = shield * ((u - 0.15) * dw);
            field[p + 7] = arm * -((v - 0.79) * dh);
            field[p + 8] = arm * ((u - 0.88) * dw);
            field[p + 9] = hair;
          }
        }
        model = { cw, ch, straight, premul, field, x0, y0, rw, rh, cssW, cssH, hairAmp: dh * 0.022 };
        frame = ctx.createImageData(cw, ch);
      }

      function paint(now) {
        const dst = frame.data;
        const { cw, ch, straight, premul, field, x0, y0, rw, rh, hairAmp } = model;
        dst.set(straight);
        const t = now / 1000;
        const breath = Math.sin(t * 1.05);
        const hairS = Math.sin(t * 0.78 + 1.2);
        const headA = Math.sin(t * 0.4) * 0.012;
        const shieldA = Math.sin(t * 0.48 + 0.9) * 0.07;
        const armA = Math.sin(t * 0.55 + 2.0) * 0.09;
        for (let y = 0; y < rh; y++) {
          const cy = y0 + y;
          const row = y * rw;
          for (let x = 0; x < rw; x++) {
            const p = (row + x) * 10;
            const sumW = field[p];
            const hairW = field[p + 9];
            if (sumW < 0.04 && hairW < 0.04) continue;
            let dx = 0;
            let dy = 0;
            dx = breath * field[p + 1] + headA * field[p + 3] + shieldA * field[p + 5] + armA * field[p + 7];
            dy = breath * field[p + 2] + headA * field[p + 4] + shieldA * field[p + 6] + armA * field[p + 8];
            dx += hairS * hairAmp * hairW;
            dy += hairS * hairAmp * 0.22 * hairW;
            const sx = x0 + x - dx;
            const sy = cy - dy;
            const xi = sx | 0;
            const yi = sy | 0;
            const di = (cy * cw + x0 + x) * 4;
            if (xi < 0 || yi < 0 || xi + 1 >= cw || yi + 1 >= ch) {
              dst[di] = dst[di + 1] = dst[di + 2] = dst[di + 3] = 0;
              continue;
            }
            const tx = sx - xi;
            const ty = sy - yi;
            const ax = 1 - tx;
            const ay = 1 - ty;
            const i00 = (yi * cw + xi) * 4;
            const i10 = i00 + 4;
            const i01 = i00 + cw * 4;
            const i11 = i01 + 4;
            const w00 = ax * ay;
            const w10 = tx * ay;
            const w01 = ax * ty;
            const w11 = tx * ty;
            const a = premul[i00 + 3] * w00 + premul[i10 + 3] * w10 + premul[i01 + 3] * w01 + premul[i11 + 3] * w11;
            if (a < 1) {
              dst[di] = dst[di + 1] = dst[di + 2] = dst[di + 3] = 0;
              continue;
            }
            const inv = 255 / a;
            dst[di] = (premul[i00] * w00 + premul[i10] * w10 + premul[i01] * w01 + premul[i11] * w11) * inv;
            dst[di + 1] = (premul[i00 + 1] * w00 + premul[i10 + 1] * w10 + premul[i01 + 1] * w01 + premul[i11 + 1] * w11) * inv;
            dst[di + 2] = (premul[i00 + 2] * w00 + premul[i10 + 2] * w10 + premul[i01 + 2] * w01 + premul[i11 + 2] * w11) * inv;
            dst[di + 3] = a;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }

      function tick(now) {
        if (gen !== heroLiveGen || !canvas.isConnected) return;
        if (canvas.clientWidth !== model.cssW || canvas.clientHeight !== model.cssH) rebuild();
        if (!document.hidden && now - last >= 64) {
          last = now;
          paint(now);
        }
        heroLiveRaf = requestAnimationFrame(tick);
      }

      rebuild();
      if (reduce) return;
      paint(performance.now());
      heroLiveRaf = requestAnimationFrame(tick);
    }
    function traitNote() {
      const trait = enemyNow().trait;
      if (!trait) return "";
      return `<aside class="trait-note"><span class="trait-label">特性</span><span>${esc(trait)}</span></aside>`;
    }

    function sortedCards(cards) {
      return cards.slice().sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name, "ja"));
    }

    function deckGroup(label, cards) {
      const faces = sortedCards(cards).map((card) =>
        `<div class="card preview ${cardKind(card)}" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div>`
      ).join("");
      const heading = label ? `${label} ${cards.length}` : `${cards.length}枚`;
      return `<section class="deck-group"><h3>${heading}</h3><div class="deck-cards">${faces || `<p class="deck-empty">なし</p>`}</div></section>`;
    }

    function deckOverlay() {
      if (!showDeck || outcome || askLeave) return "";
      const cards = openingDeck.length ? openingDeck : deck.concat(hand, inPlay, discard);
      return `<div class="overlay deck-view"><div class="panel"><h2>マイデッキ</h2><div class="deck-scroll">${deckGroup("", cards)}</div><button type="button" data-action="close-deck">閉じる</button></div></div>`;
    }

    // 敵の行動パターン（山札）。順番は見せず、中身だけ。
    function foeDeckCards() {
      const cards = sortedCards(sourcePattern());
      const faces = cards.map((card) => `<div class="card preview foe" aria-label="${card.cost} ${esc(card.name)}">${cardFace(card)}</div>`).join("");
      return `<div class="deck-cards">${faces || `<p class="deck-empty">なし</p>`}</div>`;
    }

    function foePileMarkup() {
      const count = sourcePattern().length;
      return `<button type="button" class="foe-pile" data-action="foe-deck" aria-label="${esc(enemy.name)}の山札 ${count}枚"><div class="pile-card back discard${count > 1 ? " stack" : ""}"><span class="pile-count">${count}</span></div><div class="pile-label">敵の山札</div></button>`;
    }

    function foeDeckOverlay() {
      if (!showFoeDeck || outcome || askLeave) return "";
      return `<div class="overlay deck-view"><div class="panel"><h2>${esc(enemy.name)}の山札</h2><p class="album-meta">敵は毎ターン、この中から1枚ずつ使う。順番は切り混ぜ。</p><div class="deck-scroll"><section class="deck-group"><h3>${sourcePattern().length}枚</h3>${foeDeckCards()}</section></div><button type="button" data-action="close-foe-deck">閉じる</button></div></div>`;
    }

    function bindFoePeek() {
      const pile = root.querySelector(".foe-pile");
      const peek = root.querySelector(".foe-peek");
      if (!pile || !peek) return;
      pile.addEventListener("pointerenter", () => { peek.hidden = false; });
      pile.addEventListener("pointerleave", () => { peek.hidden = true; });
    }

    const PATHS = {
      straight: { name: "戦闘", text: "次の戦いに進む。", image: "path-fight.jpg?v=3" },
      skip: { name: "走り抜ける", text: "階層を1つ飛ばして、ゴールに近づく。", image: "path-dash.jpg?v=4" },
      detour: { name: "回り道", text: "カードと装備の報酬。戦闘が1回増える。" },
      shop: { name: "お店", text: "★で買い物。カード2つと装備2つ。", image: "path-shop.jpg?v=4" },
      camp: { name: "キャンプ", text: "体力が全快する。あとはまっすぐ進むと同じ。" },
      search: { name: "探索", text: "カード、装備、アイテムのどれか。半分で戦闘。", image: "path-search.jpg?v=4" },
      unknown: { name: "未知との遭遇", text: "左の2つ以外の出来事が起きる。戦闘もある。", image: "path-unknown.jpg?v=3" },
    };
    // 道の候補。左の2つはここから引き、右は常に「未知との遭遇」
    const PATH_POOL = ["straight", "shop", "search"];
    // 未知との遭遇で起きうる出来事。見えている2つは除く
    const UNKNOWN_POOL = ["straight", "shop", "search", "camp"];

    function starsForRank(rank) {
      if (rank === "強敵") return 3;
      if (rank === "普通") return 2;
      return 1;
    }

    function keepCard(card) {
      const next = { name: card.name, cost: card.cost, text: card.text, damage: card.damage, block: card.block };
      if (card.kind) next.kind = card.kind;
      if (card.focus) next.focus = card.focus;
      if (card.parry) next.parry = true;
      if (card.poison) next.poison = Number(card.poison) || 1;
      if (card.press) next.press = true;
      if (card.power) next.power = true;
      if (card.rage) next.rage = true;
      if (card.expose) next.expose = card.expose;
      if (card.fullBonus) next.fullBonus = card.fullBonus;
      if (card.safeBonus) next.safeBonus = card.safeBonus;
      if (card.kick) next.kick = card.kick;
      if (card.headbutt) next.headbutt = true;
      if (card.poise) next.poise = true;
      if (card.guardBreak) next.guardBreak = true;
      if (card.fullOnly) next.fullOnly = true;
      if (card.finisher) next.finisher = true;
      if (card.coward) next.coward = true;
      if (card.note) next.note = card.note;
      if (card.hits) next.hits = card.hits;
      if (card.nextDraw) next.nextDraw = card.nextDraw;
      if (card.redTimes) next.redTimes = card.redTimes;
      if (card.counter) next.counter = card.counter;
      if (card.heal) next.heal = card.heal;
      if (card.instant) next.instant = true;
      if (card.quick) next.quick = true;
      if (card.draw) next.draw = card.draw;
      if (card.crit) { next.crit = card.crit; next.critChance = card.critChance; }
      if (card.halfOnly) next.halfOnly = true;
      if (card.burn) next.burn = card.burn;
      if (card.burnFirst) next.burnFirst = true;
      next.stars = card.stars || 1;
      return next;
    }

    function playerCopy(card) {
      // 敵のカードに「+」の概念は無い。アタック／ブロックは奪うと自分の基本版になる。旧名アタック+等は互換だけ。
      let name = String(card.name || "");
      if (name === "アタック+" || name === "ブロック+") name = name.slice(0, -1);
      if (name === "アタック" || name === "ブロック") {
        return { ...keepCard({ name, ...CARDS[name], stars: 1 }), source: "敵" };
      }
      return { ...keepCard({ ...card, name, stars: 1 }), source: "敵" };
    }

    function classCards() {
      if (job !== "戦士" && job !== "パラディン") return [];
      return Object.keys(WARRIOR).map((name) => ({ ...keepCard({ name, ...WARRIOR[name], stars: 1 }), source: "戦士" }));
    }

    function rewardPool() {
      const list = Object.keys(COMMON).map((name) => ({ ...keepCard({ name, ...COMMON[name], stars: COMMON[name].stars || 1 }), source: "共通" }));
      list.push(...classCards());
      const seen = new Set();
      for (const card of enemyNow().pattern) {
        const reward = playerCopy(card);
        if (seen.has(reward.name)) continue;
        seen.add(reward.name);
        list.push(reward);
      }
      return list;
    }

    function drawDistinct(n) {
      return shuffle(rewardPool()).slice(0, n);
    }

    // ふだんの3枚は、共通・クラス専用・敵のカードの3プールから1枚ずつ。足りないプールは全体から補う。
    function rewardTrio() {
      const all = rewardPool();
      const pools = ["共通", "戦士", "敵"].map((source) => shuffle(all.filter((card) => card.source === source)));
      const picks = [];
      const seen = new Set();
      for (const pool of pools) {
        const card = pool.find((item) => !seen.has(item.name));
        if (card) { picks.push(card); seen.add(card.name); }
      }
      for (const card of shuffle(all)) {
        if (picks.length >= 3) break;
        if (!seen.has(card.name)) { picks.push(card); seen.add(card.name); }
      }
      return shuffle(picks);
    }

    function clearReward() {
      rewardReady = false;
      rewardStars = 0;
      pendingStars = 0;
      rewardPicks = [];
      rewardPaths = [];
      rewardStep = "cards";
      bonusCard = null;
    }

    function rollPaths() {
      return shuffle(PATH_POOL.slice()).slice(0, 2).concat(["unknown"]);
    }

    function unknownOutcomes() {
      const seen = new Set(rewardPaths);
      const rest = UNKNOWN_POOL.filter((id) => !seen.has(id));
      return rest.length ? rest : UNKNOWN_POOL.slice();
    }

    function isBossFight() {
      return bossNow();
    }

    function bossChoices() {
      const foe = enemyNow();
      const card = shuffle(foe.pattern.map((item) => playerCopy(item)))[0] || null;
      const item = shuffle(GEAR_ITEMS)[0] || null;
      const bracelet = BOSS_GEAR.find((entry) => entry.id === "minotaur-bracelet") || null;
      const picks = [];
      if (card) picks.push({ kind: "card", card });
      if (item) picks.push({ kind: "gear", gear: item });
      if (bracelet) picks.push({ kind: "gear", gear: bracelet });
      return picks;
    }

    // お店の値段はレアリティ（★の数）と同じ。★が決まっていない品は値段も未定で、買えない。
    function shopPrice(slot) {
      if (!slot) return null;
      if (slot.kind === "card" && slot.card) return Number(slot.card.stars) || 1;
      if (slot.kind === "gear" && slot.gear) return Number(slot.gear.stars) > 0 ? Number(slot.gear.stars) : null;
      return null;
    }

    function rollShopStock() {
      const cards = shuffle(classCards()).slice(0, 2).map((card) => ({ kind: "card", card }));
      const items = shuffle(GEAR_ITEMS).slice(0, 2).map((item) => ({ kind: "gear", gear: item }));
      const limited = shuffle(SHOP_GEAR).slice(0, 2).map((item) => ({ kind: "gear", gear: item, limited: true }));
      return cards.concat(items, limited).map((slot) => ({ ...slot, price: shopPrice(slot), sold: false }));
    }

    function buyShop(index) {
      const slot = (shopStock || [])[index];
      if (!slot || slot.sold) return;
      const price = slot.price == null ? shopPrice(slot) : slot.price;
      if (price == null) return;
      const have = Number(meta.stars) || 0;
      if (have < price) return;
      meta.stars = have - price;
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      if (slot.kind === "card") {
        stolen.push(keepCard(slot.card));
      } else if (slot.kind === "gear") {
        if (!gear || !gear.sword) gear = starterGear();
        if (offerWeapon(slot.gear, { source: "shop", shopIndex: index, price })) {
          persistSave(true);
          render();
          return;
        }
        giveGear(slot.gear);
      }
      slot.sold = true;
      persistSave(true);
      render();
    }

    function prepareReward() {
      if (rewardReady) return;
      rewardReady = true;
      const foe = enemyNow();
      const medal = bossNow() && foe.medal ? gearItem(foe.medal) : null;
      // ボスも道中と同じく★をもらう（メダルは追加でもらえる）
      rewardStars = foe.tier || starsForRank(foe.rank);
      starBurst = rewardStars;
      pendingStars = rewardStars;
      meta.stars = (Number(meta.stars) || 0) + rewardStars;
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      rewardPaths = [];
      bonusCard = null;
      bossPicks = [];
      shopStock = [];
      if (medal) {
        giveGear(medal);
        log(`${heroName()}は${medal.name}を手に入れた。`);
        rewardPicks = [];
        bossPicks = bossChoices();
        rewardStep = "boss";
        return;
      }
      rewardPicks = rewardTrio();
      rewardStep = "cards";
    }

    function takeBossPick(index) {
      if (rewardStep !== "boss") return;
      const pick = bossPicks[index];
      if (!pick) return;
      if (pick.kind === "card" && pick.card) stolen.push(keepCard(pick.card));
      if (pick.kind === "gear" && pick.gear) {
        if (!gear || !gear.sword) gear = starterGear();
        if (offerWeapon(pick.gear, { source: "boss" })) {
          persistSave(true);
          render();
          return;
        }
        giveGear(pick.gear);
      }
      bossPicks = [];
      rewardPaths = rollPaths();
      rewardStep = "paths";
      persistSave(true);
      render();
    }

    // 報酬を選んだあと、もらった★がステータスの★へ飛んで吸い込まれ、届くたびに数が増える
    function starStartPoints() {
      const burst = [...document.querySelectorAll(".fly-star")].map((el) => el.getBoundingClientRect());
      if (burst.length) return burst.map((r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 }));
      const el = document.querySelector(".victory-count") || document.querySelector(".overlay .panel");
      const r = el ? el.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 3, width: 0, height: 0 };
      return [{ x: r.left + r.width / 2, y: r.top + r.height / 2 }];
    }

    function starHomePoint() {
      const el = root.querySelector(".status-stars");
      if (!el) return { x: 48, y: window.innerHeight - 150 };
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function bumpStarCount() {
      root.querySelectorAll("[data-star-count]").forEach((el) => {
        el.textContent = `★${shownStarCount()}`;
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
      });
    }

    function flyStarsHome(points) {
      const n = pendingStars;
      if (!n) return;
      if (!("animate" in Element.prototype)) { pendingStars = 0; bumpStarCount(); return; }
      const layer = document.createElement("div");
      layer.className = "star-home-layer";
      layer.setAttribute("aria-hidden", "true");
      document.body.appendChild(layer);
      let left = n;
      for (let i = 0; i < n; i++) {
        const from = points[Math.min(i, points.length - 1)];
        const to = starHomePoint();
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const el = document.createElement("span");
        el.className = "home-star";
        el.textContent = "★";
        el.style.left = `${from.x}px`;
        el.style.top = `${from.y}px`;
        layer.appendChild(el);
        const anim = el.animate([
          { transform: "translate(-50%, -50%) scale(1) rotate(0deg)", opacity: 1, offset: 0 },
          { transform: `translate(calc(-50% + ${dx * 0.45}px), calc(-50% + ${dy * 0.45 - 90}px)) scale(0.95) rotate(200deg)`, opacity: 1, offset: 0.5 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.3) rotate(420deg)`, opacity: 0.95, offset: 1 },
        ], { duration: 860, delay: 180 + i * 150, easing: "cubic-bezier(0.32, 0.08, 0.2, 1)", fill: "forwards" });
        anim.onfinish = () => {
          el.remove();
          pendingStars = Math.max(0, pendingStars - 1);
          bumpStarCount();
          left -= 1;
          if (left <= 0) layer.remove();
        };
      }
    }

    function skipReward() {
      if (rewardStep === "cards" || rewardStep === "boss") {
        const from = starStartPoints();
        bossPicks = [];
        rewardPaths = rollPaths();
        rewardStep = "paths";
        persistSave(true);
        render();
        flyStarsHome(from);
        return;
      }
      if (rewardStep === "detour") {
        bonusCard = null;
        render();
      }
    }

    function openShop() {
      shopStock = rollShopStock();
      rewardStep = "shop";
      persistSave(true);
      render();
    }

    function shopMarkup(stock, heading) {
      const have = Number(meta.stars) || 0;
      const slots = (stock || []).map((slot, index) => {
        const price = slot.price == null ? shopPrice(slot) : slot.price;
        const tag = price == null ? "値段は未定" : `★${price}`;
        let action = "";
        if (slot.sold) action = `<span class="shop-sold">売り切れ</span>`;
        else if (price == null) action = `<button type="button" class="shop-buy" disabled>買えない</button>`;
        else action = `<button type="button" class="shop-buy" data-action="shop-buy" data-slot="${index}" ${have < price ? "disabled" : ""}>買う</button>`;
        const sold = slot.sold ? " sold" : "";
        const limited = slot.limited ? " limited" : "";
        const ribbon = slot.limited ? `<i class="shop-ribbon">ショップ限定</i>` : "";
        if (slot.kind === "card" && slot.card) {
          return `<div class="shop-slot${sold}${limited}">${ribbon}<div class="card preview ${cardKind(slot.card)}">${cardFace(slot.card)}</div><b>${esc(slot.card.name)}</b><span>${esc(tag)}</span>${action}</div>`;
        }
        if (slot.kind === "gear" && slot.gear) {
          const picture = slot.gear.image ? `<img class="shop-gear" src="${esc(slot.gear.image)}" alt="">` : "";
          return `<div class="shop-slot${sold}${limited}">${ribbon}${picture}<b>${esc(slot.gear.name)}</b><small>${esc(slot.gear.effect || "")}</small><span>${esc(tag)}</span>${action}</div>`;
        }
        return "";
      }).join("");
      return `<img class="shop-art" src="shop-merchant.jpg?v=1" alt="怪しげな商人がこちらを見て笑っている"><h2>${esc(heading || "お店")}</h2><p>所持 ★${have}</p><p>品は6つ。カード2つ、装備2つ、ショップ限定の武器2つ。値段はレアリティと同じ（★の数）。</p><div class="shop-row">${slots}</div>`;
    }

    function takeBonus() {
      if (rewardStep !== "detour" || !bonusCard) return;
      stolen.push(keepCard(bonusCard));
      bonusCard = null;
      persistSave(true);
      render();
    }
    function takeReward(index) {
      if (rewardStep !== "cards") return;
      const card = rewardPicks[index];
      if (!card) return;
      const from = starStartPoints();
      stolen.push(keepCard(card));
      rewardPaths = rollPaths();
      rewardStep = "paths";
      persistSave(true);
      render();
      flyStarsHome(from);
    }

    function advance(step) {
      if (screen === "floor" && floorKind === "物乞いに遭遇" && step > 0 && route[battleIndex + 1] !== "物乞い") {
        route.splice(battleIndex + 1, 0, "物乞い");
        battleTotal = route.length;
      }
      const hp = screen === "floor" ? floorHp : (player ? player.hp : floorHp);
      const next = battleIndex + step;
      outcome = null;
      if (next >= battleTotal) {
        clearReward();
        cleared = true;
        endRun(true);
        screen = "title";
        render();
        return;
      }
      battleIndex = next;
      enterNode(hp);
    }

    function applyPath(id) {
      if (rewardStep === "done" || rewardStep === "cards") return;
      rewardStep = "done";
      if (id === "camp") restoreHp(player.maxHp - player.hp);
      advance(id === "skip" ? 2 : 1);
    }

    function takePath(id) {
      if (rewardStep !== "paths" || !PATHS[id]) return;
      if (id === "search") {
        pathEventTitle = "探索";
        if (Math.random() < 0.5) {
          addDetourFight();
          applyPath("straight");
          return;
        }
        floorNote = grantExplore();
        rewardStep = "event";
        persistSave(true);
        render();
        return;
      }
      if (id === "unknown") {
        // 見えている2つ以外の出来事から1つ。戦闘は襲撃（戦闘が1回増える）
        const roll = shuffle(unknownOutcomes())[0];
        pathEventTitle = "未知との遭遇";
        if (roll === "straight") {
          addDetourFight();
          applyPath("straight");
          return;
        }
        if (roll === "shop") {
          openShop();
          return;
        }
        if (roll === "camp") {
          restoreHp(player.maxHp - player.hp);
          floorGift = null;
          floorNote = "未知は、キャンプだった。体力が全快した。";
          rewardStep = "event";
          persistSave(true);
          render();
          return;
        }
        if (Math.random() < 0.5) {
          addDetourFight();
          applyPath("straight");
          return;
        }
        floorNote = `未知は、探索だった。${grantExplore()}`;
        rewardStep = "event";
        persistSave(true);
        render();
        return;
      }
      if (id === "shop") {
        openShop();
        return;
      }
      if (id === "detour") {
        addDetourFight();
        const extra = drawDistinct(1)[0] || null;
        bonusCard = extra;
        rewardStep = "detour";
        persistSave(true);
        render();
        return;
      }
      applyPath(id);
    }

    function offerTone(card) {
      return card && card.source === "敵" ? "foe" : cardKind(card);
    }

    function victoryStars() {
      const count = starBurst;
      if (!count) return "";
      starBurst = 0;
      const stars = Array.from({ length: count }, (_, i) => `<span class="fly-star" style="--i:${i};--n:${count}">★</span>`).join("");
      return `<div class="victory-flash" aria-hidden="true"></div><div class="star-burst" aria-label="星${count}">${stars}</div>`;
    }

    function victoryStage() {
      const pose = heroItem().victory;
      const foe = enemy && enemy.image ? `<img class="win-foe" src="${esc(enemy.image)}" alt="">` : "";
      const rain = Array.from({ length: 18 }, (_, i) => `<i style="left:${6 + (i * 5.2) % 92}%;animation-delay:${(i % 9) * 0.12}s;animation-duration:${1.5 + (i % 5) * 0.18}s"></i>`).join("");
      return `<div class="win-stage" aria-hidden="true"><p class="win-banner">勝利</p><i class="win-rays"></i><div class="win-rain">${rain}</div><i class="win-spark s1"></i><i class="win-spark s2"></i><i class="win-spark s3"></i><i class="win-spark s4"></i><i class="win-spark s5"></i><i class="win-spark s6"></i><img class="win-pose" src="${esc(pose)}" alt="">${foe}</div>`;
    }

    function rewardOverlay() {
      if (outcome !== "win") return "";
      if (rewardStep === "cards") {
        const picks = rewardPicks.map((card, i) => `<button type="button" class="reward-pick" data-action="reward-card" data-reward="${i}"><div class="card preview ${offerTone(card)}">${cardFace(card)}</div></button>`).join("");
        return `<div class="overlay victory finale">${victoryStars()}${victoryStage()}<div class="panel wide reward-panel"><h2>勝利</h2><p class="victory-count">★${rewardStars}もらった。所持 <span data-star-count>★${shownStarCount()}</span></p><p class="reward-lead">あなたはカードを入手することができる。</p><div class="reward-row">${picks}</div><button type="button" data-action="reward-skip">スキップ</button></div></div>`;
      }
      if (rewardStep === "boss") {
        const medal = gear.medal ? `${giftMarkup({ kind: "gear", gear: gear.medal }, true)}<p class="victory-count">${esc(gear.medal.name)}を手に入れた。</p>` : "";
        const picks = bossPicks.map((pick, i) => {
          if (pick.kind === "card" && pick.card) {
            return `<button type="button" class="reward-pick" data-action="reward-boss" data-reward="${i}"><div class="card preview ${offerTone(pick.card)}">${cardFace(pick.card)}</div></button>`;
          }
          const item = pick.gear || {};
          const picture = item.image ? `<img class="shop-gear" src="${esc(item.image)}" alt="">` : "";
          return `<button type="button" class="reward-pick gear-pick" data-action="reward-boss" data-reward="${i}">${picture}<b>${esc(item.name || "")}</b><small>${esc(item.effect || "")}</small></button>`;
        }).join("");
        return `<div class="overlay victory finale">${victoryStars()}${victoryStage()}<div class="panel wide reward-panel"><h2>勝利</h2><p class="victory-count">★${rewardStars}もらった。所持 <span data-star-count>★${shownStarCount()}</span></p>${medal}<p>ボスの報酬。1つだけ選ぶ。</p><div class="reward-row">${picks}</div><button type="button" data-action="reward-skip">スキップ</button></div></div>`;
      }
      if (rewardStep === "paths") {
        const buttons = rewardPaths.map((id) => {
          const path = PATHS[id];
          const picture = path.image ? `<img src="${path.image}" alt="">` : "";
          return `<button type="button" class="path-${id}" data-action="reward-path" data-path="${id}">${picture}<b>${esc(path.name)}</b><span>${esc(path.text)}</span></button>`;
        }).join("");
        return `<div class="overlay paths"><div class="panel wide"><h2>道を選ぶ</h2><p>所持 <span data-star-count>★${shownStarCount()}</span></p><div class="path-list">${buttons}</div></div></div>`;
      }
      if (rewardStep === "shop") {
        return `<div class="overlay"><div class="panel wide shop-panel">${shopMarkup(shopStock)}<button type="button" data-action="reward-go">出ていく</button></div></div>`;
      }
      if (rewardStep === "event") {
        return `<div class="overlay"><div class="panel"><h2>${esc(pathEventTitle)}</h2>${giftMarkup(floorGift, true)}<p>${esc(floorNote)}</p><button type="button" data-action="reward-go">進む</button></div></div>`;
      }
      const bonus = bonusCard
        ? `<button type="button" class="reward-pick" data-action="reward-bonus"><div class="card preview ${offerTone(bonusCard)}">${cardFace(bonusCard)}</div></button><button type="button" data-action="reward-skip">スキップ</button>`
        : "";
      return `<div class="overlay"><div class="panel"><h2>回り道</h2><p>戦闘が1回増えた。</p>${bonus}<p>装備の報酬は、装備が来てから。</p><button type="button" data-action="reward-go">進む</button></div></div>`;
    }

    function sortHand() {
      const rank = (card) => {
        const kind = cardKind(card);
        if (kind === "attack") return 0;
        if (kind === "block") return 1;
        if (kind === "skill") return 2;
        if (kind === "power") return 3;
        return 4;
      };
      // 手札の並び：コストの小さい順 → 色分け（攻撃・防御・技・パワー）→ 名前
      hand.sort((a, b) => a.cost - b.cost || rank(a) - rank(b) || String(a.name).localeCompare(b.name, "ja"));
    }

    function renderBattle() {
      sortHand();
      const dealNow = fxDeal;
      const cards = hand.map((card, i) => {
        const poor = !cardPlayable(card);
        const mid = (hand.length - 1) / 2;
        const dist = i - mid;
        const t = mid === 0 ? 0 : dist / mid;
        // 完全な扇：端ほど大きく傾ける。中央はマナ列へ上がり、端は下へ垂らす
        const fan = Math.round(t * 28 * 10) / 10;
        const drop = Math.round((-30 + 78 * t * t) * 10) / 10;
        const label = `${card.cost} ${card.name} ${String(card.text).replace(/\n/g, " ")}`;
        return `<button type="button" class="card ${cardKind(card)}${poor ? " unaffordable" : ""}${dealNow ? " deal" : ""}" data-card="${i}" aria-label="${esc(label)}" style="--fan:${fan}deg;--drop:${drop}px;--deal:${i};z-index:${i + 1}" ${phase !== "player" ? "disabled" : ""}>${cardFace(card, true)}</button>`;
      }).join("");
      const overlay = rewardOverlay();
      const leaveOverlay = askLeave
        ? `<div class="overlay"><div class="panel">
            <h2>タイトルに戻る？</h2>
            <p>終わっていない戦いは残らない。</p>
            <button type="button" data-action="title">タイトルへ戻る</button>
            <button type="button" class="ghost" data-action="stay">戦いを続ける</button>
          </div></div>`
        : "";

      const slashNow = fxSlash;
      const slashesNow = fxSlashes;
      const foeHitsNow = fxFoeHits;
      const hurtNow = fxHurt;
      const fatalNow = fxFatal || fatalHold;
      const guardNow = fxGuard;
      const healNow = fxHeal;
      const hitNow = fxHit;
      const hitPow = hitNow ? hitPower(hitNow.n) : "0.35";
      const HIT_GAP = 0.34;
      const cutsHtml = slashesNow.map((dir, i) => {
        const pow = foeHitsNow[i] != null ? hitPower(foeHitsNow[i]) : (hitNow && hitNow.side === "enemy" ? hitPow : "0.35");
        return `<span class="cut dir-${dir}" style="--pow:${pow};--delay:${(i * HIT_GAP).toFixed(2)}s"><i class="trail"></i><i class="blade"></i><i class="burst"></i><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></span>`;
      }).join("");
      const foePopsHtml = foeHitsNow.map((n, i) => {
        const shift = (i - (foeHitsNow.length - 1) / 2) * 64;
        return `<b class="dmg-pop foe-hit" style="--delay:${(i * HIT_GAP + 0.08).toFixed(2)}s;--shift:${shift}px;--pow:${hitPower(n)}">${n}</b>`;
      }).join("");
      fxSlash = false;
      fxSlashes = [];
      fxFoeHits = [];
      fxHurt = false;
      fxFatal = false;
      fxGuard = "";
      fxHeal = false;
      fxHit = null;
      fxDeal = false;
      const noManaNow = fxNoMana;
      fxNoMana = false;
      const turnNow = turnCall;
      turnCall = "";
      const logHtml = logLinesHtml(logLines);
      const enemyShown = Math.round(shownEnemy());
      const playerShown = Math.round(shownPlayer());
      root.innerHTML = `
        <div class="battle-screen${showLog ? "" : " no-log"}${noManaNow ? " no-mana" : ""}${fatalNow ? " fatal" : ""}">
        ${healNow ? `<div class="screen-heal" aria-hidden="true"></div>` : ""}
        <aside class="gear-rail"><h2>装備</h2>${gearMarkup()}${gearEffectText()}<div class="party-stack"><div class="status-stars" data-star-count aria-label="スター ${shownStarCount()}">★${shownStarCount()}</div><div class="party-attrs" aria-label="ステータス"><div class="attr hp"><span class="mark">${heartIcon()}</span><span>HP</span><b>${player.maxHp}</b></div><div class="attr atk"><span class="mark">${swordIcon()}</span><span>ATK</span><b>${signed(player.atk)}</b></div><div class="attr def"><span class="mark">${shieldIcon()}</span><span>DEF</span><b>${signed(player.def)}</b></div>${player.expose ? `<div class="attr"><span class="mark">+</span><span>被ダメ</span><b>+${player.expose}</b></div>` : ""}${player.guardThrough ? `<div class="attr"><span class="mark"></span><span>構え</span><b>盾可</b></div>` : ""}<div class="attr spd"><span class="mark">${bootIcon()}</span><span>SPD</span><b>${hand.length}</b></div></div></div></aside>
        <div class="game">
          <header class="hud-top">
            <div class="dungeon">
              <h1 class="dungeon-name">${esc(dungeonName)}</h1>
              <div class="dungeon-progress">${floorLabel()}</div>
            </div>
            <div class="hud-actions">
              <button type="button" class="small-btn" data-action="deck">デッキ確認</button>
              <button type="button" class="small-btn" data-action="settings">オプション</button>
              <button type="button" class="small-btn" data-action="ask-title" ${phase === "player" ? "" : "disabled"}>タイトル</button>
            </div>
          </header>
          <div class="battle-bands" style="--dungeon-art: url('${dungeonArt(dungeonName)}')">
          <div class="stage">
            <div class="enemy-field">
            ${traitNote()}
            <div class="enemy-main${encounter ? " arrive" : ""}${fatalNow ? " fatal" : ""}" data-size="${foeSize()}">
            <div class="foe-body">
            <div class="sprite${slashNow ? " slash" : ""}" aria-hidden="true" style="--hits:${Math.max(1, slashesNow.length)}">
              <img src="${esc(enemy.image || "enemy-slime.png?v=4")}" alt="">
              ${slashNow ? cutsHtml : ""}
            </div>
            ${hitNow && hitNow.side === "enemy" ? foePopsHtml : ""}
            </div>
            ${plateMarkup("foe-plate", "enemy", enemy.name, bossNow() ? "ボス" : "", shownEnemy(), enemy.maxHp, enemy.block, { attrs: ` data-rank="${esc(enemyNow().rank || "普通")}"`, badges: statusChips(enemy) })}
            ${foePileMarkup()}
            </div>
            <div class="foe-peek" hidden><h3>${esc(enemy.name)}の山札</h3>${foeDeckCards()}</div>
            ${note ? `<p class="field-note${noManaNow ? " warn" : ""}">${esc(note)}</p>` : ""}
            ${heroShoulder(plateMarkup("hero-plate", "player", heroName(), "", playerShown, player.maxHp, player.block, { badges: statusChips(player) }), Boolean(hurtNow && hitNow && hitNow.side === "player"), hitPow, guardNow, fatalNow)}
            ${encounter || turnNow || fatalNow || (hitNow && (hitNow.side === "enemy" || hurtNow)) ? `<div class="stage-fx">${encounter ? `<div class="turn-call enemy encounter-call" aria-hidden="true"><b>敵が現れた</b></div>` : ""}${turnNow ? `<div class="turn-call ${turnNow}" aria-hidden="true"><b>${turnNow === "player" ? "自分のターン" : "敵のターン"}</b></div>` : ""}${fatalNow ? `<div class="fatal-call" aria-hidden="true">止め</div>` : ""}${hurtNow && hitNow && hitNow.side === "player" ? `<b class="dmg-pop me${fatalNow ? " fatal" : ""}" style="--pow:${hitPow}">${hitNow.n}</b>` : ""}</div>` : ""}
            </div>
          </div>
          ${playRow()}
          </div>
          <div class="energy-band" aria-label="マナ ${player.energy}"><div class="mana-slot">${pips()}</div></div>
          <div class="handbar">
              ${pileMarkup("deck", deck.length)}
              ${pileMarkup("discard", discard.length)}
              <div class="hand">${cards}</div>
            </div>
          </div>
        </div>
        ${showLog ? `<aside class="battle-log"><h2>ログ</h2>${logHtml}</aside>` : ""}
        </div>
        ${deckOverlay()}
        ${foeDeckOverlay()}
        ${overlay}
        ${leaveOverlay}`;
      player.hit = false;
      enemy.hit = false;
      persistLive();
      kickHp();
      bindLogPeek();
      bindFoePeek();
      bindGearHover();
      fitHand();
      requestAnimationFrame(fitHand);
      launchPendingPlayClearFly();
    }

    // 手札は大きいまま扇状。枚数が多いときは重なりを深くする。上下のはみ出しは切らない。
    function fitHand() {
      const handEl = root.querySelector(".hand");
      if (!handEl) return;
      const cards = handEl.querySelectorAll(".card");
      const base = 44 * 0.74;
      handEl.style.setProperty("--hand-card-h", "100%");
      const setHang = () => {
        const h = cards[0] ? cards[0].offsetHeight : 0;
        handEl.style.setProperty("--hand-hang", `${Math.max(24, Math.round(h / 6))}px`);
      };
      if (cards.length < 2) {
        handEl.style.setProperty("--overlap", `${base}px`);
        setHang();
        return;
      }
      const n = cards.length;
      const first = cards[0];
      const ratio = first.offsetWidth / Math.max(1, first.offsetHeight);
      const fullH = first.offsetHeight;
      const avail = handEl.clientWidth - 16;
      const minStep = 40;
      // 全枚数が最低 minStep ずつ見える幅に収まる最大のカード幅。足りなければ高さを 60% まで縮める。
      let cw = first.offsetWidth;
      const fitW = avail - (n - 1) * minStep;
      if (fitW < cw) {
        const h = Math.max(fullH * 0.6, fitW / ratio);
        handEl.style.setProperty("--hand-card-h", `${Math.round(h)}px`);
        cw = Math.round(h * ratio);
      }
      const need = (n * cw - avail) / (n - 1);
      const overlap = Math.min(Math.max(base, need), cw - minStep);
      handEl.style.setProperty("--overlap", `${Math.round(overlap * 10) / 10}px`);
      setHang();
    }
    window.addEventListener("resize", () => { if (screen === "battle") fitHand(); });

    // 注釈（パリィ・毒・炎上など）はカードの中ではなく、カードの外の吹き出しに出す。
    // カードに乗ると、そのカードの注釈をまとめてカードの上（入らなければ下）に出す。札（毒+2 など）に乗ると、その札の上に出す。
    const kwTip = document.createElement("div");
    kwTip.className = "kw-tip";
    kwTip.hidden = true;
    document.body.appendChild(kwTip);
    let kwTipAnchor = null;

    function hideKwTip() {
      kwTipAnchor = null;
      kwTip.hidden = true;
    }

    function placeKwTip(anchor) {
      const r = anchor.getBoundingClientRect();
      const w = kwTip.offsetWidth;
      const h = kwTip.offsetHeight;
      const pad = 8;
      let left = r.left + r.width / 2 - w / 2;
      left = Math.max(pad, Math.min(window.innerWidth - w - pad, left));
      let top = r.top - h - 12;
      let below = false;
      if (top < pad) { top = r.bottom + 12; below = true; }
      if (top + h > window.innerHeight - pad) top = Math.max(pad, window.innerHeight - h - pad);
      kwTip.style.left = `${Math.round(left)}px`;
      kwTip.style.top = `${Math.round(top)}px`;
      const arrowX = r.left + r.width / 2 - left;
      kwTip.style.setProperty("--arrow-x", `${Math.round(Math.max(14, Math.min(w - 14, arrowX)))}px`);
      kwTip.classList.toggle("below", below);
    }

    function showKwTip(anchor) {
      const hints = anchor.matches(".hint") ? [anchor] : [...anchor.querySelectorAll(".hint")];
      const items = hints.map((hint) => {
        const note = hint.querySelector("i");
        const word = hint.dataset.word || [...hint.childNodes].filter((node) => node.nodeType === Node.TEXT_NODE).map((node) => node.textContent).join("").trim();
        return note && note.textContent ? `<p><b>${esc(word)}</b><span>${esc(note.textContent)}</span></p>` : "";
      }).filter(Boolean);
      if (!items.length) { hideKwTip(); return; }
      kwTipAnchor = anchor;
      kwTip.innerHTML = items.join("");
      kwTip.hidden = false;
      placeKwTip(anchor);
      // 手札は乗ると少し持ち上がるので、動き終わりに合わせて置き直す
      [120, 280].forEach((ms) => setTimeout(() => {
        if (kwTipAnchor === anchor && anchor.isConnected && !kwTip.hidden) placeKwTip(anchor);
      }, ms));
    }

    function kwAnchorOf(target) {
      const el = target instanceof Element ? target : target && target.parentElement;
      if (!el) return null;
      const card = el.closest(".card");
      if (card && card.querySelector(".hint")) return card;
      return el.closest(".hint");
    }

    root.addEventListener("pointerover", (event) => {
      const anchor = kwAnchorOf(event.target);
      if (!anchor) { if (kwTipAnchor) hideKwTip(); return; }
      if (anchor !== kwTipAnchor) showKwTip(anchor);
    });
    root.addEventListener("pointerout", (event) => {
      if (!kwTipAnchor) return;
      const next = kwAnchorOf(event.relatedTarget);
      if (next !== kwTipAnchor) hideKwTip();
    });
    root.addEventListener("pointermove", (event) => {
      if (!kwTipAnchor || kwTipAnchor.isConnected) return;
      const anchor = kwAnchorOf(event.target);
      if (anchor) showKwTip(anchor); else hideKwTip();
    });
    root.addEventListener("pointerdown", hideKwTip, true);
    window.addEventListener("scroll", hideKwTip, true);

    // ダブルクリックは「選んで進む」。キャラの駒はダンジョン選択へ、ダンジョンの駒は挑戦開始。
    root.addEventListener("dblclick", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      const action = el.closest("[data-action]");
      if (!action) return;
      const name = action.dataset.action;
      if (name === "cast-token") {
        castLock = action.dataset.cast || castLock;
        dungeonHover = "";
        dungeonLock = "";
        screen = "dungeon";
        render();
      }
      if (name === "dungeon-token") {
        dungeonLock = action.dataset.dungeon || dungeonLock;
        const chosen = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock) || DUNGEON_LIST[0];
        if (chosen && dungeonOpen(chosen.floors)) beginRun(chosen.floors, chosen.name);
        else paintDungeon();
      }
    });

    root.addEventListener("click", (event) => {
      const el = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!el) return;
      const action = el.closest("[data-action]");
      if (action) {
        const name = action.dataset.action;
        if (name === "title") goTitle();
        if (name === "ask-title") { askLeave = true; showDeck = false; render(); }
        if (name === "deck") { showDeck = true; render(); }
        if (name === "close-deck") { showDeck = false; render(); }
        if (name === "foe-deck") { showFoeDeck = true; render(); }
        if (name === "close-foe-deck") { showFoeDeck = false; render(); }
        if (name === "stay") { askLeave = false; render(); }
        if (name === "settings") { returnScreen = screen; screen = "settings"; render(); }
        if (name === "back") { screen = returnScreen; render(); }
        if (name === "toggle-log") { showLog = !showLog; persistSettings(); render(); }
        if (name === "toggle-auto-end") { autoEndTurn = !autoEndTurn; persistSettings(); render(); }
        if (name === "album") { albumZoom = ""; screen = "album"; render(); }
        if (name === "close-art-zoom") { albumZoom = ""; render(); }
        if (name === "sheet") { screen = "sheet"; render(); }
        if (name === "character") { castHover = ""; castLock = "戦士"; screen = "character"; render(); }
        if (name === "cast-token") {
          castLock = action.dataset.cast || castLock;
          castHover = "";
          paintCast();
        }
        if (name === "cast-pick") { castPicked = true; render(); }
        if (name === "cast-back") { castPicked = false; render(); }
        if (name === "character-next") { dungeonHover = ""; dungeonLock = ""; screen = "dungeon"; render(); }
        if (name === "cast-stay") { screen = "character"; render(); }
        if (name === "dungeon-list") { screen = "dungeon"; render(); }
        if (name === "dungeon-token") {
          dungeonLock = action.dataset.dungeon || "";
          dungeonHover = "";
          pendingDungeon = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock) || DUNGEON_LIST[0];
          paintDungeon();
        }
        if (name === "dungeon-start") {
          pendingDungeon = DUNGEON_LIST.find((dungeon) => dungeon.name === action.dataset.dungeon) || DUNGEON_LIST[0];
          if (!dungeonOpen(pendingDungeon.floors)) {
            paintDungeon();
            return;
          }
          screen = "dungeon-gate";
          render();
        }
        if (name === "dungeon-enter") {
          const chosen = DUNGEON_LIST.find((dungeon) => dungeon.name === dungeonLock) || pendingDungeon;
          if (chosen && dungeonOpen(chosen.floors)) beginRun(chosen.floors, chosen.name);
        }
        if (name === "floor-next") advance(1);
        if (name === "bless-pick") takeBless(Number(action.dataset.bless));
        if (name === "beggar-drop") dropBeggar(Number(action.dataset.index));
        if (name === "job-pick") {
          const nextJob = action.dataset.job || "戦士";
          job = nextJob;
          if (!jobsHad.includes(nextJob)) jobsHad.push(nextJob);
          floorPhase = "ultimate";
          ultimatePicks = rollUltimates(nextJob);
          floorNote = `${nextJob}になった。カードは残っている。奥義を1つ選ぶ。`;
          render();
        }
        if (name === "ultimate-pick") {
          ultimate = ultimateLabel(action.dataset.ultimate || "");
          floorPhase = "show";
          floorNote = ultimate === "パリィが重複する"
            ? "奥義はパリィが重複する。パリィは重なる。"
            : `奥義は${ultimate}。効果の名前は、まだ無い。`;
          render();
        }
        if (name === "new") {
          if (readSave()) { screen = "confirm"; render(); }
          else { castPicked = false; screen = "character"; render(); }
        }
        if (name === "new-force") { localStorage.removeItem(SAVE_KEY); clearLive(); castPicked = false; screen = "character"; render(); }
        if (name === "continue") continueGame();
        if (name === "reward-card") takeReward(Number(action.dataset.reward));
        if (name === "reward-boss") takeBossPick(Number(action.dataset.reward));
        if (name === "reward-bonus") takeBonus();
        if (name === "reward-skip") skipReward();
        if (name === "reward-path") takePath(action.dataset.path || "");
        if (name === "reward-go") applyPath("straight");
        if (name === "shop-buy") buyShop(Number(action.dataset.slot));
        if (name === "gear-offer-yes") acceptGearOffer();
        if (name === "gear-offer-no") declineGearOffer();
        return;
      }
      const albumBtn = el.closest("[data-album]");
      if (albumBtn && screen === "album") {
        albumTab = albumBtn.dataset.album || "all";
        albumZoom = "";
        render();
        return;
      }
      const zoomCard = el.closest("[data-art-zoom]");
      if (zoomCard && screen === "album") {
        const name = zoomCard.dataset.artZoom || "";
        albumZoom = albumZoom === name ? "" : name;
        render();
        return;
      }
      if (screen !== "battle") return;
      const useBtn = el.closest("[data-use-item]");
      if (useBtn) {
        useItem(useBtn.dataset.useItem);
        return;
      }
      const gearBtn = el.closest("[data-gear]");
      if (gearBtn) {
        const id = gearBtn.dataset.gear;
        gearOpen = gearOpen === id ? null : id;
        gearHover = id;
        paintGear();
        return;
      }
      const recall = el.closest("[data-unplay]");
      if (recall) {
        unplayFromPlay(Number(recall.dataset.unplay));
        return;
      }
      const card = el.closest("[data-card]");
      if (card) playFromHand(Number(card.dataset.card));
      if (el.closest("[data-end]")) endTurn();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && screen === "album" && albumZoom) {
        albumZoom = "";
        render();
        return;
      }
      if (screen !== "battle" || askLeave) return;
      if (showDeck || showFoeDeck) {
        if (event.key === "Escape") { showDeck = false; showFoeDeck = false; render(); }
        return;
      }
      if (event.key === "Enter") endTurn();
      if (/^[1-9]$/.test(event.key) || event.key === "0") {
        playFromHand(event.key === "0" ? 9 : Number(event.key) - 1);
      }
    });

    loadSettings();
    loadMeta();
    if (!resumeLive()) render();
  </script>
</body>
</html>
